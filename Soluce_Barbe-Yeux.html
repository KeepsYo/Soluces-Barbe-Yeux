u-contremaitre-du-port", "texte": "Chapter 1 In search of glory and riches Main quest Talk to the harbor foreman. Go to the harbor (south-east of Crab Island). Barbe-Yeux tells him about the Bolon Tiku: the foreman mentions a sealed temple in the jungle . Monkey Island is unlocked on the map.", "sol": 0}, {"titre": "Go to Monkey Island.", "html": "<p>Board the boat and choose <strong>Coastal jungle</strong> (Monkey Island) on the map.</p>", "id": "c1-se-rendre-sur-l-ile-aux-singes", "texte": "Chapter 1 In search of glory and riches Main quest Go to Monkey Island. Board the boat and choose Coastal jungle (Monkey Island) on the map.", "sol": 0}, {"titre": "Gather information about the temple.", "html": "<ol><li>From the landing beach (south-west), the river blocks your way east. The first time, you have to go up to the <strong>north-east</strong> and do the <strong>river descent</strong> (see <em>Mini-games</em>): it drops you off in the south-east of the island. After that, the adventuress shows you a <strong>shortcut</strong> across the river (see <em>Find the backpack</em>), and you never need to replay the mini-game.</li><li>The <strong>torch seller</strong> stands in front of the temple, in the east of the island.</li><li>Listen to his (very long) catalogue: he sends you to <strong>Apple Island</strong>, his home island. It is unlocked on the map.</li><li><strong>Buy a torch now or later</strong>: you will need one to enter the temple (“you'll need a torch”). The cheapest is the <strong>Beginner's torch (10 gold coins)</strong>.</li></ol><aside class=\"note\"><p>To gather 10 coins on Monkey Island: the pirates in the grassy areas to the west drop 1 to 5 coins half of the time; the river descent also earns gold (see Mini-games). Watch out for the <strong>thieving monkeys</strong> in the centre and north: each touch steals 1 coin (see <em>Don't miss</em>).</p></aside>", "id": "c1-recueillir-des-informations-sur-le-temple", "texte": "Chapter 1 In search of glory and riches Main quest Gather information about the temple. From the landing beach (south-west), the river blocks your way east. The first time, you have to go up to the north-east and do the river descent (see Mini-games ): it drops you off in the south-east of the island. After that, the adventuress shows you a shortcut across the river (see Find the backpack ), and you never need to replay the mini-game. The torch seller stands in front of the temple, in the east of the island. Listen to his (very long) catalogue: he sends you to Apple Island , his home island. It is unlocked on the map. Buy a torch now or later : you will need one to enter the temple (“you'll need a torch”). The cheapest is the Beginner's torch (10 gold coins) . To gather 10 coins on Monkey Island: the pirates in the grassy areas to the west drop 1 to 5 coins half of the time; the river descent also earns gold (see Mini-games). Watch out for the thieving monkeys in the centre and north: each touch steals 1 coin (see Don't miss ).", "sol": 0}, {"titre": "Go to Apple Island. / Find information related to the temple.", "html": "<ol><li>Sail to <strong>Apple Island</strong>.</li><li>While crossing the village square, you get caught in the <strong>compote festival</strong>: a ring of villagers and musicians surrounds you for the whole song (about 2 minutes 10). You can't do anything; wait until it ends.</li><li>Go into the <strong>compote seller</strong>'s house (north of the square). He tells you about a cave guarded by a terrible monster, behind his shop.</li><li>Choose <strong>“Take the back door”</strong>.</li></ol><aside class=\"note\"><p>On later visits, the festival starts again when you enter the square; a choice then appears: <strong>“Ask for marmalade”</strong> stops it dead, <strong>“Enjoy the show”</strong> starts it again.</p></aside>", "id": "c1-se-rendre-sur-l-ile-aux-pommes-trouver-des-informations-liee", "texte": "Chapter 1 In search of glory and riches Main quest Go to Apple Island. / Find information related to the temple. Sail to Apple Island . While crossing the village square, you get caught in the compote festival : a ring of villagers and musicians surrounds you for the whole song (about 2 minutes 10). You can't do anything; wait until it ends. Go into the compote seller 's house (north of the square). He tells you about a cave guarded by a terrible monster, behind his shop. Choose “Take the back door” . On later visits, the festival starts again when you enter the square; a choice then appears: “Ask for marmalade” stops it dead, “Enjoy the show” starts it again.", "sol": 0}, {"titre": "Defeat the cave monster.", "html": "<p>Enter the cave to the north, behind the shop. The “terrible monster” is… the King of Crabs, back and “evolved”. He has only 10 HP. He drops the <strong>Strange key</strong>.</p>", "id": "c1-vaincre-le-monstre-de-la-grotte", "texte": "Chapter 1 In search of glory and riches Main quest Defeat the cave monster. Enter the cave to the north, behind the shop. The “terrible monster” is… the King of Crabs, back and “evolved”. He has only 10 HP. He drops the Strange key .", "sol": 0}, {"titre": "Solve the temple's riddle using the key.", "html": "<ol><li>Go back to Monkey Island, to the <strong>south-east</strong>, near the temple (below the torch seller). Three <strong>musical tiles</strong> lie on the ground; each plays a note when you step on it:<ul><li><strong>tile 1</strong>: the one furthest south-east (bottom-right corner);</li><li><strong>tile 2</strong>: left (west) of tile 1;</li><li><strong>tile 3</strong>: above (north of) the other two.</li></ul></li><li>Hint: use the <strong>Strange key</strong> from the inventory; it is a flute-key that plays a tune.</li><li>Step on the tiles in the right order, <strong>with the Strange key in your inventory</strong>. A mistake plays a failure sound and resets the sequence.</li></ol><p><strong>Solution:</strong> tile <strong>1 → 2 → 1 → 3</strong>.</p><ol><li>The temple door sinks into the ground (about 13 seconds). The Strange key is used up.</li></ol>", "id": "c1-resoudre-l-enigme-du-temple-a-l-aide-de-la-cle", "texte": "Chapter 1 In search of glory and riches Main quest Solve the temple's riddle using the key. Go back to Monkey Island, to the south-east , near the temple (below the torch seller). Three musical tiles lie on the ground; each plays a note when you step on it: tile 1 : the one furthest south-east (bottom-right corner); tile 2 : left (west) of tile 1; tile 3 : above (north of) the other two. Hint: use the Strange key from the inventory; it is a flute-key that plays a tune. Step on the tiles in the right order, with the Strange key in your inventory . A mistake plays a failure sound and resets the sequence. Solution: tile 1 → 2 → 1 → 3 . The temple door sinks into the ground (about 13 seconds). The Strange key is used up.", "sol": 1}, {"titre": "Explore the temple.", "html": "<ol><li><strong>You need an equipped torch</strong> to enter (buy one from the seller right next door if needed, then light it with <strong>T</strong>).</li><li>In the first room, three groups of <strong>undead</strong> attack you as you cross (mandatory fights).</li><li><strong>The old man of the cave</strong> blocks your way with a riddle (“What walks on four legs in the morning…”). The riddle has no answer: <strong>every choice ends with him letting you through</strong> (threaten him then give up, flatter him, or “Trap him with logic”).</li><li><strong>Chests in the first room</strong> (free to open): 5 coins + 2 beers, and 15 coins + 5 beers + 3 rums.</li><li>Take the passage at the top of the room to the second room: one last group of undead (5 coins), and a chest with <strong>5 coins + Silver scissors</strong> (+10 attack, equip them!).</li><li>At the far end of the second room, walk towards the boss.</li></ol>", "id": "c1-explorer-le-temple", "texte": "Chapter 1 In search of glory and riches Main quest Explore the temple. You need an equipped torch to enter (buy one from the seller right next door if needed, then light it with T ). In the first room, three groups of undead attack you as you cross (mandatory fights). The old man of the cave blocks your way with a riddle (“What walks on four legs in the morning…”). The riddle has no answer: every choice ends with him letting you through (threaten him then give up, flatter him, or “Trap him with logic”). Chests in the first room (free to open): 5 coins + 2 beers, and 15 coins + 5 beers + 3 rums. Take the passage at the top of the room to the second room: one last group of undead (5 coins), and a chest with 5 coins + Silver scissors (+10 attack, equip them!). At the far end of the second room, walk towards the boss.", "sol": 0}, {"titre": "Defeat the Herald of Xibalba.", "html": "<p><strong>Boss:</strong> Herald of Xibalba (1000 HP, 40 attack). When he drops <strong>below half his HP</strong>, he summons <strong>3 Spirits of Xibalba</strong> (200 HP each). Save your energy for this phase: <strong>Scissor throw</strong> (area attack) is ideal against the spirits, then finish the Herald off with <strong>Scissor strike</strong>.</p><p>Reward: <strong>2000 XP</strong> and the <strong>1st Bolon Tiku gem</strong>. A <strong>chest</strong> then appears in the room: <strong>15 coins + 3 beers + 2 rums</strong>.</p>", "id": "c1-vaincre-le-heraut-de-xibalba", "texte": "Chapter 1 In search of glory and riches Main quest Defeat the Herald of Xibalba. Boss: Herald of Xibalba (1000 HP, 40 attack). When he drops below half his HP , he summons 3 Spirits of Xibalba (200 HP each). Save your energy for this phase: Scissor throw (area attack) is ideal against the spirits, then finish the Herald off with Scissor strike . Reward: 2000 XP and the 1st Bolon Tiku gem . A chest then appears in the room: 15 coins + 3 beers + 2 rums .", "sol": 0}, {"titre": "Return to the crab island tavern.", "html": "<ol><li>As you leave the temple, <strong>Nadaillac Deux Rouges</strong> is waiting and demands your stone. A fight starts: <strong>it cannot be won</strong>. The Two Numpties run away and Nadaillac shoots you down. It's scripted, don't worry.</li><li>You wake up in the <strong>Monkey Island tavern</strong>, <strong>without the gem or the medallion</strong>.</li><li>Take the boat back to the <strong>Crab Island tavern</strong>. Entering the tavern starts the end of the chapter.</li></ol><h5>Final fight: the Nightmarish Torch</h5><p>Barbe-Yeux has a nightmare and faces a giant torch alone. Rules:</p><ul><li>You have <strong>a fixed 100 HP</strong>, and damage is fixed: <strong>Attack 95, Scissor strike 125, Scissor throw 80</strong> on the torch (55 / 100 / 50 on the small torches).</li><li>The fight is <strong>timed, in 4 phases</strong>: bring the torch down to 1500 HP in 20 s, then to 1000 HP in 20 s, then below 500 HP in 25 s despite <strong>10 small torches</strong>, then break it in 25 s and <strong>put out its last 5 torches</strong>.</li><li><strong>Don't dawdle</strong>: if you do nothing for 5 seconds, the torch bites you.</li><li><strong>Solution: manage your energy.</strong> You only have <strong>100 energy</strong>, and it does not refill during the fight. Scissor throw costs <strong>20</strong>, Scissor strike <strong>15</strong>.<ol><li><strong>Phases 1 and 2</strong>: <strong>normal attacks only</strong> on the big torch (they're free).</li><li><strong>As soon as small torches appear</strong> (two waves): <strong>Scissor throw</strong>. It hits everyone, and two throws put out a whole wave (100 HP each, 50 damage per throw). So you need <strong>4</strong> in total, i.e. 80 energy.</li><li><strong>Phase 4</strong>: you have just enough left for <strong>a single Scissor strike</strong> on the big torch. It isn't mandatory, but it helps you beat the clock.</li></ol></li><li>If you fail, the nightmare starts over. <strong>After 3 failures</strong>, a choice appears:<ul><li><strong>“Facing your demons”</strong>: you start again normally;</li><li><strong>“Facing your demons but I'm too useless”</strong>: assisted mode (<strong>+20 HP</strong> and <strong>+5 s</strong> per phase);</li><li><strong>“Wake up”</strong>: <strong>skips the fight</strong>; the chapter ends the same way.</li></ul></li></ul><p>Then comes a sad scene by the water (wait, it ends… in its own way), followed by the <strong>“End of Chapter 1”</strong> credits and the <strong>“All's well that starts badly”</strong> achievement.</p>", "id": "c1-retourner-a-la-taverne-de-l-ile-au-crabe", "texte": "Chapter 1 In search of glory and riches Main quest Return to the crab island tavern. As you leave the temple, Nadaillac Deux Rouges is waiting and demands your stone. A fight starts: it cannot be won . The Two Numpties run away and Nadaillac shoots you down. It's scripted, don't worry. You wake up in the Monkey Island tavern , without the gem or the medallion . Take the boat back to the Crab Island tavern . Entering the tavern starts the end of the chapter. Final fight: the Nightmarish Torch Barbe-Yeux has a nightmare and faces a giant torch alone. Rules: You have a fixed 100 HP , and damage is fixed: Attack 95, Scissor strike 125, Scissor throw 80 on the torch (55 / 100 / 50 on the small torches). The fight is timed, in 4 phases : bring the torch down to 1500 HP in 20 s, then to 1000 HP in 20 s, then below 500 HP in 25 s despite 10 small torches , then break it in 25 s and put out its last 5 torches . Don't dawdle : if you do nothing for 5 seconds, the torch bites you. Solution: manage your energy. You only have 100 energy , and it does not refill during the fight. Scissor throw costs 20 , Scissor strike 15 . Phases 1 and 2 : normal attacks only on the big torch (they're free). As soon as small torches appear (two waves): Scissor throw . It hits everyone, and two throws put out a whole wave (100 HP each, 50 damage per throw). So you need 4 in total, i.e. 80 energy. Phase 4 : you have just enough left for a single Scissor strike on the big torch. It isn't mandatory, but it helps you beat the clock. If you fail, the nightmare starts over. After 3 failures , a choice appears: “Facing your demons” : you start again normally; “Facing your demons but I'm too useless” : assisted mode ( +20 HP and +5 s per phase); “Wake up” : skips the fight ; the chapter ends the same way. Then comes a sad scene by the water (wait, it ends… in its own way), followed by the “End of Chapter 1” credits and the “All's well that starts badly” achievement.", "sol": 1}, {"titre": "After the credits: fishing", "html": "<p>The demo goes on for a little while after the credits, on Crab Island:</p><ol><li><strong>New objective: talk to the old fisherman</strong> (his hut in the centre-east of the island, east of the shipyard). Choose <strong>“I'd like you to teach me how to fish.”</strong> He puts you through three tests:<ul><li><strong>Patience</strong>: choices appear (“What am I supposed to do?”…). <strong>Don't press anything for 15 seconds.</strong> Clicking a choice fails the test (you then have to talk to him again).</li><li><strong>Perseverance</strong>: same thing, <strong>don't touch anything for 15 seconds</strong> (if you fail, the test starts over).</li><li><strong>The right moment</strong>: a single choice, “Now?”. <strong>Wait at least 10 seconds</strong> before clicking (too early = start again).</li><li>Reward: <strong>fishing is unlocked</strong>.</li></ul></li><li><strong>New objective: follow the call of the open sea.</strong> Go to coordinates <strong>X:8 Y:49</strong> on Crab Island (an on-screen marker guides you; being one square off is fine). The “Coordinates reached” message completes the objective.</li><li><strong>That's the end of the demo!</strong> You can keep exploring, fishing and finishing the side quests.</li></ol>", "id": "c1-apres-le-generique-la-peche", "texte": "Chapter 1 In search of glory and riches Main quest After the credits: fishing The demo goes on for a little while after the credits, on Crab Island: New objective: talk to the old fisherman (his hut in the centre-east of the island, east of the shipyard). Choose “I'd like you to teach me how to fish.” He puts you through three tests: Patience : choices appear (“What am I supposed to do?”…). Don't press anything for 15 seconds. Clicking a choice fails the test (you then have to talk to him again). Perseverance : same thing, don't touch anything for 15 seconds (if you fail, the test starts over). The right moment : a single choice, “Now?”. Wait at least 10 seconds before clicking (too early = start again). Reward: fishing is unlocked . New objective: follow the call of the open sea. Go to coordinates X:8 Y:49 on Crab Island (an on-screen marker guides you; being one square off is fine). The “Coordinates reached” message completes the objective. That's the end of the demo! You can keep exploring, fishing and finishing the side quests.", "sol": 0}]}, {"titre": "Side quests", "intro": "", "entrees": [{"titre": "Relight the lamps.", "html": "<ul><li><strong>Trigger:</strong> the widow sitting in front of three unlit lamps, on the <strong>south beach</strong> of Crab Island. Accept (“Yes” on the choice screen). If you refuse, you can accept later by talking to her again.</li><li><strong>Items to gather:</strong><ol><li><strong>Oil</strong>: at the tavern, choose <strong>“Ask for oil for the widow.”</strong>, then answer <strong>“No. It's for the lady on the beach.”</strong> (answering “Yes”, i.e. it's for you, gives you nothing).</li><li><strong>Flint and stone</strong>: talk to the <strong>fisherman</strong> (centre-east of the island) once the quest is accepted; he hands it over automatically.</li><li><strong>Dry wick</strong>: pick it up from the ground in the <strong>north</strong> of the island (a little east of the cave). You can pick it up even before accepting the quest.</li></ol></li><li><strong>Hand-in:</strong> go back to the widow with the three items. The lamps light up again and a fireside gathering begins (you can come back and sit at it later).</li><li><strong>Reward:</strong> <strong>200 XP</strong>.</li></ul>", "id": "c1-rallumer-les-lampes", "texte": "Chapter 1 In search of glory and riches Side quests Relight the lamps. Trigger: the widow sitting in front of three unlit lamps, on the south beach of Crab Island. Accept (“Yes” on the choice screen). If you refuse, you can accept later by talking to her again. Items to gather: Oil : at the tavern, choose “Ask for oil for the widow.” , then answer “No. It's for the lady on the beach.” (answering “Yes”, i.e. it's for you, gives you nothing). Flint and stone : talk to the fisherman (centre-east of the island) once the quest is accepted; he hands it over automatically. Dry wick : pick it up from the ground in the north of the island (a little east of the cave). You can pick it up even before accepting the quest. Hand-in: go back to the widow with the three items. The lamps light up again and a fireside gathering begins (you can come back and sit at it later). Reward: 200 XP .", "sol": 0}, {"titre": "The treasure of the fire-haired pirate.", "html": "<ul><li><strong>Trigger:</strong> on your very first arrival on Morro-Blanco, the red-haired pirate calls you over and the game walks you to him: the quest is <strong>accepted automatically</strong>.</li><li><strong>Steps:</strong><ol><li>Follow the coast <strong>east</strong> from the landing point: a group of <strong>4 pirates</strong> guards a chest (mandatory fight when you walk into their camp).</li><li>Open the <strong>chest</strong>: <strong>10 gold coins</strong> (that's the whole “treasure”…).</li><li>Go back to the red-haired pirate: all that's left is an apology <strong>note</strong>. Read it.</li></ol></li><li><strong>Reward:</strong> <strong>350 XP</strong> + the 10 coins from the chest.</li></ul>", "id": "c1-le-tresor-du-pirate-a-la-chevelure-de-feu", "texte": "Chapter 1 In search of glory and riches Side quests The treasure of the fire-haired pirate. Trigger: on your very first arrival on Morro-Blanco, the red-haired pirate calls you over and the game walks you to him: the quest is accepted automatically . Steps: Follow the coast east from the landing point: a group of 4 pirates guards a chest (mandatory fight when you walk into their camp). Open the chest : 10 gold coins (that's the whole “treasure”…). Go back to the red-haired pirate: all that's left is an apology note . Read it. Reward: 350 XP + the 10 coins from the chest.", "sol": 0}, {"titre": "Find the backpack on Monkey Island.", "html": "<ul><li><strong>Trigger:</strong> the <strong>adventuress</strong> in the south of Monkey Island, a little east of the tavern (“Please, help me!”). Accept or refuse: either way, she then leads you to a <strong>shortcut</strong> across the river, which stays open from then on.</li><li><strong>Steps:</strong><ol><li>Go to the far <strong>north-east</strong> of the island: a group of monkeys attacks you (mandatory fight: <strong>1 gorilla + 7 thieving monkeys</strong>). The gorilla runs away during the fight.</li><li>Victory: you get the <strong>Backpack</strong> back and the gorilla drops an <strong>Eye-shaped stone</strong> (essential for the next quest).</li><li>Bring the backpack back to the adventuress.</li></ol></li><li><strong>Reward:</strong> <strong>500 XP</strong>.</li></ul><aside class=\"note\"><p>The north-east fight happens even if you haven't accepted the quest: you still get the backpack and the stone.</p></aside>", "id": "c1-retrouver-le-sac-a-dos-sur-l-ile-aux-singes", "texte": "Chapter 1 In search of glory and riches Side quests Find the backpack on Monkey Island. Trigger: the adventuress in the south of Monkey Island, a little east of the tavern (“Please, help me!”). Accept or refuse: either way, she then leads you to a shortcut across the river, which stays open from then on. Steps: Go to the far north-east of the island: a group of monkeys attacks you (mandatory fight: 1 gorilla + 7 thieving monkeys ). The gorilla runs away during the fight. Victory: you get the Backpack back and the gorilla drops an Eye-shaped stone (essential for the next quest). Bring the backpack back to the adventuress. Reward: 500 XP . The north-east fight happens even if you haven't accepted the quest: you still get the backpack and the stone.", "sol": 0}, {"titre": "Calm the wildlife of Monkey Island.", "html": "<ul><li><strong>Trigger:</strong> in the <strong>north-west</strong> of Monkey Island stand <strong>three totems</strong> (blue, red, green) and a <strong>gorilla statue</strong> blocking the entrance to an arena. The quest is added to your journal when you enter the arena.</li><li><strong>Totem puzzle:</strong> interact with a totem to turn it a quarter turn; each new direction makes a different “BOOM”. In some areas of the island you hear the same “BOOM”s: they are the clues to the right directions.</li></ul><p><strong>Solution:</strong> <strong>blue</strong> totem <strong>facing West</strong>, <strong>red</strong> totem <strong>facing South</strong>, <strong>green</strong> totem <strong>facing East</strong>. From the starting position (blue South, red East, green North), just interact <strong>3 times with each of the three totems</strong>.</p><ul><li>Then interact with the <strong>gorilla statue</strong> while carrying the <strong>Eye-shaped stone</strong> (from the backpack quest). The statue slides aside and opens the arena.<ul><li>Totems pointing the wrong way: “No, that can't be it....”</li><li>No stone: “Something's missing; it looks like an eye is missing...”</li></ul></li><li><strong>Mini-boss: Angry gorilla</strong> (500 HP). Below <strong>50% of his HP</strong>, he flies into a rage and hits much harder (attack 50 → 80): keep some healing (beers) for the second half.</li><li><strong>Reward:</strong> <strong>1000 XP</strong> (+1500 XP from the fight). The island's monkeys calm down and stop stealing your gold.</li></ul>", "id": "c1-calmer-la-faune-de-l-ile-aux-singes", "texte": "Chapter 1 In search of glory and riches Side quests Calm the wildlife of Monkey Island. Trigger: in the north-west of Monkey Island stand three totems (blue, red, green) and a gorilla statue blocking the entrance to an arena. The quest is added to your journal when you enter the arena. Totem puzzle: interact with a totem to turn it a quarter turn; each new direction makes a different “BOOM”. In some areas of the island you hear the same “BOOM”s: they are the clues to the right directions. Solution: blue totem facing West , red totem facing South , green totem facing East . From the starting position (blue South, red East, green North), just interact 3 times with each of the three totems . Then interact with the gorilla statue while carrying the Eye-shaped stone (from the backpack quest). The statue slides aside and opens the arena. Totems pointing the wrong way: “No, that can't be it....” No stone: “Something's missing; it looks like an eye is missing...” Mini-boss: Angry gorilla (500 HP). Below 50% of his HP , he flies into a rage and hits much harder (attack 50 → 80): keep some healing (beers) for the second half. Reward: 1000 XP (+1500 XP from the fight). The island's monkeys calm down and stop stealing your gold.", "sol": 1}]}, {"titre": "Mini-games", "intro": "", "entrees": [{"titre": "The Lying Eye (Crab Island tavern dice)", "html": "<ul><li><strong>Where:</strong> Crab Island tavern, “Play dice.”.</li><li><strong>Rules (a Liar's Dice variant):</strong> 4 players (you, Pipette the Pocket, Nina No-Luck, Cristobald the Indecisive), 3 to 5 dice each under a cup. On your turn, announce a number of dice and a value (“at least 4 dice show a 5”). To raise, increase the quantity at the same value, or keep the quantity and raise the value. <strong>“Eyes” (the 1s) are wild.</strong> Shouting <strong>“Liar!”</strong> reveals the dice: if the bid holds, the accuser loses a die; otherwise the bidder does. The last player with dice wins.</li><li><strong>Maximum bet here:</strong> 10 coins (3 dice), 15 (4 dice), 20 (5 dice).</li><li><strong>Winnings:</strong> 1st = <strong>3 times your bet</strong>, 2nd = bet refunded, 3rd = 60% of your bet, 4th = nothing.</li><li><strong>Tip:</strong> for a value from 2 to 6, expect on average <strong>a third</strong> of the dice in play (that value + the wilds), and only a sixth for “eyes”. Above that, shout “Liar!”.</li><li>Note: during the Morro arc, the innkeeper won't let you bet below 10 coins (you owe him for the room).</li></ul>", "id": "c1-l-il-menteur-des-de-la-taverne-de-l-ile-au-crabe", "texte": "Chapter 1 In search of glory and riches Mini-games The Lying Eye (Crab Island tavern dice) Where: Crab Island tavern, “Play dice.”. Rules (a Liar's Dice variant): 4 players (you, Pipette the Pocket, Nina No-Luck, Cristobald the Indecisive), 3 to 5 dice each under a cup. On your turn, announce a number of dice and a value (“at least 4 dice show a 5”). To raise, increase the quantity at the same value, or keep the quantity and raise the value. “Eyes” (the 1s) are wild. Shouting “Liar!” reveals the dice: if the bid holds, the accuser loses a die; otherwise the bidder does. The last player with dice wins. Maximum bet here: 10 coins (3 dice), 15 (4 dice), 20 (5 dice). Winnings: 1st = 3 times your bet , 2nd = bet refunded, 3rd = 60% of your bet, 4th = nothing. Tip: for a value from 2 to 6, expect on average a third of the dice in play (that value + the wilds), and only a sixth for “eyes”. Above that, shout “Liar!”. Note: during the Morro arc, the innkeeper won't let you bet below 10 coins (you owe him for the room).", "sol": 0}, {"titre": "River descent (Monkey Island)", "html": "<ul><li><strong>Where:</strong> in the <strong>north-east</strong> of Monkey Island, on the riverbank. It brings you out in the south-east of the island. Mandatory the first time to reach the east bank; afterwards, the shortcut shown by the adventuress lets you skip it.</li><li><strong>Rules:</strong> survive <strong>60 seconds</strong> in the boat. Arrow keys or <strong>A / D</strong> to steer, <strong>Space</strong> for a sharp swerve (0.85 s cooldown). The boat has <strong>4 hit points</strong>; logs, barrels and rocks each take one away (1 s of invulnerability after each hit). Three phases: Calm waters, Rapids (at 20 s), Final stretch (at 45 s).</li><li><strong>Bonuses:</strong> each <strong>coin</strong> picked up = <strong>+1 gold coin</strong> (kept only if you succeed); every 5 coins, +1 HP; healing items restore 1 HP.</li><li><strong>If you keep failing:</strong> after <strong>3 shipwrecks</strong>, the <strong>“Go down with your eyes closed”</strong> option takes you to the bottom without playing (but with no gold).</li></ul>", "id": "c1-descente-de-la-riviere-ile-aux-singes", "texte": "Chapter 1 In search of glory and riches Mini-games River descent (Monkey Island) Where: in the north-east of Monkey Island, on the riverbank. It brings you out in the south-east of the island. Mandatory the first time to reach the east bank; afterwards, the shortcut shown by the adventuress lets you skip it. Rules: survive 60 seconds in the boat. Arrow keys or A / D to steer, Space for a sharp swerve (0.85 s cooldown). The boat has 4 hit points ; logs, barrels and rocks each take one away (1 s of invulnerability after each hit). Three phases: Calm waters, Rapids (at 20 s), Final stretch (at 45 s). Bonuses: each coin picked up = +1 gold coin (kept only if you succeed); every 5 coins, +1 HP; healing items restore 1 HP. If you keep failing: after 3 shipwrecks , the “Go down with your eyes closed” option takes you to the bottom without playing (but with no gold).", "sol": 0}, {"titre": "Fishing (after the credits)", "html": "<ul><li><strong>Where:</strong> the jetty on the <strong>west</strong> of Crab Island, once you've passed the fisherman's training. Press <strong>F</strong> to cast.</li><li><strong>Rules:</strong> wait for the exclamation mark (between 1 and 15 s), then repeat the arrow combination shown within <strong>2 seconds</strong>.<ul><li><strong>Silver bass:</strong> ↑ ↓ ← →</li><li><strong>Flatfish:</strong> → → ← ←</li><li><strong>Mackerel:</strong> ← ← → →</li></ul></li><li>One time in 80, a <strong>monkey</strong> pops up with a random combination and takes a fish (or some gold) as tax.</li><li><strong>What to do with your fish (at the fisherman's):</strong> silver bass → <strong>Fine fish fillets</strong> (healing in battle), flatfish → <strong>Throwing fish</strong> for the Two Numpties, mackerel → <strong>1 gold coin</strong> each. The harbor foreman also buys silver bass (3 coins) and flatfish (2 coins).</li></ul>", "id": "c1-peche-apres-le-generique", "texte": "Chapter 1 In search of glory and riches Mini-games Fishing (after the credits) Where: the jetty on the west of Crab Island, once you've passed the fisherman's training. Press F to cast. Rules: wait for the exclamation mark (between 1 and 15 s), then repeat the arrow combination shown within 2 seconds . Silver bass: ↑ ↓ ← → Flatfish: → → ← ← Mackerel: ← ← → → One time in 80, a monkey pops up with a random combination and takes a fish (or some gold) as tax. What to do with your fish (at the fisherman's): silver bass → Fine fish fillets (healing in battle), flatfish → Throwing fish for the Two Numpties, mackerel → 1 gold coin each. The harbor foreman also buys silver bass (3 coins) and flatfish (2 coins).", "sol": 0}, {"titre": "Tavern tutorial fight", "html": "<p>Mandatory (see main quest). This fight is the tutorial: follow the on-screen instructions.</p>", "id": "c1-combat-tutoriel-de-la-taverne", "texte": "Chapter 1 In search of glory and riches Mini-games Tavern tutorial fight Mandatory (see main quest). This fight is the tutorial: follow the on-screen instructions.", "sol": 0}]}, {"titre": "Don't miss", "intro": "", "entrees": [{"titre": "Don't miss", "html": "<p><strong>Items and treasures</strong></p><ul><li><strong>Silver scissors</strong> (+10 attack): chest in the second room of the Monkey Island temple. Equip them before the Herald.</li><li><strong>Herald's chest</strong> (15 coins + 3 beers + 2 rums): only appears after you beat the boss, in his room.</li><li><strong>Morro-Blanco</strong>: hole with 2 coins near the barrel-shaped rock (north-east), ruined hut (1 beer + 1 rum).</li><li><strong>The shipyard drunk</strong>: after <strong>10 beers given in total</strong> (at any point in the game), he hands you <strong>100 gold coins</strong> in one go (once only). A beer costs 2 coins: a net profit of 80 coins.</li><li><strong>Eye-shaped stone</strong>: obtained from the north-east monkey fight; it is the only key to the gorilla's arena.</li></ul><p><strong>Gold stolen by the monkeys (Monkey Island)</strong> Until the Angry gorilla is defeated, monkeys pop up in the central and northern areas and steal <strong>1 gold coin per touch</strong>. To get it all back: go to the <strong>bananas</strong> area in the <strong>east</strong> of the island (centre-east) and beat the <strong>5 monkeys</strong> waiting there: you get back exactly what was stolen. The journal's “Hint” button reminds you (“Look for the bananas!”).</p><p><strong>Nothing in this chapter is permanently missable</strong>: Crab Island, Morro-Blanco, Monkey Island, the temple and Apple Island remain accessible later. Only the torch sample (underground) and the navigation tools (compass, graphometer) disappear, and that is part of the story.</p><p><strong>The beggar (Crab Island)</strong>: every time you land on Crab Island from the map, a beggar comes to ask you for a coin. Donations give you nothing, except the <strong>“A heart of gold”</strong> achievement at 151 coins donated in total (donations count across your whole playthrough).</p><p><strong>Achievements linked to this chapter</strong></p><ul><li><strong>All's well that starts badly</strong>: finish chapter 1.</li><li><strong>Jack of all trades</strong>: the 4 side quests of this chapter (lamps, red-haired pirate, backpack, Monkey Island wildlife) count towards it.</li><li><strong>Not like I can read anyway</strong>: the Morro-Blanco Ship's log is the first of the 4 logs to find.</li><li><strong>GET LOST</strong> (500 seagulls): the seagulls on Crab Island's southern beaches fly off when you walk through them.</li><li><strong>An enlightened man</strong>: buy every torch. The Monkey Island seller is the first torch merchant.</li><li><strong>A heart of gold</strong>: see the beggar above.</li></ul>", "id": "c1-a-ne-pas-rater", "texte": "Chapter 1 In search of glory and riches Don't miss Don't miss Items and treasures Silver scissors (+10 attack): chest in the second room of the Monkey Island temple. Equip them before the Herald. Herald's chest (15 coins + 3 beers + 2 rums): only appears after you beat the boss, in his room. Morro-Blanco : hole with 2 coins near the barrel-shaped rock (north-east), ruined hut (1 beer + 1 rum). The shipyard drunk : after 10 beers given in total (at any point in the game), he hands you 100 gold coins in one go (once only). A beer costs 2 coins: a net profit of 80 coins. Eye-shaped stone : obtained from the north-east monkey fight; it is the only key to the gorilla's arena. Gold stolen by the monkeys (Monkey Island) Until the Angry gorilla is defeated, monkeys pop up in the central and northern areas and steal 1 gold coin per touch . To get it all back: go to the bananas area in the east of the island (centre-east) and beat the 5 monkeys waiting there: you get back exactly what was stolen. The journal's “Hint” button reminds you (“Look for the bananas!”). Nothing in this chapter is permanently missable : Crab Island, Morro-Blanco, Monkey Island, the temple and Apple Island remain accessible later. Only the torch sample (underground) and the navigation tools (compass, graphometer) disappear, and that is part of the story. The beggar (Crab Island) : every time you land on Crab Island from the map, a beggar comes to ask you for a coin. Donations give you nothing, except the “A heart of gold” achievement at 151 coins donated in total (donations count across your whole playthrough). Achievements linked to this chapter All's well that starts badly : finish chapter 1. Jack of all trades : the 4 side quests of this chapter (lamps, red-haired pirate, backpack, Monkey Island wildlife) count towards it. Not like I can read anyway : the Morro-Blanco Ship's log is the first of the 4 logs to find. GET LOST (500 seagulls): the seagulls on Crab Island's southern beaches fly off when you walk through them. An enlightened man : buy every torch. The Monkey Island seller is the first torch merchant. A heart of gold : see the beggar above.", "sol": 0}]}]}]};
const CONFIG = {"base": "", "titre": {"fr": "Soluce Barbe-Yeux : la démo", "en": "Barbe-Yeux walkthrough: the demo"}, "marque": {"fr": "Soluce Barbe-Yeux", "en": "Barbe-Yeux walkthrough"}, "sous_titre": {"fr": "Démo : quêtes, énigmes et mini-jeux", "en": "Demo: quests, puzzles and mini-games"}};
const BASE = CONFIG.base || "";
const CLE = "soluce-barbe-yeux-toutes";
const CLE_LANGUE = "soluce-barbe-yeux-langue";
const LANGUES = Object.keys(DATA);
const TXT = {
  fr: {
    recherche: "Chercher une quête, un lieu, une énigme…", toutes: "Afficher toutes les solutions", sommaire: "Sommaire",
    copier: "Copier le lien", copie: "Lien copié", selection: "Sélectionné : Ctrl+C", solution: "Afficher la solution",
    contient: "contient ta recherche", vide: "Aucune fiche ne correspond. Essaie un autre mot (lieu, personnage, objet).",
    compte: n => `${n} fiche${n > 1 ? "s" : ""}`,
  },
  en: {
    recherche: "Search for a quest, place or puzzle…", toutes: "Show all solutions", sommaire: "Contents",
    copier: "Copy link", copie: "Link copied", selection: "Selected: Ctrl+C", solution: "Show solution",
    contient: "contains your search", vide: "Nothing matches. Try another word (place, character, item).",
    compte: n => `${n} result${n > 1 ? "s" : ""}`,
  },
};

// Langue : ?lang= dans l'adresse, sinon le dernier choix, sinon celle du navigateur.
function choisirLangue() {
  const p = new URLSearchParams(location.search).get("lang");
  if (p && DATA[p]) return p;
  try { const s = localStorage.getItem(CLE_LANGUE); if (s && DATA[s]) return s; } catch (e) {}
  const nav = (navigator.language || "").slice(0, 2).toLowerCase();
  if (DATA[nav]) return nav;
  if (nav !== "fr" && DATA.en) return "en";
  return DATA.fr ? "fr" : LANGUES[0];
}
let langue = choisirLangue();
const T = () => TXT[langue] || TXT.fr;

const DIACRITIQUES = new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g");
const fold1 = c => { const f = c.normalize("NFD").replace(DIACRITIQUES, "").toLowerCase(); return f.length === 1 ? f : c.toLowerCase(); };
const fold = s => Array.from(s, fold1).join("");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function construire() {
  const main = document.getElementById("contenu");
  const nav = document.getElementById("sommaire");
  let h = "", n = "";
  const chapitres = DATA[langue];
  for (const c of chapitres) {
    h += `<section class="chapitre" id="${c.id}" data-chap="${c.id}"><header><div class="num">${esc(c.num)}</div><h2>${esc(c.titre || c.num)}</h2></header>`;
    if (c.intro) h += `<div class="chap-intro">${c.intro}</div>`;
    n += `<details data-chap="${c.id}"${c === chapitres[0] ? " open" : ""}><summary><span class="n">${esc(c.num.replace(/^(Chapitre|Chapter) /, "Ch. "))}</span>${esc(c.titre || "")}</summary><ul>`;
    for (const s of c.sections) {
      h += `<div class="section"><h3>${esc(s.titre)}</h3>${s.intro ? `<div class="chap-intro">${s.intro}</div>` : ""}`;
      n += `<li class="sec-li"><a class="sec" tabindex="-1">${esc(s.titre)}</a></li>`;
      for (const e of s.entrees) {
        h += `<article class="fiche" id="${e.id}" data-texte="${esc(fold(e.texte))}"><div class="fiche-tete"><h4>${esc(e.titre)}</h4><button type="button" class="lien" data-id="${e.id}">${T().copier}</button></div><div class="fiche-corps">${e.html}</div></article>`;
        n += `<li data-ref="${e.id}"><a href="#${e.id}">${esc(e.titre)}</a></li>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
    n += `</ul></details>`;
  }
  main.innerHTML = h + `<p class="vide" id="vide" hidden>${T().vide}</p>`;
  nav.innerHTML = n;
}

// Une solution commence par un gras « Solution… ». On la cache, avec la
// liste d'etapes qui la suit (paragraphe) ou qu'elle contient (element de liste).
function masquerSolutions(root) {
  const forts = Array.from(root.querySelectorAll(".fiche-corps strong")).filter(s => /^Solution\b/.test(s.textContent.trim()) && !s.closest(".sol"));
  for (const fort of forts) {
    const hote = fort.parentElement;
    if (!hote || !(hote.tagName === "P" || hote.tagName === "LI")) continue;
    if (hote.firstChild !== fort && hote.firstChild.textContent.trim() !== "") continue;
    const brut = fort.textContent.trim();
    const m = brut.match(/^Solution\s*([^:]*?)\s*:\s*(.*)$/);
    let precision = "", resteFort = "";
    if (m) { precision = m[1].replace(/^[,(]\s*|\s*\)$/g, "").trim(); resteFort = m[2]; }
    const det = document.createElement("details");
    det.className = "sol";
    const sum = document.createElement("summary");
    sum.textContent = T().solution + (precision ? " (" + precision + ")" : "");
    sum.dataset.contient = T().contient;
    const corps = document.createElement("div");
    corps.className = "sol-corps";
    det.append(sum, corps);
    const p = document.createElement("p");
    if (resteFort) { const b = document.createElement("strong"); b.textContent = resteFort; p.append(b); }
    fort.remove();
    // Texte de la solution : tout ce qui suit le gras, jusqu'a une liste imbriquee.
    while (hote.firstChild) {
      const n = hote.firstChild;
      if (n.nodeType === 1 && /^(OL|UL)$/.test(n.tagName)) break;
      p.append(n);
    }
    if (p.textContent.replace(/^[\s:,.]+/, "").trim()) {
      if (p.firstChild && p.firstChild.nodeType === 3) p.firstChild.nodeValue = p.firstChild.nodeValue.replace(/^[\s:]+/, "");
      corps.append(p);
    }
    if (hote.tagName === "LI") {
      while (hote.firstChild) corps.append(hote.firstChild);
      hote.append(det);
    } else {
      let suivant = hote.nextElementSibling;
      if (suivant && /^(OL|UL)$/.test(suivant.tagName)) corps.append(suivant);
      hote.replaceWith(det);
    }
  }
}

function nettoyerMarques(root) {
  root.querySelectorAll("mark").forEach(m => { const t = document.createTextNode(m.textContent); m.replaceWith(t); });
  root.normalize();
}

function surligner(root, termes) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentNode.closest("button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const noeuds = [];
  while (walker.nextNode()) noeuds.push(walker.currentNode);
  for (const nd of noeuds) {
    const txt = nd.nodeValue, f = fold(txt);
    const zones = [];
    for (const t of termes) {
      let i = f.indexOf(t);
      while (i !== -1) { zones.push([i, i + t.length]); i = f.indexOf(t, i + t.length); }
    }
    if (!zones.length) continue;
    zones.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [a, b] of zones) {
      if (a < pos) continue;
      frag.appendChild(document.createTextNode(txt.slice(pos, a)));
      const m = document.createElement("mark"); m.textContent = txt.slice(a, b); frag.appendChild(m);
      pos = b;
    }
    frag.appendChild(document.createTextNode(txt.slice(pos)));
    nd.replaceWith(frag);
  }
}

function filtrer() {
  const main = document.getElementById("contenu");
  const q = fold(document.getElementById("q").value.trim());
  const termes = q.split(/\s+/).filter(t => t.length > 1);
  nettoyerMarques(main);
  main.querySelectorAll(".sol.contient").forEach(d => d.classList.remove("contient"));
  let visibles = 0;
  for (const f of main.querySelectorAll(".fiche")) {
    const ok = !termes.length || termes.every(t => f.dataset.texte.includes(t));
    f.hidden = !ok;
    if (ok) visibles++;
    const li = document.querySelector(`#sommaire li[data-ref="${f.id}"]`);
    if (li) li.classList.toggle("cache", !ok);
  }
  for (const s of main.querySelectorAll(".section")) s.hidden = !s.querySelector(".fiche:not([hidden])");
  for (const c of main.querySelectorAll(".chapitre")) {
    c.hidden = !c.querySelector(".fiche:not([hidden])");
    const intro = c.querySelector(":scope > .chap-intro");
    if (intro) intro.hidden = termes.length > 0;
  }
  document.querySelectorAll("#sommaire details").forEach(d => {
    const vis = d.querySelector("li[data-ref]:not(.cache)");
    d.hidden = !vis;
    if (termes.length) d.open = !!vis;
  });
  document.querySelectorAll("#sommaire .sec-li").forEach(li => {
    let n = li.nextElementSibling, vis = false;
    while (n && !n.classList.contains("sec-li")) { if (!n.classList.contains("cache")) vis = true; n = n.nextElementSibling; }
    li.classList.toggle("cache", !vis);
  });
  document.getElementById("vide").hidden = visibles > 0;
  document.getElementById("compte").textContent = termes.length ? T().compte(visibles) : "";
  if (termes.length) {
    for (const f of main.querySelectorAll(".fiche:not([hidden])")) {
      surligner(f, termes);
      f.querySelectorAll(".sol:not([open])").forEach(d => { if (d.querySelector("mark")) d.classList.add("contient"); });
    }
  }
}

function toutesSolutions(v) {
  document.querySelectorAll(".sol").forEach(d => d.open = v);
}

function allerA(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.hidden || (el.closest("[hidden]"))) { document.getElementById("q").value = ""; filtrer(); }
  const chap = el.closest(".chapitre");
  if (chap) { const d = document.querySelector(`#sommaire details[data-chap="${chap.dataset.chap}"]`); if (d) d.open = true; }
  el.scrollIntoView({ block: "start" });
  if (el.classList.contains("fiche")) {
    el.classList.add("eclat");
    setTimeout(() => el.classList.remove("eclat"), 1800);
  }
}

// Version artefact : lien claude.ai fixe. Version autonome : l'adresse ou la page est hebergee
// (rien a copier si le fichier est ouvert depuis le disque).
function baseLiens() {
  if (BASE) return BASE;
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : "";
}

function copierLien(btn) {
  const id = btn.dataset.id;
  const url = baseLiens() + (LANGUES.length > 1 ? "?lang=" + langue : "") + "#" + id;
  const fiche = btn.closest(".fiche");
  const done = () => { btn.textContent = T().copie; setTimeout(() => btn.textContent = T().copier, 1600); };
  const montrer = () => {
    let z = fiche.querySelector(".lien-zone");
    if (!z) { z = document.createElement("input"); z.className = "lien-zone"; z.readOnly = true; fiche.querySelector(".fiche-tete").after(z); }
    z.value = url; z.select(); btn.textContent = T().selection;
  };
  try { navigator.clipboard.writeText(url).then(done, montrer); } catch (e) { montrer(); }
}

function appliquerTextes() {
  const t = T(), pick = o => (o && (o[langue] || o.fr)) || "";
  document.documentElement.lang = langue;
  if (pick(CONFIG.titre)) document.title = pick(CONFIG.titre);
  if (pick(CONFIG.marque)) document.getElementById("marque").textContent = pick(CONFIG.marque);
  if (pick(CONFIG.sous_titre)) document.getElementById("sous-titre").textContent = pick(CONFIG.sous_titre);
  document.getElementById("q").placeholder = t.recherche;
  document.getElementById("txt-toutes").textContent = t.toutes;
  document.getElementById("btn-sommaire").textContent = t.sommaire;
  document.getElementById("sommaire").setAttribute("aria-label", t.sommaire);
  document.querySelectorAll("#langues button").forEach(b => b.setAttribute("aria-pressed", b.dataset.langue === langue ? "true" : "false"));
}

function rendre() {
  construire();
  masquerSolutions(document.getElementById("contenu"));
  if (box.checked) toutesSolutions(true);
  filtrer();
}

// Changement de langue : meme fiche en haut de l'ecran (les identifiants sont communs aux langues).
function changerLangue(l) {
  if (l === langue || !DATA[l]) return;
  const haut = document.querySelector(".entete").getBoundingClientRect().bottom;
  const ancre = Array.from(document.querySelectorAll(".fiche:not([hidden])")).find(f => f.getBoundingClientRect().bottom > haut + 8);
  langue = l;
  try { localStorage.setItem(CLE_LANGUE, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    if (u.searchParams.has("lang")) { u.searchParams.set("lang", l); history.replaceState(null, "", u); }
  } catch (e) {}
  appliquerTextes();
  rendre();
  if (ancre && window.scrollY > 0) { const el = document.getElementById(ancre.id); if (el) el.scrollIntoView({ block: "start", behavior: "instant" }); }
}

const box = document.getElementById("toutes");
let pref = false;
try { pref = localStorage.getItem(CLE) === "1"; } catch (e) {}
box.checked = pref;
if (LANGUES.length > 1) {
  const zone = document.getElementById("langues");
  zone.innerHTML = LANGUES.map(l => `<button type="button" data-langue="${l}" lang="${l}">${l.toUpperCase()}</button>`).join("");
  zone.hidden = false;
  zone.addEventListener("click", e => { const b = e.target.closest("button[data-langue]"); if (b) changerLangue(b.dataset.langue); });
}
appliquerTextes();
rendre();
if (!baseLiens()) document.body.classList.add("sans-liens");
box.addEventListener("change", () => { toutesSolutions(box.checked); try { localStorage.setItem(CLE, box.checked ? "1" : "0"); } catch (e) {} });

let minuteur;
document.getElementById("q").addEventListener("input", () => { clearTimeout(minuteur); minuteur = setTimeout(filtrer, 120); });
document.getElementById("contenu").addEventListener("click", e => { const b = e.target.closest(".lien"); if (b) copierLien(b); });
document.getElementById("sommaire").addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.replaceState(null, "", "#" + id); } catch (err) {}
  allerA(id);
  if (window.matchMedia("(max-width: 860px)").matches) document.getElementById("sommaire").classList.remove("ouvert");
});
document.getElementById("btn-sommaire").addEventListener("click", () => document.getElementById("sommaire").classList.toggle("ouvert"));
window.addEventListener("hashchange", () => allerA(location.hash.slice(1)));
if (location.hash.length > 1) setTimeout(() => allerA(location.hash.slice(1)), 50);
</script>
