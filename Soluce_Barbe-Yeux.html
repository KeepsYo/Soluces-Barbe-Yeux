/* Mise en page : en-tete collant avec la recherche, sommaire a gauche (replie sur telephone), fiches a droite. */
:root {
  --bg: #edf1ee; --surface: #fbfcfb; --fg: #17201c; --muted: #58675f; --line: #d4ddd7;
  --jade: #17765e; --jade-soft: #dcefe7; --or: #9a6a10; --or-soft: #f6ead0; --mark: #ffe08a;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--jade); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.entete-in { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.marque { font-family: var(--display); font-weight: 800; font-size: 1.45rem; margin: 0; line-height: 1.1; }
.marque small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.recherche { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1rem; outline: none; }
.recherche:focus-within { border-color: var(--jade); }
.compte { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bascule { display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); cursor: pointer; user-select: none; }
.bascule input { accent-color: var(--jade); width: 18px; height: 18px; }
.page { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 80px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; align-items: start; }
.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 110px); overflow-y: auto; font-size: .93rem; padding-right: 6px; }
.sommaire details { border-bottom: 1px solid var(--line); padding-block: 6px; }
.sommaire summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.02rem; list-style: none; padding: 4px 0; }
.sommaire summary::-webkit-details-marker { display: none; }
.sommaire summary .n { color: var(--jade); margin-right: 6px; }
.sommaire ul { list-style: none; margin: 4px 0 8px; padding: 0 0 0 10px; display: grid; gap: 2px; }
.sommaire li a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.sommaire li a:hover, .sommaire li a:focus-visible { background: var(--jade-soft); }
.sommaire li a.sec { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 8px; pointer-events: none; }
.sommaire li.cache { display: none; }
main { min-width: 0; display: grid; gap: 40px; }
.chapitre { display: grid; gap: 18px; }
.chapitre > header { border-bottom: 2px solid var(--jade); padding-bottom: 8px; }
.chapitre .num { color: var(--jade); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.chapitre h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 2px 0 0; text-wrap: balance; line-height: 1.15; }
.chap-intro { color: var(--muted); max-width: 72ch; }
.section { display: grid; gap: 14px; }

<script>
// DATA : { langue: [chapitres] }. CONFIG : lien de base (artefact) et titres par langue.
const DATA = {"fr": [{"id": "c1", "num": "Chapitre 1", "titre": "À la recherche de gloire et de richesse", "intro": "<p>Le Capitaine Barbe-Yeux débarque sur l'Île au crabe avec les deux cons, bien décidé à mettre la main sur un trésor maya. Un vieux parchemin de taverne l'envoie sur Morro-Blanco, puis sur l'Île aux singes et l'Île aux Pommes, sur la piste des mystérieux Bolon Tiku. Tout ne se passera pas comme prévu.</p><p><strong>Lieux du chapitre :</strong> Île au crabe (départ), Morro-Blanco (et ses souterrains), Île aux singes (jungle, temple), Île aux Pommes.</p><p><strong>Commandes utiles :</strong> clic droit, flèches ou ZQSD pour se déplacer ; touche <strong>T</strong> (par défaut) pour allumer la torche. Dans le journal de quêtes, un bouton <strong>« Indice »</strong> apparaît à côté de l'objectif quand tu es bloqué sur certaines énigmes (boussole, vigie de Morro, or volé par les singes).</p>", "sections": [{"titre": "Quête principale", "intro": "", "entrees": [{"titre": "Se rendre à la taverne.", "html": "<ol><li>Après l'introduction sur la plage (ouest de l'île), marche vers l'est jusqu'à la <strong>taverne</strong> (au centre-ouest de l'île, enseigne « Taverne »).</li><li>Dans le menu du tavernier, choisis <strong>« Je cherche des informations capitales afin de m'enrichir. »</strong> puis réponds <strong>« Oui. »</strong>. Il te donne le <strong>Parchemin</strong> (troué de trois trous).</li><li>Ta réplique déclenche une bagarre : c'est le <strong>combat tutoriel</strong> contre le tavernier et trois clients. Gagne-le (le jeu t'explique les commandes). Après la victoire, le tavernier te restaure PV et énergie à chaque visite.</li></ol><aside class=\"note\"><p>Tu ne peux pas quitter l'île en barque tant que ce combat n'est pas fait. D'autres répliques insolentes (« Alors mon coco… », insister pour un café 4 fois, demander une bière à crédit) mènent au même combat.</p></aside>", "id": "c1-se-rendre-a-la-taverne", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Se rendre à la taverne. Après l'introduction sur la plage (ouest de l'île), marche vers l'est jusqu'à la taverne (au centre-ouest de l'île, enseigne « Taverne »). Dans le menu du tavernier, choisis « Je cherche des informations capitales afin de m'enrichir. » puis réponds « Oui. » . Il te donne le Parchemin (troué de trois trous). Ta réplique déclenche une bagarre : c'est le combat tutoriel contre le tavernier et trois clients. Gagne-le (le jeu t'explique les commandes). Après la victoire, le tavernier te restaure PV et énergie à chaque visite. Tu ne peux pas quitter l'île en barque tant que ce combat n'est pas fait. D'autres répliques insolentes (« Alors mon coco… », insister pour un café 4 fois, demander une bière à crédit) mènent au même combat.", "sol": 0}, {"titre": "Trouver des indices sur le parchemin.", "html": "<ol><li>Va au <strong>chantier</strong>, au centre de l'île (au nord-est de la taverne). Un ivrogne y baragouine.</li><li>Choisis <strong>« Montrer le parchemin. »</strong> : il reconnaît <strong>Morro-Blanco</strong> (« Information obtenue ! »).</li></ol><aside class=\"note\"><p>Les menus « Comment ? » / « Oui » avec l'ivrogne ne servent à rien.</p></aside>", "id": "c1-trouver-des-indices-sur-le-parchemin", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Trouver des indices sur le parchemin. Va au chantier , au centre de l'île (au nord-est de la taverne). Un ivrogne y baragouine. Choisis « Montrer le parchemin. » : il reconnaît Morro-Blanco (« Information obtenue ! »). Les menus « Comment ? » / « Oui » avec l'ivrogne ne servent à rien.", "sol": 0}, {"titre": "Trouver une boussole pour quitter cette île.", "html": "<ol><li>Va au <strong>port</strong>, au sud-est de l'île, parle au contremaître et choisis <strong>« Vous n'auriez pas la même chose mais en moins cher ? »</strong>. Il t'apprend qu'un ivrogne lui a volé sa boussole.</li><li>Il te faut <strong>2 écus</strong> pour une bière. Sur l'île, il y a exactement deux écus :<ul><li><strong>1 écu</strong> dans le coffre de la <strong>grotte au nord</strong> de l'île (voir <em>Le Roi des Crabes</em> ci-dessous) ;</li><li><strong>1 écu</strong> enterré : ramasse d'abord la <strong>Pelle</strong> au nord-ouest (sous la grotte, à côté d'un crâne, il suffit de marcher dessus), puis va au <strong>nord-est</strong> de l'île, au-dessus d'un palmier et à gauche de fleurs, et <strong>utilise la pelle</strong> depuis l'inventaire quand tu es sur le trou.</li></ul></li><li>À la taverne, achète <strong>une bière</strong> (2 écus).</li><li>Retourne au chantier et choisis <strong>« Donner une bière »</strong> : l'ivrogne te « prête » la <strong>Boussole</strong>.</li></ol><p><strong>Solution :</strong> 1 écu (coffre de la grotte nord) + 1 écu (pelle, trou au nord-est) → 1 bière à la taverne → la donner à l'ivrogne du chantier = Boussole.</p><aside class=\"note\"><p>La boutique du port vend aussi une boussole à 3 écus, mais il n'y a que 2 écus sur l'île à ce stade : la bière est la seule solution. La boussole s'utilise depuis l'inventaire pour afficher tes coordonnées <strong>X:… Y:…</strong> en haut à gauche.</p></aside><h5>Le Roi des Crabes (grotte nord de l'Île au crabe)</h5><p>Entre dans la grotte tout au nord de l'île. Le Roi des Crabes n'a que 5 PV : une attaque suffit. Le coffre contient <strong>1 écu</strong>. En revenant ensuite, tu peux rester écouter la musique de la grotte.</p>", "id": "c1-trouver-une-boussole-pour-quitter-cette-ile", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Trouver une boussole pour quitter cette île. Va au port , au sud-est de l'île, parle au contremaître et choisis « Vous n'auriez pas la même chose mais en moins cher ? » . Il t'apprend qu'un ivrogne lui a volé sa boussole. Il te faut 2 écus pour une bière. Sur l'île, il y a exactement deux écus : 1 écu dans le coffre de la grotte au nord de l'île (voir Le Roi des Crabes ci-dessous) ; 1 écu enterré : ramasse d'abord la Pelle au nord-ouest (sous la grotte, à côté d'un crâne, il suffit de marcher dessus), puis va au nord-est de l'île, au-dessus d'un palmier et à gauche de fleurs, et utilise la pelle depuis l'inventaire quand tu es sur le trou. À la taverne, achète une bière (2 écus). Retourne au chantier et choisis « Donner une bière » : l'ivrogne te « prête » la Boussole . Solution : 1 écu (coffre de la grotte nord) + 1 écu (pelle, trou au nord-est) → 1 bière à la taverne → la donner à l'ivrogne du chantier = Boussole. La boutique du port vend aussi une boussole à 3 écus, mais il n'y a que 2 écus sur l'île à ce stade : la bière est la seule solution. La boussole s'utilise depuis l'inventaire pour afficher tes coordonnées X:… Y:… en haut à gauche. Le Roi des Crabes (grotte nord de l'Île au crabe) Entre dans la grotte tout au nord de l'île. Le Roi des Crabes n'a que 5 PV : une attaque suffit. Le coffre contient 1 écu . En revenant ensuite, tu peux rester écouter la musique de la grotte.", "sol": 1}, {"titre": "Se rendre sur Morro-Blanco.", "html": "<ol><li>Va à la <strong>barque</strong> (plage ouest, ton point d'arrivée) et choisis <strong>« Embarquer »</strong>. Sur la carte du monde, clique sur <strong>Île de Morro Blanco</strong>.</li><li>À l'arrivée, un pirate roux t'interpelle et le jeu t'amène jusqu'à lui : tu acceptes automatiquement sa quête secondaire (voir <em>Le trésor du pirate à la chevelure de feu</em>).</li></ol>", "id": "c1-se-rendre-sur-morro-blanco", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Se rendre sur Morro-Blanco. Va à la barque (plage ouest, ton point d'arrivée) et choisis « Embarquer » . Sur la carte du monde, clique sur Île de Morro Blanco . À l'arrivée, un pirate roux t'interpelle et le jeu t'amène jusqu'à lui : tu acceptes automatiquement sa quête secondaire (voir Le trésor du pirate à la chevelure de feu ).", "sol": 0}, {"titre": "Résoudre l'énigme du parchemin.", "html": "<p>Trois étapes : le journal, le graphomètre, la vigie.</p><ol><li><strong>Journal de bord</strong> : tout au <strong>nord</strong> de Morro-Blanco, dans un camp abandonné, un squelette porte un carnet (« Qu'est-ce que c'est sur ce squelette ? »). Ramasse-le. Il raconte que la « Dent Blanche » se lit depuis un point haut et que le graphomètre est caché « dans la pierre en forme de tonneau ».</li><li><strong>Graphomètre</strong> : au <strong>nord-est</strong> de l'île, fouille la <strong>pierre en forme de tonneau</strong> (action « Fouiller »). Elle n'est fouillable <strong>qu'après avoir le journal</strong>. Tout près se trouve aussi un trou visible à creuser avec la pelle : <strong>2 écus</strong>.</li><li><strong>La vigie</strong> : au <strong>centre</strong> de l'île, interagis avec la vigie (« Grimper au sommet »). En haut, tu vois le paysage panoramique (flèches <strong>&lt; &gt;</strong> pour faire défiler la vue).<ul><li>Clique <strong>« Utiliser le graphomètre »</strong> : un quadrillage numéroté s'affiche. Les nombres <strong>en haut</strong> donnent la <strong>latitude (Y)</strong>, ceux <strong>tout à droite</strong> donnent la <strong>longitude (X)</strong>.</li><li>Clique <strong>« Utiliser le parchemin »</strong>, puis règle son zoom à <strong>environ 145 %</strong> (entre 140 et 150 % ; boutons <strong>+ / –</strong> ou molette) et fais-le glisser à la souris.</li><li>Place le <strong>petit trou en haut à droite</strong> du parchemin sur la case <strong>colonne 117 / ligne 170</strong>. À ce moment, les découpes du parchemin (le volcan, l'épave et la cabane) tombent pile sur le paysage, et un <strong>son brillant</strong> confirme la bonne position.</li></ul></li></ol><p><strong>Solution :</strong> parchemin à ~145 %, petit trou en haut à droite sur la case 117 (en haut) / 170 (à droite) → <strong>latitude Y = 117, longitude X = 170</strong>.</p><ol><li><strong>Creuser</strong> : redescends (bouton « Descendre »), active la <strong>Boussole</strong> depuis l'inventaire et marche vers <strong>l'est</strong> de l'île jusqu'à lire <strong>X:170 Y:117</strong>. Utilise la <strong>Pelle</strong> pile sur cette case (sinon le jeu dit « Il faut creuser pile au bon endroit. »). Le sol s'effondre…</li></ol><p><strong>Solution :</strong> creuser avec la pelle exactement en <strong>X:170 Y:117</strong> (est de Morro-Blanco).</p><aside class=\"note\"><p>Tu peux aussi fouiller, collé au mur, la <strong>maisonnette en ruine</strong> à l'est du centre de l'île : <strong>1 bière + 1 rhum</strong> (une seule fois).</p></aside>", "id": "c1-resoudre-l-enigme-du-parchemin", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Résoudre l'énigme du parchemin. Trois étapes : le journal, le graphomètre, la vigie. Journal de bord : tout au nord de Morro-Blanco, dans un camp abandonné, un squelette porte un carnet (« Qu'est-ce que c'est sur ce squelette ? »). Ramasse-le. Il raconte que la « Dent Blanche » se lit depuis un point haut et que le graphomètre est caché « dans la pierre en forme de tonneau ». Graphomètre : au nord-est de l'île, fouille la pierre en forme de tonneau (action « Fouiller »). Elle n'est fouillable qu'après avoir le journal . Tout près se trouve aussi un trou visible à creuser avec la pelle : 2 écus . La vigie : au centre de l'île, interagis avec la vigie (« Grimper au sommet »). En haut, tu vois le paysage panoramique (flèches < > pour faire défiler la vue). Clique « Utiliser le graphomètre » : un quadrillage numéroté s'affiche. Les nombres en haut donnent la latitude (Y) , ceux tout à droite donnent la longitude (X) . Clique « Utiliser le parchemin » , puis règle son zoom à environ 145 % (entre 140 et 150 % ; boutons + / – ou molette) et fais-le glisser à la souris. Place le petit trou en haut à droite du parchemin sur la case colonne 117 / ligne 170 . À ce moment, les découpes du parchemin (le volcan, l'épave et la cabane) tombent pile sur le paysage, et un son brillant confirme la bonne position. Solution : parchemin à ~145 %, petit trou en haut à droite sur la case 117 (en haut) / 170 (à droite) → latitude Y = 117, longitude X = 170 . Creuser : redescends (bouton « Descendre »), active la Boussole depuis l'inventaire et marche vers l'est de l'île jusqu'à lire X:170 Y:117 . Utilise la Pelle pile sur cette case (sinon le jeu dit « Il faut creuser pile au bon endroit. »). Le sol s'effondre… Solution : creuser avec la pelle exactement en X:170 Y:117 (est de Morro-Blanco). Tu peux aussi fouiller, collé au mur, la maisonnette en ruine à l'est du centre de l'île : 1 bière + 1 rhum (une seule fois).", "sol": 2}, {"titre": "Sortir du souterrain.", "html": "<ol><li>Tu tombes dans une salle obscure. Barbe-Yeux constate qu'il a <strong>cassé la boussole et le graphomètre</strong> (c'est normal, ils ne servent plus).</li><li>À droite de la salle, un vendeur de torches cherche « sa torche en acajou » : parle-lui, il te donne un <strong>Échantillon de torche en acajou</strong>. Allume-la avec <strong>T</strong>.</li><li>En traversant la salle, tu dois affronter <strong>4 squelettes de Morro</strong> (combat obligatoire, pas de fuite).</li><li>Prends la sortie <strong>en haut</strong> de la salle pour monter dans la salle du médaillon.</li><li>Au centre de cette salle, un mécanisme d'<strong>anneaux</strong> (un centre + 4 anneaux) porte des flèches. Approche-toi et utilise « Manipuler les anneaux ». Chaque clic fait tourner la pièce d'un cran dans le sens des aiguilles d'une montre. <strong>Il faut que toutes les flèches pointent vers le nord.</strong></li></ol><p><strong>Solution (depuis la position de départ) :</strong></p><ul><li><strong>« Faire tourner le centre » : 1 fois</strong></li><li><strong>« Faire tourner l'anneau 1 » : 6 fois</strong></li><li><strong>« Faire tourner l'anneau 2 » : 7 fois</strong></li><li><strong>« Faire tourner l'anneau 3 » : 2 fois</strong></li><li><strong>« Faire tourner l'anneau 4 » : 3 fois</strong></li></ul><ol><li>Le plafond s'ouvre et <strong>la salle se remplit d'eau</strong> (« faites quelque chose ! ») : tu as <strong>15 secondes</strong> (l'eau monte à 5 s puis à 10 s). Cours <strong>en haut de la salle</strong> et interagis : <strong>« Récupérer le médaillon »</strong>.</li><li>Tu remontes et tu es rejeté sur le rivage de Morro-Blanco avec le <strong>Médaillon des Bolon Tiku</strong>. L'échantillon de torche disparaît.</li></ol><aside class=\"note\"><p>Si tu te noies, tu recommences simplement depuis l'entrée de la salle : les anneaux restent résolus, il suffit de courir plus vite vers le médaillon.</p></aside>", "id": "c1-sortir-du-souterrain", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Sortir du souterrain. Tu tombes dans une salle obscure. Barbe-Yeux constate qu'il a cassé la boussole et le graphomètre (c'est normal, ils ne servent plus). À droite de la salle, un vendeur de torches cherche « sa torche en acajou » : parle-lui, il te donne un Échantillon de torche en acajou . Allume-la avec T . En traversant la salle, tu dois affronter 4 squelettes de Morro (combat obligatoire, pas de fuite). Prends la sortie en haut de la salle pour monter dans la salle du médaillon. Au centre de cette salle, un mécanisme d' anneaux (un centre + 4 anneaux) porte des flèches. Approche-toi et utilise « Manipuler les anneaux ». Chaque clic fait tourner la pièce d'un cran dans le sens des aiguilles d'une montre. Il faut que toutes les flèches pointent vers le nord. Solution (depuis la position de départ) : « Faire tourner le centre » : 1 fois « Faire tourner l'anneau 1 » : 6 fois « Faire tourner l'anneau 2 » : 7 fois « Faire tourner l'anneau 3 » : 2 fois « Faire tourner l'anneau 4 » : 3 fois Le plafond s'ouvre et la salle se remplit d'eau (« faites quelque chose ! ») : tu as 15 secondes (l'eau monte à 5 s puis à 10 s). Cours en haut de la salle et interagis : « Récupérer le médaillon » . Tu remontes et tu es rejeté sur le rivage de Morro-Blanco avec le Médaillon des Bolon Tiku . L'échantillon de torche disparaît. Si tu te noies, tu recommences simplement depuis l'entrée de la salle : les anneaux restent résolus, il suffit de courir plus vite vers le médaillon.", "sol": 1}, {"titre": "Retourner à la taverne.", "html": "<ol><li>Reprends la barque (près de ton point d'arrivée, au sud-ouest de Morro-Blanco) et rentre sur l'<strong>Île au crabe</strong>.</li><li>À la taverne, le tavernier exige que tu prennes une chambre : choisis <strong>« Ok. »</strong> (<strong>10 pièces d'or</strong>). Si tu refuses, il boude : l'option <strong>« Payer une piaule (10 pièces d'or) »</strong> reste dans son menu.</li><li>Il t'envoie voir le contremaître du port.</li></ol><aside class=\"note\"><p>Dès que tu poses le pied sur Morro-Blanco, le jeu <strong>réserve 10 écus</strong> pour cette chambre : boutiques, dés et mendiant refusent de te faire descendre sous 10 écus. Le coffre du pirate roux (10 écus) suffit à la payer.</p></aside>", "id": "c1-retourner-a-la-taverne", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Retourner à la taverne. Reprends la barque (près de ton point d'arrivée, au sud-ouest de Morro-Blanco) et rentre sur l' Île au crabe . À la taverne, le tavernier exige que tu prennes une chambre : choisis « Ok. » ( 10 pièces d'or ). Si tu refuses, il boude : l'option « Payer une piaule (10 pièces d'or) » reste dans son menu. Il t'envoie voir le contremaître du port. Dès que tu poses le pied sur Morro-Blanco, le jeu réserve 10 écus pour cette chambre : boutiques, dés et mendiant refusent de te faire descendre sous 10 écus. Le coffre du pirate roux (10 écus) suffit à la payer.", "sol": 0}, {"titre": "Parler au contremaître du port.", "html": "<p>Va au port (sud-est de l'Île au crabe). Barbe-Yeux lui parle des Bolon Tiku : le contremaître évoque un <strong>temple scellé dans la jungle</strong>. L'<strong>Île aux singes</strong> est débloquée sur la carte.</p>", "id": "c1-parler-au-contremaitre-du-port", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Parler au contremaître du port. Va au port (sud-est de l'Île au crabe). Barbe-Yeux lui parle des Bolon Tiku : le contremaître évoque un temple scellé dans la jungle . L' Île aux singes est débloquée sur la carte.", "sol": 0}, {"titre": "Se rendre sur l'île aux singes.", "html": "<p>Embarque à la barque et choisis <strong>Jungle côtière</strong> (Île aux singes) sur la carte.</p>", "id": "c1-se-rendre-sur-l-ile-aux-singes", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Se rendre sur l'île aux singes. Embarque à la barque et choisis Jungle côtière (Île aux singes) sur la carte.", "sol": 0}, {"titre": "Recueillir des informations sur le temple.", "html": "<ol><li>Depuis la plage d'arrivée (sud-ouest), la rivière te barre la route vers l'est. La première fois, tu dois monter au <strong>nord-est</strong> et faire la <strong>descente de la rivière</strong> (voir <em>Mini-jeux</em>) : elle te dépose au sud-est de l'île. Ensuite, l'aventurière te montre un <strong>raccourci</strong> à travers la rivière (voir <em>Retrouver le sac à dos</em>), et tu n'as plus besoin de refaire le mini-jeu.</li><li>Le <strong>vendeur de torches</strong> se tient devant le temple, à l'est de l'île.</li><li>Écoute son (très long) catalogue : il t'envoie sur l'<strong>Île aux Pommes</strong>, son île natale. Elle est débloquée sur la carte.</li><li><strong>Achète une torche maintenant ou plus tard</strong> : il en faudra une pour entrer dans le temple (« une torche vous sera nécessaire »). La moins chère est la <strong>Torche du débutant (10 écus)</strong>.</li></ol><aside class=\"note\"><p>Pour réunir 10 écus sur l'Île aux singes : les pirates des zones herbeuses de l'ouest lâchent 1 à 5 écus une fois sur deux ; la descente de la rivière rapporte aussi de l'or (voir Mini-jeux). Attention aux <strong>singes voleurs</strong> du centre et du nord : chaque contact te vole 1 écu (voir <em>À ne pas rater</em>).</p></aside>", "id": "c1-recueillir-des-informations-sur-le-temple", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Recueillir des informations sur le temple. Depuis la plage d'arrivée (sud-ouest), la rivière te barre la route vers l'est. La première fois, tu dois monter au nord-est et faire la descente de la rivière (voir Mini-jeux ) : elle te dépose au sud-est de l'île. Ensuite, l'aventurière te montre un raccourci à travers la rivière (voir Retrouver le sac à dos ), et tu n'as plus besoin de refaire le mini-jeu. Le vendeur de torches se tient devant le temple, à l'est de l'île. Écoute son (très long) catalogue : il t'envoie sur l' Île aux Pommes , son île natale. Elle est débloquée sur la carte. Achète une torche maintenant ou plus tard : il en faudra une pour entrer dans le temple (« une torche vous sera nécessaire »). La moins chère est la Torche du débutant (10 écus) . Pour réunir 10 écus sur l'Île aux singes : les pirates des zones herbeuses de l'ouest lâchent 1 à 5 écus une fois sur deux ; la descente de la rivière rapporte aussi de l'or (voir Mini-jeux). Attention aux singes voleurs du centre et du nord : chaque contact te vole 1 écu (voir À ne pas rater ).", "sol": 0}, {"titre": "Se rendre sur l'île aux pommes. / Trouver des informations liées au temple.", "html": "<ol><li>Embarque pour l'<strong>Île aux Pommes</strong>.</li><li>En traversant la place du village, tu es pris dans la <strong>fête de la compote</strong> : une ronde de villageois et de musiciens t'encercle pendant toute la chanson (environ 2 minutes 10). Tu ne peux rien faire, attends la fin.</li><li>Entre chez le <strong>vendeur de compotes</strong> (la maison au nord de la place). Il te parle d'une grotte gardée par un terrible monstre, derrière sa boutique.</li><li>Choisis <strong>« Prendre la porte de derrière »</strong>.</li></ol><aside class=\"note\"><p>Aux visites suivantes, la fête recommence quand tu entres sur la place ; un choix apparaît alors : <strong>« Demander de la marmelade »</strong> l'arrête net, <strong>« Profiter du spectacle »</strong> la relance.</p></aside>", "id": "c1-se-rendre-sur-l-ile-aux-pommes-trouver-des-informations-liee", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Se rendre sur l'île aux pommes. / Trouver des informations liées au temple. Embarque pour l' Île aux Pommes . En traversant la place du village, tu es pris dans la fête de la compote : une ronde de villageois et de musiciens t'encercle pendant toute la chanson (environ 2 minutes 10). Tu ne peux rien faire, attends la fin. Entre chez le vendeur de compotes (la maison au nord de la place). Il te parle d'une grotte gardée par un terrible monstre, derrière sa boutique. Choisis « Prendre la porte de derrière » . Aux visites suivantes, la fête recommence quand tu entres sur la place ; un choix apparaît alors : « Demander de la marmelade » l'arrête net, « Profiter du spectacle » la relance.", "sol": 0}, {"titre": "Vaincre le monstre de la grotte.", "html": "<p>Entre dans la grotte au nord, derrière la boutique. Le « terrible monstre » est… le Roi des Crabes, revenu « évolué ». Il n'a que 10 PV. Il lâche la <strong>Clé étrange</strong>.</p>", "id": "c1-vaincre-le-monstre-de-la-grotte", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Vaincre le monstre de la grotte. Entre dans la grotte au nord, derrière la boutique. Le « terrible monstre » est… le Roi des Crabes, revenu « évolué ». Il n'a que 10 PV. Il lâche la Clé étrange .", "sol": 0}, {"titre": "Résoudre l'énigme du temple à l'aide de la clé.", "html": "<ol><li>Retourne sur l'Île aux singes, au <strong>sud-est</strong>, près du temple (sous le vendeur de torches). Trois <strong>dalles musicales</strong> sont au sol ; chacune joue une note quand tu marches dessus :<ul><li><strong>dalle 1</strong> : la plus au sud-est (coin en bas à droite) ;</li><li><strong>dalle 2</strong> : à gauche (ouest) de la dalle 1 ;</li><li><strong>dalle 3</strong> : au-dessus (au nord) des deux autres.</li></ul></li><li>Indice : utilise la <strong>Clé étrange</strong> depuis l'inventaire, c'est une clé-flûte qui joue un air.</li><li>Marche sur les dalles dans le bon ordre, <strong>avec la Clé étrange dans l'inventaire</strong>. Une erreur joue un son d'échec et remet la séquence à zéro.</li></ol><p><strong>Solution :</strong> dalle <strong>1 → 2 → 1 → 3</strong>.</p><ol><li>La porte du temple s'enfonce dans le sol (environ 13 secondes). La Clé étrange est consommée.</li></ol>", "id": "c1-resoudre-l-enigme-du-temple-a-l-aide-de-la-cle", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Résoudre l'énigme du temple à l'aide de la clé. Retourne sur l'Île aux singes, au sud-est , près du temple (sous le vendeur de torches). Trois dalles musicales sont au sol ; chacune joue une note quand tu marches dessus : dalle 1 : la plus au sud-est (coin en bas à droite) ; dalle 2 : à gauche (ouest) de la dalle 1 ; dalle 3 : au-dessus (au nord) des deux autres. Indice : utilise la Clé étrange depuis l'inventaire, c'est une clé-flûte qui joue un air. Marche sur les dalles dans le bon ordre, avec la Clé étrange dans l'inventaire . Une erreur joue un son d'échec et remet la séquence à zéro. Solution : dalle 1 → 2 → 1 → 3 . La porte du temple s'enfonce dans le sol (environ 13 secondes). La Clé étrange est consommée.", "sol": 1}, {"titre": "Explorer le temple.", "html": "<ol><li><strong>Il faut une torche équipée</strong> pour entrer (achète-la au vendeur juste à côté si besoin, puis allume-la avec <strong>T</strong>).</li><li>Dans la première salle, trois groupes de <strong>morts-vivants</strong> t'attaquent quand tu traverses (combats obligatoires).</li><li><strong>Le vieux de la grotte</strong> te barre le passage avec une énigme (« Qui marche à quatre pattes le matin… »). L'énigme n'a pas de réponse : <strong>tous les choix finissent par te laisser passer</strong> (le menacer puis l'abandonner, le flatter ou « le piéger logiquement »).</li><li><strong>Coffres de la première salle</strong> (ouverture libre) : 5 écus + 2 bières, et 15 écus + 5 bières + 3 rhums.</li><li>Prends le passage en haut de la salle vers la seconde salle : un dernier groupe de morts-vivants (5 écus), un coffre avec <strong>5 écus + Ciseaux argentés</strong> (+10 en attaque, à équiper !).</li><li>Au fond de la seconde salle, avance vers le boss.</li></ol>", "id": "c1-explorer-le-temple", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Explorer le temple. Il faut une torche équipée pour entrer (achète-la au vendeur juste à côté si besoin, puis allume-la avec T ). Dans la première salle, trois groupes de morts-vivants t'attaquent quand tu traverses (combats obligatoires). Le vieux de la grotte te barre le passage avec une énigme (« Qui marche à quatre pattes le matin… »). L'énigme n'a pas de réponse : tous les choix finissent par te laisser passer (le menacer puis l'abandonner, le flatter ou « le piéger logiquement »). Coffres de la première salle (ouverture libre) : 5 écus + 2 bières, et 15 écus + 5 bières + 3 rhums. Prends le passage en haut de la salle vers la seconde salle : un dernier groupe de morts-vivants (5 écus), un coffre avec 5 écus + Ciseaux argentés (+10 en attaque, à équiper !). Au fond de la seconde salle, avance vers le boss.", "sol": 0}, {"titre": "Vaincre le Héraut de Xibalba.", "html": "<p><strong>Boss :</strong> Héraut de Xibalba (1000 PV, attaque 40). Quand il passe <strong>sous la moitié de ses PV</strong>, il invoque <strong>3 Esprits de Xibalba</strong> (200 PV chacun). Garde ton énergie pour cette phase : le <strong>Lancer de ciseaux</strong> (attaque de zone) est idéal contre les esprits, puis finis le Héraut au <strong>Coup de ciseaux</strong>.</p><p>Récompense : <strong>2000 XP</strong> et la <strong>1ère gemme des Bolon Tiku</strong>. Un <strong>coffre</strong> apparaît ensuite dans la salle : <strong>15 écus + 3 bières + 2 rhums</strong>.</p>", "id": "c1-vaincre-le-heraut-de-xibalba", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Vaincre le Héraut de Xibalba. Boss : Héraut de Xibalba (1000 PV, attaque 40). Quand il passe sous la moitié de ses PV , il invoque 3 Esprits de Xibalba (200 PV chacun). Garde ton énergie pour cette phase : le Lancer de ciseaux (attaque de zone) est idéal contre les esprits, puis finis le Héraut au Coup de ciseaux . Récompense : 2000 XP et la 1ère gemme des Bolon Tiku . Un coffre apparaît ensuite dans la salle : 15 écus + 3 bières + 2 rhums .", "sol": 0}, {"titre": "Retourner à la taverne de l'île au crabe.", "html": "<ol><li>En sortant du temple, <strong>Nadaillac Deux Rouges</strong> t'attend et réclame ta pierre. Un combat se lance : <strong>il est impossible de le gagner</strong>. Les deux cons s'enfuient et Nadaillac t'abat d'un coup de pistolet. C'est scénarisé, ne t'inquiète pas.</li><li>Tu te réveilles à la <strong>taverne de l'Île aux singes</strong>, <strong>sans la gemme ni le médaillon</strong>.</li><li>Reprends la barque et retourne à la <strong>taverne de l'Île au crabe</strong>. Entrer dans la taverne lance la fin du chapitre.</li></ol><h5>Combat final : la Torche cauchemardesque</h5><p>Barbe-Yeux fait un cauchemar et affronte seul une torche géante. Règles :</p><ul><li>Tu as <strong>100 PV fixes</strong>, et les dégâts sont fixes : <strong>Attaque 95, Coup de ciseaux 125, Lancer de ciseaux 80</strong> sur la torche (55 / 100 / 50 sur les petites torches).</li><li>Le combat est <strong>chronométré en 4 phases</strong> : descendre la torche à 1500 PV en 20 s, puis à 1000 PV en 20 s, puis sous 500 PV en 25 s malgré <strong>10 petites torches</strong>, puis la briser en 25 s et <strong>éteindre ses 5 dernières torches</strong>.</li><li><strong>Ne traîne pas</strong> : si tu ne fais rien pendant 5 secondes, la torche te mord.</li><li><strong>Solution : gère ton énergie.</strong> Tu n'as que <strong>100 d'énergie</strong>, et elle ne remonte pas pendant le combat. Le Lancer de ciseaux coûte <strong>20</strong>, le Coup de ciseaux <strong>15</strong>.<ol><li><strong>Phases 1 et 2</strong> : uniquement des <strong>attaques normales</strong> sur la grosse torche (gratuites).</li><li><strong>Dès que des petites torches apparaissent</strong> (deux vagues) : <strong>Lancer de ciseaux</strong>. Il touche tout le monde, et deux lancers éteignent une vague (100 PV chacune, 50 dégâts par lancer). Il en faut donc <strong>4</strong> au total, soit 80 d'énergie.</li><li><strong>Phase 4</strong> : il te reste de quoi placer <strong>un seul Coup de ciseaux</strong> sur la grosse torche. Il n'est pas obligatoire, mais il aide à tenir le chrono.</li></ol></li><li>Si tu échoues, le cauchemar recommence. <strong>Après 3 échecs</strong>, un choix apparaît :<ul><li><strong>« Vaincre ses démons »</strong> : on recommence normalement ;</li><li><strong>« Vaincre ses démons mais je suis trop nul »</strong> : mode assisté (<strong>+20 PV</strong> et <strong>+5 s</strong> par phase) ;</li><li><strong>« Se réveiller »</strong> : <strong>saute le combat</strong> ; le chapitre se termine de la même façon.</li></ul></li></ul><p>Ensuite vient une scène triste au bord de l'eau (attends, elle se termine… à sa façon), puis le générique <strong>« Fin du chapitre 1 »</strong> et le succès <strong>« Tout est bien qui commence mal »</strong>.</p>", "id": "c1-retourner-a-la-taverne-de-l-ile-au-crabe", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Retourner à la taverne de l'île au crabe. En sortant du temple, Nadaillac Deux Rouges t'attend et réclame ta pierre. Un combat se lance : il est impossible de le gagner . Les deux cons s'enfuient et Nadaillac t'abat d'un coup de pistolet. C'est scénarisé, ne t'inquiète pas. Tu te réveilles à la taverne de l'Île aux singes , sans la gemme ni le médaillon . Reprends la barque et retourne à la taverne de l'Île au crabe . Entrer dans la taverne lance la fin du chapitre. Combat final : la Torche cauchemardesque Barbe-Yeux fait un cauchemar et affronte seul une torche géante. Règles : Tu as 100 PV fixes , et les dégâts sont fixes : Attaque 95, Coup de ciseaux 125, Lancer de ciseaux 80 sur la torche (55 / 100 / 50 sur les petites torches). Le combat est chronométré en 4 phases : descendre la torche à 1500 PV en 20 s, puis à 1000 PV en 20 s, puis sous 500 PV en 25 s malgré 10 petites torches , puis la briser en 25 s et éteindre ses 5 dernières torches . Ne traîne pas : si tu ne fais rien pendant 5 secondes, la torche te mord. Solution : gère ton énergie. Tu n'as que 100 d'énergie , et elle ne remonte pas pendant le combat. Le Lancer de ciseaux coûte 20 , le Coup de ciseaux 15 . Phases 1 et 2 : uniquement des attaques normales sur la grosse torche (gratuites). Dès que des petites torches apparaissent (deux vagues) : Lancer de ciseaux . Il touche tout le monde, et deux lancers éteignent une vague (100 PV chacune, 50 dégâts par lancer). Il en faut donc 4 au total, soit 80 d'énergie. Phase 4 : il te reste de quoi placer un seul Coup de ciseaux sur la grosse torche. Il n'est pas obligatoire, mais il aide à tenir le chrono. Si tu échoues, le cauchemar recommence. Après 3 échecs , un choix apparaît : « Vaincre ses démons » : on recommence normalement ; « Vaincre ses démons mais je suis trop nul » : mode assisté ( +20 PV et +5 s par phase) ; « Se réveiller » : saute le combat ; le chapitre se termine de la même façon. Ensuite vient une scène triste au bord de l'eau (attends, elle se termine… à sa façon), puis le générique « Fin du chapitre 1 » et le succès « Tout est bien qui commence mal » .", "sol": 1}, {"titre": "Après le générique : la pêche", "html": "<p>La démo continue un peu après le générique, sur l'Île au crabe :</p><ol><li><strong>Nouvel objectif : parler au vieux pêcheur</strong> (sa cabane au centre-est de l'île, à l'est du chantier). Choisis <strong>« J'aimerais bien que tu m'apprennes à pêcher. »</strong> Il te fait passer trois tests :<ul><li><strong>Patience</strong> : des choix s'affichent (« Je dois faire quoi ? »…). <strong>N'appuie sur rien pendant 15 secondes.</strong> Cliquer un choix fait échouer (il faut alors lui reparler).</li><li><strong>Persévérance</strong> : pareil, <strong>ne touche à rien pendant 15 secondes</strong> (en cas d'échec, l'épreuve recommence).</li><li><strong>Le bon moment</strong> : un seul choix « Maintenant ? ». <strong>Attends au moins 10 secondes</strong> avant de cliquer (trop tôt = on recommence).</li><li>Récompense : <strong>la pêche est débloquée</strong>.</li></ul></li><li><strong>Nouvel objectif : suivre l'appel du large.</strong> Rends-toi aux coordonnées <strong>X:8 Y:49</strong> de l'Île au crabe (un indicateur à l'écran t'y guide ; une case d'écart suffit). Le message « Coordonnées atteintes » valide l'objectif.</li><li><strong>C'est la fin de la démo !</strong> Tu peux continuer à te promener, à pêcher et à finir les quêtes secondaires.</li></ol>", "id": "c1-apres-le-generique-la-peche", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quête principale Après le générique : la pêche La démo continue un peu après le générique, sur l'Île au crabe : Nouvel objectif : parler au vieux pêcheur (sa cabane au centre-est de l'île, à l'est du chantier). Choisis « J'aimerais bien que tu m'apprennes à pêcher. » Il te fait passer trois tests : Patience : des choix s'affichent (« Je dois faire quoi ? »…). N'appuie sur rien pendant 15 secondes. Cliquer un choix fait échouer (il faut alors lui reparler). Persévérance : pareil, ne touche à rien pendant 15 secondes (en cas d'échec, l'épreuve recommence). Le bon moment : un seul choix « Maintenant ? ». Attends au moins 10 secondes avant de cliquer (trop tôt = on recommence). Récompense : la pêche est débloquée . Nouvel objectif : suivre l'appel du large. Rends-toi aux coordonnées X:8 Y:49 de l'Île au crabe (un indicateur à l'écran t'y guide ; une case d'écart suffit). Le message « Coordonnées atteintes » valide l'objectif. C'est la fin de la démo ! Tu peux continuer à te promener, à pêcher et à finir les quêtes secondaires.", "sol": 0}]}, {"titre": "Quêtes secondaires", "intro": "", "entrees": [{"titre": "Rallumer les lampes.", "html": "<ul><li><strong>Déclencheur :</strong> la veuve assise devant trois lampes éteintes, sur la <strong>plage sud</strong> de l'Île au crabe. Accepte (« Oui » sur l'écran de choix). Si tu refuses, tu pourras accepter plus tard en lui reparlant.</li><li><strong>Objets à réunir :</strong><ol><li><strong>Huile</strong> : à la taverne, choisis <strong>« Demander de l'huile pour la veuve. »</strong>, puis réponds <strong>« Non. C'est pour la dame sur la plage. »</strong> (répondre « Oui », c'est pour toi, ne donne rien).</li><li><strong>Silex et pierre</strong> : parle au <strong>pêcheur</strong> (centre-est de l'île) une fois la quête acceptée, il te le rend automatiquement.</li><li><strong>Mèche sèche</strong> : ramasse-la au sol, au <strong>nord</strong> de l'île (un peu à l'est de la grotte). Elle peut être ramassée avant même d'accepter la quête.</li></ol></li><li><strong>Rendu :</strong> retourne voir la veuve avec les trois objets. Les lampes se rallument et une veillée autour du feu se lance (tu pourras revenir t'asseoir à la veillée plus tard).</li><li><strong>Récompense :</strong> <strong>200 XP</strong>.</li></ul>", "id": "c1-rallumer-les-lampes", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quêtes secondaires Rallumer les lampes. Déclencheur : la veuve assise devant trois lampes éteintes, sur la plage sud de l'Île au crabe. Accepte (« Oui » sur l'écran de choix). Si tu refuses, tu pourras accepter plus tard en lui reparlant. Objets à réunir : Huile : à la taverne, choisis « Demander de l'huile pour la veuve. » , puis réponds « Non. C'est pour la dame sur la plage. » (répondre « Oui », c'est pour toi, ne donne rien). Silex et pierre : parle au pêcheur (centre-est de l'île) une fois la quête acceptée, il te le rend automatiquement. Mèche sèche : ramasse-la au sol, au nord de l'île (un peu à l'est de la grotte). Elle peut être ramassée avant même d'accepter la quête. Rendu : retourne voir la veuve avec les trois objets. Les lampes se rallument et une veillée autour du feu se lance (tu pourras revenir t'asseoir à la veillée plus tard). Récompense : 200 XP .", "sol": 0}, {"titre": "Le trésor du pirate à la chevelure de feu.", "html": "<ul><li><strong>Déclencheur :</strong> à ta toute première arrivée sur Morro-Blanco, le pirate roux t'appelle et le jeu t'amène à lui : la quête est <strong>acceptée d'office</strong>.</li><li><strong>Étapes :</strong><ol><li>Longe le littoral vers l'<strong>est</strong> depuis le point d'arrivée : un groupe de <strong>4 pirates</strong> garde un coffre (combat obligatoire en entrant dans leur campement).</li><li>Ouvre le <strong>coffre</strong> : <strong>10 écus</strong> (c'est tout le « trésor »…).</li><li>Retourne voir le roux : il ne reste qu'une <strong>note</strong> d'excuse. Lis-la.</li></ol></li><li><strong>Récompense :</strong> <strong>350 XP</strong> + les 10 écus du coffre.</li></ul>", "id": "c1-le-tresor-du-pirate-a-la-chevelure-de-feu", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quêtes secondaires Le trésor du pirate à la chevelure de feu. Déclencheur : à ta toute première arrivée sur Morro-Blanco, le pirate roux t'appelle et le jeu t'amène à lui : la quête est acceptée d'office . Étapes : Longe le littoral vers l' est depuis le point d'arrivée : un groupe de 4 pirates garde un coffre (combat obligatoire en entrant dans leur campement). Ouvre le coffre : 10 écus (c'est tout le « trésor »…). Retourne voir le roux : il ne reste qu'une note d'excuse. Lis-la. Récompense : 350 XP + les 10 écus du coffre.", "sol": 0}, {"titre": "Retrouver le sac à dos sur l'île aux singes.", "html": "<ul><li><strong>Déclencheur :</strong> l'<strong>aventurière</strong> au sud de l'Île aux singes, un peu à l'est de la taverne (« S'il vous plaît, aidez-moi ! »). Accepte ou refuse : dans les deux cas, elle te guide ensuite vers un <strong>raccourci</strong> à travers la rivière, qui reste ouvert ensuite.</li><li><strong>Étapes :</strong><ol><li>Va tout au <strong>nord-est</strong> de l'île : un groupe de singes t'attaque (combat obligatoire : <strong>1 gorille + 7 singes chapardeurs</strong>). Le gorille s'enfuit pendant le combat.</li><li>Victoire : tu récupères le <strong>Sac à dos</strong> et le gorille laisse tomber une <strong>Pierre en forme d'oeil</strong> (indispensable pour la quête suivante).</li><li>Rapporte le sac à l'aventurière.</li></ol></li><li><strong>Récompense :</strong> <strong>500 XP</strong>.</li></ul><aside class=\"note\"><p>Le combat du nord-est a lieu même sans avoir accepté la quête : tu obtiens quand même le sac et la pierre.</p></aside>", "id": "c1-retrouver-le-sac-a-dos-sur-l-ile-aux-singes", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quêtes secondaires Retrouver le sac à dos sur l'île aux singes. Déclencheur : l' aventurière au sud de l'Île aux singes, un peu à l'est de la taverne (« S'il vous plaît, aidez-moi ! »). Accepte ou refuse : dans les deux cas, elle te guide ensuite vers un raccourci à travers la rivière, qui reste ouvert ensuite. Étapes : Va tout au nord-est de l'île : un groupe de singes t'attaque (combat obligatoire : 1 gorille + 7 singes chapardeurs ). Le gorille s'enfuit pendant le combat. Victoire : tu récupères le Sac à dos et le gorille laisse tomber une Pierre en forme d'oeil (indispensable pour la quête suivante). Rapporte le sac à l'aventurière. Récompense : 500 XP . Le combat du nord-est a lieu même sans avoir accepté la quête : tu obtiens quand même le sac et la pierre.", "sol": 0}, {"titre": "Calmer la faune de l'île aux singes.", "html": "<ul><li><strong>Déclencheur :</strong> au <strong>nord-ouest</strong> de l'Île aux singes se trouvent <strong>trois totems</strong> (bleu, rouge, vert) et une <strong>statue de gorille</strong> qui bloque l'entrée d'une arène. La quête entre au journal quand tu entres dans l'arène.</li><li><strong>Énigme des totems :</strong> interagis avec un totem pour le faire pivoter d'un quart de tour ; chaque nouvelle orientation fait un « BOOM » différent. Dans certaines zones de l'île, tu entends les mêmes « BOOM » : ce sont les indices des bonnes orientations.</li></ul><p><strong>Solution :</strong> totem <strong>bleu tourné vers l'Ouest</strong>, totem <strong>rouge vers le Sud</strong>, totem <strong>vert vers l'Est</strong>. Depuis la position de départ (bleu au Sud, rouge à l'Est, vert au Nord), il suffit d'interagir <strong>3 fois avec chacun des trois totems</strong>.</p><ul><li>Ensuite, interagis avec la <strong>statue de gorille</strong> en ayant la <strong>Pierre en forme d'oeil</strong> (obtenue dans la quête du sac à dos). La statue glisse et ouvre l'arène.<ul><li>Totems mal orientés : « Non, ça ne doit pas être ça…. »</li><li>Pas de pierre : « Il manque quelque chose, on dirait qu'il manque un oeil… »</li></ul></li><li><strong>Mini-boss : Gorille en colère</strong> (500 PV). Sous <strong>50 % de ses PV</strong>, il enrage et frappe beaucoup plus fort (attaque 50 → 80) : garde des soins (bières) pour la seconde moitié.</li><li><strong>Récompense :</strong> <strong>1000 XP</strong> (+1500 XP du combat). Les singes de l'île deviennent paisibles et ne te volent plus d'or.</li></ul>", "id": "c1-calmer-la-faune-de-l-ile-aux-singes", "texte": "Chapitre 1 À la recherche de gloire et de richesse Quêtes secondaires Calmer la faune de l'île aux singes. Déclencheur : au nord-ouest de l'Île aux singes se trouvent trois totems (bleu, rouge, vert) et une statue de gorille qui bloque l'entrée d'une arène. La quête entre au journal quand tu entres dans l'arène. Énigme des totems : interagis avec un totem pour le faire pivoter d'un quart de tour ; chaque nouvelle orientation fait un « BOOM » différent. Dans certaines zones de l'île, tu entends les mêmes « BOOM » : ce sont les indices des bonnes orientations. Solution : totem bleu tourné vers l'Ouest , totem rouge vers le Sud , totem vert vers l'Est . Depuis la position de départ (bleu au Sud, rouge à l'Est, vert au Nord), il suffit d'interagir 3 fois avec chacun des trois totems . Ensuite, interagis avec la statue de gorille en ayant la Pierre en forme d'oeil (obtenue dans la quête du sac à dos). La statue glisse et ouvre l'arène. Totems mal orientés : « Non, ça ne doit pas être ça…. » Pas de pierre : « Il manque quelque chose, on dirait qu'il manque un oeil… » Mini-boss : Gorille en colère (500 PV). Sous 50 % de ses PV , il enrage et frappe beaucoup plus fort (attaque 50 → 80) : garde des soins (bières) pour la seconde moitié. Récompense : 1000 XP (+1500 XP du combat). Les singes de l'île deviennent paisibles et ne te volent plus d'or.", "sol": 1}]}, {"titre": "Mini-jeux", "intro": "", "entrees": [{"titre": "L'œil menteur (dés de la taverne de l'Île au crabe)", "html": "<ul><li><strong>Où :</strong> taverne de l'Île au crabe, « Jouer aux dés ».</li><li><strong>Règles (variante du Liar's Dice) :</strong> 4 joueurs (toi, Pipette la Poche, Nina Pas-de-Chance, Cristobald l'indécis), 3 à 5 dés chacun sous un gobelet. Chacun à son tour annonce un nombre de dés et une valeur (« au moins 4 dés montrent 5 »). Pour surenchérir, augmente la quantité à valeur égale, ou garde la quantité et monte la valeur. Les <strong>« yeux » (le 1) sont des jokers</strong>. Crier <strong>« Menteur ! »</strong> révèle les dés : si l'enchère tient, l'accusateur perd un dé, sinon c'est l'annonceur. Le dernier à avoir des dés gagne.</li><li><strong>Mise maximale ici :</strong> 10 écus (3 dés), 15 (4 dés), 20 (5 dés).</li><li><strong>Gains :</strong> 1er = <strong>3 fois la mise</strong>, 2e = mise remboursée, 3e = 60 % de la mise, 4e = rien.</li><li><strong>Astuce :</strong> pour une valeur de 2 à 6, compte en moyenne <strong>un tiers</strong> des dés en jeu (la valeur + les jokers), un sixième seulement pour les « yeux ». Au-delà, crie « Menteur ! ».</li><li>Attention : pendant l'arc de Morro, le tavernier refuse de te faire miser sous 10 écus (chambre à payer).</li></ul>", "id": "c1-l-il-menteur-des-de-la-taverne-de-l-ile-au-crabe", "texte": "Chapitre 1 À la recherche de gloire et de richesse Mini-jeux L'œil menteur (dés de la taverne de l'Île au crabe) Où : taverne de l'Île au crabe, « Jouer aux dés ». Règles (variante du Liar's Dice) : 4 joueurs (toi, Pipette la Poche, Nina Pas-de-Chance, Cristobald l'indécis), 3 à 5 dés chacun sous un gobelet. Chacun à son tour annonce un nombre de dés et une valeur (« au moins 4 dés montrent 5 »). Pour surenchérir, augmente la quantité à valeur égale, ou garde la quantité et monte la valeur. Les « yeux » (le 1) sont des jokers . Crier « Menteur ! » révèle les dés : si l'enchère tient, l'accusateur perd un dé, sinon c'est l'annonceur. Le dernier à avoir des dés gagne. Mise maximale ici : 10 écus (3 dés), 15 (4 dés), 20 (5 dés). Gains : 1er = 3 fois la mise , 2e = mise remboursée, 3e = 60 % de la mise, 4e = rien. Astuce : pour une valeur de 2 à 6, compte en moyenne un tiers des dés en jeu (la valeur + les jokers), un sixième seulement pour les « yeux ». Au-delà, crie « Menteur ! ». Attention : pendant l'arc de Morro, le tavernier refuse de te faire miser sous 10 écus (chambre à payer).", "sol": 0}, {"titre": "Descente de la rivière (Île aux singes)", "html": "<ul><li><strong>Où :</strong> au <strong>nord-est</strong> de l'Île aux singes, au bord de la rivière. Elle te ramène au sud-est de l'île. Obligatoire la première fois pour passer sur la rive est ; ensuite, le raccourci montré par l'aventurière permet de l'éviter.</li><li><strong>Règles :</strong> survis <strong>60 secondes</strong> en barque. Flèches ou <strong>Q / D</strong> pour virer, <strong>Espace</strong> pour un écart brusque (recharge 0,85 s). La barque a <strong>4 points de vie</strong> ; troncs, tonneaux et rochers en retirent un (1 s d'invulnérabilité après chaque choc). Trois phases : Eaux calmes, Rapides (à 20 s), Dernière ligne droite (à 45 s).</li><li><strong>Bonus :</strong> chaque <strong>pièce</strong> ramassée = <strong>+1 écu</strong> (gardé seulement en cas de réussite) ; toutes les 5 pièces, +1 PV ; les objets de soin rendent 1 PV.</li><li><strong>En cas d'échecs :</strong> après <strong>3 naufrages</strong>, l'option <strong>« Descendre les yeux fermés »</strong> te fait arriver en bas sans jouer (mais sans or).</li></ul>", "id": "c1-descente-de-la-riviere-ile-aux-singes", "texte": "Chapitre 1 À la recherche de gloire et de richesse Mini-jeux Descente de la rivière (Île aux singes) Où : au nord-est de l'Île aux singes, au bord de la rivière. Elle te ramène au sud-est de l'île. Obligatoire la première fois pour passer sur la rive est ; ensuite, le raccourci montré par l'aventurière permet de l'éviter. Règles : survis 60 secondes en barque. Flèches ou Q / D pour virer, Espace pour un écart brusque (recharge 0,85 s). La barque a 4 points de vie ; troncs, tonneaux et rochers en retirent un (1 s d'invulnérabilité après chaque choc). Trois phases : Eaux calmes, Rapides (à 20 s), Dernière ligne droite (à 45 s). Bonus : chaque pièce ramassée = +1 écu (gardé seulement en cas de réussite) ; toutes les 5 pièces, +1 PV ; les objets de soin rendent 1 PV. En cas d'échecs : après 3 naufrages , l'option « Descendre les yeux fermés » te fait arriver en bas sans jouer (mais sans or).", "sol": 0}, {"titre": "Pêche (après le générique)", "html": "<ul><li><strong>Où :</strong> le ponton à l'<strong>ouest</strong> de l'Île au crabe, une fois l'apprentissage du pêcheur réussi. Touche <strong>F</strong> pour lancer.</li><li><strong>Règles :</strong> attends le point d'exclamation (entre 1 et 15 s), puis reproduis la combinaison de flèches affichée en <strong>2 secondes</strong>.<ul><li><strong>Bar argenté :</strong> ↑ ↓ ← →</li><li><strong>Poisson plat :</strong> → → ← ←</li><li><strong>Maquereau :</strong> ← ← → →</li></ul></li><li>Une fois sur 80, un <strong>singe</strong> surgit avec une combinaison aléatoire et te taxe un poisson (ou de l'or).</li><li><strong>Que faire des poissons (chez le pêcheur) :</strong> bars argentés → <strong>Filets de poisson fameux</strong> (soin en combat), poissons plats → <strong>Poissons de lancer</strong> pour les deux cons, maquereaux → <strong>1 écu</strong> pièce. Le contremaître du port rachète aussi les bars (3 écus) et poissons plats (2 écus).</li></ul>", "id": "c1-peche-apres-le-generique", "texte": "Chapitre 1 À la recherche de gloire et de richesse Mini-jeux Pêche (après le générique) Où : le ponton à l' ouest de l'Île au crabe, une fois l'apprentissage du pêcheur réussi. Touche F pour lancer. Règles : attends le point d'exclamation (entre 1 et 15 s), puis reproduis la combinaison de flèches affichée en 2 secondes . Bar argenté : ↑ ↓ ← → Poisson plat : → → ← ← Maquereau : ← ← → → Une fois sur 80, un singe surgit avec une combinaison aléatoire et te taxe un poisson (ou de l'or). Que faire des poissons (chez le pêcheur) : bars argentés → Filets de poisson fameux (soin en combat), poissons plats → Poissons de lancer pour les deux cons, maquereaux → 1 écu pièce. Le contremaître du port rachète aussi les bars (3 écus) et poissons plats (2 écus).", "sol": 0}, {"titre": "Combat tutoriel de la taverne", "html": "<p>Obligatoire (voir quête principale). Ce combat sert de didacticiel : suis les indications à l'écran.</p>", "id": "c1-combat-tutoriel-de-la-taverne", "texte": "Chapitre 1 À la recherche de gloire et de richesse Mini-jeux Combat tutoriel de la taverne Obligatoire (voir quête principale). Ce combat sert de didacticiel : suis les indications à l'écran.", "sol": 0}]}, {"titre": "À ne pas rater", "intro": "", "entrees": [{"titre": "À ne pas rater", "html": "<p><strong>Objets et trésors</strong></p><ul><li><strong>Ciseaux argentés</strong> (+10 en attaque) : coffre de la seconde salle du temple de l'Île aux singes. Équipe-les avant le Héraut.</li><li><strong>Coffre du Héraut</strong> (15 écus + 3 bières + 2 rhums) : n'apparaît qu'après la victoire contre le boss, dans sa salle.</li><li><strong>Morro-Blanco</strong> : trou à 2 écus près de la pierre-tonneau (nord-est), maisonnette en ruine (1 bière + 1 rhum).</li><li><strong>L'ivrogne du chantier</strong> : après <strong>10 bières données au total</strong> (à n'importe quel moment du jeu), il te rend <strong>100 écus</strong> d'un coup (une seule fois). Une bière coûte 2 écus : bénéfice net de 80 écus.</li><li><strong>Pierre en forme d'oeil</strong> : obtenue au combat des singes du nord-est, seule clé de l'arène du gorille.</li></ul><p><strong>Or volé par les singes (Île aux singes)</strong> Tant que le Gorille en colère n'est pas vaincu, des singes surgissent dans les zones du centre et du nord et te volent <strong>1 écu à chaque contact</strong>. Pour tout récupérer : va dans la zone des <strong>bananes</strong>, à l'<strong>est</strong> de l'île (au centre-est), et bats les <strong>5 singes</strong> qui t'y attendent : tu récupères exactement ce qui t'a été volé. Le bouton « Indice » du journal le rappelle (« cherchez les bananes ! »).</p><p><strong>Rien n'est définitivement manquable dans ce chapitre</strong> : l'Île au crabe, Morro-Blanco, l'Île aux singes, le temple et l'Île aux Pommes restent accessibles plus tard. Seuls l'échantillon de torche (souterrain) et les outils de navigation (boussole, graphomètre) disparaissent, c'est prévu par l'histoire.</p><p><strong>Le mendiant (Île au crabe)</strong> : chaque fois que tu débarques sur l'Île au crabe depuis la carte, un mendiant vient te demander une pièce. Les dons ne rapportent rien, sauf le succès <strong>« Un homme en or »</strong> à 151 écus donnés au total (les dons comptent pour toute la partie).</p><p><strong>Succès liés au chapitre</strong></p><ul><li><strong>Tout est bien qui commence mal</strong> : terminer le chapitre 1.</li><li><strong>L'homme à tout faire</strong> : les 4 quêtes secondaires de ce chapitre (lampes, pirate roux, sac à dos, faune de l'île aux singes) en font partie.</li><li><strong>De toute façon j'sais pas lire</strong> : le Journal de bord de Morro-Blanco est le premier des 4 journaux à trouver.</li><li><strong>DÉGAGEZ</strong> (500 mouettes) : les mouettes des plages du sud de l'Île au crabe s'envolent quand tu passes dessus.</li><li><strong>Un homme éclairé</strong> : acheter toutes les torches. Le vendeur de l'Île aux singes est le premier marchand de torches.</li><li><strong>Un homme en or</strong> : voir le mendiant ci-dessus.</li></ul>", "id": "c1-a-ne-pas-rater", "texte": "Chapitre 1 À la recherche de gloire et de richesse À ne pas rater À ne pas rater Objets et trésors Ciseaux argentés (+10 en attaque) : coffre de la seconde salle du temple de l'Île aux singes. Équipe-les avant le Héraut. Coffre du Héraut (15 écus + 3 bières + 2 rhums) : n'apparaît qu'après la victoire contre le boss, dans sa salle. Morro-Blanco : trou à 2 écus près de la pierre-tonneau (nord-est), maisonnette en ruine (1 bière + 1 rhum). L'ivrogne du chantier : après 10 bières données au total (à n'importe quel moment du jeu), il te rend 100 écus d'un coup (une seule fois). Une bière coûte 2 écus : bénéfice net de 80 écus. Pierre en forme d'oeil : obtenue au combat des singes du nord-est, seule clé de l'arène du gorille. Or volé par les singes (Île aux singes) Tant que le Gorille en colère n'est pas vaincu, des singes surgissent dans les zones du centre et du nord et te volent 1 écu à chaque contact . Pour tout récupérer : va dans la zone des bananes , à l' est de l'île (au centre-est), et bats les 5 singes qui t'y attendent : tu récupères exactement ce qui t'a été volé. Le bouton « Indice » du journal le rappelle (« cherchez les bananes ! »). Rien n'est définitivement manquable dans ce chapitre : l'Île au crabe, Morro-Blanco, l'Île aux singes, le temple et l'Île aux Pommes restent accessibles plus tard. Seuls l'échantillon de torche (souterrain) et les outils de navigation (boussole, graphomètre) disparaissent, c'est prévu par l'histoire. Le mendiant (Île au crabe) : chaque fois que tu débarques sur l'Île au crabe depuis la carte, un mendiant vient te demander une pièce. Les dons ne rapportent rien, sauf le succès « Un homme en or » à 151 écus donnés au total (les dons comptent pour toute la partie). Succès liés au chapitre Tout est bien qui commence mal : terminer le chapitre 1. L'homme à tout faire : les 4 quêtes secondaires de ce chapitre (lampes, pirate roux, sac à dos, faune de l'île aux singes) en font partie. De toute façon j'sais pas lire : le Journal de bord de Morro-Blanco est le premier des 4 journaux à trouver. DÉGAGEZ (500 mouettes) : les mouettes des plages du sud de l'Île au crabe s'envolent quand tu passes dessus. Un homme éclairé : acheter toutes les torches. Le vendeur de l'Île aux singes est le premier marchand de torches. Un homme en or : voir le mendiant ci-dessus.", "sol": 0}]}]}], "en": [{"id": "c1", "num": "Chapter 1", "titre": "In search of glory and riches", "intro": "<p>Captain Barbe-Yeux lands on Crab Island with the Two Numpties, determined to get his hands on a Mayan treasure. An old tavern parchment sends him to Morro-Blanco, then to Monkey Island and Apple Island, on the trail of the mysterious Bolon Tiku. Not everything will go according to plan.</p><p><strong>Locations in this chapter:</strong> Crab Island (start), Morro-Blanco (and its underground), Monkey Island (jungle, temple), Apple Island.</p><p><strong>Useful controls:</strong> right click, arrow keys or WASD to move; <strong>T</strong> key (by default) to light your torch. In the quest journal, a <strong>“Hint”</strong> button appears next to the objective when you are stuck on certain puzzles (compass, Morro lookout, gold stolen by the monkeys).</p>", "sections": [{"titre": "Main quest", "intro": "", "entrees": [{"titre": "Go to the tavern.", "html": "<ol><li>After the introduction on the beach (west of the island), walk east to the <strong>tavern</strong> (centre-west of the island, “Tavern” sign).</li><li>In the innkeeper's menu, choose <strong>“I'm after crucial information to get rich.”</strong> then answer <strong>“Yes.”</strong>. He gives you the <strong>Parchment</strong> (with three holes in it).</li><li>Your answer starts a brawl: this is the <strong>tutorial fight</strong> against the innkeeper and three customers. Win it (the game explains the controls). After this victory, the innkeeper restores your HP and energy on every visit.</li></ol><aside class=\"note\"><p>You cannot leave the island by boat until this fight is done. Other cheeky answers (“Listen here, sunshine…”, insisting on a coffee 4 times, asking for a beer on credit) lead to the same fight.</p></aside>", "id": "c1-se-rendre-a-la-taverne", "texte": "Chapter 1 In search of glory and riches Main quest Go to the tavern. After the introduction on the beach (west of the island), walk east to the tavern (centre-west of the island, “Tavern” sign). In the innkeeper's menu, choose “I'm after crucial information to get rich.” then answer “Yes.” . He gives you the Parchment (with three holes in it). Your answer starts a brawl: this is the tutorial fight against the innkeeper and three customers. Win it (the game explains the controls). After this victory, the innkeeper restores your HP and energy on every visit. You cannot leave the island by boat until this fight is done. Other cheeky answers (“Listen here, sunshine…”, insisting on a coffee 4 times, asking for a beer on credit) lead to the same fight.", "sol": 0}, {"titre": "Find clues about the parchment.", "html": "<ol><li>Go to the <strong>shipyard</strong>, in the centre of the island (north-east of the tavern). A drunk is mumbling there.</li><li>Choose <strong>“Show the parchment.”</strong>: he recognises <strong>Morro-Blanco</strong> (“Information obtained!”).</li></ol><aside class=\"note\"><p>The “What?” / “Yes” menus with the drunk lead nowhere.</p></aside>", "id": "c1-trouver-des-indices-sur-le-parchemin", "texte": "Chapter 1 In search of glory and riches Main quest Find clues about the parchment. Go to the shipyard , in the centre of the island (north-east of the tavern). A drunk is mumbling there. Choose “Show the parchment.” : he recognises Morro-Blanco (“Information obtained!”). The “What?” / “Yes” menus with the drunk lead nowhere.", "sol": 0}, {"titre": "Find a compass to leave this island.", "html": "<ol><li>Go to the <strong>harbor</strong>, south-east of the island, talk to the foreman and choose <strong>“Wouldn't you have the same thing but cheaper?”</strong>. He tells you a drunk stole his compass.</li><li>You need <strong>2 gold coins</strong> for a beer. There are exactly two coins on the island:<ul><li><strong>1 coin</strong> in the chest of the <strong>cave to the north</strong> of the island (see <em>The King of Crabs</em> below);</li><li><strong>1 coin</strong> buried: first pick up the <strong>Shovel</strong> in the north-west (below the cave, next to a skull; just walk over it), then go to the <strong>north-east</strong> of the island, above a palm tree and left of some flowers, and <strong>use the shovel</strong> from the inventory while standing on the hole.</li></ul></li><li>At the tavern, buy <strong>a beer</strong> (2 coins).</li><li>Go back to the shipyard and choose <strong>“Give a beer”</strong>: the drunk “lends” you the <strong>Compass</strong>.</li></ol><p><strong>Solution:</strong> 1 coin (north cave chest) + 1 coin (shovel, hole in the north-east) → 1 beer at the tavern → give it to the shipyard drunk = Compass.</p><aside class=\"note\"><p>The harbor shop also sells a compass for 3 coins, but there are only 2 coins on the island at this point: the beer is the only way. Use the compass from the inventory to show your <strong>X:… Y:…</strong> coordinates in the top-left corner.</p></aside><h5>The King of Crabs (north cave of Crab Island)</h5><p>Enter the cave at the very north of the island. The King of Crabs has only 5 HP: one attack is enough. The chest holds <strong>1 gold coin</strong>. If you come back later, you can stay and listen to the cave's music.</p>", "id": "c1-trouver-une-boussole-pour-quitter-cette-ile", "texte": "Chapter 1 In search of glory and riches Main quest Find a compass to leave this island. Go to the harbor , south-east of the island, talk to the foreman and choose “Wouldn't you have the same thing but cheaper?” . He tells you a drunk stole his compass. You need 2 gold coins for a beer. There are exactly two coins on the island: 1 coin in the chest of the cave to the north of the island (see The King of Crabs below); 1 coin buried: first pick up the Shovel in the north-west (below the cave, next to a skull; just walk over it), then go to the north-east of the island, above a palm tree and left of some flowers, and use the shovel from the inventory while standing on the hole. At the tavern, buy a beer (2 coins). Go back to the shipyard and choose “Give a beer” : the drunk “lends” you the Compass . Solution: 1 coin (north cave chest) + 1 coin (shovel, hole in the north-east) → 1 beer at the tavern → give it to the shipyard drunk = Compass. The harbor shop also sells a compass for 3 coins, but there are only 2 coins on the island at this point: the beer is the only way. Use the compass from the inventory to show your X:… Y:… coordinates in the top-left corner. The King of Crabs (north cave of Crab Island) Enter the cave at the very north of the island. The King of Crabs has only 5 HP: one attack is enough. The chest holds 1 gold coin . If you come back later, you can stay and listen to the cave's music.", "sol": 1}, {"titre": "Go to Morro-Blanco.", "html": "<ol><li>Go to the <strong>boat</strong> (west beach, where you arrived) and choose <strong>“Board”</strong>. On the world map, click <strong>Morro Blanco Island</strong>.</li><li>When you arrive, a red-haired pirate calls out to you and the game walks you over to him: you automatically accept his side quest (see <em>The treasure of the fire-haired pirate</em>).</li></ol>", "id": "c1-se-rendre-sur-morro-blanco", "texte": "Chapter 1 In search of glory and riches Main quest Go to Morro-Blanco. Go to the boat (west beach, where you arrived) and choose “Board” . On the world map, click Morro Blanco Island . When you arrive, a red-haired pirate calls out to you and the game walks you over to him: you automatically accept his side quest (see The treasure of the fire-haired pirate ).", "sol": 0}, {"titre": "Solve the parchment's riddle.", "html": "<p>Three steps: the log, the graphometer, the lookout.</p><ol><li><strong>Ship's log</strong>: at the very <strong>north</strong> of Morro-Blanco, in an abandoned camp, a skeleton carries a notebook (“What's that on this skeleton?”). Pick it up. It says the “White Tooth” can be read from a high point, and that the graphometer is hidden in the barrel-shaped rock.</li><li><strong>Graphometer</strong>: in the <strong>north-east</strong> of the island, search the <strong>barrel-shaped rock</strong> (“Search” action). You can only search it <strong>once you have the log</strong>. Right next to it there is also a visible hole to dig with the shovel: <strong>2 gold coins</strong>.</li><li><strong>The lookout</strong>: in the <strong>centre</strong> of the island, interact with the lookout (“Climb to the top”). At the top you see the panoramic landscape (<strong>&lt; &gt;</strong> arrows to scroll the view).<ul><li>Click <strong>“Use the graphometer”</strong>: a numbered grid appears. The numbers <strong>along the top</strong> give the <strong>latitude (Y)</strong>, the ones <strong>on the far right</strong> give the <strong>longitude (X)</strong>.</li><li>Click <strong>“Use the parchment”</strong>, then set its zoom to <strong>about 145%</strong> (between 140 and 150%; <strong>+ / –</strong> buttons or mouse wheel) and drag it with the mouse.</li><li>Place the <strong>small hole in the top-right corner</strong> of the parchment on the square <strong>column 117 / row 170</strong>. At that point the parchment's cut-outs (the volcano, the wreck and the hut) line up exactly with the landscape, and a <strong>sparkling sound</strong> confirms the right position.</li></ul></li></ol><p><strong>Solution:</strong> parchment at ~145%, small top-right hole on square 117 (top) / 170 (right) → <strong>latitude Y = 117, longitude X = 170</strong>.</p><ol><li><strong>Dig</strong>: climb down (“Go down” button), activate the <strong>Compass</strong> from the inventory and walk to the <strong>east</strong> of the island until you read <strong>X:170 Y:117</strong>. Use the <strong>Shovel</strong> exactly on that square (otherwise the game says “You have to dig in exactly the right spot.”). The ground gives way…</li></ol><p><strong>Solution:</strong> dig with the shovel exactly at <strong>X:170 Y:117</strong> (east of Morro-Blanco).</p><aside class=\"note\"><p>You can also search the <strong>ruined hut</strong> east of the island's centre, standing right against the wall: <strong>1 beer + 1 rum</strong> (once only).</p></aside>", "id": "c1-resoudre-l-enigme-du-parchemin", "texte": "Chapter 1 In search of glory and riches Main quest Solve the parchment's riddle. Three steps: the log, the graphometer, the lookout. Ship's log : at the very north of Morro-Blanco, in an abandoned camp, a skeleton carries a notebook (“What's that on this skeleton?”). Pick it up. It says the “White Tooth” can be read from a high point, and that the graphometer is hidden in the barrel-shaped rock. Graphometer : in the north-east of the island, search the barrel-shaped rock (“Search” action). You can only search it once you have the log . Right next to it there is also a visible hole to dig with the shovel: 2 gold coins . The lookout : in the centre of the island, interact with the lookout (“Climb to the top”). At the top you see the panoramic landscape ( < > arrows to scroll the view). Click “Use the graphometer” : a numbered grid appears. The numbers along the top give the latitude (Y) , the ones on the far right give the longitude (X) . Click “Use the parchment” , then set its zoom to about 145% (between 140 and 150%; + / – buttons or mouse wheel) and drag it with the mouse. Place the small hole in the top-right corner of the parchment on the square column 117 / row 170 . At that point the parchment's cut-outs (the volcano, the wreck and the hut) line up exactly with the landscape, and a sparkling sound confirms the right position. Solution: parchment at ~145%, small top-right hole on square 117 (top) / 170 (right) → latitude Y = 117, longitude X = 170 . Dig : climb down (“Go down” button), activate the Compass from the inventory and walk to the east of the island until you read X:170 Y:117 . Use the Shovel exactly on that square (otherwise the game says “You have to dig in exactly the right spot.”). The ground gives way… Solution: dig with the shovel exactly at X:170 Y:117 (east of Morro-Blanco). You can also search the ruined hut east of the island's centre, standing right against the wall: 1 beer + 1 rum (once only).", "sol": 2}, {"titre": "Get out of the underground.", "html": "<ol><li>You fall into a dark room. Barbe-Yeux realises he has <strong>broken the compass and the graphometer</strong> (that's normal, you no longer need them).</li><li>On the right of the room, a torch seller is looking for his mahogany torch: talk to him and he gives you a <strong>Mahogany torch sample</strong>. Light it with <strong>T</strong>.</li><li>While crossing the room, you have to fight <strong>4 Morro skeletons</strong> (mandatory fight, no escape).</li><li>Take the exit <strong>at the top</strong> of the room to go up to the medallion room.</li><li>In the centre of that room, a mechanism of <strong>rings</strong> (a centre + 4 rings) carries arrows. Walk up to it and use “Turn the rings”. Each click rotates that piece one notch clockwise. <strong>All the arrows must point north.</strong></li></ol><p><strong>Solution (from the starting position):</strong></p><ul><li><strong>“Rotate the center”: 1 time</strong></li><li><strong>“Rotate ring 1”: 6 times</strong></li><li><strong>“Rotate ring 2”: 7 times</strong></li><li><strong>“Rotate ring 3”: 2 times</strong></li><li><strong>“Rotate ring 4”: 3 times</strong></li></ul><ol><li>The ceiling opens and <strong>the room fills with water</strong> (“do something!”): you have <strong>15 seconds</strong> (the water rises at 5 s, then at 10 s). Run <strong>to the top of the room</strong> and interact: <strong>“Retrieve the medallion”</strong>.</li><li>You float back up and wash ashore on Morro-Blanco with the <strong>Bolon Tiku medallion</strong>. The torch sample disappears.</li></ol><aside class=\"note\"><p>If you drown, you simply start again from the room's entrance: the rings stay solved, you just need to run to the medallion faster.</p></aside>", "id": "c1-sortir-du-souterrain", "texte": "Chapter 1 In search of glory and riches Main quest Get out of the underground. You fall into a dark room. Barbe-Yeux realises he has broken the compass and the graphometer (that's normal, you no longer need them). On the right of the room, a torch seller is looking for his mahogany torch: talk to him and he gives you a Mahogany torch sample . Light it with T . While crossing the room, you have to fight 4 Morro skeletons (mandatory fight, no escape). Take the exit at the top of the room to go up to the medallion room. In the centre of that room, a mechanism of rings (a centre + 4 rings) carries arrows. Walk up to it and use “Turn the rings”. Each click rotates that piece one notch clockwise. All the arrows must point north. Solution (from the starting position): “Rotate the center”: 1 time “Rotate ring 1”: 6 times “Rotate ring 2”: 7 times “Rotate ring 3”: 2 times “Rotate ring 4”: 3 times The ceiling opens and the room fills with water (“do something!”): you have 15 seconds (the water rises at 5 s, then at 10 s). Run to the top of the room and interact: “Retrieve the medallion” . You float back up and wash ashore on Morro-Blanco with the Bolon Tiku medallion . The torch sample disappears. If you drown, you simply start again from the room's entrance: the rings stay solved, you just need to run to the medallion faster.", "sol": 1}, {"titre": "Go back to the tavern.", "html": "<ol><li>Take the boat again (near where you arrived, south-west of Morro-Blanco) and sail back to <strong>Crab Island</strong>.</li><li>At the tavern, the innkeeper insists you take a room: choose <strong>“Okay.”</strong> (<strong>10 gold coins</strong>). If you refuse, he sulks: the <strong>“Pay for a room (10 gold coins).”</strong> option stays in his menu.</li><li>He sends you to see the harbor foreman.</li></ol><aside class=\"note\"><p>As soon as you set foot on Morro-Blanco, the game <strong>sets aside 10 gold coins</strong> for this room: shops, dice and the beggar won't let you go below 10 coins. The red-haired pirate's chest (10 coins) is enough to pay for it.</p></aside>", "id": "c1-retourner-a-la-taverne", "texte": "Chapter 1 In search of glory and riches Main quest Go back to the tavern. Take the boat again (near where you arrived, south-west of Morro-Blanco) and sail back to Crab Island . At the tavern, the innkeeper insists you take a room: choose “Okay.” ( 10 gold coins ). If you refuse, he sulks: the “Pay for a room (10 gold coins).” option stays in his menu. He sends you to see the harbor foreman. As soon as you set foot on Morro-Blanco, the game sets aside 10 gold coins for this room: shops, dice and the beggar won't let you go below 10 coins. The red-haired pirate's chest (10 coins) is enough to pay for it.", "sol": 0}, {"titre": "Talk to the harbor foreman.", "html": "<p>Go to the harbor (south-east of Crab Island). Barbe-Yeux tells him about the Bolon Tiku: the foreman mentions a <strong>sealed temple in the jungle</strong>. <strong>Monkey Island</strong> is unlocked on the map.</p>", "id": "c1-parler-a
