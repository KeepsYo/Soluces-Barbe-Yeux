。 報酬： 10 000 EXP。", "sol": 0}, {"titre": "のちに：大掃除", "html": "<p>村長がこのクエストを依頼してくるのは、この章よりずっとあと、カニ島の酒場の主人がその話をしてから（第5章のあと）です。第2章には含まれません。</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "第2章 向かい風 サブクエスト のちに：大掃除 村長がこのクエストを依頼してくるのは、この章よりずっとあと、カニ島の酒場の主人がその話をしてから（第5章のあと）です。第2章には含まれません。", "sol": 0}]}, {"titre": "ミニゲーム", "intro": "", "entrees": [{"titre": "クーリルー釣り", "html": "<ul><li><strong>場所：</strong> 村の南、小舟の東にある小さな桟橋。「クーリルーの秘密を暴く」のあとで利用できます。</li><li><strong>ルール：</strong> カニ島の釣りと同じです。アタリが来たら、表示された矢印の組み合わせを制限時間内に入力します。クーリルーは <strong>左、上、右、下</strong> です。</li><li>ここで最初に釣れるのは必ずクーリルーです。以後は2回に1回がクーリルーで、それ以外は普通の魚（銀色のスズキ、ヒラメ、サバ……）です。</li><li><strong>報酬：</strong> クーリルーは漁師のところで1匹につきクーリルーの脂1つと交換できます。クーリルーは実績 <strong>なんか臭わねえか？</strong>（全種類を釣る）の7種のうちのひとつです。</li></ul>", "id": "c2-peche-au-coulirou", "texte": "第2章 向かい風 ミニゲーム クーリルー釣り 場所： 村の南、小舟の東にある小さな桟橋。「クーリルーの秘密を暴く」のあとで利用できます。 ルール： カニ島の釣りと同じです。アタリが来たら、表示された矢印の組み合わせを制限時間内に入力します。クーリルーは 左、上、右、下 です。 ここで最初に釣れるのは必ずクーリルーです。以後は2回に1回がクーリルーで、それ以外は普通の魚（銀色のスズキ、ヒラメ、サバ……）です。 報酬： クーリルーは漁師のところで1匹につきクーリルーの脂1つと交換できます。クーリルーは実績 なんか臭わねえか？ （全種類を釣る）の7種のうちのひとつです。", "sol": 0}, {"titre": "嘘つきの目（酒場のサイコロ）", "html": "<ul><li><strong>場所：</strong> 風の島の酒場、「サイコロ遊びをする。」</li><li>ルールはカニ島と同じですが、相手はずる賢いミレット、脳筋のブラス＝ゴブレ、切れ者のジャン＝シャルルです。</li><li>賭け金は高めで、サイコロ3個、4個、5個に応じて最大20、30、50ゴールドです。</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "第2章 向かい風 ミニゲーム 嘘つきの目（酒場のサイコロ） 場所： 風の島の酒場、「サイコロ遊びをする。」 ルールはカニ島と同じですが、相手はずる賢いミレット、脳筋のブラス＝ゴブレ、切れ者のジャン＝シャルルです。 賭け金は高めで、サイコロ3個、4個、5個に応じて最大20、30、50ゴールドです。", "sol": 0}]}, {"titre": "見逃し厳禁", "intro": "", "entrees": [{"titre": "見逃し厳禁", "html": "<ul><li><strong>クーリルーの脂：</strong> これがないと、小舟でもイツェルの船でも島を出られません。カブラカン用にも3つ用意しておきましょう。</li><li><strong>3つ目の洞窟でのポンコツ二人組：</strong> 上の出口（石板側）から入ると、二人が肩車をしてくれる通路を通って西の台地まで上がれます。このとき二人は下に残ります。洞窟の下の入り口を通って迎えに行きましょう。二人がいないと出発できません。</li><li><strong>航海日誌</strong>（実績 <strong>どうせ字なんか読めねえし</strong> の7冊のうち2冊）：<ul><li><strong>航海日誌 III</strong>：最初の洞窟のトンネル、右上の空っぽの部屋の骸骨のそば。</li><li><strong>航海日誌 IV</strong>：石板の北の階段を上りきったところ（謎を解いたあと）。すぐ右の折れた柱の陰、高山ガイドが「私のすぐ後ろです！」と言う場所です。</li><li>拾うとすぐに読め、インベントリの書棚にしまわれます。</li></ul></li><li><strong>最初の洞窟の宝箱：</strong> マホガニーの杖（最大エネルギー+20、南東の隅、トンネル経由）、ビールとラム酒の宝箱2つ、トンネルの罠つきの宝箱。</li><li><strong>掘れる穴</strong>（第1章で手に入れたシャベルを使います）：<ul><li><strong>恐怖の眼帯</strong>（攻撃+5）：西の台地の下のほう、3つ目の洞窟の下の入り口の近く。</li><li>ゴールドが少し：西の台地の中ほどに10、西の台地の上のほう、キャンプの近くに8、東の石板の台地の下に2、小舟の南西の浜辺に1。</li></ul></li><li><strong>目に入ったヒゲ：</strong> イツェルとの決闘中に自動で正式に解禁されます。</li><li><strong>酒場：</strong> 訪れるたびにHPとエネルギーが無料で回復します。</li><li><strong>鼻かぜの船長：</strong> 彼らの「攻撃命令」は、彼らが立っているあいだ、すべての敵にバルブ・ユーを狙わせます。最優先で倒しましょう。ポンコツのどちらかが前転すると、その攻撃をそらせます。3ターンのあいだ、敵はバルブ・ユーではなくそのポンコツを狙います。</li><li><strong>たいまつ商人：</strong> 酒場のすぐ隣にいます（実績「光を極めし男」）。</li><li>取り返しのつかない要素はありません。風の島はこの章のあとも訪れることができます。</li><li><strong>この章の実績：</strong> <strong>熱中症</strong>（第2章をクリアする）。</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "第2章 向かい風 見逃し厳禁 見逃し厳禁 クーリルーの脂： これがないと、小舟でもイツェルの船でも島を出られません。カブラカン用にも3つ用意しておきましょう。 3つ目の洞窟でのポンコツ二人組： 上の出口（石板側）から入ると、二人が肩車をしてくれる通路を通って西の台地まで上がれます。このとき二人は下に残ります。洞窟の下の入り口を通って迎えに行きましょう。二人がいないと出発できません。 航海日誌 （実績 どうせ字なんか読めねえし の7冊のうち2冊）： 航海日誌 III ：最初の洞窟のトンネル、右上の空っぽの部屋の骸骨のそば。 航海日誌 IV ：石板の北の階段を上りきったところ（謎を解いたあと）。すぐ右の折れた柱の陰、高山ガイドが「私のすぐ後ろです！」と言う場所です。 拾うとすぐに読め、インベントリの書棚にしまわれます。 最初の洞窟の宝箱： マホガニーの杖（最大エネルギー+20、南東の隅、トンネル経由）、ビールとラム酒の宝箱2つ、トンネルの罠つきの宝箱。 掘れる穴 （第1章で手に入れたシャベルを使います）： 恐怖の眼帯 （攻撃+5）：西の台地の下のほう、3つ目の洞窟の下の入り口の近く。 ゴールドが少し：西の台地の中ほどに10、西の台地の上のほう、キャンプの近くに8、東の石板の台地の下に2、小舟の南西の浜辺に1。 目に入ったヒゲ： イツェルとの決闘中に自動で正式に解禁されます。 酒場： 訪れるたびにHPとエネルギーが無料で回復します。 鼻かぜの船長： 彼らの「攻撃命令」は、彼らが立っているあいだ、すべての敵にバルブ・ユーを狙わせます。最優先で倒しましょう。ポンコツのどちらかが前転すると、その攻撃をそらせます。3ターンのあいだ、敵はバルブ・ユーではなくそのポンコツを狙います。 たいまつ商人： 酒場のすぐ隣にいます（実績「光を極めし男」）。 取り返しのつかない要素はありません。風の島はこの章のあとも訪れることができます。 この章の実績： 熱中症 （第2章をクリアする）。", "sol": 0}]}]}], "zh": [{"id": "c2", "num": "第2章", "titre": "逆风", "intro": "<p>被海上巡防队逮捕后，巴布约在监狱里醒来，隔壁住着一个怪里怪气的老囚犯。越狱之后，他（被迫）和沉默的伊策尔搭伙，扬帆前往迎风岛：那里有只怪物盘踞在悬崖顶上，把整个村子都熏得臭气熏天。</p>", "sections": [{"titre": "主线任务", "intro": "", "entrees": [{"titre": "监狱：逃出牢房（不显示目标）", "html": "<ol><li>本章从你的牢房开始，牢房在监狱的右上角。一秒钟后，老囚犯会自己跟你搭话。</li><li>他先给你 <strong>破洞羊皮纸</strong>，再给你一根 <strong>鱼刺</strong>。其余都是自动的：巴布约读羊皮纸（关闭窗口继续），用鱼刺撬开锁，牢房的门都打开了。</li><li>现在你得避开所有人的视线穿过监狱（见下面的说明）。</li></ol><p><strong>守卫的机制</strong>（大厅里有十名守卫在巡逻）：</p><ul><li>每名守卫都能看到自己前方的一个锥形区域。如果你在这个区域里待上大约 1.5 秒，他就会抓住你。墙壁会挡住视线。</li><li>如果你从守卫身边很近的地方经过（正面或侧面），他会立刻抓住你。只有他的背后是死角。</li><li>在你的牢房里是安全的。</li><li><strong>别点火把</strong>：看到亮光的守卫会离开巡逻路线朝你走来。</li><li>如果被抓住，卫兵会训你几句，然后把你送回牢房。没有其他惩罚：再来一次就行。</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "第2章 逆风 主线任务 监狱：逃出牢房（不显示目标） 本章从你的牢房开始，牢房在监狱的右上角。一秒钟后，老囚犯会自己跟你搭话。 他先给你 破洞羊皮纸 ，再给你一根 鱼刺 。其余都是自动的：巴布约读羊皮纸（关闭窗口继续），用鱼刺撬开锁，牢房的门都打开了。 现在你得避开所有人的视线穿过监狱（见下面的说明）。 守卫的机制 （大厅里有十名守卫在巡逻）： 每名守卫都能看到自己前方的一个锥形区域。如果你在这个区域里待上大约 1.5 秒，他就会抓住你。墙壁会挡住视线。 如果你从守卫身边很近的地方经过（正面或侧面），他会立刻抓住你。只有他的背后是死角。 在你的牢房里是安全的。 别点火把 ：看到亮光的守卫会离开巡逻路线朝你走来。 如果被抓住，卫兵会训你几句，然后把你送回牢房。没有其他惩罚：再来一次就行。", "sol": 0}, {"titre": "监狱：找到钥匙并出去", "html": "<ol><li>往下走到地图中间左侧的小守卫室（从下方进去）。一串钥匙挂在钥匙板上。</li><li>走到钥匙板前选择 <strong>搜索</strong>：你拿到了 <strong>万能钥匙</strong>。</li><li>去右下角的楼梯。没有钥匙的话，游戏会告诉你“你们得有钥匙才能出去。”</li><li><strong>巡逻大厅</strong>：五名守卫在这里巡逻，视线规则相同。你从西边进来，出口在东边。趁他们背对你时前进。如果在这里被抓，你会从牢房重新出发，但钥匙还在。</li><li>穿过门时，钥匙被消耗，铁栅栏在你身后关上（“这下回不了头了”）。大约十名守卫从东边进来，朝你走过来。<strong>别动，就站在入口处</strong>：在这个距离上他们看不到你。他们说完话（“是她！！！”）后，会朝东边跑走。这时你就可以穿过大厅，从东边出口出去。</li><li>最后一个房间：守卫们倒在地上。往东走，触发与陌生女子的相遇。</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "第2章 逆风 主线任务 监狱：找到钥匙并出去 往下走到地图中间左侧的小守卫室（从下方进去）。一串钥匙挂在钥匙板上。 走到钥匙板前选择 搜索 ：你拿到了 万能钥匙 。 去右下角的楼梯。没有钥匙的话，游戏会告诉你“你们得有钥匙才能出去。” 巡逻大厅 ：五名守卫在这里巡逻，视线规则相同。你从西边进来，出口在东边。趁他们背对你时前进。如果在这里被抓，你会从牢房重新出发，但钥匙还在。 穿过门时，钥匙被消耗，铁栅栏在你身后关上（“这下回不了头了”）。大约十名守卫从东边进来，朝你走过来。 别动，就站在入口处 ：在这个距离上他们看不到你。他们说完话（“是她！！！”）后，会朝东边跑走。这时你就可以穿过大厅，从东边出口出去。 最后一个房间：守卫们倒在地上。往东走，触发与陌生女子的相遇。", "sol": 0}, {"titre": "剧情战斗：陌生女子（伊策尔）", "html": "<ul><li>你和迪布勒伊船长、比雄上士并肩作战。陌生女子只攻击这两名守卫。</li><li>她不会倒下。当她的 HP 快降到零时，会回升到 500 HP（“不是这样的……”）。</li><li>两名守卫都倒下后，战斗结束。正常进行你的回合就行，结果是固定的。</li><li>之后，陌生女子介绍了自己：伊策尔，人称沉默的伊策尔。你们一起去找两个蠢蛋。</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "第2章 逆风 主线任务 剧情战斗：陌生女子（伊策尔） 你和迪布勒伊船长、比雄上士并肩作战。陌生女子只攻击这两名守卫。 她不会倒下。当她的 HP 快降到零时，会回升到 500 HP（“不是这样的……”）。 两名守卫都倒下后，战斗结束。正常进行你的回合就行，结果是固定的。 之后，陌生女子介绍了自己：伊策尔，人称沉默的伊策尔。你们一起去找两个蠢蛋。", "sol": 0}, {"titre": "重逢与伊策尔的决斗", "html": "<ol><li>伊策尔船上的自动剧情：两个蠢蛋回到船员队伍（还晒脱了一层皮）。巴布约用老囚犯说过的神圣琼浆“处理”了破洞羊皮纸……隐藏的字母显现出 <strong>迎风岛</strong>。</li><li>自动航行到迎风岛，然后忍无可忍的伊策尔向你发起决斗。</li><li><strong>对决沉默的伊策尔</strong>（剧情战斗，既不可能真正赢，也不可能真正输）：<ul><li>在下面说的解锁之前，巴布约不会倒下：他会以 1-3 HP 站着，“全靠嘴硬才没倒下”。</li><li>巴布约的 HP 一降到 40% 以下，就会永久解锁他的招牌技 <strong>胡子扎眼</strong>。这一回合里，这是唯一能用的行动：用它。</li><li>这一招不消耗能量，而是消耗巴布约剩余 HP 的 30%。两个蠢蛋各打 5 到 7 下。两个蠢蛋必须都站着。另外有一半几率，巴布约会嘲讽敌人 3 个回合：敌人会集中攻击他。</li><li>当伊策尔的 HP 降到 30%（或者她快要把你打倒时），她会用自己的招牌技回敬，连开六枪，战斗结束。</li></ul></li><li>你带着 1 HP 登上迎风岛。<strong>技巧</strong>：走进村里的酒馆就能免费恢复 HP 和能量。</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "第2章 逆风 主线任务 重逢与伊策尔的决斗 伊策尔船上的自动剧情：两个蠢蛋回到船员队伍（还晒脱了一层皮）。巴布约用老囚犯说过的神圣琼浆“处理”了破洞羊皮纸……隐藏的字母显现出 迎风岛 。 自动航行到迎风岛，然后忍无可忍的伊策尔向你发起决斗。 对决沉默的伊策尔 （剧情战斗，既不可能真正赢，也不可能真正输）： 在下面说的解锁之前，巴布约不会倒下：他会以 1-3 HP 站着，“全靠嘴硬才没倒下”。 巴布约的 HP 一降到 40% 以下，就会永久解锁他的招牌技 胡子扎眼 。这一回合里，这是唯一能用的行动：用它。 这一招不消耗能量，而是消耗巴布约剩余 HP 的 30%。两个蠢蛋各打 5 到 7 下。两个蠢蛋必须都站着。另外有一半几率，巴布约会嘲讽敌人 3 个回合：敌人会集中攻击他。 当伊策尔的 HP 降到 30%（或者她快要把你打倒时），她会用自己的招牌技回敬，连开六枪，战斗结束。 你带着 1 HP 登上迎风岛。 技巧 ：走进村里的酒馆就能免费恢复 HP 和能量。", "sol": 0}, {"titre": "寻找有用的情报。", "html": "<p><em>（子目标：向村民打听情况。）</em></p><ol><li>去村子中央的家里找 <strong>镇长</strong>。他会跟你讲盘踞在最高悬崖上的怪物、洞穴里的强盗，以及挡住山顶的古老石板机关。</li><li>主线任务 <strong>猎杀悬崖怪物</strong> 自动开始。</li><li><strong>注意：</strong> 你暂时不能离开这座岛。在小船那里，两个蠢蛋因为晒伤“现在这副状态，没法航行”。你需要一份 <strong>库利鲁油脂</strong>（见渔夫的任务：从你们第一次对话起，他就以 20 金币的价格出售）。</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "第2章 逆风 主线任务 寻找有用的情报。 （子目标：向村民打听情况。） 去村子中央的家里找 镇长 。他会跟你讲盘踞在最高悬崖上的怪物、洞穴里的强盗，以及挡住山顶的古老石板机关。 主线任务 猎杀悬崖怪物 自动开始。 注意： 你暂时不能离开这座岛。在小船那里，两个蠢蛋因为晒伤“现在这副状态，没法航行”。你需要一份 库利鲁油脂 （见渔夫的任务：从你们第一次对话起，他就以 20 金币的价格出售）。", "sol": 0}, {"titre": "登上山顶，打败怪物。", "html": "<p><em>（子目标：穿过洞穴和古老的石板机关。）</em></p><p><strong>通往石板的路：</strong></p><ol><li>爬上酒馆旁边的梯子（村子西边），穿过西边的田地。洞穴入口开在田地北边的悬崖上。在田地里、入口正下方，一位 <strong>山洞向导</strong> 会上前搭话，带你过去。让他带路就好：巴布约会自己跟着他走。他不会陪你进去，你也只会遇到他一次。</li><li><strong>悬崖洞穴</strong>：四个房间都有强盗把守（固定战斗，每场只打一次）。你会在这里找到：<ul><li><strong>渔夫夹</strong>，在左上方的房间；</li><li>一个宝箱（15 金币、2 啤酒、2 朗姆酒），在同一个房间；</li><li>一个宝箱（5 啤酒、3 朗姆酒），在中间上方，靠近通往第二个洞穴的楼梯。</li><li><strong>隧道</strong> 的入口在右上方的房间。你会到达隧道中央走廊的上端。这里有 <strong>灰盐</strong>（左上方的房间）和一个 <strong>机关宝箱</strong>（左下方的大房间；它其实是怪物“机关宝箱”：打败它可得 15 金币和 2 啤酒）。<strong>航海日志 III</strong> 放在右上方空房间正中的一具骷髅身上（从这个房间下方的楼梯上去）。隧道的下方出口会把你送到洞穴东南的一个角落，那里有一个特殊宝箱：<strong>桃花心木手杖</strong>（能量上限 +20）和 10 金币。</li></ul></li><li>走中间上方的楼梯：<strong>第二个洞穴</strong>。<strong>一桶橄榄油</strong> 在左边的房间。穿过各个房间（三群强盗），一直走到右下方的出口。出口通向岛的东北部。</li><li><strong>岛的东北部</strong>：一个渔民强盗的营地（与三名渔夫和一名渔妇的固定战斗）。<strong>加重渔网</strong> 就在这个营地里。<strong>甜海藻</strong> 就在营地南边，最东北的水边还有一份 <strong>软海藻</strong>。</li><li>从岛的上方往西走。你会来到西边的大高地（强盗营地，随机遇敌；冒险模式下逃跑必定成功）。</li><li><strong>悬崖羊皮纸（必需）</strong>：在西边高地的北部、营地附近，地上有个洞。跳下去：你会掉进第二个洞穴里一个封闭的房间（中间那个没有门的房间：这个洞是进去的唯一途径）。<strong>悬崖羊皮纸</strong> 就在那里等你。同一个房间里（右下角）的另一个洞会把你送回第一个洞穴。</li><li>沿着西边高地往下走，到高地南边 <strong>第三个洞穴</strong> 的下方入口。穿过它：出口（右上方）通往石板所在的高地。伊策尔在那里等你。</li></ol><p><strong>石板之谜</strong> <em>（子目标：破解古老的石板机关。）</em></p><p>九块石板组成一个 3 × 3 的网格：</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>你得按正确的顺序踩四块石板。和伊策尔说话：如果没有悬崖羊皮纸，她会告诉你还少了点什么。</p><p>思路：从物品栏打开 <strong>悬崖羊皮纸</strong>，然后点击 <strong>使用破洞羊皮纸</strong>。破洞羊皮纸会叠在上面，你可以拖动它。它的四个洞由一条以箭头结尾的虚线连起来。把它往左拖（大约它宽度的五分之一），再往下拖一点（大约它高度的八分之一），直到箭头末端的大洞框住左边缘的 <strong>R</strong>（B 下面那个）。这时，按虚线的顺序，几个洞里依次显示 <strong>H</strong>（起点的小洞）、<strong>J</strong>（下方的大洞）、<strong>F</strong>（右边的洞），然后是 <strong>R</strong>。任务日志的提示也印证了这一点：“最后一个字母好像是R……”</p><p><strong>解答：依次踩 H（右上），然后 J（中下），然后 F（中右），最后 R（左上）。</strong></p><ul><li>中间不要踩到其他石板：从石板之间穿过去。</li><li>踩完四块后，游戏会显示“胜利！”或“战败！”。失败后，顺序从头开始。</li><li>别磨蹭：两块石板之间超过 10 秒，这次尝试就会从你刚踩过的那块重新算起。</li><li>成功后会打开两条通道：通往山顶的楼梯（石板北边），以及直接下到村子的梯子（捷径）。两张羊皮纸已经没用了，会从你的物品栏里移除。</li></ul><p><strong>战斗准备</strong> 日志推荐：等级 18、鱼排、10 啤酒、10 朗姆酒和 3 份库利鲁油脂（能治疗灼伤）。</p><p>走上石板北边的楼梯。到了上面的废墟高地，一位 <strong>高山向导</strong> 在等你。他会告诉你“这一带最好的地方”：“就在我身后！”，然后让开。他说的是实话：<strong>航海日志 IV</strong> 就藏在楼梯顶端右侧那根断柱后面。接着，沿楼梯一直爬到东边的山顶平台。一踏上去就会开始战斗。</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "第2章 逆风 主线任务 登上山顶，打败怪物。 （子目标：穿过洞穴和古老的石板机关。） 通往石板的路： 爬上酒馆旁边的梯子（村子西边），穿过西边的田地。洞穴入口开在田地北边的悬崖上。在田地里、入口正下方，一位 山洞向导 会上前搭话，带你过去。让他带路就好：巴布约会自己跟着他走。他不会陪你进去，你也只会遇到他一次。 悬崖洞穴 ：四个房间都有强盗把守（固定战斗，每场只打一次）。你会在这里找到： 渔夫夹 ，在左上方的房间； 一个宝箱（15 金币、2 啤酒、2 朗姆酒），在同一个房间； 一个宝箱（5 啤酒、3 朗姆酒），在中间上方，靠近通往第二个洞穴的楼梯。 隧道 的入口在右上方的房间。你会到达隧道中央走廊的上端。这里有 灰盐 （左上方的房间）和一个 机关宝箱 （左下方的大房间；它其实是怪物“机关宝箱”：打败它可得 15 金币和 2 啤酒）。 航海日志 III 放在右上方空房间正中的一具骷髅身上（从这个房间下方的楼梯上去）。隧道的下方出口会把你送到洞穴东南的一个角落，那里有一个特殊宝箱： 桃花心木手杖 （能量上限 +20）和 10 金币。 走中间上方的楼梯： 第二个洞穴 。 一桶橄榄油 在左边的房间。穿过各个房间（三群强盗），一直走到右下方的出口。出口通向岛的东北部。 岛的东北部 ：一个渔民强盗的营地（与三名渔夫和一名渔妇的固定战斗）。 加重渔网 就在这个营地里。 甜海藻 就在营地南边，最东北的水边还有一份 软海藻 。 从岛的上方往西走。你会来到西边的大高地（强盗营地，随机遇敌；冒险模式下逃跑必定成功）。 悬崖羊皮纸（必需） ：在西边高地的北部、营地附近，地上有个洞。跳下去：你会掉进第二个洞穴里一个封闭的房间（中间那个没有门的房间：这个洞是进去的唯一途径）。 悬崖羊皮纸 就在那里等你。同一个房间里（右下角）的另一个洞会把你送回第一个洞穴。 沿着西边高地往下走，到高地南边 第三个洞穴 的下方入口。穿过它：出口（右上方）通往石板所在的高地。伊策尔在那里等你。 石板之谜 （子目标：破解古老的石板机关。） 九块石板组成一个 3 × 3 的网格： R T H O A F E J N 你得按正确的顺序踩四块石板。和伊策尔说话：如果没有悬崖羊皮纸，她会告诉你还少了点什么。 思路：从物品栏打开 悬崖羊皮纸 ，然后点击 使用破洞羊皮纸 。破洞羊皮纸会叠在上面，你可以拖动它。它的四个洞由一条以箭头结尾的虚线连起来。把它往左拖（大约它宽度的五分之一），再往下拖一点（大约它高度的八分之一），直到箭头末端的大洞框住左边缘的 R （B 下面那个）。这时，按虚线的顺序，几个洞里依次显示 H （起点的小洞）、 J （下方的大洞）、 F （右边的洞），然后是 R 。任务日志的提示也印证了这一点：“最后一个字母好像是R……” 解答：依次踩 H（右上），然后 J（中下），然后 F（中右），最后 R（左上）。 中间不要踩到其他石板：从石板之间穿过去。 踩完四块后，游戏会显示“胜利！”或“战败！”。失败后，顺序从头开始。 别磨蹭：两块石板之间超过 10 秒，这次尝试就会从你刚踩过的那块重新算起。 成功后会打开两条通道：通往山顶的楼梯（石板北边），以及直接下到村子的梯子（捷径）。两张羊皮纸已经没用了，会从你的物品栏里移除。 战斗准备 日志推荐：等级 18、鱼排、10 啤酒、10 朗姆酒和 3 份库利鲁油脂（能治疗灼伤）。 走上石板北边的楼梯。到了上面的废墟高地，一位 高山向导 在等你。他会告诉你“这一带最好的地方”：“就在我身后！”，然后让开。他说的是实话： 航海日志 IV 就藏在楼梯顶端右侧那根断柱后面。接着，沿楼梯一直爬到东边的山顶平台。一踏上去就会开始战斗。", "sol": 1}, {"titre": "首领：卡布拉坎", "html": "<p>血条是连续的（总共 12 000 HP），但战斗分成好几个阶段。下面的伤害数值适用于普通模式。在冒险模式下，你受到的所有伤害都降低 20%（每颗火球 80，火焰锥 120，灼烧每回合 40）。</p><p><strong>它的招式：</strong></p><ul><li>第一回合以及每次切换阶段时，它都会召唤爪牙“卡布拉坎的召唤”（每个 200 HP）。它们会让岩石从伊策尔脚下冒出来（30 伤害，从第 2 阶段起变成 50）。</li><li>之后它会向全队喷出 <strong>火球雨</strong>（每人 100 伤害）。每三次攻击，它会把火球雨换成对伊策尔的 <strong>火焰锥</strong>：150 伤害，外加每回合 50 HP 的灼烧，重复命中时会叠加。</li><li>伊策尔的 <strong>烟雾弹</strong>（每场战斗 5 个）能让它在 3 个回合内有一半几率攻击落空。这是你最好的防御手段。留几份库利鲁油脂给伊策尔治灼伤。</li><li>如果巴布约没什么有用的事可做（首领在飞、没有远程攻击），就让他 <strong>跳过回合</strong>：直到下回合前，他受到的伤害减少 25%，并恢复 20% 的能量。</li></ul><p><strong>第 1 阶段（4 000 HP）：</strong> 两个蠢蛋一开始就逃跑了。你操作巴布约和伊策尔。它在飞行时，只有远程攻击能打中它：伊策尔的开枪、毁灭射击、烟雾弹，以及巴布约的飞剪投掷（如果你有的话）。你的近战攻击可以打爪牙。低于 2 000 HP 时，它会 <strong>被迫降落</strong>，再叫来三名爪牙。这时你就可以近战打它了。</p><p><strong>第 2 阶段（3 000 HP）：</strong> 所有人恢复能量（HP 不恢复）。它浑身燃起烈焰，再次飞起，并召来三名新爪牙。改回远程攻击。</p><p><strong>第 2 阶段，后半（3 000 HP）：</strong> 两个蠢蛋满 HP 回来了。卡布拉坎落地，召来五名爪牙。现在正是用 <strong>胡子扎眼</strong> 的时候（两个蠢蛋必须都站着，而且对飞行中的目标无效）。</p><p><strong>第 3 阶段（2 000 HP）：</strong> 在酒馆的一段剧情之后，伊策尔 <strong>独自</strong> 对抗它，外加三名爪牙。招式相同。如果上一场战斗结束时她身上的鱼排效果还在，这里会继续生效。用好烟雾弹、治疗道具和油脂。</p><p><strong>如果你输了：</strong> 在第 1-2 阶段，你会回到岛上，可以再挑战。在第 3 阶段，战斗会立刻重新开始，失败那次用掉的道具会还给你。</p><p><strong>奖励：</strong> 完成任务“猎杀悬崖怪物”（25 000 XP），然后是本章结束的 <strong>30 000 XP</strong> 和成就 <strong>中暑</strong>。本章以在迎风岛酒馆里和伊策尔的谈话结束。</p>", "id": "c2-boss-kab-raqan", "texte": "第2章 逆风 主线任务 首领：卡布拉坎 血条是连续的（总共 12 000 HP），但战斗分成好几个阶段。下面的伤害数值适用于普通模式。在冒险模式下，你受到的所有伤害都降低 20%（每颗火球 80，火焰锥 120，灼烧每回合 40）。 它的招式： 第一回合以及每次切换阶段时，它都会召唤爪牙“卡布拉坎的召唤”（每个 200 HP）。它们会让岩石从伊策尔脚下冒出来（30 伤害，从第 2 阶段起变成 50）。 之后它会向全队喷出 火球雨 （每人 100 伤害）。每三次攻击，它会把火球雨换成对伊策尔的 火焰锥 ：150 伤害，外加每回合 50 HP 的灼烧，重复命中时会叠加。 伊策尔的 烟雾弹 （每场战斗 5 个）能让它在 3 个回合内有一半几率攻击落空。这是你最好的防御手段。留几份库利鲁油脂给伊策尔治灼伤。 如果巴布约没什么有用的事可做（首领在飞、没有远程攻击），就让他 跳过回合 ：直到下回合前，他受到的伤害减少 25%，并恢复 20% 的能量。 第 1 阶段（4 000 HP）： 两个蠢蛋一开始就逃跑了。你操作巴布约和伊策尔。它在飞行时，只有远程攻击能打中它：伊策尔的开枪、毁灭射击、烟雾弹，以及巴布约的飞剪投掷（如果你有的话）。你的近战攻击可以打爪牙。低于 2 000 HP 时，它会 被迫降落 ，再叫来三名爪牙。这时你就可以近战打它了。 第 2 阶段（3 000 HP）： 所有人恢复能量（HP 不恢复）。它浑身燃起烈焰，再次飞起，并召来三名新爪牙。改回远程攻击。 第 2 阶段，后半（3 000 HP）： 两个蠢蛋满 HP 回来了。卡布拉坎落地，召来五名爪牙。现在正是用 胡子扎眼 的时候（两个蠢蛋必须都站着，而且对飞行中的目标无效）。 第 3 阶段（2 000 HP）： 在酒馆的一段剧情之后，伊策尔 独自 对抗它，外加三名爪牙。招式相同。如果上一场战斗结束时她身上的鱼排效果还在，这里会继续生效。用好烟雾弹、治疗道具和油脂。 如果你输了： 在第 1-2 阶段，你会回到岛上，可以再挑战。在第 3 阶段，战斗会立刻重新开始，失败那次用掉的道具会还给你。 奖励： 完成任务“猎杀悬崖怪物”（25 000 XP），然后是本章结束的 30 000 XP 和成就 中暑 。本章以在迎风岛酒馆里和伊策尔的谈话结束。", "sol": 0}, {"titre": "到伊策尔的船上和她会合。", "html": "<p>进入第3章前的最后一步：她的船停泊在村子东南。出发前你需要：</p><ul><li>两个蠢蛋都在你身边（见“不要错过”）；</li><li>给他们抹上一份 <strong>库利鲁油脂</strong>，如果在小船那里还没抹过的话。抹一次就够管到以后了。</li></ul><p>对“前往橄榄岛？”回答“是”。你也可以拒绝，先把支线任务做完。</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "第2章 逆风 主线任务 到伊策尔的船上和她会合。 进入第3章前的最后一步：她的船停泊在村子东南。出发前你需要： 两个蠢蛋都在你身边（见“不要错过”）； 给他们抹上一份 库利鲁油脂 ，如果在小船那里还没抹过的话。抹一次就够管到以后了。 对“前往橄榄岛？”回答“是”。你也可以拒绝，先把支线任务做完。", "sol": 0}]}, {"titre": "支线任务", "intro": "<p>每个任务奖励 <strong>10 000 XP</strong>。全部计入成就 <strong>万事通</strong>（游戏中所有的支线任务）。</p>", "entrees": [{"titre": "找回渔夫的钳子", "html": "<ul><li><strong>地点：</strong> 渔夫，村子西南的房子，靠近小船。</li><li><strong>步骤：</strong> 接受任务，然后在第一个洞穴（左上方的房间）捡起 <strong>渔夫夹</strong>。把它带回去。</li><li><strong>奖励：</strong> 10 000 XP，他会马上提出“揭开库利鲁的秘密”。从此他还可以用你的鱼来交换东西：<ul><li>银鲈 → <strong>美味鱼排</strong>（战斗中每回合恢复 10% HP）；</li><li>比目鱼 → <strong>投掷鱼</strong>（35 伤害，由两个蠢蛋投出）；</li><li>鲭鱼 → 1 枚金币；</li><li>库利鲁 → <strong>库利鲁油脂</strong>（揭开秘密之后）。</li></ul></li><li>在揭开库利鲁的秘密之前，他以 <strong>20 金币出售库利鲁油脂</strong>（只有你至少有 20 金币时才会出现这个选项）。</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "第2章 逆风 支线任务 找回渔夫的钳子 地点： 渔夫，村子西南的房子，靠近小船。 步骤： 接受任务，然后在第一个洞穴（左上方的房间）捡起 渔夫夹 。把它带回去。 奖励： 10 000 XP，他会马上提出“揭开库利鲁的秘密”。从此他还可以用你的鱼来交换东西： 银鲈 → 美味鱼排 （战斗中每回合恢复 10% HP）； 比目鱼 → 投掷鱼 （35 伤害，由两个蠢蛋投出）； 鲭鱼 → 1 枚金币； 库利鲁 → 库利鲁油脂 （揭开秘密之后）。 在揭开库利鲁的秘密之前，他以 20 金币出售库利鲁油脂 （只有你至少有 20 金币时才会出现这个选项）。", "sol": 0}, {"titre": "揭开库利鲁的秘密", "html": "<ul><li><strong>地点：</strong> 渔夫，在钳子任务之后。如果你拒绝过，再跟他说话。</li><li><strong>步骤：</strong><ol><li>捡 <strong>3 份软海藻</strong>。岛上只有三份，别把它们弄丢：一份在小船西南的海滩上，一份在东海岸（从村子沿着海岸往北走），一份在最东北（第二个洞穴之后）。</li><li>在酒馆选择 <strong>要点煮烂的扁豆。</strong>（只有接下任务后才会出现这个选项）。</li><li>把这些全部交给渔夫。</li></ol></li><li><strong>奖励：</strong> 10 000 XP，并解锁 <strong>库利鲁垂钓</strong>（见小游戏）。</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "第2章 逆风 支线任务 揭开库利鲁的秘密 地点： 渔夫，在钳子任务之后。如果你拒绝过，再跟他说话。 步骤： 捡 3 份软海藻 。岛上只有三份，别把它们弄丢：一份在小船西南的海滩上，一份在东海岸（从村子沿着海岸往北走），一份在最东北（第二个洞穴之后）。 在酒馆选择 要点煮烂的扁豆。 （只有接下任务后才会出现这个选项）。 把这些全部交给渔夫。 奖励： 10 000 XP，并解锁 库利鲁垂钓 （见小游戏）。", "sol": 0}, {"titre": "把渔网还给渔妇", "html": "<ul><li><strong>地点：</strong> 渔妇，村子东边的房子。</li><li><strong>步骤：</strong> <strong>加重渔网</strong> 在岛东北部的渔民强盗营地里（第二个洞穴之后）。你得打败守着它的那伙人。</li><li><strong>奖励：</strong> 10 000 XP。</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "第2章 逆风 支线任务 把渔网还给渔妇 地点： 渔妇，村子东边的房子。 步骤： 加重渔网 在岛东北部的渔民强盗营地里（第二个洞穴之后）。你得打败守着它的那伙人。 奖励： 10 000 XP。", "sol": 0}, {"titre": "让悬崖上的汤变得好入口", "html": "<ul><li><strong>地点：</strong> 酒馆的厨娘，村子西边。</li><li><strong>食材：</strong><ul><li><strong>甜海藻</strong>：岛的东北部，就在渔民强盗营地的南边；</li><li><strong>灰盐</strong>：第一个洞穴的隧道，左上方的房间；</li><li><strong>一桶橄榄油</strong>：第二个洞穴，左边的房间；</li><li><strong>高风之花</strong>：在山顶平台的东端，卡布拉坎的竞技场里。要拿到它，必须穿过触发战斗的区域：打赢之后再去采（那时山顶已经“恢复了平静”）。</li></ul></li><li><strong>奖励：</strong> 10 000 XP。</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "第2章 逆风 支线任务 让悬崖上的汤变得好入口 地点： 酒馆的厨娘，村子西边。 食材： 甜海藻 ：岛的东北部，就在渔民强盗营地的南边； 灰盐 ：第一个洞穴的隧道，左上方的房间； 一桶橄榄油 ：第二个洞穴，左边的房间； 高风之花 ：在山顶平台的东端，卡布拉坎的竞技场里。要拿到它，必须穿过触发战斗的区域：打赢之后再去采（那时山顶已经“恢复了平静”）。 奖励： 10 000 XP。", "sol": 0}, {"titre": "以后：大扫除", "html": "<p>镇长要在本章之后很久才会给出这个任务，也就是螃蟹岛的酒馆老板提起它的时候（第5章之后）。它不属于第2章。</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "第2章 逆风 支线任务 以后：大扫除 镇长要在本章之后很久才会给出这个任务，也就是螃蟹岛的酒馆老板提起它的时候（第5章之后）。它不属于第2章。", "sol": 0}]}, {"titre": "小游戏", "intro": "", "entrees": [{"titre": "库利鲁垂钓", "html": "<ul><li><strong>地点：</strong> 小船东边、村子南边的小码头。完成“揭开库利鲁的秘密”后开放。</li><li><strong>规则：</strong> 和螃蟹岛的钓鱼一样。鱼咬钩时，在限定时间内输入屏幕上显示的方向键组合。库利鲁的组合是：<strong>左、上、右、下</strong>。</li><li>你在这里钓到的第一条一定是库利鲁。之后每两条中有一条是库利鲁，其余是普通的鱼（银鲈、比目鱼、鲭鱼……）。</li><li><strong>奖励：</strong> 每条库利鲁都能在渔夫那里换一份库利鲁油脂。库利鲁是成就 <strong>是不是有股怪味儿？</strong>（钓到所有种类）的 7 种鱼之一。</li></ul>", "id": "c2-peche-au-coulirou", "texte": "第2章 逆风 小游戏 库利鲁垂钓 地点： 小船东边、村子南边的小码头。完成“揭开库利鲁的秘密”后开放。 规则： 和螃蟹岛的钓鱼一样。鱼咬钩时，在限定时间内输入屏幕上显示的方向键组合。库利鲁的组合是： 左、上、右、下 。 你在这里钓到的第一条一定是库利鲁。之后每两条中有一条是库利鲁，其余是普通的鱼（银鲈、比目鱼、鲭鱼……）。 奖励： 每条库利鲁都能在渔夫那里换一份库利鲁油脂。库利鲁是成就 是不是有股怪味儿？ （钓到所有种类）的 7 种鱼之一。", "sol": 0}, {"titre": "说谎之眼（酒馆的骰子）", "html": "<ul><li><strong>地点：</strong> 迎风岛的酒馆，“玩骰子。”。</li><li>规则和螃蟹岛一样，但对手换成了奸诈的米蕾特、莽汉“摇杯”布拉斯和机灵鬼让-夏尔。</li><li>赌注更高：用 3、4 或 5 颗骰子玩时，最高分别可押 20、30 或 50 金币。</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "第2章 逆风 小游戏 说谎之眼（酒馆的骰子） 地点： 迎风岛的酒馆，“玩骰子。”。 规则和螃蟹岛一样，但对手换成了奸诈的米蕾特、莽汉“摇杯”布拉斯和机灵鬼让-夏尔。 赌注更高：用 3、4 或 5 颗骰子玩时，最高分别可押 20、30 或 50 金币。", "sol": 0}]}, {"titre": "不要错过", "intro": "", "entrees": [{"titre": "不要错过", "html": "<ul><li><strong>库利鲁油脂：</strong> 没有它就无法离开这座岛，不管是坐小船还是伊策尔的船。再多备 3 份对付卡布拉坎。</li><li><strong>第三个洞穴里的两个蠢蛋：</strong> 如果你从上方出口（石板那一侧）进去，有个地方能让他们托你一把，把你送上西边高地。这样他们就会留在下面。从洞穴的下方入口再走一趟把他们接回来：没有他们就没法出发。</li><li><strong>航海日志</strong>（成就 <strong>反正老子也不识字</strong> 的 7 本中的 2 本）：<ul><li><strong>航海日志 III</strong>：第一个洞穴的隧道里，右上方空房间的骷髅身上；</li><li><strong>航海日志 IV</strong>：石板北边楼梯的顶端（解开谜题之后），藏在右侧那根断柱后面，就是高山向导说“就在我身后！”的地方；</li><li>捡起来就能阅读，之后会收进物品栏的书架里。</li></ul></li><li><strong>第一个洞穴的宝箱：</strong> 桃花心木手杖（能量上限 +20，东南角落，经由隧道），两个装着啤酒和朗姆酒的宝箱，以及隧道里的机关宝箱。</li><li><strong>可以挖的洞</strong>（用第1章找到的铲子）：<ul><li><strong>骇人眼罩</strong>（攻击 +5）：西边高地的下部，离第三个洞穴的下方入口不远；</li><li>一些金币：西边高地中部 10 枚，西边高地上部营地附近 8 枚，东边石板高地下方 2 枚，小船西南的海滩上 1 枚。</li></ul></li><li><strong>胡子扎眼：</strong> 在对决伊策尔时自动永久解锁。</li><li><strong>酒馆：</strong> 每次光顾都能免费恢复 HP 和能量。</li><li><strong>感冒的船长：</strong> 只要他们还站着，他们的“进攻命令”就会让所有敌人都攻击巴布约。优先干掉他们。两个蠢蛋中任意一个使出翻滚，就能引开这些攻击：3 个回合内，敌人会攻击这个蠢蛋而不是巴布约。</li><li><strong>火把商人：</strong> 就在酒馆旁边（成就“明白人”）。</li><li>没有任何东西会永久错过：本章结束后迎风岛仍然可以前往。</li><li><strong>本章成就：</strong> <strong>中暑</strong>（完成第2章）。</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "第2章 逆风 不要错过 不要错过 库利鲁油脂： 没有它就无法离开这座岛，不管是坐小船还是伊策尔的船。再多备 3 份对付卡布拉坎。 第三个洞穴里的两个蠢蛋： 如果你从上方出口（石板那一侧）进去，有个地方能让他们托你一把，把你送上西边高地。这样他们就会留在下面。从洞穴的下方入口再走一趟把他们接回来：没有他们就没法出发。 航海日志 （成就 反正老子也不识字 的 7 本中的 2 本）： 航海日志 III ：第一个洞穴的隧道里，右上方空房间的骷髅身上； 航海日志 IV ：石板北边楼梯的顶端（解开谜题之后），藏在右侧那根断柱后面，就是高山向导说“就在我身后！”的地方； 捡起来就能阅读，之后会收进物品栏的书架里。 第一个洞穴的宝箱： 桃花心木手杖（能量上限 +20，东南角落，经由隧道），两个装着啤酒和朗姆酒的宝箱，以及隧道里的机关宝箱。 可以挖的洞 （用第1章找到的铲子）： 骇人眼罩 （攻击 +5）：西边高地的下部，离第三个洞穴的下方入口不远； 一些金币：西边高地中部 10 枚，西边高地上部营地附近 8 枚，东边石板高地下方 2 枚，小船西南的海滩上 1 枚。 胡子扎眼： 在对决伊策尔时自动永久解锁。 酒馆： 每次光顾都能免费恢复 HP 和能量。 感冒的船长： 只要他们还站着，他们的“进攻命令”就会让所有敌人都攻击巴布约。优先干掉他们。两个蠢蛋中任意一个使出翻滚，就能引开这些攻击：3 个回合内，敌人会攻击这个蠢蛋而不是巴布约。 火把商人： 就在酒馆旁边（成就“明白人”）。 没有任何东西会永久错过：本章结束后迎风岛仍然可以前往。 本章成就： 中暑 （完成第2章）。", "sol": 0}]}]}], "ko": [{"id": "c2", "num": "2장", "titre": "역풍", "intro": "<p>해상 경비대에 체포된 바르브외는 감옥에서 깨어나요. 옆 칸에는 아주 수상한 늙은 죄수가 있어요. 탈옥에 성공한 뒤, 그는 (억지로) 말 없는 이첼과 한 팀이 되어 바람섬으로 향해요. 그곳에서는 절벽 꼭대기에 둥지를 튼 괴물이 온 마을에 악취를 풍기고 있어요.</p>", "sections": [{"titre": "메인 퀘스트", "intro": "", "entrees": [{"titre": "감옥: 감방에서 탈출하기 (표시되는 목표 없음)", "html": "<ol><li>챕터는 감옥 오른쪽 위에 있는 내 감방에서 시작해요. 1초쯤 지나면 늙은 죄수가 알아서 말을 걸어요.</li><li>그가 <strong>구멍 난 양피지</strong>와 <strong>생선 가시</strong>를 줘요. 나머지는 전부 자동이에요. 바르브외가 양피지를 읽고(창을 닫으면 계속돼요), 생선 가시로 자물쇠를 따면 감방 문들이 열려요.</li><li>이제 들키지 않고 감옥을 빠져나가야 해요(아래 상자 참고).</li></ol><p><strong>경비병의 움직임</strong> (큰 방에서 경비병 열 명이 순찰해요):</p><ul><li>경비병은 앞쪽 원뿔 범위를 봐요. 그 범위 안에 약 1.5초 머물면 붙잡혀요. 벽은 시야를 가려요.</li><li>경비병 바로 옆을 지나가면(정면이든 측면이든) 즉시 붙잡혀요. 등 뒤만 사각지대예요.</li><li>내 감방 안에서는 안전해요.</li><li><strong>횃불을 켜지 마세요.</strong> 불빛을 본 경비병은 순찰을 멈추고 나에게 다가와요.</li><li>붙잡히면 병장이 짧게 잔소리를 한 뒤 감방으로 돌려보내요. 다른 벌칙은 없으니 다시 해 보세요.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "2장 역풍 메인 퀘스트 감옥: 감방에서 탈출하기 (표시되는 목표 없음) 챕터는 감옥 오른쪽 위에 있는 내 감방에서 시작해요. 1초쯤 지나면 늙은 죄수가 알아서 말을 걸어요. 그가 구멍 난 양피지 와 생선 가시 를 줘요. 나머지는 전부 자동이에요. 바르브외가 양피지를 읽고(창을 닫으면 계속돼요), 생선 가시로 자물쇠를 따면 감방 문들이 열려요. 이제 들키지 않고 감옥을 빠져나가야 해요(아래 상자 참고). 경비병의 움직임 (큰 방에서 경비병 열 명이 순찰해요): 경비병은 앞쪽 원뿔 범위를 봐요. 그 범위 안에 약 1.5초 머물면 붙잡혀요. 벽은 시야를 가려요. 경비병 바로 옆을 지나가면(정면이든 측면이든) 즉시 붙잡혀요. 등 뒤만 사각지대예요. 내 감방 안에서는 안전해요. 횃불을 켜지 마세요. 불빛을 본 경비병은 순찰을 멈추고 나에게 다가와요. 붙잡히면 병장이 짧게 잔소리를 한 뒤 감방으로 돌려보내요. 다른 벌칙은 없으니 다시 해 보세요.", "sol": 0}, {"titre": "감옥: 열쇠를 찾아 나가기", "html": "<ol><li>지도 가운데 왼쪽의 작은 경비실까지 내려가요(아래쪽으로 들어가요). 열쇠 걸이에 열쇠 꾸러미가 걸려 있어요.</li><li>걸이에 다가가 <strong>뒤지기</strong>를 고르면 <strong>만능 열쇠</strong>를 얻어요.</li><li>오른쪽 아래 계단으로 가요. 열쇠가 없으면 \"여기서 나가려면 열쇠가 필요합니다.\"라는 메시지가 떠요.</li><li><strong>순찰실</strong>: 경비병 다섯 명이 같은 시야 규칙으로 돌아다녀요. 서쪽으로 들어가고, 출구는 동쪽이에요. 경비병이 등을 돌렸을 때 움직이세요. 여기서 붙잡히면 감방에서 다시 시작하지만 열쇠는 그대로 가지고 있어요.</li><li>문을 지나면 열쇠가 소모되고 등 뒤에서 철창이 닫혀요(\"아, 이제 되돌아갈 수는 없겠군....\"). 경비병 열 명 정도가 동쪽에서 들어와 다가와요. <strong>움직이지 말고 입구에 그대로 있으세요.</strong> 이 거리에서는 나를 못 봐요. 그들의 대화(\"그 여자다!!!\")가 끝나면 다시 동쪽으로 뛰어가요. 그때 방을 가로질러 동쪽 출구로 나가면 돼요.</li><li>마지막 방: 경비병들이 바닥에 쓰러져 있어요. 동쪽으로 가면 낯선 여자와 마주쳐요.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "2장 역풍 메인 퀘스트 감옥: 열쇠를 찾아 나가기 지도 가운데 왼쪽의 작은 경비실까지 내려가요(아래쪽으로 들어가요). 열쇠 걸이에 열쇠 꾸러미가 걸려 있어요. 걸이에 다가가 뒤지기 를 고르면 만능 열쇠 를 얻어요. 오른쪽 아래 계단으로 가요. 열쇠가 없으면 \"여기서 나가려면 열쇠가 필요합니다.\"라는 메시지가 떠요. 순찰실 : 경비병 다섯 명이 같은 시야 규칙으로 돌아다녀요. 서쪽으로 들어가고, 출구는 동쪽이에요. 경비병이 등을 돌렸을 때 움직이세요. 여기서 붙잡히면 감방에서 다시 시작하지만 열쇠는 그대로 가지고 있어요. 문을 지나면 열쇠가 소모되고 등 뒤에서 철창이 닫혀요(\"아, 이제 되돌아갈 수는 없겠군....\"). 경비병 열 명 정도가 동쪽에서 들어와 다가와요. 움직이지 말고 입구에 그대로 있으세요. 이 거리에서는 나를 못 봐요. 그들의 대화(\"그 여자다!!!\")가 끝나면 다시 동쪽으로 뛰어가요. 그때 방을 가로질러 동쪽 출구로 나가면 돼요. 마지막 방: 경비병들이 바닥에 쓰러져 있어요. 동쪽으로 가면 낯선 여자와 마주쳐요.", "sol": 0}, {"titre": "연출 전투: 낯선 여자 (이첼)", "html": "<ul><li>뒤브뢰유 선장, 비숑 병장과 함께 싸워요. 낯선 여자는 두 경비병만 노려요.</li><li>낯선 여자는 쓰러지지 않아요. HP가 거의 0이 되면 500으로 회복해요(\"그렇게 말고....\").</li><li>두 경비병이 쓰러지면 전투가 끝나요. 평소처럼 턴을 진행하세요. 결과는 정해져 있어요.</li><li>그 뒤 낯선 여자가 자기소개를 해요. 말 없는 이첼이에요. 함께 두 멍청이를 데리러 가요.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "2장 역풍 메인 퀘스트 연출 전투: 낯선 여자 (이첼) 뒤브뢰유 선장, 비숑 병장과 함께 싸워요. 낯선 여자는 두 경비병만 노려요. 낯선 여자는 쓰러지지 않아요. HP가 거의 0이 되면 500으로 회복해요(\"그렇게 말고....\"). 두 경비병이 쓰러지면 전투가 끝나요. 평소처럼 턴을 진행하세요. 결과는 정해져 있어요. 그 뒤 낯선 여자가 자기소개를 해요. 말 없는 이첼이에요. 함께 두 멍청이를 데리러 가요.", "sol": 0}, {"titre": "재회와 이첼과의 결투", "html": "<ol><li>이첼의 배에서 자동 장면이 이어져요. 두 멍청이가 (보기 좋게 햇볕에 그을린 채) 선원으로 돌아와요. 바르브외는 늙은 죄수가 말한 신성한 암브로시아로 구멍 난 양피지를 \"처리\"해요… 숨겨진 글자들이 <strong>바람섬</strong>을 드러내요.</li><li>바람섬까지 자동으로 항해한 뒤, 신경이 곤두선 이첼이 결투를 신청해요.</li><li><strong>말 없는 이첼과의 결투</strong> (연출 전투, 사실상 이길 수도 질 수도 없어요):<ul><li>아래에 설명한 해금 전까지 바르브외는 쓰러지지 않아요. \"순전히 똥고집으로\" HP 1~3을 남기고 버텨요.</li><li>바르브외의 HP가 40% 아래로 떨어지는 순간, 필살기 <strong>눈에 들어간 수염</strong>이 영구히 해금돼요. 그 턴에는 이것만 쓸 수 있으니 사용하세요.</li><li>이 기술은 에너지 대신 바르브외의 남은 HP 30%를 소모해요. 두 멍청이가 각각 5~7번 때려요. 두 멍청이가 모두 서 있어야 해요. 두 번에 한 번꼴로 바르브외가 3턴 동안 적을 도발하기도 해요. 적들이 바르브외를 노려요.</li><li>이첼의 HP가 30%까지 떨어지면(또는 이첼이 나를 끝장내려 할 때) 이첼이 자신의 필살기인 여섯 발 사격으로 맞받아치고 전투가 끝나요.</li></ul></li><li>HP 1로 바람섬에 내려요. <strong>요령</strong>: 마을 선술집에 들어가면 HP와 에너지가 무료로 회복돼요.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "2장 역풍 메인 퀘스트 재회와 이첼과의 결투 이첼의 배에서 자동 장면이 이어져요. 두 멍청이가 (보기 좋게 햇볕에 그을린 채) 선원으로 돌아와요. 바르브외는 늙은 죄수가 말한 신성한 암브로시아로 구멍 난 양피지를 \"처리\"해요… 숨겨진 글자들이 바람섬 을 드러내요. 바람섬까지 자동으로 항해한 뒤, 신경이 곤두선 이첼이 결투를 신청해요. 말 없는 이첼과의 결투 (연출 전투, 사실상 이길 수도 질 수도 없어요): 아래에 설명한 해금 전까지 바르브외는 쓰러지지 않아요. \"순전히 똥고집으로\" HP 1~3을 남기고 버텨요. 바르브외의 HP가 40% 아래로 떨어지는 순간, 필살기 눈에 들어간 수염 이 영구히 해금돼요. 그 턴에는 이것만 쓸 수 있으니 사용하세요. 이 기술은 에너지 대신 바르브외의 남은 HP 30%를 소모해요. 두 멍청이가 각각 5~7번 때려요. 두 멍청이가 모두 서 있어야 해요. 두 번에 한 번꼴로 바르브외가 3턴 동안 적을 도발하기도 해요. 적들이 바르브외를 노려요. 이첼의 HP가 30%까지 떨어지면(또는 이첼이 나를 끝장내려 할 때) 이첼이 자신의 필살기인 여섯 발 사격으로 맞받아치고 전투가 끝나요. HP 1로 바람섬에 내려요. 요령 : 마을 선술집에 들어가면 HP와 에너지가 무료로 회복돼요.", "sol": 0}, {"titre": "쓸 만한 정보 찾기.", "html": "<p><em>(하위 목표: 마을 주민들에게 탐문하기)</em></p><ol><li>마을 중앙의 집에 사는 <strong>촌장</strong>을 찾아가요. 가장 높은 절벽 위에 자리 잡은 괴물, 동굴의 도적들, 정상을 막고 있는 오래된 석판 장치에 대해 알려 줘요.</li><li>메인 퀘스트 <strong>절벽의 괴물 사냥하기</strong>가 자동으로 시작돼요.</li><li><strong>주의:</strong> 섬을 바로 떠날 수는 없어요. 쪽배로 가면 두 멍청이가 햇볕에 덴 탓에 \"항해할 상태가 아니에요\". <strong>쿨리루 기름</strong>이 필요해요(어부 퀘스트 참고: 처음 대화할 때부터 금화 20개에 팔아요).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "2장 역풍 메인 퀘스트 쓸 만한 정보 찾기. (하위 목표: 마을 주민들에게 탐문하기) 마을 중앙의 집에 사는 촌장 을 찾아가요. 가장 높은 절벽 위에 자리 잡은 괴물, 동굴의 도적들, 정상을 막고 있는 오래된 석판 장치에 대해 알려 줘요. 메인 퀘스트 절벽의 괴물 사냥하기 가 자동으로 시작돼요. 주의: 섬을 바로 떠날 수는 없어요. 쪽배로 가면 두 멍청이가 햇볕에 덴 탓에 \"항해할 상태가 아니에요\". 쿨리루 기름 이 필요해요(어부 퀘스트 참고: 처음 대화할 때부터 금화 20개에 팔아요).", "sol": 0}, {"titre": "정상에 올라 괴물 물리치기.", "html": "<p><em>(하위 목표: 동굴과 고대 석판 장치 통과하기)</em></p><p><strong>석판까지 가는 길:</strong></p><ol><li>선술집 옆(마을 서쪽) 사다리를 올라 서쪽 밭을 가로질러요. 동굴 입구는 밭 북쪽 절벽에 있어요. 밭에서 입구 바로 아래에 있는 <strong>동굴 가이드</strong>가 말을 걸고 데려다줘요. 그냥 따라가세요. 바르브외가 알아서 따라가요. 가이드는 안까지 함께 오지 않고, 딱 한 번만 만나요.</li><li><strong>절벽 동굴</strong>: 도적들이 지키는 방이 네 개 있어요(고정 전투, 각각 한 번만). 이런 것들이 있어요.<ul><li>왼쪽 위 방에 <strong>어부의 집게</strong></li><li>같은 방에 상자(금화 15개, 맥주 2, 럼주 2)</li><li>가운데 위, 두 번째 동굴로 가는 계단 근처에 상자(맥주 5, 럼주 3)</li><li><strong>터널</strong> 입구는 오른쪽 위 방에 있어요. 터널 중앙 통로의 위쪽으로 들어가요. 터널에는 <strong>회색 소금</strong>(왼쪽 위 방)과 <strong>함정 상자</strong>(왼쪽 아래 큰 방. 사실 몬스터인 함정 상자예요. 쓰러뜨리면 금화 15개와 맥주 2)가 있어요. <strong>항해 일지 III</strong>는 오른쪽 위 빈 방 한가운데의 해골 위에 놓여 있어요(그 방 아래쪽 계단으로 올라가요). 터널 아래쪽 출구로 나가면 동굴 남동쪽 구석에 닿고, 특별한 상자가 있어요. <strong>마호가니 지팡이</strong>(최대 에너지 +20)와 금화 10개예요.</li></ul></li><li>가운데 위 계단으로 <strong>두 번째 동굴</strong>에 가요. <strong>올리브유 통</strong>은 왼쪽 방에 있어요. 방들을 지나(도적 세 무리) 오른쪽 아래 출구까지 가요. 섬 북동쪽으로 나와요.</li><li><strong>섬 북동쪽</strong>: 어부 도적단의 야영지가 있어요(어부 세 명과 여자 어부 한 명과의 고정 전투). <strong>추 달린 그물</strong>이 이 야영지에 있어요. <strong>순한 해초</strong>는 야영지 바로 남쪽에, <strong>흐물흐물한 해초</strong> 하나는 맨 북동쪽 물가에 있어요.</li><li>섬 위쪽을 따라 서쪽으로 가요. 넓은 서쪽 고원에 도착해요(도적 야영지, 무작위 조우. 모험 모드에서는 도주가 항상 성공해요).</li><li><strong>절벽의 양피지 (필수)</strong>: 서쪽 고원 북쪽, 야영지 근처 땅에 구멍이 뚫려 있어요. 뛰어들면 두 번째 동굴의 닫힌 방(문이 없는 가운데 방. 이 구멍이 유일한 입구예요)으로 떨어져요. 거기에 <strong>절벽의 양피지</strong>가 있어요. 같은 방의 다른 구멍(오른쪽 아래 구석)으로 들어가면 첫 번째 동굴로 돌아가요.</li><li>서쪽 고원을 내려가 고원 남쪽에 있는 <strong>세 번째 동굴</strong>의 아래쪽 입구로 가요. 동굴을 통과하면 출구(오른쪽 위)가 석판 고원으로 이어져요. 이첼이 기다리고 있어요.</li></ol><p><strong>석판 수수께끼</strong> <em>(하위 목표: 고대 석판 장치 풀기)</em></p><p>석판 아홉 개가 3 × 3 격자를 이뤄요.</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>올바른 순서로 석판 네 개를 밟아야 해요. 이첼에게 말을 걸어 보세요. 절벽의 양피지가 없으면 뭔가 빠졌다고 해요.</p><p>풀이: 인벤토리에서 <strong>절벽의 양피지</strong>를 열고 <strong>구멍 난 양피지 사용</strong>을 클릭하세요. 구멍 난 양피지가 그 위에 겹쳐지고 끌어서 옮길 수 있어요. 구멍 네 개는 점선으로 이어져 있고 점선 끝에는 화살표가 있어요. 왼쪽으로(폭의 약 5분의 1) 그리고 아래로 조금(높이의 약 8분의 1) 끌어서, 화살표 끝의 큰 구멍이 왼쪽 가장자리의 <strong>R</strong>(B 아래에 있는 것)을 감싸게 하세요. 그러면 구멍에 점선 순서대로 <strong>H</strong>(출발점의 작은 구멍), <strong>J</strong>(아래쪽 큰 구멍), <strong>F</strong>(오른쪽 구멍), 그리고 <strong>R</strong>이 보여요. 퀘스트 일지의 힌트도 이를 확인해 줘요. \"마지막 글자는 R인 것 같은데...\"</p><p><strong>해답: H(오른쪽 위) → J(가운데 아래) → F(가운데 오른쪽) → R(왼쪽 위) 순서로 밟으세요.</strong></p><ul><li>그 사이에 다른 석판은 밟지 마세요. 석판 사이로 지나가세요.</li><li>네 개를 밟으면 \"승리!\" 또는 \"패배!\"가 표시돼요. 실패하면 순서가 처음부터 다시 시작돼요.</li><li>꾸물거리지 마세요. 석판 사이에 10초 넘게 걸리면 방금 밟은 석판부터 다시 시작돼요.</li><li>성공하면 길 두 개가 열려요. 정상으로 올라가는 계단(석판 북쪽)과 마을로 곧장 내려가는 사다리(지름길)예요. 쓸모없어진 두 양피지는 인벤토리에서 사라져요.</li></ul><p><strong>전투 준비</strong> 일지가 권장하는 준비물: 레벨 18, 생선 필레, 맥주 10, 럼주 10, 쿨리루 기름 3개(화상을 치료해요).</p><p>석판 북쪽 계단을 올라가요. 꼭대기의 폐허 고원에서 <strong>고산 등반 가이드</strong>가 기다리고 있어요. 그는 \"이 근처 최고의 명소\"를 알려 줘요. \"바로 제 뒤요!\" 그러고는 비켜서요. 정말이에요. <strong>항해 일지 IV</strong>가 계단 꼭대기 바로 오른쪽, 부서진 기둥 뒤에 숨겨져 있어요. 그다음 계단을 올라 동쪽의 정상 단상으로 가요. 발을 딛는 순간 전투가 시작돼요.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "2장 역풍 메인 퀘스트 정상에 올라 괴물 물리치기. (하위 목표: 동굴과 고대 석판 장치 통과하기) 석판까지 가는 길: 선술집 옆(마을 서쪽) 사다리를 올라 서쪽 밭을 가로질러요. 동굴 입구는 밭 북쪽 절벽에 있어요. 밭에서 입구 바로 아래에 있는 동굴 가이드 가 말을 걸고 데려다줘요. 그냥 따라가세요. 바르브외가 알아서 따라가요. 가이드는 안까지 함께 오지 않고, 딱 한 번만 만나요. 절벽 동굴 : 도적들이 지키는 방이 네 개 있어요(고정 전투, 각각 한 번만). 이런 것들이 있어요. 왼쪽 위 방에 어부의 집게 같은 방에 상자(금화 15개, 맥주 2, 럼주 2) 가운데 위, 두 번째 동굴로 가는 계단 근처에 상자(맥주 5, 럼주 3) 터널 입구는 오른쪽 위 방에 있어요. 터널 중앙 통로의 위쪽으로 들어가요. 터널에는 회색 소금 (왼쪽 위 방)과 함정 상자 (왼쪽 아래 큰 방. 사실 몬스터인 함정 상자예요. 쓰러뜨리면 금화 15개와 맥주 2)가 있어요. 항해 일지 III 는 오른쪽 위 빈 방 한가운데의 해골 위에 놓여 있어요(그 방 아래쪽 계단으로 올라가요). 터널 아래쪽 출구로 나가면 동굴 남동쪽 구석에 닿고, 특별한 상자가 있어요. 마호가니 지팡이 (최대 에너지 +20)와 금화 10개예요. 가운데 위 계단으로 두 번째 동굴 에 가요. 올리브유 통 은 왼쪽 방에 있어요. 방들을 지나(도적 세 무리) 오른쪽 아래 출구까지 가요. 섬 북동쪽으로 나와요. 섬 북동쪽 : 어부 도적단의 야영지가 있어요(어부 세 명과 여자 어부 한 명과의 고정 전투). 추 달린 그물 이 이 야영지에 있어요. 순한 해초 는 야영지 바로 남쪽에, 흐물흐물한 해초 하나는 맨 북동쪽 물가에 있어요. 섬 위쪽을 따라 서쪽으로 가요. 넓은 서쪽 고원에 도착해요(도적 야영지, 무작위 조우. 모험 모드에서는 도주가 항상 성공해요). 절벽의 양피지 (필수) : 서쪽 고원 북쪽, 야영지 근처 땅에 구멍이 뚫려 있어요. 뛰어들면 두 번째 동굴의 닫힌 방(문이 없는 가운데 방. 이 구멍이 유일한 입구예요)으로 떨어져요. 거기에 절벽의 양피지 가 있어요. 같은 방의 다른 구멍(오른쪽 아래 구석)으로 들어가면 첫 번째 동굴로 돌아가요. 서쪽 고원을 내려가 고원 남쪽에 있는 세 번째 동굴 의 아래쪽 입구로 가요. 동굴을 통과하면 출구(오른쪽 위)가 석판 고원으로 이어져요. 이첼이 기다리고 있어요. 석판 수수께끼 (하위 목표: 고대 석판 장치 풀기) 석판 아홉 개가 3 × 3 격자를 이뤄요. R T H O A F E J N 올바른 순서로 석판 네 개를 밟아야 해요. 이첼에게 말을 걸어 보세요. 절벽의 양피지가 없으면 뭔가 빠졌다고 해요. 풀이: 인벤토리에서 절벽의 양피지 를 열고 구멍 난 양피지 사용 을 클릭하세요. 구멍 난 양피지가 그 위에 겹쳐지고 끌어서 옮길 수 있어요. 구멍 네 개는 점선으로 이어져 있고 점선 끝에는 화살표가 있어요. 왼쪽으로(폭의 약 5분의 1) 그리고 아래로 조금(높이의 약 8분의 1) 끌어서, 화살표 끝의 큰 구멍이 왼쪽 가장자리의 R (B 아래에 있는 것)을 감싸게 하세요. 그러면 구멍에 점선 순서대로 H (출발점의 작은 구멍), J (아래쪽 큰 구멍), F (오른쪽 구멍), 그리고 R 이 보여요. 퀘스트 일지의 힌트도 이를 확인해 줘요. \"마지막 글자는 R인 것 같은데...\" 해답: H(오른쪽 위) → J(가운데 아래) → F(가운데 오른쪽) → R(왼쪽 위) 순서로 밟으세요. 그 사이에 다른 석판은 밟지 마세요. 석판 사이로 지나가세요. 네 개를 밟으면 \"승리!\" 또는 \"패배!\"가 표시돼요. 실패하면 순서가 처음부터 다시 시작돼요. 꾸물거리지 마세요. 석판 사이에 10초 넘게 걸리면 방금 밟은 석판부터 다시 시작돼요. 성공하면 길 두 개가 열려요. 정상으로 올라가는 계단(석판 북쪽)과 마을로 곧장 내려가는 사다리(지름길)예요. 쓸모없어진 두 양피지는 인벤토리에서 사라져요. 전투 준비 일지가 권장하는 준비물: 레벨 18, 생선 필레, 맥주 10, 럼주 10, 쿨리루 기름 3개(화상을 치료해요). 석판 북쪽 계단을 올라가요. 꼭대기의 폐허 고원에서 고산 등반 가이드 가 기다리고 있어요. 그는 \"이 근처 최고의 명소\"를 알려 줘요. \"바로 제 뒤요!\" 그러고는 비켜서요. 정말이에요. 항해 일지 IV 가 계단 꼭대기 바로 오른쪽, 부서진 기둥 뒤에 숨겨져 있어요. 그다음 계단을 올라 동쪽의 정상 단상으로 가요. 발을 딛는 순간 전투가 시작돼요.", "sol": 1}, {"titre": "보스: 카브라칸", "html": "<p>HP 바는 하나로 이어지지만(총 HP 12,000), 전투는 여러 단계로 진행돼요. 아래 피해 수치는 보통 모드 기준이에요. 모험 모드에서는 받는 피해가 모두 20% 줄어요(화염구 하나당 80, 원뿔 120, 화상 턴당 40).</p><p><strong>보스의 행동:</strong></p><ul><li>첫 턴과 단계가 바뀔 때마다 부하인 카브라칸의 소환(각각 HP 200)을 불러내요. 소환들은 이첼 발밑에서 바위를 솟구치게 해요(피해 30, 2단계부터는 50).</li><li>그다음 팀 전체에 <strong>화염구 비</strong>를 뿌려요(각각 피해 100). 세 번 공격할 때마다 비 대신 이첼에게 <strong>화염 원뿔</strong>을 쏴요. 피해 150에 턴당 HP 50의 화상이 붙고, 반복되면 중첩돼요.</li><li>이첼의 <strong>연막탄</strong>(전투당 5개)은 3턴 동안 보스의 공격이 두 번에 한 번 빗나가게 해요. 가장 좋은 방어 수단이에요. 이첼의 화상을 위해 쿨리루 기름을 남겨 두세요.</li><li>바르브외가 할 일이 없다면(보스가 날고 있고 원거리 공격이 없을 때) <strong>턴을 넘기세요</strong>. 다음 턴까지 받는 피해가 25% 줄고 에너지를 20% 회복해요.</li></ul><p><strong>1단계 (HP 4,000):</strong> 두 멍청이는 시작하자마자 도망쳐요. 바르브외와 이첼로 싸워요. 보스가 날고 있는 동안에는 원거리 공격만 맞아요. 총격, 파멸의 사격, 이첼의 연막탄, 그리고 가지고 있다면 바르브외의 가위 던지기예요. 근접 공격은 부하들을 노릴 수 있어요. HP가 2,000 아래로 떨어지면 <strong>어쩔 수 없이 내려앉고</strong> 부하 셋을 더 불러요. 이때부터 근접 공격이 통해요.</p><p><strong>2단계 (HP 3,000):</strong> 모두의 에너지가 회복돼요(HP는 아니에요). 보스가 불꽃에 휩싸여 다시 날아오르고 새 부하 셋을 불러요. 다시 원거리 공격으로 바꾸세요.</p><p><strong>2단계, 이어서 (HP 3,000):</strong> 두 멍청이가 HP를 가득 채우고 돌아와요. 카브라칸이 내려앉아 부하 다섯을 불러요. <strong>눈에 들어간 수염</strong>을 쓸 때예요(두 멍청이가 모두 서 있어야 하고, 날고 있는 대상에게는 통하지 않아요).</p><p><strong>3단계 (HP 2,000):</strong> 선술집 장면 뒤에 이첼이 부하 셋과 함께 있는 보스와 <strong>혼자</strong> 맞서요. 공격 패턴은 같아요. 이전 전투가 끝날 때 이첼에게 생선 필레 효과가 남아 있었다면 여기서도 이어져요. 연막탄, 회복 아이템, 쿨리루 기름을 쓰세요.</p><p><strong>패배하면:</strong> 1~2단계에서는 섬으로 돌아오고 다시 도전할 수 있어요. 3단계에서는 전투가 바로 다시 시작되고, 실패한 시도에서 쓴 아이템을 돌려받아요.</p><p><strong>보상:</strong> \"절벽의 괴물 사냥하기\" 퀘스트 완료(경험치 25,000), 이어서 챕터 완료 경험치 <strong>30,000</strong>과 업적 <strong>열사병</strong>. 챕터는 바람섬 선술집에서 이첼과 나누는 대화로 끝나요.</p>", "id": "c2-boss-kab-raqan", "texte": "2장 역풍 메인 퀘스트 보스: 카브라칸 HP 바는 하나로 이어지지만(총 HP 12,000), 전투는 여러 단계로 진행돼요. 아래 피해 수치는 보통 모드 기준이에요. 모험 모드에서는 받는 피해가 모두 20% 줄어요(화염구 하나당 80, 원뿔 120, 화상 턴당 40). 보스의 행동: 첫 턴과 단계가 바뀔 때마다 부하인 카브라칸의 소환(각각 HP 200)을 불러내요. 소환들은 이첼 발밑에서 바위를 솟구치게 해요(피해 30, 2단계부터는 50). 그다음 팀 전체에 화염구 비 를 뿌려요(각각 피해 100). 세 번 공격할 때마다 비 대신 이첼에게 화염 원뿔 을 쏴요. 피해 150에 턴당 HP 50의 화상이 붙고, 반복되면 중첩돼요. 이첼의 연막탄 (전투당 5개)은 3턴 동안 보스의 공격이 두 번에 한 번 빗나가게 해요. 가장 좋은 방어 수단이에요. 이첼의 화상을 위해 쿨리루 기름을 남겨 두세요. 바르브외가 할 일이 없다면(보스가 날고 있고 원거리 공격이 없을 때) 턴을 넘기세요 . 다음 턴까지 받는 피해가 25% 줄고 에너지를 20% 회복해요. 1단계 (HP 4,000): 두 멍청이는 시작하자마자 도망쳐요. 바르브외와 이첼로 싸워요. 보스가 날고 있는 동안에는 원거리 공격만 맞아요. 총격, 파멸의 사격, 이첼의 연막탄, 그리고 가지고 있다면 바르브외의 가위 던지기예요. 근접 공격은 부하들을 노릴 수 있어요. HP가 2,000 아래로 떨어지면 어쩔 수 없이 내려앉고 부하 셋을 더 불러요. 이때부터 근접 공격이 통해요. 2단계 (HP 3,000): 모두의 에너지가 회복돼요(HP는 아니에요). 보스가 불꽃에 휩싸여 다시 날아오르고 새 부하 셋을 불러요. 다시 원거리 공격으로 바꾸세요. 2단계, 이어서 (HP 3,000): 두 멍청이가 HP를 가득 이는 아래에 남아요. 동굴 아래쪽 입구로 다시 가서 데려오세요. 두 멍청이 없이는 떠날 수 없어요.</li><li><strong>항해 일지</strong> (업적 <strong>어차피 난 글 못 읽어</strong>의 7권 중 2권):<ul><li><strong>항해 일지 III</strong>: 첫 번째 동굴의 터널, 오른쪽 위 빈 방의 해골 위</li><li><strong>항해 일지 IV</strong>: 석판 북쪽 계단 꼭대기(수수께끼를 푼 뒤), 바로 오른쪽 부서진 기둥 뒤. 고산 등반 가이드가 \"바로 제 뒤요!\"라고 말하는 곳이에요.</li><li>주우면 바로 읽을 수 있고, 인벤토리의 서재에 보관돼요.</li></ul></li><li><strong>첫 번째 동굴의 상자들:</strong> 마호가니 지팡이(최대 에너지 +20, 남동쪽 구석, 터널 경유), 맥주와 럼주가 든 상자 두 개, 터널의 함정 상자.</li><li><strong>파낼 구멍</strong> (1장에서 얻은 삽으로):<ul><li><strong>무시무시한 안대</strong>(공격 +5): 서쪽 고원 아래쪽, 세 번째 동굴 아래쪽 입구 근처</li><li>금화 약간: 서쪽 고원 가운데 10개, 서쪽 고원 위쪽 야영지 근처 8개, 석판 고원 아래 동쪽 2개, 쪽배 남서쪽 해변 1개.</li></ul></li><li><strong>눈에 들어간 수염:</strong> 이첼과의 결투 중에 자동으로 영구 해금돼요.</li><li><strong>선술집:</strong> 방문할 때마다 HP와 에너지를 무료로 회복해요.</li><li><strong>감기 걸린 선장들:</strong> 이들의 \"공격 명령\"은 이들이 서 있는 동안 모든 적이 바르브외를 노리게 해요. 먼저 쓰러뜨리세요. 두 멍청이 중 하나가 구르기를 하면 이 공격을 돌릴 수 있어요. 3턴 동안 적들이 바르브외 대신 그 멍청이를 노려요.</li><li><strong>횃불 상인:</strong> 선술집 바로 옆(업적 빛을 본 사나이).</li><li>영영 놓치는 요소는 없어요. 바람섬은 챕터가 끝난 뒤에도 갈 수 있어요.</li><li><strong>챕터 업적:</strong> <strong>열사병</strong>(2장 클리어).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "2장 역풍 놓치지 말 것 놓치지 말 것 쿨리루 기름: 없으면 쪽배로도, 이첼의 배로도 섬을 떠날 수 없어요. 카브라칸전에 쓸 3개도 챙기세요. 세 번째 동굴의 두 멍청이: 위쪽 출구(석판 쪽)로 들어가면, 두 멍청이가 무등을 태워 서쪽 고원까지 올려 주는 통로가 있어요. 그러면 두 멍청이는 아래에 남아요. 동굴 아래쪽 입구로 다시 가서 데려오세요. 두 멍청이 없이는 떠날 수 없어요. 항해 일지 (업적 어차피 난 글 못 읽어 의 7권 중 2권): 항해 일지 III : 첫 번째 동굴의 터널, 오른쪽 위 빈 방의 해골 위 항해 일지 IV : 석판 북쪽 계단 꼭대기(수수께끼를 푼 뒤), 바로 오른쪽 부서진 기둥 뒤. 고산 등반 가이드가 \"바로 제 뒤요!\"라고 말하는 곳이에요. 주우면 바로 읽을 수 있고, 인벤토리의 서재에 보관돼요. 첫 번째 동굴의 상자들: 마호가니 지팡이(최대 에너지 +20, 남동쪽 구석, 터널 경유), 맥주와 럼주가 든 상자 두 개, 터널의 함정 상자. 파낼 구멍 (1장에서 얻은 삽으로): 무시무시한 안대 (공격 +5): 서쪽 고원 아래쪽, 세 번째 동굴 아래쪽 입구 근처 금화 약간: 서쪽 고원 가운데 10개, 서쪽 고원 위쪽 야영지 근처 8개, 석판 고원 아래 동쪽 2개, 쪽배 남서쪽 해변 1개. 눈에 들어간 수염: 이첼과의 결투 중에 자동으로 영구 해금돼요. 선술집: 방문할 때마다 HP와 에너지를 무료로 회복해요. 감기 걸린 선장들: 이들의 \"공격 명령\"은 이들이 서 있는 동안 모든 적이 바르브외를 노리게 해요. 먼저 쓰러뜨리세요. 두 멍청이 중 하나가 구르기를 하면 이 공격을 돌릴 수 있어요. 3턴 동안 적들이 바르브외 대신 그 멍청이를 노려요. 횃 // Une solution commence par un gras « Solution… ». On la cache, avec la
// liste d'etapes qui la suit (paragraphe) ou qu'elle contient (element de liste).
function masquerSolutions(root) {
  const mot = MOT_SOLUTION[langue] || "Solution";
  const forts = Array.from(root.querySelectorAll(".fiche-corps strong")).filter(s => s.textContent.trim().startsWith(mot) && !s.closest(".sol"));
  for (const fort of forts) {
    const hote = fort.parentElement;
    if (!hote || !(hote.tagName === "P" || hote.tagName === "LI")) continue;
    if (hote.firstChild !== fort && hote.firstChild.textContent.trim() !== "") continue;
    const brut = fort.textContent.trim();
    const m = brut.slice(mot.length).match(/^\s*([^:：]*?)\s*[:：]\s*(.*)$/);
    let precision = "", resteFort = "";
    if (m) { precision = m[1].replace(/^[,(]\s*|\s*\)$/g, "").trim(); resteFort = m[2]; }
    const det = document.createElement("details");
    det.className = "sol";
    const sum = document.createElement("summary");
    sum.textContent = T().solution + (precision ? " (" + precision + ")" : "");
    sum.dataset.contient = T().contient;
    const corps = document.createElement("div");
    corps.className = "sol-corps";
    det.append(sum, corps);
    const p = document.createElement("p");
    if (resteFort) { const b = document.createElement("strong"); b.textContent = resteFort; p.append(b); }
    fort.remove();
    // Texte de la solution : tout ce qui suit le gras, jusqu'a une liste imbriquee.
    while (hote.firstChild) {
      const n = hote.firstChild;
      if (n.nodeType === 1 && /^(OL|UL)$/.test(n.tagName)) break;
      p.append(n);
    }
    if (p.textContent.replace(/^[\s:,.]+/, "").trim()) {
      if (p.firstChild && p.firstChild.nodeType === 3) p.firstChild.nodeValue = p.firstChild.nodeValue.replace(/^[\s:]+/, "");
      corps.append(p);
    }
    if (hote.tagName === "LI") {
      while (hote.firstChild) corps.append(hote.firstChild);
      hote.append(det);
    } else {
      // Captures qui suivent (autant qu'il y en a) et au plus une liste d'etapes.
      let suivant = hote.nextElementSibling, liste = false;
      while (suivant && (suivant.matches("figure.capture") || (!liste && /^(OL|UL)$/.test(suivant.tagName)))) {
        if (suivant.tagName !== "FIGURE") liste = true;
        const apres = suivant.nextElementSibling;
        corps.append(suivant);
        suivant = apres;
      }
      hote.replaceWith(det);
    }
  }
}

function nettoyerMarques(root) {
  root.querySelectorAll("mark").forEach(m => { const t = document.createTextNode(m.textContent); m.replaceWith(t); });
  root.normalize();
}

function surligner(root, termes) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentNode.closest("button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const noeuds = [];
  while (walker.nextNode()) noeuds.push(walker.currentNode);
  for (const nd of noeuds) {
    const txt = nd.nodeValue, f = fold(txt);
    const zones = [];
    for (const t of termes) {
      let i = f.indexOf(t);
      while (i !== -1) { zones.push([i, i + t.length]); i = f.indexOf(t, i + t.length); }
    }
    if (!zones.length) continue;
    zones.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [a, b] of zones) {
      if (a < pos) continue;
      frag.appendChild(document.createTextNode(txt.slice(pos, a)));
      const m = document.createElement("mark"); m.textContent = txt.slice(a, b); frag.appendChild(m);
      pos = b;
    }
    frag.appendChild(document.createTextNode(txt.slice(pos)));
    nd.replaceWith(frag);
  }
}

function filtrer() {
  const main = document.getElementById("contenu");
  const q = fold(document.getElementById("q").value.trim());
  const termes = q.split(/\s+/).filter(t => t.length > 1);
  nettoyerMarques(main);
  main.querySelectorAll(".sol.contient").forEach(d => d.classList.remove("contient"));
  let visibles = 0;
  for (const f of main.querySelectorAll(".fiche")) {
    const ok = !termes.length || termes.every(t => f.dataset.texte.includes(t));
    f.hidden = !ok;
    if (ok) visibles++;
    const li = document.querySelector(`#sommaire li[data-ref="${f.id}"]`);
    if (li) li.classList.toggle("cache", !ok);
  }
  for (const s of main.querySelectorAll(".section")) s.hidden = !s.querySelector(".fiche:not([hidden])");
  for (const c of main.querySelectorAll(".chapitre")) {
    c.hidden = !c.querySelector(".fiche:not([hidden])");
    const intro = c.querySelector(":scope > .chap-intro");
    if (intro) intro.hidden = termes.length > 0;
  }
  document.querySelectorAll("#sommaire details").forEach(d => {
    const vis = d.querySelector("li[data-ref]:not(.cache)");
    d.hidden = !vis;
    if (termes.length) d.open = !!vis;
  });
  document.querySelectorAll("#sommaire .sec-li").forEach(li => {
    let n = li.nextElementSibling, vis = false;
    while (n && !n.classList.contains("sec-li")) { if (!n.classList.contains("cache")) vis = true; n = n.nextElementSibling; }
    li.classList.toggle("cache", !vis);
  });
  document.getElementById("vide").hidden = visibles > 0;
  document.getElementById("compte").textContent = termes.length ? T().compte(visibles) : "";
  if (termes.length) {
    for (const f of main.querySelectorAll(".fiche:not([hidden])")) {
      surligner(f, termes);
      f.querySelectorAll(".sol:not([open])").forEach(d => { if (d.querySelector("mark")) d.classList.add("contient"); });
    }
  }
}

// Version artefact : lien claude.ai fixe. Version autonome : l'adresse ou la page est hebergee
// (rien a copier si le fichier est ouvert depuis le disque).
function baseLiens() {
  if (BASE) return BASE;
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : "";
}

function copierLien(btn) {
  const id = btn.dataset.id;
  const url = baseLiens() + (LANGUES.length > 1 ? "?lang=" + langue : "") + "#" + id;
  const fiche = btn.closest(".fiche");
  const done = () => { btn.textContent = T().copie; setTimeout(() => btn.textContent = T().copier, 1600); };
  const montrer = () => {
    let z = fiche.querySelector(".lien-zone");
    if (!z) { z = document.createElement("input"); z.className = "lien-zone"; z.readOnly = true; fiche.querySelector(".fiche-tete").after(z); }
    z.value = url; z.select(); btn.textContent = T().selection;
  };
  try { navigator.clipboard.writeText(url).then(done, montrer); } catch (e) { montrer(); }
}

function changerLangue(l) {

    if (u.searchParams.has("lang")) { u.searchParams.set("lang", l); history.replaceState(null, "", u); }
  } catch (e) {}
  appliquerTextes();

  zone.innerHTML = LANGUES.map(l => `<button type="button" data-langue="${l}" lang="${l}">${l.toUpperCase()}</button>`).join("");
  zone.hidden = false;
  zone.addEventListener("click", e => { const b = e.target.closest("button[data-langue]"); if (b) changerLangue(b.dataset.langue); });
}
appliquerTextes();
rendre();
if (!baseLiens()) document.body.classList.add("sans-liens");
box.addEventListener("change", () => { toutesSolutions(box.checked); try { localStorage.setItem(CLE, box.checked ? "1" : "0"); } catch (e) {} });

let minuteur;
document.getElementById("q").addEventListener("input", () => { clearTimeout(minuteur); minuteur = setTimeout(filtrer, 120); });
document.getElementById("contenu").addEventListener("click", e => {
  const b = e.target.closest(".lien"); if (b) copierLien(b);
  const p = e.target.closest(".pastille");
  if (p) { montrerBulle(p); return; }
  const z = e.target.closest(".zoom");
  if (z) {
    fermerBulles();
    const v = document.getElementById("visionneuse"), vc = document.getElementById("vcarte");
    vc.querySelectorAll(".couche, .bulle").forEach(x => x.remove());
    vc.querySelector("img").src = z.querySelector("img").src;
    const couche = z.parentElement.querySelector(".couche");
    if (couche) vc.append(couche.cloneNode(true));
    v.hidden = false;
    return;
  }
  if (!e.target.closest(".bulle")) fermerBulles();
});
document.getElementById("visionneuse").addEventListener("click", e => {
  const p = e.target.closest(".pastille");
  if (p) { e.stopPropagation(); montrerBulle(p); return; }
  fermerBulles(); e.currentTarget.hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { fermerBulles(); document.getElementById("visionneuse").hidden = true; } });
document.getElementById("sommaire").addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.replaceState(null, "", "#" + id); } catch (err) {}
  allerA(id);
  if (window.matchMedia("(max-width: 860px)").matches) document.getElementById("sommaire").classList.remove("ouvert");
});
document.getElementById("btn-sommaire").addEventListener("click", () => document.getElementById("sommaire").classList.toggle("ouvert"));
window.addEventListener("hashchange", () => allerA(location.hash.slice(1)));
if (location.hash.length > 1) setTimeout(() => allerA(location.hash.slice(1)), 50);
</script>
