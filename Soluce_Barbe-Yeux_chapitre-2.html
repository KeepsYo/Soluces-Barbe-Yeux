e so at the boat. One application is enough for the rest of the game. Answer “Yes” to “Travel to Olive Island?”. You can also refuse and finish your side quests first.", "sol": 0}]}, {"titre": "Side quests", "intro": "<p>Each one is worth <strong>10 000 XP</strong>. They all count towards the <strong>Jack of all trades</strong> achievement (every side quest in the game).</p>", "entrees": [{"titre": "Recover the fisherman's clamp", "html": "<ul><li><strong>Where:</strong> the fisherman, house in the south-west of the village, near the boat.</li><li><strong>Steps:</strong> accept, then pick up the <strong>Fisherman's clamp</strong> in the first cave (top-left room). Bring it back.</li><li><strong>Reward:</strong> 10 000 XP, and he immediately offers you “Uncover the secret of the Coulirou”. From now on, he also offers trades for your fish:<ul><li>Silver bass → <strong>Fine fish fillet</strong> (in battle, regenerates 10% of HP per turn);</li><li>Flatfish → <strong>Throwing fish</strong> (35 damage, thrown by the Two Numpties);</li><li>Mackerel → 1 gold coin;</li><li>Coulirou → <strong>Coulirou grease</strong> (once the secret is uncovered).</li></ul></li><li>Before the secret of the Coulirou, he sells <strong>Coulirou grease for 20 coins</strong> (the option only appears if you have at least 20 coins).</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "Chapter 2 Contrary Winds Side quests Recover the fisherman's clamp Where: the fisherman, house in the south-west of the village, near the boat. Steps: accept, then pick up the Fisherman's clamp in the first cave (top-left room). Bring it back. Reward: 10 000 XP, and he immediately offers you “Uncover the secret of the Coulirou”. From now on, he also offers trades for your fish: Silver bass → Fine fish fillet (in battle, regenerates 10% of HP per turn); Flatfish → Throwing fish (35 damage, thrown by the Two Numpties); Mackerel → 1 gold coin; Coulirou → Coulirou grease (once the secret is uncovered). Before the secret of the Coulirou, he sells Coulirou grease for 20 coins (the option only appears if you have at least 20 coins).", "sol": 0}, {"titre": "Uncover the secret of the Coulirou", "html": "<ul><li><strong>Where:</strong> the fisherman, after the clamp quest. If you refused, talk to him again.</li><li><strong>Steps:</strong><ol><li>Pick up <strong>3 Soft seaweed</strong>. There are only three on the island, so don't get rid of them: one on the beach south-west of the boat, one on the east coast (following the shore north from the village), one in the far north-east (after the second cave).</li><li>At the tavern, choose <strong>Ask for overcooked lentils.</strong> (the option only appears once the quest is accepted).</li><li>Give everything to the fisherman.</li></ol></li><li><strong>Reward:</strong> 10 000 XP and <strong>Coulirou fishing</strong> unlocked (see Mini-games).</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "Chapter 2 Contrary Winds Side quests Uncover the secret of the Coulirou Where: the fisherman, after the clamp quest. If you refused, talk to him again. Steps: Pick up 3 Soft seaweed . There are only three on the island, so don't get rid of them: one on the beach south-west of the boat, one on the east coast (following the shore north from the village), one in the far north-east (after the second cave). At the tavern, choose Ask for overcooked lentils. (the option only appears once the quest is accepted). Give everything to the fisherman. Reward: 10 000 XP and Coulirou fishing unlocked (see Mini-games).", "sol": 0}, {"titre": "Return the fisherwoman's net", "html": "<ul><li><strong>Where:</strong> the fisherwoman, house in the east of the village.</li><li><strong>Steps:</strong> the <strong>Weighted net</strong> is in the bandit fishermen's camp, in the north-east of the island (after the second cave). You have to beat the group guarding it.</li><li><strong>Reward:</strong> 10 000 XP.</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "Chapter 2 Contrary Winds Side quests Return the fisherwoman's net Where: the fisherwoman, house in the east of the village. Steps: the Weighted net is in the bandit fishermen's camp, in the north-east of the island (after the second cave). You have to beat the group guarding it. Reward: 10 000 XP.", "sol": 0}, {"titre": "Sweeten the cliff soup", "html": "<ul><li><strong>Where:</strong> the tavern cook, in the west of the village.</li><li><strong>Ingredients:</strong><ul><li><strong>Sweet seaweed</strong>: north-east of the island, just south of the bandit fishermen's camp;</li><li><strong>Grey salt</strong>: the first cave's tunnel, top-left room;</li><li><strong>Barrel of olive oil</strong>: second cave, left room;</li><li><strong>High-Wind flower</strong>: at the east end of the summit platform, in Kab'raqan's arena. To reach it, you have to cross the area that starts the fight: pick it after your victory (the summit is then “at peace”).</li></ul></li><li><strong>Reward:</strong> 10 000 XP.</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "Chapter 2 Contrary Winds Side quests Sweeten the cliff soup Where: the tavern cook, in the west of the village. Ingredients: Sweet seaweed : north-east of the island, just south of the bandit fishermen's camp; Grey salt : the first cave's tunnel, top-left room; Barrel of olive oil : second cave, left room; High-Wind flower : at the east end of the summit platform, in Kab'raqan's arena. To reach it, you have to cross the area that starts the fight: pick it after your victory (the summit is then “at peace”). Reward: 10 000 XP.", "sol": 0}, {"titre": "Later: Clean house", "html": "<p>The mayor offers this quest long after this chapter, once the Crab Island innkeeper mentions it (after chapter 5). It is not part of chapter 2.</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "Chapter 2 Contrary Winds Side quests Later: Clean house The mayor offers this quest long after this chapter, once the Crab Island innkeeper mentions it (after chapter 5). It is not part of chapter 2.", "sol": 0}]}, {"titre": "Mini-games", "intro": "", "entrees": [{"titre": "Coulirou fishing", "html": "<ul><li><strong>Where:</strong> the small jetty east of the boat, south of the village. Available after “Uncover the secret of the Coulirou”.</li><li><strong>Rules:</strong> like the fishing on Crab Island. When something bites, repeat the arrow combination shown within the time limit. For the Coulirou: <strong>left, up, right, down</strong>.</li><li>Your first catch here is always a Coulirou. After that, one catch in two is a Coulirou; the others are ordinary fish (silver bass, flatfish, mackerel…).</li><li><strong>Reward:</strong> each Coulirou can be traded for a Coulirou grease at the fisherman's. The Coulirou is one of the 7 species for the <strong>Smells a bit funny, no?</strong> achievement (every species caught).</li></ul>", "id": "c2-peche-au-coulirou", "texte": "Chapter 2 Contrary Winds Mini-games Coulirou fishing Where: the small jetty east of the boat, south of the village. Available after “Uncover the secret of the Coulirou”. Rules: like the fishing on Crab Island. When something bites, repeat the arrow combination shown within the time limit. For the Coulirou: left, up, right, down . Your first catch here is always a Coulirou. After that, one catch in two is a Coulirou; the others are ordinary fish (silver bass, flatfish, mackerel…). Reward: each Coulirou can be traded for a Coulirou grease at the fisherman's. The Coulirou is one of the 7 species for the Smells a bit funny, no? achievement (every species caught).", "sol": 0}, {"titre": "The Lying Eye (tavern dice)", "html": "<ul><li><strong>Where:</strong> Windward Island tavern, “Play dice.”.</li><li>Same rules as on Crab Island, but against Mirette the Sly, Brasse-Gobelet the Brute and Jean-Charles the Crafty.</li><li>Higher stakes: up to 20, 30 or 50 coins depending on whether you play with 3, 4 or 5 dice.</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "Chapter 2 Contrary Winds Mini-games The Lying Eye (tavern dice) Where: Windward Island tavern, “Play dice.”. Same rules as on Crab Island, but against Mirette the Sly, Brasse-Gobelet the Brute and Jean-Charles the Crafty. Higher stakes: up to 20, 30 or 50 coins depending on whether you play with 3, 4 or 5 dice.", "sol": 0}]}, {"titre": "Don't miss", "intro": "", "entrees": [{"titre": "Don't miss", "html": "<ul><li><strong>Coulirou grease:</strong> without it, you can't leave the island, neither by boat nor on Itzel's ship. Also take 3 for Kab'raqan.</li><li><strong>The Two Numpties at the third cave:</strong> if you enter by the upper exit (slab side), a passage lets them give you a leg up to the western plateau. They then stay down below. Go back through the cave's lower entrance to pick them up: without them, you can't leave.</li><li><strong>Ship's logs</strong> (2 of the 7 for the <strong>Not like I can read anyway</strong> achievement):<ul><li><strong>Ship's log III</strong>: first cave's tunnel, on the skeleton in the empty top-right room;</li><li><strong>Ship's log IV</strong>: at the top of the stairs north of the slabs (after the puzzle), hidden behind the broken column just to the right, where the high mountain guide says “Right behind me!”;</li><li>they can be read as soon as you pick them up and are stored in the inventory's library.</li></ul></li><li><strong>First cave chests:</strong> Mahogany cane (+20 max energy, south-east nook, through the tunnel), two chests of beers and rums, and the tunnel's booby-trapped chest.</li><li><strong>Holes to dig</strong> (with the shovel found in chapter 1):<ul><li><strong>Scary eyepatch</strong> (+5 ATK): bottom of the western plateau, not far from the third cave's lower entrance;</li><li>a few coins: 10 in the middle of the western plateau, 8 at the top of the western plateau near the camp, 2 to the east, below the slab plateau, 1 on the beach south-west of the boat.</li></ul></li><li><strong>Beard Hairs in the Eyes:</strong> permanently unlocked during the duel against Itzel, automatically.</li><li><strong>Tavern:</strong> every visit restores your HP and energy, for free.</li><li><strong>Sniffling captains:</strong> their “Attack order” makes every enemy target Barbe-Yeux as long as they're standing. Take them down first. A roll from one of the Two Numpties diverts these attacks: for 3 turns, the enemies target that Numpty instead of Barbe-Yeux.</li><li><strong>Torch merchant:</strong> right next to the tavern (An enlightened man achievement).</li><li>Nothing is permanently lost: Windward Island stays accessible after the chapter.</li><li><strong>Chapter achievement:</strong> <strong>Heatstroke</strong> (finish chapter 2).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "Chapter 2 Contrary Winds Don't miss Don't miss Coulirou grease: without it, you can't leave the island, neither by boat nor on Itzel's ship. Also take 3 for Kab'raqan. The Two Numpties at the third cave: if you enter by the upper exit (slab side), a passage lets them give you a leg up to the western plateau. They then stay down below. Go back through the cave's lower entrance to pick them up: without them, you can't leave. Ship's logs (2 of the 7 for the Not like I can read anyway achievement): Ship's log III : first cave's tunnel, on the skeleton in the empty top-right room; Ship's log IV : at the top of the stairs north of the slabs (after the puzzle), hidden behind the broken column just to the right, where the high mountain guide says “Right behind me!”; they can be read as soon as you pick them up and are stored in the inventory's library. First cave chests: Mahogany cane (+20 max energy, south-east nook, through the tunnel), two chests of beers and rums, and the tunnel's booby-trapped chest. Holes to dig (with the shovel found in chapter 1): Scary eyepatch (+5 ATK): bottom of the western plateau, not far from the third cave's lower entrance; a few coins: 10 in the middle of the western plateau, 8 at the top of the western plateau near the camp, 2 to the east, below the slab plateau, 1 on the beach south-west of the boat. Beard Hairs in the Eyes: permanently unlocked during the duel against Itzel, automatically. Tavern: every visit restores your HP and energy, for free. Sniffling captains: their “Attack order” makes every enemy target Barbe-Yeux as long as they're standing. Take them down first. A roll from one of the Two Numpties diverts these attacks: for 3 turns, the enemies target that Numpty instead of Barbe-Yeux. Torch merchant: right next to the tavern (An enlightened man achievement). Nothing is permanently lost: Windward Island stays accessible after the chapter. Chapter achievement: Heatstroke (finish chapter 2).", "sol": 0}]}]}], "de": [{"id": "c2", "num": "Kapitel 2", "titre": "Gegenwind", "intro": "<p>Von der Seebrigade verhaftet, wacht Barbe-Yeux im Gefängnis auf, mit einem höchst seltsamen alten Knacki als Nachbarn. Einen Ausbruch später tut er sich (gezwungenermaßen) mit Itzel der Stummen zusammen und nimmt Kurs auf die Windinsel, wo ein Monster oben auf den Klippen das ganze Dorf verpestet.</p>", "sections": [{"titre": "Hauptquest", "intro": "", "entrees": [{"titre": "Gefängnis: aus der Zelle ausbrechen (kein Ziel angezeigt)", "html": "<ol><li>Das Kapitel beginnt in deiner Zelle, oben rechts im Gefängnis. Der alte Knacki spricht dich nach einer Sekunde von selbst an.</li><li>Er gibt dir das <strong>Löchrige Pergament</strong> und dann eine <strong>Fischgräte</strong>. Alles Weitere läuft automatisch: Barbe-Yeux liest das Pergament (schließ das Fenster, um weiterzumachen), knackt das Schloss mit der Gräte, und die Zellentüren gehen auf.</li><li>Jetzt musst du das Gefängnis durchqueren, ohne gesehen zu werden (siehe Kasten unten).</li></ol><p><strong>So funktionieren die Wachen</strong> (zehn Wachen drehen ihre Runden im großen Saal):</p><ul><li>Jede Wache sieht in einem Kegel vor sich. Bleibst du etwa 1,5 Sekunden in diesem Kegel, schnappt sie dich. Wände blockieren die Sicht.</li><li>Kommst du einer Wache ganz nahe (von vorn oder von der Seite), schnappt sie dich sofort. Nur ihr Rücken ist ein toter Winkel.</li><li>In deiner Zelle bist du sicher.</li><li><strong>Zünde deine Fackel nicht an</strong>: Wachen, die das Licht sehen, verlassen ihre Runde und kommen auf dich zu.</li><li>Wirst du erwischt, bringt dich der Wachtmeister nach einer kleinen Standpauke zurück in deine Zelle. Keine weitere Strafe: Versuch es einfach noch einmal.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "Kapitel 2 Gegenwind Hauptquest Gefängnis: aus der Zelle ausbrechen (kein Ziel angezeigt) Das Kapitel beginnt in deiner Zelle, oben rechts im Gefängnis. Der alte Knacki spricht dich nach einer Sekunde von selbst an. Er gibt dir das Löchrige Pergament und dann eine Fischgräte . Alles Weitere läuft automatisch: Barbe-Yeux liest das Pergament (schließ das Fenster, um weiterzumachen), knackt das Schloss mit der Gräte, und die Zellentüren gehen auf. Jetzt musst du das Gefängnis durchqueren, ohne gesehen zu werden (siehe Kasten unten). So funktionieren die Wachen (zehn Wachen drehen ihre Runden im großen Saal): Jede Wache sieht in einem Kegel vor sich. Bleibst du etwa 1,5 Sekunden in diesem Kegel, schnappt sie dich. Wände blockieren die Sicht. Kommst du einer Wache ganz nahe (von vorn oder von der Seite), schnappt sie dich sofort. Nur ihr Rücken ist ein toter Winkel. In deiner Zelle bist du sicher. Zünde deine Fackel nicht an : Wachen, die das Licht sehen, verlassen ihre Runde und kommen auf dich zu. Wirst du erwischt, bringt dich der Wachtmeister nach einer kleinen Standpauke zurück in deine Zelle. Keine weitere Strafe: Versuch es einfach noch einmal.", "sol": 0}, {"titre": "Gefängnis: den Schlüssel finden und raus", "html": "<ol><li>Geh hinunter bis zur kleinen Wachstube, links in der Mitte der Karte (der Eingang ist unten). Am Schlüsselbrett hängt ein Schlüsselbund.</li><li>Geh zum Brett und wähle <strong>Durchsuchen</strong>: Du bekommst den <strong>Generalschlüssel</strong>.</li><li>Geh zur Treppe unten rechts. Ohne den Schlüssel sagt dir das Spiel „Ihr braucht einen Schlüssel, um hier rauszukommen.“</li><li><strong>Patrouillensaal</strong>: Fünf Wachen drehen hier ihre Runden, mit denselben Sichtregeln. Du kommst im Westen herein, der Ausgang liegt im Osten. Geh weiter, wenn sie dir den Rücken zukehren. Wirst du hier erwischt, fängst du wieder in deiner Zelle an, behältst aber den Schlüssel.</li><li>Beim Durchschreiten der Tür wird der Schlüssel verbraucht, und das Gitter schließt sich hinter dir („jetzt gibt es kein Zurück mehr“). Etwa zehn Wachen kommen von Osten herein und laufen auf dich zu. <strong>Beweg dich nicht, bleib am Eingang</strong>: Auf diese Entfernung sehen sie dich nicht. Nach ihrem Dialog („SIE IST ES!!!“) rennen sie wieder nach Osten davon. Dann kannst du den Saal durchqueren und den Ausgang im Osten nehmen.</li><li>Letzter Raum: Am Boden liegen Wachen. Geh nach Osten, um die Begegnung mit der Unbekannten auszulösen.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "Kapitel 2 Gegenwind Hauptquest Gefängnis: den Schlüssel finden und raus Geh hinunter bis zur kleinen Wachstube, links in der Mitte der Karte (der Eingang ist unten). Am Schlüsselbrett hängt ein Schlüsselbund. Geh zum Brett und wähle Durchsuchen : Du bekommst den Generalschlüssel . Geh zur Treppe unten rechts. Ohne den Schlüssel sagt dir das Spiel „Ihr braucht einen Schlüssel, um hier rauszukommen.“ Patrouillensaal : Fünf Wachen drehen hier ihre Runden, mit denselben Sichtregeln. Du kommst im Westen herein, der Ausgang liegt im Osten. Geh weiter, wenn sie dir den Rücken zukehren. Wirst du hier erwischt, fängst du wieder in deiner Zelle an, behältst aber den Schlüssel. Beim Durchschreiten der Tür wird der Schlüssel verbraucht, und das Gitter schließt sich hinter dir („jetzt gibt es kein Zurück mehr“). Etwa zehn Wachen kommen von Osten herein und laufen auf dich zu. Beweg dich nicht, bleib am Eingang : Auf diese Entfernung sehen sie dich nicht. Nach ihrem Dialog („SIE IST ES!!!“) rennen sie wieder nach Osten davon. Dann kannst du den Saal durchqueren und den Ausgang im Osten nehmen. Letzter Raum: Am Boden liegen Wachen. Geh nach Osten, um die Begegnung mit der Unbekannten auszulösen.", "sol": 0}, {"titre": "Geskripteter Kampf: die Unbekannte (Itzel)", "html": "<ul><li>Du kämpfst an der Seite von Kapitän Dubreuil und Oberwachtmeister Bichon. Die Unbekannte zielt nur auf die beiden Wachen.</li><li>Sie kann nicht fallen. Wenn sie fast bei null ist, steigt sie wieder auf 500 LP („Nicht so…“).</li><li>Der Kampf endet, wenn die beiden Wachen am Boden liegen. Spiel deine Züge ganz normal, der Ausgang steht fest.</li><li>Danach stellt sich die Unbekannte vor: Itzel, genannt die Stumme. Ihr holt die zwei Trottel ab.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "Kapitel 2 Gegenwind Hauptquest Geskripteter Kampf: die Unbekannte (Itzel) Du kämpfst an der Seite von Kapitän Dubreuil und Oberwachtmeister Bichon. Die Unbekannte zielt nur auf die beiden Wachen. Sie kann nicht fallen. Wenn sie fast bei null ist, steigt sie wieder auf 500 LP („Nicht so…“). Der Kampf endet, wenn die beiden Wachen am Boden liegen. Spiel deine Züge ganz normal, der Ausgang steht fest. Danach stellt sich die Unbekannte vor: Itzel, genannt die Stumme. Ihr holt die zwei Trottel ab.", "sol": 0}, {"titre": "Das Wiedersehen und das Duell gegen Itzel", "html": "<ol><li>Automatische Szenen auf Itzels Schiff: Die zwei Trottel kommen zurück in die Mannschaft (mit einem ordentlichen Sonnenbrand). Barbe-Yeux „behandelt“ das löchrige Pergament mit der heiligen Ambrosia, die der alte Knacki angekündigt hat… Die versteckten Buchstaben enthüllen <strong>DIE WINDINSEL</strong>.</li><li>Automatische Überfahrt zur Windinsel, dann fordert dich Itzel, mit den Nerven am Ende, zum Duell.</li><li><strong>Duell gegen Itzel die Stumme</strong> (geskripteter Kampf, nicht wirklich zu gewinnen oder zu verlieren):<ul><li>Bis zur unten beschriebenen Freischaltung kann Barbe-Yeux nicht fallen: Er bleibt mit 1–3 LP „aus reiner Sturheit“ stehen.</li><li>Sobald Barbe-Yeux unter 40 % seiner LP fällt, schaltet er seinen Markenzeichen-Angriff <strong>Barthaare in den Augen</strong> endgültig frei. In diesem Zug ist das die einzige mögliche Aktion: Setz sie ein.</li><li>Der Angriff kostet keine Energie, sondern 30 % der verbleibenden LP von Barbe-Yeux. Die zwei Trottel schlagen jeweils 5- bis 7-mal zu. Beide Trottel müssen stehen. In der Hälfte der Fälle provoziert Barbe-Yeux zusätzlich die Gegner für 3 Runden: Sie zielen dann auf ihn.</li><li>Wenn Itzel auf 30 % ihrer LP fällt (oder dich gleich erledigen würde), antwortet sie mit ihrem eigenen Markenzeichen-Angriff, sechs Schüssen, und der Kampf endet.</li></ul></li><li>Du landest mit 1 LP auf der Windinsel. <strong>Tipp</strong>: Wenn du die Taverne im Dorf betrittst, werden deine LP und deine Energie kostenlos aufgefüllt.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "Kapitel 2 Gegenwind Hauptquest Das Wiedersehen und das Duell gegen Itzel Automatische Szenen auf Itzels Schiff: Die zwei Trottel kommen zurück in die Mannschaft (mit einem ordentlichen Sonnenbrand). Barbe-Yeux „behandelt“ das löchrige Pergament mit der heiligen Ambrosia, die der alte Knacki angekündigt hat… Die versteckten Buchstaben enthüllen DIE WINDINSEL . Automatische Überfahrt zur Windinsel, dann fordert dich Itzel, mit den Nerven am Ende, zum Duell. Duell gegen Itzel die Stumme (geskripteter Kampf, nicht wirklich zu gewinnen oder zu verlieren): Bis zur unten beschriebenen Freischaltung kann Barbe-Yeux nicht fallen: Er bleibt mit 1–3 LP „aus reiner Sturheit“ stehen. Sobald Barbe-Yeux unter 40 % seiner LP fällt, schaltet er seinen Markenzeichen-Angriff Barthaare in den Augen endgültig frei. In diesem Zug ist das die einzige mögliche Aktion: Setz sie ein. Der Angriff kostet keine Energie, sondern 30 % der verbleibenden LP von Barbe-Yeux. Die zwei Trottel schlagen jeweils 5- bis 7-mal zu. Beide Trottel müssen stehen. In der Hälfte der Fälle provoziert Barbe-Yeux zusätzlich die Gegner für 3 Runden: Sie zielen dann auf ihn. Wenn Itzel auf 30 % ihrer LP fällt (oder dich gleich erledigen würde), antwortet sie mit ihrem eigenen Markenzeichen-Angriff, sechs Schüssen, und der Kampf endet. Du landest mit 1 LP auf der Windinsel. Tipp : Wenn du die Taverne im Dorf betrittst, werden deine LP und deine Energie kostenlos aufgefüllt.", "sol": 0}, {"titre": "Nützliche Infos finden.", "html": "<p><em>(Teilziel: Die Dorfbewohner befragen.)</em></p><ol><li>Geh zum <strong>Bürgermeister</strong> in sein Haus in der Dorfmitte. Er erzählt dir vom Monster auf der höchsten Klippe, von den Räubern in den Grotten und vom alten Plattenmechanismus, der den Weg zum Gipfel versperrt.</li><li>Die Hauptquest <strong>Das Klippenmonster jagen</strong> startet automatisch.</li><li><strong>Achtung:</strong> Du kannst die Insel nicht sofort verlassen. Am Boot sind die zwei Trottel wegen ihres Sonnenbrands „nicht seetauglich“. Du brauchst <strong>Coulirou-Fett</strong> (siehe die Quests des Fischers: Er verkauft es ab eurem ersten Gespräch für 20 Taler).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "Kapitel 2 Gegenwind Hauptquest Nützliche Infos finden. (Teilziel: Die Dorfbewohner befragen.) Geh zum Bürgermeister in sein Haus in der Dorfmitte. Er erzählt dir vom Monster auf der höchsten Klippe, von den Räubern in den Grotten und vom alten Plattenmechanismus, der den Weg zum Gipfel versperrt. Die Hauptquest Das Klippenmonster jagen startet automatisch. Achtung: Du kannst die Insel nicht sofort verlassen. Am Boot sind die zwei Trottel wegen ihres Sonnenbrands „nicht seetauglich“. Du brauchst Coulirou-Fett (siehe die Quests des Fischers: Er verkauft es ab eurem ersten Gespräch für 20 Taler).", "sol": 0}, {"titre": "Den Gipfel erreichen und das Monster besiegen.", "html": "<p><em>(Teilziel: Die Grotten und den alten Plattenmechanismus durchqueren.)</em></p><p><strong>Der Weg zu den Platten:</strong></p><ol><li>Klettere die Leiter neben der Taverne hinauf (westlich des Dorfs) und durchquere die Felder im Westen. Der Grotteneingang öffnet sich in der Klippe, nördlich der Felder. Auf den Feldern, direkt unterhalb des Eingangs, spricht dich ein <strong>Höhlenführer</strong> an und bringt dich hin. Lass dich führen: Barbe-Yeux folgt ihm von selbst. Er begleitet dich nicht hinein, und du triffst ihn nur einmal.</li><li><strong>Klippengrotte</strong>: vier Räume, von Räubern bewacht (feste Kämpfe, jeweils nur einmal). Dort findest du:<ul><li>die <strong>Fischerklammer</strong>, im Raum oben links;</li><li>eine Truhe (15 Taler, 2 Bier, 2 Rum) im selben Raum;</li><li>eine Truhe (5 Bier, 3 Rum), oben in der Mitte, nahe der Treppe zur zweiten Grotte.</li><li>Der Eingang zum <strong>Tunnel</strong> liegt im Raum oben rechts. Du kommst oben im mittleren Gang des Tunnels an. Dort findest du das <strong>Graue Salz</strong> (Raum oben links) und eine <strong>Fallenkiste</strong> (großer Raum unten links; sie ist ein Monster, die Fallenkiste: Besiege sie für 15 Taler und 2 Bier). Das <strong>Logbuch III</strong> liegt bei einem Skelett, mitten im leeren Raum oben rechts (hinauf geht es über die Treppe unten in diesem Raum). Der untere Ausgang des Tunnels bringt dich in einen Winkel im Südosten der Grotte, mit einer besonderen Truhe: dem <strong>Mahagonistock</strong> (+20 max. Energie) und 10 Talern.</li></ul></li><li>Nimm die Treppe oben in der Mitte: <strong>zweite Grotte</strong>. Das <strong>Fass Olivenöl</strong> steht im linken Raum. Durchquere die Räume (drei Räubergruppen) bis zum Ausgang unten rechts. Er führt in den Nordosten der Insel.</li><li><strong>Nordosten der Insel</strong>: ein Lager von Fischer-Banditen (fester Kampf gegen drei Fischer und eine Fischerin). Das <strong>Beschwerte Netz</strong> ist in diesem Lager. Die <strong>Milden Algen</strong> liegen direkt südlich des Lagers, eine <strong>Labbrige Alge</strong> am Wasser ganz im Nordosten.</li><li>Geh über den Norden der Insel nach Westen. Du erreichst das große Westplateau (Banditenlager, Zufallskämpfe; im Abenteuermodus gelingt die Flucht immer).</li><li><strong>Klippenpergament (unverzichtbar)</strong>: Im Norden des Westplateaus, nahe dem Lager, öffnet sich ein Loch im Boden. Spring hinein: Du fällst in einen geschlossenen Raum der zweiten Grotte (den mittleren Raum ohne Tür: Dieses Loch ist der einzige Weg hinein). Dort wartet das <strong>Klippenpergament</strong> auf dich. Ein weiteres Loch im selben Raum (Ecke unten rechts) bringt dich zurück in die erste Grotte.</li><li>Geh das Westplateau hinunter bis zum unteren Eingang der <strong>dritten Grotte</strong>, südlich des Plateaus. Durchquere sie: Der Ausgang (oben rechts) führt auf das Plateau mit den Platten. Dort wartet Itzel auf dich.</li></ol><p><strong>Das Plattenrätsel</strong> <em>(Teilziel: Den alten Plattenmechanismus lösen.)</em></p><p>Neun Platten bilden ein 3 × 3-Raster:</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>Du musst in der richtigen Reihenfolge auf vier Platten treten. Sprich mit Itzel: Ohne das Klippenpergament sagt sie dir, dass etwas fehlt.</p><p>Die Logik: Öffne das <strong>Klippenpergament</strong> aus dem Inventar und klick dann auf <strong>Löchriges Pergament benutzen</strong>. Das löchrige Pergament legt sich darüber, und du kannst es verschieben. Seine vier Löcher sind durch eine gepunktete Linie verbunden, die in einem Pfeil endet. Schieb es nach links (etwa ein Fünftel seiner Breite) und ein wenig nach unten (etwa ein Achtel seiner Höhe), bis das große Loch am Ende des Pfeils das <strong>R</strong> am linken Rand umrahmt (das unter dem B). Die Löcher zeigen dann in der Reihenfolge der gepunkteten Linie <strong>H</strong> (das kleine Startloch), <strong>J</strong> (das große Loch unten), <strong>F</strong> (das rechte Loch) und dann <strong>R</strong>. Der Hinweis im Quest-Journal bestätigt: „Der letzte Buchstabe scheint ein R zu sein…“</p><p><strong>Lösung: Tritt auf H (oben rechts), dann J (unten Mitte), dann F (Mitte rechts), dann R (oben links).</strong></p><ul><li>Tritt dazwischen auf keine andere Platte: Geh zwischen den Platten hindurch.</li><li>Nach vier Platten zeigt das Spiel „Sieg!“ oder „Niederlage!“ an. Nach einer Niederlage beginnt die Folge von vorn.</li><li>Trödel nicht: Vergehen zwischen zwei Platten mehr als 10 Sekunden, beginnt der Versuch erneut bei der Platte, die du gerade betreten hast.</li><li>Bei Erfolg öffnen sich zwei Durchgänge: die Treppe hinauf zum Gipfel (nördlich der Platten) und die Leiter direkt hinunter ins Dorf (Abkürzung). Die beiden Pergamente, die nun nutzlos sind, verschwinden aus deinem Inventar.</li></ul><p><strong>Den Kampf vorbereiten</strong> Das Journal empfiehlt: Stufe 18, Fischfilets, 10 Bier, 10 Rum und 3 Coulirou-Fett (es heilt Verbrennungen).</p><p>Steig die Treppe nördlich der Platten hinauf. Oben, auf dem Ruinenplateau, wartet ein <strong>Hochgebirgsführer</strong> auf dich. Er zeigt dir „die schönste Ecke hier“: „Direkt hinter mir!“, und tritt dann zur Seite. Er sagt die Wahrheit: Das <strong>Logbuch IV</strong> ist hinter der zerbrochenen Säule versteckt, direkt rechts vom oberen Ende der Treppe. Steig danach die Treppen bis zur Gipfelplattform im Osten hinauf. Sobald du sie betrittst, beginnt der Kampf.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "Kapitel 2 Gegenwind Hauptquest Den Gipfel erreichen und das Monster besiegen. (Teilziel: Die Grotten und den alten Plattenmechanismus durchqueren.) Der Weg zu den Platten: Klettere die Leiter neben der Taverne hinauf (westlich des Dorfs) und durchquere die Felder im Westen. Der Grotteneingang öffnet sich in der Klippe, nördlich der Felder. Auf den Feldern, direkt unterhalb des Eingangs, spricht dich ein Höhlenführer an und bringt dich hin. Lass dich führen: Barbe-Yeux folgt ihm von selbst. Er begleitet dich nicht hinein, und du triffst ihn nur einmal. Klippengrotte : vier Räume, von Räubern bewacht (feste Kämpfe, jeweils nur einmal). Dort findest du: die Fischerklammer , im Raum oben links; eine Truhe (15 Taler, 2 Bier, 2 Rum) im selben Raum; eine Truhe (5 Bier, 3 Rum), oben in der Mitte, nahe der Treppe zur zweiten Grotte. Der Eingang zum Tunnel liegt im Raum oben rechts. Du kommst oben im mittleren Gang des Tunnels an. Dort findest du das Graue Salz (Raum oben links) und eine Fallenkiste (großer Raum unten links; sie ist ein Monster, die Fallenkiste: Besiege sie für 15 Taler und 2 Bier). Das Logbuch III liegt bei einem Skelett, mitten im leeren Raum oben rechts (hinauf geht es über die Treppe unten in diesem Raum). Der untere Ausgang des Tunnels bringt dich in einen Winkel im Südosten der Grotte, mit einer besonderen Truhe: dem Mahagonistock (+20 max. Energie) und 10 Talern. Nimm die Treppe oben in der Mitte: zweite Grotte . Das Fass Olivenöl steht im linken Raum. Durchquere die Räume (drei Räubergruppen) bis zum Ausgang unten rechts. Er führt in den Nordosten der Insel. Nordosten der Insel : ein Lager von Fischer-Banditen (fester Kampf gegen drei Fischer und eine Fischerin). Das Beschwerte Netz ist in diesem Lager. Die Milden Algen liegen direkt südlich des Lagers, eine Labbrige Alge am Wasser ganz im Nordosten. Geh über den Norden der Insel nach Westen. Du erreichst das große Westplateau (Banditenlager, Zufallskämpfe; im Abenteuermodus gelingt die Flucht immer). Klippenpergament (unverzichtbar) : Im Norden des Westplateaus, nahe dem Lager, öffnet sich ein Loch im Boden. Spring hinein: Du fällst in einen geschlossenen Raum der zweiten Grotte (den mittleren Raum ohne Tür: Dieses Loch ist der einzige Weg hinein). Dort wartet das Klippenpergament auf dich. Ein weiteres Loch im selben Raum (Ecke unten rechts) bringt dich zurück in die erste Grotte. Geh das Westplateau hinunter bis zum unteren Eingang der dritten Grotte , südlich des Plateaus. Durchquere sie: Der Ausgang (oben rechts) führt auf das Plateau mit den Platten. Dort wartet Itzel auf dich. Das Plattenrätsel (Teilziel: Den alten Plattenmechanismus lösen.) Neun Platten bilden ein 3 × 3-Raster: R T H O A F E J N Du musst in der richtigen Reihenfolge auf vier Platten treten. Sprich mit Itzel: Ohne das Klippenpergament sagt sie dir, dass etwas fehlt. Die Logik: Öffne das Klippenpergament aus dem Inventar und klick dann auf Löchriges Pergament benutzen . Das löchrige Pergament legt sich darüber, und du kannst es verschieben. Seine vier Löcher sind durch eine gepunktete Linie verbunden, die in einem Pfeil endet. Schieb es nach links (etwa ein Fünftel seiner Breite) und ein wenig nach unten (etwa ein Achtel seiner Höhe), bis das große Loch am Ende des Pfeils das R am linken Rand umrahmt (das unter dem B). Die Löcher zeigen dann in der Reihenfolge der gepunkteten Linie H (das kleine Startloch), J (das große Loch unten), F (das rechte Loch) und dann R . Der Hinweis im Quest-Journal bestätigt: „Der letzte Buchstabe scheint ein R zu sein…“ Lösung: Tritt auf H (oben rechts), dann J (unten Mitte), dann F (Mitte rechts), dann R (oben links). Tritt dazwischen auf keine andere Platte: Geh zwischen den Platten hindurch. Nach vier Platten zeigt das Spiel „Sieg!“ oder „Niederlage!“ an. Nach einer Niederlage beginnt die Folge von vorn. Trödel nicht: Vergehen zwischen zwei Platten mehr als 10 Sekunden, beginnt der Versuch erneut bei der Platte, die du gerade betreten hast. Bei Erfolg öffnen sich zwei Durchgänge: die Treppe hinauf zum Gipfel (nördlich der Platten) und die Leiter direkt hinunter ins Dorf (Abkürzung). Die beiden Pergamente, die nun nutzlos sind, verschwinden aus deinem Inventar. Den Kampf vorbereiten Das Journal empfiehlt: Stufe 18, Fischfilets, 10 Bier, 10 Rum und 3 Coulirou-Fett (es heilt Verbrennungen). Steig die Treppe nördlich der Platten hinauf. Oben, auf dem Ruinenplateau, wartet ein Hochgebirgsführer auf dich. Er zeigt dir „die schönste Ecke hier“: „Direkt hinter mir!“, und tritt dann zur Seite. Er sagt die Wahrheit: Das Logbuch IV ist hinter der zerbrochenen Säule versteckt, direkt rechts vom oberen Ende der Treppe. Steig danach die Treppen bis zur Gipfelplattform im Osten hinauf. Sobald du sie betrittst, beginnt der Kampf.", "sol": 1}, {"titre": "Boss: Kab'raqan", "html": "<p>Die Lebensleiste ist durchgehend (insgesamt 12.000 LP), aber der Kampf verläuft in mehreren Etappen. Die Schadenswerte unten gelten für den normalen Modus. Im Abenteuermodus wird jeder Schaden, den du erleidest, um 20 % verringert (80 pro Feuerball, 120 für den Kegel, 40 pro Verbrennungsrunde).</p><p><strong>Was er macht:</strong></p><ul><li>In der ersten Runde und bei jedem Etappenwechsel beschwört er Handlanger, Kab'raqans Beschwörungen (je 200 LP). Sie lassen Felsen unter Itzel hervorschießen (30 Schaden, ab Etappe 2 dann 50).</li><li>Danach spuckt er einen <strong>Feuerballregen</strong> auf die ganze Gruppe (je 100 Schaden). Bei jedem dritten Angriff ersetzt er den Regen durch einen <strong>Feuerkegel</strong> auf Itzel: 150 Schaden plus eine Verbrennung von 50 LP pro Runde, die sich addiert, wenn sie sich wiederholt.</li><li>Itzels <strong>Rauchgranate</strong> (5 pro Kampf) lässt ihn 3 Runden lang die Hälfte seiner Angriffe verfehlen. Das ist deine beste Verteidigung. Heb dir Coulirou-Fett für Itzels Verbrennungen auf.</li><li>Hat Barbe-Yeux nichts Sinnvolles zu tun (Boss in der Luft, kein Fernangriff), lass ihn <strong>aussetzen</strong>: Bis zu seinem nächsten Zug erleidet er 25 % weniger Schaden und gewinnt 20 % seiner Energie zurück.</li></ul><p><strong>Etappe 1 (4.000 LP):</strong> Die zwei Trottel hauen gleich zu Beginn ab. Du spielst Barbe-Yeux und Itzel. Solange er fliegt, treffen ihn nur Fernangriffe: Schuss, Verheerender Schuss, Itzels Rauchgranate und der Scherenwurf von Barbe-Yeux, falls du ihn hast. Mit deinen Nahkampfangriffen kannst du die Handlanger angreifen. Unter 2.000 LP <strong>muss er landen</strong> und ruft drei weitere Handlanger. Dann kannst du ihn im Nahkampf angreifen.</p><p><strong>Etappe 2 (3.000 LP):</strong> Alle bekommen ihre Energie zurück (nicht ihre LP). Er steigt wieder in Flammen auf, mit drei neuen Handlangern. Wechsle wieder zu Fernangriffen.</p><p><strong>Etappe 2, Fortsetzung (3.000 LP):</strong> Die zwei Trottel kommen mit vollen LP zurück. Kab'raqan landet und ruft fünf Handlanger. Jetzt ist der Moment für <strong>Barthaare in den Augen</strong> (beide Trottel müssen stehen, und es funktioniert nicht gegen ein fliegendes Ziel).</p><p><strong>Etappe 3 (2.000 LP):</strong> Nach einer Szene in der Taverne kämpft Itzel <strong>allein</strong> gegen ihn, mit drei Handlangern. Gleiche Angriffe. Wirkte am Ende des vorigen Kampfs noch ein Fischfilet auf sie, wirkt es hier weiter. Setz Granaten, Heilgegenstände und Fett ein.</p><p><strong>Wenn du verlierst:</strong> In den Etappen 1–2 kehrst du auf die Insel zurück und kannst es erneut versuchen. In Etappe 3 beginnt der Kampf sofort von vorn, und die während des gescheiterten Versuchs verbrauchten Gegenstände bekommst du zurück.</p><p><strong>Belohnung:</strong> Quest „Das Klippenmonster jagen“ abgeschlossen (25.000 EP), dann <strong>30.000 EP</strong> zum Kapitelende und der Erfolg <strong>Hitzschlag</strong>. Das Kapitel endet mit dem Gespräch mit Itzel in der Taverne der Windinsel.</p>", "id": "c2-boss-kab-raqan", "texte": "Kapitel 2 Gegenwind Hauptquest Boss: Kab'raqan Die Lebensleiste ist durchgehend (insgesamt 12.000 LP), aber der Kampf verläuft in mehreren Etappen. Die Schadenswerte unten gelten für den normalen Modus. Im Abenteuermodus wird jeder Schaden, den du erleidest, um 20 % verringert (80 pro Feuerball, 120 für den Kegel, 40 pro Verbrennungsrunde). Was er macht: In der ersten Runde und bei jedem Etappenwechsel beschwört er Handlanger, Kab'raqans Beschwörungen (je 200 LP). Sie lassen Felsen unter Itzel hervorschießen (30 Schaden, ab Etappe 2 dann 50). Danach spuckt er einen Feuerballregen auf die ganze Gruppe (je 100 Schaden). Bei jedem dritten Angriff ersetzt er den Regen durch einen Feuerkegel auf Itzel: 150 Schaden plus eine Verbrennung von 50 LP pro Runde, die sich addiert, wenn sie sich wiederholt. Itzels Rauchgranate (5 pro Kampf) lässt ihn 3 Runden lang die Hälfte seiner Angriffe verfehlen. Das ist deine beste Verteidigung. Heb dir Coulirou-Fett für Itzels Verbrennungen auf. Hat Barbe-Yeux nichts Sinnvolles zu tun (Boss in der Luft, kein Fernangriff), lass ihn aussetzen : Bis zu seinem nächsten Zug erleidet er 25 % weniger Schaden und gewinnt 20 % seiner Energie zurück. Etappe 1 (4.000 LP): Die zwei Trottel hauen gleich zu Beginn ab. Du spielst Barbe-Yeux und Itzel. Solange er fliegt, treffen ihn nur Fernangriffe: Schuss, Verheerender Schuss, Itzels Rauchgranate und der Scherenwurf von Barbe-Yeux, falls du ihn hast. Mit deinen Nahkampfangriffen kannst du die Handlanger angreifen. Unter 2.000 LP muss er landen und ruft drei weitere Handlanger. Dann kannst du ihn im Nahkampf angreifen. Etappe 2 (3.000 LP): Alle bekommen ihre Energie zurück (nicht ihre LP). Er steigt wieder in Flammen auf, mit drei neuen Handlangern. Wechsle wieder zu Fernangriffen. Etappe 2, Fortsetzung (3.000 LP): Die zwei Trottel kommen mit vollen LP zurück. Kab'raqan landet und ruft fünf Handlanger. Jetzt ist der Moment für Barthaare in den Augen (beide Trottel müssen stehen, und es funktioniert nicht gegen ein fliegendes Ziel). Etappe 3 (2.000 LP): Nach einer Szene in der Taverne kämpft Itzel allein gegen ihn, mit drei Handlangern. Gleiche Angriffe. Wirkte am Ende des vorigen Kampfs noch ein Fischfilet auf sie, wirkt es hier weiter. Setz Granaten, Heilgegenstände und Fett ein. Wenn du verlierst: In den Etappen 1–2 kehrst du auf die Insel zurück und kannst es erneut versuchen. In Etappe 3 beginnt der Kampf sofort von vorn, und die während des gescheiterten Versuchs verbrauchten Gegenstände bekommst du zurück. Belohnung: Quest „Das Klippenmonster jagen“ abgeschlossen (25.000 EP), dann 30.000 EP zum Kapitelende und der Erfolg Hitzschlag . Das Kapitel endet mit dem Gespräch mit Itzel in der Taverne der Windinsel.", "sol": 0}, {"titre": "Itzel auf ihrem Schiff treffen.", "html": "<p>Letzter Schritt vor Kapitel 3: Ihr Schiff liegt südöstlich des Dorfs vor Anker. Zum Ablegen musst du:</p><ul><li>die zwei Trottel dabeihaben (siehe „Nicht verpassen“);</li><li>ihnen <strong>Coulirou-Fett</strong> auftragen, falls das nicht schon am Boot passiert ist. Eine einzige Anwendung reicht für den ganzen Rest.</li></ul><p>Antworte „Ja“ auf „Zur Oliveninsel reisen?“. Du kannst auch ablehnen und vorher deine Nebenquests abschließen.</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "Kapitel 2 Gegenwind Hauptquest Itzel auf ihrem Schiff treffen. Letzter Schritt vor Kapitel 3: Ihr Schiff liegt südöstlich des Dorfs vor Anker. Zum Ablegen musst du: die zwei Trottel dabeihaben (siehe „Nicht verpassen“); ihnen Coulirou-Fett auftragen, falls das nicht schon am Boot passiert ist. Eine einzige Anwendung reicht für den ganzen Rest. Antworte „Ja“ auf „Zur Oliveninsel reisen?“. Du kannst auch ablehnen und vorher deine Nebenquests abschließen.", "sol": 0}]}, {"titre": "Nebenquests", "intro": "<p>Jede bringt <strong>10.000 EP</strong>. Alle zählen für den Erfolg <strong>Mädchen für alles</strong> (alle Nebenquests des Spiels).</p>", "entrees": [{"titre": "Die Zange des Fischers wiederfinden", "html": "<ul><li><strong>Wo:</strong> der Fischer, Haus im Südwesten des Dorfs, nahe dem Boot.</li><li><strong>Schritte:</strong> Nimm an und heb dann die <strong>Fischerklammer</strong> in der ersten Grotte auf (Raum oben links). Bring sie zurück.</li><li><strong>Belohnung:</strong> 10.000 EP, und er bietet dir sofort „Das Geheimnis des Coulirou lüften“ an. Ab jetzt tauscht er auch deine Fische ein:<ul><li>Silberbarsch → <strong>Famoses Fischfilet</strong> (regeneriert im Kampf 10 % der LP pro Runde);</li><li>Plattfisch → <strong>Wurffisch</strong> (35 Schaden, von den zwei Trotteln geworfen);</li><li>Makrele → 1 Goldstück;</li><li>Coulirou → <strong>Coulirou-Fett</strong> (sobald das Geheimnis gelüftet ist).</li></ul></li><li>Vor dem Geheimnis des Coulirou verkauft er <strong>Coulirou-Fett für 20 Taler</strong> (die Option erscheint nur, wenn du mindestens 20 Taler hast).</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "Kapitel 2 Gegenwind Nebenquests Die Zange des Fischers wiederfinden Wo: der Fischer, Haus im Südwesten des Dorfs, nahe dem Boot. Schritte: Nimm an und heb dann die Fischerklammer in der ersten Grotte auf (Raum oben links). Bring sie zurück. Belohnung: 10.000 EP, und er bietet dir sofort „Das Geheimnis des Coulirou lüften“ an. Ab jetzt tauscht er auch deine Fische ein: Silberbarsch → Famoses Fischfilet (regeneriert im Kampf 10 % der LP pro Runde); Plattfisch → Wurffisch (35 Schaden, von den zwei Trotteln geworfen); Makrele → 1 Goldstück; Coulirou → Coulirou-Fett (sobald das Geheimnis gelüftet ist). Vor dem Geheimnis des Coulirou verkauft er Coulirou-Fett für 20 Taler (die Option erscheint nur, wenn du mindestens 20 Taler hast).", "sol": 0}, {"titre": "Das Geheimnis des Coulirou lüften", "html": "<ul><li><strong>Wo:</strong> der Fischer, nach der Zangen-Quest. Wenn du abgelehnt hast, sprich ihn erneut an.</li><li><strong>Schritte:</strong><ol><li>Sammle <strong>3 Labbrige Algen</strong>. Es gibt nur drei auf der Insel, gib sie nicht weg: eine am Strand südwestlich des Boots, eine an der Ostküste (vom Dorf aus am Ufer entlang nach Norden), eine ganz im Nordosten (nach der zweiten Grotte).</li><li>Wähle in der Taverne <strong>Nach verkochten Linsen fragen.</strong> (die Option erscheint erst, wenn die Quest angenommen ist).</li><li>Gib alles dem Fischer.</li></ol></li><li><strong>Belohnung:</strong> 10.000 EP und das <strong>Coulirou-Angeln</strong> wird freigeschaltet (siehe Minispiele).</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "Kapitel 2 Gegenwind Nebenquests Das Geheimnis des Coulirou lüften Wo: der Fischer, nach der Zangen-Quest. Wenn du abgelehnt hast, sprich ihn erneut an. Schritte: Sammle 3 Labbrige Algen . Es gibt nur drei auf der Insel, gib sie nicht weg: eine am Strand südwestlich des Boots, eine an der Ostküste (vom Dorf aus am Ufer entlang nach Norden), eine ganz im Nordosten (nach der zweiten Grotte). Wähle in der Taverne Nach verkochten Linsen fragen. (die Option erscheint erst, wenn die Quest angenommen ist). Gib alles dem Fischer. Belohnung: 10.000 EP und das Coulirou-Angeln wird freigeschaltet (siehe Minispiele).", "sol": 0}, {"titre": "Der Fischerin ihr Netz zurückgeben", "html": "<ul><li><strong>Wo:</strong> die Fischerin, Haus im Osten des Dorfs.</li><li><strong>Schritte:</strong> Das <strong>Beschwerte Netz</strong> liegt im Lager der Fischer-Banditen im Nordosten der Insel (nach der zweiten Grotte). Du musst die Gruppe besiegen, die es bewacht.</li><li><strong>Belohnung:</strong> 10.000 EP.</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "Kapitel 2 Gegenwind Nebenquests Der Fischerin ihr Netz zurückgeben Wo: die Fischerin, Haus im Osten des Dorfs. Schritte: Das Beschwerte Netz liegt im Lager der Fischer-Banditen im Nordosten der Insel (nach der zweiten Grotte). Du musst die Gruppe besiegen, die es bewacht. Belohnung: 10.000 EP.", "sol": 0}, {"titre": "Die Klippensuppe milder machen", "html": "<ul><li><strong>Wo:</strong> die Köchin der Taverne, im Westen des Dorfs.</li><li><strong>Zutaten:</strong><ul><li><strong>Milde Algen</strong>: Nordosten der Insel, direkt südlich des Lagers der Fischer-Banditen;</li><li><strong>Graues Salz</strong>: der Tunnel der ersten Grotte, Raum oben links;</li><li><strong>Fass Olivenöl</strong>: zweite Grotte, linker Raum;</li><li><strong>Hochwindblume</strong>: am Ostende der Gipfelplattform, in Kab'raqans Arena. Um sie zu erreichen, musst du durch die Zone, die den Kampf auslöst: Pflück sie nach deinem Sieg (der Gipfel ist dann „beruhigt“).</li></ul></li><li><strong>Belohnung:</strong> 10.000 EP.</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "Kapitel 2 Gegenwind Nebenquests Die Klippensuppe milder machen Wo: die Köchin der Taverne, im Westen des Dorfs. Zutaten: Milde Algen : Nordosten der Insel, direkt südlich des Lagers der Fischer-Banditen; Graues Salz : der Tunnel der ersten Grotte, Raum oben links; Fass Olivenöl : zweite Grotte, linker Raum; Hochwindblume : am Ostende der Gipfelplattform, in Kab'raqans Arena. Um sie zu erreichen, musst du durch die Zone, die den Kampf auslöst: Pflück sie nach deinem Sieg (der Gipfel ist dann „beruhigt“). Belohnung: 10.000 EP.", "sol": 0}, {"titre": "Später: Aufräumen", "html": "<p>Der Bürgermeister bietet diese Quest erst lange nach diesem Kapitel an, wenn der Wirt der Krabbeninsel davon spricht (nach Kapitel 5). Sie gehört nicht zu Kapitel 2.</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "Kapitel 2 Gegenwind Nebenquests Später: Aufräumen Der Bürgermeister bietet diese Quest erst lange nach diesem Kapitel an, wenn der Wirt der Krabbeninsel davon spricht (nach Kapitel 5). Sie gehört nicht zu Kapitel 2.", "sol": 0}]}, {"titre": "Minispiele", "intro": "", "entrees": [{"titre": "Coulirou-Angeln", "html": "<ul><li><strong>Wo:</strong> der kleine Steg östlich des Boots, südlich des Dorfs. Verfügbar nach „Das Geheimnis des Coulirou lüften“.</li><li><strong>Regeln:</strong> wie das Angeln auf der Krabbeninsel. Wenn etwas anbeißt, gib die angezeigte Pfeilkombination in der vorgegebenen Zeit ein. Für den Coulirou: <strong>links, oben, rechts, unten</strong>.</li><li>Dein erster Fang hier ist garantiert ein Coulirou. Danach ist jeder zweite Fang ein Coulirou, die anderen sind gewöhnliche Fische (Silberbarsch, Plattfisch, Makrele…).</li><li><strong>Belohnung:</strong> Jeden Coulirou tauschst du beim Fischer gegen Coulirou-Fett. Der Coulirou ist eine der 7 Arten für den Erfolg <strong>Riecht’s hier nicht komisch?</strong> (alle Arten angeln).</li></ul>", "id": "c2-peche-au-coulirou", "texte": "Kapitel 2 Gegenwind Minispiele Coulirou-Angeln Wo: der kleine Steg östlich des Boots, südlich des Dorfs. Verfügbar nach „Das Geheimnis des Coulirou lüften“. Regeln: wie das Angeln auf der Krabbeninsel. Wenn etwas anbeißt, gib die angezeigte Pfeilkombination in der vorgegebenen Zeit ein. Für den Coulirou: links, oben, rechts, unten . Dein erster Fang hier ist garantiert ein Coulirou. Danach ist jeder zweite Fang ein Coulirou, die anderen sind gewöhnliche Fische (Silberbarsch, Plattfisch, Makrele…). Belohnung: Jeden Coulirou tauschst du beim Fischer gegen Coulirou-Fett. Der Coulirou ist eine der 7 Arten für den Erfolg Riecht’s hier nicht komisch? (alle Arten angeln).", "sol": 0}, {"titre": "Das Lügenauge (Würfel in der Taverne)", "html": "<ul><li><strong>Wo:</strong> Taverne der Windinsel, „Würfeln.“.</li><li>Gleiche Regeln wie auf der Krabbeninsel, aber gegen Mirette die Durchtriebene, Brasse-Gobelet der Grobian und Jean-Charles der Gewitzte.</li><li>Höhere Einsätze: bis zu 20, 30 oder 50 Taler, je nachdem, ob du mit 3, 4 oder 5 Würfeln spielst.</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "Kapitel 2 Gegenwind Minispiele Das Lügenauge (Würfel in der Taverne) Wo: Taverne der Windinsel, „Würfeln.“. Gleiche Regeln wie auf der Krabbeninsel, aber gegen Mirette die Durchtriebene, Brasse-Gobelet der Grobian und Jean-Charles der Gewitzte. Höhere Einsätze: bis zu 20, 30 oder 50 Taler, je nachdem, ob du mit 3, 4 oder 5 Würfeln spielst.", "sol": 0}]}, {"titre": "Nicht verpassen", "intro": "", "entrees": [{"titre": "Nicht verpassen", "html": "<ul><li><strong>Coulirou-Fett:</strong> Ohne es kannst du die Insel nicht verlassen, weder mit dem Boot noch mit Itzels Schiff. Nimm außerdem 3 für Kab'raqan mit.</li><li><strong>Die zwei Trottel in der dritten Grotte:</strong> Wenn du durch den oberen Ausgang hineingehst (Seite der Platten), können sie dir über einen Durchgang eine Räuberleiter bis zum Westplateau machen. Dann bleiben sie unten. Geh noch einmal durch den unteren Eingang der Grotte, um sie abzuholen: Ohne sie keine Abfahrt.</li><li><strong>Logbücher</strong> (2 der 7 für den Erfolg <strong>Kann eh nich lesen</strong>):<ul><li><strong>Logbuch III</strong>: Tunnel der ersten Grotte, beim Skelett im leeren Raum oben rechts;</li><li><strong>Logbuch IV</strong>: oben an der Treppe nördlich der Platten (nach dem Rätsel), hinter der zerbrochenen Säule direkt rechts versteckt, dort wo der Hochgebirgsführer „Direkt hinter mir!“ sagt;</li><li>Du liest sie, sobald du sie aufhebst, und sie landen in der Bibliothek des Inventars.</li></ul></li><li><strong>Truhen in der ersten Grotte:</strong> Mahagonistock (+20 max. Energie, Winkel im Südosten, über den Tunnel), zwei Truhen mit Bier und Rum und die Fallenkiste im Tunnel.</li><li><strong>Löcher zum Graben</strong> (mit der Schaufel aus Kapitel 1):<ul><li><strong>Gruselige Augenklappe</strong> (+5 ANG): unten auf dem Westplateau, nicht weit vom unteren Eingang der dritten Grotte;</li><li>ein paar Taler: 10 in der Mitte des Westplateaus, 8 oben auf dem Westplateau nahe dem Lager, 2 im Osten unterhalb des Plattenplateaus, 1 am Strand südwestlich des Boots.</li></ul></li><li><strong>Barthaare in den Augen:</strong> wird während des Duells gegen Itzel automatisch endgültig freigeschaltet.</li><li><strong>Taverne:</strong> Jeder Besuch füllt deine LP und deine Energie kostenlos auf.</li><li><strong>Verschnupfte Kapitäne:</strong> Ihr „Angriffsbefehl“ lässt alle Gegner auf Barbe-Yeux zielen, solange sie stehen. Schalte sie zuerst aus. Eine Rolle eines der zwei Trottel lenkt diese Angriffe ab: 3 Runden lang zielen die Gegner auf diesen Trottel statt auf Barbe-Yeux.</li><li><strong>Fackelhändler:</strong> direkt neben der Taverne (Erfolg Ein erleuchteter Mann).</li><li>Nichts geht endgültig verloren: Die Windinsel bleibt nach dem Kapitel erreichbar.</li><li><strong>Erfolg des Kapitels:</strong> <strong>Hitzschlag</strong> (Kapitel 2 abschließen).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "Kapitel 2 Gegenwind Nicht verpassen Nicht verpassen Coulirou-Fett: Ohne es kannst du die Insel nicht verlassen, weder mit dem Boot noch mit Itzels Schiff. Nimm außerdem 3 für Kab'raqan mit. Die zwei Trottel in der dritten Grotte: Wenn du durch den oberen Ausgang hineingehst (Seite der Platten), können sie dir über einen Durchgang eine Räuberleiter bis zum Westplateau machen. Dann bleiben sie unten. Geh noch einmal durch den unteren Eingang der Grotte, um sie abzuholen: Ohne sie keine Abfahrt. Logbücher (2 der 7 für den Erfolg Kann eh nich lesen ): Logbuch III : Tunnel der ersten Grotte, beim Skelett im leeren Raum oben rechts; Logbuch IV : oben an der Treppe nördlich der Platten (nach dem Rätsel), hinter der zerbrochenen Säule direkt rechts versteckt, dort wo der Hochgebirgsführer „Direkt hinter mir!“ sagt; Du liest sie, sobald du sie aufhebst, und sie landen in der Bibliothek des Inventars. Truhen in der ersten Grotte: Mahagonistock (+20 max. Energie, Winkel im Südosten, über den Tunnel), zwei Truhen mit Bier und Rum und die Fallenkiste im Tunnel. Löcher zum Graben (mit der Schaufel aus Kapitel 1): Gruselige Augenklappe (+5 ANG): unten auf dem Westplateau, nicht weit vom unteren Eingang der dritten Grotte; ein paar Taler: 10 in der Mitte des Westplateaus, 8 oben auf dem Westplateau nahe dem Lager, 2 im Osten unterhalb des Plattenplateaus, 1 am Strand südwestlich des Boots. Barthaare in den Augen: wird während des Duells gegen Itzel automatisch endgültig freigeschaltet. Taverne: Jeder Besuch füllt deine LP und deine Energie kostenlos auf. Verschnupfte Kapitäne: Ihr „Angriffsbefehl“ lässt alle Gegner auf Barbe-Yeux zielen, solange sie stehen. Schalte sie zuerst aus. Eine Rolle eines der zwei Trottel lenkt diese Angriffe ab: 3 Runden lang zielen die Gegner auf diesen Trottel statt auf Barbe-Yeux. Fackelhändler: direkt neben der Taverne (Erfolg Ein erleuchteter Mann). Nichts geht endgültig verloren: Die Windinsel bleibt nach dem Kapitel erreichbar. Erfolg des Kapitels: Hitzschlag (Kapitel 2 abschließen).", "sol": 0}]}]}], "es": [{"id": "c2", "num": "Capítulo 2", "titre": "Vientos contrarios", "intro": "<p>Detenido por la brigada marítima, Barbe-Yeux se despierta en la cárcel con un viejo presidiario muy raro como vecino. Una fuga después, forma equipo (a la fuerza) con Itzel la Muda y pone rumbo a la isla del Viento, donde un monstruo que anida en lo alto de los acantilados apesta a todo el pueblo.</p>", "sections": [{"titre": "Misión principal", "intro": "", "entrees": [{"titre": "Cárcel: fugarse de la celda (sin objetivo en pantalla)", "html": "<ol><li>El capítulo empieza en tu celda, arriba a la derecha de la cárcel. Al cabo de un segundo, el viejo presidiario te habla él solo.</li><li>Te da el <strong>Pergamino agujereado</strong> y luego una <strong>espina de pescado</strong>. Todo lo demás es automático: Barbe-Yeux lee el pergamino (cierra la ventana para continuar), fuerza la cerradura con la espina y las puertas de las celdas se abren.</li><li>Ahora tienes que cruzar la cárcel sin que te vean (ver el recuadro de abajo).</li></ol><p><strong>Cómo funcionan los guardias</strong> (diez guardias hacen la ronda en la sala grande):</p><ul><li>Cada guardia ve en un cono delante de él. Si te quedas en ese cono alrededor de 1,5 segundos, te atrapa. Las paredes bloquean la vista.</li><li>Si pasas muy cerca de un guardia (de frente o de lado), te atrapa al instante. Solo su espalda es un ángulo muerto.</li><li>En tu celda estás a salvo.</li><li><strong>No enciendas la antorcha</strong>: los guardias que ven la luz abandonan su ronda y vienen hacia ti.</li><li>Si te pillan, el brigada te devuelve a tu celda tras un pequeño sermón. No hay ninguna otra penalización: vuelve a intentarlo.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "Capítulo 2 Vientos contrarios Misión principal Cárcel: fugarse de la celda (sin objetivo en pantalla) El capítulo empieza en tu celda, arriba a la derecha de la cárcel. Al cabo de un segundo, el viejo presidiario te habla él solo. Te da el Pergamino agujereado y luego una espina de pescado . Todo lo demás es automático: Barbe-Yeux lee el pergamino (cierra la ventana para continuar), fuerza la cerradura con la espina y las puertas de las celdas se abren. Ahora tienes que cruzar la cárcel sin que te vean (ver el recuadro de abajo). Cómo funcionan los guardias (diez guardias hacen la ronda en la sala grande): Cada guardia ve en un cono delante de él. Si te quedas en ese cono alrededor de 1,5 segundos, te atrapa. Las paredes bloquean la vista. Si pasas muy cerca de un guardia (de frente o de lado), te atrapa al instante. Solo su espalda es un ángulo muerto. En tu celda estás a salvo. No enciendas la antorcha : los guardias que ven la luz abandonan su ronda y vienen hacia ti. Si te pillan, el brigada te devuelve a tu celda tras un pequeño sermón. No hay ninguna otra penalización: vuelve a intentarlo.", "sol": 0}, {"titre": "Cárcel: encontrar la llave y salir", "html": "<ol><li>Baja hasta la salita de los guardias, a la izquierda en el centro del mapa (se entra por abajo). Del tablero de llaves cuelga un manojo.</li><li>Acércate al tablero y elige <strong>Registrar</strong>: obtienes la <strong>Llave maestra</strong>.</li><li>Ve a la escalera de abajo a la derecha. Sin la llave, el juego te dice «Necesitan una llave para salir de aquí.».</li><li><strong>Sala de patrulla</strong>: cinco guardias dan vueltas con las mismas reglas de visión. Entras por el oeste y la salida está al este. Avanza cuando te den la espalda. Si te pillan aquí, vuelves a tu celda, pero conservas la llave.</li><li>Al cruzar la puerta, la llave se consume y la reja se cierra detrás de ti («ya no hay vuelta atrás»). Una decena de guardias entra por el este y camina hacia ti. <strong>No te muevas, quédate en la entrada</strong>: a esa distancia no te ven. Después de su diálogo («¡¡¡ES ELLA!!!»), se van corriendo hacia el este. Entonces puedes cruzar la sala y tomar la salida del este.</li><li>Última sala: hay guardias tirados en el suelo. Avanza hacia el este para provocar el encuentro con la desconocida.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "Capítulo 2 Vientos contrarios Misión principal Cárcel: encontrar la llave y salir Baja hasta la salita de los guardias, a la izquierda en el centro del mapa (se entra por abajo). Del tablero de llaves cuelga un manojo. Acércate al tablero y elige Registrar : obtienes la Llave maestra . Ve a la escalera de abajo a la derecha. Sin la llave, el juego te dice «Necesitan una llave para salir de aquí.». Sala de patrulla : cinco guardias dan vueltas con las mismas reglas de visión. Entras por el oeste y la salida está al este. Avanza cuando te den la espalda. Si te pillan aquí, vuelves a tu celda, pero conservas la llave. Al cruzar la puerta, la llave se consume y la reja se cierra detrás de ti («ya no hay vuelta atrás»). Una decena de guardias entra por el este y camina hacia ti. No te muevas, quédate en la entrada : a esa distancia no te ven. Después de su diálogo («¡¡¡ES ELLA!!!»), se van corriendo hacia el este. Entonces puedes cruzar la sala y tomar la salida del este. Última sala: hay guardias tirados en el suelo. Avanza hacia el este para provocar el encuentro con la desconocida.", "sol": 0}, {"titre": "Combate guionizado: la Desconocida (Itzel)", "html": "<ul><li>Luchas junto al capitán Dubreuil y el brigada Bichon. La Desconocida solo ataca a los dos guardias.</li><li>No puede caer. Cuando llega casi a cero, vuelve a subir a 500 PV («Así no…»).</li><li>El combate se detiene cuando los dos guardias caen. Juega tus turnos con normalidad: el resultado está fijado.</li><li>Después, la Desconocida se presenta: Itzel, llamada la Muda. Vais a buscar a los dos Zoquetes.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "Capítulo 2 Vientos contrarios Misión principal Combate guionizado: la Desconocida (Itzel) Luchas junto al capitán Dubreuil y el brigada Bichon. La Desconocida solo ataca a los dos guardias. No puede caer. Cuando llega casi a cero, vuelve a subir a 500 PV («Así no…»). El combate se detiene cuando los dos guardias caen. Juega tus turnos con normalidad: el resultado está fijado. Después, la Desconocida se presenta: Itzel, llamada la Muda. Vais a buscar a los dos Zoquetes.", "sol": 0}, {"titre": "El reencuentro y el duelo contra Itzel", "html": "<ol><li>Escenas automáticas en el barco de Itzel: los dos Zoquetes vuelven a la tripulación (con una buena quemadura de sol). Barbe-Yeux «trata» el pergamino agujereado con la ambrosía sagrada que anunció el viejo presidiario… Las letras ocultas revelan <strong>LA ISLA DEL VIENTO</strong>.</li><li>Travesía automática hacia la isla del Viento; luego Itzel, con los nervios de punta, te reta a un duelo.</li><li><strong>Duelo contra Itzel la Muda</strong> (combate guionizado, en realidad no se puede ganar ni perder):<ul><li>Antes del desbloqueo que se describe abajo, Barbe-Yeux no puede caer: sigue en pie con 1-3 PV «por pura mala fe».</li><li>En cuanto Barbe-Yeux baja del 40 % de sus PV, desbloquea para siempre su golpe estrella <strong>Pelos de barba en los ojos</strong>. En ese turno es la única acción posible: úsala.</li><li>El golpe no cuesta energía, sino el 30 % de los PV restantes de Barbe-Yeux. Los dos Zoquetes golpean de 5 a 7 veces cada uno. Los dos Zoquetes tienen que estar en pie. Una vez de cada dos, Barbe-Yeux además provoca a los enemigos durante 3 turnos: lo atacan a él.</li><li>Cuando Itzel baja al 30 % de sus PV (o si estaba a punto de rematarte), responde con su propio golpe estrella, seis disparos, y el combate termina.</li></ul></li><li>Desembarcas en la isla del Viento con 1 PV. <strong>Truco</strong>: entrar en la taberna del pueblo te restaura gratis los PV y la energía.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "Capítulo 2 Vientos contrarios Misión principal El reencuentro y el duelo contra Itzel Escenas automáticas en el barco de Itzel: los dos Zoquetes vuelven a la tripulación (con una buena quemadura de sol). Barbe-Yeux «trata» el pergamino agujereado con la ambrosía sagrada que anunció el viejo presidiario… Las letras ocultas revelan LA ISLA DEL VIENTO . Travesía automática hacia la isla del Viento; luego Itzel, con los nervios de punta, te reta a un duelo. Duelo contra Itzel la Muda (combate guionizado, en realidad no se puede ganar ni perder): Antes del desbloqueo que se describe abajo, Barbe-Yeux no puede caer: sigue en pie con 1-3 PV «por pura mala fe». En cuanto Barbe-Yeux baja del 40 % de sus PV, desbloquea para siempre su golpe estrella Pelos de barba en los ojos . En ese turno es la única acción posible: úsala. El golpe no cuesta energía, sino el 30 % de los PV restantes de Barbe-Yeux. Los dos Zoquetes golpean de 5 a 7 veces cada uno. Los dos Zoquetes tienen que estar en pie. Una vez de cada dos, Barbe-Yeux además provoca a los enemigos durante 3 turnos: lo atacan a él. Cuando Itzel baja al 30 % de sus PV (o si estaba a punto de rematarte), responde con su propio golpe estrella, seis disparos, y el combate termina. Desembarcas en la isla del Viento con 1 PV. Truco : entrar en la taberna del pueblo te restaura gratis los PV y la energía.", "sol": 0}, {"titre": "Encontrar información útil.", "html": "<p><em>(subobjetivo: Interrogar a los habitantes del pueblo)</em></p><ol><li>Ve a ver al <strong>alcalde</strong>, en su casa del centro del pueblo. Te habla del monstruo posado en el acantilado más alto, de los bandoleros de las cuevas y del viejo mecanismo de losas que cierra el paso a la cima.</li><li>La misión principal <strong>Cazar al monstruo de los acantilados</strong> empieza automáticamente.</li><li><strong>Atención:</strong> no puedes salir de la isla enseguida. En la barca, los dos Zoquetes «no están en condiciones de navegar» por culpa de su quemadura de sol. Necesitas una <strong>Grasa de Coulirou</strong> (ver las misiones del pescador: la vende a 20 escudos desde vuestra primera conversación).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "Capítulo 2 Vientos contrarios Misión principal Encontrar información útil. (subobjetivo: Interrogar a los habitantes del pueblo) Ve a ver al alcalde , en su casa del centro del pueblo. Te habla del monstruo posado en el acantilado más alto, de los bandoleros de las cuevas y del viejo mecanismo de losas que cierra el paso a la cima. La misión principal Cazar al monstruo de los acantilados empieza automáticamente. Atención: no puedes salir de la isla enseguida. En la barca, los dos Zoquetes «no están en condiciones de navegar» por culpa de su quemadura de sol. Necesitas una Grasa de Coulirou (ver las misiones del pescador: la vende a 20 escudos desde vuestra primera conversación).", "sol": 0}, {"titre": "Llegar a la cima y derrotar al monstruo.", "html": "<p><em>(subobjetivo: Atravesar las cuevas y el antiguo mecanismo de losas)</em></p><p><strong>El camino hasta las losas:</strong></p><ol><li>Sube por la escalera de mano junto a la taberna (al oeste del pueblo) y cruza los campos del oeste. La entrada de la cueva se abre en el acantilado, al norte de los campos. En los campos, justo debajo de la entrada, un <strong>guía de cuevas</strong> te aborda y te lleva hasta allí. Déjate guiar: Barbe-Yeux lo sigue solo. No te acompaña dentro, y solo te lo cruzas una vez.</li><li><strong>Cueva del acantilado</strong>: cuatro salas custodiadas por bandoleros (combates fijos, una sola vez cada uno). Allí encuentras:<ul><li>la <strong>Pinza del pescador</strong>, en la sala de arriba a la izquierda;</li><li>un cofre (15 escudos, 2 cervezas, 2 rones), en la misma sala;</li><li>un cofre (5 cervezas, 3 rones), arriba en el centro, cerca de la escalera hacia la segunda cueva.</li><li>La entrada del <strong>túnel</strong> está en la sala de arriba a la derecha. Llegas a la parte de arriba del pasillo central del túnel. Allí encuentras la <strong>Sal gris</strong> (sala de arriba a la izquierda) y un <strong>cofre trampa</strong> (sala grande de abajo a la izquierda; es un monstruo, el Cofre trampa: derrótalo para obtener 15 escudos y 2 cervezas). El <strong>Cuaderno de bitácora III</strong> está sobre un esqueleto, en medio de la sala vacía de arriba a la derecha (se sube por la escalera de abajo de esa sala). La salida inferior del túnel te deja en un rincón al sureste de la cueva, con un cofre especial: el <strong>Bastón de caoba</strong> (+20 de energía máx.) y 10 escudos.</li></ul></li><li>Toma la escalera de arriba en el centro: <strong>segunda cueva</strong>. El <strong>Barril de aceite de oliva</strong> está en la sala de la izquierda. Cruza las salas (tres grupos de bandoleros) hasta la salida de abajo a la derecha. Sale al noreste de la isla.</li><li><strong>Noreste de la isla</strong>: un campamento de pescadores-bandidos (combate fijo contra tres Pescadores y una Pescadora). La <strong>Red lastrada</strong> está en ese campamento. Las <strong>Algas dulces</strong> están justo al sur del campamento, y hay un <strong>Alga blanda</strong> a la orilla del agua, en el extremo noreste.</li><li>Ve hacia el oeste por la parte de arriba de la isla. Llegas a la gran meseta oeste (campamento de bandidos, encuentros aleatorios; en modo aventura, la huida siempre tiene éxito).</li><li><strong>Pergamino de los acantilados (imprescindible)</strong>: al norte de la meseta oeste, cerca del campamento, se abre un agujero en el suelo. Salta dentro: caes en una sala cerrada de la segunda cueva (la sala del medio, sin puerta: este agujero es la única forma de entrar). Allí te espera el <strong>Pergamino de los acantilados</strong>. Otro agujero, en la misma sala (esquina de abajo a la derecha), te devuelve a la primera cueva.</li><li>Baja la meseta oeste hasta la entrada inferior de la <strong>tercera cueva</strong>, al sur de la meseta. Crúzala: la salida (arriba a la derecha) da a la meseta de las losas. Allí te espera Itzel.</li></ol><p><strong>El enigma de las losas</strong> <em>(subobjetivo: Resolver el antiguo mecanismo de losas)</em></p><p>Nueve losas forman una cuadrícula de 3 × 3:</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>Hay que pisar cuatro losas en el orden correcto. Habla con Itzel: sin el Pergamino de los acantilados, te dice que falta algo.</p><p>La lógica: abre el <strong>Pergamino de los acantilados</strong> desde el inventario y luego haz clic en <strong>Usar el pergamino agujereado</strong>. El pergamino agujereado se coloca encima y puedes arrastrarlo. Sus cuatro agujeros están unidos por una línea de puntos que termina en una flecha. Arrástralo hacia la izquierda (alrededor de una quinta parte de su anchura) y un poco hacia abajo (alrededor de una octava parte de su altura), hasta que el agujero grande del final de la flecha enmarque la <strong>R</strong> del borde izquierdo (la que está debajo de la B). Los agujeros muestran entonces, en el orden de la línea de puntos, <strong>H</strong> (el agujerito del principio), <strong>J</strong> (el agujero grande de abajo), <strong>F</strong> (el agujero de la derecha) y luego <strong>R</strong>. La pista del diario de misiones lo confirma: «La última letra parece una R…»</p><p><strong>Solución: pisa la H (arriba a la derecha), luego la J (abajo en el centro), luego la F (en el centro a la derecha) y luego la R (arriba a la izquierda).</strong></p><ul><li>No pises ninguna otra losa entre medias: pasa entre las losas.</li><li>Después de cuatro losas, el juego muestra «¡Victoria!» o «¡Derrota!». Tras una derrota, la secuencia vuelve a empezar de cero.</li><li>No te entretengas: si pasan más de 10 segundos entre dos losas, el intento vuelve a empezar desde la losa que acabas de pisar.</li><li>Si lo consigues, se abren dos pasos: la escalera que sube hacia la cima (al norte de las losas) y la escalera de mano que baja directamente al pueblo (atajo). Los dos pergaminos, que ya no sirven, desaparecen de tu inventario.</li></ul><p><strong>Preparar el combate</strong> El diario recomienda: nivel 18, filetes de pescado, 10 cervezas, 10 rones y 3 Grasas de Coulirou (curan las quemaduras).</p><p>Sube la escalera al norte de las losas. Arriba, en la meseta de las ruinas, te espera un <strong>guía de alta montaña</strong>. Te indica «el mejor sitio de la zona»: «¡Justo detrás de mí!», y luego se aparta. Dice la verdad: el <strong>Cuaderno de bitácora IV</strong> está escondido detrás de la columna rota, justo a la derecha de lo alto de la escalera. Después, sube las escaleras hasta la plataforma de la cima, al este. Al pisarla empieza el combate.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "Capítulo 2 Vientos contrarios Misión principal Llegar a la cima y derrotar al monstruo. (subobjetivo: Atravesar las cuevas y el antiguo mecanismo de losas) El camino hasta las losas: Sube por la escalera de mano junto a la taberna (al oeste del pueblo) y cruza los campos del oeste. La entrada de la cueva se abre en el acantilado, al norte de los campos. En los campos, justo debajo de la entrada, un guía de cuevas te aborda y te lleva hasta allí. Déjate guiar: Barbe-Yeux lo sigue solo. No te acompaña dentro, y solo te lo cruzas una vez. Cueva del acantilado : cuatro salas custodiadas por bandoleros (combates fijos, una sola vez cada uno). Allí encuentras: la Pinza del pescador , en la sala de arriba a la izquierda; un cofre (15 escudos, 2 cervezas, 2 rones), en la misma sala; un cofre (5 cervezas, 3 rones), arriba en el centro, cerca de la escalera hacia la segunda cueva. La entrada del túnel está en la sala de arriba a la derecha. Llegas a la parte de arriba del pasillo central del túnel. Allí encuentras la Sal gris (sala de arriba a la izquierda) y un cofre trampa (sala grande de abajo a la izquierda; es un monstruo, el Cofre trampa: derrótalo para obtener 15 escudos y 2 cervezas). El Cuaderno de bitácora III está sobre un esqueleto, en medio de la sala vacía de arriba a la derecha (se sube por la escalera de abajo de esa sala). La salida inferior del túnel te deja en un rincón al sureste de la cueva, con un cofre especial: el Bastón de caoba (+20 de energía máx.) y 10 escudos. Toma la escalera de arriba en el centro: segunda cueva . El Barril de aceite de oliva está en la sala de la izquierda. Cruza las salas (tres grupos de bandoleros) hasta la salida de abajo a la derecha. Sale al noreste de la isla. Noreste de la isla : un campamento de pescadores-bandidos (combate fijo contra tres Pescadores y una Pescadora). La Red lastrada está en ese campamento. Las Algas dulces están justo al sur del campamento, y hay un Alga blanda a la orilla del agua, en el extremo noreste. Ve hacia el oeste por la parte de arriba de la isla. Llegas a la gran meseta oeste (campamento de bandidos, encuentros aleatorios; en modo aventura, la huida siempre tiene éxito). Pergamino de los acantilados (imprescindible) : al norte de la meseta oeste, cerca del campamento, se abre un agujero en el suelo. Salta dentro: caes en una sala cerrada de la segunda cueva (la sala del medio, sin puerta: este agujero es la única forma de entrar). Allí te espera el Pergamino de los acantilados . Otro agujero, en la misma sala (esquina de abajo a la derecha), te devuelve a la primera cueva. Baja la meseta oeste hasta la entrada inferior de la tercera cueva , al sur de la meseta. Crúzala: la salida (arriba a la derecha) da a la meseta de las losas. Allí te espera Itzel. El enigma de las losas (subobjetivo: Resolver el antiguo mecanismo de losas) Nueve losas forman una cuadrícula de 3 × 3: R T H O A F E J N Hay que pisar cuatro losas en el orden correcto. Habla con Itzel: sin el Pergamino de los acantilados, te dice que falta algo. La lógica: abre el Pergamino de los acantilados desde el inventario y luego haz clic en Usar el pergamino agujereado . El pergamino agujereado se coloca encima y puedes arrastrarlo. Sus cuatro agujeros están unidos por una línea de puntos que termina en una flecha. Arrástralo hacia la izquierda (alrededor de una quinta parte de su anchura) y un poco hacia abajo (alrededor de una octava parte de su altura), hasta que el agujero grande del final de la flecha enmarque la R del borde izquierdo (la que está debajo de la B). Los agujeros muestran entonces, en el orden de la línea de puntos, H (el agujerito del principio), J (el agujero grande de abajo), F (el agujero de la derecha) y luego R . La pista del diario de misiones lo confirma: «La última letra parece una R…» Solución: pisa la H (arriba a la derecha), luego la J (abajo en el centro), luego la F (en el centro a la derecha) y luego la R (arriba a la izquierda). No pises ninguna otra losa entre medias: pasa entre las losas. Después de cuatro losas, el juego muestra «¡Victoria!» o «¡Derrota!». Tras una derrota, la secuencia vuelve a empezar de cero. No te entretengas: si pasan más de 10 segundos entre dos losas, el intento vuelve a empezar desde la losa que acabas de pisar. Si lo consigues, se abren dos pasos: la escalera que sube hacia la cima (al norte de las losas) y la escalera de mano que baja directamente al pueblo (atajo). Los dos pergaminos, que ya no sirven, desaparecen de tu inventario. Preparar el combate El diario recomienda: nivel 18, filetes de pescado, 10 cervezas, 10 rones y 3 Grasas de Coulirou (curan las quemaduras). Sube la escalera al norte de las losas. Arriba, en la meseta de las ruinas, te espera un guía de alta montaña . Te indica «el mejor sitio de la zona»: «¡Justo detrás de mí!», y luego se aparta. Dice la verdad: el Cuaderno de bitácora IV está escondido detrás de la columna rota, justo a la derecha de lo alto de la escalera. Después, sube las escaleras hasta la plataforma de la cima, al este. Al pisarla empieza el combate.", "sol": 1}, {"titre": "Jefe: Kab'raqan", "html": "<p>La barra de vida es continua (12 000 PV en total), pero el combate se juega en varias etapas. Las cifras de daño de abajo son las del modo normal. En modo aventura, todo el daño que recibes se reduce un 20 % (80 por bola de fuego, 120 por el cono, 40 por turno de quemadura).</p><p><strong>Lo que hace:</strong></p><ul><li>En el primer turno, y luego en cada cambio de etapa, invoca secuaces, las Invocaciones de Kab'raqan (200 PV cada una). Hacen brotar rocas bajo Itzel (30 de daño, y luego 50 a partir de la etapa 2).</li><li>Después escupe una <strong>lluvia de bolas de fuego</strong> sobre todo el equipo (100 de daño a cada uno). Cada tres ataques, sustituye la lluvia por un <strong>cono de fuego</strong> sobre Itzel: 150 de daño más una quemadura de 50 PV por turno, que se acumula si se repite.</li><li>La <strong>Granada de humo</strong> de Itzel (5 por combate) le hace fallar sus ataques una vez de cada dos durante 3 turnos. Es tu mejor defensa. Guarda Grasas de Coulirou para las quemaduras de Itzel.</li><li>Si Barbe-Yeux no tiene nada útil que hacer (jefe en vuelo, sin ataque a distancia), haz que <strong>pase turno</strong>: recibe un 25 % menos de daño hasta su próximo turno y recupera un 20 % de su energía.</li></ul><p><strong>Etapa 1 (4 000 PV):</strong> los dos Zoquetes huyen nada más empezar. Juegas con Barbe-Yeux e Itzel. Mientras vuela, solo le alcanzan los ataques a distancia: Disparo, Disparo devastador, Granada de humo de Itzel y Lanzamiento de tijeras de Barbe-Yeux si lo tienes. Tus golpes cuerpo a cuerpo pueden ir contra los secuaces. Por debajo de 2 000 PV, <strong>se ve obligado a aterrizar</strong> y llama a tres secuaces más. Entonces puedes golpearlo cuerpo a cuerpo.</p><p><strong>Etapa 2 (3 000 PV):</strong> todos recuperan su energía (no sus PV). Vuelve a alzar el vuelo en llamas con tres nuevos secuaces. Vuelve a los ataques a distancia.</p><p><strong>Etapa 2, continuación (3 000 PV):</strong> los dos Zoquetes vuelven con todos sus PV. Kab'raqan se posa y llama a cinco secuaces. Es el momento de <strong>Pelos de barba en los ojos</strong> (los dos Zoquetes tienen que estar en pie, y no funciona contra un objetivo en vuelo).</p><p><strong>Etapa 3 (2 000 PV):</strong> tras una escena en la taberna, Itzel se enfrenta a él <strong>sola</strong>, con tres secuaces. Los mismos ataques. Si un filete de pescado seguía haciéndole efecto al final del combate anterior, continúa aquí. Usa granadas, objetos de curación y Grasas.</p><p><strong>Si pierdes:</strong> en las etapas 1-2, vuelves a la isla y puedes reintentarlo. En la etapa 3, el combate vuelve a empezar de inmediato y te devuelven los objetos gastados durante el intento fallido.</p><p><strong>Recompensa:</strong> misión «Cazar al monstruo de los acantilados» completada (25 000 EXP), luego <strong>30 000 EXP</strong> de fin de capítulo y el logro <strong>Golpe de calor</strong>. El capítulo termina con la conversación con Itzel, en la taberna de la isla del Viento.</p>", "id": "c2-boss-kab-raqan", "texte": "Capítulo 2 Vientos contrarios Misión principal Jefe: Kab'raqan La barra de vida es continua (12 000 PV en total), pero el combate se juega en varias etapas. Las cifras de daño de abajo son las del modo normal. En modo aventura, todo el daño que recibes se reduce un 20 % (80 por bola de fuego, 120 por el cono, 40 por turno de quemadura). Lo que hace: En el primer turno, y luego en cada cambio de etapa, invoca secuaces, las Invocaciones de Kab'raqan (200 PV cada una). Hacen brotar rocas bajo Itzel (30 de daño, y luego 50 a partir de la etapa 2). Después escupe una lluvia de bolas de fuego sobre todo el equipo (100 de daño a cada uno). Cada tres ataques, sustituye la lluvia por un cono de fuego sobre Itzel: 150 de daño más una quemadura de 50 PV por turno, que se acumula si se repite. La Granada de h
