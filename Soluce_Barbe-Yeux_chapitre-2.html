umo de Itzel (5 por combate) le hace fallar sus ataques una vez de cada dos durante 3 turnos. Es tu mejor defensa. Guarda Grasas de Coulirou para las quemaduras de Itzel. Si Barbe-Yeux no tiene nada útil que hacer (jefe en vuelo, sin ataque a distancia), haz que pase turno : recibe un 25 % menos de daño hasta su próximo turno y recupera un 20 % de su energía. Etapa 1 (4 000 PV): los dos Zoquetes huyen nada más empezar. Juegas con Barbe-Yeux e Itzel. Mientras vuela, solo le alcanzan los ataques a distancia: Disparo, Disparo devastador, Granada de humo de Itzel y Lanzamiento de tijeras de Barbe-Yeux si lo tienes. Tus golpes cuerpo a cuerpo pueden ir contra los secuaces. Por debajo de 2 000 PV, se ve obligado a aterrizar y llama a tres secuaces más. Entonces puedes golpearlo cuerpo a cuerpo. Etapa 2 (3 000 PV): todos recuperan su energía (no sus PV). Vuelve a alzar el vuelo en llamas con tres nuevos secuaces. Vuelve a los ataques a distancia. Etapa 2, continuación (3 000 PV): los dos Zoquetes vuelven con todos sus PV. Kab'raqan se posa y llama a cinco secuaces. Es el momento de Pelos de barba en los ojos (los dos Zoquetes tienen que estar en pie, y no funciona contra un objetivo en vuelo). Etapa 3 (2 000 PV): tras una escena en la taberna, Itzel se enfrenta a él sola , con tres secuaces. Los mismos ataques. Si un filete de pescado seguía haciéndole efecto al final del combate anterior, continúa aquí. Usa granadas, objetos de curación y Grasas. Si pierdes: en las etapas 1-2, vuelves a la isla y puedes reintentarlo. En la etapa 3, el combate vuelve a empezar de inmediato y te devuelven los objetos gastados durante el intento fallido. Recompensa: misión «Cazar al monstruo de los acantilados» completada (25 000 EXP), luego 30 000 EXP de fin de capítulo y el logro Golpe de calor . El capítulo termina con la conversación con Itzel, en la taberna de la isla del Viento.", "sol": 0}, {"titre": "Reunirse con Itzel en su barco.", "html": "<p>Último paso antes del capítulo 3: su barco está amarrado al sureste del pueblo. Para zarpar, tienes que:</p><ul><li>llevar contigo a los dos Zoquetes (ver «Que no se te escape»);</li><li>aplicarles una <strong>Grasa de Coulirou</strong>, si no lo has hecho ya en la barca. Una sola aplicación basta para todo lo que queda.</li></ul><p>Responde «Sí» a «¿Ir a la isla de Oliva?». También puedes negarte y terminar antes tus misiones secundarias.</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "Capítulo 2 Vientos contrarios Misión principal Reunirse con Itzel en su barco. Último paso antes del capítulo 3: su barco está amarrado al sureste del pueblo. Para zarpar, tienes que: llevar contigo a los dos Zoquetes (ver «Que no se te escape»); aplicarles una Grasa de Coulirou , si no lo has hecho ya en la barca. Una sola aplicación basta para todo lo que queda. Responde «Sí» a «¿Ir a la isla de Oliva?». También puedes negarte y terminar antes tus misiones secundarias.", "sol": 0}]}, {"titre": "Misiones secundarias", "intro": "<p>Cada una da <strong>10 000 EXP</strong>. Todas cuentan para el logro <strong>El chico para todo</strong> (todas las misiones secundarias del juego).</p>", "entrees": [{"titre": "Recuperar la pinza del pescador", "html": "<ul><li><strong>Dónde:</strong> el pescador, casa al suroeste del pueblo, cerca de la barca.</li><li><strong>Pasos:</strong> acepta y luego recoge la <strong>Pinza del pescador</strong> en la primera cueva (sala de arriba a la izquierda). Llévasela.</li><li><strong>Recompensa:</strong> 10 000 EXP, y enseguida te propone «Desvelar el secreto del Coulirou». A partir de entonces también te ofrece intercambios por tus peces:<ul><li>Lubina plateada → <strong>Filete de pescado de primera</strong> (en combate, regenera el 10 % de los PV por turno);</li><li>Pez plano → <strong>Pez arrojadizo</strong> (35 de daño, lo lanzan los dos Zoquetes);</li><li>Caballa → 1 moneda de oro;</li><li>Coulirou → <strong>Grasa de Coulirou</strong> (una vez desvelado el secreto).</li></ul></li><li>Antes del secreto del Coulirou, vende la <strong>Grasa de Coulirou a 20 escudos</strong> (la opción solo aparece si tienes al menos 20 escudos).</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "Capítulo 2 Vientos contrarios Misiones secundarias Recuperar la pinza del pescador Dónde: el pescador, casa al suroeste del pueblo, cerca de la barca. Pasos: acepta y luego recoge la Pinza del pescador en la primera cueva (sala de arriba a la izquierda). Llévasela. Recompensa: 10 000 EXP, y enseguida te propone «Desvelar el secreto del Coulirou». A partir de entonces también te ofrece intercambios por tus peces: Lubina plateada → Filete de pescado de primera (en combate, regenera el 10 % de los PV por turno); Pez plano → Pez arrojadizo (35 de daño, lo lanzan los dos Zoquetes); Caballa → 1 moneda de oro; Coulirou → Grasa de Coulirou (una vez desvelado el secreto). Antes del secreto del Coulirou, vende la Grasa de Coulirou a 20 escudos (la opción solo aparece si tienes al menos 20 escudos).", "sol": 0}, {"titre": "Desvelar el secreto del Coulirou", "html": "<ul><li><strong>Dónde:</strong> el pescador, después de la misión de la pinza. Si la rechazaste, vuelve a hablar con él.</li><li><strong>Pasos:</strong><ol><li>Recoge <strong>3 Algas blandas</strong>. Solo hay tres en la isla, no te deshagas de ellas: una en la playa al suroeste de la barca, una en la costa este (siguiendo la orilla hacia el norte desde el pueblo) y una en el extremo noreste (después de la segunda cueva).</li><li>En la taberna, elige <strong>Pedir lentejas recocidas.</strong> (la opción solo aparece una vez aceptada la misión).</li><li>Dáselo todo al pescador.</li></ol></li><li><strong>Recompensa:</strong> 10 000 EXP y se desbloquea la <strong>pesca del Coulirou</strong> (ver Minijuegos).</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "Capítulo 2 Vientos contrarios Misiones secundarias Desvelar el secreto del Coulirou Dónde: el pescador, después de la misión de la pinza. Si la rechazaste, vuelve a hablar con él. Pasos: Recoge 3 Algas blandas . Solo hay tres en la isla, no te deshagas de ellas: una en la playa al suroeste de la barca, una en la costa este (siguiendo la orilla hacia el norte desde el pueblo) y una en el extremo noreste (después de la segunda cueva). En la taberna, elige Pedir lentejas recocidas. (la opción solo aparece una vez aceptada la misión). Dáselo todo al pescador. Recompensa: 10 000 EXP y se desbloquea la pesca del Coulirou (ver Minijuegos).", "sol": 0}, {"titre": "Devolverle la red a la pescadora", "html": "<ul><li><strong>Dónde:</strong> la pescadora, casa al este del pueblo.</li><li><strong>Pasos:</strong> la <strong>Red lastrada</strong> está en el campamento de los pescadores-bandidos, al noreste de la isla (después de la segunda cueva). Hay que derrotar al grupo que la custodia.</li><li><strong>Recompensa:</strong> 10 000 EXP.</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "Capítulo 2 Vientos contrarios Misiones secundarias Devolverle la red a la pescadora Dónde: la pescadora, casa al este del pueblo. Pasos: la Red lastrada está en el campamento de los pescadores-bandidos, al noreste de la isla (después de la segunda cueva). Hay que derrotar al grupo que la custodia. Recompensa: 10 000 EXP.", "sol": 0}, {"titre": "Suavizar la sopa del acantilado", "html": "<ul><li><strong>Dónde:</strong> la cocinera de la taberna, al oeste del pueblo.</li><li><strong>Ingredientes:</strong><ul><li><strong>Algas dulces</strong>: noreste de la isla, justo al sur del campamento de los pescadores-bandidos;</li><li><strong>Sal gris</strong>: el túnel de la primera cueva, sala de arriba a la izquierda;</li><li><strong>Barril de aceite de oliva</strong>: segunda cueva, sala de la izquierda;</li><li><strong>Flor de Vientoalto</strong>: en el extremo este de la plataforma de la cima, en la arena de Kab'raqan. Para llegar hasta ella hay que cruzar la zona que inicia el combate: cógela después de tu victoria (la cima está entonces «apaciguada»).</li></ul></li><li><strong>Recompensa:</strong> 10 000 EXP.</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "Capítulo 2 Vientos contrarios Misiones secundarias Suavizar la sopa del acantilado Dónde: la cocinera de la taberna, al oeste del pueblo. Ingredientes: Algas dulces : noreste de la isla, justo al sur del campamento de los pescadores-bandidos; Sal gris : el túnel de la primera cueva, sala de arriba a la izquierda; Barril de aceite de oliva : segunda cueva, sala de la izquierda; Flor de Vientoalto : en el extremo este de la plataforma de la cima, en la arena de Kab'raqan. Para llegar hasta ella hay que cruzar la zona que inicia el combate: cógela después de tu victoria (la cima está entonces «apaciguada»). Recompensa: 10 000 EXP.", "sol": 0}, {"titre": "Más adelante: Hacer limpieza", "html": "<p>El alcalde propone esta misión mucho después de este capítulo, cuando el tabernero de la isla de los Cangrejos habla de ella (después del capítulo 5). No forma parte del capítulo 2.</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "Capítulo 2 Vientos contrarios Misiones secundarias Más adelante: Hacer limpieza El alcalde propone esta misión mucho después de este capítulo, cuando el tabernero de la isla de los Cangrejos habla de ella (después del capítulo 5). No forma parte del capítulo 2.", "sol": 0}]}, {"titre": "Minijuegos", "intro": "", "entrees": [{"titre": "Pesca del Coulirou", "html": "<ul><li><strong>Dónde:</strong> el pequeño pantalán al este de la barca, al sur del pueblo. Disponible después de «Desvelar el secreto del Coulirou».</li><li><strong>Reglas:</strong> como la pesca de la isla de los Cangrejos. Cuando pican, reproduce la combinación de flechas que aparece en el tiempo indicado. Para el Coulirou: <strong>izquierda, arriba, derecha, abajo</strong>.</li><li>Tu primera captura aquí es siempre un Coulirou. Después, una captura de cada dos es un Coulirou y las demás son peces normales (lubina plateada, pez plano, caballa…).</li><li><strong>Recompensa:</strong> cada Coulirou se cambia por una Grasa de Coulirou en casa del pescador. El Coulirou es una de las 7 especies del logro <strong>Aquí huele raro, ¿no?</strong> (todas las especies pescadas).</li></ul>", "id": "c2-peche-au-coulirou", "texte": "Capítulo 2 Vientos contrarios Minijuegos Pesca del Coulirou Dónde: el pequeño pantalán al este de la barca, al sur del pueblo. Disponible después de «Desvelar el secreto del Coulirou». Reglas: como la pesca de la isla de los Cangrejos. Cuando pican, reproduce la combinación de flechas que aparece en el tiempo indicado. Para el Coulirou: izquierda, arriba, derecha, abajo . Tu primera captura aquí es siempre un Coulirou. Después, una captura de cada dos es un Coulirou y las demás son peces normales (lubina plateada, pez plano, caballa…). Recompensa: cada Coulirou se cambia por una Grasa de Coulirou en casa del pescador. El Coulirou es una de las 7 especies del logro Aquí huele raro, ¿no? (todas las especies pescadas).", "sol": 0}, {"titre": "El Ojo Mentiroso (dados de la taberna)", "html": "<ul><li><strong>Dónde:</strong> taberna de la isla del Viento, «Jugar a los dados.».</li><li>Mismas reglas que en la isla de los Cangrejos, pero contra Mirette la Taimada, Menea-Cubiletes el Bruto y Jean-Charles el Astuto.</li><li>Apuestas más altas: hasta 20, 30 o 50 escudos según juegues con 3, 4 o 5 dados.</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "Capítulo 2 Vientos contrarios Minijuegos El Ojo Mentiroso (dados de la taberna) Dónde: taberna de la isla del Viento, «Jugar a los dados.». Mismas reglas que en la isla de los Cangrejos, pero contra Mirette la Taimada, Menea-Cubiletes el Bruto y Jean-Charles el Astuto. Apuestas más altas: hasta 20, 30 o 50 escudos según juegues con 3, 4 o 5 dados.", "sol": 0}]}, {"titre": "Que no se te escape", "intro": "", "entrees": [{"titre": "Que no se te escape", "html": "<ul><li><strong>Grasa de Coulirou:</strong> sin ella, es imposible salir de la isla, ni en la barca ni en el barco de Itzel. Llévate también 3 para Kab'raqan.</li><li><strong>Los dos Zoquetes en la tercera cueva:</strong> si entras por la salida superior (lado de las losas), un paso les permite auparte hasta la meseta oeste. Entonces se quedan abajo. Vuelve a pasar por la entrada inferior de la cueva para recogerlos: sin ellos, no hay partida.</li><li><strong>Cuadernos de bitácora</strong> (2 de los 7 del logro <strong>Total, yo no sé leer</strong>):<ul><li><strong>Cuaderno de bitácora III</strong>: túnel de la primera cueva, sobre el esqueleto de la sala vacía de arriba a la derecha;</li><li><strong>Cuaderno de bitácora IV</strong>: en lo alto de la escalera al norte de las losas (después del enigma), escondido detrás de la columna rota justo a la derecha, donde el guía de alta montaña dice «¡Justo detrás de mí!»;</li><li>se leen en cuanto los recoges y se guardan en la biblioteca del inventario.</li></ul></li><li><strong>Cofres de la primera cueva:</strong> Bastón de caoba (+20 de energía máx., rincón sureste, por el túnel), dos cofres de cervezas y rones, y el cofre trampa del túnel.</li><li><strong>Agujeros que cavar</strong> (con la pala encontrada en el capítulo 1):<ul><li><strong>Parche aterrador</strong> (+5 ATQ): parte baja de la meseta oeste, no lejos de la entrada inferior de la tercera cueva;</li><li>algunos escudos: 10 en medio de la meseta oeste, 8 en la parte alta de la meseta oeste cerca del campamento, 2 al este, por debajo de la meseta de las losas, y 1 en la playa al suroeste de la barca.</li></ul></li><li><strong>Pelos de barba en los ojos:</strong> se desbloquea para siempre durante el duelo contra Itzel, automáticamente.</li><li><strong>Taberna:</strong> cada visita restaura tus PV y tu energía, gratis.</li><li><strong>Capitanes resfriados:</strong> su «Orden de ataque» hace que todos los enemigos apunten a Barbe-Yeux mientras sigan en pie. Acaba con ellos primero. Una voltereta de uno de los dos Zoquetes desvía esos ataques: durante 3 turnos, los enemigos apuntan a ese Zoquete en lugar de a Barbe-Yeux.</li><li><strong>Vendedor de antorchas:</strong> justo al lado de la taberna (logro Un hombre iluminado).</li><li>No se pierde nada para siempre: la isla del Viento sigue siendo accesible después del capítulo.</li><li><strong>Logro del capítulo:</strong> <strong>Golpe de calor</strong> (terminar el capítulo 2).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "Capítulo 2 Vientos contrarios Que no se te escape Que no se te escape Grasa de Coulirou: sin ella, es imposible salir de la isla, ni en la barca ni en el barco de Itzel. Llévate también 3 para Kab'raqan. Los dos Zoquetes en la tercera cueva: si entras por la salida superior (lado de las losas), un paso les permite auparte hasta la meseta oeste. Entonces se quedan abajo. Vuelve a pasar por la entrada inferior de la cueva para recogerlos: sin ellos, no hay partida. Cuadernos de bitácora (2 de los 7 del logro Total, yo no sé leer ): Cuaderno de bitácora III : túnel de la primera cueva, sobre el esqueleto de la sala vacía de arriba a la derecha; Cuaderno de bitácora IV : en lo alto de la escalera al norte de las losas (después del enigma), escondido detrás de la columna rota justo a la derecha, donde el guía de alta montaña dice «¡Justo detrás de mí!»; se leen en cuanto los recoges y se guardan en la biblioteca del inventario. Cofres de la primera cueva: Bastón de caoba (+20 de energía máx., rincón sureste, por el túnel), dos cofres de cervezas y rones, y el cofre trampa del túnel. Agujeros que cavar (con la pala encontrada en el capítulo 1): Parche aterrador (+5 ATQ): parte baja de la meseta oeste, no lejos de la entrada inferior de la tercera cueva; algunos escudos: 10 en medio de la meseta oeste, 8 en la parte alta de la meseta oeste cerca del campamento, 2 al este, por debajo de la meseta de las losas, y 1 en la playa al suroeste de la barca. Pelos de barba en los ojos: se desbloquea para siempre durante el duelo contra Itzel, automáticamente. Taberna: cada visita restaura tus PV y tu energía, gratis. Capitanes resfriados: su «Orden de ataque» hace que todos los enemigos apunten a Barbe-Yeux mientras sigan en pie. Acaba con ellos primero. Una voltereta de uno de los dos Zoquetes desvía esos ataques: durante 3 turnos, los enemigos apuntan a ese Zoquete en lugar de a Barbe-Yeux. Vendedor de antorchas: justo al lado de la taberna (logro Un hombre iluminado). No se pierde nada para siempre: la isla del Viento sigue siendo accesible después del capítulo. Logro del capítulo: Golpe de calor (terminar el capítulo 2).", "sol": 0}]}]}], "pt": [{"id": "c2", "num": "Capítulo 2", "titre": "Ventos Contrários", "intro": "<p>Preso pela brigada marítima, Barbe-Yeux acorda na cadeia tendo como vizinho um velho presidiário bem esquisito. Uma fuga depois, ele se junta (à força) a Itzel, a Muda, e ruma para a Ilha do Vento, onde um monstro empoleirado no alto dos penhascos empesteia a vila inteira.</p>", "sections": [{"titre": "Missão principal", "intro": "", "entrees": [{"titre": "Prisão: fugir da cela (nenhum objetivo exibido)", "html": "<ol><li>O capítulo começa na sua cela, no canto superior direito da prisão. O velho presidiário começa a falar sozinho depois de um segundo.</li><li>Ele te entrega o <strong>Pergaminho furado</strong> e depois uma <strong>espinha de peixe</strong>. Todo o resto é automático: Barbe-Yeux lê o pergaminho (feche a janela para continuar), arromba a fechadura com a espinha e as portas das celas se abrem.</li><li>Agora você precisa atravessar a prisão sem ser visto (veja o quadro abaixo).</li></ol><p><strong>Como os guardas funcionam</strong> (dez guardas fazem a ronda no salão principal):</p><ul><li>Cada guarda enxerga num cone à frente dele. Se você ficar nesse cone por cerca de 1,5 segundo, ele te pega. As paredes bloqueiam a visão.</li><li>Se você passar muito perto de um guarda (de frente ou de lado), ele te pega na hora. Só as costas dele são um ponto cego.</li><li>Na sua cela, você está seguro.</li><li><strong>Não acenda a sua tocha</strong>: os guardas que veem a luz saem da ronda e vêm até você.</li><li>Se for pego, o cabo te leva de volta para a cela depois de um pequeno sermão. Nenhuma outra penalidade: tente de novo.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "Capítulo 2 Ventos Contrários Missão principal Prisão: fugir da cela (nenhum objetivo exibido) O capítulo começa na sua cela, no canto superior direito da prisão. O velho presidiário começa a falar sozinho depois de um segundo. Ele te entrega o Pergaminho furado e depois uma espinha de peixe . Todo o resto é automático: Barbe-Yeux lê o pergaminho (feche a janela para continuar), arromba a fechadura com a espinha e as portas das celas se abrem. Agora você precisa atravessar a prisão sem ser visto (veja o quadro abaixo). Como os guardas funcionam (dez guardas fazem a ronda no salão principal): Cada guarda enxerga num cone à frente dele. Se você ficar nesse cone por cerca de 1,5 segundo, ele te pega. As paredes bloqueiam a visão. Se você passar muito perto de um guarda (de frente ou de lado), ele te pega na hora. Só as costas dele são um ponto cego. Na sua cela, você está seguro. Não acenda a sua tocha : os guardas que veem a luz saem da ronda e vêm até você. Se for pego, o cabo te leva de volta para a cela depois de um pequeno sermão. Nenhuma outra penalidade: tente de novo.", "sol": 0}, {"titre": "Prisão: encontrar a chave e sair", "html": "<ol><li>Desça até a salinha dos guardas, à esquerda no meio do mapa (a entrada é por baixo). Um molho de chaves está pendurado no quadro de chaves.</li><li>Chegue perto do quadro e escolha <strong>Vasculhar</strong>: você obtém a <strong>Chave mestra</strong>.</li><li>Vá até a escada no canto inferior direito. Sem a chave, o jogo diz \"Você precisa de uma chave pra sair daqui.\"</li><li><strong>Sala de patrulha</strong>: cinco guardas circulam ali, com as mesmas regras de visão. Você entra pelo oeste, a saída fica no leste. Avance quando eles estiverem de costas. Se for pego aqui, você volta para a cela, mas continua com a chave.</li><li>Ao passar pela porta, a chave é consumida e a grade se fecha atrás de você (\"agora não tem mais volta\"). Uns dez guardas entram pelo leste e marcham na sua direção. <strong>Não se mexa, fique na entrada</strong>: a essa distância, eles não te veem. Depois do diálogo deles (\"É ELA!!!\"), eles saem correndo de volta para o leste. Aí você pode atravessar a sala e pegar a saída a leste.</li><li>Última sala: guardas estão caídos no chão. Avance para o leste para disparar o encontro com a desconhecida.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "Capítulo 2 Ventos Contrários Missão principal Prisão: encontrar a chave e sair Desça até a salinha dos guardas, à esquerda no meio do mapa (a entrada é por baixo). Um molho de chaves está pendurado no quadro de chaves. Chegue perto do quadro e escolha Vasculhar : você obtém a Chave mestra . Vá até a escada no canto inferior direito. Sem a chave, o jogo diz \"Você precisa de uma chave pra sair daqui.\" Sala de patrulha : cinco guardas circulam ali, com as mesmas regras de visão. Você entra pelo oeste, a saída fica no leste. Avance quando eles estiverem de costas. Se for pego aqui, você volta para a cela, mas continua com a chave. Ao passar pela porta, a chave é consumida e a grade se fecha atrás de você (\"agora não tem mais volta\"). Uns dez guardas entram pelo leste e marcham na sua direção. Não se mexa, fique na entrada : a essa distância, eles não te veem. Depois do diálogo deles (\"É ELA!!!\"), eles saem correndo de volta para o leste. Aí você pode atravessar a sala e pegar a saída a leste. Última sala: guardas estão caídos no chão. Avance para o leste para disparar o encontro com a desconhecida.", "sol": 0}, {"titre": "Combate roteirizado: a Desconhecida (Itzel)", "html": "<ul><li>Você luta ao lado do Capitão Dubreuil e do Cabo-chefe Bichon. A Desconhecida só mira nos dois guardas.</li><li>Ela não pode cair. Quando chega quase a zero, volta a 500 PV (\"Assim não…\").</li><li>O combate termina quando os dois guardas estão no chão. Jogue seus turnos normalmente, o resultado já está definido.</li><li>Depois, a Desconhecida se apresenta: Itzel, conhecida como a Muda. Vocês vão buscar os dois Paspalhos.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "Capítulo 2 Ventos Contrários Missão principal Combate roteirizado: a Desconhecida (Itzel) Você luta ao lado do Capitão Dubreuil e do Cabo-chefe Bichon. A Desconhecida só mira nos dois guardas. Ela não pode cair. Quando chega quase a zero, volta a 500 PV (\"Assim não…\"). O combate termina quando os dois guardas estão no chão. Jogue seus turnos normalmente, o resultado já está definido. Depois, a Desconhecida se apresenta: Itzel, conhecida como a Muda. Vocês vão buscar os dois Paspalhos.", "sol": 0}, {"titre": "O reencontro e o duelo contra Itzel", "html": "<ol><li>Cenas automáticas no navio de Itzel: os dois Paspalhos voltam para a tripulação (com uma bela queimadura de sol). Barbe-Yeux \"trata\" o pergaminho furado com a ambrosia sagrada anunciada pelo velho presidiário… As letras escondidas revelam <strong>A ILHA DO VENTO</strong>.</li><li>Travessia automática até a Ilha do Vento; depois Itzel, com os nervos à flor da pele, te desafia para um duelo.</li><li><strong>Duelo contra Itzel, a Muda</strong> (combate roteirizado, impossível de ganhar ou perder de verdade):<ul><li>Antes do desbloqueio descrito abaixo, Barbe-Yeux não pode cair: ele continua de pé com 1-3 PV \"por pura má-fé\".</li><li>Assim que Barbe-Yeux fica abaixo de 40 % dos PV, ele desbloqueia de vez o seu golpe característico, <strong>Pelos de Barba nos Olhos</strong>. Nesse turno, é a única ação possível: use-a.</li><li>O golpe não custa energia, e sim 30 % dos PV restantes de Barbe-Yeux. Os dois Paspalhos batem de 5 a 7 vezes cada um. Os dois Paspalhos precisam estar de pé. Uma vez a cada duas, Barbe-Yeux também provoca os inimigos por 3 turnos: eles miram nele.</li><li>Quando Itzel chega a 30 % dos PV (ou se ela estiver prestes a acabar com você), ela responde com o próprio golpe característico, seis tiros, e o combate termina.</li></ul></li><li>Você desembarca na Ilha do Vento com 1 PV. <strong>Dica</strong>: entrar na taverna da vila restaura de graça seus PV e sua energia.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "Capítulo 2 Ventos Contrários Missão principal O reencontro e o duelo contra Itzel Cenas automáticas no navio de Itzel: os dois Paspalhos voltam para a tripulação (com uma bela queimadura de sol). Barbe-Yeux \"trata\" o pergaminho furado com a ambrosia sagrada anunciada pelo velho presidiário… As letras escondidas revelam A ILHA DO VENTO . Travessia automática até a Ilha do Vento; depois Itzel, com os nervos à flor da pele, te desafia para um duelo. Duelo contra Itzel, a Muda (combate roteirizado, impossível de ganhar ou perder de verdade): Antes do desbloqueio descrito abaixo, Barbe-Yeux não pode cair: ele continua de pé com 1-3 PV \"por pura má-fé\". Assim que Barbe-Yeux fica abaixo de 40 % dos PV, ele desbloqueia de vez o seu golpe característico, Pelos de Barba nos Olhos . Nesse turno, é a única ação possível: use-a. O golpe não custa energia, e sim 30 % dos PV restantes de Barbe-Yeux. Os dois Paspalhos batem de 5 a 7 vezes cada um. Os dois Paspalhos precisam estar de pé. Uma vez a cada duas, Barbe-Yeux também provoca os inimigos por 3 turnos: eles miram nele. Quando Itzel chega a 30 % dos PV (ou se ela estiver prestes a acabar com você), ela responde com o próprio golpe característico, seis tiros, e o combate termina. Você desembarca na Ilha do Vento com 1 PV. Dica : entrar na taverna da vila restaura de graça seus PV e sua energia.", "sol": 0}, {"titre": "Encontrar informações úteis.", "html": "<p><em>(subobjetivo: Interrogar os moradores da vila.)</em></p><ol><li>Vá falar com o <strong>prefeito</strong>, na casa dele no centro da vila. Ele fala do monstro empoleirado no penhasco mais alto, dos bandoleiros nas grutas e do antigo mecanismo de lajes que bloqueia o cume.</li><li>A missão principal <strong>Caçar o monstro dos penhascos</strong> começa automaticamente.</li><li><strong>Atenção:</strong> você não pode sair da ilha logo. No barco, os dois Paspalhos \"não estão em condições de navegar\" por causa da queimadura de sol. Você precisa de uma <strong>Gordura de Coulirou</strong> (veja as missões do pescador: ele vende por 20 escudos desde a primeira conversa).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "Capítulo 2 Ventos Contrários Missão principal Encontrar informações úteis. (subobjetivo: Interrogar os moradores da vila.) Vá falar com o prefeito , na casa dele no centro da vila. Ele fala do monstro empoleirado no penhasco mais alto, dos bandoleiros nas grutas e do antigo mecanismo de lajes que bloqueia o cume. A missão principal Caçar o monstro dos penhascos começa automaticamente. Atenção: você não pode sair da ilha logo. No barco, os dois Paspalhos \"não estão em condições de navegar\" por causa da queimadura de sol. Você precisa de uma Gordura de Coulirou (veja as missões do pescador: ele vende por 20 escudos desde a primeira conversa).", "sol": 0}, {"titre": "Chegar ao cume e derrotar o monstro.", "html": "<p><em>(subobjetivo: Atravessar as grutas e o antigo mecanismo de lajes.)</em></p><p><strong>O caminho até as lajes:</strong></p><ol><li>Suba a escada ao lado da taverna (a oeste da vila) e atravesse os campos do oeste. A entrada da gruta se abre no penhasco, ao norte dos campos. Nos campos, logo abaixo da entrada, um <strong>guia de grutas</strong> te aborda e te leva até lá. Deixe-se guiar: Barbe-Yeux o segue sozinho. Ele não entra com você, e você só cruza com ele uma vez.</li><li><strong>Gruta do penhasco</strong>: quatro salas guardadas por bandoleiros (combates fixos, uma única vez cada). Lá você encontra:<ul><li>o <strong>Pregador do pescador</strong>, na sala do canto superior esquerdo;</li><li>um baú (15 escudos, 2 cervejas, 2 runs), na mesma sala;</li><li>um baú (5 cervejas, 3 runs), no alto ao centro, perto da escada para a segunda gruta.</li><li>A entrada do <strong>túnel</strong> fica na sala do canto superior direito. Você chega no alto do corredor central do túnel. Lá estão o <strong>Sal grosso</strong> (sala do canto superior esquerdo) e um <strong>baú com armadilha</strong> (sala grande do canto inferior esquerdo; é um monstro, o Baú com armadilha: derrote-o para ganhar 15 escudos e 2 cervejas). O <strong>Diário de bordo III</strong> está sobre um esqueleto, no meio da sala vazia do canto superior direito (sobe-se pela escada na parte de baixo dessa sala). A saída de baixo do túnel te deixa num canto no sudeste da gruta, com um baú especial: a <strong>Bengala de Mogno</strong> (+20 de energia máx.) e 10 escudos.</li></ul></li><li>Pegue a escada no alto ao centro: <strong>segunda gruta</strong>. O <strong>Barril de azeite de oliva</strong> está na sala da esquerda. Atravesse as salas (três grupos de bandoleiros) até a saída no canto inferior direito. Ela dá no nordeste da ilha.</li><li><strong>Nordeste da ilha</strong>: um acampamento de pescadores-bandidos (combate fixo contra três Pescadores e uma Pescadora). A <strong>Rede com chumbada</strong> está nesse acampamento. As <strong>Algas suaves</strong> estão logo ao sul do acampamento, e uma <strong>Alga mole</strong> à beira d'água, bem no nordeste.</li><li>Siga para o oeste pela parte de cima da ilha. Você chega ao grande planalto oeste (acampamento de bandidos, encontros aleatórios; no modo aventura, a fuga sempre funciona).</li><li><strong>Pergaminho das falésias (indispensável)</strong>: ao norte do planalto oeste, perto do acampamento, há um buraco no chão. Pule nele: você cai numa sala fechada da segunda gruta (a sala do meio, sem porta: esse buraco é o único jeito de entrar). O <strong>Pergaminho das falésias</strong> está esperando por você. Outro buraco, na mesma sala (canto inferior direito), te leva de volta à primeira gruta.</li><li>Desça o planalto oeste até a entrada de baixo da <strong>terceira gruta</strong>, ao sul do planalto. Atravesse-a: a saída (canto superior direito) dá no planalto das lajes. Itzel está te esperando lá.</li></ol><p><strong>O enigma das lajes</strong> <em>(subobjetivo: Resolver o antigo mecanismo de lajes.)</em></p><p>Nove lajes formam uma grade de 3 × 3:</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>É preciso pisar em quatro lajes na ordem certa. Fale com Itzel: sem o Pergaminho das falésias, ela diz que está faltando alguma coisa.</p><p>A lógica: abra o <strong>Pergaminho das falésias</strong> pelo inventário e clique em <strong>Usar o pergaminho furado</strong>. O pergaminho furado fica por cima e você pode arrastá-lo. Os quatro furos dele são ligados por uma linha pontilhada que termina numa seta. Arraste-o para a esquerda (cerca de um quinto da largura) e um pouco para baixo (cerca de um oitavo da altura), até que o furo grande na ponta da seta enquadre o <strong>R</strong> da borda esquerda (o que fica embaixo do B). Os furos mostram então, na ordem do pontilhado, <strong>H</strong> (o furinho do início), <strong>J</strong> (o furo grande de baixo), <strong>F</strong> (o furo da direita) e por fim <strong>R</strong>. A dica do diário de missões confirma: \"A última letra parece ser um R…\"</p><p><strong>Solução: pise em H (canto superior direito), depois J (embaixo no meio), depois F (no meio à direita), depois R (canto superior esquerdo).</strong></p><ul><li>Não pise em nenhuma outra laje entre uma e outra: passe por entre as lajes.</li><li>Depois de quatro lajes, o jogo mostra \"Vitória!\" ou \"Derrota!\". Depois de uma derrota, a sequência volta do zero.</li><li>Não enrole: mais de 10 segundos entre duas lajes e a tentativa recomeça a partir da laje que você acabou de pisar.</li><li>Se der certo, duas passagens se abrem: a escada que sobe para o cume (ao norte das lajes) e a escada de mão que desce direto para a vila (atalho). Os dois pergaminhos, agora inúteis, saem do seu inventário.</li></ul><p><strong>Preparar o combate</strong> O diário recomenda: nível 18, filés de peixe, 10 cervejas, 10 runs e 3 Gorduras de Coulirou (elas curam as queimaduras).</p><p>Suba a escada ao norte das lajes. Lá em cima, no planalto das ruínas, um <strong>guia de alta montanha</strong> está te esperando. Ele indica \"o melhor lugar da região\": \"Bem atrás de mim!\", e depois sai da frente. Ele está falando a verdade: o <strong>Diário de bordo IV</strong> está escondido atrás da coluna quebrada, logo à direita do topo da escada. Depois, suba as escadas até a plataforma do cume, a leste. Pisar nela dá início ao combate.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "Capítulo 2 Ventos Contrários Missão principal Chegar ao cume e derrotar o monstro. (subobjetivo: Atravessar as grutas e o antigo mecanismo de lajes.) O caminho até as lajes: Suba a escada ao lado da taverna (a oeste da vila) e atravesse os campos do oeste. A entrada da gruta se abre no penhasco, ao norte dos campos. Nos campos, logo abaixo da entrada, um guia de grutas te aborda e te leva até lá. Deixe-se guiar: Barbe-Yeux o segue sozinho. Ele não entra com você, e você só cruza com ele uma vez. Gruta do penhasco : quatro salas guardadas por bandoleiros (combates fixos, uma única vez cada). Lá você encontra: o Pregador do pescador , na sala do canto superior esquerdo; um baú (15 escudos, 2 cervejas, 2 runs), na mesma sala; um baú (5 cervejas, 3 runs), no alto ao centro, perto da escada para a segunda gruta. A entrada do túnel fica na sala do canto superior direito. Você chega no alto do corredor central do túnel. Lá estão o Sal grosso (sala do canto superior esquerdo) e um baú com armadilha (sala grande do canto inferior esquerdo; é um monstro, o Baú com armadilha: derrote-o para ganhar 15 escudos e 2 cervejas). O Diário de bordo III está sobre um esqueleto, no meio da sala vazia do canto superior direito (sobe-se pela escada na parte de baixo dessa sala). A saída de baixo do túnel te deixa num canto no sudeste da gruta, com um baú especial: a Bengala de Mogno (+20 de energia máx.) e 10 escudos. Pegue a escada no alto ao centro: segunda gruta . O Barril de azeite de oliva está na sala da esquerda. Atravesse as salas (três grupos de bandoleiros) até a saída no canto inferior direito. Ela dá no nordeste da ilha. Nordeste da ilha : um acampamento de pescadores-bandidos (combate fixo contra três Pescadores e uma Pescadora). A Rede com chumbada está nesse acampamento. As Algas suaves estão logo ao sul do acampamento, e uma Alga mole à beira d'água, bem no nordeste. Siga para o oeste pela parte de cima da ilha. Você chega ao grande planalto oeste (acampamento de bandidos, encontros aleatórios; no modo aventura, a fuga sempre funciona). Pergaminho das falésias (indispensável) : ao norte do planalto oeste, perto do acampamento, há um buraco no chão. Pule nele: você cai numa sala fechada da segunda gruta (a sala do meio, sem porta: esse buraco é o único jeito de entrar). O Pergaminho das falésias está esperando por você. Outro buraco, na mesma sala (canto inferior direito), te leva de volta à primeira gruta. Desça o planalto oeste até a entrada de baixo da terceira gruta , ao sul do planalto. Atravesse-a: a saída (canto superior direito) dá no planalto das lajes. Itzel está te esperando lá. O enigma das lajes (subobjetivo: Resolver o antigo mecanismo de lajes.) Nove lajes formam uma grade de 3 × 3: R T H O A F E J N É preciso pisar em quatro lajes na ordem certa. Fale com Itzel: sem o Pergaminho das falésias, ela diz que está faltando alguma coisa. A lógica: abra o Pergaminho das falésias pelo inventário e clique em Usar o pergaminho furado . O pergaminho furado fica por cima e você pode arrastá-lo. Os quatro furos dele são ligados por uma linha pontilhada que termina numa seta. Arraste-o para a esquerda (cerca de um quinto da largura) e um pouco para baixo (cerca de um oitavo da altura), até que o furo grande na ponta da seta enquadre o R da borda esquerda (o que fica embaixo do B). Os furos mostram então, na ordem do pontilhado, H (o furinho do início), J (o furo grande de baixo), F (o furo da direita) e por fim R . A dica do diário de missões confirma: \"A última letra parece ser um R…\" Solução: pise em H (canto superior direito), depois J (embaixo no meio), depois F (no meio à direita), depois R (canto superior esquerdo). Não pise em nenhuma outra laje entre uma e outra: passe por entre as lajes. Depois de quatro lajes, o jogo mostra \"Vitória!\" ou \"Derrota!\". Depois de uma derrota, a sequência volta do zero. Não enrole: mais de 10 segundos entre duas lajes e a tentativa recomeça a partir da laje que você acabou de pisar. Se der certo, duas passagens se abrem: a escada que sobe para o cume (ao norte das lajes) e a escada de mão que desce direto para a vila (atalho). Os dois pergaminhos, agora inúteis, saem do seu inventário. Preparar o combate O diário recomenda: nível 18, filés de peixe, 10 cervejas, 10 runs e 3 Gorduras de Coulirou (elas curam as queimaduras). Suba a escada ao norte das lajes. Lá em cima, no planalto das ruínas, um guia de alta montanha está te esperando. Ele indica \"o melhor lugar da região\": \"Bem atrás de mim!\", e depois sai da frente. Ele está falando a verdade: o Diário de bordo IV está escondido atrás da coluna quebrada, logo à direita do topo da escada. Depois, suba as escadas até a plataforma do cume, a leste. Pisar nela dá início ao combate.", "sol": 1}, {"titre": "Chefe: Kab'raqan", "html": "<p>A barra de vida é contínua (12 000 PV no total), mas o combate acontece em várias etapas. Os números de dano abaixo valem para o modo normal. No modo aventura, todo o dano que você sofre é reduzido em 20 % (80 por bola de fogo, 120 pelo cone, 40 por turno de queimadura).</p><p><strong>O que ele faz:</strong></p><ul><li>No primeiro turno, e depois a cada mudança de etapa, ele invoca lacaios, as Invocações de Kab'raqan (200 PV cada). Elas fazem brotar rochas debaixo de Itzel (30 de dano, depois 50 a partir da etapa 2).</li><li>Depois ele cospe uma <strong>chuva de bolas de fogo</strong> na equipe toda (100 de dano em cada um). A cada três ataques, ele troca a chuva por um <strong>cone de fogo</strong> em Itzel: 150 de dano mais uma queimadura de 50 PV por turno, que se acumula se se repetir.</li><li>A <strong>Granada de fumaça</strong> de Itzel (5 por combate) o faz errar os ataques uma vez a cada duas durante 3 turnos. É a sua melhor defesa. Guarde Gorduras de Coulirou para as queimaduras de Itzel.</li><li>Se Barbe-Yeux não tiver nada de útil para fazer (chefe voando, sem ataque à distância), faça-o <strong>passar a vez</strong>: ele sofre 25 % menos dano até o próximo turno e recupera 20 % da energia.</li></ul><p><strong>Etapa 1 (4 000 PV):</strong> os dois Paspalhos fogem logo no começo. Você joga com Barbe-Yeux e Itzel. Enquanto ele voa, só os ataques à distância o atingem: Tiro, Tiro devastador, Granada de fumaça de Itzel e o Arremesso de tesoura de Barbe-Yeux, se você o tiver. Seus golpes corpo a corpo podem mirar nos lacaios. Abaixo de 2 000 PV, ele é <strong>forçado a pousar</strong> e chama mais três lacaios. Aí você pode bater nele corpo a corpo.</p><p><strong>Etapa 2 (3 000 PV):</strong> todo mundo recupera a energia (não os PV). Ele volta a voar em chamas com três novos lacaios. Volte aos ataques à distância.</p><p><strong>Etapa 2, continuação (3 000 PV):</strong> os dois Paspalhos voltam com todos os PV. Kab'raqan pousa e chama cinco lacaios. É a hora do <strong>Pelos de Barba nos Olhos</strong> (os dois Paspalhos precisam estar de pé, e não funciona num alvo em voo).</p><p><strong>Etapa 3 (2 000 PV):</strong> depois de uma cena na taverna, Itzel o enfrenta <strong>sozinha</strong>, com três lacaios. Mesmos ataques. Se um filé de peixe ainda estava fazendo efeito nela no fim do combate anterior, ele continua aqui. Use granadas, itens de cura e Gorduras.</p><p><strong>Se você perder:</strong> nas etapas 1-2, você volta para a ilha e pode tentar de novo. Na etapa 3, o combate recomeça na hora, e os itens consumidos durante a tentativa fracassada são devolvidos.</p><p><strong>Recompensa:</strong> missão \"Caçar o monstro dos penhascos\" concluída (25 000 XP), depois <strong>30 000 XP</strong> de fim de capítulo e a conquista <strong>Calorão</strong>. O capítulo termina com a conversa com Itzel, na taverna da Ilha do Vento.</p>", "id": "c2-boss-kab-raqan", "texte": "Capítulo 2 Ventos Contrários Missão principal Chefe: Kab'raqan A barra de vida é contínua (12 000 PV no total), mas o combate acontece em várias etapas. Os números de dano abaixo valem para o modo normal. No modo aventura, todo o dano que você sofre é reduzido em 20 % (80 por bola de fogo, 120 pelo cone, 40 por turno de queimadura). O que ele faz: No primeiro turno, e depois a cada mudança de etapa, ele invoca lacaios, as Invocações de Kab'raqan (200 PV cada). Elas fazem brotar rochas debaixo de Itzel (30 de dano, depois 50 a partir da etapa 2). Depois ele cospe uma chuva de bolas de fogo na equipe toda (100 de dano em cada um). A cada três ataques, ele troca a chuva por um cone de fogo em Itzel: 150 de dano mais uma queimadura de 50 PV por turno, que se acumula se se repetir. A Granada de fumaça de Itzel (5 por combate) o faz errar os ataques uma vez a cada duas durante 3 turnos. É a sua melhor defesa. Guarde Gorduras de Coulirou para as queimaduras de Itzel. Se Barbe-Yeux não tiver nada de útil para fazer (chefe voando, sem ataque à distância), faça-o passar a vez : ele sofre 25 % menos dano até o próximo turno e recupera 20 % da energia. Etapa 1 (4 000 PV): os dois Paspalhos fogem logo no começo. Você joga com Barbe-Yeux e Itzel. Enquanto ele voa, só os ataques à distância o atingem: Tiro, Tiro devastador, Granada de fumaça de Itzel e o Arremesso de tesoura de Barbe-Yeux, se você o tiver. Seus golpes corpo a corpo podem mirar nos lacaios. Abaixo de 2 000 PV, ele é forçado a pousar e chama mais três lacaios. Aí você pode bater nele corpo a corpo. Etapa 2 (3 000 PV): todo mundo recupera a energia (não os PV). Ele volta a voar em chamas com três novos lacaios. Volte aos ataques à distância. Etapa 2, continuação (3 000 PV): os dois Paspalhos voltam com todos os PV. Kab'raqan pousa e chama cinco lacaios. É a hora do Pelos de Barba nos Olhos (os dois Paspalhos precisam estar de pé, e não funciona num alvo em voo). Etapa 3 (2 000 PV): depois de uma cena na taverna, Itzel o enfrenta sozinha , com três lacaios. Mesmos ataques. Se um filé de peixe ainda estava fazendo efeito nela no fim do combate anterior, ele continua aqui. Use granadas, itens de cura e Gorduras. Se você perder: nas etapas 1-2, você volta para a ilha e pode tentar de novo. Na etapa 3, o combate recomeça na hora, e os itens consumidos durante a tentativa fracassada são devolvidos. Recompensa: missão \"Caçar o monstro dos penhascos\" concluída (25 000 XP), depois 30 000 XP de fim de capítulo e a conquista Calorão . O capítulo termina com a conversa com Itzel, na taverna da Ilha do Vento.", "sol": 0}, {"titre": "Encontrar Itzel no navio dela.", "html": "<p>Último passo antes do capítulo 3: o navio dela está atracado no sudeste da vila. Para partir, você precisa:</p><ul><li>estar com os dois Paspalhos (veja \"Imperdível\");</li><li>passar neles uma <strong>Gordura de Coulirou</strong>, se ainda não tiver feito isso no barco. Uma única aplicação basta para todo o resto.</li></ul><p>Responda \"Sim\" a \"Ir para a Ilha da Oliva?\". Você também pode recusar e terminar antes as suas missões secundárias.</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "Capítulo 2 Ventos Contrários Missão principal Encontrar Itzel no navio dela. Último passo antes do capítulo 3: o navio dela está atracado no sudeste da vila. Para partir, você precisa: estar com os dois Paspalhos (veja \"Imperdível\"); passar neles uma Gordura de Coulirou , se ainda não tiver feito isso no barco. Uma única aplicação basta para todo o resto. Responda \"Sim\" a \"Ir para a Ilha da Oliva?\". Você também pode recusar e terminar antes as suas missões secundárias.", "sol": 0}]}, {"titre": "Missões secundárias", "intro": "<p>Cada uma rende <strong>10 000 XP</strong>. Todas contam para a conquista <strong>Pau pra toda obra</strong> (todas as missões secundárias do jogo).</p>", "entrees": [{"titre": "Recuperar a pinça do pescador", "html": "<ul><li><strong>Onde:</strong> o pescador, casa no sudoeste da vila, perto do barco.</li><li><strong>Etapas:</strong> aceite e depois pegue o <strong>Pregador do pescador</strong> na primeira gruta (sala do canto superior esquerdo). Leve-o de volta.</li><li><strong>Recompensa:</strong> 10 000 XP, e ele já te propõe \"Desvendar o segredo do Coulirou\". A partir daí, ele também oferece trocas pelos seus peixes:<ul><li>Robalo prateado → <strong>Filé de peixe caprichado</strong> (em combate, regenera 10 % dos PV por turno);</li><li>Peixe chato → <strong>Peixe de arremesso</strong> (35 de dano, arremessado pelos dois Paspalhos);</li><li>Cavala → 1 moeda de ouro;</li><li>Coulirou → <strong>Gordura de Coulirou</strong> (depois de desvendar o segredo).</li></ul></li><li>Antes do segredo do Coulirou, ele vende a <strong>Gordura de Coulirou por 20 escudos</strong> (a opção só aparece se você tiver pelo menos 20 escudos).</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "Capítulo 2 Ventos Contrários Missões secundárias Recuperar a pinça do pescador Onde: o pescador, casa no sudoeste da vila, perto do barco. Etapas: aceite e depois pegue o Pregador do pescador na primeira gruta (sala do canto superior esquerdo). Leve-o de volta. Recompensa: 10 000 XP, e ele já te propõe \"Desvendar o segredo do Coulirou\". A partir daí, ele também oferece trocas pelos seus peixes: Robalo prateado → Filé de peixe caprichado (em combate, regenera 10 % dos PV por turno); Peixe chato → Peixe de arremesso (35 de dano, arremessado pelos dois Paspalhos); Cavala → 1 moeda de ouro; Coulirou → Gordura de Coulirou (depois de desvendar o segredo). Antes do segredo do Coulirou, ele vende a Gordura de Coulirou por 20 escudos (a opção só aparece se você tiver pelo menos 20 escudos).", "sol": 0}, {"titre": "Desvendar o segredo do Coulirou", "html": "<ul><li><strong>Onde:</strong> o pescador, depois da missão da pinça. Se você recusou, fale com ele de novo.</li><li><strong>Etapas:</strong><ol><li>Pegue <strong>3 Algas moles</strong>. Só existem três na ilha, não se desfaça delas: uma na praia a sudoeste do barco, uma na costa leste (seguindo a beira-mar para o norte a partir da vila), uma bem no nordeste (depois da segunda gruta).</li><li>Na taverna, escolha <strong>Pedir lentilhas cozidas demais.</strong> (a opção só aparece depois que a missão é aceita).</li><li>Entregue tudo ao pescador.</li></ol></li><li><strong>Recompensa:</strong> 10 000 XP e a <strong>pesca do Coulirou</strong> desbloqueada (veja Minijogos).</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "Capítulo 2 Ventos Contrários Missões secundárias Desvendar o segredo do Coulirou Onde: o pescador, depois da missão da pinça. Se você recusou, fale com ele de novo. Etapas: Pegue 3 Algas moles . Só existem três na ilha, não se desfaça delas: uma na praia a sudoeste do barco, uma na costa leste (seguindo a beira-mar para o norte a partir da vila), uma bem no nordeste (depois da segunda gruta). Na taverna, escolha Pedir lentilhas cozidas demais. (a opção só aparece depois que a missão é aceita). Entregue tudo ao pescador. Recompensa: 10 000 XP e a pesca do Coulirou desbloqueada (veja Minijogos).", "sol": 0}, {"titre": "Devolver a rede da pescadora", "html": "<ul><li><strong>Onde:</strong> a pescadora, casa no leste da vila.</li><li><strong>Etapas:</strong> a <strong>Rede com chumbada</strong> está no acampamento dos pescadores-bandidos, no nordeste da ilha (depois da segunda gruta). É preciso derrotar o grupo que a guarda.</li><li><strong>Recompensa:</strong> 10 000 XP.</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "Capítulo 2 Ventos Contrários Missões secundárias Devolver a rede da pescadora Onde: a pescadora, casa no leste da vila. Etapas: a Rede com chumbada está no acampamento dos pescadores-bandidos, no nordeste da ilha (depois da segunda gruta). É preciso derrotar o grupo que a guarda. Recompensa: 10 000 XP.", "sol": 0}, {"titre": "Suavizar a sopa do penhasco", "html": "<ul><li><strong>Onde:</strong> a cozinheira da taverna, a oeste da vila.</li><li><strong>Ingredientes:</strong><ul><li><strong>Algas suaves</strong>: nordeste da ilha, logo ao sul do acampamento dos pescadores-bandidos;</li><li><strong>Sal grosso</strong>: o túnel da primeira gruta, sala do canto superior esquerdo;</li><li><strong>Barril de azeite de oliva</strong>: segunda gruta, sala da esquerda;</li><li><strong>Flor do Vento-Alto</strong>: na ponta leste da plataforma do cume, na arena de Kab'raqan. Para alcançá-la, é preciso atravessar a área que dispara o combate: colha-a depois da vitória (aí o cume está \"em paz\").</li></ul></li><li><strong>Recompensa:</strong> 10 000 XP.</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "Capítulo 2 Ventos Contrários Missões secundárias Suavizar a sopa do penhasco Onde: a cozinheira da taverna, a oeste da vila. Ingredientes: Algas suaves : nordeste da ilha, logo ao sul do acampamento dos pescadores-bandidos; Sal grosso : o túnel da primeira gruta, sala do canto superior esquerdo; Barril de azeite de oliva : segunda gruta, sala da esquerda; Flor do Vento-Alto : na ponta leste da plataforma do cume, na arena de Kab'raqan. Para alcançá-la, é preciso atravessar a área que dispara o combate: colha-a depois da vitória (aí o cume está \"em paz\"). Recompensa: 10 000 XP.", "sol": 0}, {"titre": "Mais tarde: Fazer a faxina", "html": "<p>O prefeito propõe esta missão bem depois deste capítulo, quando o taverneiro da Ilha dos Caranguejos fala dela (depois do capítulo 5). Ela não faz parte do capítulo 2.</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "Capítulo 2 Ventos Contrários Missões secundárias Mais tarde: Fazer a faxina O prefeito propõe esta missão bem depois deste capítulo, quando o taverneiro da Ilha dos Caranguejos fala dela (depois do capítulo 5). Ela não faz parte do capítulo 2.", "sol": 0}]}, {"titre": "Minijogos", "intro": "", "entrees": [{"titre": "Pesca do Coulirou", "html": "<ul><li><strong>Onde:</strong> o pequeno píer a leste do barco, ao sul da vila. Disponível depois de \"Desvendar o segredo do Coulirou\".</li><li><strong>Regras:</strong> igual à pesca da Ilha dos Caranguejos. Quando o peixe morder, reproduza a combinação de setas mostrada dentro do tempo. Para o Coulirou: <strong>esquerda, cima, direita, baixo</strong>.</li><li>A sua primeira captura aqui é sempre um Coulirou. Depois, uma captura a cada duas é um Coulirou, as outras são peixes comuns (robalo prateado, peixe chato, cavala…).</li><li><strong>Recompensa:</strong> cada Coulirou pode ser trocado por uma Gordura de Coulirou com o pescador. O Coulirou é uma das 7 espécies da conquista <strong>Tá rolando um cheirinho, não?</strong> (todas as espécies pescadas).</li></ul>", "id": "c2-peche-au-coulirou", "texte": "Capítulo 2 Ventos Contrários Minijogos Pesca do Coulirou Onde: o pequeno píer a leste do barco, ao sul da vila. Disponível depois de \"Desvendar o segredo do Coulirou\". Regras: igual à pesca da Ilha dos Caranguejos. Quando o peixe morder, reproduza a combinação de setas mostrada dentro do tempo. Para o Coulirou: esquerda, cima, direita, baixo . A sua primeira captura aqui é sempre um Coulirou. Depois, uma captura a cada duas é um Coulirou, as outras são peixes comuns (robalo prateado, peixe chato, cavala…). Recompensa: cada Coulirou pode ser trocado por uma Gordura de Coulirou com o pescador. O Coulirou é uma das 7 espécies da conquista Tá rolando um cheirinho, não? (todas as espécies pescadas).", "sol": 0}, {"titre": "O Olho Mentiroso (dados da taverna)", "html": "<ul><li><strong>Onde:</strong> taverna da Ilha do Vento, \"Jogar dados.\".</li><li><strong>Regras:</strong> as mesmas da Ilha dos Caranguejos, mas contra Mirette, a Ardilosa; Brasse-Gobelet, o Brutamontes; e Jean-Charles, o Astuto.</li><li>Apostas mais altas: até 20, 30 ou 50 escudos, conforme você jogue com 3, 4 ou 5 dados.</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "Capítulo 2 Ventos Contrários Minijogos O Olho Mentiroso (dados da taverna) Onde: taverna da Ilha do Vento, \"Jogar dados.\". Regras: as mesmas da Ilha dos Caranguejos, mas contra Mirette, a Ardilosa; Brasse-Gobelet, o Brutamontes; e Jean-Charles, o Astuto. Apostas mais altas: até 20, 30 ou 50 escudos, conforme você jogue com 3, 4 ou 5 dados.", "sol": 0}]}, {"titre": "Imperdível", "intro": "", "entrees": [{"titre": "Imperdível", "html": "<ul><li><strong>Gordura de Coulirou:</strong> sem ela, é impossível sair da ilha, seja pelo barco, seja pelo navio de Itzel. Leve também 3 para Kab'raqan.</li><li><strong>Os dois Paspalhos na terceira gruta:</strong> se você entrar pela saída de cima (lado das lajes), uma passagem permite que eles te deem pezinho até o planalto oeste. Aí eles ficam lá embaixo. Passe de novo pela entrada de baixo da gruta para buscá-los: sem eles, nada de partida.</li><li><strong>Diários de bordo</strong> (2 dos 7 da conquista <strong>Até porque eu nem sei ler</strong>):<ul><li><strong>Diário de bordo III</strong>: túnel da primeira gruta, sobre o esqueleto da sala vazia do canto superior direito;</li><li><strong>Diário de bordo IV</strong>: no alto da escada ao norte das lajes (depois do enigma), escondido atrás da coluna quebrada logo à direita, onde o guia de alta montanha diz \"Bem atrás de mim!\";</li><li>eles podem ser lidos assim que você os pega e ficam guardados na biblioteca do inventário.</li></ul></li><li><strong>Baús da primeira gruta:</strong> Bengala de Mogno (+20 de energia máx., canto sudeste, pelo túnel), dois baús de cervejas e runs, e o baú com armadilha do túnel.</li><li><strong>Buracos para cavar</strong> (com a pá encontrada no capítulo 1):<ul><li><strong>Tapa-olho assustador</strong> (+5 ATQ): parte de baixo do planalto oeste, não muito longe da entrada de baixo da terceira gruta;</li><li>alguns escudos: 10 no meio do planalto oeste, 8 no alto do planalto oeste perto do acampamento, 2 no leste, abaixo do planalto das lajes, 1 na praia a sudoeste do barco.</li></ul></li><li><strong>Pelos de Barba nos Olhos:</strong> desbloqueado de vez durante o duelo contra Itzel, automaticamente.</li><li><strong>Taverna:</strong> cada visita restaura seus PV e sua energia, de graça.</li><li><strong>Capitães resfriados:</strong> a \"Ordem de ataque\" deles faz todos os inimigos mirarem em Barbe-Yeux enquanto eles estiverem de pé. Derrube-os primeiro. Um Rolamento de um dos dois Paspalhos desvia esses ataques: durante 3 turnos, os inimigos miram nesse Paspalho em vez de Barbe-Yeux.</li><li><strong>Vendedor de tochas:</strong> bem ao lado da taverna (conquista Um homem iluminado).</li><li>Nada é perdido para sempre: a Ilha do Vento continua acessível depois do capítulo.</li><li><strong>Conquista do capítulo:</strong> <strong>Calorão</strong> (terminar o capítulo 2).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "Capítulo 2 Ventos Contrários Imperdível Imperdível Gordura de Coulirou: sem ela, é impossível sair da ilha, seja pelo barco, seja pelo navio de Itzel. Leve também 3 para Kab'raqan. Os dois Paspalhos na terceira gruta: se você entrar pela saída de cima (lado das lajes), uma passagem permite que eles te deem pezinho até o planalto oeste. Aí eles ficam lá embaixo. Passe de novo pela entrada de baixo da gruta para buscá-los: sem eles, nada de partida. Diários de bordo (2 dos 7 da conquista Até porque eu nem sei ler ): Diário de bordo III : túnel da primeira gruta, sobre o esqueleto da sala vazia do canto superior direito; Diário de bordo IV : no alto da escada ao norte das lajes (depois do enigma), escondido atrás da coluna quebrada logo à direita, onde o guia de alta montanha diz \"Bem atrás de mim!\"; eles podem ser lidos assim que você os pega e ficam guardados na biblioteca do inventário. Baús da primeira gruta: Bengala de Mogno (+20 de energia máx., canto sudeste, pelo túnel), dois baús de cervejas e runs, e o baú com armadilha do túnel. Buracos para cavar (com a pá encontrada no capítulo 1): Tapa-olho assustador (+5 ATQ): parte de baixo do planalto oeste, não muito longe da entrada de baixo da terceira gruta; alguns escudos: 10 no meio do planalto oeste, 8 no alto do planalto oeste perto do acampamento, 2 no leste, abaixo do planalto das lajes, 1 na praia a sudoeste do barco. Pelos de Barba nos Olhos: desbloqueado de vez durante o duelo contra Itzel, automaticamente. Taverna: cada visita restaura seus PV e sua energia, de graça. Capitães resfriados: a \"Ordem de ataque\" deles faz todos os inimigos mirarem em Barbe-Yeux enquanto eles estiverem de pé. Derrube-os primeiro. Um Rolamento de um dos dois Paspalhos desvia esses ataques: durante 3 turnos, os inimigos miram nesse Paspalho em vez de Barbe-Yeux. Vendedor de tochas: bem ao lado da taverna (conquista Um homem iluminado). Nada é perdido para sempre: a Ilha do Vento continua acessível depois do capítulo. Conquista do capítulo: Calorão (terminar o capítulo 2).", "sol": 0}]}]}], "ja": [{"id": "c2", "num": "第2章", "titre": "向かい風", "intro": "<p>海上警備隊に捕まったバルブ・ユーは、牢獄で目を覚まします。隣にいるのは、なんとも奇妙な古株の囚人です。脱獄を経て、無口なイツェルと（なかば無理やり）手を組み、風の島へ向かいます。そこでは、崖の頂上に棲みついた怪物が村じゅうに悪臭をまき散らしていました。</p>", "sections": [{"titre": "メインクエスト", "intro": "", "entrees": [{"titre": "牢獄：独房から脱出する（目標表示なし）", "html": "<ol><li>章は、牢獄の右上にあるあなたの独房から始まります。1秒ほどすると、古株の囚人が勝手に話しかけてきます。</li><li>彼は <strong>穴あきの羊皮紙</strong>、続いて <strong>魚の骨</strong> をくれます。あとはすべて自動です。バルブ・ユーが羊皮紙を読み（ウィンドウを閉じると続きます）、骨で錠をこじ開けると、独房の扉が開きます。</li><li>ここからは、見つからずに牢獄を通り抜けなければなりません（下の囲みを参照）。</li></ol><p><strong>看守の動き方</strong>（大広間では10人の看守が巡回しています）：</p><ul><li>看守は前方の扇形の範囲を見ています。その範囲に約1.5秒とどまると捕まります。壁は視線をさえぎります。</li><li>看守のすぐそばを（正面でも横でも）通ると、即座に捕まります。死角は背中側だけです。</li><li>自分の独房の中にいれば安全です。</li><li><strong>たいまつに火を灯さないこと</strong>：光に気づいた看守は巡回をやめ、こちらへ向かってきます。</li><li>捕まると、軽いお説教のあと、曹長が独房へ連れ戻します。ほかにペナルティはありません。やり直しましょう。</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "第2章 向かい風 メインクエスト 牢獄：独房から脱出する（目標表示なし） 章は、牢獄の右上にあるあなたの独房から始まります。1秒ほどすると、古株の囚人が勝手に話しかけてきます。 彼は 穴あきの羊皮紙 、続いて 魚の骨 をくれます。あとはすべて自動です。バルブ・ユーが羊皮紙を読み（ウィンドウを閉じると続きます）、骨で錠をこじ開けると、独房の扉が開きます。 ここからは、見つからずに牢獄を通り抜けなければなりません（下の囲みを参照）。 看守の動き方 （大広間では10人の看守が巡回しています）： 看守は前方の扇形の範囲を見ています。その範囲に約1.5秒とどまると捕まります。壁は視線をさえぎります。 看守のすぐそばを（正面でも横でも）通ると、即座に捕まります。死角は背中側だけです。 自分の独房の中にいれば安全です。 たいまつに火を灯さないこと ：光に気づいた看守は巡回をやめ、こちらへ向かってきます。 捕まると、軽いお説教のあと、曹長が独房へ連れ戻します。ほかにペナルティはありません。やり直しましょう。", "sol": 0}, {"titre": "牢獄：鍵を見つけて外に出る", "html": "<ol><li>マップ中央の左にある小さな看守部屋まで下ります（入り口は下側です）。鍵掛けの板に鍵束がぶら下がっています。</li><li>板に近づいて <strong>探る</strong> を選ぶと、<strong>万能鍵</strong> が手に入ります。</li><li>右下の階段へ向かいます。鍵がないと「ここから出るには鍵が必要だ。」と言われます。</li><li><strong>巡回部屋</strong>：5人の看守が同じ視界ルールで歩き回っています。入り口は西、出口は東です。看守が背を向けたときに進みましょう。ここで捕まると独房からやり直しですが、鍵は持ったままです。</li><li>扉を通ると鍵はなくなり、背後で鉄格子が閉まります（「ああ、もう後戻りはできない……」）。十人ほどの看守が東から入ってきて、こちらへ歩いてきます。<strong>動かずに、入り口にとどまってください</strong>。この距離なら見つかりません。彼らの会話（「あの女だああっ！！！」）のあと、看守たちは東へ走り去ります。そうしたら部屋を横切り、東の出口から出ましょう。</li><li>最後の部屋：看守たちが床に倒れています。東へ進むと、謎の女との出会いが始まります。</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "第2章 向かい風 メインクエスト 牢獄：鍵を見つけて外に出る マップ中央の左にある小さな看守部屋まで下ります（入り口は下側です）。鍵掛けの板に鍵束がぶら下がっています。 板に近づいて 探る を選ぶと、 万能鍵 が手に入ります。 右下の階段へ向かいます。鍵がないと「ここから出るには鍵が必要だ。」と言われます。 巡回部屋 ：5人の看守が同じ視界ルールで歩き回っています。入り口は西、出口は東です。看守が背を向けたときに進みましょう。ここで捕まると独房からやり直しですが、鍵は持ったままです。 扉を通ると鍵はなくなり、背後で鉄格子が閉まります（「ああ、もう後戻りはできない……」）。十人ほどの看守が東から入ってきて、こちらへ歩いてきます。 動かずに、入り口にとどまってください 。この距離なら見つかりません。彼らの会話（「あの女だああっ！！！」）のあと、看守たちは東へ走り去ります。そうしたら部屋を横切り、東の出口から出ましょう。 最後の部屋：看守たちが床に倒れています。東へ進むと、謎の女との出会いが始まります。", "sol": 0}, {"titre": "シナリオ戦闘：謎の女（イツェル）", "html": "<ul><li>デュブルイユ船長とビション曹長と一緒に戦います。謎の女が狙うのは二人の看守だけです。</li><li>彼女は倒れません。HPがゼロ近くまで減ると、HP 500まで回復します（「そうじゃない……」）。</li><li>二人の看守が倒れた時点で戦闘は終わります。普通にターンをこなしてください。結果は決まっています。</li><li>そのあと、謎の女が名乗ります。無口なイツェルです。二人でポンコツ二人組を迎えに行きます。</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "第2章 向かい風 メインクエスト シナリオ戦闘：謎の女（イツェル） デュブルイユ船長とビション曹長と一緒に戦います。謎の女が狙うのは二人の看守だけです。 彼女は倒れません。HPがゼロ近くまで減ると、HP 500まで回復します（「そうじゃない……」）。 二人の看守が倒れた時点で戦闘は終わります。普通にターンをこなしてください。結果は決まっています。 そのあと、謎の女が名乗ります。無口なイツェルです。二人でポンコツ二人組を迎えに行きます。", "sol": 0}, {"titre": "再会とイツェルとの決闘", "html": "<ol><li>イツェルの船での自動シーン：ポンコツ二人組が一味に戻ってきます（見事に日焼けして）。バルブ・ユーは、古株の囚人が言っていた神聖なアンブロシアで穴あきの羊皮紙を「処理」します……。隠された文字が <strong>風の島</strong> を示します。</li><li>風の島へ自動で渡ったあと、我慢の限界に達したイツェルに決闘を挑まれます。</li><li><strong>無口なイツェルとの決闘</strong>（シナリオ戦闘。本当の意味で勝つことも負けることもありません）：<ul><li>下で説明する解禁の前は、バルブ・ユーは倒れません。「ただの意地と屁理屈だけで」HP 1〜3で立ち続けます。</li><li>バルブ・ユーのHPが40 %を切ると、得意技 <strong>目に入ったヒゲ</strong> が正式に解禁されます。そのターンは、これが唯一の選択肢です。使いましょう。</li><li>この技はエネルギーを消費しませんが、バルブ・ユーの残りHPの30 %を消費します。ポンコツ二人組がそれぞれ5〜7回攻撃します。二人とも立っている必要があります。2回に1回、さらにバルブ・ユーが3ターンのあいだ敵を挑発し、敵は彼を狙うようになります。</li><li>イツェルのHPが30 %まで減ると（またはとどめを刺されそうになると）、彼女も自分の得意技、6連射で応戦し、戦闘が終わります。</li></ul></li><li>HP 1の状態で風の島に上陸します。<strong>コツ</strong>：村の酒場に入ると、HPとエネルギーが無料で回復します。</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "第2章 向かい風 メインクエスト 再会とイツェルとの決闘 イツェルの船での自動シーン：ポンコツ二人組が一味に戻ってきます（見事に日焼けして）。バルブ・ユーは、古株の囚人が言っていた神聖なアンブロシアで穴あきの羊皮紙を「処理」します……。隠された文字が 風の島 を示します。 風の島へ自動で渡ったあと、我慢の限界に達したイツェルに決闘を挑まれます。 無口なイツェルとの決闘 （シナリオ戦闘。本当の意味で勝つことも負けることもありません）： 下で説明する解禁の前は、バルブ・ユーは倒れません。「ただの意地と屁理屈だけで」HP 1〜3で立ち続けます。 バルブ・ユーのHPが40 %を切ると、得意技 目に入ったヒゲ が正式に解禁されます。そのターンは、これが唯一の選択肢です。使いましょう。 この技はエネルギーを消費しませんが、バルブ・ユーの残りHPの30 %を消費します。ポンコツ二人組がそれぞれ5〜7回攻撃します。二人とも立っている必要があります。2回に1回、さらにバルブ・ユーが3ターンのあいだ敵を挑発し、敵は彼を狙うようになります。 イツェルのHPが30 %まで減ると（またはとどめを刺されそうになると）、彼女も自分の得意技、6連射で応戦し、戦闘が終わります。 HP 1の状態で風の島に上陸します。 コツ ：村の酒場に入ると、HPとエネルギーが無料で回復します。", "sol": 0}, {"titre": "役立つ情報を探す。", "html": "<p><em>（サブ目標：村人たちに話を聞く。）</em></p><ol><li>村の中央の家にいる <strong>村長</strong> に会いに行きます。いちばん高い崖の上に棲む怪物のこと、洞窟の山賊のこと、頂上をふさぐ古い石板の仕掛けのことを話してくれます。</li><li>メインクエスト <strong>崖の怪物を狩る</strong> が自動的に始まります。</li><li><strong>注意：</strong> すぐには島を出られません。小舟のところで、ポンコツ二人組は日焼けのせいで「航海できる状態じゃない」と言われます。<strong>クーリルーの脂</strong> が必要です（漁師のクエストを参照。最初に話した時点から20ゴールドで売ってくれます）。</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "第2章 向かい風 メインクエスト 役立つ情報を探す。 （サブ目標：村人たちに話を聞く。） 村の中央の家にいる 村長 に会いに行きます。いちばん高い崖の上に棲む怪物のこと、洞窟の山賊のこと、頂上をふさぐ古い石板の仕掛けのことを話してくれます。 メインクエスト 崖の怪物を狩る が自動的に始まります。 注意： すぐには島を出られません。小舟のところで、ポンコツ二人組は日焼けのせいで「航海できる状態じゃない」と言われます。 クーリルーの脂 が必要です（漁師のクエストを参照。最初に話した時点から20ゴールドで売ってくれます）。", "sol": 0}, {"titre": "頂上にたどり着き、怪物を倒す。", "html": "<p><em>（サブ目標：洞窟と古の石板仕掛けを突破する。）</em></p><p><strong>石板までの道のり：</strong></p><ol><li>酒場の横（村の西）のはしごを登り、西の畑を横切ります。洞窟の入り口は、畑の北の崖に開いています。畑の中、入り口のすぐ下で <strong>洞窟ガイド</strong> に声をかけられ、案内してもらえます。ついて行きましょう。バルブ・ユーが勝手について行きます。ガイドは中までは来ず、会えるのも1回だけです。</li><li><strong>崖の洞窟</strong>：山賊が守る4つの部屋があります（固定戦闘、各1回のみ）。見つかるもの：<ul><li><strong>漁師のクリップ</strong>：左上の部屋。</li><li>宝箱（15ゴールド、ビール2、ラム酒2）：同じ部屋。</li><li>宝箱（ビール5、ラム酒3）：上の中央、2つ目の洞窟への階段の近く。</li><li><strong>トンネル</strong> の入り口は右上の部屋にあります。トンネルの中央通路の上端に出ます。中には <strong>灰色の塩</strong>（左上の部屋）と <strong>罠つきの宝箱</strong>（左下の大部屋。これはモンスター「罠つきの宝箱」です。倒すと15ゴールドとビール2）があります。<strong>航海日誌 III</strong> は、右上の空っぽの部屋の真ん中で骸骨のそばに置かれています（その部屋の下の階段から上がります）。トンネルの下の出口から出ると、洞窟の南東の隅に着きます。そこには特別な宝箱があり、<strong>マホガニーの杖</strong>（最大エネルギー+20）と10ゴールドが入っています。</li></ul></li><li>上の中央の階段を上ると <strong>2つ目の洞窟</strong> です。<strong>オリーブオイルの樽</strong> は左の部屋にあります。部屋を通り抜け（山賊3グループ）、右下の出口へ向かいます。出口は島の北東に通じています。</li><li><strong>島の北東</strong>：山賊漁師のキャンプ（漁師3人と漁師の女1人との固定戦闘）。<strong>おもり付きの網</strong> はこのキャンプにあります。<strong>甘い海藻</strong> はキャンプのすぐ南に、<strong>柔らかい海藻</strong> がひとつ、北東の端の水辺にあります。</li><li>島の上側を通って西へ向かいます。西の大きな台地に出ます（山賊のキャンプ、ランダムエンカウントあり。アドベンチャーモードでは逃走が必ず成功します）。</li><li><strong>断崖の羊皮紙（必須）</strong>：西の台地の北、キャンプの近くで、地面に穴が開いています。飛び込むと、2つ目の洞窟の閉ざされた部屋（扉のない真ん中の部屋。この穴が唯一の入り口です）に落ちます。そこに <strong>断崖の羊皮紙</strong> があります。同じ部屋（右下の隅）にあるもうひとつの穴から、最初の洞窟に戻れます。</li><li>西の台地を下り、台地の南にある <strong>3つ目の洞窟</strong> の下の入り口へ向かいます。洞窟を抜けると、出口（右上）が石板の台地に通じています。イツェルが待っています。</li></ol><p><strong>石板の謎</strong> <em>（サブ目標：古の石板仕掛けを解く。）</em></p><p>9枚の石板が3 × 3のマス目に並んでいます。</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>4枚の石板を正しい順番で踏む必要があります。イツェルに話しかけると、断崖の羊皮紙がない場合は、何かが足りないと言われます。</p><p>解き方：インベントリから <strong>断崖の羊皮紙</strong> を開き、<strong>穴あき羊皮紙を使う</strong> をクリックします。穴あきの羊皮紙が上に重なり、ドラッグで動かせるようになります。4つの穴は点線でつながっていて、点線の先は矢印になっています。羊皮紙を左へ（幅の約5分の1）、少し下へ（高さの約8分の1）ずらし、矢印の先の大きな穴が左端の <strong>R</strong>（B の下にあるもの）を囲むようにします。すると穴には、点線の順に <strong>H</strong>（スタートの小さな穴）、<strong>J</strong>（下の大きな穴）、<strong>F</strong>（右の穴）、そして <strong>R</strong> が見えます。クエスト日誌のヒントもこれを裏づけています。「最後の文字はRのようだ……」</p><p><strong>解答：H（右上）、J（下の中央）、F（中央の右）、R（左上）の順に踏みます。</strong></p><ul><li>その間、ほかの石板は踏まないでください。石板と石板のあいだを歩きましょう。</li><li>4枚踏むと、「勝利！」か「敗北！」と表示されます。失敗すると、順番は最初からになります。</li><li>もたもたしないこと：石板と石板のあいだが10秒を超えると、直前に踏んだ石板からのやり直しになります。</li><li>成功すると、2つの通路が開きます。頂上へ上がる階段（石板の北）と、村へ直接降りるはしご（ショートカット）です。用済みになった2枚の羊皮紙はインベントリから消えます。</li></ul><p><strong>戦闘の準備</strong> 日誌のおすすめ：レベル18、魚の切り身、ビール10、ラム酒10、クーリルーの脂3（やけどを治します）。</p><p>石板の北の階段を上ります。上の遺跡の台地で、<strong>高山ガイド</strong> が待っています。「この辺りで一番いい場所」として「私のすぐ後ろです！」と教えてくれたあと、脇へよけます。本当です。<strong>航海日誌 IV</strong> は、階段を上ってすぐ右、折れた柱の陰に隠されています。そのあと、階段を登って東の頂上のプラットフォームへ向かいます。足を踏み入れると戦闘が始まります。</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "第2章 向かい風 メインクエスト 頂上にたどり着き、怪物を倒す。 （サブ目標：洞窟と古の石板仕掛けを突破する。） 石板までの道のり： 酒場の横（村の西）のはしごを登り、西の畑を横切ります。洞窟の入り口は、畑の北の崖に開いています。畑の中、入り口のすぐ下で 洞窟ガイド に声をかけられ、案内してもらえます。ついて行きましょう。バルブ・ユーが勝手について行きます。ガイドは中までは来ず、会えるのも1回だけです。 崖の洞窟 ：山賊が守る4つの部屋があります（固定戦闘、各1回のみ）。見つかるもの： 漁師のクリップ ：左上の部屋。 宝箱（15ゴールド、ビール2、ラム酒2）：同じ部屋。 宝箱（ビール5、ラム酒3）：上の中央、2つ目の洞窟への階段の近く。 トンネル の入り口は右上の部屋にあります。トンネルの中央通路の上端に出ます。中には 灰色の塩 （左上の部屋）と 罠つきの宝箱 （左下の大部屋。これはモンスター「罠つきの宝箱」です。倒すと15ゴールドとビール2）があります。 航海日誌 III は、右上の空っぽの部屋の真ん中で骸骨のそばに置かれています（その部屋の下の階段から上がります）。トンネルの下の出口から出ると、洞窟の南東の隅に着きます。そこには特別な宝箱があり、 マホガニーの杖 （最大エネルギー+20）と10ゴールドが入っています。 上の中央の階段を上ると 2つ目の洞窟 です。 オリーブオイルの樽 は左の部屋にあります。部屋を通り抜け（山賊3グループ）、右下の出口へ向かいます。出口は島の北東に通じています。 島の北東 ：山賊漁師のキャンプ（漁師3人と漁師の女1人との固定戦闘）。 おもり付きの網 はこのキャンプにあります。 甘い海藻 はキャンプのすぐ南に、 柔らかい海藻 がひとつ、北東の端の水辺にあります。 島の上側を通って西へ向かいます。西の大きな台地に出ます（山賊のキャンプ、ランダムエンカウントあり。アドベンチャーモードでは逃走が必ず成功します）。 断崖の羊皮紙（必須） ：西の台地の北、キャンプの近くで、地面に穴が開いています。飛び込むと、2つ目の洞窟の閉ざされた部屋（扉のない真ん中の部屋。この穴が唯一の入り口です）に落ちます。そこに 断崖の羊皮紙 があります。同じ部屋（右下の隅）にあるもうひとつの穴から、最初の洞窟に戻れます。 西の台地を下り、台地の南にある 3つ目の洞窟 の下の入り口へ向かいます。洞窟を抜けると、出口（右上）が石板の台地に通じています。イツェルが待っています。 石板の謎 （サブ目標：古の石板仕掛けを解く。） 9枚の石板が3 × 3のマス目に並んでいます。 R T H O A F E J N 4枚の石板を正しい順番で踏む必要があります。イツェルに話しかけると、断崖の羊皮紙がない場合は、何かが足りないと言われます。 解き方：インベントリから 断崖の羊皮紙 を開き、 穴あき羊皮紙を使う をクリックします。穴あきの羊皮紙が上に重なり、ドラッグで動かせるようになります。4つの穴は点線でつながっていて、点線の先は矢印になっています。羊皮紙を左へ（幅の約5分の1）、少し下へ（高さの約8分の1）ずらし、矢印の先の大きな穴が左端の R （B の下にあるもの）を囲むようにします。すると穴には、点線の順に H （スタートの小さな穴）、 J （下の大きな穴）、 F （右の穴）、そして R が見えます。クエスト日誌のヒントもこれを裏づけています。「最後の文字はRのようだ……」 解答：H（右上）、J（下の中央）、F（中央の右）、R（左上）の順に踏みます。 その間、ほかの石板は踏まないでください。石板と石板のあいだを歩きましょう。 4枚踏むと、「勝利！」か「敗北！」と表示されます。失敗すると、順番は最初からになります。 もたもたしないこと：石板と石板のあいだが10秒を超えると、直前に踏んだ石板からのやり直しになります。 成功すると、2つの通路が開きます。頂上へ上がる階段（石板の北）と、村へ直接降りるはしご（ショートカット）です。用済みになった2枚の羊皮紙はインベントリから消えます。 戦闘の準備 日誌のおすすめ：レベル18、魚の切り身、ビール10、ラム酒10、クーリルーの脂3（やけどを治します）。 石板の北の階段を上ります。上の遺跡の台地で、 高山ガイド が待っています。「この辺りで一番いい場所」として「私のすぐ後ろです！」と教えてくれたあと、脇へよけます。本当です。 航海日誌 IV は、階段を上ってすぐ右、折れた柱の陰に隠されています。そのあと、階段を登って東の頂上のプラットフォームへ向かいます。足を踏み入れると戦闘が始まります。", "sol": 1}, {"titre": "ボス：カブラカン", "html": "<p>HPバーはひと続き（合計12 000）ですが、戦闘はいくつかの段階に分かれています。以下のダメージはノーマルモードの数値です。アドベンチャーモードでは、受けるダメージがすべて20 %減ります（火の玉1発80、炎の円錐120、やけど1ターン40）。</p><p><strong>ボスの行動：</strong></p><ul><li>最初のターンと、段階が変わるたびに、手下の「カブラカンの召喚」（それぞれHP 200）を呼び出します。手下はイツェルの足もとから岩を突き出させます（ダメージ30、段階2からは50）。</li><li>続いて、パーティー全員に <strong>火の玉の雨</strong> を降らせます（各100ダメージ）。3回の攻撃ごとに、雨の代わりにイツ
