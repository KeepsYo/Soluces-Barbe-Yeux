/* Mise en page : en-tete collant avec la recherche, sommaire a gauche (replie sur telephone), fiches a droite. */
:root {
  --bg: #edf1ee; --surface: #fbfcfb; --fg: #17201c; --muted: #58675f; --line: #d4ddd7;
  --jade: #17765e; --jade-soft: #dcefe7; --or: #9a6a10; --or-soft: #f6ead0; --mark: #ffe08a;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--jade); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.entete-in { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.marque { font-family: var(--display); font-weight: 800; font-size: 1.45rem; margin: 0; line-height: 1.1; }
.marque small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.recherche { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1rem; outline: none; }
.recherche:focus-within { border-color: var(--jade); }
.compte { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bascule { display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); cursor: pointer; user-select: none; }
.bascule input { accent-color: var(--jade); width: 18px; height: 18px; }
.page { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 80px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; align-items: start; }
.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 110px); overflow-y: auto; font-size: .93rem; padding-right: 6px; }
.sommaire details { border-bottom: 1px solid var(--line); padding-block: 6px; }
.sommaire summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.02rem; list-style: none; padding: 4px 0; }
.sommaire summary::-webkit-details-marker { display: none; }
.sommaire summary .n { color: var(--jade); margin-right: 6px; }
.sommaire ul { list-style: none; margin: 4px 0 8px; padding: 0 0 0 10px; display: grid; gap: 2px; }
.sommaire li a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.sommaire li a:hover, .sommaire li a:focus-visible { background: var(--jade-soft); }
.sommaire li a.sec { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 8px; pointer-events: none; }
.sommaire li.cache { display: none; }
main { min-width: 0; display: grid; gap: 40px; }
.chapitre { display: grid; gap: 18px; }
.chapitre > header { border-bottom: 2px solid var(--jade); padding-bottom: 8px; }
.chapitre .num { color: var(--jade); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.chapitre h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 2px 0 0; text-wrap: balance; line-height: 1.15; }
.chap-intro { color: var(--muted); max-width: 72ch; }
.section { display: grid; gap: 14px; }
.section > h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--muted); margin: 6px 0 0; letter-spacing: .02em; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px); }
.fiche.eclat { box-shadow: 0 0 0 3px var(--jade); }
.fiche-tete { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.fiche h4 { font-family: var(--display); font-weight: 700; font-size: 1.28rem; margin: 0; text-wrap: balance; }
.lien { font: inherit; font-size: .82rem; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.lien:hover { color: var(--jade); border-color: var(--jade); }
.fiche-corps { max-width: 78ch; }
.fiche-corps p { margin: .6em 0; }
.fiche-corps h5 { font-family: var(--display); font-size: 1.05rem; margin: 1.1em 0 .2em; }
.fiche-corps ol, .fiche-corps ul { padding-left: 1.4em; margin: .5em 0; }
.fiche-corps li { margin: .25em 0; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); margin: .7em 0; }
.note p { margin: .3em 0; }
.sol { background: var(--or-soft); border: 1px solid color-mix(in srgb, var(--or) 45%, transparent); border-radius: 10px; margin: .7em 0; }
.sol summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--or); list-style: none; }
.sol summary::-webkit-details-marker { display: none; }
.sol summary::before { content: "▸ "; }
.sol[open] summary::before { content: "▾ "; }
.sol[open] summary { border-bottom: 1px solid color-mix(in srgb, var(--or) 30%, transparent); }
.sol .sol-corps { padding: 4px 14px 8px; }
.sol.contient summary::after { content: " · " attr(data-contient); font-weight: 400; font-size: .85rem; }
.langues { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.langues button { font: inherit; font-size: .85rem; font-weight: 700; letter-spacing: .04em; padding: 3px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.langues button[aria-pressed="true"] { background: var(--jade); color: var(--surface); }
.tab { overflow-x: auto; margin: .7em 0; }
.capture { margin: .9em 0; }
.capture .zoom { display: block; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: zoom-in; max-width: 100%; }
.capture img { display: block; max-width: 100%; height: auto; }
.capture figcaption { font-size: .88rem; color: var(--muted); margin-top: 6px; }
.visionneuse { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 10, .92); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.visionneuse[hidden] { display: none; }
.visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.carte { position: relative; }
.carte .zoom { width: 100%; }
.couche { position: absolute; inset: 0; pointer-events: none; }
.pastille { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer; pointer-events: auto; }
.pastille:hover, .pastille:focus-visible, .pastille.active { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--jade); outline: none; }
.bulle { position: absolute; z-index: 6; width: max-content; max-width: min(320px, 86%); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: .92rem; line-height: 1.35; box-shadow: 0 8px 22px rgba(0,0,0,.28); pointer-events: none; }
.bulle b { color: var(--jade); margin-right: 4px; }
.indice-pastilles { display: block; font-style: italic; margin-top: 2px; }
.vcarte { position: relative; display: inline-block; cursor: default; }
.vcarte img { display: block; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); }
.chapitres { max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
.chapitres[hidden] { display: none; }
.chapitres a { font-size: .86rem; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--bg); }
.chapitres a:hover { color: var(--jade); border-color: var(--jade); }
.chapitres a[aria-current] { background: var(--jade); color: var(--surface); border-color: var(--jade); }
.chapitres a.accueil { font-weight: 700; color: var(--fg); }
table { border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--jade-soft); }
code { font-size: .92em; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.vide { color: var(--muted); padding: 30px 0; }
.lien-zone { width: 100%; margin-top: 8px; font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.sommaire-mobile { display: none; }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; gap: 18px; }
  .sommaire { position: static; max-height: none; display: none; }
  .sommaire.ouvert { display: block; }
  .sommaire-mobile { display: inline-flex; font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chapitre h2 { font-size: 1.6rem; }
  .fiche { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script>
// DATA : { langue: [chapitres] }. CONFIG : lien de base (artefact) et titres par langue.
const DATA = {"fr": [{"id": "c2", "num": "Chapitre 2", "titre": "Vents Contraires", "intro": "<p>Arrêté par la brigade maritime, Barbe-Yeux se réveille en prison avec un vieux taulard bien étrange pour voisin. Une évasion plus tard, il fait équipe (de force) avec Itzel la Muette et met le cap sur l'île au Vent, où un monstre niché au sommet des falaises empeste tout le village.</p>", "sections": [{"titre": "Quête principale", "intro": "", "entrees": [{"titre": "Prison : s'évader de la cellule (pas d'objectif affiché)", "html": "<ol><li>Le chapitre commence dans ta cellule, en haut à droite de la prison. Le vieux taulard te parle tout seul au bout d'une seconde.</li><li>Il te donne le <strong>Parchemin troué</strong> puis une <strong>arête de poisson</strong>. Tout le reste est automatique : Barbe-Yeux lit le parchemin (ferme la fenêtre pour continuer), crochète la serrure avec l'arête et les portes des cellules s'ouvrent.</li><li>Tu dois maintenant traverser la prison sans te faire voir (voir l'encadré ci-dessous).</li></ol><p><strong>Comment marchent les gardes</strong> (dix gardes font leur ronde dans la grande salle) :</p><ul><li>Chaque garde voit dans un cône devant lui. Si tu restes dans ce cône environ 1,5 seconde, il t'attrape. Les murs bloquent la vue.</li><li>Si tu passes tout près d'un garde (de face ou de côté), il t'attrape aussitôt. Seul son dos est un angle mort.</li><li>Dans ta cellule, tu es à l'abri.</li><li><strong>N'allume pas ta torche</strong> : les gardes qui voient la lumière quittent leur ronde et viennent vers toi.</li><li>Si tu te fais prendre, le brigadier te ramène dans ta cellule après un petit sermon. Aucune autre pénalité : recommence.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "Chapitre 2 Vents Contraires Quête principale Prison : s'évader de la cellule (pas d'objectif affiché) Le chapitre commence dans ta cellule, en haut à droite de la prison. Le vieux taulard te parle tout seul au bout d'une seconde. Il te donne le Parchemin troué puis une arête de poisson . Tout le reste est automatique : Barbe-Yeux lit le parchemin (ferme la fenêtre pour continuer), crochète la serrure avec l'arête et les portes des cellules s'ouvrent. Tu dois maintenant traverser la prison sans te faire voir (voir l'encadré ci-dessous). Comment marchent les gardes (dix gardes font leur ronde dans la grande salle) : Chaque garde voit dans un cône devant lui. Si tu restes dans ce cône environ 1,5 seconde, il t'attrape. Les murs bloquent la vue. Si tu passes tout près d'un garde (de face ou de côté), il t'attrape aussitôt. Seul son dos est un angle mort. Dans ta cellule, tu es à l'abri. N'allume pas ta torche : les gardes qui voient la lumière quittent leur ronde et viennent vers toi. Si tu te fais prendre, le brigadier te ramène dans ta cellule après un petit sermon. Aucune autre pénalité : recommence.", "sol": 0}, {"titre": "Prison : trouver la clé et sortir", "html": "<ol><li>Descends jusqu'à la petite salle des gardes, à gauche au milieu de la carte (on y entre par le bas). Un trousseau pend au tableau à clés.</li><li>Approche-toi du tableau et choisis <strong>Fouiller</strong> : tu obtiens la <strong>Clé passe-partout</strong>.</li><li>Va à l'escalier en bas à droite. Sans la clé, le jeu te dit « Il vous faut une clé pour sortir d'ici. »</li><li><strong>Salle de patrouille</strong> : cinq gardes y tournent avec les mêmes règles de vue. Tu entres à l'ouest, la sortie est à l'est. Avance quand ils te tournent le dos. Si tu te fais prendre ici, tu repars de ta cellule, mais tu gardes la clé.</li><li>Au passage de la porte, la clé est consommée et la grille se referme derrière toi (« pas de retour en arrière possible »). Une dizaine de gardes entrent par l'est et marchent vers toi. <strong>Ne bouge pas, reste à l'entrée</strong> : à cette distance, ils ne te voient pas. Après leur dialogue (« C'EST ELLE !!! »), ils repartent en courant vers l'est. Tu peux alors traverser la salle et prendre la sortie à l'est.</li><li>Dernière salle : des gardes gisent au sol. Avance vers l'est pour déclencher la rencontre avec l'inconnue.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "Chapitre 2 Vents Contraires Quête principale Prison : trouver la clé et sortir Descends jusqu'à la petite salle des gardes, à gauche au milieu de la carte (on y entre par le bas). Un trousseau pend au tableau à clés. Approche-toi du tableau et choisis Fouiller : tu obtiens la Clé passe-partout . Va à l'escalier en bas à droite. Sans la clé, le jeu te dit « Il vous faut une clé pour sortir d'ici. » Salle de patrouille : cinq gardes y tournent avec les mêmes règles de vue. Tu entres à l'ouest, la sortie est à l'est. Avance quand ils te tournent le dos. Si tu te fais prendre ici, tu repars de ta cellule, mais tu gardes la clé. Au passage de la porte, la clé est consommée et la grille se referme derrière toi (« pas de retour en arrière possible »). Une dizaine de gardes entrent par l'est et marchent vers toi. Ne bouge pas, reste à l'entrée : à cette distance, ils ne te voient pas. Après leur dialogue (« C'EST ELLE !!! »), ils repartent en courant vers l'est. Tu peux alors traverser la salle et prendre la sortie à l'est. Dernière salle : des gardes gisent au sol. Avance vers l'est pour déclencher la rencontre avec l'inconnue.", "sol": 0}, {"titre": "Combat scénarisé : l'Inconnue (Itzel)", "html": "<ul><li>Tu combats aux côtés du Capitaine Dubreuil et du Brigadier-chef Bichon. L'Inconnue ne vise que les deux gardes.</li><li>Elle ne peut pas tomber. Quand elle arrive presque à zéro, elle remonte à 500 PV (« Pas comme ça… »).</li><li>Le combat s'arrête quand les deux gardes sont à terre. Joue tes tours normalement, l'issue est fixée.</li><li>Ensuite, l'Inconnue se présente : Itzel, dite la Muette. Vous allez chercher les deux cons.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "Chapitre 2 Vents Contraires Quête principale Combat scénarisé : l'Inconnue (Itzel) Tu combats aux côtés du Capitaine Dubreuil et du Brigadier-chef Bichon. L'Inconnue ne vise que les deux gardes. Elle ne peut pas tomber. Quand elle arrive presque à zéro, elle remonte à 500 PV (« Pas comme ça… »). Le combat s'arrête quand les deux gardes sont à terre. Joue tes tours normalement, l'issue est fixée. Ensuite, l'Inconnue se présente : Itzel, dite la Muette. Vous allez chercher les deux cons.", "sol": 0}, {"titre": "Les retrouvailles et le duel contre Itzel", "html": "<ol><li>Scènes automatiques sur le navire d'Itzel : les deux cons reviennent dans l'équipage (avec un joli coup de soleil). Barbe-Yeux « traite » le parchemin troué avec l'ambroisie sacrée annoncée par le vieux taulard… Les lettres cachées révèlent <strong>L'ÎLE AU VENT</strong>.</li><li>Traversée automatique vers l'île au Vent, puis Itzel, à bout de nerfs, te provoque en duel.</li><li><strong>Duel contre Itzel la Muette</strong> (combat scénarisé, impossible à gagner ou à perdre vraiment) :<ul><li>Avant le déblocage décrit ci-dessous, Barbe-Yeux ne peut pas tomber : il reste debout à 1-3 PV « par pure mauvaise foi ».</li><li>Dès que Barbe-Yeux passe sous 40 % de ses PV, il débloque pour de bon son coup fétiche <strong>Poils de Barbe dans les Yeux</strong>. Pour ce tour-là, c'est la seule action possible : utilise-la.</li><li>Le coup ne coûte pas d'énergie mais 30 % des PV restants de Barbe-Yeux. Les deux cons frappent 5 à 7 fois chacun. Il faut que les deux cons soient debout. Une fois sur deux, Barbe-Yeux provoque en plus les ennemis pendant 3 tours : ils le visent lui.</li><li>Quand Itzel descend à 30 % de ses PV (ou si elle allait t'achever), elle répond avec son propre coup fétiche, six tirs, et le combat se termine.</li></ul></li><li>Tu débarques sur l'île au Vent avec 1 PV. <strong>Astuce</strong> : entrer dans la taverne du village restaure gratuitement tes PV et ton énergie.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "Chapitre 2 Vents Contraires Quête principale Les retrouvailles et le duel contre Itzel Scènes automatiques sur le navire d'Itzel : les deux cons reviennent dans l'équipage (avec un joli coup de soleil). Barbe-Yeux « traite » le parchemin troué avec l'ambroisie sacrée annoncée par le vieux taulard… Les lettres cachées révèlent L'ÎLE AU VENT . Traversée automatique vers l'île au Vent, puis Itzel, à bout de nerfs, te provoque en duel. Duel contre Itzel la Muette (combat scénarisé, impossible à gagner ou à perdre vraiment) : Avant le déblocage décrit ci-dessous, Barbe-Yeux ne peut pas tomber : il reste debout à 1-3 PV « par pure mauvaise foi ». Dès que Barbe-Yeux passe sous 40 % de ses PV, il débloque pour de bon son coup fétiche Poils de Barbe dans les Yeux . Pour ce tour-là, c'est la seule action possible : utilise-la. Le coup ne coûte pas d'énergie mais 30 % des PV restants de Barbe-Yeux. Les deux cons frappent 5 à 7 fois chacun. Il faut que les deux cons soient debout. Une fois sur deux, Barbe-Yeux provoque en plus les ennemis pendant 3 tours : ils le visent lui. Quand Itzel descend à 30 % de ses PV (ou si elle allait t'achever), elle répond avec son propre coup fétiche, six tirs, et le combat se termine. Tu débarques sur l'île au Vent avec 1 PV. Astuce : entrer dans la taverne du village restaure gratuitement tes PV et ton énergie.", "sol": 0}, {"titre": "Trouver des informations utiles", "html": "<p><em>(sous-objectif : Interroger les habitants du village)</em></p><ol><li>Va voir le <strong>maire</strong>, dans sa maison au centre du village. Il te parle du monstre perché sur la plus haute falaise, des brigands dans les grottes et du vieux système de dalles qui barre le sommet.</li><li>La quête principale <strong>Chasser le monstre des falaises</strong> démarre automatiquement.</li><li><strong>Attention :</strong> tu ne peux pas quitter l'île tout de suite. À la barque, les deux cons « ne sont pas en condition de naviguer » à cause de leur coup de soleil. Il te faut une <strong>Graisse de Coulirou</strong> (voir les quêtes du pêcheur : il en vend à 20 écus dès votre première conversation).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "Chapitre 2 Vents Contraires Quête principale Trouver des informations utiles (sous-objectif : Interroger les habitants du village) Va voir le maire , dans sa maison au centre du village. Il te parle du monstre perché sur la plus haute falaise, des brigands dans les grottes et du vieux système de dalles qui barre le sommet. La quête principale Chasser le monstre des falaises démarre automatiquement. Attention : tu ne peux pas quitter l'île tout de suite. À la barque, les deux cons « ne sont pas en condition de naviguer » à cause de leur coup de soleil. Il te faut une Graisse de Coulirou (voir les quêtes du pêcheur : il en vend à 20 écus dès votre première conversation).", "sol": 0}, {"titre": "Atteindre le sommet et vaincre le monstre", "html": "<p><em>(sous-objectif : Traverser les grottes et l'ancien système de dalles)</em></p><p><strong>Le chemin jusqu'aux dalles :</strong></p><ol><li>Grimpe l'échelle à côté de la taverne (à l'ouest du village) et traverse les champs de l'ouest. L'entrée de la grotte s'ouvre dans la falaise, au nord des champs. Dans les champs, juste sous l'entrée, un <strong>guide de grottes</strong> t'aborde et t'y conduit. Laisse-toi guider : Barbe-Yeux le suit tout seul. Il ne t'accompagne pas à l'intérieur, et tu ne le croises qu'une fois.</li><li><strong>Grotte de la falaise</strong> : quatre salles gardées par des brigands (combats fixes, une seule fois chacun). Tu y trouves :<ul><li>la <strong>Pince du pêcheur</strong>, dans la salle en haut à gauche ;</li><li>un coffre (15 écus, 2 bières, 2 rhums), dans la même salle ;</li><li>un coffre (5 bières, 3 rhums), en haut au centre, près de l'escalier vers la seconde grotte.</li><li>L'entrée du <strong>tunnel</strong> est dans la salle en haut à droite. Tu arrives en haut du couloir central du tunnel. Tu y trouves le <strong>Sel gris</strong> (salle en haut à gauche) et un <strong>coffre piégé</strong> (grande salle en bas à gauche ; c'est un monstre, le Coffre piégé : bats-le pour 15 écus et 2 bières). Le <strong>Journal de bord III</strong> repose sur un squelette, au milieu de la salle vide en haut à droite (on y monte par l'escalier en bas de cette salle). La sortie basse du tunnel te dépose dans un recoin au sud-est de la grotte, avec un coffre spécial : la <strong>Canne en Acajou</strong> (+20 énergie max) et 10 écus.</li></ul></li><li>Prends l'escalier en haut au centre : <strong>seconde grotte</strong>. Le <strong>Tonneau d'huile d'olive</strong> est dans la salle de gauche. Traverse les salles (trois groupes de brigands) jusqu'à la sortie en bas à droite. Elle débouche au nord-est de l'île.</li><li><strong>Nord-est de l'île</strong> : un camp de pêcheurs-bandits (combat fixe contre trois Pêcheurs et une Pêcheuse). Le <strong>Filet lesté</strong> est dans ce camp. Les <strong>Algues douces</strong> sont juste au sud du camp, une <strong>Algue molle</strong> au bord de l'eau tout au nord-est.</li><li>Pars vers l'ouest par le haut de l'île. Tu arrives sur le grand plateau ouest (camp de bandits, rencontres aléatoires ; en mode aventure, la fuite réussit toujours).</li><li><strong>Parchemin des falaises (indispensable)</strong> : au nord du plateau ouest, près du camp, un trou s'ouvre dans le sol. Saute dedans : tu tombes dans une salle fermée de la seconde grotte (la salle du milieu, sans porte : ce trou est le seul moyen d'y entrer). Le <strong>Parchemin des falaises</strong> t'y attend. Un autre trou, dans la même salle (coin en bas à droite), te ramène dans la première grotte.</li><li>Descends le plateau ouest jusqu'à l'entrée basse de la <strong>troisième grotte</strong>, au sud du plateau. Traverse-la : la sortie (en haut à droite) donne sur le plateau des dalles. Itzel t'y attend.</li></ol><p><strong>L'énigme des dalles</strong> <em>(sous-objectif : Résoudre l'ancien système de dalles)</em></p><p>Neuf dalles forment une grille de 3 × 3 :</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>Il faut marcher sur quatre dalles dans le bon ordre. Parle à Itzel : sans le Parchemin des falaises, elle te dit qu'il manque quelque chose.</p><p>La logique : ouvre le <strong>Parchemin des falaises</strong> depuis l'inventaire, puis clique sur <strong>Utiliser le parchemin troué</strong>. Le parchemin troué se pose par-dessus et tu peux le faire glisser. Ses quatre trous sont reliés par un pointillé qui se termine par une flèche. Fais-le glisser vers la gauche (environ un cinquième de sa largeur) et un peu vers le bas (environ un huitième de sa hauteur), jusqu'à ce que le grand trou au bout de la flèche encadre le <strong>R</strong> du bord gauche (celui sous le B). Les trous affichent alors, dans l'ordre du pointillé, <strong>H</strong> (le petit trou du départ), <strong>J</strong> (le grand trou du bas), <strong>F</strong> (le trou de droite), puis <strong>R</strong>. L'indice du journal de quêtes confirme : « La dernière lettre semble être un R… »</p><p><strong>Solution : marche sur H (en haut à droite), puis J (en bas au milieu), puis F (au milieu à droite), puis R (en haut à gauche).</strong></p><ul><li>Ne marche sur aucune autre dalle entre deux : passe entre les dalles.</li><li>Après quatre dalles, le jeu affiche « Victoire ! » ou « Défaite ! ». Après une défaite, la séquence repart de zéro.</li><li>Ne traîne pas : plus de 10 secondes entre deux dalles et la tentative repart de la dalle que tu viens de fouler.</li><li>En cas de réussite, deux passages s'ouvrent : l'escalier qui monte vers le sommet (au nord des dalles) et l'échelle qui redescend directement au village (raccourci). Les deux parchemins, devenus inutiles, quittent ton inventaire.</li></ul><p><strong>Préparer le combat</strong> Le journal recommande : niveau 18, des filets de poisson, 10 bières, 10 rhums et 3 Graisses de Coulirou (elles soignent les brûlures).</p><p>Monte l'escalier au nord des dalles. En haut, sur le plateau des ruines, un <strong>guide de haute montagne</strong> t'attend. Il t'indique « le meilleur endroit du coin » : « Juste derrière moi ! », puis il s'écarte. Il dit vrai : le <strong>Journal de bord IV</strong> est caché derrière la colonne brisée, juste à droite du haut de l'escalier. Ensuite, grimpe les escaliers jusqu'à la plate-forme du sommet, à l'est. Y mettre le pied lance le combat.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "Chapitre 2 Vents Contraires Quête principale Atteindre le sommet et vaincre le monstre (sous-objectif : Traverser les grottes et l'ancien système de dalles) Le chemin jusqu'aux dalles : Grimpe l'échelle à côté de la taverne (à l'ouest du village) et traverse les champs de l'ouest. L'entrée de la grotte s'ouvre dans la falaise, au nord des champs. Dans les champs, juste sous l'entrée, un guide de grottes t'aborde et t'y conduit. Laisse-toi guider : Barbe-Yeux le suit tout seul. Il ne t'accompagne pas à l'intérieur, et tu ne le croises qu'une fois. Grotte de la falaise : quatre salles gardées par des brigands (combats fixes, une seule fois chacun). Tu y trouves : la Pince du pêcheur , dans la salle en haut à gauche ; un coffre (15 écus, 2 bières, 2 rhums), dans la même salle ; un coffre (5 bières, 3 rhums), en haut au centre, près de l'escalier vers la seconde grotte. L'entrée du tunnel est dans la salle en haut à droite. Tu arrives en haut du couloir central du tunnel. Tu y trouves le Sel gris (salle en haut à gauche) et un coffre piégé (grande salle en bas à gauche ; c'est un monstre, le Coffre piégé : bats-le pour 15 écus et 2 bières). Le Journal de bord III repose sur un squelette, au milieu de la salle vide en haut à droite (on y monte par l'escalier en bas de cette salle). La sortie basse du tunnel te dépose dans un recoin au sud-est de la grotte, avec un coffre spécial : la Canne en Acajou (+20 énergie max) et 10 écus. Prends l'escalier en haut au centre : seconde grotte . Le Tonneau d'huile d'olive est dans la salle de gauche. Traverse les salles (trois groupes de brigands) jusqu'à la sortie en bas à droite. Elle débouche au nord-est de l'île. Nord-est de l'île : un camp de pêcheurs-bandits (combat fixe contre trois Pêcheurs et une Pêcheuse). Le Filet lesté est dans ce camp. Les Algues douces sont juste au sud du camp, une Algue molle au bord de l'eau tout au nord-est. Pars vers l'ouest par le haut de l'île. Tu arrives sur le grand plateau ouest (camp de bandits, rencontres aléatoires ; en mode aventure, la fuite réussit toujours). Parchemin des falaises (indispensable) : au nord du plateau ouest, près du camp, un trou s'ouvre dans le sol. Saute dedans : tu tombes dans une salle fermée de la seconde grotte (la salle du milieu, sans porte : ce trou est le seul moyen d'y entrer). Le Parchemin des falaises t'y attend. Un autre trou, dans la même salle (coin en bas à droite), te ramène dans la première grotte. Descends le plateau ouest jusqu'à l'entrée basse de la troisième grotte , au sud du plateau. Traverse-la : la sortie (en haut à droite) donne sur le plateau des dalles. Itzel t'y attend. L'énigme des dalles (sous-objectif : Résoudre l'ancien système de dalles) Neuf dalles forment une grille de 3 × 3 : R T H O A F E J N Il faut marcher sur quatre dalles dans le bon ordre. Parle à Itzel : sans le Parchemin des falaises, elle te dit qu'il manque quelque chose. La logique : ouvre le Parchemin des falaises depuis l'inventaire, puis clique sur Utiliser le parchemin troué . Le parchemin troué se pose par-dessus et tu peux le faire glisser. Ses quatre trous sont reliés par un pointillé qui se termine par une flèche. Fais-le glisser vers la gauche (environ un cinquième de sa largeur) et un peu vers le bas (environ un huitième de sa hauteur), jusqu'à ce que le grand trou au bout de la flèche encadre le R du bord gauche (celui sous le B). Les trous affichent alors, dans l'ordre du pointillé, H (le petit trou du départ), J (le grand trou du bas), F (le trou de droite), puis R . L'indice du journal de quêtes confirme : « La dernière lettre semble être un R… » Solution : marche sur H (en haut à droite), puis J (en bas au milieu), puis F (au milieu à droite), puis R (en haut à gauche). Ne marche sur aucune autre dalle entre deux : passe entre les dalles. Après quatre dalles, le jeu affiche « Victoire ! » ou « Défaite ! ». Après une défaite, la séquence repart de zéro. Ne traîne pas : plus de 10 secondes entre deux dalles et la tentative repart de la dalle que tu viens de fouler. En cas de réussite, deux passages s'ouvrent : l'escalier qui monte vers le sommet (au nord des dalles) et l'échelle qui redescend directement au village (raccourci). Les deux parchemins, devenus inutiles, quittent ton inventaire. Préparer le combat Le journal recommande : niveau 18, des filets de poisson, 10 bières, 10 rhums et 3 Graisses de Coulirou (elles soignent les brûlures). Monte l'escalier au nord des dalles. En haut, sur le plateau des ruines, un guide de haute montagne t'attend. Il t'indique « le meilleur endroit du coin » : « Juste derrière moi ! », puis il s'écarte. Il dit vrai : le Journal de bord IV est caché derrière la colonne brisée, juste à droite du haut de l'escalier. Ensuite, grimpe les escaliers jusqu'à la plate-forme du sommet, à l'est. Y mettre le pied lance le combat.", "sol": 1}, {"titre": "Boss : Kab'raqan", "html": "<p>La barre de vie est continue (12 000 PV au total), mais le combat se joue en plusieurs étapes. Les chiffres de dégâts ci-dessous valent pour le mode normal. En mode aventure, tous les dégâts que tu subis sont réduits de 20 % (80 par boule de feu, 120 pour le cône, 40 par tour de brûlure).</p><p><strong>Ce qu'il fait :</strong></p><ul><li>Au premier tour, puis à chaque changement d'étape, il invoque des sbires, les Invocations de Kab'raqan (200 PV chacune). Elles font jaillir des roches sous Itzel (30 dégâts, puis 50 à partir de l'étape 2).</li><li>Ensuite il crache une <strong>pluie de boules de feu</strong> sur toute l'équipe (100 dégâts chacun). Toutes les trois attaques, il remplace la pluie par un <strong>cône de feu</strong> sur Itzel : 150 dégâts plus une brûlure de 50 PV par tour, qui s'additionne si elle se répète.</li><li>La <strong>Grenade fumigène</strong> d'Itzel (5 par combat) lui fait rater ses attaques une fois sur deux pendant 3 tours. C'est ta meilleure défense. Garde des Graisses de Coulirou pour les brûlures d'Itzel.</li><li>Si Barbe-Yeux n'a rien d'utile à faire (boss en vol, pas d'attaque à distance), fais-lui <strong>passer son tour</strong> : il subit 25 % de dégâts en moins jusqu'à son prochain tour et récupère 20 % de son énergie.</li></ul><p><strong>Étape 1 (4 000 PV) :</strong> les deux cons s'enfuient dès le début. Tu joues Barbe-Yeux et Itzel. Tant qu'il vole, seules les attaques à distance le touchent : Coup de feu, Tir dévastateur, Grenade fumigène d'Itzel et Lancer de ciseaux de Barbe-Yeux si tu l'as. Tes coups au corps à corps peuvent viser les sbires. Sous 2 000 PV, il est <strong>forcé d'atterrir</strong> et appelle trois sbires de plus. Tu peux alors le frapper au corps à corps.</p><p><strong>Étape 2 (3 000 PV) :</strong> tout le monde récupère son énergie (pas ses PV). Il reprend son vol en flammes avec trois nouveaux sbires. Repasse aux attaques à distance.</p><p><strong>Étape 2, suite (3 000 PV) :</strong> les deux cons reviennent avec tous leurs PV. Kab'raqan se pose et appelle cinq sbires. C'est le moment du <strong>Poils de Barbe dans les Yeux</strong> (il faut les deux cons debout, et ça ne marche pas sur une cible en vol).</p><p><strong>Étape 3 (2 000 PV) :</strong> après une scène à la taverne, Itzel l'affronte <strong>seule</strong>, avec trois sbires. Mêmes attaques. Si un filet de poisson faisait encore effet sur elle à la fin du combat précédent, il continue ici. Utilise grenades, objets de soin et Graisses.</p><p><strong>Si tu perds :</strong> aux étapes 1-2, tu reviens sur l'île et tu peux retenter. À l'étape 3, le combat recommence aussitôt, et les objets consommés pendant l'essai raté te sont rendus.</p><p><strong>Récompense :</strong> quête « Chasser le monstre des falaises » terminée (25 000 XP), puis <strong>30 000 XP</strong> de fin de chapitre et le succès <strong>Coup de chaud</strong>. Le chapitre se termine sur la discussion avec Itzel, à la taverne de l'île au Vent.</p>", "id": "c2-boss-kab-raqan", "texte": "Chapitre 2 Vents Contraires Quête principale Boss : Kab'raqan La barre de vie est continue (12 000 PV au total), mais le combat se joue en plusieurs étapes. Les chiffres de dégâts ci-dessous valent pour le mode normal. En mode aventure, tous les dégâts que tu subis sont réduits de 20 % (80 par boule de feu, 120 pour le cône, 40 par tour de brûlure). Ce qu'il fait : Au premier tour, puis à chaque changement d'étape, il invoque des sbires, les Invocations de Kab'raqan (200 PV chacune). Elles font jaillir des roches sous Itzel (30 dégâts, puis 50 à partir de l'étape 2). Ensuite il crache une pluie de boules de feu sur toute l'équipe (100 dégâts chacun). Toutes les trois attaques, il remplace la pluie par un cône de feu sur Itzel : 150 dégâts plus une brûlure de 50 PV par tour, qui s'additionne si elle se répète. La Grenade fumigène d'Itzel (5 par combat) lui fait rater ses attaques une fois sur deux pendant 3 tours. C'est ta meilleure défense. Garde des Graisses de Coulirou pour les brûlures d'Itzel. Si Barbe-Yeux n'a rien d'utile à faire (boss en vol, pas d'attaque à distance), fais-lui passer son tour : il subit 25 % de dégâts en moins jusqu'à son prochain tour et récupère 20 % de son énergie. Étape 1 (4 000 PV) : les deux cons s'enfuient dès le début. Tu joues Barbe-Yeux et Itzel. Tant qu'il vole, seules les attaques à distance le touchent : Coup de feu, Tir dévastateur, Grenade fumigène d'Itzel et Lancer de ciseaux de Barbe-Yeux si tu l'as. Tes coups au corps à corps peuvent viser les sbires. Sous 2 000 PV, il est forcé d'atterrir et appelle trois sbires de plus. Tu peux alors le frapper au corps à corps. Étape 2 (3 000 PV) : tout le monde récupère son énergie (pas ses PV). Il reprend son vol en flammes avec trois nouveaux sbires. Repasse aux attaques à distance. Étape 2, suite (3 000 PV) : les deux cons reviennent avec tous leurs PV. Kab'raqan se pose et appelle cinq sbires. C'est le moment du Poils de Barbe dans les Yeux (il faut les deux cons debout, et ça ne marche pas sur une cible en vol). Étape 3 (2 000 PV) : après une scène à la taverne, Itzel l'affronte seule , avec trois sbires. Mêmes attaques. Si un filet de poisson faisait encore effet sur elle à la fin du combat précédent, il continue ici. Utilise grenades, objets de soin et Graisses. Si tu perds : aux étapes 1-2, tu reviens sur l'île et tu peux retenter. À l'étape 3, le combat recommence aussitôt, et les objets consommés pendant l'essai raté te sont rendus. Récompense : quête « Chasser le monstre des falaises » terminée (25 000 XP), puis 30 000 XP de fin de chapitre et le succès Coup de chaud . Le chapitre se termine sur la discussion avec Itzel, à la taverne de l'île au Vent.", "sol": 0}, {"titre": "Rejoindre Itzel sur son navire", "html": "<p>Dernier pas avant le chapitre 3 : son navire est amarré au sud-est du village. Pour partir, il faut :</p><ul><li>avoir les deux cons avec toi (voir « À ne pas rater ») ;</li><li>leur appliquer une <strong>Graisse de Coulirou</strong>, si ce n'est pas déjà fait à la barque. Une seule application suffit pour toute la suite.</li></ul><p>Réponds « oui » à « Se rendre sur l'Île d'Olive ? ». Tu peux aussi refuser et finir tes quêtes secondaires avant.</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "Chapitre 2 Vents Contraires Quête principale Rejoindre Itzel sur son navire Dernier pas avant le chapitre 3 : son navire est amarré au sud-est du village. Pour partir, il faut : avoir les deux cons avec toi (voir « À ne pas rater ») ; leur appliquer une Graisse de Coulirou , si ce n'est pas déjà fait à la barque. Une seule application suffit pour toute la suite. Réponds « oui » à « Se rendre sur l'Île d'Olive ? ». Tu peux aussi refuser et finir tes quêtes secondaires avant.", "sol": 0}]}, {"titre": "Quêtes secondaires", "intro": "<p>Chacune rapporte <strong>10 000 XP</strong>. Toutes comptent pour le succès <strong>L'homme à tout faire</strong> (toutes les quêtes secondaires du jeu).</p>", "entrees": [{"titre": "Retrouver la pince du pêcheur", "html": "<ul><li><strong>Où :</strong> le pêcheur, maison au sud-ouest du village, près de la barque.</li><li><strong>Étapes :</strong> accepte, puis ramasse la <strong>Pince du pêcheur</strong> dans la première grotte (salle en haut à gauche). Rapporte-la.</li><li><strong>Récompense :</strong> 10 000 XP, et il te propose aussitôt « Percer le secret du Coulirou ». Il propose désormais aussi des échanges contre tes poissons :<ul><li>Bar argenté → <strong>Filet de poisson fameux</strong> (en combat, régénère 10 % des PV par tour) ;</li><li>Poisson plat → <strong>Poisson de lancer</strong> (35 dégâts, lancé par les deux cons) ;</li><li>Maquereau → 1 pièce d'or ;</li><li>Coulirou → <strong>Graisse de Coulirou</strong> (une fois le secret percé).</li></ul></li><li>Avant le secret du Coulirou, il vend la <strong>Graisse de Coulirou à 20 écus</strong> (l'option n'apparaît que si tu as au moins 20 écus).</li></ul>", "id": "c2-retrouver-la-pince-du-pecheur", "texte": "Chapitre 2 Vents Contraires Quêtes secondaires Retrouver la pince du pêcheur Où : le pêcheur, maison au sud-ouest du village, près de la barque. Étapes : accepte, puis ramasse la Pince du pêcheur dans la première grotte (salle en haut à gauche). Rapporte-la. Récompense : 10 000 XP, et il te propose aussitôt « Percer le secret du Coulirou ». Il propose désormais aussi des échanges contre tes poissons : Bar argenté → Filet de poisson fameux (en combat, régénère 10 % des PV par tour) ; Poisson plat → Poisson de lancer (35 dégâts, lancé par les deux cons) ; Maquereau → 1 pièce d'or ; Coulirou → Graisse de Coulirou (une fois le secret percé). Avant le secret du Coulirou, il vend la Graisse de Coulirou à 20 écus (l'option n'apparaît que si tu as au moins 20 écus).", "sol": 0}, {"titre": "Percer le secret du Coulirou", "html": "<ul><li><strong>Où :</strong> le pêcheur, après la quête de la pince. Si tu as refusé, reparle-lui.</li><li><strong>Étapes :</strong><ol><li>Ramasse <strong>3 Algues molles</strong>. Il n'y en a que trois sur l'île, ne t'en sépare pas : une sur la plage au sud-ouest de la barque, une sur la côte est (en longeant le rivage vers le nord depuis le village), une tout au nord-est (après la seconde grotte).</li><li>À la taverne, choisis <strong>Demander des lentilles trop cuites</strong> (l'option n'apparaît qu'une fois la quête acceptée).</li><li>Donne le tout au pêcheur.</li></ol></li><li><strong>Récompense :</strong> 10 000 XP et la <strong>pêche au Coulirou</strong> débloquée (voir Mini-jeux).</li></ul>", "id": "c2-percer-le-secret-du-coulirou", "texte": "Chapitre 2 Vents Contraires Quêtes secondaires Percer le secret du Coulirou Où : le pêcheur, après la quête de la pince. Si tu as refusé, reparle-lui. Étapes : Ramasse 3 Algues molles . Il n'y en a que trois sur l'île, ne t'en sépare pas : une sur la plage au sud-ouest de la barque, une sur la côte est (en longeant le rivage vers le nord depuis le village), une tout au nord-est (après la seconde grotte). À la taverne, choisis Demander des lentilles trop cuites (l'option n'apparaît qu'une fois la quête acceptée). Donne le tout au pêcheur. Récompense : 10 000 XP et la pêche au Coulirou débloquée (voir Mini-jeux).", "sol": 0}, {"titre": "Rendre son filet à la pêcheuse", "html": "<ul><li><strong>Où :</strong> la pêcheuse, maison à l'est du village.</li><li><strong>Étapes :</strong> le <strong>Filet lesté</strong> est dans le camp des pêcheurs-bandits, au nord-est de l'île (après la seconde grotte). Il faut battre le groupe qui le garde.</li><li><strong>Récompense :</strong> 10 000 XP.</li></ul>", "id": "c2-rendre-son-filet-a-la-pecheuse", "texte": "Chapitre 2 Vents Contraires Quêtes secondaires Rendre son filet à la pêcheuse Où : la pêcheuse, maison à l'est du village. Étapes : le Filet lesté est dans le camp des pêcheurs-bandits, au nord-est de l'île (après la seconde grotte). Il faut battre le groupe qui le garde. Récompense : 10 000 XP.", "sol": 0}, {"titre": "Adoucir la soupe de la falaise", "html": "<ul><li><strong>Où :</strong> la cuisinière de la taverne, à l'ouest du village.</li><li><strong>Ingrédients :</strong><ul><li><strong>Algues douces</strong> : nord-est de l'île, juste au sud du camp des pêcheurs-bandits ;</li><li><strong>Sel gris</strong> : le tunnel de la première grotte, salle en haut à gauche ;</li><li><strong>Tonneau d'huile d'olive</strong> : seconde grotte, salle de gauche ;</li><li><strong>Fleur du Haut-Vent</strong> : au bout est de la plate-forme du sommet, dans l'arène de Kab'raqan. Pour l'atteindre, il faut traverser la zone qui lance le combat : cueille-la après ta victoire (le sommet est alors « apaisé »).</li></ul></li><li><strong>Récompense :</strong> 10 000 XP.</li></ul>", "id": "c2-adoucir-la-soupe-de-la-falaise", "texte": "Chapitre 2 Vents Contraires Quêtes secondaires Adoucir la soupe de la falaise Où : la cuisinière de la taverne, à l'ouest du village. Ingrédients : Algues douces : nord-est de l'île, juste au sud du camp des pêcheurs-bandits ; Sel gris : le tunnel de la première grotte, salle en haut à gauche ; Tonneau d'huile d'olive : seconde grotte, salle de gauche ; Fleur du Haut-Vent : au bout est de la plate-forme du sommet, dans l'arène de Kab'raqan. Pour l'atteindre, il faut traverser la zone qui lance le combat : cueille-la après ta victoire (le sommet est alors « apaisé »). Récompense : 10 000 XP.", "sol": 0}, {"titre": "Plus tard : Faire le ménage", "html": "<p>Le maire propose cette quête bien après ce chapitre, quand le tavernier de l'île au crabe en parle (après le chapitre 5). Elle ne fait pas partie du chapitre 2.</p>", "id": "c2-plus-tard-faire-le-menage", "texte": "Chapitre 2 Vents Contraires Quêtes secondaires Plus tard : Faire le ménage Le maire propose cette quête bien après ce chapitre, quand le tavernier de l'île au crabe en parle (après le chapitre 5). Elle ne fait pas partie du chapitre 2.", "sol": 0}]}, {"titre": "Mini-jeux", "intro": "", "entrees": [{"titre": "Pêche au Coulirou", "html": "<ul><li><strong>Où :</strong> le petit ponton à l'est de la barque, au sud du village. Disponible après « Percer le secret du Coulirou ».</li><li><strong>Règles :</strong> comme la pêche de l'île au crabe. Quand ça mord, reproduis la combinaison de flèches affichée dans le temps imparti. Pour le Coulirou : <strong>gauche, haut, droite, bas</strong>.</li><li>Ta première prise ici est forcément un Coulirou. Ensuite, une prise sur deux est un Coulirou, les autres sont des poissons ordinaires (bar argenté, poisson plat, maquereau…).</li><li><strong>Récompense :</strong> chaque Coulirou s'échange contre une Graisse de Coulirou chez le pêcheur. Le Coulirou est l'une des 7 espèces du succès <strong>Ya comme une odeur non ?</strong> (toutes les espèces pêchées).</li></ul>", "id": "c2-peche-au-coulirou", "texte": "Chapitre 2 Vents Contraires Mini-jeux Pêche au Coulirou Où : le petit ponton à l'est de la barque, au sud du village. Disponible après « Percer le secret du Coulirou ». Règles : comme la pêche de l'île au crabe. Quand ça mord, reproduis la combinaison de flèches affichée dans le temps imparti. Pour le Coulirou : gauche, haut, droite, bas . Ta première prise ici est forcément un Coulirou. Ensuite, une prise sur deux est un Coulirou, les autres sont des poissons ordinaires (bar argenté, poisson plat, maquereau…). Récompense : chaque Coulirou s'échange contre une Graisse de Coulirou chez le pêcheur. Le Coulirou est l'une des 7 espèces du succès Ya comme une odeur non ? (toutes les espèces pêchées).", "sol": 0}, {"titre": "L'Œil menteur (dés de la taverne)", "html": "<ul><li><strong>Où :</strong> taverne de l'île au Vent, « Jouer aux dés ».</li><li>Mêmes règles qu'à l'île au crabe, mais contre Mirette la Fourbe, Brasse-Gobelet le Bourrin et Jean-Charles l'Astucieux.</li><li>Mises plus fortes : jusqu'à 20, 30 ou 50 écus selon que tu joues avec 3, 4 ou 5 dés.</li></ul>", "id": "c2-l-il-menteur-des-de-la-taverne", "texte": "Chapitre 2 Vents Contraires Mini-jeux L'Œil menteur (dés de la taverne) Où : taverne de l'île au Vent, « Jouer aux dés ». Mêmes règles qu'à l'île au crabe, mais contre Mirette la Fourbe, Brasse-Gobelet le Bourrin et Jean-Charles l'Astucieux. Mises plus fortes : jusqu'à 20, 30 ou 50 écus selon que tu joues avec 3, 4 ou 5 dés.", "sol": 0}]}, {"titre": "À ne pas rater", "intro": "", "entrees": [{"titre": "À ne pas rater", "html": "<ul><li><strong>Graisse de Coulirou :</strong> sans elle, impossible de quitter l'île, ni par la barque ni par le navire d'Itzel. Prends-en aussi 3 pour Kab'raqan.</li><li><strong>Les deux cons à la troisième grotte :</strong> si tu entres par la sortie haute (côté dalles), un passage leur permet de te faire la courte échelle jusqu'au plateau ouest. Ils restent alors en bas. Repasse par l'entrée basse de la grotte pour les récupérer : sans eux, pas de départ.</li><li><strong>Journaux de bord</strong> (2 des 7 du succès <strong>De toute façon j'sais pas lire</strong>) :<ul><li><strong>Journal de bord III</strong> : tunnel de la première grotte, sur le squelette de la salle vide en haut à droite ;</li><li><strong>Journal de bord IV</strong> : en haut de l'escalier au nord des dalles (après l'énigme), caché derrière la colonne brisée juste à droite, là où le guide de haute montagne dit « Juste derrière moi ! » ;</li><li>ils se lisent dès que tu les ramasses et se rangent dans la bibliothèque de l'inventaire.</li></ul></li><li><strong>Coffres de la première grotte :</strong> Canne en Acajou (+20 énergie max, recoin sud-est, par le tunnel), deux coffres de bières et de rhums, et le coffre piégé du tunnel.</li><li><strong>Trous à creuser</strong> (avec la pelle trouvée au chapitre 1) :<ul><li><strong>Cache œil effrayant</strong> (+5 ATK) : bas du plateau ouest, non loin de l'entrée basse de la troisième grotte ;</li><li>quelques écus : 10 au milieu du plateau ouest, 8 en haut du plateau ouest près du camp, 2 à l'est, en contrebas du plateau des dalles, 1 sur la plage au sud-ouest de la barque.</li></ul></li><li><strong>Poils de Barbe dans les Yeux :</strong> débloqué pour de bon pendant le duel contre Itzel, automatiquement.</li><li><strong>Taverne :</strong> chaque visite restaure tes PV et ton énergie, gratuitement.</li><li><strong>Capitaines enrhumés :</strong> leur « Ordre d'attaque » fait viser Barbe-Yeux par tous les ennemis tant qu'ils sont debout. Abats-les en premier. Une roulade d'un des deux cons détourne ces attaques : pendant 3 tours, les ennemis visent ce con à la place de Barbe-Yeux.</li><li><strong>Marchand de torches :</strong> juste à côté de la taverne (succès Un homme éclairé).</li><li>Rien n'est perdu définitivement : l'île au Vent reste accessible après le chapitre.</li><li><strong>Succès du chapitre :</strong> <strong>Coup de chaud</strong> (finir le chapitre 2).</li></ul>", "id": "c2-a-ne-pas-rater", "texte": "Chapitre 2 Vents Contraires À ne pas rater À ne pas rater Graisse de Coulirou : sans elle, impossible de quitter l'île, ni par la barque ni par le navire d'Itzel. Prends-en aussi 3 pour Kab'raqan. Les deux cons à la troisième grotte : si tu entres par la sortie haute (côté dalles), un passage leur permet de te faire la courte échelle jusqu'au plateau ouest. Ils restent alors en bas. Repasse par l'entrée basse de la grotte pour les récupérer : sans eux, pas de départ. Journaux de bord (2 des 7 du succès De toute façon j'sais pas lire ) : Journal de bord III : tunnel de la première grotte, sur le squelette de la salle vide en haut à droite ; Journal de bord IV : en haut de l'escalier au nord des dalles (après l'énigme), caché derrière la colonne brisée juste à droite, là où le guide de haute montagne dit « Juste derrière moi ! » ; ils se lisent dès que tu les ramasses et se rangent dans la bibliothèque de l'inventaire. Coffres de la première grotte : Canne en Acajou (+20 énergie max, recoin sud-est, par le tunnel), deux coffres de bières et de rhums, et le coffre piégé du tunnel. Trous à creuser (avec la pelle trouvée au chapitre 1) : Cache œil effrayant (+5 ATK) : bas du plateau ouest, non loin de l'entrée basse de la troisième grotte ; quelques écus : 10 au milieu du plateau ouest, 8 en haut du plateau ouest près du camp, 2 à l'est, en contrebas du plateau des dalles, 1 sur la plage au sud-ouest de la barque. Poils de Barbe dans les Yeux : débloqué pour de bon pendant le duel contre Itzel, automatiquement. Taverne : chaque visite restaure tes PV et ton énergie, gratuitement. Capitaines enrhumés : leur « Ordre d'attaque » fait viser Barbe-Yeux par tous les ennemis tant qu'ils sont debout. Abats-les en premier. Une roulade d'un des deux cons détourne ces attaques : pendant 3 tours, les ennemis visent ce con à la place de Barbe-Yeux. Marchand de torches : juste à côté de la taverne (succès Un homme éclairé). Rien n'est perdu définitivement : l'île au Vent reste accessible après le chapitre. Succès du chapitre : Coup de chaud (finir le chapitre 2).", "sol": 0}]}]}], "en": [{"id": "c2", "num": "Chapter 2", "titre": "Contrary Winds", "intro": "<p>Arrested by the maritime brigade, Barbe-Yeux wakes up in prison with a very strange old convict for a neighbour. One escape later, he teams up (by force) with Itzel the Mute and sets course for Windward Island, where a monster nesting at the top of the cliffs is stinking out the whole village.</p>", "sections": [{"titre": "Main quest", "intro": "", "entrees": [{"titre": "Prison: escape from the cell (no objective shown)", "html": "<ol><li>The chapter starts in your cell, in the top right of the prison. After a second, the old convict starts talking to you on his own.</li><li>He gives you the <strong>Holey parchment</strong>, then a <strong>fishbone</strong>. Everything else is automatic: Barbe-Yeux reads the parchment (close the window to continue), picks the lock with the fishbone and the cell doors open.</li><li>Now you have to cross the prison without being seen (see the box below).</li></ol><p><strong>How the guards work</strong> (ten guards patrol the big hall):</p><ul><li>Each guard sees in a cone in front of him. If you stay in that cone for about 1.5 seconds, he catches you. Walls block their view.</li><li>If you pass very close to a guard (from the front or the side), he catches you at once. Only his back is a blind spot.</li><li>In your cell, you are safe.</li><li><strong>Don't light your torch</strong>: guards who see the light leave their patrol and come towards you.</li><li>If you get caught, the brigadier takes you back to your cell after a little lecture. No other penalty: try again.</li></ul>", "id": "c2-prison-s-evader-de-la-cellule-pas-d-objectif-affiche", "texte": "Chapter 2 Contrary Winds Main quest Prison: escape from the cell (no objective shown) The chapter starts in your cell, in the top right of the prison. After a second, the old convict starts talking to you on his own. He gives you the Holey parchment , then a fishbone . Everything else is automatic: Barbe-Yeux reads the parchment (close the window to continue), picks the lock with the fishbone and the cell doors open. Now you have to cross the prison without being seen (see the box below). How the guards work (ten guards patrol the big hall): Each guard sees in a cone in front of him. If you stay in that cone for about 1.5 seconds, he catches you. Walls block their view. If you pass very close to a guard (from the front or the side), he catches you at once. Only his back is a blind spot. In your cell, you are safe. Don't light your torch : guards who see the light leave their patrol and come towards you. If you get caught, the brigadier takes you back to your cell after a little lecture. No other penalty: try again.", "sol": 0}, {"titre": "Prison: find the key and get out", "html": "<ol><li>Go down to the small guard room, on the left in the middle of the map (you enter it from below). A bunch of keys hangs on the key board.</li><li>Walk up to the board and choose <strong>Search</strong>: you get the <strong>Skeleton key</strong>.</li><li>Go to the staircase in the bottom right. Without the key, the game tells you “You need a key to get out of here.”</li><li><strong>Patrol room</strong>: five guards walk around in there, with the same sight rules. You come in on the west, the exit is on the east. Move when they have their backs to you. If you get caught here, you start again from your cell, but you keep the key.</li><li>As you go through the door, the key is used up and the gate closes behind you (“no turning back now”). About ten guards come in from the east and walk towards you. <strong>Don't move, stay at the entrance</strong>: at this distance, they can't see you. After their dialogue (“IT'S HER!!!”), they run back off to the east. You can then cross the room and take the exit on the east.</li><li>Last room: guards are lying on the floor. Walk east to trigger the meeting with the stranger.</li></ol>", "id": "c2-prison-trouver-la-cle-et-sortir", "texte": "Chapter 2 Contrary Winds Main quest Prison: find the key and get out Go down to the small guard room, on the left in the middle of the map (you enter it from below). A bunch of keys hangs on the key board. Walk up to the board and choose Search : you get the Skeleton key . Go to the staircase in the bottom right. Without the key, the game tells you “You need a key to get out of here.” Patrol room : five guards walk around in there, with the same sight rules. You come in on the west, the exit is on the east. Move when they have their backs to you. If you get caught here, you start again from your cell, but you keep the key. As you go through the door, the key is used up and the gate closes behind you (“no turning back now”). About ten guards come in from the east and walk towards you. Don't move, stay at the entrance : at this distance, they can't see you. After their dialogue (“IT'S HER!!!”), they run back off to the east. You can then cross the room and take the exit on the east. Last room: guards are lying on the floor. Walk east to trigger the meeting with the stranger.", "sol": 0}, {"titre": "Scripted fight: the Stranger (Itzel)", "html": "<ul><li>You fight alongside Captain Dubreuil and Chief Petty Officer Bichon. The Stranger only targets the two guards.</li><li>She can't be knocked out. When she gets close to zero, she goes back up to 500 HP (“Not like that…”).</li><li>The fight stops when both guards are down. Play your turns normally; the outcome is fixed.</li><li>Afterwards, the Stranger introduces herself: Itzel, known as the Mute. You go and fetch the Two Numpties.</li></ul>", "id": "c2-combat-scenarise-l-inconnue-itzel", "texte": "Chapter 2 Contrary Winds Main quest Scripted fight: the Stranger (Itzel) You fight alongside Captain Dubreuil and Chief Petty Officer Bichon. The Stranger only targets the two guards. She can't be knocked out. When she gets close to zero, she goes back up to 500 HP (“Not like that…”). The fight stops when both guards are down. Play your turns normally; the outcome is fixed. Afterwards, the Stranger introduces herself: Itzel, known as the Mute. You go and fetch the Two Numpties.", "sol": 0}, {"titre": "The reunion and the duel against Itzel", "html": "<ol><li>Automatic scenes on Itzel's ship: the Two Numpties rejoin the crew (with a nice sunburn). Barbe-Yeux “treats” the holey parchment with the sacred ambrosia the old convict mentioned… The hidden letters reveal <strong>WINDWARD ISLAND</strong>.</li><li>Automatic crossing to Windward Island, then Itzel, at the end of her tether, challenges you to a duel.</li><li><strong>Duel against Itzel the Mute</strong> (scripted fight, impossible to truly win or lose):<ul><li>Before the unlock described below, Barbe-Yeux can't be knocked out: he stays standing at 1-3 HP “out of sheer bad faith”.</li><li>As soon as Barbe-Yeux drops below 40% of his HP, he permanently unlocks his signature move, <strong>Beard Hairs in the Eyes</strong>. For that turn, it's the only possible action: use it.</li><li>The move costs no energy but 30% of Barbe-Yeux's remaining HP. The Two Numpties each strike 5 to 7 times. Both Numpties must be standing. Half of the time, Barbe-Yeux also taunts the enemies for 3 turns: they target him.</li><li>When Itzel drops to 30% of her HP (or if she was about to finish you off), she answers with her own signature move, six shots, and the fight ends.</li></ul></li><li>You land on Windward Island with 1 HP. <strong>Tip</strong>: entering the village tavern restores your HP and energy for free.</li></ol>", "id": "c2-les-retrouvailles-et-le-duel-contre-itzel", "texte": "Chapter 2 Contrary Winds Main quest The reunion and the duel against Itzel Automatic scenes on Itzel's ship: the Two Numpties rejoin the crew (with a nice sunburn). Barbe-Yeux “treats” the holey parchment with the sacred ambrosia the old convict mentioned… The hidden letters reveal WINDWARD ISLAND . Automatic crossing to Windward Island, then Itzel, at the end of her tether, challenges you to a duel. Duel against Itzel the Mute (scripted fight, impossible to truly win or lose): Before the unlock described below, Barbe-Yeux can't be knocked out: he stays standing at 1-3 HP “out of sheer bad faith”. As soon as Barbe-Yeux drops below 40% of his HP, he permanently unlocks his signature move, Beard Hairs in the Eyes . For that turn, it's the only possible action: use it. The move costs no energy but 30% of Barbe-Yeux's remaining HP. The Two Numpties each strike 5 to 7 times. Both Numpties must be standing. Half of the time, Barbe-Yeux also taunts the enemies for 3 turns: they target him. When Itzel drops to 30% of her HP (or if she was about to finish you off), she answers with her own signature move, six shots, and the fight ends. You land on Windward Island with 1 HP. Tip : entering the village tavern restores your HP and energy for free.", "sol": 0}, {"titre": "Find useful information.", "html": "<p><em>(sub-objective: Question the villagers)</em></p><ol><li>Go and see the <strong>mayor</strong>, in his house in the centre of the village. He tells you about the monster perched on the highest cliff, the brigands in the caves and the old slab system that blocks the way to the summit.</li><li>The main quest <strong>Hunt the cliff monster</strong> starts automatically.</li><li><strong>Watch out:</strong> you can't leave the island right away. At the boat, the Two Numpties “are in no condition to sail” because of their sunburn. You need some <strong>Coulirou grease</strong> (see the fisherman's quests: he sells it for 20 coins from your very first conversation).</li></ol>", "id": "c2-trouver-des-informations-utiles", "texte": "Chapter 2 Contrary Winds Main quest Find useful information. (sub-objective: Question the villagers) Go and see the mayor , in his house in the centre of the village. He tells you about the monster perched on the highest cliff, the brigands in the caves and the old slab system that blocks the way to the summit. The main quest Hunt the cliff monster starts automatically. Watch out: you can't leave the island right away. At the boat, the Two Numpties “are in no condition to sail” because of their sunburn. You need some Coulirou grease (see the fisherman's quests: he sells it for 20 coins from your very first conversation).", "sol": 0}, {"titre": "Reach the summit and defeat the monster.", "html": "<p><em>(sub-objective: Cross the caves and the ancient slab mechanism)</em></p><p><strong>The way to the slabs:</strong></p><ol><li>Climb the ladder next to the tavern (west of the village) and cross the fields to the west. The cave entrance opens in the cliff, north of the fields. In the fields, just below the entrance, a <strong>cave guide</strong> comes up to you and leads you there. Let him guide you: Barbe-Yeux follows him on his own. He doesn't go inside with you, and you only meet him once.</li><li><strong>Cliff cave</strong>: four rooms guarded by brigands (fixed fights, once each). Inside you'll find:<ul><li>the <strong>Fisherman's clamp</strong>, in the top-left room;</li><li>a chest (15 coins, 2 beers, 2 rums), in the same room;</li><li>a chest (5 beers, 3 rums), top centre, near the stairs to the second cave.</li><li>The entrance to the <strong>tunnel</strong> is in the top-right room. You arrive at the top of the tunnel's central corridor. In there you'll find the <strong>Grey salt</strong> (top-left room) and a <strong>booby-trapped chest</strong> (big room in the bottom left; it's a monster, the Booby-trapped chest: beat it for 15 coins and 2 beers). <strong>Ship's log III</strong> lies on a skeleton, in the middle of the empty room in the top right (you get up there by the stairs at the bottom of that room). The tunnel's lower exit drops you in a nook in the south-east of the cave, with a special chest: the <strong>Mahogany cane</strong> (+20 max energy) and 10 coins.</li></ul></li><li>Take the stairs at the top centre: <strong>second cave</strong>. The <strong>Barrel of olive oil</strong> is in the left room. Cross the rooms (three groups of brigands) to the exit in the bottom right. It comes out in the north-east of the island.</li><li><strong>North-east of the island</strong>: a camp of bandit fishermen (fixed fight against three Fishermen and a Fisherwoman). The <strong>Weighted net</strong> is in this camp. The <strong>Sweet seaweed</strong> is just south of the camp, and some <strong>Soft seaweed</strong> at the water's edge in the far north-east.</li><li>Head west along the top of the island. You reach the big western plateau (bandit camp, random encounters; in adventure mode, fleeing always works).</li><li><strong>Cliffs parchment (essential)</strong>: in the north of the western plateau, near the camp, there's a hole in the ground. Jump in: you fall into a closed room of the second cave (the middle room, with no door: this hole is the only way in). The <strong>Cliffs parchment</strong> is waiting for you there. Another hole in the same room (bottom-right corner) takes you back to the first cave.</li><li>Go down the western plateau to the lower entrance of the <strong>third cave</strong>, south of the plateau. Cross it: the exit (top right) leads onto the slab plateau. Itzel is waiting for you there.</li></ol><p><strong>The slab puzzle</strong> <em>(sub-objective: Solve the ancient slab mechanism)</em></p><p>Nine slabs form a 3 × 3 grid:</p><div class=\"tab\"><table><thead><tr><th>R</th><th>T</th><th>H</th></tr></thead><tbody><tr><td>O</td><td>A</td><td>F</td></tr><tr><td>E</td><td>J</td><td>N</td></tr></tbody></table></div><p>You have to step on four slabs in the right order. Talk to Itzel: without the Cliffs parchment, she tells you something is missing.</p><p>The logic: open the <strong>Cliffs parchment</strong> from the inventory, then click <strong>Use the holey parchment</strong>. The holey parchment is laid on top and you can drag it. Its four holes are linked by a dotted line that ends in an arrow. Drag it to the left (about a fifth of its width) and a little down (about an eighth of its height), until the big hole at the end of the arrow frames the <strong>R</strong> on the left edge (the one below the B). The holes then show, in the order of the dotted line, <strong>H</strong> (the small starting hole), <strong>J</strong> (the big bottom hole), <strong>F</strong> (the right-hand hole), then <strong>R</strong>. The quest journal hint confirms it: “The last letter seems to be an R…”</p><p><strong>Solution: step on H (top right), then J (bottom middle), then F (middle right), then R (top left).</strong></p><ul><li>Don't step on any other slab in between: walk between the slabs.</li><li>After four slabs, the game shows “Victory!” or “Defeat!”. After a defeat, the sequence starts again from zero.</li><li>Don't dawdle: more than 10 seconds between two slabs and the attempt restarts from the slab you've just stepped on.</li><li>If you succeed, two passages open: the stairs going up to the summit (north of the slabs) and the ladder that goes straight back down to the village (shortcut). The two parchments, now useless, leave your inventory.</li></ul><p><strong>Preparing for the fight</strong> The journal recommends: level 18, fish fillets, 10 beers, 10 rums and 3 Coulirou grease (they heal burns).</p><p>Climb the stairs north of the slabs. At the top, on the ruins plateau, a <strong>high mountain guide</strong> is waiting for you. He points you to “the best spot” around: “Right behind me!”, then steps aside. He's telling the truth: <strong>Ship's log IV</strong> is hidden behind the broken column, just right of the top of the stairs. Then climb the stairs to the summit platform, to the east. Setting foot on it starts the fight.</p>", "id": "c2-atteindre-le-sommet-et-vaincre-le-monstre", "texte": "Chapter 2 Contrary Winds Main quest Reach the summit and defeat the monster. (sub-objective: Cross the caves and the ancient slab mechanism) The way to the slabs: Climb the ladder next to the tavern (west of the village) and cross the fields to the west. The cave entrance opens in the cliff, north of the fields. In the fields, just below the entrance, a cave guide comes up to you and leads you there. Let him guide you: Barbe-Yeux follows him on his own. He doesn't go inside with you, and you only meet him once. Cliff cave : four rooms guarded by brigands (fixed fights, once each). Inside you'll find: the Fisherman's clamp , in the top-left room; a chest (15 coins, 2 beers, 2 rums), in the same room; a chest (5 beers, 3 rums), top centre, near the stairs to the second cave. The entrance to the tunnel is in the top-right room. You arrive at the top of the tunnel's central corridor. In there you'll find the Grey salt (top-left room) and a booby-trapped chest (big room in the bottom left; it's a monster, the Booby-trapped chest: beat it for 15 coins and 2 beers). Ship's log III lies on a skeleton, in the middle of the empty room in the top right (you get up there by the stairs at the bottom of that room). The tunnel's lower exit drops you in a nook in the south-east of the cave, with a special chest: the Mahogany cane (+20 max energy) and 10 coins. Take the stairs at the top centre: second cave . The Barrel of olive oil is in the left room. Cross the rooms (three groups of brigands) to the exit in the bottom right. It comes out in the north-east of the island. North-east of the island : a camp of bandit fishermen (fixed fight against three Fishermen and a Fisherwoman). The Weighted net is in this camp. The Sweet seaweed is just south of the camp, and some Soft seaweed at the water's edge in the far north-east. Head west along the top of the island. You reach the big western plateau (bandit camp, random encounters; in adventure mode, fleeing always works). Cliffs parchment (essential) : in the north of the western plateau, near the camp, there's a hole in the ground. Jump in: you fall into a closed room of the second cave (the middle room, with no door: this hole is the only way in). The Cliffs parchment is waiting for you there. Another hole in the same room (bottom-right corner) takes you back to the first cave. Go down the western plateau to the lower entrance of the third cave , south of the plateau. Cross it: the exit (top right) leads onto the slab plateau. Itzel is waiting for you there. The slab puzzle (sub-objective: Solve the ancient slab mechanism) Nine slabs form a 3 × 3 grid: R T H O A F E J N You have to step on four slabs in the right order. Talk to Itzel: without the Cliffs parchment, she tells you something is missing. The logic: open the Cliffs parchment from the inventory, then click Use the holey parchment . The holey parchment is laid on top and you can drag it. Its four holes are linked by a dotted line that ends in an arrow. Drag it to the left (about a fifth of its width) and a little down (about an eighth of its height), until the big hole at the end of the arrow frames the R on the left edge (the one below the B). The holes then show, in the order of the dotted line, H (the small starting hole), J (the big bottom hole), F (the right-hand hole), then R . The quest journal hint confirms it: “The last letter seems to be an R…” Solution: step on H (top right), then J (bottom middle), then F (middle right), then R (top left). Don't step on any other slab in between: walk between the slabs. After four slabs, the game shows “Victory!” or “Defeat!”. After a defeat, the sequence starts again from zero. Don't dawdle: more than 10 seconds between two slabs and the attempt restarts from the slab you've just stepped on. If you succeed, two passages open: the stairs going up to the summit (north of the slabs) and the ladder that goes straight back down to the village (shortcut). The two parchments, now useless, leave your inventory. Preparing for the fight The journal recommends: level 18, fish fillets, 10 beers, 10 rums and 3 Coulirou grease (they heal burns). Climb the stairs north of the slabs. At the top, on the ruins plateau, a high mountain guide is waiting for you. He points you to “the best spot” around: “Right behind me!”, then steps aside. He's telling the truth: Ship's log IV is hidden behind the broken column, just right of the top of the stairs. Then climb the stairs to the summit platform, to the east. Setting foot on it starts the fight.", "sol": 1}, {"titre": "Boss: Kab'raqan", "html": "<p>The health bar is continuous (12 000 HP in total), but the fight plays out in several stages. The damage figures below are for normal mode. In adventure mode, all damage you take is reduced by 20% (80 per fireball, 120 for the cone, 40 per burn turn).</p><p><strong>What he does:</strong></p><ul><li>On the first turn, then at every stage change, he summons minions, Kab'raqan's summonings (200 HP each). They make rocks burst up under Itzel (30 damage, then 50 from stage 2 on).</li><li>Then he spits a <strong>rain of fireballs</strong> on the whole team (100 damage each). Every third attack, he replaces the rain with a <strong>cone of fire</strong> on Itzel: 150 damage plus a burn of 50 HP per turn, which stacks if it happens again.</li><li>Itzel's <strong>Smoke grenade</strong> (5 per fight) makes him miss his attacks half of the time for 3 turns. It's your best defence. Keep some Coulirou grease for Itzel's burns.</li><li>If Barbe-Yeux has nothing useful to do (boss in the air, no ranged attack), have him <strong>skip his turn</strong>: he takes 25% less damage until his next turn and recovers 20% of his energy.</li></ul><p><strong>Stage 1 (4 000 HP):</strong> the Two Numpties run away right at the start. You play Barbe-Yeux and Itzel. As long as he's flying, only ranged attacks hit him: Gunshot, Devastating shot, Itzel's Smoke grenade, and Barbe-Yeux's Scissor throw if you have it. Your melee attacks can target the minions. Below 2 000 HP, he is <strong>forced to land</strong> and calls three more minions. You can then hit him in melee.</p><p><strong>Stage 2 (3 000 HP):</strong> everyone gets their energy back (not their HP). He takes off again in flames with three new minions. Switch back to ranged attacks.</p><p><strong>Stage 2, continued (3 000 HP):</strong> the Two Numpties come back with full HP. Kab'raqan lands and calls five minions. Time for <strong>Beard Hairs in the Eyes</strong> (both Numpties must be standing, and it doesn't work on a flying target).</p><p><strong>Stage 3 (2 000 HP):</strong> after a scene at the tavern, Itzel faces him <strong>alone</strong>, with three minions. Same attacks. If a fish fillet was still active on her at the end of the previous fight, it carries on here. Use grenades, healing items and grease.</p><p><strong>If you lose:</strong> in stages 1-2, you go back to the island and can try again. In stage 3, the fight restarts at once, and the items used during the failed attempt are given back to you.</p><p><strong>Reward:</strong> “Hunt the cliff monster” quest completed (25 000 XP), then <strong>30 000 XP</strong> for finishing the chapter and the <strong>Heatstroke</strong> achievement. The chapter ends on the conversation with Itzel, in the Windward Island tavern.</p>", "id": "c2-boss-kab-raqan", "texte": "Chapter 2 Contrary Winds Main quest Boss: Kab'raqan The health bar is continuous (12 000 HP in total), but the fight plays out in several stages. The damage figures below are for normal mode. In adventure mode, all damage you take is reduced by 20% (80 per fireball, 120 for the cone, 40 per burn turn). What he does: On the first turn, then at every stage change, he summons minions, Kab'raqan's summonings (200 HP each). They make rocks burst up under Itzel (30 damage, then 50 from stage 2 on). Then he spits a rain of fireballs on the whole team (100 damage each). Every third attack, he replaces the rain with a cone of fire on Itzel: 150 damage plus a burn of 50 HP per turn, which stacks if it happens again. Itzel's Smoke grenade (5 per fight) makes him miss his attacks half of the time for 3 turns. It's your best defence. Keep some Coulirou grease for Itzel's burns. If Barbe-Yeux has nothing useful to do (boss in the air, no ranged attack), have him skip his turn : he takes 25% less damage until his next turn and recovers 20% of his energy. Stage 1 (4 000 HP): the Two Numpties run away right at the start. You play Barbe-Yeux and Itzel. As long as he's flying, only ranged attacks hit him: Gunshot, Devastating shot, Itzel's Smoke grenade, and Barbe-Yeux's Scissor throw if you have it. Your melee attacks can target the minions. Below 2 000 HP, he is forced to land and calls three more minions. You can then hit him in melee. Stage 2 (3 000 HP): everyone gets their energy back (not their HP). He takes off again in flames with three new minions. Switch back to ranged attacks. Stage 2, continued (3 000 HP): the Two Numpties come back with full HP. Kab'raqan lands and calls five minions. Time for Beard Hairs in the Eyes (both Numpties must be standing, and it doesn't work on a flying target). Stage 3 (2 000 HP): after a scene at the tavern, Itzel faces him alone , with three minions. Same attacks. If a fish fillet was still active on her at the end of the previous fight, it carries on here. Use grenades, healing items and grease. If you lose: in stages 1-2, you go back to the island and can try again. In stage 3, the fight restarts at once, and the items used during the failed attempt are given back to you. Reward: “Hunt the cliff monster” quest completed (25 000 XP), then 30 000 XP for finishing the chapter and the Heatstroke achievement. The chapter ends on the conversation with Itzel, in the Windward Island tavern.", "sol": 0}, {"titre": "Join Itzel on her ship.", "html": "<p>Last step before chapter 3: her ship is moored south-east of the village. To leave, you must:</p><ul><li>have the Two Numpties with you (see “Don't miss”);</li><li>apply some <strong>Coulirou grease</strong> to them, if you haven't already done so at the boat. One application is enough for the rest of the game.</li></ul><p>Answer “Yes” to “Travel to Olive Island?”. You can also refuse and finish your side quests first.</p>", "id": "c2-rejoindre-itzel-sur-son-navire", "texte": "Chapter 2 Contrary Winds Main quest Join Itzel on her ship. Last step before chapter 3: her ship is moored south-east of the village. To leave, you must: have the Two Numpties with you (see “Don't miss”); apply some Coulirou grease to them, if you haven't already don
