ut ±33°. Endurance race (400 m) Press in rhythm (Space works too). Each press pushes the rhythm cursor up, and it drops back down on its own. Blue zone: cruising speed, no fatigue. To stay in it, you need about 2 presses per second. Red zone: faster, but drains the stamina bar. With the cursor at the very top, the bar empties in about 10 seconds. If it's empty, the Numpty slows down sharply until the finish and runs slower than in the blue zone. Below the blue (green zone), the bar slowly refills, but the Numpty moves much more slowly. Red gains you the same lead for the same amount of stamina, whether you're just above the blue or right at the top. What matters is that the bar is empty exactly on the finish line , never before. Method: At the start, hammer fast to reach the blue in 1 to 2 seconds: every second spent in the green costs a lot. Hold the blue until a little past halfway (about 23 seconds into the race). Then go right to the top of the red and stay there until the finish. Chances depending on the tendinitis (both 400 m races can now be won): “Ages 12-24”: a near-perfect race takes about 34.2 s, against 34.3 s for the best opponents. It comes down to a tenth of a second; “Ages 25-39”: about half a second of margin; “Ages 40-59”: about one second of margin; “Ages 60 and up”: staying in the blue all the way is just enough, provided you reach the blue very quickly at the start. Otherwise, keep a bit of red for the end. After the victory: the stadium entrance opens the events board directly. There you choose the difficulty (and a “total wipeout” mode with random opponents), then replay everything, a group or a single event. The records board keeps your best performances. From chapter 5 on, these events can also earn you olives (see “Philoxène's offer”).", "sol": 0}, {"titre": "Naval battle against Nadaillac", "html": "<p>You steer Itzel's ship, at the bottom of the screen, against Nadaillac's, at the top. Adventure mode changes nothing in this battle.</p><ul><li><strong>Hull:</strong> 40 points for you, 100 for Nadaillac.</li><li><strong>Movement:</strong> left and right.</li><li><strong>Skills:</strong><ol><li><strong>Cannon</strong>: 6 cannonballs fired straight ahead, 1 point of damage per cannonball that hits the hull, 3 s reload.</li><li><strong>Chain shot</strong>: press, then click one of the three trajectories (left, straight ahead, right). They target the sails: each hit does 1 damage and slows Nadaillac by 10% for 10 s (“SPD” gauge). 3 s reload.</li><li><strong>Speed</strong>: movement doubled for 10 s, 30 s reload.</li><li><strong>Repair</strong>: +20 hull points, 30 s reload.</li></ol></li></ul><p>Each hit you land cuts 1 second off the reload of speed and repair.</p><ul><li><strong>On a controller:</strong> D-pad or left stick to move. A = cannon, Y = chain shot, B = speed, X = repair. To aim the chains: X for left, A for straight ahead, Y for right, B to cancel. During the barrels, A shoots where the crosshair is.</li><li><strong>His shots:</strong> about every 3 s, when he's lined up with you, he fires 12 cannonballs (1 damage each). Move aside as soon as he gets in front of you.</li><li><strong>Tip:</strong> slow him down with the chains (key 2), then chain cannon volleys while he's slow.</li><li><strong>Scripted phases:</strong><ul><li>at 75: 3 lieutenants (10 points each) replace Nadaillac, chains unavailable; they leave after 60 s;</li><li>at 50: <strong>powder kegs</strong>. After a 3 s countdown, kegs fall for 10 s down 5 lanes. Your cannons are blocked: click the kegs to shoot them down with your pistol (30 bullets). A keg that hits your ship does 5 damage: shoot the ones in your lane first and dodge the others;</li><li>at 25: 5 faster lieutenants;</li><li>at 10: a last wave of kegs.</li></ul></li><li><strong>If you sink:</strong> the battle starts again. After 3 defeats, you can choose “Give up: take the boarding.”. The story goes on, but your whole party starts the fight against Nadaillac with half its HP.</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "Chapter 3 Olive Island Mini-games Naval battle against Nadaillac You steer Itzel's ship, at the bottom of the screen, against Nadaillac's, at the top. Adventure mode changes nothing in this battle. Hull: 40 points for you, 100 for Nadaillac. Movement: left and right. Skills: Cannon : 6 cannonballs fired straight ahead, 1 point of damage per cannonball that hits the hull, 3 s reload. Chain shot : press, then click one of the three trajectories (left, straight ahead, right). They target the sails: each hit does 1 damage and slows Nadaillac by 10% for 10 s (“SPD” gauge). 3 s reload. Speed : movement doubled for 10 s, 30 s reload. Repair : +20 hull points, 30 s reload. Each hit you land cuts 1 second off the reload of speed and repair. On a controller: D-pad or left stick to move. A = cannon, Y = chain shot, B = speed, X = repair. To aim the chains: X for left, A for straight ahead, Y for right, B to cancel. During the barrels, A shoots where the crosshair is. His shots: about every 3 s, when he's lined up with you, he fires 12 cannonballs (1 damage each). Move aside as soon as he gets in front of you. Tip: slow him down with the chains (key 2), then chain cannon volleys while he's slow. Scripted phases: at 75: 3 lieutenants (10 points each) replace Nadaillac, chains unavailable; they leave after 60 s; at 50: powder kegs . After a 3 s countdown, kegs fall for 10 s down 5 lanes. Your cannons are blocked: click the kegs to shoot them down with your pistol (30 bullets). A keg that hits your ship does 5 damage: shoot the ones in your lane first and dodge the others; at 25: 5 faster lieutenants; at 10: a last wave of kegs. If you sink: the battle starts again. After 3 defeats, you can choose “Give up: take the boarding.”. The story goes on, but your whole party starts the fight against Nadaillac with half its HP.", "sol": 0}]}, {"titre": "Don't miss", "intro": "", "entrees": [{"titre": "Don't miss", "html": "<ul><li><strong>Point of no return:</strong> after winning the Olympiads, your boat is blocked. Boarding Itzel's ship starts the end of the chapter, with no way back. Callisthène's and Léonidas's quests can still be done after chapter 4, when Olive Island becomes accessible again.</li><li><strong>Hidden compote reward:</strong> after recovering the crate, drop by the Apple Island shop again (5 Compotes, 1 Super compote, 10 000 XP).</li><li><strong>Keep 5 mackerel</strong> on you when you arrive on Olive Island: you'll be able to hand in Léonidas's quest right away.</li><li><strong>Key items of the chapter:</strong> 3rd Bolon Tiku gem (Olympiads), Cage key then Crate of compotes (Callisthène's quest), Family loincloth (Callisthène's reward).</li><li>No chests on Olive Island.</li><li><strong>Chapter achievements:</strong><ul><li><strong>“The castanets!”</strong>: finish chapter 3.</li><li><strong>“Panem et circenses”</strong>: score 32 points in a single Spwort competition. You have to win all 11 events (33 points), or 10 wins and one 2nd place. The score is only checked at the end of a complete competition (first run or “Start over” / “Redo everything”), not after replaying a single event or a group. The easiest way: set the tendinitis to “Ages 60 and up” and redo everything.</li><li>Callisthène's and Léonidas's quests count towards <strong>“Jack of all trades”</strong> (every side quest), as does “Philoxène's offer”, later on.</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "Chapter 3 Olive Island Don't miss Don't miss Point of no return: after winning the Olympiads, your boat is blocked. Boarding Itzel's ship starts the end of the chapter, with no way back. Callisthène's and Léonidas's quests can still be done after chapter 4, when Olive Island becomes accessible again. Hidden compote reward: after recovering the crate, drop by the Apple Island shop again (5 Compotes, 1 Super compote, 10 000 XP). Keep 5 mackerel on you when you arrive on Olive Island: you'll be able to hand in Léonidas's quest right away. Key items of the chapter: 3rd Bolon Tiku gem (Olympiads), Cage key then Crate of compotes (Callisthène's quest), Family loincloth (Callisthène's reward). No chests on Olive Island. Chapter achievements: “The castanets!” : finish chapter 3. “Panem et circenses” : score 32 points in a single Spwort competition. You have to win all 11 events (33 points), or 10 wins and one 2nd place. The score is only checked at the end of a complete competition (first run or “Start over” / “Redo everything”), not after replaying a single event or a group. The easiest way: set the tendinitis to “Ages 60 and up” and redo everything. Callisthène's and Léonidas's quests count towards “Jack of all trades” (every side quest), as does “Philoxène's offer”, later on.", "sol": 0}]}]}], "de": [{"id": "c3", "num": "Kapitel 3", "titre": "Die Oliveninsel", "intro": "<p>Das Klippenmonster ist besiegt: Itzel folgt einer neuen Spur bis zur Oliveninsel, einer Insel voller muskulöser und spärlich bekleideter Philosophen. Dort suchst du einen Edelstein der Bolon Tiku, den du bei der Kastagnetten-Olympiade gewinnen musst, mit der (sehr relativen) Hilfe eines der zwei Trottel. Die Rückkehr an Bord wird alles andere als ruhig.</p>", "sections": [{"titre": "Hauptquest", "intro": "", "entrees": [{"titre": "Itzel auf ihrem Schiff treffen.", "html": "<p>(Questtitel: „Windinsel“. Dieser Schritt verbindet mit dem Ende von Kapitel 2, das in dessen Lösungsweg ebenfalls beschrieben wird.)</p><ol><li>Geh auf der Windinsel zu Itzels Schiff, das im Südosten der Insel vor Anker liegt, östlich der Fischerin.</li><li>Zwei Bedingungen vor der Abfahrt:<ul><li>Die zwei Trottel müssen bei dir sein. Wenn du sie am Fuß von Grotte 3 zurückgelassen hast (die Leiter der Trottel), weist Itzel dich darauf hin: Hol sie ab;</li><li>sie haben einen Sonnenbrand. Du musst ihnen <strong>Coulirou-Fett</strong> auftragen (Auswahl „Coulirou-Fett auftragen“), sonst heißt es „Die zwei Trottel sind nicht reisefähig.“. Eine Anwendung am Boot zählt auch.</li></ul></li><li>Itzel fragt: „Zur Oliveninsel reisen?“ Antworte <strong>Ja</strong>. Die Reise startet von selbst, und die Titelkarte „Kapitel 3 — Die Oliveninsel“ erscheint.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "Kapitel 3 Die Oliveninsel Hauptquest Itzel auf ihrem Schiff treffen. (Questtitel: „Windinsel“. Dieser Schritt verbindet mit dem Ende von Kapitel 2, das in dessen Lösungsweg ebenfalls beschrieben wird.) Geh auf der Windinsel zu Itzels Schiff, das im Südosten der Insel vor Anker liegt, östlich der Fischerin. Zwei Bedingungen vor der Abfahrt: Die zwei Trottel müssen bei dir sein. Wenn du sie am Fuß von Grotte 3 zurückgelassen hast (die Leiter der Trottel), weist Itzel dich darauf hin: Hol sie ab; sie haben einen Sonnenbrand. Du musst ihnen Coulirou-Fett auftragen (Auswahl „Coulirou-Fett auftragen“), sonst heißt es „Die zwei Trottel sind nicht reisefähig.“. Eine Anwendung am Boot zählt auch. Itzel fragt: „Zur Oliveninsel reisen?“ Antworte Ja . Die Reise startet von selbst, und die Titelkarte „Kapitel 3 — Die Oliveninsel“ erscheint.", "sol": 0}, {"titre": "Mit Itzel zur Oliveninsel fahren", "html": "<ol><li>Bei der Ankunft bleibt Itzel an Bord, um ein verdächtiges Segel im Auge zu behalten. Du gehst allein mit den zwei Trotteln an Land, am Strand im Süden der Insel.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "Kapitel 3 Die Oliveninsel Hauptquest Mit Itzel zur Oliveninsel fahren Bei der Ankunft bleibt Itzel an Bord, um ein verdächtiges Segel im Auge zu behalten. Du gehst allein mit den zwei Trotteln an Land, am Strand im Süden der Insel.", "sol": 0}, {"titre": "Infos über einen möglichen Edelstein finden", "html": "<ol><li>Geh vom Strand aus nach Norden: Eine Szene startet von selbst. Ein nackter alter Mann läuft quer über den Bildschirm, hin und wieder zurück, mit einer Krabbe an einer empfindlichen Stelle. Seine Hilferufe erscheinen in einer Sprechblase, die am Bildschirmrand bleibt, wenn er aus dem Bild läuft.</li><li>Warte etwa 20 Sekunden (dreimal hin und zurück). Dann erscheint unten auf dem Bildschirm der Button <strong>Eingreifen</strong>: Klick darauf oder drück die Interaktionstaste.</li><li><strong>Boss: der Krabbenkönig</strong> (300 LP, schlägt hart zu, hat aber keine besondere Mechanik). Du kämpfst mit Barbe-Yeux und den zwei Trotteln. Sieg: 2.000 EP. Im Abenteuermodus erleidest du, wie in allen Kämpfen, 20 % weniger Schaden und verursachst 20 % mehr.</li><li>Der alte Mann stellt sich vor: Er ist <strong>Philoxenos Long-Rameau</strong>, eine Art Häuptling der Insel (er mag das Wort nicht). Er erwartet dich im Dorf.</li><li>Geh ins Dorf in der Inselmitte (rund um die große Statue des Trottels). Philoxenos steht ost-südöstlich der Statue. Sprich ihn an: Er erklärt dir, dass der Edelstein an den Sieger der Kastagnetten-Olympiade geht.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "Kapitel 3 Die Oliveninsel Hauptquest Infos über einen möglichen Edelstein finden Geh vom Strand aus nach Norden: Eine Szene startet von selbst. Ein nackter alter Mann läuft quer über den Bildschirm, hin und wieder zurück, mit einer Krabbe an einer empfindlichen Stelle. Seine Hilferufe erscheinen in einer Sprechblase, die am Bildschirmrand bleibt, wenn er aus dem Bild läuft. Warte etwa 20 Sekunden (dreimal hin und zurück). Dann erscheint unten auf dem Bildschirm der Button Eingreifen : Klick darauf oder drück die Interaktionstaste. Boss: der Krabbenkönig (300 LP, schlägt hart zu, hat aber keine besondere Mechanik). Du kämpfst mit Barbe-Yeux und den zwei Trotteln. Sieg: 2.000 EP. Im Abenteuermodus erleidest du, wie in allen Kämpfen, 20 % weniger Schaden und verursachst 20 % mehr. Der alte Mann stellt sich vor: Er ist Philoxenos Long-Rameau , eine Art Häuptling der Insel (er mag das Wort nicht). Er erwartet dich im Dorf. Geh ins Dorf in der Inselmitte (rund um die große Statue des Trottels). Philoxenos steht ost-südöstlich der Statue. Sprich ihn an: Er erklärt dir, dass der Edelstein an den Sieger der Kastagnetten-Olympiade geht.", "sol": 0}, {"titre": "Für die Olympiade anmelden", "html": "<ol><li>Geh zum Anmeldestand nordöstlich der Dorfstatue. Er bleibt geschlossen, solange du nicht mit Philoxenos gesprochen hast.</li><li>Barbe-Yeux meldet kurzerhand einen der zwei Trottel an. Der Trottel bekommt „Bahn Nummer 1“.</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "Kapitel 3 Die Oliveninsel Hauptquest Für die Olympiade anmelden Geh zum Anmeldestand nordöstlich der Dorfstatue. Er bleibt geschlossen, solange du nicht mit Philoxenos gesprochen hast. Barbe-Yeux meldet kurzerhand einen der zwei Trottel an. Der Trottel bekommt „Bahn Nummer 1“.", "sol": 0}, {"titre": "An der Olympiade teilnehmen (und gewinnen!)", "html": "<ol><li>Das Stadion liegt ganz im Norden der Insel. Vor der Anmeldung ist der Eingang versperrt („Sie können das Gelände noch nicht betreten.“, dann „Sie müssen sich zuerst anmelden.“).</li><li>Wähle am Eingang <strong>Ja</strong> bei „An der Olympiade teilnehmen?“. Mit „Noch nicht“ kannst du wieder gehen.</li><li>Die Eröffnungsrede des Ansagers läuft nur beim ersten Besuch. Danach folgen die 11 Disziplinen nacheinander (siehe <strong>Minispiele &gt; Kastagnetten-Olympiade</strong>).</li><li>Du musst <strong>in der Endwertung Erster</strong> werden, mit den meisten Punkten.</li><li>Bei einer Niederlage lässt dich der Wertungsbildschirm alles neu starten, die Schwierigkeit ändern („Sehnenentzündung ändern“) oder nur eine Gruppe von Disziplinen oder eine einzelne Disziplin wiederholen. Die übrigen Ergebnisse bleiben erhalten. Verlässt du die Olympiade mittendrin, beginnst du beim nächsten Besuch wieder von vorn.</li><li>Sieg: Philoxenos überreicht dir den <strong>3. Edelstein der Bolon Tiku</strong> und <strong>50.000 EP</strong>.</li></ol><aside class=\"note\"><p><strong>Achtung, der Punkt ohne Wiederkehr ist nah.</strong> Sobald du die Olympiade gewonnen hast, legt dein Boot nicht mehr ab („Von hier stech ich nicht in See…“). Der einzige Ausweg ist Itzels Schiff, das das Kapitelende auslöst. Erledige zuerst, was du auf der Insel noch abschließen willst (siehe Nebenquests).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "Kapitel 3 Die Oliveninsel Hauptquest An der Olympiade teilnehmen (und gewinnen!) Das Stadion liegt ganz im Norden der Insel. Vor der Anmeldung ist der Eingang versperrt („Sie können das Gelände noch nicht betreten.“, dann „Sie müssen sich zuerst anmelden.“). Wähle am Eingang Ja bei „An der Olympiade teilnehmen?“. Mit „Noch nicht“ kannst du wieder gehen. Die Eröffnungsrede des Ansagers läuft nur beim ersten Besuch. Danach folgen die 11 Disziplinen nacheinander (siehe Minispiele > Kastagnetten-Olympiade ). Du musst in der Endwertung Erster werden, mit den meisten Punkten. Bei einer Niederlage lässt dich der Wertungsbildschirm alles neu starten, die Schwierigkeit ändern („Sehnenentzündung ändern“) oder nur eine Gruppe von Disziplinen oder eine einzelne Disziplin wiederholen. Die übrigen Ergebnisse bleiben erhalten. Verlässt du die Olympiade mittendrin, beginnst du beim nächsten Besuch wieder von vorn. Sieg: Philoxenos überreicht dir den 3. Edelstein der Bolon Tiku und 50.000 EP . Achtung, der Punkt ohne Wiederkehr ist nah. Sobald du die Olympiade gewonnen hast, legt dein Boot nicht mehr ab („Von hier stech ich nicht in See…“). Der einzige Ausweg ist Itzels Schiff, das das Kapitelende auslöst. Erledige zuerst, was du auf der Insel noch abschließen willst (siehe Nebenquests).", "sol": 0}, {"titre": "Itzel auf ihrem Schiff treffen und in See stechen.", "html": "<ol><li>Geh zurück zum Ankunftsstrand im Süden. Itzels Schiff liegt direkt rechts von deinem Boot. Ohne den Edelstein weigert sich Itzel abzulegen („Wir haben den Edelstein der Olympiade noch nicht.“).</li><li>Ein Piratensegel taucht auf: Es ist <strong>Nadaillac Zwei-Rot</strong>, der eure Edelsteine will.</li><li><strong>Seeschlacht</strong> gegen sein Schiff (siehe <strong>Minispiele &gt; Seeschlacht gegen Nadaillac</strong>).</li><li><strong>Boss: Nadaillac Zwei-Rot</strong> (Entern). Du kämpfst mit Barbe-Yeux, den zwei Trotteln und Itzel.<ul><li>In der ersten Runde schießt er eine Kugel auf jedes Gruppenmitglied (Schaden ×1,5). Danach lädt er nach und schlägt mit dem Degen zu: 3 Runden lang, wenn ihr zu viert steht, 2 Runden, wenn ihr zu dritt seid, sonst nur 1 Runde. Halte alle am Leben, dann schießt er seltener, und heil dich vor jeder Salve.</li><li>Unter 2.250 LP ruft er 4 Verstärkungen: einen Kanonier, zwei Piraten von vernünftiger Größe und eine PiratE mit Pischtole, alle verstärkt.</li><li>Unter 1.500 LP wirft er eine Rauchgranate und schlägt 6-mal zufällig in deine Gruppe. Danach heilt er sich um 500 LP, erweckt 4 untote Piraten und setzt in seiner nächsten Runde aus.</li><li><strong>Tipp:</strong> Der Kampf endet, sobald Nadaillac auf 50 LP fällt. Seine Verstärkungen musst du nicht töten, konzentriere deine Angriffe auf ihn.</li><li>Im Abenteuermodus machen seine Treffer 20 % weniger Schaden und deine 20 % mehr. Die Schwellen von 2.250, 1.500 und 50 LP ändern sich nicht.</li><li>Bei einer Niederlage beginnt der Kampf sofort von vorn, mit vollen LP und voller Energie, ohne die Seeschlacht zu wiederholen.</li></ul></li><li>Eine Zwischensequenz beendet das Kapitel, dann erscheint die Titelkarte „Kapitel 4 — Verlorene Küste“. Erfolg <strong>„Die Kastagnetten!“</strong>.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "Kapitel 3 Die Oliveninsel Hauptquest Itzel auf ihrem Schiff treffen und in See stechen. Geh zurück zum Ankunftsstrand im Süden. Itzels Schiff liegt direkt rechts von deinem Boot. Ohne den Edelstein weigert sich Itzel abzulegen („Wir haben den Edelstein der Olympiade noch nicht.“). Ein Piratensegel taucht auf: Es ist Nadaillac Zwei-Rot , der eure Edelsteine will. Seeschlacht gegen sein Schiff (siehe Minispiele > Seeschlacht gegen Nadaillac ). Boss: Nadaillac Zwei-Rot (Entern). Du kämpfst mit Barbe-Yeux, den zwei Trotteln und Itzel. In der ersten Runde schießt er eine Kugel auf jedes Gruppenmitglied (Schaden ×1,5). Danach lädt er nach und schlägt mit dem Degen zu: 3 Runden lang, wenn ihr zu viert steht, 2 Runden, wenn ihr zu dritt seid, sonst nur 1 Runde. Halte alle am Leben, dann schießt er seltener, und heil dich vor jeder Salve. Unter 2.250 LP ruft er 4 Verstärkungen: einen Kanonier, zwei Piraten von vernünftiger Größe und eine PiratE mit Pischtole, alle verstärkt. Unter 1.500 LP wirft er eine Rauchgranate und schlägt 6-mal zufällig in deine Gruppe. Danach heilt er sich um 500 LP, erweckt 4 untote Piraten und setzt in seiner nächsten Runde aus. Tipp: Der Kampf endet, sobald Nadaillac auf 50 LP fällt. Seine Verstärkungen musst du nicht töten, konzentriere deine Angriffe auf ihn. Im Abenteuermodus machen seine Treffer 20 % weniger Schaden und deine 20 % mehr. Die Schwellen von 2.250, 1.500 und 50 LP ändern sich nicht. Bei einer Niederlage beginnt der Kampf sofort von vorn, mit vollen LP und voller Energie, ohne die Seeschlacht zu wiederholen. Eine Zwischensequenz beendet das Kapitel, dann erscheint die Titelkarte „Kapitel 4 — Verlorene Küste“. Erfolg „Die Kastagnetten!“ .", "sol": 0}]}, {"titre": "Nebenquests", "intro": "", "entrees": [{"titre": "Die Kompottbestellung (Kallisthenes der Vorspringende)", "html": "<p><em>Titel bei Abschluss: „Kallisthenes' Kompottbestellung wiederfinden.“</em></p><ol><li><strong>Auslösen:</strong> Sprich auf der Oliveninsel mit Kallisthenes dem Vorspringenden an der Nordostecke der Dorfstatue. Nimm an (<strong>Ja</strong>). Wenn du ablehnst, bietet er sie dir erneut an.</li><li><strong>Apfelinsel:</strong> Nimm wieder dein Boot (am Südstrand, Auswahl „An Bord gehen“) und fahr zur Apfelinsel. Im Kompottladen im Norden der Insel spricht Barbe-Yeux die Bestellung an: Das Handelsschiff ist Richtung Morro Blanco verschwunden. Die Insel Morro Blanco wird auf der Karte freigeschaltet.</li><li><strong>Morro Blanco:</strong> Geh vom Anleger (im Südwesten) aus die Westküste entlang nach Norden. Du findest einen Händler, der in einem Käfig eingesperrt ist.</li><li>Direkt nördlich des Käfigs löst ein Banditenlager einen Pflichtkampf gegen 5 Gegner aus: Kanonier, Pirat von vernünftiger Größe, PiratE mit Pischtole, Fischer und Fischerin. Sieg: <strong>Käfigschlüssel</strong>.</li><li>Geh mit dem Schlüssel zum Käfig zurück: Der Händler gibt dir die <strong>Kiste Kompott</strong>.</li><li><strong>Belohnung 1:</strong> Bring die Kiste zu Kallisthenes auf die Oliveninsel. Du bekommst <strong>40.000 EP</strong> und den <strong>Familien-Lendenschurz</strong> (Beinausrüstung, +10 VER für die zwei Trottel).</li><li><strong>Belohnung 2 (leicht zu vergessen):</strong> Schau danach noch einmal im Kompottladen der Apfelinsel vorbei. Der Verkäufer gibt dir <strong>5 Kompott</strong>, <strong>1 Superkompott</strong> (stellt 150 LP und 75 % Energie wieder her) und <strong>10.000 EP</strong>.</li></ol><aside class=\"note\"><p>Erledige sie in Kapitel 3 <strong>vor dem Sieg bei der Olympiade</strong>: Nach dem Sieg verlässt dein Boot die Insel nicht mehr. Andernfalls ist die Oliveninsel später im Abenteuer wieder erreichbar (nach Kapitel 4), und Kallisthenes wartet dort auf dich.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "Kapitel 3 Die Oliveninsel Nebenquests Die Kompottbestellung (Kallisthenes der Vorspringende) Titel bei Abschluss: „Kallisthenes' Kompottbestellung wiederfinden.“ Auslösen: Sprich auf der Oliveninsel mit Kallisthenes dem Vorspringenden an der Nordostecke der Dorfstatue. Nimm an ( Ja ). Wenn du ablehnst, bietet er sie dir erneut an. Apfelinsel: Nimm wieder dein Boot (am Südstrand, Auswahl „An Bord gehen“) und fahr zur Apfelinsel. Im Kompottladen im Norden der Insel spricht Barbe-Yeux die Bestellung an: Das Handelsschiff ist Richtung Morro Blanco verschwunden. Die Insel Morro Blanco wird auf der Karte freigeschaltet. Morro Blanco: Geh vom Anleger (im Südwesten) aus die Westküste entlang nach Norden. Du findest einen Händler, der in einem Käfig eingesperrt ist. Direkt nördlich des Käfigs löst ein Banditenlager einen Pflichtkampf gegen 5 Gegner aus: Kanonier, Pirat von vernünftiger Größe, PiratE mit Pischtole, Fischer und Fischerin. Sieg: Käfigschlüssel . Geh mit dem Schlüssel zum Käfig zurück: Der Händler gibt dir die Kiste Kompott . Belohnung 1: Bring die Kiste zu Kallisthenes auf die Oliveninsel. Du bekommst 40.000 EP und den Familien-Lendenschurz (Beinausrüstung, +10 VER für die zwei Trottel). Belohnung 2 (leicht zu vergessen): Schau danach noch einmal im Kompottladen der Apfelinsel vorbei. Der Verkäufer gibt dir 5 Kompott , 1 Superkompott (stellt 150 LP und 75 % Energie wieder her) und 10.000 EP . Erledige sie in Kapitel 3 vor dem Sieg bei der Olympiade : Nach dem Sieg verlässt dein Boot die Insel nicht mehr. Andernfalls ist die Oliveninsel später im Abenteuer wieder erreichbar (nach Kapitel 4), und Kallisthenes wartet dort auf dich.", "sol": 0}, {"titre": "Léonidas Makrelen bringen.", "html": "<p><em>Titel bei Abschluss: „5 Makrelen zu Leonidas bringen.“</em></p><ol><li><strong>Auslösen:</strong> Sprich mit Leonidas, östlich der Dorfstatue, Richtung Süden. Er will Fisch: Nimm an (<strong>Ja</strong>). Du kannst sie auch nach der Olympiade auslösen.</li><li><strong>Ziel:</strong> 5 <strong>Makrelen</strong>. Du angelst sie auf der Krabbeninsel (am Strand) und auf der Windinsel. Kombination der Makrele: <strong>← ← → →</strong>. Auf der Krabbeninsel ist jeder Fang mit etwa 1 zu 3 eine Makrele (auf der Windinsel seltener, dort beißt oft der Coulirou).</li><li>Verkauf deine Makrelen nicht an die Fischer der Krabbeninsel und der Windinsel, die sie dir abkaufen.</li><li>Komm mit 5 Makrelen zu Leonidas zurück: <strong>30.000 EP</strong>.</li></ol><aside class=\"note\"><p>Wie bei Kallisthenes: Nach dem Sieg bei der Olympiade kannst du die Insel in Kapitel 3 nicht mehr verlassen. Hast du schon 5 Makrelen dabei, kannst du sie dann abgeben. Sonst heb sie dir für deine Rückkehr auf die Oliveninsel nach Kapitel 4 auf.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "Kapitel 3 Die Oliveninsel Nebenquests Léonidas Makrelen bringen. Titel bei Abschluss: „5 Makrelen zu Leonidas bringen.“ Auslösen: Sprich mit Leonidas, östlich der Dorfstatue, Richtung Süden. Er will Fisch: Nimm an ( Ja ). Du kannst sie auch nach der Olympiade auslösen. Ziel: 5 Makrelen . Du angelst sie auf der Krabbeninsel (am Strand) und auf der Windinsel. Kombination der Makrele: ← ← → → . Auf der Krabbeninsel ist jeder Fang mit etwa 1 zu 3 eine Makrele (auf der Windinsel seltener, dort beißt oft der Coulirou). Verkauf deine Makrelen nicht an die Fischer der Krabbeninsel und der Windinsel, die sie dir abkaufen. Komm mit 5 Makrelen zu Leonidas zurück: 30.000 EP . Wie bei Kallisthenes: Nach dem Sieg bei der Olympiade kannst du die Insel in Kapitel 3 nicht mehr verlassen. Hast du schon 5 Makrelen dabei, kannst du sie dann abgeben. Sonst heb sie dir für deine Rückkehr auf die Oliveninsel nach Kapitel 4 auf.", "sol": 0}, {"titre": "Das Angebot von Philoxenos (ab Kapitel 5)", "html": "<p>Diese Quest spielt auf der Oliveninsel, öffnet sich aber erst nach dem Ende von Kapitel 4: Sie gehört in den Zeitraum von Kapitel 5. Hier das Wichtigste, da sie im Olympiastadion gespielt wird.</p><ol><li><strong>Auslösen:</strong> Frag in der Taverne der Krabbeninsel den Wirt nach Neuigkeiten. Er erzählt von einem Angebot von Philoxenos: Nimm an.</li><li>Geh zu Philoxenos auf der Oliveninsel. Er bietet an, jede im Stadion wiederholte Disziplin in <strong>Oliven</strong> zu bezahlen.</li><li>Wiederhole Disziplinen im Stadion: <strong>2 Oliven pro abgeschlossener Disziplin</strong>, +1 Olive bei einem Sieg oder neuen Rekord, aber nur bei der Sehnenentzündung „12-24 Jahre“ oder „25-39 Jahre“. Die erste Olivenübergabe schließt die Quest ab: <strong>75 % der EP deiner aktuellen Stufe</strong>.</li><li>Danach stellt jeder Wirt (Krabbeninsel, Affeninsel, Windinsel, Nassau) <strong>Ol'right</strong> her: 5 Oliven + 1 Rum oder 5 Oliven + 5 Taler. Im Kampf regeneriert Ol'right 4 Runden lang bei der ganzen Gruppe 25 % Energie pro Runde.</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "Kapitel 3 Die Oliveninsel Nebenquests Das Angebot von Philoxenos (ab Kapitel 5) Diese Quest spielt auf der Oliveninsel, öffnet sich aber erst nach dem Ende von Kapitel 4: Sie gehört in den Zeitraum von Kapitel 5. Hier das Wichtigste, da sie im Olympiastadion gespielt wird. Auslösen: Frag in der Taverne der Krabbeninsel den Wirt nach Neuigkeiten. Er erzählt von einem Angebot von Philoxenos: Nimm an. Geh zu Philoxenos auf der Oliveninsel. Er bietet an, jede im Stadion wiederholte Disziplin in Oliven zu bezahlen. Wiederhole Disziplinen im Stadion: 2 Oliven pro abgeschlossener Disziplin , +1 Olive bei einem Sieg oder neuen Rekord, aber nur bei der Sehnenentzündung „12-24 Jahre“ oder „25-39 Jahre“. Die erste Olivenübergabe schließt die Quest ab: 75 % der EP deiner aktuellen Stufe . Danach stellt jeder Wirt (Krabbeninsel, Affeninsel, Windinsel, Nassau) Ol'right her: 5 Oliven + 1 Rum oder 5 Oliven + 5 Taler. Im Kampf regeneriert Ol'right 4 Runden lang bei der ganzen Gruppe 25 % Energie pro Runde.", "sol": 0}, {"titre": "Figuren ohne Quest", "html": "<ul><li><strong>Eudoxie</strong> (östlich der Statue): Athletin der Olympiade, nur ein Dialog.</li><li><strong>Die Rekordtafel</strong> (nördlich des Dorfs, nahe dem Stadion): „Hier gibt es vorerst nichts…“ vor deinem Sieg. Danach zeigt sie die besten Zeiten und Würfe.</li><li><strong>Die Statue des Trottels</strong> in der Dorfmitte: Wenn du oder die Trottel hinter ihr vorbeigeht, verdeckt sie euch. Eine farbige Silhouette zeigt dir, wo du bist (Option „Silhouetten hinter der Kulisse“ unter Einstellungen &gt; Barrierefreiheit, standardmäßig an). Die Statue verändert sich im Lauf des Abenteuers. Wenn das Spiel abgeschlossen ist, ist sie vollendet und mit Lorbeer bekränzt.</li></ul>", "id": "c3-personnages-sans-quete", "texte": "Kapitel 3 Die Oliveninsel Nebenquests Figuren ohne Quest Eudoxie (östlich der Statue): Athletin der Olympiade, nur ein Dialog. Die Rekordtafel (nördlich des Dorfs, nahe dem Stadion): „Hier gibt es vorerst nichts…“ vor deinem Sieg. Danach zeigt sie die besten Zeiten und Würfe. Die Statue des Trottels in der Dorfmitte: Wenn du oder die Trottel hinter ihr vorbeigeht, verdeckt sie euch. Eine farbige Silhouette zeigt dir, wo du bist (Option „Silhouetten hinter der Kulisse“ unter Einstellungen > Barrierefreiheit, standardmäßig an). Die Statue verändert sich im Lauf des Abenteuers. Wenn das Spiel abgeschlossen ist, ist sie vollendet und mit Lorbeer bekränzt.", "sol": 0}]}, {"titre": "Minispiele", "intro": "", "entrees": [{"titre": "Kastagnetten-Olympiade (Spwort)", "html": "<p><strong>Das Prinzip.</strong> Du läufst nicht selbst: Der Trottel („Der Trottel“, Bahn 1) läuft. Seine Gegner sind Philoxenos, Eudoxie und Xenokrates. Es gibt 11 Disziplinen, immer in dieser Reihenfolge:</p><ul><li>3 Sprints;</li><li>3 Hürdenläufe;</li><li>3-mal Kanonenkugelstoßen;</li><li>2 Ausdauerläufe (400 m).</li></ul><p>In jeder Disziplin bekommt der 1. 3 Punkte, der 2. 2 Punkte, der 3. 1 Punkt und der Letzte 0. Die Endwertung richtet sich nach den Punkten. Bei Gleichstand gewinnt die kürzeste Gesamtzeit. Alle 6 Läufe zu gewinnen reicht nicht immer: Du musst auch beim Stoßen oder über 400 m ein paar Punkte holen.</p><p>Der Abenteuermodus ändert nichts an der Olympiade: Ihre einzige Schwierigkeitsstufe ist die „Sehnenentzündung“.</p><p><strong>Die Schwierigkeit („Sehnenentzündung“) ist das eigentliche Geheimnis.</strong> Beim ersten Mal sind die Gegner auf der härtesten Stufe, „12-24 Jahre“. Wenn du verlierst, wähle im Bildschirm der Endwertung <strong>„Sehnenentzündung ändern“</strong>:</p><ul><li>„25-39 Jahre“: Gegner etwas langsamer, gegnerische Würfe etwas schwächer;</li><li>„40-59 Jahre“: noch langsamer, schwächere Würfe;</li><li>„60 Jahre und +“: deutlich langsamer, gegnerische Würfe etwa halb so weit.</li></ul><p>Die Belohnung bleibt auf jeder Stufe gleich. Danach kannst du nur die verlorenen Disziplinen wiederholen: Die übrigen Ergebnisse bleiben erhalten.</p><p><strong>Sprints und Hürdenläufe</strong></p><ul><li>Hämmere ab dem Startsignal auf <strong>eine einzige Taste</strong> (nicht die Leertaste). Die zuerst gedrückte Taste ist für den ganzen Lauf festgelegt.</li><li>Du brauchst ein hohes Tempo: etwa <strong>7 Anschläge pro Sekunde</strong>, um bei „12-24 Jahre“ zu gewinnen, etwa 6,5 bei „25-39 Jahre“, 6 bei „40-59 Jahre“, 5,5 bei „60 Jahre und +“.</li><li>Am Controller zählen alle Front-, Schulter- und Triggertasten als eine einzige Taste: Wechsle mit zwei Fingern zwischen zwei Tasten ab. A zählt bei den Hürden nicht.</li><li><strong>Hürden:</strong> Die Leertaste lässt den Trottel nicht springen. Er rennt durch die Hürden, zerbricht sie und wird nicht langsamer, während seine Gegner bei jedem Sprung etwas Tempo verlieren. Die Leertaste lässt nur Barbe-Yeux brüllen: Konzentrier dich aufs Hämmern.</li></ul><p><strong>Kanonenkugelstoßen</strong></p><ol><li><strong>Kraft:</strong> Hämmere 2 Sekunden lang auf eine Taste. Die Leiste füllt sich um 1/16 pro Anschlag: 16 Anschläge ergeben die volle Kraft.</li><li><strong>Zielen:</strong> Der Zeiger schwingt über den Bogen, hin und zurück, 0,7 Sekunden pro Richtung. Drück die <strong>Leertaste, wenn er genau in der Mitte seines Wegs steht</strong> (60°). Bei ±2° bekommst du „Perfekt“. Je weiter du von der Mitte abweichst, desto kürzer der Wurf. Über 90° fliegt die Kugel nach hinten und zählt 0 m.</li><li>Spielraum zum Gewinnen bei voller Kraft:<ul><li>„12-24 Jahre“: etwa ±9° beim 1. Wurf, ±4 bis 5° beim 2. und 3. (beste gegnerische Würfe: 27,8 m, 30,4 m, 30,8 m);</li><li>„25-39 Jahre“: etwa ±10°;</li><li>„40-59 Jahre“: etwa ±16°;</li><li>„60 Jahre und +“: etwa ±33°.</li></ul></li></ol><p><strong>Ausdauerlauf (400 m)</strong></p><ul><li>Drück im Takt (die Leertaste geht auch). Jeder Anschlag hebt den Rhythmuszeiger, der von selbst wieder sinkt.</li><li><strong>Blaue</strong> Zone: Reisetempo, ohne Ermüdung. Um dort zu bleiben, brauchst du etwa 2 Anschläge pro Sekunde.</li><li><strong>Rote</strong> Zone: schneller, leert aber die Ausdauerleiste. Mit dem Zeiger ganz oben ist die Leiste in etwa 10 Sekunden leer. Ist sie leer, wird der Trottel bis zum Ziel deutlich langsamer und läuft langsamer als in der blauen Zone.</li><li>Unterhalb von Blau (grüne Zone) lädt sich die Leiste langsam auf, aber der Trottel kommt viel langsamer voran.</li><li>Rot bringt bei gleichem Ausdauerverbrauch den gleichen Vorsprung, egal ob du knapp über Blau oder ganz oben bist. Entscheidend ist, dass die Leiste <strong>genau auf der Ziellinie leer ist</strong>, nie vorher.</li><li><strong>Methode:</strong><ol><li>Hämmere am Start schnell, um in 1 bis 2 Sekunden Blau zu erreichen: Jede Sekunde in Grün kostet viel.</li><li>Halte Blau bis etwas über die Hälfte der Strecke (etwa 23 Sekunden Laufzeit).</li><li>Geh dann ganz nach oben ins Rot und bleib dort bis ins Ziel.</li></ol></li><li>Chancen je nach Sehnenentzündung (beide 400-m-Läufe sind jetzt gewinnbar):<ul><li>„12-24 Jahre“: Ein fast perfekter Lauf dauert etwa 34,2 s, gegen 34,3 s für die besten Gegner. Es entscheidet eine Zehntelsekunde;</li><li>„25-39 Jahre“: etwa eine halbe Sekunde Spielraum;</li><li>„40-59 Jahre“: etwa eine Sekunde Spielraum;</li><li>„60 Jahre und +“: Die ganze Zeit in Blau zu bleiben reicht knapp, sofern du Blau am Start sehr schnell erreichst. Sonst heb dir etwas Rot fürs Ende auf.</li></ul></li></ul><p><strong>Nach dem Sieg:</strong> Der Stadioneingang öffnet direkt die Tafel der Disziplinen. Dort wählst du die Schwierigkeit (und einen Modus „total wipeout“ mit zufälligen Gegnern) und spielst dann alles, eine Gruppe oder eine Disziplin erneut. Die Rekordtafel speichert deine besten Leistungen. Ab Kapitel 5 können diese Disziplinen auch Oliven einbringen (siehe „Das Angebot von Philoxenos“).</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "Kapitel 3 Die Oliveninsel Minispiele Kastagnetten-Olympiade (Spwort) Das Prinzip. Du läufst nicht selbst: Der Trottel („Der Trottel“, Bahn 1) läuft. Seine Gegner sind Philoxenos, Eudoxie und Xenokrates. Es gibt 11 Disziplinen, immer in dieser Reihenfolge: 3 Sprints; 3 Hürdenläufe; 3-mal Kanonenkugelstoßen; 2 Ausdauerläufe (400 m). In jeder Disziplin bekommt der 1. 3 Punkte, der 2. 2 Punkte, der 3. 1 Punkt und der Letzte 0. Die Endwertung richtet sich nach den Punkten. Bei Gleichstand gewinnt die kürzeste Gesamtzeit. Alle 6 Läufe zu gewinnen reicht nicht immer: Du musst auch beim Stoßen oder über 400 m ein paar Punkte holen. Der Abenteuermodus ändert nichts an der Olympiade: Ihre einzige Schwierigkeitsstufe ist die „Sehnenentzündung“. Die Schwierigkeit („Sehnenentzündung“) ist das eigentliche Geheimnis. Beim ersten Mal sind die Gegner auf der härtesten Stufe, „12-24 Jahre“. Wenn du verlierst, wähle im Bildschirm der Endwertung „Sehnenentzündung ändern“ : „25-39 Jahre“: Gegner etwas langsamer, gegnerische Würfe etwas schwächer; „40-59 Jahre“: noch langsamer, schwächere Würfe; „60 Jahre und +“: deutlich langsamer, gegnerische Würfe etwa halb so weit. Die Belohnung bleibt auf jeder Stufe gleich. Danach kannst du nur die verlorenen Disziplinen wiederholen: Die übrigen Ergebnisse bleiben erhalten. Sprints und Hürdenläufe Hämmere ab dem Startsignal auf eine einzige Taste (nicht die Leertaste). Die zuerst gedrückte Taste ist für den ganzen Lauf festgelegt. Du brauchst ein hohes Tempo: etwa 7 Anschläge pro Sekunde , um bei „12-24 Jahre“ zu gewinnen, etwa 6,5 bei „25-39 Jahre“, 6 bei „40-59 Jahre“, 5,5 bei „60 Jahre und +“. Am Controller zählen alle Front-, Schulter- und Triggertasten als eine einzige Taste: Wechsle mit zwei Fingern zwischen zwei Tasten ab. A zählt bei den Hürden nicht. Hürden: Die Leertaste lässt den Trottel nicht springen. Er rennt durch die Hürden, zerbricht sie und wird nicht langsamer, während seine Gegner bei jedem Sprung etwas Tempo verlieren. Die Leertaste lässt nur Barbe-Yeux brüllen: Konzentrier dich aufs Hämmern. Kanonenkugelstoßen Kraft: Hämmere 2 Sekunden lang auf eine Taste. Die Leiste füllt sich um 1/16 pro Anschlag: 16 Anschläge ergeben die volle Kraft. Zielen: Der Zeiger schwingt über den Bogen, hin und zurück, 0,7 Sekunden pro Richtung. Drück die Leertaste, wenn er genau in der Mitte seines Wegs steht (60°). Bei ±2° bekommst du „Perfekt“. Je weiter du von der Mitte abweichst, desto kürzer der Wurf. Über 90° fliegt die Kugel nach hinten und zählt 0 m. Spielraum zum Gewinnen bei voller Kraft: „12-24 Jahre“: etwa ±9° beim 1. Wurf, ±4 bis 5° beim 2. und 3. (beste gegnerische Würfe: 27,8 m, 30,4 m, 30,8 m); „25-39 Jahre“: etwa ±10°; „40-59 Jahre“: etwa ±16°; „60 Jahre und +“: etwa ±33°. Ausdauerlauf (400 m) Drück im Takt (die Leertaste geht auch). Jeder Anschlag hebt den Rhythmuszeiger, der von selbst wieder sinkt. Blaue Zone: Reisetempo, ohne Ermüdung. Um dort zu bleiben, brauchst du etwa 2 Anschläge pro Sekunde. Rote Zone: schneller, leert aber die Ausdauerleiste. Mit dem Zeiger ganz oben ist die Leiste in etwa 10 Sekunden leer. Ist sie leer, wird der Trottel bis zum Ziel deutlich langsamer und läuft langsamer als in der blauen Zone. Unterhalb von Blau (grüne Zone) lädt sich die Leiste langsam auf, aber der Trottel kommt viel langsamer voran. Rot bringt bei gleichem Ausdauerverbrauch den gleichen Vorsprung, egal ob du knapp über Blau oder ganz oben bist. Entscheidend ist, dass die Leiste genau auf der Ziellinie leer ist , nie vorher. Methode: Hämmere am Start schnell, um in 1 bis 2 Sekunden Blau zu erreichen: Jede Sekunde in Grün kostet viel. Halte Blau bis etwas über die Hälfte der Strecke (etwa 23 Sekunden Laufzeit). Geh dann ganz nach oben ins Rot und bleib dort bis ins Ziel. Chancen je nach Sehnenentzündung (beide 400-m-Läufe sind jetzt gewinnbar): „12-24 Jahre“: Ein fast perfekter Lauf dauert etwa 34,2 s, gegen 34,3 s für die besten Gegner. Es entscheidet eine Zehntelsekunde; „25-39 Jahre“: etwa eine halbe Sekunde Spielraum; „40-59 Jahre“: etwa eine Sekunde Spielraum; „60 Jahre und +“: Die ganze Zeit in Blau zu bleiben reicht knapp, sofern du Blau am Start sehr schnell erreichst. Sonst heb dir etwas Rot fürs Ende auf. Nach dem Sieg: Der Stadioneingang öffnet direkt die Tafel der Disziplinen. Dort wählst du die Schwierigkeit (und einen Modus „total wipeout“ mit zufälligen Gegnern) und spielst dann alles, eine Gruppe oder eine Disziplin erneut. Die Rekordtafel speichert deine besten Leistungen. Ab Kapitel 5 können diese Disziplinen auch Oliven einbringen (siehe „Das Angebot von Philoxenos“).", "sol": 0}, {"titre": "Seeschlacht gegen Nadaillac", "html": "<p>Du steuerst Itzels Schiff unten auf dem Bildschirm gegen das von Nadaillac oben. Der Abenteuermodus ändert nichts an dieser Schlacht.</p><ul><li><strong>Rumpf:</strong> 40 Punkte für dich, 100 für Nadaillac.</li><li><strong>Bewegung:</strong> links und rechts.</li><li><strong>Fertigkeiten:</strong><ol><li><strong>Kanone</strong>: 6 Kugeln geradeaus, 1 Schadenspunkt pro Kugel, die den Rumpf trifft, Abklingzeit 3 s.</li><li><strong>Kettenkugeln</strong>: Drücken, dann auf eine der drei Flugbahnen klicken (links, geradeaus, rechts). Sie zielen auf die Segel: Jeder Treffer macht 1 Schaden und verlangsamt Nadaillac 10 s lang um 10 % (Leiste „TEMPO“). Abklingzeit 3 s.</li><li><strong>Tempo</strong>: 10 s lang doppelte Bewegung, Abklingzeit 30 s.</li><li><strong>Reparatur</strong>: +20 Rumpfpunkte, Abklingzeit 30 s.</li></ol></li></ul><p>Jeder Treffer, den du landest, verkürzt die Abklingzeit von Tempo und Reparatur um 1 Sekunde.</p><ul><li><strong>Am Controller:</strong> Steuerkreuz oder linker Stick zum Bewegen. A = Kanone, Y = Kettenkugeln, B = Tempo, X = Reparatur. Zum Zielen mit den Ketten: X links, A geradeaus, Y rechts, B zum Abbrechen. Während der Fässer schießt A dorthin, wo das Fadenkreuz steht.</li><li><strong>Seine Schüsse:</strong> Etwa alle 3 s, wenn er auf deiner Linie ist, feuert er 12 Kugeln (je 1 Schaden). Weich aus, sobald er sich gegenüber positioniert.</li><li><strong>Tipp:</strong> Verlangsame ihn mit den Ketten (Taste 2) und feuere dann Kanonensalven ab, solange er langsam ist.</li><li><strong>Geskriptete Phasen:</strong><ul><li>bei 75: 3 Leutnants (je 10 Punkte) ersetzen Nadaillac, Ketten nicht verfügbar; nach 60 s ziehen sie wieder ab;</li><li>bei 50: <strong>Pulverfässer</strong>. Nach einem Countdown von 3 s fallen 10 s lang Fässer auf 5 Bahnen. Deine Kanonen sind blockiert: Klick auf die Fässer, um sie mit der Pistole abzuschießen (30 Kugeln). Ein Fass, das dein Schiff trifft, macht 5 Schaden: Schieß zuerst die auf deiner Bahn ab und weich den anderen aus;</li><li>bei 25: 5 schnellere Leutnants;</li><li>bei 10: letzte Fässersalve.</li></ul></li><li><strong>Wenn du sinkst:</strong> Die Schlacht beginnt von vorn. Nach 3 Niederlagen kannst du „Aufgeben: das Entern über sich ergehen lassen.“ wählen. Die Geschichte geht weiter, aber deine ganze Gruppe beginnt den Kampf gegen Nadaillac mit der Hälfte ihrer LP.</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "Kapitel 3 Die Oliveninsel Minispiele Seeschlacht gegen Nadaillac Du steuerst Itzels Schiff unten auf dem Bildschirm gegen das von Nadaillac oben. Der Abenteuermodus ändert nichts an dieser Schlacht. Rumpf: 40 Punkte für dich, 100 für Nadaillac. Bewegung: links und rechts. Fertigkeiten: Kanone : 6 Kugeln geradeaus, 1 Schadenspunkt pro Kugel, die den Rumpf trifft, Abklingzeit 3 s. Kettenkugeln : Drücken, dann auf eine der drei Flugbahnen klicken (links, geradeaus, rechts). Sie zielen auf die Segel: Jeder Treffer macht 1 Schaden und verlangsamt Nadaillac 10 s lang um 10 % (Leiste „TEMPO“). Abklingzeit 3 s. Tempo : 10 s lang doppelte Bewegung, Abklingzeit 30 s. Reparatur : +20 Rumpfpunkte, Abklingzeit 30 s. Jeder Treffer, den du landest, verkürzt die Abklingzeit von Tempo und Reparatur um 1 Sekunde. Am Controller: Steuerkreuz oder linker Stick zum Bewegen. A = Kanone, Y = Kettenkugeln, B = Tempo, X = Reparatur. Zum Zielen mit den Ketten: X links, A geradeaus, Y rechts, B zum Abbrechen. Während der Fässer schießt A dorthin, wo das Fadenkreuz steht. Seine Schüsse: Etwa alle 3 s, wenn er auf deiner Linie ist, feuert er 12 Kugeln (je 1 Schaden). Weich aus, sobald er sich gegenüber positioniert. Tipp: Verlangsame ihn mit den Ketten (Taste 2) und feuere dann Kanonensalven ab, solange er langsam ist. Geskriptete Phasen: bei 75: 3 Leutnants (je 10 Punkte) ersetzen Nadaillac, Ketten nicht verfügbar; nach 60 s ziehen sie wieder ab; bei 50: Pulverfässer . Nach einem Countdown von 3 s fallen 10 s lang Fässer auf 5 Bahnen. Deine Kanonen sind blockiert: Klick auf die Fässer, um sie mit der Pistole abzuschießen (30 Kugeln). Ein Fass, das dein Schiff trifft, macht 5 Schaden: Schieß zuerst die auf deiner Bahn ab und weich den anderen aus; bei 25: 5 schnellere Leutnants; bei 10: letzte Fässersalve. Wenn du sinkst: Die Schlacht beginnt von vorn. Nach 3 Niederlagen kannst du „Aufgeben: das Entern über sich ergehen lassen.“ wählen. Die Geschichte geht weiter, aber deine ganze Gruppe beginnt den Kampf gegen Nadaillac mit der Hälfte ihrer LP.", "sol": 0}]}, {"titre": "Nicht verpassen", "intro": "", "entrees": [{"titre": "Nicht verpassen", "html": "<ul><li><strong>Punkt ohne Wiederkehr:</strong> Nach dem Sieg bei der Olympiade ist dein Boot blockiert. Wenn du Itzels Schiff betrittst, beginnt das Kapitelende, ohne Rückkehr. Die Quests von Kallisthenes und Leonidas sind nach Kapitel 4 noch machbar, wenn die Oliveninsel wieder erreichbar ist.</li><li><strong>Versteckte Kompott-Belohnung:</strong> Nachdem du die Kiste geholt hast, schau noch einmal im Laden der Apfelinsel vorbei (5 Kompott, 1 Superkompott, 10.000 EP).</li><li><strong>Behalte 5 Makrelen</strong> bei dir, wenn du auf der Oliveninsel ankommst: Dann kannst du die Quest von Leonidas sofort abgeben.</li><li><strong>Schlüsselgegenstände des Kapitels:</strong> 3. Edelstein der Bolon Tiku (Olympiade), Käfigschlüssel und dann Kiste Kompott (Quest von Kallisthenes), Familien-Lendenschurz (Belohnung von Kallisthenes).</li><li>Keine Truhe auf der Oliveninsel.</li><li><strong>Erfolge des Kapitels:</strong><ul><li><strong>„Die Kastagnetten!“</strong>: Kapitel 3 abschließen.</li><li><strong>„Panem et circenses“</strong>: 32 Punkte in einem einzigen Spwort-Wettkampf holen. Du musst alle 11 Disziplinen gewinnen (33 Punkte) oder 10 Siege und einen 2. Platz holen. Die Punktzahl wird nur am Ende eines vollständigen Wettkampfs geprüft (erster Durchgang oder „Alles neu starten“ / „Alles wiederholen“), nicht nach dem Wiederholen einer einzelnen Disziplin oder einer Gruppe. Am einfachsten: Stell die Sehnenentzündung auf „60 Jahre und +“ und spiel alles noch einmal.</li><li>Die Quests von Kallisthenes und Leonidas zählen für <strong>„Mädchen für alles“</strong> (alle Nebenquests), genau wie später „Das Angebot von Philoxenos“.</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "Kapitel 3 Die Oliveninsel Nicht verpassen Nicht verpassen Punkt ohne Wiederkehr: Nach dem Sieg bei der Olympiade ist dein Boot blockiert. Wenn du Itzels Schiff betrittst, beginnt das Kapitelende, ohne Rückkehr. Die Quests von Kallisthenes und Leonidas sind nach Kapitel 4 noch machbar, wenn die Oliveninsel wieder erreichbar ist. Versteckte Kompott-Belohnung: Nachdem du die Kiste geholt hast, schau noch einmal im Laden der Apfelinsel vorbei (5 Kompott, 1 Superkompott, 10.000 EP). Behalte 5 Makrelen bei dir, wenn du auf der Oliveninsel ankommst: Dann kannst du die Quest von Leonidas sofort abgeben. Schlüsselgegenstände des Kapitels: 3. Edelstein der Bolon Tiku (Olympiade), Käfigschlüssel und dann Kiste Kompott (Quest von Kallisthenes), Familien-Lendenschurz (Belohnung von Kallisthenes). Keine Truhe auf der Oliveninsel. Erfolge des Kapitels: „Die Kastagnetten!“ : Kapitel 3 abschließen. „Panem et circenses“ : 32 Punkte in einem einzigen Spwort-Wettkampf holen. Du musst alle 11 Disziplinen gewinnen (33 Punkte) oder 10 Siege und einen 2. Platz holen. Die Punktzahl wird nur am Ende eines vollständigen Wettkampfs geprüft (erster Durchgang oder „Alles neu starten“ / „Alles wiederholen“), nicht nach dem Wiederholen einer einzelnen Disziplin oder einer Gruppe. Am einfachsten: Stell die Sehnenentzündung auf „60 Jahre und +“ und spiel alles noch einmal. Die Quests von Kallisthenes und Leonidas zählen für „Mädchen für alles“ (alle Nebenquests), genau wie später „Das Angebot von Philoxenos“.", "sol": 0}]}]}], "es": [{"id": "c3", "num": "Capítulo 3", "titre": "La isla de Oliva", "intro": "<p>El monstruo de los acantilados ha sido derrotado: Itzel sigue una nueva pista hasta la isla de Oliva, isla de filósofos musculosos y ligeros de ropa. Allí buscas una gema de los Bolon Tiku, que habrá que ganar en las Olimpiadas de las castañuelas con la ayuda (muy relativa) de uno de los dos Zoquetes. La vuelta a bordo no será nada tranquila.</p>", "sections": [{"titre": "Misión principal", "intro": "", "entrees": [{"titre": "Reunirse con Itzel en su barco.", "html": "<p>(Título de la misión: «Isla del Viento». Esta etapa enlaza con el final del capítulo 2, cuya guía también la describe.)</p><ol><li>En la isla del Viento, ve al barco de Itzel, amarrado al sureste de la isla, al este de la pescadora.</li><li>Dos condiciones antes de zarpar:<ul><li>los dos Zoquetes tienen que estar contigo. Si los dejaste al pie de la cueva 3 (la escalera de los Zoquetes), Itzel te lo hace notar: ve a buscarlos;</li><li>tienen una quemadura de sol. Hay que aplicarles una <strong>Grasa de Coulirou</strong> (opción «Untarles grasa de Coulirou»); si no, «Los dos Zoquetes no están en condiciones de viajar.». Una aplicación en la barca también cuenta.</li></ul></li><li>Itzel propone: «¿Ir a la isla de Oliva?». Responde <strong>Sí</strong>. El viaje empieza solo y aparece el cartel «Capítulo 3 — La isla de Oliva».</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "Capítulo 3 La isla de Oliva Misión principal Reunirse con Itzel en su barco. (Título de la misión: «Isla del Viento». Esta etapa enlaza con el final del capítulo 2, cuya guía también la describe.) En la isla del Viento, ve al barco de Itzel, amarrado al sureste de la isla, al este de la pescadora. Dos condiciones antes de zarpar: los dos Zoquetes tienen que estar contigo. Si los dejaste al pie de la cueva 3 (la escalera de los Zoquetes), Itzel te lo hace notar: ve a buscarlos; tienen una quemadura de sol. Hay que aplicarles una Grasa de Coulirou (opción «Untarles grasa de Coulirou»); si no, «Los dos Zoquetes no están en condiciones de viajar.». Una aplicación en la barca también cuenta. Itzel propone: «¿Ir a la isla de Oliva?». Responde Sí . El viaje empieza solo y aparece el cartel «Capítulo 3 — La isla de Oliva».", "sol": 0}, {"titre": "Ir a la isla de Oliva en compañía de Itzel", "html": "<ol><li>Al llegar, Itzel se queda a bordo para vigilar una vela sospechosa. Desembarcas solo con los dos Zoquetes, en la playa del sur de la isla.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "Capítulo 3 La isla de Oliva Misión principal Ir a la isla de Oliva en compañía de Itzel Al llegar, Itzel se queda a bordo para vigilar una vela sospechosa. Desembarcas solo con los dos Zoquetes, en la playa del sur de la isla.", "sol": 0}, {"titre": "Encontrar información sobre una posible gema", "html": "<ol><li>Sube hacia el norte desde la playa: empieza una escena sola. Un anciano desnudo cruza la pantalla en un sentido y luego en el otro, con un cangrejo agarrado a una parte sensible. Sus gritos de auxilio aparecen en un bocadillo que se queda en el borde de la pantalla cuando sale del encuadre.</li><li>Espera unos 20 segundos (tres idas y vueltas). Entonces aparece el botón <strong>Intervenir</strong> en la parte inferior de la pantalla: haz clic en él o pulsa la tecla de interacción.</li><li><strong>Jefe: el Rey de los Cangrejos</strong> (300 PV, pega fuerte pero no tiene ninguna mecánica especial). Luchas con Barbe-Yeux y los dos Zoquetes. Victoria: 2 000 EXP. En modo aventura, como en todos los combates, recibes un 20 % menos de daño e infliges un 20 % más.</li><li>El anciano se presenta: es <strong>Filóxeno Long-Rameau</strong>, una especie de jefe de la isla (no le gusta la palabra). Te espera en el pueblo.</li><li>Ve al pueblo, en el centro de la isla (alrededor de la gran estatua del Zoquete). Filóxeno está al este-sureste de la estatua. Habla con él: te explica que la gema es para el ganador de las Olimpiadas de las castañuelas.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "Capítulo 3 La isla de Oliva Misión principal Encontrar información sobre una posible gema Sube hacia el norte desde la playa: empieza una escena sola. Un anciano desnudo cruza la pantalla en un sentido y luego en el otro, con un cangrejo agarrado a una parte sensible. Sus gritos de auxilio aparecen en un bocadillo que se queda en el borde de la pantalla cuando sale del encuadre. Espera unos 20 segundos (tres idas y vueltas). Entonces aparece el botón Intervenir en la parte inferior de la pantalla: haz clic en él o pulsa la tecla de interacción. Jefe: el Rey de los Cangrejos (300 PV, pega fuerte pero no tiene ninguna mecánica especial). Luchas con Barbe-Yeux y los dos Zoquetes. Victoria: 2 000 EXP. En modo aventura, como en todos los combates, recibes un 20 % menos de daño e infliges un 20 % más. El anciano se presenta: es Filóxeno Long-Rameau , una especie de jefe de la isla (no le gusta la palabra). Te espera en el pueblo. Ve al pueblo, en el centro de la isla (alrededor de la gran estatua del Zoquete). Filóxeno está al este-sureste de la estatua. Habla con él: te explica que la gema es para el ganador de las Olimpiadas de las castañuelas.", "sol": 0}, {"titre": "Inscribirse en las Olimpiadas", "html": "<ol><li>Ve al puesto de inscripción, al noreste de la estatua del pueblo. Sigue cerrado mientras no hayas hablado con Filóxeno.</li><li>Barbe-Yeux inscribe de oficio a uno de los dos Zoquetes. El Zoquete correrá por la «calle número 1».</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "Capítulo 3 La isla de Oliva Misión principal Inscribirse en las Olimpiadas Ve al puesto de inscripción, al noreste de la estatua del pueblo. Sigue cerrado mientras no hayas hablado con Filóxeno. Barbe-Yeux inscribe de oficio a uno de los dos Zoquetes. El Zoquete correrá por la «calle número 1».", "sol": 0}, {"titre": "Participar en las Olimpiadas (¡y ganarlas!)", "html": "<ol><li>El estadio está en el extremo norte de la isla. Antes de la inscripción, la entrada está bloqueada («Todavía no puede entrar en el recinto.» y luego «Primero hay que pasar por la inscripción.»).</li><li>En la entrada, elige <strong>Sí</strong> a «¿Participar en las Olimpiadas?». «Todavía no» te deja marcharte.</li><li>El discurso de apertura del presentador solo se oye en la primera visita. Después se encadenan las 11 pruebas (ver <strong>Minijuegos &gt; Olimpiadas de las castañuelas</strong>).</li><li>Tienes que acabar <strong>primero en la clasificación final</strong>, con más puntos que nadie.</li><li>Si fallas, la pantalla de la clasificación te deja empezarlo todo de nuevo, cambiar la dificultad («Cambiar la tendinitis») o repetir solo un grupo de pruebas o una prueba. Los demás resultados se conservan. Si abandonas las Olimpiadas a medias, en tu próxima visita las retomas desde el principio.</li><li>Victoria: Filóxeno te entrega la <strong>3.ª gema de los Bolon Tiku</strong> y <strong>50 000 EXP</strong>.</li></ol><aside class=\"note\"><p><strong>Atención: punto de no retorno cercano.</strong> Una vez ganadas las Olimpiadas, tu barca ya no zarpa («No voy a hacerme a la mar por aquí…»). La única salida es el barco de Itzel, que inicia el final del capítulo. Termina antes lo que quieras acabar en la isla (ver Misiones secundarias).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "Capítulo 3 La isla de Oliva Misión principal Participar en las Olimpiadas (¡y ganarlas!) El estadio está en el extremo norte de la isla. Antes de la inscripción, la entrada está bloqueada («Todavía no puede entrar en el recinto.» y luego «Primero hay que pasar por la inscripción.»). En la entrada, elige Sí a «¿Participar en las Olimpiadas?». «Todavía no» te deja marcharte. El discurso de apertura del presentador solo se oye en la primera visita. Después se encadenan las 11 pruebas (ver Minijuegos > Olimpiadas de las castañuelas ). Tienes que acabar primero en la clasificación final , con más puntos que nadie. Si fallas, la pantalla de la clasificación te deja empezarlo todo de nuevo, cambiar la dificultad («Cambiar la tendinitis») o repetir solo un grupo de pruebas o una prueba. Los demás resultados se conservan. Si abandonas las Olimpiadas a medias, en tu próxima visita las retomas desde el principio. Victoria: Filóxeno te entrega la 3.ª gema de los Bolon Tiku y 50 000 EXP . Atención: punto de no retorno cercano. Una vez ganadas las Olimpiadas, tu barca ya no zarpa («No voy a hacerme a la mar por aquí…»). La única salida es el barco de Itzel, que inicia el final del capítulo. Termina antes lo que quieras acabar en la isla (ver Misiones secundarias).", "sol": 0}, {"titre": "Reunirse con Itzel en su barco y hacerse a la mar.", "html": "<ol><li>Vuelve a la playa de llegada, al sur. El barco de Itzel está justo a la derecha de tu barca. Sin la gema, Itzel se niega a zarpar («Todavía no tenemos la gema de las Olimpiadas.»).</li><li>Aparece una vela pirata: es <strong>Nadaillac Dos Rojos</strong>, que quiere vuestras gemas.</li><li><strong>Batalla naval</strong> contra su barco (ver <strong>Minijuegos &gt; Batalla naval contra Nadaillac</strong>).</li><li><strong>Jefe: Nadaillac Dos Rojos</strong> (abordaje). Luchas con Barbe-Yeux, los dos Zoquetes e Itzel.<ul><li>En el primer turno, dispara una bala a cada miembro del grupo (daño ×1,5). Después recarga y ataca con la espada: durante 3 turnos si estáis 4 en pie, 2 turnos si estáis 3, y un solo turno si no. Mantén a todo el mundo con vida, así disparará menos a menudo, y cúrate antes de cada descarga.</li><li>Por debajo de 2 250 PV, llama a 4 refuerzos: un Artillero, dos Piratas de tamaño razonable y una PiratA con una pishtola, todos reforzados.</li><li>Por debajo de 1 500 PV, lanza una granada de humo y golpea 6 veces al azar a tu grupo. Después se cura 500 PV, levanta a 4 piratas no muertos y pasa su siguiente turno.</li><li><strong>Truco:</strong> el combate termina en cuanto Nadaillac baja a 50 PV. No hace falta matar a sus refuerzos: concentra tus golpes en él.</li><li>En modo aventura, sus golpes te hacen un 20 % menos de daño y los tuyos un 20 % más. Los umbrales de 2 250, 1 500 y 50 PV no cambian.</li><li>Si pierdes, el combate vuelve a empezar de inmediato, con PV y energía al máximo, sin repetir la batalla naval.</li></ul></li><li>Una cinemática cierra el capítulo y luego aparece el cartel «Capítulo 4 — Orilla perdida». Logro <strong>«¡Las castañuelas!»</strong>.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "Capítulo 3 La isla de Oliva Misión principal Reunirse con Itzel en su barco y hacerse a la mar. Vuelve a la playa de llegada, al sur. El barco de Itzel está justo a la derecha de tu barca. Sin la gema, Itzel se niega a zarpar («Todavía no tenemos la gema de las Olimpiadas.»). Aparece una vela pirata: es Nadaillac Dos Rojos , que quiere vuestras gemas. Batalla naval contra su barco (ver Minijuegos > Batalla naval contra Nadaillac ). Jefe: Nadaillac Dos Rojos (abordaje). Luchas con Barbe-Yeux, los dos Zoquetes e Itzel. En el primer turno, dispara una bala a cada miembro del grupo (daño ×1,5). Después recarga y ataca con la espada: durante 3 turnos si estáis 4 en pie, 2 turnos si estáis 3, y un solo turno si no. Mantén a todo el mundo con vida, así disparará menos a menudo, y cúrate antes de cada descarga. Por debajo de 2 250 PV, llama a 4 refuerzos: un Artillero, dos Piratas de tamaño razonable y una PiratA con una pishtola, todos reforzados. Por debajo de 1 500 PV, lanza una granada de humo y golpea 6 veces al azar a tu grupo. Después se cura 500 PV, levanta a 4 piratas no muertos y pasa su siguiente turno. Truco: el combate termina en cuanto Nadaillac baja a 50 PV. No hace falta matar a sus refuerzos: concentra tus golpes en él. En modo aventura, sus golpes te hacen un 20 % menos de daño y los tuyos un 20 % más. Los umbrales de 2 250, 1 500 y 50 PV no cambian. Si pierdes, el combate vuelve a empezar de inmediato, con PV y energía al máximo, sin repetir la batalla naval. Una cinemática cierra el capítulo y luego aparece el cartel «Capítulo 4 — Orilla perdida». Logro «¡Las castañuelas!» .", "sol": 0}]}, {"titre": "Misiones secundarias", "intro": "", "entrees": [{"titre": "El pedido de compotas (Calístenes el Saliente)", "html": "<p><em>Título al completarla: «Encontrar el pedido de compotas de Calístenes.»</em></p><ol><li><strong>Activarla:</strong> en la isla de Oliva, habla con Calístenes el Saliente, en la esquina noreste de la estatua del pueblo. Acepta (<strong>Sí</strong>). Si te niegas, te la volverá a proponer.</li><li><strong>Isla de las Manzanas:</strong> vuelve a coger tu barca (en la playa sur, opción «Embarcar») y ve a la isla de las Manzanas. En la tienda de compotas, al norte de la isla, Barbe-Yeux habla del pedido: el barco mercante desapareció rumbo a Morro Blanco. La isla de Morro Blanco se desbloquea en el mapa.</li><li><strong>Morro Blanco:</strong> desde el embarcadero (al suroeste), sigue la costa oeste hacia el norte. Encuentras a un mercader encerrado en una jaula.</li><li>Justo al norte de la jaula, un campamento de bandidos provoca un combate obligatorio contra 5 enemigos: Artillero, Pirata de tamaño razonable, PiratA con una pishtola, Pescador y Pescadora. Victoria: <strong>Llave de la jaula</strong>.</li><li>Vuelve a la jaula con la llave: el mercader te da la <strong>Caja de compotas</strong>.</li><li><strong>Recompensa 1:</strong> llévale la caja a Calístenes en la isla de Oliva. Ganas <strong>40 000 EXP</strong> y el <strong>Taparrabos familiar</strong> (equipo de piernas, +10 DEF para los dos Zoquetes).</li><li><strong>Recompensa 2 (fácil de olvidar):</strong> después, vuelve a pasar por la tienda de compotas de la isla de las Manzanas. El vendedor te da <strong>5 Compotas</strong>, <strong>1 Supercompota</strong> (devuelve 150 PV y el 75 % de la energía) y <strong>10 000 EXP</strong>.</li></ol><aside class=\"note\"><p>En el capítulo 3, hazla <strong>antes de ganar las Olimpiadas</strong>: después de la victoria, tu barca ya no sale de la isla. Si no, la isla de Oliva vuelve a ser accesible más adelante en la aventura (después del capítulo 4), y Calístenes te estará esperando allí.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "Capítulo 3 La isla de Oliva Misiones secundarias El pedido de compotas (Calístenes el Saliente) Título al completarla: «Encontrar el pedido de compotas de Calístenes.» Activarla: en la isla de Oliva, habla con Calístenes el Saliente, en la esquina noreste de la estatua del pueblo. Acepta ( Sí ). Si te niegas, te la volverá a proponer. Isla de las Manzanas: vuelve a coger tu barca (en la playa sur, opción «Embarcar») y ve a la isla de las Manzanas. En la tienda de compotas, al norte de la isla, Barbe-Yeux habla del pedido: el barco mercante desapareció rumbo a Morro Blanco. La isla de Morro Blanco se desbloquea en el mapa. Morro Blanco: desde el embarcadero (al suroeste), sigue la costa oeste hacia el norte. Encuentras a un mercader encerrado en una jaula. Justo al norte de la jaula, un campamento de bandidos provoca un combate obligatorio contra 5 enemigos: Artillero, Pirata de tamaño razonable, PiratA con una pishtola, Pescador y Pescadora. Victoria: Llave de la jaula . Vuelve a la jaula con la llave: el mercader te da la Caja de compotas . Recompensa 1: llévale la caja a Calístenes en la isla de Oliva. Ganas 40 000 EXP y el Taparrabos familiar (equipo de piernas, +10 DEF para los dos Zoquetes). Recompensa 2 (fácil de olvidar): después, vuelve a pasar por la tienda de compotas de la isla de las Manzanas. El vendedor te da 5 Compotas , 1 Supercompota (devuelve 150 PV y el 75 % de la energía) y 10 000 EXP . En el capítulo 3, hazla antes de ganar las Olimpiadas : después de la victoria, tu barca ya no sale de la isla. Si no, la isla de Oliva vuelve a ser accesible más adelante en la aventura (después del capítulo 4), y Calístenes te estará esperando allí.", "sol": 0}, {"titre": "Llevarle caballas a Leónidas", "html": "<p><em>Título al completarla: «Llevarle 5 caballas a Leónidas.»</em></p><ol><li><strong>Activarla:</strong> habla con Leónidas, al este de la estatua del pueblo, hacia el sur. Pide pescado: acepta (<strong>Sí</strong>). También puedes activarla después de las Olimpiadas.</li><li><strong>Objetivo:</strong> 5 <strong>Caballas</strong>. Se pescan en la isla de los Cangrejos (la playa) y en la isla del Viento. Combinación de la caballa: <strong>← ← → →</strong>. Cada captura tiene más o menos 1 posibilidad entre 3 de ser una caballa en la isla de los Cangrejos (menos en la isla del Viento, donde el Coulirou pica a menudo).</li><li>No vendas tus caballas a los pescadores de la isla de los Cangrejos y de la isla del Viento, que te las compran.</li><li>Vuelve a ver a Leónidas con 5 caballas: <strong>30 000 EXP</strong>.</li></ol><aside class=\"note\"><p>Igual que con Calístenes: después de ganar las Olimpiadas, ya no puedes salir de la isla en el capítulo 3. Si ya llevas 5 caballas encima, puedes entregarla en ese momento. Si no, déjala para tu vuelta a la isla de Oliva después del capítulo 4.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "Capítulo 3 La isla de Oliva Misiones secundarias Llevarle caballas a Leónidas Título al completarla: «Llevarle 5 caballas a Leónidas.» Activarla: habla con Leónidas, al este de la estatua del pueblo, hacia el sur. Pide pescado: acepta ( Sí ). También puedes activarla después de las Olimpiadas. Objetivo: 5 Caballas . Se pescan en la isla de los Cangrejos (la playa) y en la isla del Viento. Combinación de la caballa: ← ← → → . Cada captura tiene más o menos 1 posibilidad entre 3 de ser una caballa en la isla de los Cangrejos (menos en la isla del Viento, donde el Coulirou pica a menudo). No vendas tus caballas a los pescadores de la isla de los Cangrejos y de la isla del Viento, que te las compran. Vuelve a ver a Leónidas con 5 caballas: 30 000 EXP . Igual que con Calístenes: después de ganar las Olimpiadas, ya no puedes salir de la isla en el capítulo 3. Si ya llevas 5 caballas encima, puedes entregarla en ese momento. Si no, déjala para tu vuelta a la isla de Oliva después del capítulo 4.", "sol": 0}, {"titre": "La oferta de Filóxeno (a partir del capítulo 5)", "html": "<p>Esta misión transcurre en la isla de Oliva, pero solo se abre una vez terminado el capítulo 4: pertenece al periodo del capítulo 5. Aquí tienes lo esencial, porque se juega en el estadio de las Olimpiadas.</p><ol><li><strong>Activarla:</strong> en la taberna de la isla de los Cangrejos, pregúntale al tabernero por las novedades. Habla de una oferta de Filóxeno: acéptala.</li><li>Ve a ver a Filóxeno a la isla de Oliva. Te propone pagarte en <strong>aceitunas</strong> cada prueba que repitas en el estadio.</li><li>Repite pruebas en el estadio: <strong>2 aceitunas por prueba terminada</strong>, +1 aceituna si ganas o si haces un nuevo récord, pero solo con la tendinitis en «12-24 años» o «25-39 años». La primera entrega de aceitunas completa la misión: <strong>el 75 % de la EXP de tu nivel actual</strong>.</li><li>Después, cualquier tabernero (isla de los Cangrejos, isla de los Monos, isla del Viento, Nassau) prepara <strong>Ol'right</strong>: 5 aceitunas + 1 ron, o 5 aceitunas + 5 escudos. En combate, el Ol'right regenera un 25 % de energía por turno a todo el grupo durante 4 turnos.</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "Capítulo 3 La isla de Oliva Misiones secundarias La oferta de Filóxeno (a partir del capítulo 5) Esta misión transcurre en la isla de Oliva, pero solo se abre una vez terminado el capítulo 4: pertenece al periodo del capítulo 5. Aquí tienes lo esencial, porque se juega en el estadio de las Olimpiadas. Activarla: en la taberna de la isla de los Cangrejos, pregúntale al tabernero por las novedades. Habla de una oferta de Filóxeno: acéptala. Ve a ver a Filóxeno a la isla de Oliva. Te propone pagarte en aceitunas cada prueba que repitas en el estadio. Repite pruebas en el estadio: 2 aceitunas por prueba terminada , +1 aceituna si ganas o si haces un nuevo récord, pero solo con la tendinitis en «12-24 años» o «25-39 años». La primera entrega de aceitunas completa la misión: el 75 % de la EXP de tu nivel actual . Después, cualquier tabernero (isla de los Cangrejos, isla de los Monos, isla del Viento, Nassau) prepara Ol'right : 5 aceitunas + 1 ron, o 5 aceitunas + 5 escudos. En combate, el Ol'right regenera un 25 % de energía por turno a todo el grupo durante 4 turnos.", "sol": 0}, {"titre": "Personajes sin misión", "html": "<ul><li><strong>Eudoxie</strong> (al este de la estatua): atleta de las Olimpiadas, simple diálogo.</li><li><strong>El panel de récords</strong> (al norte del pueblo, cerca del estadio): «Aquí no hay nada por ahora…» antes de tu victoria. Después, muestra los mejores tiempos y lanzamientos.</li><li><strong>La estatua del Zoquete</strong>, en el centro del pueblo: cuando tú o los Zoquetes pasáis por detrás, os tapa. Una silueta de color te muestra dónde estás (opción «Siluetas tras el decorado», en Preferencias &gt; Accesibilidad, activada por defecto). La estatua cambia de aspecto a lo largo de la aventura. Una vez terminado el juego, está acabada y coronada de laurel.</li></ul>", "id": "c3-personnages-sans-quete", "texte": "Capítulo 3 La isla de Oliva Misiones secundarias Personajes sin misión Eudoxie (al este de la estatua): atleta de las Olimpiadas, simple diálogo. El panel de récords (al norte del pueblo, cerca del estadio): «Aquí no hay nada por ahora…» antes de tu victoria. Después, muestra los mejores tiempos y lanzamientos. La estatua del Zoquete , en el centro del pueblo: cuando tú o los Zoquetes pasáis por detrás, os tapa. Una silueta de color te muestra dónde estás (opción «Siluetas tras el decorado», en Preferencias > Accesibilidad, activada por defecto). La estatua cambia de aspecto a lo largo de la aventura. Una vez terminado el juego, está acabada y coronada de laurel.", "sol": 0}]}, {"titre": "Minijuegos", "intro": "", "entrees": [{"titre": "Olimpiadas de las castañuelas (Spwort)", "html": "<p><strong>El principio.</strong> No corres tú: corre el Zoquete («El Zoquete», calle 1). Sus rivales son Filóxeno, Eudoxie y Xénocrate. Hay 11 pruebas, siempre en este orden:</p><ul><li>3 carreras de velocidad;</li><li>3 carreras de vallas;</li><li>3 lanzamientos de bala de cañón;</li><li>2 carreras de resistencia (400 m).</li></ul><p>En cada prueba, el 1.º suma 3 puntos, el 2.º 2 puntos, el 3.º 1 punto y el último 0. La clasificación final se hace por puntos. En caso de empate, gana el menor tiempo total. Ganar las 6 carreras no siempre basta: también hay que rascar algunos puntos en los lanzamientos o en los 400 m.</p><p>El modo aventura no cambia nada en las Olimpiadas: su única dificultad es la «tendinitis».</p><p><strong>La dificultad («tendinitis») es el verdadero secreto.</strong> La primera vez, los rivales están en el nivel más difícil, «12-24 años». Si pierdes, elige <strong>«Cambiar la tendinitis»</strong> en la pantalla de la clasificación final:</p><ul><li>«25-39 años»: rivales un poco más lentos, lanzamientos rivales un poco menos potentes;</li><li>«40-59 años»: más lentos todavía, lanzamientos más flojos;</li><li>«60 años y más»: claramente más lentos, lanzamientos rivales más o menos la mitad de largos.</li></ul><p>La recompensa es la misma sea cual sea el nivel. Después puedes repetir solo las pruebas que has perdido: los demás resultados se conservan.</p><p><strong>Carreras de velocidad y de vallas</strong></p><ul><li>Machaca <strong>una sola tecla</strong> (no Espacio) en cuanto suene el «¡Ya!». La primera tecla que pulses queda bloqueada para toda la carrera.</li><li>Hace falta un ritmo intenso: unas <strong>7 pulsaciones por segundo</strong> para ganar en «12-24 años», unas 6,5 en «25-39 años», 6 en «40-59 años» y 5,5 en «60 años y más».</li><li>Con mando, todos los botones frontales, superiores y gatillos cuentan como una sola tecla: alterna dos dedos en dos botones. A no cuenta durante las vallas.</li><li><strong>Vallas:</strong> Espacio no hace saltar al Zoquete. Arrasa con las vallas, las rompe y no frena, mientras que sus rivales pierden un poco de velocidad en cada salto. Espacio solo sirve para que Barbe-Yeux grite: concéntrate en machacar la tecla.</li></ul><p><strong>Lanzamiento de bala de cañón</strong></p><ol><li><strong>Potencia:</strong> machaca una tecla durante 2 segundos. El indicador se llena 1/16 por pulsación: 16 pulsaciones dan la potencia máxima.</li><li><strong>Puntería:</strong> la aguja recorre el arco, ida y vuelta, en 0,7 segundos por sentido. Pulsa <strong>Espacio cuando esté justo en el centro de su recorrido</strong> (60°). A ±2°, obtienes «¡Perfecto!». Cuanto más te alejes del centro, más corto es el lanzamiento. Por encima de 90°, la bala sale hacia atrás y cuenta como 0 m.</li><li>Margen para ganar con la potencia máxima:<ul><li>«12-24 años»: unos ±9° en el 1.er lanzamiento, ±4 a 5° en el 2.º y el 3.º (mejores lanzamientos rivales: 27,8 m, 30,4 m, 30,8 m);</li><li>«25-39 años»: unos ±10°;</li><li>«40-59 años»: unos ±16°;</li><li>«60 años y más»: unos ±33°.</li></ul></li></ol><p><strong>Carrera de resistencia (400 m)</strong></p><ul><li>Pulsa con cadencia (Espacio también sirve). Cada pulsación hace subir el cursor de ritmo, que vuelve a bajar solo.</li><li>Zona <strong>azul</strong>: velocidad de crucero, sin cansancio. Para mantenerte en ella, hacen falta unas 2 pulsaciones por segundo.</li><li>Zona <strong>roja</strong>: más rápida, pero vacía la barra de resistencia. Con el cursor arriba del todo, la barra se vacía en unos 10 segundos. Si se vacía, el Zoquete frena mucho hasta la meta y corre más despacio que en la zona azul.</li><li>Por debajo del azul (zona verde), la barra se recarga despacio, pero el Zoquete avanza mucho más lento.</li><li>El rojo da la misma ventaja por la misma cantidad de resistencia, tanto si estás justo por encima del azul como arriba del todo. Lo que cuenta es que la barra esté <strong>vacía justo en la línea de meta</strong>, nunca antes.</li><li><strong>Método:</strong><ol><li>En la salida, machaca rápido para llegar al azul en 1 o 2 segundos: cada segundo en el verde sale caro.</li><li>Mantén el azul hasta algo más de la mitad del recorrido (unos 23 segundos de carrera).</li><li>Entonces sube a lo más alto del rojo y quédate ahí hasta la meta.</li></ol></li><li>Posibilidades según la tendinitis (ahora se pueden ganar las dos carreras de 400 m):<ul><li>«12-24 años»: una carrera casi perfecta dura unos 34,2 s, frente a 34,3 s de los mejores rivales. Se decide por una décima de segundo;</li><li>«25-39 años»: alrededor de medio segundo de margen;</li><li>«40-59 años»: alrededor de un segundo de margen;</li><li>«60 años y más»: quedarse en el azul todo el rato basta, por los pelos, siempre que llegues al azul muy rápido en la salida. Si no, guarda un poco de rojo para el final.</li></ul></li></ul><p><strong>Después de la victoria:</strong> la entrada del estadio abre directamente el panel de las pruebas. Allí eliges la dificultad (y un modo «total wipeout» con rivales aleatorios) y luego lo repites todo, un grupo o una prueba. El panel de récords guarda tus mejores marcas. A partir del capítulo 5, estas pruebas también pueden darte aceitunas (ver «La oferta de Filóxeno»).</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "Capítulo 3 La isla de Oliva Minijuegos Olimpiadas de las castañuelas (Spwort) El principio. No corres tú: corre el Zoquete («El Zoquete», calle 1). Sus rivales son Filóxeno, Eudoxie y Xénocrate. Hay 11 pruebas, siempre en este orden: 3 carreras de velocidad; 3 carreras de vallas; 3 lanzamientos de bala de cañón; 2 carreras de resistencia (400 m). En cada prueba, el 1.º suma 3 puntos, el 2.º 2 puntos, el 3.º 1 punto y el último 0. La clasificación final se hace por puntos. En caso de empate, gana el menor tiempo total. Ganar las 6 carreras no siempre basta: también hay que rascar algunos puntos en los lanzamientos o en los 400 m. El modo aventura no cambia nada en las Olimpiadas: su única dificultad es la «tendinitis». La dificultad («tendinitis») es el verdadero secreto. La primera vez, los rivales están en el nivel más difícil, «12-24 años». Si pierdes, elige «Cambiar la tendinitis» en la pantalla de la clasificación final: «25-39 años»: rivales un poco más lentos, lanzamientos rivales un poco menos potentes; «40-59 años»: más lentos todavía, lanzamientos más flojos; «60 años y más»: claramente más lentos, lanzamientos rivales más o menos la mitad de largos. La recompensa es la misma sea cual sea el nivel. Después puedes repetir solo las pruebas que has perdido: los demás resultados se conservan. Carreras de velocidad y de vallas Machaca una sola tecla (no Espacio) en cuanto suene el «¡Ya!». La primera tecla que pulses queda bloqueada para toda la carrera. Hace falta un ritmo intenso: unas 7 pulsaciones por segundo para ganar en «12-24 años», unas 6,5 en «25-39 años», 6 en «40-59 años» y 5,5 en «60 años y más». Con mando, todos los botones frontales, superiores y gatillos cuentan como una sola tecla: alterna dos dedos en dos botones. A no cuenta durante las vallas. Vallas: Espacio no hace saltar al Zoquete. Arrasa con las vallas, las rompe y no frena, mientras que sus rivales pierden un poco de velocidad en cada salto. Espacio solo sirve para que Barbe-Yeux grite: concéntrate en machacar la tecla. Lanzamiento de bala de cañón Potencia: machaca una tecla durante 2 segundos. El indicador se llena 1/16 por pulsación: 16 pulsaciones dan la potencia máxima. Puntería: la aguja recorre el arco, ida y vuelta, en 0,7 segundos por sentido. Pulsa Espacio cuando esté justo en el centro de su recorrido (60°). A ±2°, obtienes «¡Perfecto!». Cuanto más te alejes del centro, más corto es el lanzamiento. Por encima de 90°, la bala sale hacia atrás y cuenta como 0 m. Margen para ganar con la potencia máxima: «12-24 años»: unos ±9° en el 1.er lanzamiento, ±4 a 5° en el 2.º y el 3.º (mejores lanzamientos rivales: 27,8 m, 30,4 m, 30,8 m); «25-39 años»: unos ±10°; «40-59 años»: unos ±16°; «60 años y más»: unos ±33°. Carrera de resistencia (400 m) Pulsa con cadencia (Espacio también sirve). Cada pulsación hace subir el cursor de ritmo, que vuelve a bajar solo. Zona azul : velocidad de crucero, sin cansancio. Para mantenerte en ella, hacen falta unas 2 pulsaciones por segundo. Zona roja : más rápida, pero vacía la barra de resistencia. Con el cursor arriba del todo, la barra se vacía en unos 10 segundos. Si se vacía, el Zoquete frena mucho hasta la meta y corre más despacio que en la zona azul. Por debajo del azul (zona verde), la barra se recarga despacio, pero el Zoquete avanza mucho más lento. El rojo da la misma ventaja por la misma cantidad de resistencia, tanto si estás justo por encima del azul como arriba del todo. Lo que cuenta es que la barra esté vacía justo en la línea de meta , nunca antes. Método: En la salida, machaca rápido para llegar al azul en 1 o 2 segundos: cada segundo en el verde sale caro. Mantén el azul hasta algo más de la mitad
