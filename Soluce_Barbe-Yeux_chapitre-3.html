/* Mise en page : en-tete collant avec la recherche, sommaire a gauche (replie sur telephone), fiches a droite. */
:root {
  --bg: #edf1ee; --surface: #fbfcfb; --fg: #17201c; --muted: #58675f; --line: #d4ddd7;
  --jade: #17765e; --jade-soft: #dcefe7; --or: #9a6a10; --or-soft: #f6ead0; --mark: #ffe08a;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--jade); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.entete-in { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.marque { font-family: var(--display); font-weight: 800; font-size: 1.45rem; margin: 0; line-height: 1.1; }
.marque small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.recherche { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1rem; outline: none; }
.recherche:focus-within { border-color: var(--jade); }
.compte { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bascule { display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); cursor: pointer; user-select: none; }
.bascule input { accent-color: var(--jade); width: 18px; height: 18px; }
.page { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 80px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; align-items: start; }
.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 110px); overflow-y: auto; font-size: .93rem; padding-right: 6px; }
.sommaire details { border-bottom: 1px solid var(--line); padding-block: 6px; }
.sommaire summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.02rem; list-style: none; padding: 4px 0; }
.sommaire summary::-webkit-details-marker { display: none; }
.sommaire summary .n { color: var(--jade); margin-right: 6px; }
.sommaire ul { list-style: none; margin: 4px 0 8px; padding: 0 0 0 10px; display: grid; gap: 2px; }
.sommaire li a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.sommaire li a:hover, .sommaire li a:focus-visible { background: var(--jade-soft); }
.sommaire li a.sec { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 8px; pointer-events: none; }
.sommaire li.cache { display: none; }
main { min-width: 0; display: grid; gap: 40px; }
.chapitre { display: grid; gap: 18px; }
.chapitre > header { border-bottom: 2px solid var(--jade); padding-bottom: 8px; }
.chapitre .num { color: var(--jade); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.chapitre h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 2px 0 0; text-wrap: balance; line-height: 1.15; }
.chap-intro { color: var(--muted); max-width: 72ch; }
.section { display: grid; gap: 14px; }
.section > h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--muted); margin: 6px 0 0; letter-spacing: .02em; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px); }
.fiche.eclat { box-shadow: 0 0 0 3px var(--jade); }
.fiche-tete { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.fiche h4 { font-family: var(--display); font-weight: 700; font-size: 1.28rem; margin: 0; text-wrap: balance; }
.lien { font: inherit; font-size: .82rem; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.lien:hover { color: var(--jade); border-color: var(--jade); }
.fiche-corps { max-width: 78ch; }
.fiche-corps p { margin: .6em 0; }
.fiche-corps h5 { font-family: var(--display); font-size: 1.05rem; margin: 1.1em 0 .2em; }
.fiche-corps ol, .fiche-corps ul { padding-left: 1.4em; margin: .5em 0; }
.fiche-corps li { margin: .25em 0; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); margin: .7em 0; }
.note p { margin: .3em 0; }
.sol { background: var(--or-soft); border: 1px solid color-mix(in srgb, var(--or) 45%, transparent); border-radius: 10px; margin: .7em 0; }
.sol summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--or); list-style: none; }
.sol summary::-webkit-details-marker { display: none; }
.sol summary::before { content: "▸ "; }
.sol[open] summary::before { content: "▾ "; }
.sol[open] summary { border-bottom: 1px solid color-mix(in srgb, var(--or) 30%, transparent); }
.sol .sol-corps { padding: 4px 14px 8px; }
.sol.contient summary::after { content: " · " attr(data-contient); font-weight: 400; font-size: .85rem; }
.langues { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.langues button { font: inherit; font-size: .85rem; font-weight: 700; letter-spacing: .04em; padding: 3px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.langues button[aria-pressed="true"] { background: var(--jade); color: var(--surface); }
.tab { overflow-x: auto; margin: .7em 0; }
.capture { margin: .9em 0; }
.capture .zoom { display: block; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: zoom-in; max-width: 100%; }
.capture img { display: block; max-width: 100%; height: auto; }
.capture figcaption { font-size: .88rem; color: var(--muted); margin-top: 6px; }
.visionneuse { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 10, .92); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.visionneuse[hidden] { display: none; }
.visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.carte { position: relative; }
.carte .zoom { width: 100%; }
.couche { position: absolute; inset: 0; pointer-events: none; }
.pastille { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer; pointer-events: auto; }
.pastille:hover, .pastille:focus-visible, .pastille.active { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--jade); outline: none; }
.bulle { position: absolute; z-index: 6; width: max-content; max-width: min(320px, 86%); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: .92rem; line-height: 1.35; box-shadow: 0 8px 22px rgba(0,0,0,.28); pointer-events: none; }
.bulle b { color: var(--jade); margin-right: 4px; }
.indice-pastilles { display: block; font-style: italic; margin-top: 2px; }
.vcarte { position: relative; display: inline-block; cursor: default; }
.vcarte img { display: block; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); }
.chapitres { max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
.chapitres[hidden] { display: none; }
.chapitres a { font-size: .86rem; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--bg); }
.chapitres a:hover { color: var(--jade); border-color: var(--jade); }
.chapitres a[aria-current] { background: var(--jade); color: var(--surface); border-color: var(--jade); }
.chapitres a.accueil { font-weight: 700; color: var(--fg); }
table { border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--jade-soft); }
code { font-size: .92em; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.vide { color: var(--muted); padding: 30px 0; }
.lien-zone { width: 100%; margin-top: 8px; font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.sommaire-mobile { display: none; }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; gap: 18px; }
  .sommaire { position: static; max-height: none; display: none; }
  .sommaire.ouvert { display: block; }
  .sommaire-mobile { display: inline-flex; font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chapitre h2 { font-size: 1.6rem; }
  .fiche { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script>
// DATA : { langue: [chapitres] }. CONFIG : lien de base (artefact) et titres par langue.
const DATA = {"fr": [{"id": "c3", "num": "Chapitre 3", "titre": "L'Île d'Olive", "intro": "<p>Le monstre des falaises est vaincu : Itzel suit une nouvelle piste jusqu'à l'Île d'Olive, île de philosophes musclés et peu vêtus. Tu y cherches une gemme des Bolon Tiku, qu'il faudra gagner aux Olympiades des castagnettes avec l'aide (très relative) d'un des deux cons. Le retour à bord ne se passera pas tranquillement.</p>", "sections": [{"titre": "Quête principale", "intro": "", "entrees": [{"titre": "Rejoindre Itzel sur son navire.", "html": "<p>(Titre de quête : « Île au vent ». Cette étape fait le lien avec la fin du chapitre 2, dont la soluce la décrit aussi.)</p><ol><li>Sur l'Île au vent, va au navire d'Itzel, amarré au sud-est de l'île, à l'est de la pêcheuse.</li><li>Deux conditions avant de partir :<ul><li>les deux cons doivent être avec toi. Si tu les as laissés au pied de la grotte 3 (l'échelle des cons), Itzel te le fait remarquer : va les rechercher ;</li><li>ils ont un coup de soleil. Il faut leur appliquer une <strong>Graisse de Coulirou</strong> (choix « Leur appliquer de la graisse de Coulirou »), sinon « Les deux cons ne sont pas en état de voyager ». Une application à la barque compte aussi.</li></ul></li><li>Itzel propose : « Se rendre sur l'Île d'Olive ? » Réponds <strong>Oui</strong>. Le voyage se lance tout seul et le carton « Chapitre 3 — L'Île d'Olive » s'affiche.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "Chapitre 3 L'Île d'Olive Quête principale Rejoindre Itzel sur son navire. (Titre de quête : « Île au vent ». Cette étape fait le lien avec la fin du chapitre 2, dont la soluce la décrit aussi.) Sur l'Île au vent, va au navire d'Itzel, amarré au sud-est de l'île, à l'est de la pêcheuse. Deux conditions avant de partir : les deux cons doivent être avec toi. Si tu les as laissés au pied de la grotte 3 (l'échelle des cons), Itzel te le fait remarquer : va les rechercher ; ils ont un coup de soleil. Il faut leur appliquer une Graisse de Coulirou (choix « Leur appliquer de la graisse de Coulirou »), sinon « Les deux cons ne sont pas en état de voyager ». Une application à la barque compte aussi. Itzel propose : « Se rendre sur l'Île d'Olive ? » Réponds Oui . Le voyage se lance tout seul et le carton « Chapitre 3 — L'Île d'Olive » s'affiche.", "sol": 0}, {"titre": "Se rendre sur l'île d'Olive en compagnie d'Itzel", "html": "<ol><li>À l'arrivée, Itzel reste à bord pour surveiller une voile suspecte. Tu débarques seul avec les deux cons, sur la plage au sud de l'île.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "Chapitre 3 L'Île d'Olive Quête principale Se rendre sur l'île d'Olive en compagnie d'Itzel À l'arrivée, Itzel reste à bord pour surveiller une voile suspecte. Tu débarques seul avec les deux cons, sur la plage au sud de l'île.", "sol": 0}, {"titre": "Trouver des renseignements sur une éventuelle gemme", "html": "<ol><li>Monte vers le nord depuis la plage : une scène se lance toute seule. Un vieil homme nu traverse l'écran dans un sens puis dans l'autre, un crabe accroché à une partie sensible. Ses appels à l'aide s'affichent dans une bulle qui reste au bord de l'écran quand il sort du champ.</li><li>Attends environ 20 secondes (trois allers-retours). Le bouton <strong>Intervenir</strong> apparaît alors en bas de l'écran : clique dessus ou appuie sur la touche d'interaction.</li><li><strong>Boss : le Roi des crabes</strong> (300 PV, frappe fort mais n'a pas de mécanique spéciale). Tu te bats avec Barbe-Yeux et les deux cons. Victoire : 2 000 XP. En mode Aventure, comme dans tous les combats, tu reçois 20 % de dégâts en moins et tu en infliges 20 % de plus.</li><li>Le vieil homme se présente : c'est <strong>Philoxène Long-Rameau</strong>, une sorte de chef de l'île (il n'aime pas le mot). Il t'attend au village.</li><li>Va au village, au centre de l'île (autour de la grande statue du con). Philoxène se trouve à l'est-sud-est de la statue. Parle-lui : il t'explique que la gemme revient au vainqueur des Olympiades des castagnettes.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "Chapitre 3 L'Île d'Olive Quête principale Trouver des renseignements sur une éventuelle gemme Monte vers le nord depuis la plage : une scène se lance toute seule. Un vieil homme nu traverse l'écran dans un sens puis dans l'autre, un crabe accroché à une partie sensible. Ses appels à l'aide s'affichent dans une bulle qui reste au bord de l'écran quand il sort du champ. Attends environ 20 secondes (trois allers-retours). Le bouton Intervenir apparaît alors en bas de l'écran : clique dessus ou appuie sur la touche d'interaction. Boss : le Roi des crabes (300 PV, frappe fort mais n'a pas de mécanique spéciale). Tu te bats avec Barbe-Yeux et les deux cons. Victoire : 2 000 XP. En mode Aventure, comme dans tous les combats, tu reçois 20 % de dégâts en moins et tu en infliges 20 % de plus. Le vieil homme se présente : c'est Philoxène Long-Rameau , une sorte de chef de l'île (il n'aime pas le mot). Il t'attend au village. Va au village, au centre de l'île (autour de la grande statue du con). Philoxène se trouve à l'est-sud-est de la statue. Parle-lui : il t'explique que la gemme revient au vainqueur des Olympiades des castagnettes.", "sol": 0}, {"titre": "S'inscrire aux Olympiades", "html": "<ol><li>Va au stand d'inscription, au nord-est de la statue du village. Il reste fermé tant que tu n'as pas parlé à Philoxène.</li><li>Barbe-Yeux inscrit d'office un des deux cons. Le con sera « ligne numéro 1 ».</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "Chapitre 3 L'Île d'Olive Quête principale S'inscrire aux Olympiades Va au stand d'inscription, au nord-est de la statue du village. Il reste fermé tant que tu n'as pas parlé à Philoxène. Barbe-Yeux inscrit d'office un des deux cons. Le con sera « ligne numéro 1 ».", "sol": 0}, {"titre": "Participer aux Olympiades (et les gagner !)", "html": "<ol><li>Le stade se trouve tout au nord de l'île. Avant l'inscription, l'entrée est bloquée (« Vous ne pouvez pas encore pénétrer les lieux », puis « Il faut d'abord passer par l'inscription »).</li><li>À l'entrée, choisis <strong>Oui</strong> à « Participer aux Olympiades ? ». « Pas encore » te laisse repartir.</li><li>Le discours d'ouverture de l'annonceur ne passe qu'à la première visite. Les 11 épreuves s'enchaînent ensuite (voir <strong>Mini-jeux &gt; Olympiades des castagnettes</strong>).</li><li>Il faut finir <strong>premier au classement final</strong>, avec le plus de points.</li><li>En cas d'échec, l'écran du classement te laisse tout recommencer, changer la difficulté (« Changer la tendinite ») ou rejouer seulement un groupe d'épreuves ou une épreuve. Les autres résultats sont gardés. Si tu quittes les Olympiades en cours de route, tu les reprends depuis le début à ta prochaine visite.</li><li>Victoire : Philoxène te remet la <strong>3ème gemme des Bolon Tiku</strong> et <strong>50 000 XP</strong>.</li></ol><aside class=\"note\"><p><strong>Attention, point de non-retour proche.</strong> Une fois les Olympiades gagnées, ta barque ne repart plus (« Je ne vais pas reprendre la mer par là… »). La seule sortie est le navire d'Itzel, qui lance la fin du chapitre. Termine d'abord ce que tu veux finir sur l'île (voir Quêtes secondaires).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "Chapitre 3 L'Île d'Olive Quête principale Participer aux Olympiades (et les gagner !) Le stade se trouve tout au nord de l'île. Avant l'inscription, l'entrée est bloquée (« Vous ne pouvez pas encore pénétrer les lieux », puis « Il faut d'abord passer par l'inscription »). À l'entrée, choisis Oui à « Participer aux Olympiades ? ». « Pas encore » te laisse repartir. Le discours d'ouverture de l'annonceur ne passe qu'à la première visite. Les 11 épreuves s'enchaînent ensuite (voir Mini-jeux > Olympiades des castagnettes ). Il faut finir premier au classement final , avec le plus de points. En cas d'échec, l'écran du classement te laisse tout recommencer, changer la difficulté (« Changer la tendinite ») ou rejouer seulement un groupe d'épreuves ou une épreuve. Les autres résultats sont gardés. Si tu quittes les Olympiades en cours de route, tu les reprends depuis le début à ta prochaine visite. Victoire : Philoxène te remet la 3ème gemme des Bolon Tiku et 50 000 XP . Attention, point de non-retour proche. Une fois les Olympiades gagnées, ta barque ne repart plus (« Je ne vais pas reprendre la mer par là… »). La seule sortie est le navire d'Itzel, qui lance la fin du chapitre. Termine d'abord ce que tu veux finir sur l'île (voir Quêtes secondaires).", "sol": 0}, {"titre": "Rejoindre Itzel sur son navire et prendre la mer.", "html": "<ol><li>Retourne à la plage d'arrivée, au sud. Le navire d'Itzel est juste à droite de ta barque. Sans la gemme, Itzel refuse de partir (« On n'a pas encore la gemme des Olympiades »).</li><li>Une voile pirate surgit : c'est <strong>Nadaillac Deux Rouges</strong>, qui veut vos gemmes.</li><li><strong>Bataille navale</strong> contre son navire (voir <strong>Mini-jeux &gt; Bataille navale contre Nadaillac</strong>).</li><li><strong>Boss : Nadaillac Deux Rouges</strong> (abordage). Tu te bats avec Barbe-Yeux, les deux cons et Itzel.<ul><li>Au premier tour, il tire une balle sur chaque membre du groupe (dégâts ×1,5). Il recharge ensuite et frappe à l'épée : pendant 3 tours si vous êtes 4 debout, 2 tours si vous êtes 3, 1 seul tour sinon. Garde tout le monde en vie, il tirera moins souvent, et soigne-toi avant chaque salve.</li><li>Sous 2 250 PV, il appelle 4 renforts : un Artilleur, deux Pirates de taille raisonnable et un Pirate avec un pistoulet, tous renforcés.</li><li>Sous 1 500 PV, il lance une grenade fumigène et frappe 6 fois au hasard dans ton groupe. Il se soigne ensuite de 500 PV, relève 4 pirates morts-vivants et passe son tour suivant.</li><li><strong>Astuce :</strong> le combat s'arrête dès que Nadaillac descend à 50 PV. Inutile de tuer ses renforts, concentre tes coups sur lui.</li><li>En mode Aventure, ses coups te font 20 % de dégâts en moins et les tiens 20 % de plus. Les paliers de 2 250, 1 500 et 50 PV ne changent pas.</li><li>En cas de défaite, le combat recommence aussitôt, PV et énergie au maximum, sans refaire la bataille navale.</li></ul></li><li>Une cinématique clôt le chapitre, puis le carton « Chapitre 4 — Rivage Perdu » s'affiche. Succès <strong>« Les castagnettes ! »</strong>.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "Chapitre 3 L'Île d'Olive Quête principale Rejoindre Itzel sur son navire et prendre la mer. Retourne à la plage d'arrivée, au sud. Le navire d'Itzel est juste à droite de ta barque. Sans la gemme, Itzel refuse de partir (« On n'a pas encore la gemme des Olympiades »). Une voile pirate surgit : c'est Nadaillac Deux Rouges , qui veut vos gemmes. Bataille navale contre son navire (voir Mini-jeux > Bataille navale contre Nadaillac ). Boss : Nadaillac Deux Rouges (abordage). Tu te bats avec Barbe-Yeux, les deux cons et Itzel. Au premier tour, il tire une balle sur chaque membre du groupe (dégâts ×1,5). Il recharge ensuite et frappe à l'épée : pendant 3 tours si vous êtes 4 debout, 2 tours si vous êtes 3, 1 seul tour sinon. Garde tout le monde en vie, il tirera moins souvent, et soigne-toi avant chaque salve. Sous 2 250 PV, il appelle 4 renforts : un Artilleur, deux Pirates de taille raisonnable et un Pirate avec un pistoulet, tous renforcés. Sous 1 500 PV, il lance une grenade fumigène et frappe 6 fois au hasard dans ton groupe. Il se soigne ensuite de 500 PV, relève 4 pirates morts-vivants et passe son tour suivant. Astuce : le combat s'arrête dès que Nadaillac descend à 50 PV. Inutile de tuer ses renforts, concentre tes coups sur lui. En mode Aventure, ses coups te font 20 % de dégâts en moins et les tiens 20 % de plus. Les paliers de 2 250, 1 500 et 50 PV ne changent pas. En cas de défaite, le combat recommence aussitôt, PV et énergie au maximum, sans refaire la bataille navale. Une cinématique clôt le chapitre, puis le carton « Chapitre 4 — Rivage Perdu » s'affiche. Succès « Les castagnettes ! » .", "sol": 0}]}, {"titre": "Quêtes secondaires", "intro": "", "entrees": [{"titre": "La commande de compotes (Callisthène le Saillant)", "html": "<p><em>Titre de fin : « Retrouver la commande de compotes de Callisthène. »</em></p><ol><li><strong>Déclencher :</strong> sur l'Île d'Olive, parle à Callisthène le Saillant, au coin nord-est de la statue du village. Accepte (<strong>Oui</strong>). Si tu refuses, il te la reproposera.</li><li><strong>Île aux Pommes :</strong> reprends ta barque (à la plage sud, choix « Embarquer ») et va sur l'Île aux Pommes. À la boutique de compotes, au nord de l'île, Barbe-Yeux parle de la commande : le navire marchand a disparu vers Morro-Blanco. L'île de Morro-Blanco est débloquée sur la carte.</li><li><strong>Morro-Blanco :</strong> depuis le débarcadère (au sud-ouest), longe la côte ouest vers le nord. Tu trouves un marchand enfermé dans une cage.</li><li>Juste au nord de la cage, un camp de bandits déclenche un combat obligatoire contre 5 ennemis : Artilleur, Pirate de taille raisonnable, Pirate avec un pistoulet, Pêcheur et Pêcheuse. Victoire : <strong>Clé de la cage</strong>.</li><li>Retourne à la cage avec la clé : le marchand te donne la <strong>Caisse de compotes</strong>.</li><li><strong>Récompense 1 :</strong> rapporte la caisse à Callisthène sur l'Île d'Olive. Tu gagnes <strong>40 000 XP</strong> et le <strong>Pagne familial</strong> (équipement des jambes, +10 DEF aux deux cons).</li><li><strong>Récompense 2 (facile à oublier) :</strong> repasse ensuite à la boutique de compotes de l'Île aux Pommes. Le vendeur te donne <strong>5 Compotes</strong>, <strong>1 Super compote</strong> (rend 150 PV et 75 % d'énergie) et <strong>10 000 XP</strong>.</li></ol><aside class=\"note\"><p>En chapitre 3, fais-la <strong>avant de gagner les Olympiades</strong> : après la victoire, ta barque ne quitte plus l'île. Sinon, l'Île d'Olive redevient accessible plus tard dans l'aventure (après le chapitre 4), et Callisthène t'y attendra.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "Chapitre 3 L'Île d'Olive Quêtes secondaires La commande de compotes (Callisthène le Saillant) Titre de fin : « Retrouver la commande de compotes de Callisthène. » Déclencher : sur l'Île d'Olive, parle à Callisthène le Saillant, au coin nord-est de la statue du village. Accepte ( Oui ). Si tu refuses, il te la reproposera. Île aux Pommes : reprends ta barque (à la plage sud, choix « Embarquer ») et va sur l'Île aux Pommes. À la boutique de compotes, au nord de l'île, Barbe-Yeux parle de la commande : le navire marchand a disparu vers Morro-Blanco. L'île de Morro-Blanco est débloquée sur la carte. Morro-Blanco : depuis le débarcadère (au sud-ouest), longe la côte ouest vers le nord. Tu trouves un marchand enfermé dans une cage. Juste au nord de la cage, un camp de bandits déclenche un combat obligatoire contre 5 ennemis : Artilleur, Pirate de taille raisonnable, Pirate avec un pistoulet, Pêcheur et Pêcheuse. Victoire : Clé de la cage . Retourne à la cage avec la clé : le marchand te donne la Caisse de compotes . Récompense 1 : rapporte la caisse à Callisthène sur l'Île d'Olive. Tu gagnes 40 000 XP et le Pagne familial (équipement des jambes, +10 DEF aux deux cons). Récompense 2 (facile à oublier) : repasse ensuite à la boutique de compotes de l'Île aux Pommes. Le vendeur te donne 5 Compotes , 1 Super compote (rend 150 PV et 75 % d'énergie) et 10 000 XP . En chapitre 3, fais-la avant de gagner les Olympiades : après la victoire, ta barque ne quitte plus l'île. Sinon, l'Île d'Olive redevient accessible plus tard dans l'aventure (après le chapitre 4), et Callisthène t'y attendra.", "sol": 0}, {"titre": "Rapporter des maquereaux à Léonidas", "html": "<p><em>Titre de fin : « Rapporter 5 maquereaux à Léonidas. »</em></p><ol><li><strong>Déclencher :</strong> parle à Léonidas, à l'est de la statue du village, vers le sud. Il demande du poisson : accepte (<strong>Oui</strong>). Tu peux aussi la déclencher après les Olympiades.</li><li><strong>Objectif :</strong> 5 <strong>Maquereaux</strong>. On en pêche sur l'Île au crabe (la plage) et sur l'Île au vent. Combinaison du maquereau : <strong>← ← → →</strong>. Chaque prise a environ 1 chance sur 3 d'être un maquereau sur l'Île au crabe (moins sur l'Île au vent, où le Coulirou mord souvent).</li><li>Ne vends pas tes maquereaux aux pêcheurs de l'Île au crabe et de l'Île au vent, qui te les rachètent.</li><li>Reviens voir Léonidas avec 5 maquereaux : <strong>30 000 XP</strong>.</li></ol><aside class=\"note\"><p>Comme pour Callisthène : après la victoire aux Olympiades, tu ne peux plus quitter l'île en chapitre 3. Si tu as déjà 5 maquereaux sur toi, tu peux la rendre à ce moment-là. Sinon, garde-la pour ton retour sur l'Île d'Olive après le chapitre 4.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "Chapitre 3 L'Île d'Olive Quêtes secondaires Rapporter des maquereaux à Léonidas Titre de fin : « Rapporter 5 maquereaux à Léonidas. » Déclencher : parle à Léonidas, à l'est de la statue du village, vers le sud. Il demande du poisson : accepte ( Oui ). Tu peux aussi la déclencher après les Olympiades. Objectif : 5 Maquereaux . On en pêche sur l'Île au crabe (la plage) et sur l'Île au vent. Combinaison du maquereau : ← ← → → . Chaque prise a environ 1 chance sur 3 d'être un maquereau sur l'Île au crabe (moins sur l'Île au vent, où le Coulirou mord souvent). Ne vends pas tes maquereaux aux pêcheurs de l'Île au crabe et de l'Île au vent, qui te les rachètent. Reviens voir Léonidas avec 5 maquereaux : 30 000 XP . Comme pour Callisthène : après la victoire aux Olympiades, tu ne peux plus quitter l'île en chapitre 3. Si tu as déjà 5 maquereaux sur toi, tu peux la rendre à ce moment-là. Sinon, garde-la pour ton retour sur l'Île d'Olive après le chapitre 4.", "sol": 0}, {"titre": "L'offre de Philoxène (à partir du chapitre 5)", "html": "<p>Cette quête se passe sur l'Île d'Olive, mais elle ne s'ouvre qu'une fois le chapitre 4 terminé : elle appartient à la période du chapitre 5. En voici l'essentiel, car elle se joue au stade des Olympiades.</p><ol><li><strong>Déclencher :</strong> à la taverne de l'Île au crabe, demande des nouvelles au tavernier. Il parle d'une offre de Philoxène : accepte.</li><li>Va voir Philoxène sur l'Île d'Olive. Il propose de payer en <strong>olives</strong> chaque épreuve rejouée au stade.</li><li>Rejoue des épreuves au stade : <strong>2 olives par épreuve terminée</strong>, +1 olive en cas de victoire ou de nouveau record, mais seulement en tendinite « 12-24 ans » ou « 25-39 ans ». La première remise d'olives termine la quête : <strong>75 % de l'XP de ton niveau en cours</strong>.</li><li>Ensuite, n'importe quel tavernier (Île au crabe, Île aux singes, Île au vent, Nassau) fabrique de l'<strong>Ol'right</strong> : 5 olives + 1 rhum, ou 5 olives + 5 écus. En combat, l'Ol'right fait régénérer 25 % d'énergie par tour à tout le groupe, pendant 4 tours.</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "Chapitre 3 L'Île d'Olive Quêtes secondaires L'offre de Philoxène (à partir du chapitre 5) Cette quête se passe sur l'Île d'Olive, mais elle ne s'ouvre qu'une fois le chapitre 4 terminé : elle appartient à la période du chapitre 5. En voici l'essentiel, car elle se joue au stade des Olympiades. Déclencher : à la taverne de l'Île au crabe, demande des nouvelles au tavernier. Il parle d'une offre de Philoxène : accepte. Va voir Philoxène sur l'Île d'Olive. Il propose de payer en olives chaque épreuve rejouée au stade. Rejoue des épreuves au stade : 2 olives par épreuve terminée , +1 olive en cas de victoire ou de nouveau record, mais seulement en tendinite « 12-24 ans » ou « 25-39 ans ». La première remise d'olives termine la quête : 75 % de l'XP de ton niveau en cours . Ensuite, n'importe quel tavernier (Île au crabe, Île aux singes, Île au vent, Nassau) fabrique de l' Ol'right : 5 olives + 1 rhum, ou 5 olives + 5 écus. En combat, l'Ol'right fait régénérer 25 % d'énergie par tour à tout le groupe, pendant 4 tours.", "sol": 0}, {"titre": "Personnages sans quête", "html": "<ul><li><strong>Eudoxie</strong> (à l'est de la statue) : athlète des Olympiades, simple dialogue.</li><li><strong>Le panneau des records</strong> (au nord du village, près du stade) : « Il n'y a rien ici pour l'instant… » avant ta victoire. Ensuite, il affiche les meilleurs temps et lancers.</li><li><strong>La statue du con</strong>, au centre du village : quand toi ou les cons passez derrière, elle vous cache. Une silhouette de couleur te montre où tu es (option « Silhouettes derrière le décor », dans Préférences &gt; Accessibilité, active par défaut). La statue change d'aspect au fil de l'aventure. Une fois le jeu terminé, elle est achevée et couronnée de laurier.</li></ul>", "id": "c3-personnages-sans-quete", "texte": "Chapitre 3 L'Île d'Olive Quêtes secondaires Personnages sans quête Eudoxie (à l'est de la statue) : athlète des Olympiades, simple dialogue. Le panneau des records (au nord du village, près du stade) : « Il n'y a rien ici pour l'instant… » avant ta victoire. Ensuite, il affiche les meilleurs temps et lancers. La statue du con , au centre du village : quand toi ou les cons passez derrière, elle vous cache. Une silhouette de couleur te montre où tu es (option « Silhouettes derrière le décor », dans Préférences > Accessibilité, active par défaut). La statue change d'aspect au fil de l'aventure. Une fois le jeu terminé, elle est achevée et couronnée de laurier.", "sol": 0}]}, {"titre": "Mini-jeux", "intro": "", "entrees": [{"titre": "Olympiades des castagnettes (Spwort)", "html": "<p><strong>Le principe.</strong> Tu ne cours pas toi-même : c'est le con (« Le con », ligne 1) qui court. Ses adversaires sont Philoxène, Eudoxie et Xénocrate. Il y a 11 épreuves, toujours dans cet ordre :</p><ul><li>3 courses de vitesse ;</li><li>3 courses de haies ;</li><li>3 lancers de boulet ;</li><li>2 courses d'endurance (400 m).</li></ul><p>À chaque épreuve, le 1er marque 3 points, le 2e 2 points, le 3e 1 point et le dernier 0. Le classement final se fait aux points. En cas d'égalité, le plus petit temps total l'emporte. Gagner les 6 courses ne suffit pas toujours : il faut aussi prendre quelques points aux lancers ou au 400 m.</p><p>Le mode Aventure ne change rien aux Olympiades : leur seule difficulté est la « tendinite ».</p><p><strong>La difficulté (« tendinite ») est le vrai secret.</strong> La première fois, les adversaires sont au niveau le plus dur, « 12-24 ans ». Si tu perds, choisis <strong>« Changer la tendinite »</strong> sur l'écran du classement final :</p><ul><li>« 25-39 ans » : adversaires un peu plus lents, lancers adverses un peu moins puissants ;</li><li>« 40-59 ans » : plus lents encore, lancers plus faibles ;</li><li>« 60 ans et + » : nettement plus lents, lancers adverses environ deux fois plus courts.</li></ul><p>La récompense reste la même quel que soit le niveau. Tu peux ensuite rejouer seulement les épreuves perdues : les autres résultats sont gardés.</p><p><strong>Courses de vitesse et de haies</strong></p><ul><li>Martèle <strong>une seule touche</strong> (pas Espace) dès le « Partez ! ». La première touche pressée est verrouillée pour toute la course.</li><li>Il faut un rythme soutenu : environ <strong>7 appuis par seconde</strong> pour gagner en « 12-24 ans », environ 6,5 en « 25-39 ans », 6 en « 40-59 ans », 5,5 en « 60 ans et + ».</li><li>À la manette, tous les boutons de face, épaules et gâchettes comptent comme une seule touche : alterne deux doigts sur deux boutons. A ne compte pas pendant les haies.</li><li><strong>Haies :</strong> Espace ne fait pas sauter le con. Il fonce à travers les haies, les casse et ne ralentit pas, alors que ses adversaires perdent un peu de vitesse à chaque saut. Espace ne sert qu'à faire hurler Barbe-Yeux : concentre-toi sur le martèlement.</li></ul><p><strong>Lancer de boulet</strong></p><ol><li><strong>Puissance :</strong> martèle une touche pendant 2 secondes. La jauge se remplit de 1/16 par appui : 16 appuis donnent la puissance maximale.</li><li><strong>Visée :</strong> l'aiguille balaie l'arc, aller-retour, en 0,7 seconde par sens. Appuie sur <strong>Espace quand elle est pile au milieu de sa course</strong> (60°). À ±2°, tu obtiens « Parfait ». Plus tu t'éloignes du milieu, plus le lancer est court. Au-delà de 90°, le boulet part en arrière et compte pour 0 m.</li><li>Marge pour gagner avec une puissance maximale :<ul><li>« 12-24 ans » : environ ±9° au 1er lancer, ±4 à 5° aux 2e et 3e (meilleurs lancers adverses : 27,8 m, 30,4 m, 30,8 m) ;</li><li>« 25-39 ans » : environ ±10° ;</li><li>« 40-59 ans » : environ ±16° ;</li><li>« 60 ans et + » : environ ±33°.</li></ul></li></ol><p><strong>Course d'endurance (400 m)</strong></p><ul><li>Appuie en cadence (Espace marche aussi). Chaque appui fait monter le curseur de rythme, qui redescend tout seul.</li><li>Zone <strong>bleue</strong> : vitesse de croisière, sans fatigue. Pour y rester, il faut environ 2 appuis par seconde.</li><li>Zone <strong>rouge</strong> : plus rapide, mais vide la barre d'endurance. Curseur tout en haut, la barre se vide en 10 secondes environ. Si elle est vide, le con ralentit nettement jusqu'à l'arrivée et court plus lentement qu'en zone bleue.</li><li>Sous le bleu (zone verte), la barre se recharge lentement, mais le con avance beaucoup moins vite.</li><li>Le rouge fait gagner la même avance pour la même quantité d'endurance, que tu sois juste au-dessus du bleu ou tout en haut. Ce qui compte, c'est que la barre soit <strong>vide pile sur la ligne d'arrivée</strong>, jamais avant.</li><li><strong>Méthode :</strong><ol><li>Au départ, martèle vite pour atteindre le bleu en 1 à 2 secondes : chaque seconde passée dans le vert coûte cher.</li><li>Tiens le bleu jusqu'à un peu plus de la moitié du parcours (environ 23 secondes de course).</li><li>Monte alors tout en haut du rouge et restes-y jusqu'à l'arrivée.</li></ol></li><li>Chances selon la tendinite (les deux courses de 400 m sont maintenant gagnables) :<ul><li>« 12-24 ans » : une course quasi parfaite fait environ 34,2 s, contre 34,3 s pour les meilleurs adversaires. Ça se joue à un dixième de seconde ;</li><li>« 25-39 ans » : environ une demi-seconde de marge ;</li><li>« 40-59 ans » : environ une seconde de marge ;</li><li>« 60 ans et + » : rester en bleu tout du long suffit, de justesse, à condition d'atteindre le bleu très vite au départ. Sinon, garde un peu de rouge pour la fin.</li></ul></li></ul><p><strong>Après la victoire :</strong> l'entrée du stade ouvre directement le panneau des épreuves. Tu y choisis la difficulté (et un mode « total wipeout » aux adversaires aléatoires), puis tu rejoues tout, un groupe ou une épreuve. Le panneau des records garde tes meilleures performances. À partir du chapitre 5, ces épreuves peuvent aussi rapporter des olives (voir « L'offre de Philoxène »).</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "Chapitre 3 L'Île d'Olive Mini-jeux Olympiades des castagnettes (Spwort) Le principe. Tu ne cours pas toi-même : c'est le con (« Le con », ligne 1) qui court. Ses adversaires sont Philoxène, Eudoxie et Xénocrate. Il y a 11 épreuves, toujours dans cet ordre : 3 courses de vitesse ; 3 courses de haies ; 3 lancers de boulet ; 2 courses d'endurance (400 m). À chaque épreuve, le 1er marque 3 points, le 2e 2 points, le 3e 1 point et le dernier 0. Le classement final se fait aux points. En cas d'égalité, le plus petit temps total l'emporte. Gagner les 6 courses ne suffit pas toujours : il faut aussi prendre quelques points aux lancers ou au 400 m. Le mode Aventure ne change rien aux Olympiades : leur seule difficulté est la « tendinite ». La difficulté (« tendinite ») est le vrai secret. La première fois, les adversaires sont au niveau le plus dur, « 12-24 ans ». Si tu perds, choisis « Changer la tendinite » sur l'écran du classement final : « 25-39 ans » : adversaires un peu plus lents, lancers adverses un peu moins puissants ; « 40-59 ans » : plus lents encore, lancers plus faibles ; « 60 ans et + » : nettement plus lents, lancers adverses environ deux fois plus courts. La récompense reste la même quel que soit le niveau. Tu peux ensuite rejouer seulement les épreuves perdues : les autres résultats sont gardés. Courses de vitesse et de haies Martèle une seule touche (pas Espace) dès le « Partez ! ». La première touche pressée est verrouillée pour toute la course. Il faut un rythme soutenu : environ 7 appuis par seconde pour gagner en « 12-24 ans », environ 6,5 en « 25-39 ans », 6 en « 40-59 ans », 5,5 en « 60 ans et + ». À la manette, tous les boutons de face, épaules et gâchettes comptent comme une seule touche : alterne deux doigts sur deux boutons. A ne compte pas pendant les haies. Haies : Espace ne fait pas sauter le con. Il fonce à travers les haies, les casse et ne ralentit pas, alors que ses adversaires perdent un peu de vitesse à chaque saut. Espace ne sert qu'à faire hurler Barbe-Yeux : concentre-toi sur le martèlement. Lancer de boulet Puissance : martèle une touche pendant 2 secondes. La jauge se remplit de 1/16 par appui : 16 appuis donnent la puissance maximale. Visée : l'aiguille balaie l'arc, aller-retour, en 0,7 seconde par sens. Appuie sur Espace quand elle est pile au milieu de sa course (60°). À ±2°, tu obtiens « Parfait ». Plus tu t'éloignes du milieu, plus le lancer est court. Au-delà de 90°, le boulet part en arrière et compte pour 0 m. Marge pour gagner avec une puissance maximale : « 12-24 ans » : environ ±9° au 1er lancer, ±4 à 5° aux 2e et 3e (meilleurs lancers adverses : 27,8 m, 30,4 m, 30,8 m) ; « 25-39 ans » : environ ±10° ; « 40-59 ans » : environ ±16° ; « 60 ans et + » : environ ±33°. Course d'endurance (400 m) Appuie en cadence (Espace marche aussi). Chaque appui fait monter le curseur de rythme, qui redescend tout seul. Zone bleue : vitesse de croisière, sans fatigue. Pour y rester, il faut environ 2 appuis par seconde. Zone rouge : plus rapide, mais vide la barre d'endurance. Curseur tout en haut, la barre se vide en 10 secondes environ. Si elle est vide, le con ralentit nettement jusqu'à l'arrivée et court plus lentement qu'en zone bleue. Sous le bleu (zone verte), la barre se recharge lentement, mais le con avance beaucoup moins vite. Le rouge fait gagner la même avance pour la même quantité d'endurance, que tu sois juste au-dessus du bleu ou tout en haut. Ce qui compte, c'est que la barre soit vide pile sur la ligne d'arrivée , jamais avant. Méthode : Au départ, martèle vite pour atteindre le bleu en 1 à 2 secondes : chaque seconde passée dans le vert coûte cher. Tiens le bleu jusqu'à un peu plus de la moitié du parcours (environ 23 secondes de course). Monte alors tout en haut du rouge et restes-y jusqu'à l'arrivée. Chances selon la tendinite (les deux courses de 400 m sont maintenant gagnables) : « 12-24 ans » : une course quasi parfaite fait environ 34,2 s, contre 34,3 s pour les meilleurs adversaires. Ça se joue à un dixième de seconde ; « 25-39 ans » : environ une demi-seconde de marge ; « 40-59 ans » : environ une seconde de marge ; « 60 ans et + » : rester en bleu tout du long suffit, de justesse, à condition d'atteindre le bleu très vite au départ. Sinon, garde un peu de rouge pour la fin. Après la victoire : l'entrée du stade ouvre directement le panneau des épreuves. Tu y choisis la difficulté (et un mode « total wipeout » aux adversaires aléatoires), puis tu rejoues tout, un groupe ou une épreuve. Le panneau des records garde tes meilleures performances. À partir du chapitre 5, ces épreuves peuvent aussi rapporter des olives (voir « L'offre de Philoxène »).", "sol": 0}, {"titre": "Bataille navale contre Nadaillac", "html": "<p>Tu pilotes le navire d'Itzel, en bas de l'écran, contre celui de Nadaillac, en haut. Le mode Aventure ne change rien à cette bataille.</p><ul><li><strong>Coque :</strong> 40 points pour toi, 100 pour Nadaillac.</li><li><strong>Déplacement :</strong> gauche et droite.</li><li><strong>Compétences :</strong><ol><li><strong>Canon</strong> : 6 boulets tirés droit devant, 1 point de dégât par boulet qui touche la coque, recharge 3 s.</li><li><strong>Boulets à chaîne</strong> : appuie, puis clique sur une des trois trajectoires (gauche, tout droit, droite). Ils visent les voiles : chaque touche fait 1 dégât et ralentit Nadaillac de 10 % pendant 10 s (jauge « VIT »). Recharge 3 s.</li><li><strong>Vitesse</strong> : déplacement doublé pendant 10 s, recharge 30 s.</li><li><strong>Réparation</strong> : +20 points de coque, recharge 30 s.</li></ol></li></ul><p>Chaque coup que tu portes réduit d'1 seconde la recharge de la vitesse et de la réparation.</p><ul><li><strong>À la manette :</strong> croix ou stick gauche pour te déplacer. A = canon, Y = boulets à chaîne, B = vitesse, X = réparation. Pour viser les chaînes : X à gauche, A tout droit, Y à droite, B pour annuler. Pendant les barils, A tire là où se trouve le viseur.</li><li><strong>Ses tirs :</strong> environ toutes les 3 s, quand il est aligné sur toi, il tire 12 boulets (1 dégât chacun). Décale-toi dès qu'il se place en face.</li><li><strong>Astuce :</strong> ralentis-le avec les chaînes (touche 2), puis enchaîne les salves de canon pendant qu'il est lent.</li><li><strong>Phases scénarisées :</strong><ul><li>à 75 : 3 lieutenants (10 points chacun) remplacent Nadaillac, chaînes indisponibles ; ils repartent au bout de 60 s ;</li><li>à 50 : <strong>barils de poudre</strong>. Après un compte à rebours de 3 s, des barils tombent pendant 10 s sur 5 couloirs. Tes canons sont bloqués : clique sur les barils pour les abattre au pistolet (30 balles). Un baril qui touche ton navire fait 5 dégâts : abats en priorité ceux de ton couloir et esquive les autres ;</li><li>à 25 : 5 lieutenants plus rapides ;</li><li>à 10 : dernière salve de barils.</li></ul></li><li><strong>Si tu coules :</strong> la bataille recommence. Après 3 défaites, tu peux choisir « Abandonner : subir l'abordage. ». L'histoire continue, mais tout ton groupe commence le combat contre Nadaillac avec la moitié de ses PV.</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "Chapitre 3 L'Île d'Olive Mini-jeux Bataille navale contre Nadaillac Tu pilotes le navire d'Itzel, en bas de l'écran, contre celui de Nadaillac, en haut. Le mode Aventure ne change rien à cette bataille. Coque : 40 points pour toi, 100 pour Nadaillac. Déplacement : gauche et droite. Compétences : Canon : 6 boulets tirés droit devant, 1 point de dégât par boulet qui touche la coque, recharge 3 s. Boulets à chaîne : appuie, puis clique sur une des trois trajectoires (gauche, tout droit, droite). Ils visent les voiles : chaque touche fait 1 dégât et ralentit Nadaillac de 10 % pendant 10 s (jauge « VIT »). Recharge 3 s. Vitesse : déplacement doublé pendant 10 s, recharge 30 s. Réparation : +20 points de coque, recharge 30 s. Chaque coup que tu portes réduit d'1 seconde la recharge de la vitesse et de la réparation. À la manette : croix ou stick gauche pour te déplacer. A = canon, Y = boulets à chaîne, B = vitesse, X = réparation. Pour viser les chaînes : X à gauche, A tout droit, Y à droite, B pour annuler. Pendant les barils, A tire là où se trouve le viseur. Ses tirs : environ toutes les 3 s, quand il est aligné sur toi, il tire 12 boulets (1 dégât chacun). Décale-toi dès qu'il se place en face. Astuce : ralentis-le avec les chaînes (touche 2), puis enchaîne les salves de canon pendant qu'il est lent. Phases scénarisées : à 75 : 3 lieutenants (10 points chacun) remplacent Nadaillac, chaînes indisponibles ; ils repartent au bout de 60 s ; à 50 : barils de poudre . Après un compte à rebours de 3 s, des barils tombent pendant 10 s sur 5 couloirs. Tes canons sont bloqués : clique sur les barils pour les abattre au pistolet (30 balles). Un baril qui touche ton navire fait 5 dégâts : abats en priorité ceux de ton couloir et esquive les autres ; à 25 : 5 lieutenants plus rapides ; à 10 : dernière salve de barils. Si tu coules : la bataille recommence. Après 3 défaites, tu peux choisir « Abandonner : subir l'abordage. ». L'histoire continue, mais tout ton groupe commence le combat contre Nadaillac avec la moitié de ses PV.", "sol": 0}]}, {"titre": "À ne pas rater", "intro": "", "entrees": [{"titre": "À ne pas rater", "html": "<ul><li><strong>Point de non-retour :</strong> après la victoire aux Olympiades, ta barque est bloquée. Monter sur le navire d'Itzel lance la fin du chapitre, sans retour possible. Les quêtes de Callisthène et de Léonidas restent faisables après le chapitre 4, quand l'Île d'Olive redevient accessible.</li><li><strong>Récompense cachée des compotes :</strong> après avoir récupéré la caisse, repasse à la boutique de l'Île aux Pommes (5 Compotes, 1 Super compote, 10 000 XP).</li><li><strong>Garde 5 maquereaux</strong> sur toi en arrivant sur l'Île d'Olive : tu pourras rendre la quête de Léonidas tout de suite.</li><li><strong>Objets clés du chapitre :</strong> 3ème gemme des Bolon Tiku (Olympiades), Clé de la cage puis Caisse de compotes (quête de Callisthène), Pagne familial (récompense de Callisthène).</li><li>Pas de coffre sur l'Île d'Olive.</li><li><strong>Succès du chapitre :</strong><ul><li><strong>« Les castagnettes ! »</strong> : terminer le chapitre 3.</li><li><strong>« Panem et circenses »</strong> : marquer 32 points dans une même compétition de Spwort. Il faut gagner les 11 épreuves (33 points), ou 10 victoires et une 2e place. Le score n'est vérifié qu'à la fin d'une compétition complète (première partie ou « Tout recommencer » / « Tout refaire »), pas après avoir rejoué une seule épreuve ou un groupe. Le plus simple : règle la tendinite sur « 60 ans et + » et refais tout.</li><li>Les quêtes de Callisthène et de Léonidas comptent pour <strong>« L'homme à tout faire »</strong> (toutes les quêtes secondaires), tout comme « L'offre de Philoxène », plus tard.</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "Chapitre 3 L'Île d'Olive À ne pas rater À ne pas rater Point de non-retour : après la victoire aux Olympiades, ta barque est bloquée. Monter sur le navire d'Itzel lance la fin du chapitre, sans retour possible. Les quêtes de Callisthène et de Léonidas restent faisables après le chapitre 4, quand l'Île d'Olive redevient accessible. Récompense cachée des compotes : après avoir récupéré la caisse, repasse à la boutique de l'Île aux Pommes (5 Compotes, 1 Super compote, 10 000 XP). Garde 5 maquereaux sur toi en arrivant sur l'Île d'Olive : tu pourras rendre la quête de Léonidas tout de suite. Objets clés du chapitre : 3ème gemme des Bolon Tiku (Olympiades), Clé de la cage puis Caisse de compotes (quête de Callisthène), Pagne familial (récompense de Callisthène). Pas de coffre sur l'Île d'Olive. Succès du chapitre : « Les castagnettes ! » : terminer le chapitre 3. « Panem et circenses » : marquer 32 points dans une même compétition de Spwort. Il faut gagner les 11 épreuves (33 points), ou 10 victoires et une 2e place. Le score n'est vérifié qu'à la fin d'une compétition complète (première partie ou « Tout recommencer » / « Tout refaire »), pas après avoir rejoué une seule épreuve ou un groupe. Le plus simple : règle la tendinite sur « 60 ans et + » et refais tout. Les quêtes de Callisthène et de Léonidas comptent pour « L'homme à tout faire » (toutes les quêtes secondaires), tout comme « L'offre de Philoxène », plus tard.", "sol": 0}]}]}], "en": [{"id": "c3", "num": "Chapter 3", "titre": "Olive Island", "intro": "<p>The cliff monster is defeated: Itzel follows a new lead to Olive Island, an island of muscular and scantily clad philosophers. You are looking for a Bolon Tiku gem there, which you'll have to win at the Castanet Olympiads with the (very relative) help of one of the Two Numpties. The trip back on board won't be a quiet one.</p>", "sections": [{"titre": "Main quest", "intro": "", "entrees": [{"titre": "Join Itzel on her ship.", "html": "<p>(Quest title: “Windward Island”. This step links up with the end of chapter 2, whose walkthrough also describes it.)</p><ol><li>On Windward Island, go to Itzel's ship, moored in the south-east of the island, east of the fisherwoman.</li><li>Two conditions before leaving:<ul><li>the Two Numpties must be with you. If you left them at the foot of cave 3 (the Numpties' ladder), Itzel points it out: go back and get them;</li><li>they have sunburn. You need to apply some <strong>Coulirou grease</strong> to them (“Apply some Coulirou grease to them” choice), otherwise “The Two Numpties are in no state to travel.” An application at the boat also counts.</li></ul></li><li>Itzel asks: “Travel to Olive Island?” Answer <strong>Yes</strong>. The voyage starts on its own and the “Chapter 3 — Olive Island” title card appears.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "Chapter 3 Olive Island Main quest Join Itzel on her ship. (Quest title: “Windward Island”. This step links up with the end of chapter 2, whose walkthrough also describes it.) On Windward Island, go to Itzel's ship, moored in the south-east of the island, east of the fisherwoman. Two conditions before leaving: the Two Numpties must be with you. If you left them at the foot of cave 3 (the Numpties' ladder), Itzel points it out: go back and get them; they have sunburn. You need to apply some Coulirou grease to them (“Apply some Coulirou grease to them” choice), otherwise “The Two Numpties are in no state to travel.” An application at the boat also counts. Itzel asks: “Travel to Olive Island?” Answer Yes . The voyage starts on its own and the “Chapter 3 — Olive Island” title card appears.", "sol": 0}, {"titre": "Travel to Olive Island with Itzel", "html": "<ol><li>When you arrive, Itzel stays on board to keep an eye on a suspicious sail. You land alone with the Two Numpties, on the beach in the south of the island.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "Chapter 3 Olive Island Main quest Travel to Olive Island with Itzel When you arrive, Itzel stays on board to keep an eye on a suspicious sail. You land alone with the Two Numpties, on the beach in the south of the island.", "sol": 0}, {"titre": "Find information about a possible gem", "html": "<ol><li>Head north from the beach: a scene starts on its own. A naked old man crosses the screen one way and then the other, with a crab clamped onto a sensitive spot. His cries for help are shown in a bubble that stays at the edge of the screen when he goes out of view.</li><li>Wait about 20 seconds (three round trips). The <strong>Step in</strong> button then appears at the bottom of the screen: click it or press the interact key.</li><li><strong>Boss: the King of Crabs</strong> (300 HP, hits hard but has no special mechanic). You fight with Barbe-Yeux and the Two Numpties. Victory: 2 000 XP. In Adventure mode, as in every fight, you take 20% less damage and deal 20% more.</li><li>The old man introduces himself: he is <strong>Philoxène Long-Rameau</strong>, a sort of chief of the island (he doesn't like the word). He waits for you in the village.</li><li>Go to the village, in the centre of the island (around the big statue of the Numpty). Philoxène is east-south-east of the statue. Talk to him: he explains that the gem goes to the winner of the Castanet Olympiads.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "Chapter 3 Olive Island Main quest Find information about a possible gem Head north from the beach: a scene starts on its own. A naked old man crosses the screen one way and then the other, with a crab clamped onto a sensitive spot. His cries for help are shown in a bubble that stays at the edge of the screen when he goes out of view. Wait about 20 seconds (three round trips). The Step in button then appears at the bottom of the screen: click it or press the interact key. Boss: the King of Crabs (300 HP, hits hard but has no special mechanic). You fight with Barbe-Yeux and the Two Numpties. Victory: 2 000 XP. In Adventure mode, as in every fight, you take 20% less damage and deal 20% more. The old man introduces himself: he is Philoxène Long-Rameau , a sort of chief of the island (he doesn't like the word). He waits for you in the village. Go to the village, in the centre of the island (around the big statue of the Numpty). Philoxène is east-south-east of the statue. Talk to him: he explains that the gem goes to the winner of the Castanet Olympiads.", "sol": 0}, {"titre": "Sign up for the Olympiads", "html": "<ol><li>Go to the registration stand, north-east of the village statue. It stays closed until you have talked to Philoxène.</li><li>Barbe-Yeux signs up one of the Two Numpties without asking. The Numpty will be in “lane number 1”.</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "Chapter 3 Olive Island Main quest Sign up for the Olympiads Go to the registration stand, north-east of the village statue. It stays closed until you have talked to Philoxène. Barbe-Yeux signs up one of the Two Numpties without asking. The Numpty will be in “lane number 1”.", "sol": 0}, {"titre": "Take part in the Olympiads (and win them!)", "html": "<ol><li>The stadium is at the far north of the island. Before you register, the entrance is blocked (“You cannot enter the premises yet.”, then “You need to register first.”).</li><li>At the entrance, choose <strong>Yes</strong> to “Join the Olympiads?”. “Not yet” lets you leave.</li><li>The announcer's opening speech only plays on your first visit. The 11 events then follow one after another (see <strong>Mini-games &gt; Castanet Olympiads</strong>).</li><li>You have to finish <strong>first in the final ranking</strong>, with the most points.</li><li>If you fail, the ranking screen lets you start everything again, change the difficulty (“Change the tendinitis”) or replay just one group of events or a single event. The other results are kept. If you leave the Olympiads partway through, you start them again from the beginning on your next visit.</li><li>Victory: Philoxène hands you the <strong>3rd Bolon Tiku gem</strong> and <strong>50 000 XP</strong>.</li></ol><aside class=\"note\"><p><strong>Watch out, point of no return ahead.</strong> Once the Olympiads are won, your boat won't leave any more (“I'm not putting to sea that way…”). The only way out is Itzel's ship, which starts the end of the chapter. First finish whatever you want to do on the island (see Side quests).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "Chapter 3 Olive Island Main quest Take part in the Olympiads (and win them!) The stadium is at the far north of the island. Before you register, the entrance is blocked (“You cannot enter the premises yet.”, then “You need to register first.”). At the entrance, choose Yes to “Join the Olympiads?”. “Not yet” lets you leave. The announcer's opening speech only plays on your first visit. The 11 events then follow one after another (see Mini-games > Castanet Olympiads ). You have to finish first in the final ranking , with the most points. If you fail, the ranking screen lets you start everything again, change the difficulty (“Change the tendinitis”) or replay just one group of events or a single event. The other results are kept. If you leave the Olympiads partway through, you start them again from the beginning on your next visit. Victory: Philoxène hands you the 3rd Bolon Tiku gem and 50 000 XP . Watch out, point of no return ahead. Once the Olympiads are won, your boat won't leave any more (“I'm not putting to sea that way…”). The only way out is Itzel's ship, which starts the end of the chapter. First finish whatever you want to do on the island (see Side quests).", "sol": 0}, {"titre": "Join Itzel on her ship and set sail.", "html": "<ol><li>Go back to the landing beach, in the south. Itzel's ship is just right of your boat. Without the gem, Itzel refuses to leave (“We don't have the Olympiad gem yet.”).</li><li>A pirate sail appears: it's <strong>Nadaillac Deux Rouges</strong>, who wants your gems.</li><li><strong>Naval battle</strong> against his ship (see <strong>Mini-games &gt; Naval battle against Nadaillac</strong>).</li><li><strong>Boss: Nadaillac Deux Rouges</strong> (boarding). You fight with Barbe-Yeux, the Two Numpties and Itzel.<ul><li>On the first turn, he fires a bullet at each member of the party (damage ×1.5). He then reloads and strikes with his sword: for 3 turns if 4 of you are standing, 2 turns if there are 3 of you, only 1 turn otherwise. Keep everyone alive and he'll shoot less often; heal before each volley.</li><li>Below 2 250 HP, he calls 4 reinforcements: a Gunner, two Reasonably sized pirates and a PiratE with a pistol, all strengthened.</li><li>Below 1 500 HP, he throws a smoke grenade and strikes 6 times at random in your party. He then heals himself for 500 HP, raises 4 undead pirates and skips his next turn.</li><li><strong>Tip:</strong> the fight stops as soon as Nadaillac drops to 50 HP. No need to kill his reinforcements; focus your attacks on him.</li><li>In Adventure mode, his attacks do 20% less damage to you and yours do 20% more. The 2 250, 1 500 and 50 HP thresholds don't change.</li><li>If you lose, the fight restarts at once, with full HP and energy, without redoing the naval battle.</li></ul></li><li>A cutscene closes the chapter, then the “Chapter 4 — Lost Shore” title card appears. <strong>“The castanets!”</strong> achievement.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "Chapter 3 Olive Island Main quest Join Itzel on her ship and set sail. Go back to the landing beach, in the south. Itzel's ship is just right of your boat. Without the gem, Itzel refuses to leave (“We don't have the Olympiad gem yet.”). A pirate sail appears: it's Nadaillac Deux Rouges , who wants your gems. Naval battle against his ship (see Mini-games > Naval battle against Nadaillac ). Boss: Nadaillac Deux Rouges (boarding). You fight with Barbe-Yeux, the Two Numpties and Itzel. On the first turn, he fires a bullet at each member of the party (damage ×1.5). He then reloads and strikes with his sword: for 3 turns if 4 of you are standing, 2 turns if there are 3 of you, only 1 turn otherwise. Keep everyone alive and he'll shoot less often; heal before each volley. Below 2 250 HP, he calls 4 reinforcements: a Gunner, two Reasonably sized pirates and a PiratE with a pistol, all strengthened. Below 1 500 HP, he throws a smoke grenade and strikes 6 times at random in your party. He then heals himself for 500 HP, raises 4 undead pirates and skips his next turn. Tip: the fight stops as soon as Nadaillac drops to 50 HP. No need to kill his reinforcements; focus your attacks on him. In Adventure mode, his attacks do 20% less damage to you and yours do 20% more. The 2 250, 1 500 and 50 HP thresholds don't change. If you lose, the fight restarts at once, with full HP and energy, without redoing the naval battle. A cutscene closes the chapter, then the “Chapter 4 — Lost Shore” title card appears. “The castanets!” achievement.", "sol": 0}]}, {"titre": "Side quests", "intro": "", "entrees": [{"titre": "The compote order (Callisthène le Saillant)", "html": "<p><em>Final title: “Find Callisthène's compote order.”</em></p><ol><li><strong>Trigger:</strong> on Olive Island, talk to Callisthène le Saillant, at the north-east corner of the village statue. Accept (<strong>Yes</strong>). If you refuse, he'll offer it again.</li><li><strong>Apple Island:</strong> take your boat again (on the south beach, “Board” choice) and go to Apple Island. At the compote shop, in the north of the island, Barbe-Yeux brings up the order: the merchant ship disappeared towards Morro-Blanco. Morro-Blanco is unlocked on the map.</li><li><strong>Morro-Blanco:</strong> from the landing point (in the south-west), follow the west coast north. You find a merchant locked in a cage.</li><li>Just north of the cage, a bandit camp triggers a mandatory fight against 5 enemies: Gunner, Reasonably sized pirate, PiratE with a pistol, Fisherman and Fisherwoman. Victory: <strong>Cage key</strong>.</li><li>Go back to the cage with the key: the merchant gives you the <strong>Crate of compotes</strong>.</li><li><strong>Reward 1:</strong> bring the crate back to Callisthène on Olive Island. You get <strong>40 000 XP</strong> and the <strong>Family loincloth</strong> (leg equipment, +10 DEF for the Two Numpties).</li><li><strong>Reward 2 (easy to forget):</strong> then drop by the compote shop on Apple Island again. The seller gives you <strong>5 Compotes</strong>, <strong>1 Super compote</strong> (restores 150 HP and 75% energy) and <strong>10 000 XP</strong>.</li></ol><aside class=\"note\"><p>In chapter 3, do it <strong>before winning the Olympiads</strong>: after the victory, your boat won't leave the island any more. Otherwise, Olive Island becomes accessible again later in the adventure (after chapter 4), and Callisthène will be waiting for you there.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "Chapter 3 Olive Island Side quests The compote order (Callisthène le Saillant) Final title: “Find Callisthène's compote order.” Trigger: on Olive Island, talk to Callisthène le Saillant, at the north-east corner of the village statue. Accept ( Yes ). If you refuse, he'll offer it again. Apple Island: take your boat again (on the south beach, “Board” choice) and go to Apple Island. At the compote shop, in the north of the island, Barbe-Yeux brings up the order: the merchant ship disappeared towards Morro-Blanco. Morro-Blanco is unlocked on the map. Morro-Blanco: from the landing point (in the south-west), follow the west coast north. You find a merchant locked in a cage. Just north of the cage, a bandit camp triggers a mandatory fight against 5 enemies: Gunner, Reasonably sized pirate, PiratE with a pistol, Fisherman and Fisherwoman. Victory: Cage key . Go back to the cage with the key: the merchant gives you the Crate of compotes . Reward 1: bring the crate back to Callisthène on Olive Island. You get 40 000 XP and the Family loincloth (leg equipment, +10 DEF for the Two Numpties). Reward 2 (easy to forget): then drop by the compote shop on Apple Island again. The seller gives you 5 Compotes , 1 Super compote (restores 150 HP and 75% energy) and 10 000 XP . In chapter 3, do it before winning the Olympiads : after the victory, your boat won't leave the island any more. Otherwise, Olive Island becomes accessible again later in the adventure (after chapter 4), and Callisthène will be waiting for you there.", "sol": 0}, {"titre": "Bring some mackerel to Léonidas.", "html": "<p><em>Final title: “Bring 5 mackerel to Léonidas.”</em></p><ol><li><strong>Trigger:</strong> talk to Léonidas, east of the village statue, towards the south. He asks for fish: accept (<strong>Yes</strong>). You can also trigger it after the Olympiads.</li><li><strong>Objective:</strong> 5 <strong>Mackerel</strong>. You can catch them on Crab Island (the beach) and on Windward Island. Mackerel combination: <strong>← ← → →</strong>. Each catch has about a 1 in 3 chance of being a mackerel on Crab Island (less on Windward Island, where the Coulirou often bites).</li><li>Don't sell your mackerel to the fishermen on Crab Island and Windward Island, who buy them from you.</li><li>Come back to Léonidas with 5 mackerel: <strong>30 000 XP</strong>.</li></ol><aside class=\"note\"><p>As with Callisthène: after winning the Olympiads, you can no longer leave the island in chapter 3. If you already have 5 mackerel on you, you can hand it in then. Otherwise, keep it for your return to Olive Island after chapter 4.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "Chapter 3 Olive Island Side quests Bring some mackerel to Léonidas. Final title: “Bring 5 mackerel to Léonidas.” Trigger: talk to Léonidas, east of the village statue, towards the south. He asks for fish: accept ( Yes ). You can also trigger it after the Olympiads. Objective: 5 Mackerel . You can catch them on Crab Island (the beach) and on Windward Island. Mackerel combination: ← ← → → . Each catch has about a 1 in 3 chance of being a mackerel on Crab Island (less on Windward Island, where the Coulirou often bites). Don't sell your mackerel to the fishermen on Crab Island and Windward Island, who buy them from you. Come back to Léonidas with 5 mackerel: 30 000 XP . As with Callisthène: after winning the Olympiads, you can no longer leave the island in chapter 3. If you already have 5 mackerel on you, you can hand it in then. Otherwise, keep it for your return to Olive Island after chapter 4.", "sol": 0}, {"titre": "Philoxène's offer (from chapter 5)", "html": "<p>This quest takes place on Olive Island, but it only opens once chapter 4 is finished: it belongs to the chapter 5 period. Here are the essentials, since it is played at the Olympiads stadium.</p><ol><li><strong>Trigger:</strong> at the Crab Island tavern, ask the innkeeper for news. He mentions an offer from Philoxène: accept.</li><li>Go and see Philoxène on Olive Island. He offers to pay you in <strong>olives</strong> for each event you replay at the stadium.</li><li>Replay events at the stadium: <strong>2 olives per event completed</strong>, +1 olive for a win or a new record, but only at “Ages 12-24” or “Ages 25-39” tendinitis. The first olive payout completes the quest: <strong>75% of the XP for your current level</strong>.</li><li>After that, any innkeeper (Crab Island, Monkey Island, Windward Island, Nassau) makes <strong>Ol'right</strong>: 5 olives + 1 rum, or 5 olives + 5 coins. In battle, Ol'right makes the whole party regenerate 25% energy per turn, for 4 turns.</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "Chapter 3 Olive Island Side quests Philoxène's offer (from chapter 5) This quest takes place on Olive Island, but it only opens once chapter 4 is finished: it belongs to the chapter 5 period. Here are the essentials, since it is played at the Olympiads stadium. Trigger: at the Crab Island tavern, ask the innkeeper for news. He mentions an offer from Philoxène: accept. Go and see Philoxène on Olive Island. He offers to pay you in olives for each event you replay at the stadium. Replay events at the stadium: 2 olives per event completed , +1 olive for a win or a new record, but only at “Ages 12-24” or “Ages 25-39” tendinitis. The first olive payout completes the quest: 75% of the XP for your current level . After that, any innkeeper (Crab Island, Monkey Island, Windward Island, Nassau) makes Ol'right : 5 olives + 1 rum, or 5 olives + 5 coins. In battle, Ol'right makes the whole party regenerate 25% energy per turn, for 4 turns.", "sol": 0}, {"titre": "Characters without a quest", "html": "<ul><li><strong>Eudoxie</strong> (east of the statue): an Olympiads athlete, dialogue only.</li><li><strong>The records board</strong> (north of the village, near the stadium): “There's nothing here for now...” before your victory. After that, it shows the best times and throws.</li><li><strong>The statue of the Numpty</strong>, in the centre of the village: when you or the Numpties walk behind it, it hides you. A coloured silhouette shows you where you are (“Silhouettes behind scenery” option, in Preferences &gt; Accessibility, on by default). The statue changes appearance as the adventure goes on. Once the game is finished, it is completed and crowned with laurels.</li></ul>", "id": "c3-personnages-sans-quete", "texte": "Chapter 3 Olive Island Side quests Characters without a quest Eudoxie (east of the statue): an Olympiads athlete, dialogue only. The records board (north of the village, near the stadium): “There's nothing here for now...” before your victory. After that, it shows the best times and throws. The statue of the Numpty , in the centre of the village: when you or the Numpties walk behind it, it hides you. A coloured silhouette shows you where you are (“Silhouettes behind scenery” option, in Preferences > Accessibility, on by default). The statue changes appearance as the adventure goes on. Once the game is finished, it is completed and crowned with laurels.", "sol": 0}]}, {"titre": "Mini-games", "intro": "", "entrees": [{"titre": "Castanet Olympiads (Spwort)", "html": "<p><strong>The idea.</strong> You don't run yourself: the Numpty (“The Numpty”, lane 1) does the running. His opponents are Philoxène, Eudoxie and Xénocrate. There are 11 events, always in this order:</p><ul><li>3 sprints;</li><li>3 hurdle races;</li><li>3 cannonball throws;</li><li>2 endurance races (400 m).</li></ul><p>In each event, 1st place scores 3 points, 2nd 2 points, 3rd 1 point and last 0. The final ranking is on points. In case of a tie, the lowest total time wins. Winning all 6 races isn't always enough: you also need to pick up a few points in the throws or the 400 m.</p><p>Adventure mode changes nothing at the Olympiads: their only difficulty setting is the “tendinitis”.</p><p><strong>The difficulty (“tendinitis”) is the real secret.</strong> The first time, the opponents are at the hardest level, “Ages 12-24”. If you lose, choose <strong>“Change the tendinitis”</strong> on the final ranking screen:</p><ul><li>“Ages 25-39”: opponents a little slower, opponents' throws a little less powerful;</li><li>“Ages 40-59”: slower still, weaker throws;</li><li>“Ages 60 and up”: much slower, opponents' throws about half as long.</li></ul><p>The reward is the same whatever the level. You can then replay only the events you lost: the other results are kept.</p><p><strong>Sprints and hurdle races</strong></p><ul><li>Hammer <strong>a single key</strong> (not Space) from the “Go!”. The first key you press is locked in for the whole race.</li><li>You need a sustained rhythm: about <strong>7 presses per second</strong> to win at “Ages 12-24”, about 6.5 at “Ages 25-39”, 6 at “Ages 40-59”, 5.5 at “Ages 60 and up”.</li><li>On a controller, all face buttons, bumpers and triggers count as a single key: alternate two fingers on two buttons. A doesn't count during the hurdles.</li><li><strong>Hurdles:</strong> Space doesn't make the Numpty jump. He charges through the hurdles, smashes them and doesn't slow down, while his opponents lose a bit of speed with each jump. Space only makes Barbe-Yeux yell: focus on hammering.</li></ul><p><strong>Cannonball throw</strong></p><ol><li><strong>Power:</strong> hammer a key for 2 seconds. The gauge fills by 1/16 per press: 16 presses give maximum power.</li><li><strong>Aim:</strong> the needle sweeps the arc back and forth, in 0.7 seconds each way. Press <strong>Space when it is exactly in the middle of its swing</strong> (60°). Within ±2°, you get “Perfect”. The further you are from the middle, the shorter the throw. Beyond 90°, the cannonball goes backwards and counts as 0 m.</li><li>Margin to win with maximum power:<ul><li>“Ages 12-24”: about ±9° on the 1st throw, ±4 to 5° on the 2nd and 3rd (best opponent throws: 27.8 m, 30.4 m, 30.8 m);</li><li>“Ages 25-39”: about ±10°;</li><li>“Ages 40-59”: about ±16°;</li><li>“Ages 60 and up”: about ±33°.</li></ul></li></ol><p><strong>Endurance race (400 m)</strong></p><ul><li>Press in rhythm (Space works too). Each press pushes the rhythm cursor up, and it drops back down on its own.</li><li><strong>Blue</strong> zone: cruising speed, no fatigue. To stay in it, you need about 2 presses per second.</li><li><strong>Red</strong> zone: faster, but drains the stamina bar. With the cursor at the very top, the bar empties in about 10 seconds. If it's empty, the Numpty slows down sharply until the finish and runs slower than in the blue zone.</li><li>Below the blue (green zone), the bar slowly refills, but the Numpty moves much more slowly.</li><li>Red gains you the same lead for the same amount of stamina, whether you're just above the blue or right at the top. What matters is that the bar is <strong>empty exactly on the finish line</strong>, never before.</li><li><strong>Method:</strong><ol><li>At the start, hammer fast to reach the blue in 1 to 2 seconds: every second spent in the green costs a lot.</li><li>Hold the blue until a little past halfway (about 23 seconds into the race).</li><li>Then go right to the top of the red and stay there until the finish.</li></ol></li><li>Chances depending on the tendinitis (both 400 m races can now be won):<ul><li>“Ages 12-24”: a near-perfect race takes about 34.2 s, against 34.3 s for the best opponents. It comes down to a tenth of a second;</li><li>“Ages 25-39”: about half a second of margin;</li><li>“Ages 40-59”: about one second of margin;</li><li>“Ages 60 and up”: staying in the blue all the way is just enough, provided you reach the blue very quickly at the start. Otherwise, keep a bit of red for the end.</li></ul></li></ul><p><strong>After the victory:</strong> the stadium entrance opens the events board directly. There you choose the difficulty (and a “total wipeout” mode with random opponents), then replay everything, a group or a single event. The records board keeps your best performances. From chapter 5 on, these events can also earn you olives (see “Philoxène's offer”).</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "Chapter 3 Olive Island Mini-games Castanet Olympiads (Spwort) The idea. You don't run yourself: the Numpty (“The Numpty”, lane 1) does the running. His opponents are Philoxène, Eudoxie and Xénocrate. There are 11 events, always in this order: 3 sprints; 3 hurdle races; 3 cannonball throws; 2 endurance races (400 m). In each event, 1st place scores 3 points, 2nd 2 points, 3rd 1 point and last 0. The final ranking is on points. In case of a tie, the lowest total time wins. Winning all 6 races isn't always enough: you also need to pick up a few points in the throws or the 400 m. Adventure mode changes nothing at the Olympiads: their only difficulty setting is the “tendinitis”. The difficulty (“tendinitis”) is the real secret. The first time, the opponents are at the hardest level, “Ages 12-24”. If you lose, choose “Change the tendinitis” on the final ranking screen: “Ages 25-39”: opponents a little slower, opponents' throws a little less powerful; “Ages 40-59”: slower still, weaker throws; “Ages 60 and up”: much slower, opponents' throws about half as long. The reward is the same whatever the level. You can then replay only the events you lost: the other results are kept. Sprints and hurdle races Hammer a single key (not Space) from the “Go!”. The first key you press is locked in for the whole race. You need a sustained rhythm: about 7 presses per second to win at “Ages 12-24”, about 6.5 at “Ages 25-39”, 6 at “Ages 40-59”, 5.5 at “Ages 60 and up”. On a controller, all face buttons, bumpers and triggers count as a single key: alternate two fingers on two buttons. A doesn't count during the hurdles. Hurdles: Space doesn't make the Numpty jump. He charges through the hurdles, smashes them and doesn't slow down, while his opponents lose a bit of speed with each jump. Space only makes Barbe-Yeux yell: focus on hammering. Cannonball throw Power: hammer a key for 2 seconds. The gauge fills by 1/16 per press: 16 presses give maximum power. Aim: the needle sweeps the arc back and forth, in 0.7 seconds each way. Press Space when it is exactly in the middle of its swing (60°). Within ±2°, you get “Perfect”. The further you are from the middle, the shorter the throw. Beyond 90°, the cannonball goes backwards and counts as 0 m. Margin to win with maximum power: “Ages 12-24”: about ±9° on the 1st throw, ±4 to 5° on the 2nd and 3rd (best opponent throws: 27.8 m, 30.4 m, 30.8 m); “Ages 25-39”: about ±10°; “Ages 40-59”: about ±16°; “Ages 60 and up”: abo
