 del recorrido (unos 23 segundos de carrera). Entonces sube a lo más alto del rojo y quédate ahí hasta la meta. Posibilidades según la tendinitis (ahora se pueden ganar las dos carreras de 400 m): «12-24 años»: una carrera casi perfecta dura unos 34,2 s, frente a 34,3 s de los mejores rivales. Se decide por una décima de segundo; «25-39 años»: alrededor de medio segundo de margen; «40-59 años»: alrededor de un segundo de margen; «60 años y más»: quedarse en el azul todo el rato basta, por los pelos, siempre que llegues al azul muy rápido en la salida. Si no, guarda un poco de rojo para el final. Después de la victoria: la entrada del estadio abre directamente el panel de las pruebas. Allí eliges la dificultad (y un modo «total wipeout» con rivales aleatorios) y luego lo repites todo, un grupo o una prueba. El panel de récords guarda tus mejores marcas. A partir del capítulo 5, estas pruebas también pueden darte aceitunas (ver «La oferta de Filóxeno»).", "sol": 0}, {"titre": "Batalla naval contra Nadaillac", "html": "<p>Pilotas el barco de Itzel, en la parte de abajo de la pantalla, contra el de Nadaillac, arriba. El modo aventura no cambia nada en esta batalla.</p><ul><li><strong>Casco:</strong> 40 puntos para ti, 100 para Nadaillac.</li><li><strong>Desplazamiento:</strong> izquierda y derecha.</li><li><strong>Habilidades:</strong><ol><li><strong>Cañón</strong>: 6 balas disparadas hacia delante, 1 punto de daño por cada bala que alcance el casco, recarga de 3 s.</li><li><strong>Balas encadenadas</strong>: pulsa y luego haz clic en una de las tres trayectorias (izquierda, recto, derecha). Apuntan a las velas: cada impacto hace 1 de daño y ralentiza a Nadaillac un 10 % durante 10 s (indicador «VEL»). Recarga de 3 s.</li><li><strong>Velocidad</strong>: desplazamiento doble durante 10 s, recarga de 30 s.</li><li><strong>Reparación</strong>: +20 puntos de casco, recarga de 30 s.</li></ol></li></ul><p>Cada golpe que asestas reduce en 1 segundo la recarga de la velocidad y de la reparación.</p><ul><li><strong>Con mando:</strong> cruceta o stick izquierdo para moverte. A = cañón, Y = balas encadenadas, B = velocidad, X = reparación. Para apuntar las cadenas: X a la izquierda, A recto, Y a la derecha, B para cancelar. Durante los barriles, A dispara donde está el punto de mira.</li><li><strong>Sus disparos:</strong> más o menos cada 3 s, cuando está alineado contigo, dispara 12 balas (1 de daño cada una). Apártate en cuanto se ponga enfrente.</li><li><strong>Truco:</strong> ralentízalo con las cadenas (tecla 2) y luego encadena descargas de cañón mientras va lento.</li><li><strong>Fases guionizadas:</strong><ul><li>a 75: 3 lugartenientes (10 puntos cada uno) sustituyen a Nadaillac, sin cadenas disponibles; se retiran al cabo de 60 s;</li><li>a 50: <strong>barriles de pólvora</strong>. Tras una cuenta atrás de 3 s, caen barriles durante 10 s por 5 pasillos. Tus cañones quedan bloqueados: haz clic en los barriles para derribarlos con la pistola (30 balas). Un barril que alcanza tu barco hace 5 de daño: derriba primero los de tu pasillo y esquiva los demás;</li><li>a 25: 5 lugartenientes más rápidos;</li><li>a 10: última tanda de barriles.</li></ul></li><li><strong>Si te hundes:</strong> la batalla vuelve a empezar. Tras 3 derrotas, puedes elegir «Rendirse: sufrir el abordaje.». La historia continúa, pero todo tu grupo empieza el combate contra Nadaillac con la mitad de sus PV.</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "Capítulo 3 La isla de Oliva Minijuegos Batalla naval contra Nadaillac Pilotas el barco de Itzel, en la parte de abajo de la pantalla, contra el de Nadaillac, arriba. El modo aventura no cambia nada en esta batalla. Casco: 40 puntos para ti, 100 para Nadaillac. Desplazamiento: izquierda y derecha. Habilidades: Cañón : 6 balas disparadas hacia delante, 1 punto de daño por cada bala que alcance el casco, recarga de 3 s. Balas encadenadas : pulsa y luego haz clic en una de las tres trayectorias (izquierda, recto, derecha). Apuntan a las velas: cada impacto hace 1 de daño y ralentiza a Nadaillac un 10 % durante 10 s (indicador «VEL»). Recarga de 3 s. Velocidad : desplazamiento doble durante 10 s, recarga de 30 s. Reparación : +20 puntos de casco, recarga de 30 s. Cada golpe que asestas reduce en 1 segundo la recarga de la velocidad y de la reparación. Con mando: cruceta o stick izquierdo para moverte. A = cañón, Y = balas encadenadas, B = velocidad, X = reparación. Para apuntar las cadenas: X a la izquierda, A recto, Y a la derecha, B para cancelar. Durante los barriles, A dispara donde está el punto de mira. Sus disparos: más o menos cada 3 s, cuando está alineado contigo, dispara 12 balas (1 de daño cada una). Apártate en cuanto se ponga enfrente. Truco: ralentízalo con las cadenas (tecla 2) y luego encadena descargas de cañón mientras va lento. Fases guionizadas: a 75: 3 lugartenientes (10 puntos cada uno) sustituyen a Nadaillac, sin cadenas disponibles; se retiran al cabo de 60 s; a 50: barriles de pólvora . Tras una cuenta atrás de 3 s, caen barriles durante 10 s por 5 pasillos. Tus cañones quedan bloqueados: haz clic en los barriles para derribarlos con la pistola (30 balas). Un barril que alcanza tu barco hace 5 de daño: derriba primero los de tu pasillo y esquiva los demás; a 25: 5 lugartenientes más rápidos; a 10: última tanda de barriles. Si te hundes: la batalla vuelve a empezar. Tras 3 derrotas, puedes elegir «Rendirse: sufrir el abordaje.». La historia continúa, pero todo tu grupo empieza el combate contra Nadaillac con la mitad de sus PV.", "sol": 0}]}, {"titre": "Que no se te escape", "intro": "", "entrees": [{"titre": "Que no se te escape", "html": "<ul><li><strong>Punto de no retorno:</strong> después de ganar las Olimpiadas, tu barca queda bloqueada. Subir al barco de Itzel inicia el final del capítulo, sin vuelta atrás. Las misiones de Calístenes y de Leónidas se pueden seguir haciendo después del capítulo 4, cuando la isla de Oliva vuelve a ser accesible.</li><li><strong>Recompensa oculta de las compotas:</strong> después de recuperar la caja, vuelve a pasar por la tienda de la isla de las Manzanas (5 Compotas, 1 Supercompota, 10 000 EXP).</li><li><strong>Lleva 5 caballas</strong> encima al llegar a la isla de Oliva: podrás entregar enseguida la misión de Leónidas.</li><li><strong>Objetos clave del capítulo:</strong> 3.ª gema de los Bolon Tiku (Olimpiadas), Llave de la jaula y luego Caja de compotas (misión de Calístenes), Taparrabos familiar (recompensa de Calístenes).</li><li>No hay cofres en la isla de Oliva.</li><li><strong>Logros del capítulo:</strong><ul><li><strong>«¡Las castañuelas!»</strong>: terminar el capítulo 3.</li><li><strong>«Panem et circenses»</strong>: conseguir 32 puntos en una misma competición de Spwort. Hay que ganar las 11 pruebas (33 puntos), o 10 victorias y un 2.º puesto. La puntuación solo se comprueba al final de una competición completa (primera partida o «Empezar de nuevo» / «Repetirlo todo»), no tras repetir una sola prueba o un grupo. Lo más fácil: pon la tendinitis en «60 años y más» y repítelo todo.</li><li>Las misiones de Calístenes y de Leónidas cuentan para <strong>«El chico para todo»</strong> (todas las misiones secundarias), igual que «La oferta de Filóxeno», más adelante.</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "Capítulo 3 La isla de Oliva Que no se te escape Que no se te escape Punto de no retorno: después de ganar las Olimpiadas, tu barca queda bloqueada. Subir al barco de Itzel inicia el final del capítulo, sin vuelta atrás. Las misiones de Calístenes y de Leónidas se pueden seguir haciendo después del capítulo 4, cuando la isla de Oliva vuelve a ser accesible. Recompensa oculta de las compotas: después de recuperar la caja, vuelve a pasar por la tienda de la isla de las Manzanas (5 Compotas, 1 Supercompota, 10 000 EXP). Lleva 5 caballas encima al llegar a la isla de Oliva: podrás entregar enseguida la misión de Leónidas. Objetos clave del capítulo: 3.ª gema de los Bolon Tiku (Olimpiadas), Llave de la jaula y luego Caja de compotas (misión de Calístenes), Taparrabos familiar (recompensa de Calístenes). No hay cofres en la isla de Oliva. Logros del capítulo: «¡Las castañuelas!» : terminar el capítulo 3. «Panem et circenses» : conseguir 32 puntos en una misma competición de Spwort. Hay que ganar las 11 pruebas (33 puntos), o 10 victorias y un 2.º puesto. La puntuación solo se comprueba al final de una competición completa (primera partida o «Empezar de nuevo» / «Repetirlo todo»), no tras repetir una sola prueba o un grupo. Lo más fácil: pon la tendinitis en «60 años y más» y repítelo todo. Las misiones de Calístenes y de Leónidas cuentan para «El chico para todo» (todas las misiones secundarias), igual que «La oferta de Filóxeno», más adelante.", "sol": 0}]}]}], "pt": [{"id": "c3", "num": "Capítulo 3", "titre": "A Ilha da Oliva", "intro": "<p>O monstro dos penhascos foi derrotado: Itzel segue uma nova pista até a Ilha da Oliva, ilha de filósofos musculosos e de pouca roupa. Lá você procura uma gema dos Bolon Tiku, que vai ser preciso ganhar nas Olimpíadas das Castanholas com a ajuda (muito relativa) de um dos dois Paspalhos. A volta a bordo não vai ser nada tranquila.</p>", "sections": [{"titre": "Missão principal", "intro": "", "entrees": [{"titre": "Encontrar Itzel no navio dela.", "html": "<p>(Título da missão: \"Ilha do Vento\". Esta etapa faz a ligação com o fim do capítulo 2, cujo detonado também a descreve.)</p><ol><li>Na Ilha do Vento, vá até o navio de Itzel, atracado no sudeste da ilha, a leste da pescadora.</li><li>Duas condições antes de partir:<ul><li>os dois Paspalhos precisam estar com você. Se você os deixou ao pé da gruta 3 (a escada dos Paspalhos), Itzel avisa: vá buscá-los;</li><li>eles estão com queimadura de sol. É preciso passar neles uma <strong>Gordura de Coulirou</strong> (escolha \"Passar graxa de Coulirou neles\"); senão, \"Os dois Paspalhos não estão em condições de viajar.\". Uma aplicação feita no barco também vale.</li></ul></li><li>Itzel pergunta: \"Ir para a Ilha da Oliva?\" Responda <strong>Sim</strong>. A viagem começa sozinha e a cartela \"Capítulo 3 — A Ilha da Oliva\" aparece.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Encontrar Itzel no navio dela. (Título da missão: \"Ilha do Vento\". Esta etapa faz a ligação com o fim do capítulo 2, cujo detonado também a descreve.) Na Ilha do Vento, vá até o navio de Itzel, atracado no sudeste da ilha, a leste da pescadora. Duas condições antes de partir: os dois Paspalhos precisam estar com você. Se você os deixou ao pé da gruta 3 (a escada dos Paspalhos), Itzel avisa: vá buscá-los; eles estão com queimadura de sol. É preciso passar neles uma Gordura de Coulirou (escolha \"Passar graxa de Coulirou neles\"); senão, \"Os dois Paspalhos não estão em condições de viajar.\". Uma aplicação feita no barco também vale. Itzel pergunta: \"Ir para a Ilha da Oliva?\" Responda Sim . A viagem começa sozinha e a cartela \"Capítulo 3 — A Ilha da Oliva\" aparece.", "sol": 0}, {"titre": "Ir à Ilha da Oliva na companhia de Itzel", "html": "<ol><li>Na chegada, Itzel fica a bordo para vigiar uma vela suspeita. Você desembarca sozinho com os dois Paspalhos, na praia ao sul da ilha.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Ir à Ilha da Oliva na companhia de Itzel Na chegada, Itzel fica a bordo para vigiar uma vela suspeita. Você desembarca sozinho com os dois Paspalhos, na praia ao sul da ilha.", "sol": 0}, {"titre": "Encontrar informações sobre uma possível gema", "html": "<ol><li>Suba para o norte a partir da praia: uma cena começa sozinha. Um velho pelado atravessa a tela num sentido e depois no outro, com um caranguejo pendurado numa parte sensível. Os pedidos de socorro dele aparecem num balão que fica na borda da tela quando ele sai do campo de visão.</li><li>Espere cerca de 20 segundos (três idas e voltas). O botão <strong>Intervir</strong> aparece então na parte de baixo da tela: clique nele ou aperte a tecla de interação.</li><li><strong>Chefe: o Rei dos Caranguejos</strong> (300 PV, bate forte mas não tem mecânica especial). Você luta com Barbe-Yeux e os dois Paspalhos. Vitória: 2 000 XP. No modo Aventura, como em todos os combates, você recebe 20 % menos dano e causa 20 % a mais.</li><li>O velho se apresenta: é <strong>Filoxeno Ramo-Longo</strong>, uma espécie de chefe da ilha (ele não gosta da palavra). Ele te espera na vila.</li><li>Vá até a vila, no centro da ilha (em volta da grande estátua do Paspalho). Filoxeno fica a leste-sudeste da estátua. Fale com ele: ele explica que a gema fica com o vencedor das Olimpíadas das Castanholas.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Encontrar informações sobre uma possível gema Suba para o norte a partir da praia: uma cena começa sozinha. Um velho pelado atravessa a tela num sentido e depois no outro, com um caranguejo pendurado numa parte sensível. Os pedidos de socorro dele aparecem num balão que fica na borda da tela quando ele sai do campo de visão. Espere cerca de 20 segundos (três idas e voltas). O botão Intervir aparece então na parte de baixo da tela: clique nele ou aperte a tecla de interação. Chefe: o Rei dos Caranguejos (300 PV, bate forte mas não tem mecânica especial). Você luta com Barbe-Yeux e os dois Paspalhos. Vitória: 2 000 XP. No modo Aventura, como em todos os combates, você recebe 20 % menos dano e causa 20 % a mais. O velho se apresenta: é Filoxeno Ramo-Longo , uma espécie de chefe da ilha (ele não gosta da palavra). Ele te espera na vila. Vá até a vila, no centro da ilha (em volta da grande estátua do Paspalho). Filoxeno fica a leste-sudeste da estátua. Fale com ele: ele explica que a gema fica com o vencedor das Olimpíadas das Castanholas.", "sol": 0}, {"titre": "Inscrever-se nas Olimpíadas", "html": "<ol><li>Vá até o balcão de inscrição, a nordeste da estátua da vila. Ele fica fechado enquanto você não falar com Filoxeno.</li><li>Barbe-Yeux inscreve na marra um dos dois Paspalhos. O Paspalho vai correr na \"raia número 1\".</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Inscrever-se nas Olimpíadas Vá até o balcão de inscrição, a nordeste da estátua da vila. Ele fica fechado enquanto você não falar com Filoxeno. Barbe-Yeux inscreve na marra um dos dois Paspalhos. O Paspalho vai correr na \"raia número 1\".", "sol": 0}, {"titre": "Participar das Olimpíadas (e vencer!)", "html": "<ol><li>O estádio fica bem no norte da ilha. Antes da inscrição, a entrada está bloqueada (\"Você ainda não pode entrar no recinto.\", depois \"Primeiro é preciso passar pela inscrição.\").</li><li>Na entrada, escolha <strong>Sim</strong> em \"Participar das Olimpíadas?\". \"Ainda não\" te deixa ir embora.</li><li>O discurso de abertura do locutor só passa na primeira visita. Depois, as 11 provas vêm uma atrás da outra (veja <strong>Minijogos &gt; Olimpíadas das Castanholas</strong>).</li><li>É preciso terminar em <strong>primeiro na classificação final</strong>, com mais pontos.</li><li>Se você falhar, a tela de classificação permite recomeçar tudo, mudar a dificuldade (\"Mudar a tendinite\") ou jogar de novo só um grupo de provas ou uma prova. Os outros resultados são mantidos. Se você sair das Olimpíadas no meio, elas recomeçam do início na próxima visita.</li><li>Vitória: Filoxeno te entrega a <strong>3ª gema dos Bolon Tiku</strong> e <strong>50 000 XP</strong>.</li></ol><aside class=\"note\"><p><strong>Atenção, ponto sem volta próximo.</strong> Depois de ganhar as Olimpíadas, o seu barco não sai mais (\"Não vou voltar ao mar por aqui…\"). A única saída é o navio de Itzel, que dispara o fim do capítulo. Termine antes o que quiser terminar na ilha (veja Missões secundárias).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Participar das Olimpíadas (e vencer!) O estádio fica bem no norte da ilha. Antes da inscrição, a entrada está bloqueada (\"Você ainda não pode entrar no recinto.\", depois \"Primeiro é preciso passar pela inscrição.\"). Na entrada, escolha Sim em \"Participar das Olimpíadas?\". \"Ainda não\" te deixa ir embora. O discurso de abertura do locutor só passa na primeira visita. Depois, as 11 provas vêm uma atrás da outra (veja Minijogos > Olimpíadas das Castanholas ). É preciso terminar em primeiro na classificação final , com mais pontos. Se você falhar, a tela de classificação permite recomeçar tudo, mudar a dificuldade (\"Mudar a tendinite\") ou jogar de novo só um grupo de provas ou uma prova. Os outros resultados são mantidos. Se você sair das Olimpíadas no meio, elas recomeçam do início na próxima visita. Vitória: Filoxeno te entrega a 3ª gema dos Bolon Tiku e 50 000 XP . Atenção, ponto sem volta próximo. Depois de ganhar as Olimpíadas, o seu barco não sai mais (\"Não vou voltar ao mar por aqui…\"). A única saída é o navio de Itzel, que dispara o fim do capítulo. Termine antes o que quiser terminar na ilha (veja Missões secundárias).", "sol": 0}, {"titre": "Encontrar Itzel no navio dela e zarpar.", "html": "<ol><li>Volte à praia de chegada, no sul. O navio de Itzel fica logo à direita do seu barco. Sem a gema, Itzel se recusa a partir (\"A gente ainda não tem a gema das Olimpíadas.\").</li><li>Surge uma vela pirata: é <strong>Nadaillac Dois-Vermelhos</strong>, que quer as suas gemas.</li><li><strong>Batalha naval</strong> contra o navio dele (veja <strong>Minijogos &gt; Batalha naval contra Nadaillac</strong>).</li><li><strong>Chefe: Nadaillac Dois-Vermelhos</strong> (abordagem). Você luta com Barbe-Yeux, os dois Paspalhos e Itzel.<ul><li>No primeiro turno, ele dá um tiro em cada membro do grupo (dano ×1,5). Depois ele recarrega e ataca com a espada: durante 3 turnos se vocês forem 4 de pé, 2 turnos se forem 3, só 1 turno nos outros casos. Mantenha todo mundo vivo, assim ele vai atirar menos vezes, e cure-se antes de cada rajada.</li><li>Abaixo de 2 250 PV, ele chama 4 reforços: um Artilheiro, dois Piratas de tamanho razoável e uma PiratA com uma pistôla, todos fortalecidos.</li><li>Abaixo de 1 500 PV, ele joga uma granada de fumaça e golpeia 6 vezes ao acaso no seu grupo. Depois ele se cura em 500 PV, ergue 4 piratas mortos-vivos e passa o turno seguinte.</li><li><strong>Dica:</strong> o combate termina assim que Nadaillac chega a 50 PV. Não adianta matar os reforços, concentre os golpes nele.</li><li>No modo Aventura, os golpes dele causam 20 % menos dano em você e os seus 20 % a mais. Os patamares de 2 250, 1 500 e 50 PV não mudam.</li><li>Se você perder, o combate recomeça na hora, com PV e energia no máximo, sem refazer a batalha naval.</li></ul></li><li>Uma cena encerra o capítulo e depois aparece a cartela \"Capítulo 4 — Costa Perdida\". Conquista <strong>\"As castanholas!\"</strong>.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "Capítulo 3 A Ilha da Oliva Missão principal Encontrar Itzel no navio dela e zarpar. Volte à praia de chegada, no sul. O navio de Itzel fica logo à direita do seu barco. Sem a gema, Itzel se recusa a partir (\"A gente ainda não tem a gema das Olimpíadas.\"). Surge uma vela pirata: é Nadaillac Dois-Vermelhos , que quer as suas gemas. Batalha naval contra o navio dele (veja Minijogos > Batalha naval contra Nadaillac ). Chefe: Nadaillac Dois-Vermelhos (abordagem). Você luta com Barbe-Yeux, os dois Paspalhos e Itzel. No primeiro turno, ele dá um tiro em cada membro do grupo (dano ×1,5). Depois ele recarrega e ataca com a espada: durante 3 turnos se vocês forem 4 de pé, 2 turnos se forem 3, só 1 turno nos outros casos. Mantenha todo mundo vivo, assim ele vai atirar menos vezes, e cure-se antes de cada rajada. Abaixo de 2 250 PV, ele chama 4 reforços: um Artilheiro, dois Piratas de tamanho razoável e uma PiratA com uma pistôla, todos fortalecidos. Abaixo de 1 500 PV, ele joga uma granada de fumaça e golpeia 6 vezes ao acaso no seu grupo. Depois ele se cura em 500 PV, ergue 4 piratas mortos-vivos e passa o turno seguinte. Dica: o combate termina assim que Nadaillac chega a 50 PV. Não adianta matar os reforços, concentre os golpes nele. No modo Aventura, os golpes dele causam 20 % menos dano em você e os seus 20 % a mais. Os patamares de 2 250, 1 500 e 50 PV não mudam. Se você perder, o combate recomeça na hora, com PV e energia no máximo, sem refazer a batalha naval. Uma cena encerra o capítulo e depois aparece a cartela \"Capítulo 4 — Costa Perdida\". Conquista \"As castanholas!\" .", "sol": 0}]}, {"titre": "Missões secundárias", "intro": "", "entrees": [{"titre": "A encomenda de compotas (Calístenes, o Saliente)", "html": "<p><em>Título no fim: \"Encontrar o pedido de compotas de Calístenes.\"</em></p><ol><li><strong>Gatilho:</strong> na Ilha da Oliva, fale com Calístenes, o Saliente, no canto nordeste da estátua da vila. Aceite (<strong>Sim</strong>). Se recusar, ele vai te propor de novo.</li><li><strong>Ilha das Maçãs:</strong> pegue o seu barco (na praia sul, opção \"Embarcar\") e vá para a Ilha das Maçãs. Na loja de compotas, no norte da ilha, Barbe-Yeux fala da encomenda: o navio mercante desapareceu perto de Morro Blanco. A ilha de Morro Blanco é desbloqueada no mapa.</li><li><strong>Morro Blanco:</strong> a partir do desembarcadouro (no sudoeste), siga a costa oeste para o norte. Você encontra um comerciante preso numa jaula.</li><li>Logo ao norte da jaula, um acampamento de bandidos dispara um combate obrigatório contra 5 inimigos: Artilheiro, Pirata de tamanho razoável, PiratA com uma pistôla, Pescador e Pescadora. Vitória: <strong>Chave da jaula</strong>.</li><li>Volte à jaula com a chave: o comerciante te dá a <strong>Caixa de compotas</strong>.</li><li><strong>Recompensa 1:</strong> leve a caixa para Calístenes na Ilha da Oliva. Você ganha <strong>40 000 XP</strong> e a <strong>Tanga de família</strong> (equipamento de pernas, +10 DEF para os dois Paspalhos).</li><li><strong>Recompensa 2 (fácil de esquecer):</strong> depois, passe de novo na loja de compotas da Ilha das Maçãs. O vendedor te dá <strong>5 Compotas</strong>, <strong>1 Supercompota</strong> (devolve 150 PV e 75 % da energia) e <strong>10 000 XP</strong>.</li></ol><aside class=\"note\"><p>No capítulo 3, faça-a <strong>antes de ganhar as Olimpíadas</strong>: depois da vitória, o seu barco não sai mais da ilha. Se não der, a Ilha da Oliva volta a ficar acessível mais adiante na aventura (depois do capítulo 4), e Calístenes vai estar te esperando lá.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "Capítulo 3 A Ilha da Oliva Missões secundárias A encomenda de compotas (Calístenes, o Saliente) Título no fim: \"Encontrar o pedido de compotas de Calístenes.\" Gatilho: na Ilha da Oliva, fale com Calístenes, o Saliente, no canto nordeste da estátua da vila. Aceite ( Sim ). Se recusar, ele vai te propor de novo. Ilha das Maçãs: pegue o seu barco (na praia sul, opção \"Embarcar\") e vá para a Ilha das Maçãs. Na loja de compotas, no norte da ilha, Barbe-Yeux fala da encomenda: o navio mercante desapareceu perto de Morro Blanco. A ilha de Morro Blanco é desbloqueada no mapa. Morro Blanco: a partir do desembarcadouro (no sudoeste), siga a costa oeste para o norte. Você encontra um comerciante preso numa jaula. Logo ao norte da jaula, um acampamento de bandidos dispara um combate obrigatório contra 5 inimigos: Artilheiro, Pirata de tamanho razoável, PiratA com uma pistôla, Pescador e Pescadora. Vitória: Chave da jaula . Volte à jaula com a chave: o comerciante te dá a Caixa de compotas . Recompensa 1: leve a caixa para Calístenes na Ilha da Oliva. Você ganha 40 000 XP e a Tanga de família (equipamento de pernas, +10 DEF para os dois Paspalhos). Recompensa 2 (fácil de esquecer): depois, passe de novo na loja de compotas da Ilha das Maçãs. O vendedor te dá 5 Compotas , 1 Supercompota (devolve 150 PV e 75 % da energia) e 10 000 XP . No capítulo 3, faça-a antes de ganhar as Olimpíadas : depois da vitória, o seu barco não sai mais da ilha. Se não der, a Ilha da Oliva volta a ficar acessível mais adiante na aventura (depois do capítulo 4), e Calístenes vai estar te esperando lá.", "sol": 0}, {"titre": "Levar cavalas para Leônidas", "html": "<p><em>Título no fim: \"Levar 5 cavalas para Leônidas.\"</em></p><ol><li><strong>Gatilho:</strong> fale com Leônidas, a leste da estátua da vila, mais para o sul. Ele pede peixe: aceite (<strong>Sim</strong>). Você também pode dispará-la depois das Olimpíadas.</li><li><strong>Objetivo:</strong> 5 <strong>Cavalas</strong>. Elas são pescadas na Ilha dos Caranguejos (a praia) e na Ilha do Vento. Combinação da cavala: <strong>← ← → →</strong>. Cada captura tem cerca de 1 chance em 3 de ser uma cavala na Ilha dos Caranguejos (menos na Ilha do Vento, onde o Coulirou morde muito).</li><li>Não venda suas cavalas aos pescadores da Ilha dos Caranguejos e da Ilha do Vento, que as compram de você.</li><li>Volte a Leônidas com 5 cavalas: <strong>30 000 XP</strong>.</li></ol><aside class=\"note\"><p>Como no caso de Calístenes: depois da vitória nas Olimpíadas, você não pode mais sair da ilha no capítulo 3. Se você já tiver 5 cavalas com você, pode entregá-la nesse momento. Senão, deixe-a para quando voltar à Ilha da Oliva depois do capítulo 4.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "Capítulo 3 A Ilha da Oliva Missões secundárias Levar cavalas para Leônidas Título no fim: \"Levar 5 cavalas para Leônidas.\" Gatilho: fale com Leônidas, a leste da estátua da vila, mais para o sul. Ele pede peixe: aceite ( Sim ). Você também pode dispará-la depois das Olimpíadas. Objetivo: 5 Cavalas . Elas são pescadas na Ilha dos Caranguejos (a praia) e na Ilha do Vento. Combinação da cavala: ← ← → → . Cada captura tem cerca de 1 chance em 3 de ser uma cavala na Ilha dos Caranguejos (menos na Ilha do Vento, onde o Coulirou morde muito). Não venda suas cavalas aos pescadores da Ilha dos Caranguejos e da Ilha do Vento, que as compram de você. Volte a Leônidas com 5 cavalas: 30 000 XP . Como no caso de Calístenes: depois da vitória nas Olimpíadas, você não pode mais sair da ilha no capítulo 3. Se você já tiver 5 cavalas com você, pode entregá-la nesse momento. Senão, deixe-a para quando voltar à Ilha da Oliva depois do capítulo 4.", "sol": 0}, {"titre": "A oferta de Filoxeno (a partir do capítulo 5)", "html": "<p>Esta missão acontece na Ilha da Oliva, mas só fica disponível depois que o capítulo 4 termina: ela pertence ao período do capítulo 5. Eis o essencial, porque ela se joga no estádio das Olimpíadas.</p><ol><li><strong>Gatilho:</strong> na taverna da Ilha dos Caranguejos, peça notícias ao taverneiro. Ele fala de uma oferta de Filoxeno: aceite.</li><li>Vá falar com Filoxeno na Ilha da Oliva. Ele propõe pagar em <strong>olivas</strong> cada prova jogada de novo no estádio.</li><li>Jogue provas de novo no estádio: <strong>2 olivas por prova concluída</strong>, +1 oliva em caso de vitória ou de novo recorde, mas só na tendinite \"12-24 anos\" ou \"25-39 anos\". A primeira entrega de olivas conclui a missão: <strong>75 % do XP do seu nível atual</strong>.</li><li>Depois disso, qualquer taverneiro (Ilha dos Caranguejos, Ilha dos Macacos, Ilha do Vento, Nassau) fabrica <strong>Ol'right</strong>: 5 olivas + 1 rum, ou 5 olivas + 5 escudos. Em combate, o Ol'right faz o grupo todo regenerar 25 % de energia por turno, durante 4 turnos.</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "Capítulo 3 A Ilha da Oliva Missões secundárias A oferta de Filoxeno (a partir do capítulo 5) Esta missão acontece na Ilha da Oliva, mas só fica disponível depois que o capítulo 4 termina: ela pertence ao período do capítulo 5. Eis o essencial, porque ela se joga no estádio das Olimpíadas. Gatilho: na taverna da Ilha dos Caranguejos, peça notícias ao taverneiro. Ele fala de uma oferta de Filoxeno: aceite. Vá falar com Filoxeno na Ilha da Oliva. Ele propõe pagar em olivas cada prova jogada de novo no estádio. Jogue provas de novo no estádio: 2 olivas por prova concluída , +1 oliva em caso de vitória ou de novo recorde, mas só na tendinite \"12-24 anos\" ou \"25-39 anos\". A primeira entrega de olivas conclui a missão: 75 % do XP do seu nível atual . Depois disso, qualquer taverneiro (Ilha dos Caranguejos, Ilha dos Macacos, Ilha do Vento, Nassau) fabrica Ol'right : 5 olivas + 1 rum, ou 5 olivas + 5 escudos. Em combate, o Ol'right faz o grupo todo regenerar 25 % de energia por turno, durante 4 turnos.", "sol": 0}, {"titre": "Personagens sem missão", "html": "<ul><li><strong>Eudoxie</strong> (a leste da estátua): atleta das Olimpíadas, só diálogo.</li><li><strong>O painel de recordes</strong> (ao norte da vila, perto do estádio): \"Não tem nada aqui por enquanto…\" antes da sua vitória. Depois, ele mostra os melhores tempos e arremessos.</li><li><strong>A estátua do Paspalho</strong>, no centro da vila: quando você ou os Paspalhos passam por trás dela, ela esconde vocês. Uma silhueta colorida mostra onde você está (opção \"Silhuetas atrás do cenário\", em Preferências &gt; Acessibilidade, ativada por padrão). A estátua muda de aparência ao longo da aventura. Quando o jogo termina, ela fica pronta e coroada de louros.</li></ul>", "id": "c3-personnages-sans-quete", "texte": "Capítulo 3 A Ilha da Oliva Missões secundárias Personagens sem missão Eudoxie (a leste da estátua): atleta das Olimpíadas, só diálogo. O painel de recordes (ao norte da vila, perto do estádio): \"Não tem nada aqui por enquanto…\" antes da sua vitória. Depois, ele mostra os melhores tempos e arremessos. A estátua do Paspalho , no centro da vila: quando você ou os Paspalhos passam por trás dela, ela esconde vocês. Uma silhueta colorida mostra onde você está (opção \"Silhuetas atrás do cenário\", em Preferências > Acessibilidade, ativada por padrão). A estátua muda de aparência ao longo da aventura. Quando o jogo termina, ela fica pronta e coroada de louros.", "sol": 0}]}, {"titre": "Minijogos", "intro": "", "entrees": [{"titre": "Olimpíadas das Castanholas (Spwort)", "html": "<p><strong>O princípio.</strong> Você não corre: quem corre é o Paspalho (\"O Paspalho\", raia 1). Os adversários dele são Filoxeno, Eudoxie e Xénocrate. São 11 provas, sempre nesta ordem:</p><ul><li>3 corridas de velocidade;</li><li>3 corridas com barreiras;</li><li>3 arremessos de bala de canhão;</li><li>2 corridas de resistência (400 m).</li></ul><p>Em cada prova, o 1º marca 3 pontos, o 2º 2 pontos, o 3º 1 ponto e o último 0. A classificação final é por pontos. Em caso de empate, vence quem tiver o menor tempo total. Ganhar as 6 corridas nem sempre basta: também é preciso fazer alguns pontos nos arremessos ou nos 400 m.</p><p>O modo Aventura não muda nada nas Olimpíadas: a única dificuldade delas é a \"tendinite\".</p><p><strong>A dificuldade (\"tendinite\") é o verdadeiro segredo.</strong> Na primeira vez, os adversários estão no nível mais difícil, \"12-24 anos\". Se perder, escolha <strong>\"Mudar a tendinite\"</strong> na tela de classificação final:</p><ul><li>\"25-39 anos\": adversários um pouco mais lentos, arremessos adversários um pouco menos fortes;</li><li>\"40-59 anos\": mais lentos ainda, arremessos mais fracos;</li><li>\"60 anos ou +\": bem mais lentos, arremessos adversários cerca de duas vezes mais curtos.</li></ul><p>A recompensa é a mesma em qualquer nível. Depois você pode jogar de novo só as provas perdidas: os outros resultados são mantidos.</p><p><strong>Corridas de velocidade e com barreiras</strong></p><ul><li>Martele <strong>uma única tecla</strong> (não o Espaço) a partir do \"Já!\". A primeira tecla apertada fica travada durante toda a corrida.</li><li>É preciso um ritmo forte: cerca de <strong>7 toques por segundo</strong> para ganhar em \"12-24 anos\", cerca de 6,5 em \"25-39 anos\", 6 em \"40-59 anos\", 5,5 em \"60 anos ou +\".</li><li>No controle, todos os botões frontais, ombros e gatilhos contam como uma única tecla: alterne dois dedos em dois botões. O A não conta durante as barreiras.</li><li><strong>Barreiras:</strong> o Espaço não faz o Paspalho pular. Ele passa direto pelas barreiras, quebra todas e não perde velocidade, enquanto os adversários perdem um pouco de velocidade a cada salto. O Espaço só serve para fazer Barbe-Yeux gritar: concentre-se em martelar.</li></ul><p><strong>Arremesso de bala de canhão</strong></p><ol><li><strong>Força:</strong> martele uma tecla durante 2 segundos. A barra enche 1/16 por toque: 16 toques dão a força máxima.</li><li><strong>Mira:</strong> o ponteiro varre o arco, ida e volta, em 0,7 segundo por sentido. Aperte <strong>Espaço quando ele estiver bem no meio do percurso</strong> (60°). A ±2°, você consegue \"Perfeito.\". Quanto mais longe do meio, mais curto o arremesso. Acima de 90°, a bala vai para trás e conta como 0 m.</li><li>Margem para vencer com força máxima:<ul><li>\"12-24 anos\": cerca de ±9° no 1º arremesso, ±4 a 5° no 2º e no 3º (melhores arremessos adversários: 27,8 m, 30,4 m, 30,8 m);</li><li>\"25-39 anos\": cerca de ±10°;</li><li>\"40-59 anos\": cerca de ±16°;</li><li>\"60 anos ou +\": cerca de ±33°.</li></ul></li></ol><p><strong>Corrida de resistência (400 m)</strong></p><ul><li>Aperte no compasso (o Espaço também funciona). Cada toque faz subir o cursor de ritmo, que desce sozinho.</li><li>Zona <strong>azul</strong>: velocidade de cruzeiro, sem cansaço. Para ficar nela, são precisos cerca de 2 toques por segundo.</li><li>Zona <strong>vermelha</strong>: mais rápida, mas esvazia a barra de resistência. Com o cursor lá no alto, a barra se esvazia em cerca de 10 segundos. Se ela ficar vazia, o Paspalho perde muita velocidade até a chegada e corre mais devagar do que na zona azul.</li><li>Abaixo do azul (zona verde), a barra recarrega devagar, mas o Paspalho avança muito mais devagar.</li><li>O vermelho dá a mesma vantagem para a mesma quantidade de resistência, esteja você logo acima do azul ou lá no alto. O que importa é a barra ficar <strong>vazia bem na linha de chegada</strong>, nunca antes.</li><li><strong>Método:</strong><ol><li>Na largada, martele rápido para chegar ao azul em 1 a 2 segundos: cada segundo passado no verde custa caro.</li><li>Mantenha o azul até um pouco mais da metade do percurso (cerca de 23 segundos de corrida).</li><li>Aí suba até o alto do vermelho e fique lá até a chegada.</li></ol></li><li>Chances conforme a tendinite (as duas corridas de 400 m agora podem ser vencidas):<ul><li>\"12-24 anos\": uma corrida quase perfeita dá cerca de 34,2 s, contra 34,3 s dos melhores adversários. É questão de um décimo de segundo;</li><li>\"25-39 anos\": cerca de meio segundo de margem;</li><li>\"40-59 anos\": cerca de um segundo de margem;</li><li>\"60 anos ou +\": ficar no azul o tempo todo basta, por pouco, desde que você chegue ao azul bem rápido na largada. Senão, guarde um pouco de vermelho para o fim.</li></ul></li></ul><p><strong>Depois da vitória:</strong> a entrada do estádio abre direto o painel das provas. Lá você escolhe a dificuldade (e um modo \"total wipeout\" com adversários aleatórios), e depois joga de novo tudo, um grupo ou uma prova. O painel de recordes guarda os seus melhores desempenhos. A partir do capítulo 5, essas provas também podem render olivas (veja \"A oferta de Filoxeno\").</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "Capítulo 3 A Ilha da Oliva Minijogos Olimpíadas das Castanholas (Spwort) O princípio. Você não corre: quem corre é o Paspalho (\"O Paspalho\", raia 1). Os adversários dele são Filoxeno, Eudoxie e Xénocrate. São 11 provas, sempre nesta ordem: 3 corridas de velocidade; 3 corridas com barreiras; 3 arremessos de bala de canhão; 2 corridas de resistência (400 m). Em cada prova, o 1º marca 3 pontos, o 2º 2 pontos, o 3º 1 ponto e o último 0. A classificação final é por pontos. Em caso de empate, vence quem tiver o menor tempo total. Ganhar as 6 corridas nem sempre basta: também é preciso fazer alguns pontos nos arremessos ou nos 400 m. O modo Aventura não muda nada nas Olimpíadas: a única dificuldade delas é a \"tendinite\". A dificuldade (\"tendinite\") é o verdadeiro segredo. Na primeira vez, os adversários estão no nível mais difícil, \"12-24 anos\". Se perder, escolha \"Mudar a tendinite\" na tela de classificação final: \"25-39 anos\": adversários um pouco mais lentos, arremessos adversários um pouco menos fortes; \"40-59 anos\": mais lentos ainda, arremessos mais fracos; \"60 anos ou +\": bem mais lentos, arremessos adversários cerca de duas vezes mais curtos. A recompensa é a mesma em qualquer nível. Depois você pode jogar de novo só as provas perdidas: os outros resultados são mantidos. Corridas de velocidade e com barreiras Martele uma única tecla (não o Espaço) a partir do \"Já!\". A primeira tecla apertada fica travada durante toda a corrida. É preciso um ritmo forte: cerca de 7 toques por segundo para ganhar em \"12-24 anos\", cerca de 6,5 em \"25-39 anos\", 6 em \"40-59 anos\", 5,5 em \"60 anos ou +\". No controle, todos os botões frontais, ombros e gatilhos contam como uma única tecla: alterne dois dedos em dois botões. O A não conta durante as barreiras. Barreiras: o Espaço não faz o Paspalho pular. Ele passa direto pelas barreiras, quebra todas e não perde velocidade, enquanto os adversários perdem um pouco de velocidade a cada salto. O Espaço só serve para fazer Barbe-Yeux gritar: concentre-se em martelar. Arremesso de bala de canhão Força: martele uma tecla durante 2 segundos. A barra enche 1/16 por toque: 16 toques dão a força máxima. Mira: o ponteiro varre o arco, ida e volta, em 0,7 segundo por sentido. Aperte Espaço quando ele estiver bem no meio do percurso (60°). A ±2°, você consegue \"Perfeito.\". Quanto mais longe do meio, mais curto o arremesso. Acima de 90°, a bala vai para trás e conta como 0 m. Margem para vencer com força máxima: \"12-24 anos\": cerca de ±9° no 1º arremesso, ±4 a 5° no 2º e no 3º (melhores arremessos adversários: 27,8 m, 30,4 m, 30,8 m); \"25-39 anos\": cerca de ±10°; \"40-59 anos\": cerca de ±16°; \"60 anos ou +\": cerca de ±33°. Corrida de resistência (400 m) Aperte no compasso (o Espaço também funciona). Cada toque faz subir o cursor de ritmo, que desce sozinho. Zona azul : velocidade de cruzeiro, sem cansaço. Para ficar nela, são precisos cerca de 2 toques por segundo. Zona vermelha : mais rápida, mas esvazia a barra de resistência. Com o cursor lá no alto, a barra se esvazia em cerca de 10 segundos. Se ela ficar vazia, o Paspalho perde muita velocidade até a chegada e corre mais devagar do que na zona azul. Abaixo do azul (zona verde), a barra recarrega devagar, mas o Paspalho avança muito mais devagar. O vermelho dá a mesma vantagem para a mesma quantidade de resistência, esteja você logo acima do azul ou lá no alto. O que importa é a barra ficar vazia bem na linha de chegada , nunca antes. Método: Na largada, martele rápido para chegar ao azul em 1 a 2 segundos: cada segundo passado no verde custa caro. Mantenha o azul até um pouco mais da metade do percurso (cerca de 23 segundos de corrida). Aí suba até o alto do vermelho e fique lá até a chegada. Chances conforme a tendinite (as duas corridas de 400 m agora podem ser vencidas): \"12-24 anos\": uma corrida quase perfeita dá cerca de 34,2 s, contra 34,3 s dos melhores adversários. É questão de um décimo de segundo; \"25-39 anos\": cerca de meio segundo de margem; \"40-59 anos\": cerca de um segundo de margem; \"60 anos ou +\": ficar no azul o tempo todo basta, por pouco, desde que você chegue ao azul bem rápido na largada. Senão, guarde um pouco de vermelho para o fim. Depois da vitória: a entrada do estádio abre direto o painel das provas. Lá você escolhe a dificuldade (e um modo \"total wipeout\" com adversários aleatórios), e depois joga de novo tudo, um grupo ou uma prova. O painel de recordes guarda os seus melhores desempenhos. A partir do capítulo 5, essas provas também podem render olivas (veja \"A oferta de Filoxeno\").", "sol": 0}, {"titre": "Batalha naval contra Nadaillac", "html": "<p>Você pilota o navio de Itzel, embaixo na tela, contra o de Nadaillac, em cima. O modo Aventura não muda nada nesta batalha.</p><ul><li><strong>Casco:</strong> 40 pontos para você, 100 para Nadaillac.</li><li><strong>Movimento:</strong> esquerda e direita.</li><li><strong>Habilidades:</strong><ol><li><strong>Canhão</strong>: 6 balas disparadas para a frente, 1 ponto de dano por bala que acerta o casco, recarga de 3 s.</li><li><strong>Balas encadeadas</strong>: aperte e depois clique numa das três trajetórias (esquerda, reto, direita). Elas miram nas velas: cada acerto causa 1 de dano e deixa Nadaillac 10 % mais lento durante 10 s (barra \"VIT\"). Recarga de 3 s.</li><li><strong>Velocidade</strong>: movimento dobrado durante 10 s, recarga de 30 s.</li><li><strong>Reparo</strong>: +20 pontos de casco, recarga de 30 s.</li></ol></li></ul><p>Cada golpe que você acerta reduz em 1 segundo a recarga da velocidade e do reparo.</p><ul><li><strong>No controle:</strong> direcional ou analógico esquerdo para se mover. A = canhão, Y = balas encadeadas, B = velocidade, X = reparo. Para mirar as correntes: X à esquerda, A reto, Y à direita, B para cancelar. Durante os barris, A atira onde estiver a mira.</li><li><strong>Os tiros dele:</strong> mais ou menos a cada 3 s, quando ele está alinhado com você, ele dispara 12 balas (1 de dano cada). Saia da frente assim que ele se posicionar diante de você.</li><li><strong>Dica:</strong> deixe-o mais lento com as correntes (tecla 2), depois emende rajadas de canhão enquanto ele está lento.</li><li><strong>Fases roteirizadas:</strong><ul><li>em 75: 3 tenentes (10 pontos cada) substituem Nadaillac, correntes indisponíveis; eles vão embora depois de 60 s;</li><li>em 50: <strong>barris de pólvora</strong>. Depois de uma contagem regressiva de 3 s, barris caem durante 10 s em 5 corredores. Seus canhões ficam bloqueados: clique nos barris para derrubá-los a tiros de pistola (30 balas). Um barril que atinge o seu navio causa 5 de dano: derrube primeiro os do seu corredor e desvie dos outros;</li><li>em 25: 5 tenentes mais rápidos;</li><li>em 10: última rajada de barris.</li></ul></li><li><strong>Se você afundar:</strong> a batalha recomeça. Depois de 3 derrotas, você pode escolher \"Desistir: sofrer a abordagem.\". A história continua, mas o seu grupo todo começa o combate contra Nadaillac com metade dos PV.</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "Capítulo 3 A Ilha da Oliva Minijogos Batalha naval contra Nadaillac Você pilota o navio de Itzel, embaixo na tela, contra o de Nadaillac, em cima. O modo Aventura não muda nada nesta batalha. Casco: 40 pontos para você, 100 para Nadaillac. Movimento: esquerda e direita. Habilidades: Canhão : 6 balas disparadas para a frente, 1 ponto de dano por bala que acerta o casco, recarga de 3 s. Balas encadeadas : aperte e depois clique numa das três trajetórias (esquerda, reto, direita). Elas miram nas velas: cada acerto causa 1 de dano e deixa Nadaillac 10 % mais lento durante 10 s (barra \"VIT\"). Recarga de 3 s. Velocidade : movimento dobrado durante 10 s, recarga de 30 s. Reparo : +20 pontos de casco, recarga de 30 s. Cada golpe que você acerta reduz em 1 segundo a recarga da velocidade e do reparo. No controle: direcional ou analógico esquerdo para se mover. A = canhão, Y = balas encadeadas, B = velocidade, X = reparo. Para mirar as correntes: X à esquerda, A reto, Y à direita, B para cancelar. Durante os barris, A atira onde estiver a mira. Os tiros dele: mais ou menos a cada 3 s, quando ele está alinhado com você, ele dispara 12 balas (1 de dano cada). Saia da frente assim que ele se posicionar diante de você. Dica: deixe-o mais lento com as correntes (tecla 2), depois emende rajadas de canhão enquanto ele está lento. Fases roteirizadas: em 75: 3 tenentes (10 pontos cada) substituem Nadaillac, correntes indisponíveis; eles vão embora depois de 60 s; em 50: barris de pólvora . Depois de uma contagem regressiva de 3 s, barris caem durante 10 s em 5 corredores. Seus canhões ficam bloqueados: clique nos barris para derrubá-los a tiros de pistola (30 balas). Um barril que atinge o seu navio causa 5 de dano: derrube primeiro os do seu corredor e desvie dos outros; em 25: 5 tenentes mais rápidos; em 10: última rajada de barris. Se você afundar: a batalha recomeça. Depois de 3 derrotas, você pode escolher \"Desistir: sofrer a abordagem.\". A história continua, mas o seu grupo todo começa o combate contra Nadaillac com metade dos PV.", "sol": 0}]}, {"titre": "Imperdível", "intro": "", "entrees": [{"titre": "Imperdível", "html": "<ul><li><strong>Ponto sem volta:</strong> depois da vitória nas Olimpíadas, o seu barco fica bloqueado. Subir no navio de Itzel dispara o fim do capítulo, sem volta. As missões de Calístenes e de Leônidas continuam possíveis depois do capítulo 4, quando a Ilha da Oliva volta a ficar acessível.</li><li><strong>Recompensa escondida das compotas:</strong> depois de recuperar a caixa, passe de novo na loja da Ilha das Maçãs (5 Compotas, 1 Supercompota, 10 000 XP).</li><li><strong>Guarde 5 cavalas</strong> com você ao chegar à Ilha da Oliva: você poderá entregar a missão de Leônidas na hora.</li><li><strong>Itens-chave do capítulo:</strong> 3ª gema dos Bolon Tiku (Olimpíadas), Chave da jaula e depois Caixa de compotas (missão de Calístenes), Tanga de família (recompensa de Calístenes).</li><li>Não há baús na Ilha da Oliva.</li><li><strong>Conquistas do capítulo:</strong><ul><li><strong>\"As castanholas!\"</strong>: terminar o capítulo 3.</li><li><strong>\"Panem et circenses\"</strong>: marcar 32 pontos numa mesma competição de Spwort. É preciso vencer as 11 provas (33 pontos), ou 10 vitórias e um 2º lugar. A pontuação só é verificada no fim de uma competição completa (primeira partida ou \"Recomeçar tudo\" / \"Refazer tudo\"), não depois de jogar de novo uma única prova ou um grupo. O mais simples: ajuste a tendinite para \"60 anos ou +\" e refaça tudo.</li><li>As missões de Calístenes e de Leônidas contam para <strong>\"Pau pra toda obra\"</strong> (todas as missões secundárias), assim como \"A oferta de Filoxeno\", mais tarde.</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "Capítulo 3 A Ilha da Oliva Imperdível Imperdível Ponto sem volta: depois da vitória nas Olimpíadas, o seu barco fica bloqueado. Subir no navio de Itzel dispara o fim do capítulo, sem volta. As missões de Calístenes e de Leônidas continuam possíveis depois do capítulo 4, quando a Ilha da Oliva volta a ficar acessível. Recompensa escondida das compotas: depois de recuperar a caixa, passe de novo na loja da Ilha das Maçãs (5 Compotas, 1 Supercompota, 10 000 XP). Guarde 5 cavalas com você ao chegar à Ilha da Oliva: você poderá entregar a missão de Leônidas na hora. Itens-chave do capítulo: 3ª gema dos Bolon Tiku (Olimpíadas), Chave da jaula e depois Caixa de compotas (missão de Calístenes), Tanga de família (recompensa de Calístenes). Não há baús na Ilha da Oliva. Conquistas do capítulo: \"As castanholas!\" : terminar o capítulo 3. \"Panem et circenses\" : marcar 32 pontos numa mesma competição de Spwort. É preciso vencer as 11 provas (33 pontos), ou 10 vitórias e um 2º lugar. A pontuação só é verificada no fim de uma competição completa (primeira partida ou \"Recomeçar tudo\" / \"Refazer tudo\"), não depois de jogar de novo uma única prova ou um grupo. O mais simples: ajuste a tendinite para \"60 anos ou +\" e refaça tudo. As missões de Calístenes e de Leônidas contam para \"Pau pra toda obra\" (todas as missões secundárias), assim como \"A oferta de Filoxeno\", mais tarde.", "sol": 0}]}]}], "ja": [{"id": "c3", "num": "第3章", "titre": "オリーブ島", "intro": "<p>崖の怪物は倒されました。イツェルは新たな手がかりを追ってオリーブ島へ向かいます。筋骨たくましく、薄着の哲学者たちが暮らす島です。ここでボロン・ティクの宝石を探しますが、それを手に入れるには、ポンコツの一人の（かなり頼りない）助けを借りて、カスタネット・オリンピアードで優勝しなければなりません。船に戻ってからも、平穏にはすみません。</p>", "sections": [{"titre": "メインクエスト", "intro": "", "entrees": [{"titre": "イツェルの船で合流する。", "html": "<p>（クエスト名：「風の島」。このステップは第2章のラストとつながっていて、第2章の攻略でも説明しています。）</p><ol><li>風の島で、島の南東、漁師の女の家の東に停泊しているイツェルの船へ向かいます。</li><li>出発の条件は2つです。<ul><li>ポンコツ二人組が一緒にいること。3つ目の洞窟のふもと（ポンコツのはしご）に置いてきた場合は、イツェルに指摘されます。迎えに行きましょう。</li><li>二人は日焼けしています。<strong>クーリルーの脂</strong> を塗ってやる必要があります（選択肢「クーリルーの脂を塗ってやる」）。塗らないと「ポンコツ二人組は旅ができる状態じゃない。」と言われます。小舟のところで塗った場合もカウントされます。</li></ul></li><li>イツェルが「オリーブ島へ向かう？」と聞いてきます。<strong>はい</strong> と答えましょう。航海が自動で始まり、タイトルカード「第3章 — オリーブ島」が表示されます。</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "第3章 オリーブ島 メインクエスト イツェルの船で合流する。 （クエスト名：「風の島」。このステップは第2章のラストとつながっていて、第2章の攻略でも説明しています。） 風の島で、島の南東、漁師の女の家の東に停泊しているイツェルの船へ向かいます。 出発の条件は2つです。 ポンコツ二人組が一緒にいること。3つ目の洞窟のふもと（ポンコツのはしご）に置いてきた場合は、イツェルに指摘されます。迎えに行きましょう。 二人は日焼けしています。 クーリルーの脂 を塗ってやる必要があります（選択肢「クーリルーの脂を塗ってやる」）。塗らないと「ポンコツ二人組は旅ができる状態じゃない。」と言われます。小舟のところで塗った場合もカウントされます。 イツェルが「オリーブ島へ向かう？」と聞いてきます。 はい と答えましょう。航海が自動で始まり、タイトルカード「第3章 — オリーブ島」が表示されます。", "sol": 0}, {"titre": "イツェルと共にオリーブ島へ向かう", "html": "<ol><li>到着すると、イツェルは怪しい帆を見張るために船に残ります。あなたはポンコツ二人組だけを連れて、島の南の浜辺に上陸します。</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "第3章 オリーブ島 メインクエスト イツェルと共にオリーブ島へ向かう 到着すると、イツェルは怪しい帆を見張るために船に残ります。あなたはポンコツ二人組だけを連れて、島の南の浜辺に上陸します。", "sol": 0}, {"titre": "宝石の噂について情報を集める", "html": "<ol><li>浜辺から北へ登ると、自動でシーンが始まります。裸の老人が、大事なところにカニをぶら下げたまま、画面を行ったり来たりします。助けを求める声は吹き出しに表示され、老人が画面外に出ても吹き出しは画面の端に残ります。</li><li>20秒ほど（3往復）待ちます。画面下に <strong>割って入る</strong> ボタンが現れるので、クリックするか調べるキーを押してください。</li><li><strong>ボス：カニの王</strong>（HP 300。攻撃は強いですが、特殊な仕掛けはありません）。バルブ・ユーとポンコツ二人組で戦います。勝利：2 000 EXP。アドベンチャーモードでは、ほかの戦闘と同じく、受けるダメージが20 %減り、与えるダメージが20 %増えます。</li><li>老人が名乗ります。<strong>フィロクセーヌ・ロンラモー</strong>、島の長のような人物です（本人はその呼び名を好みません）。村で待っていると言います。</li><li>島の中央にある村（ポンコツの大きな像のまわり）へ行きます。フィロクセーヌは像の東南東にいます。話しかけると、宝石はカスタネット・オリンピアードの優勝者に贈られると教えてくれます。</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "第3章 オリーブ島 メインクエスト 宝石の噂について情報を集める 浜辺から北へ登ると、自動でシーンが始まります。裸の老人が、大事なところにカニをぶら下げたまま、画面を行ったり来たりします。助けを求める声は吹き出しに表示され、老人が画面外に出ても吹き出しは画面の端に残ります。 20秒ほど（3往復）待ちます。画面下に 割って入る ボタンが現れるので、クリックするか調べるキーを押してください。 ボス：カニの王 （HP 300。攻撃は強いですが、特殊な仕掛けはありません）。バルブ・ユーとポンコツ二人組で戦います。勝利：2 000 EXP。アドベンチャーモードでは、ほかの戦闘と同じく、受けるダメージが20 %減り、与えるダメージが20 %増えます。 老人が名乗ります。 フィロクセーヌ・ロンラモー 、島の長のような人物です（本人はその呼び名を好みません）。村で待っていると言います。 島の中央にある村（ポンコツの大きな像のまわり）へ行きます。フィロクセーヌは像の東南東にいます。話しかけると、宝石はカスタネット・オリンピアードの優勝者に贈られると教えてくれます。", "sol": 0}, {"titre": "オリンピアードに参加登録する", "html": "<ol><li>村の像の北東にある受付へ行きます。フィロクセーヌと話すまでは閉まっています。</li><li>バルブ・ユーが、ポンコツの一人を勝手にエントリーさせます。ポンコツは「1番レーン」になります。</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "第3章 オリーブ島 メインクエスト オリンピアードに参加登録する 村の像の北東にある受付へ行きます。フィロクセーヌと話すまでは閉まっています。 バルブ・ユーが、ポンコツの一人を勝手にエントリーさせます。ポンコツは「1番レーン」になります。", "sol": 0}, {"titre": "オリンピアードに出場する（そして優勝する！）", "html": "<ol><li>スタジアムは島のいちばん北にあります。登録前は入り口がふさがっています（「まだ中に入ることはできません。」、続いて「まずは受付で登録を済ませてください。」）。</li><li>入り口で「オリンピアードに参加する？」に <strong>はい</strong> を選びます。「まだだ」を選べば立ち去れます。</li><li>アナウンサーの開会のあいさつは初回だけです。そのあと11の競技が続きます（<strong>ミニゲーム &gt; カスタネット・オリンピアード（スポォーツ）</strong> を参照）。</li><li><strong>最終順位で1位</strong>、つまり最多得点で終える必要があります。</li><li>失敗した場合、順位画面から、全部やり直す、難易度を変える（「腱鞘炎を変更」）、競技グループか1競技だけをやり直す、のいずれかを選べます。ほかの結果はそのまま残ります。途中でオリンピアードを抜けると、次に来たときは最初からやり直しです。</li><li>優勝：フィロクセーヌから <strong>ボロン・ティクの第3の宝石</strong> と <strong>50 000 EXP</strong> がもらえます。</li></ol><aside class=\"note\"><p><strong>注意：もうすぐ引き返せなくなります。</strong> オリンピアードで優勝すると、小舟はもう出せなくなります（「ここから海に出るつもりはねえ。イツェルの船に戻らねえと。」）。出口はイツェルの船だけで、乗ると章のラストが始まります。島でやり残したことは先に済ませておきましょう（サブクエストを参照）。</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "第3章 オリーブ島 メインクエスト オリンピアードに出場する（そして優勝する！） スタジアムは島のいちばん北にあります。登録前は入り口がふさがっています（「まだ中に入ることはできません。」、続いて「まずは受付で登録を済ませてください。」）。 入り口で「オリンピアードに参加する？」に はい を選びます。「まだだ」を選べば立ち去れます。 アナウンサーの開会のあいさつは初回だけです。そのあと11の競技が続きます（ ミニゲーム > カスタネット・オリンピアード（スポォーツ） を参照）。 最終順位で1位 、つまり  "到伊策尔的船上和她会合。", "html": "<p>（任务标题：“迎风岛”。这一步衔接第2章的结尾，第2章的攻略里也有介绍。）</p><ol><li>在迎风岛上，去伊策尔的船那里，船停泊在岛的东南，渔妇家的东边。</li><li>出发前要满足两个条件：<ul><li>两个蠢蛋必须和你在一起。如果你把他们留在了第三个洞穴下面（蠢蛋的人梯那里），伊策尔会提醒你：去把他们接回来；</li><li>他们晒伤了。你得给他们抹一份 <strong>库利鲁油脂</strong>（选项“给它们抹点库利鲁油脂”），否则会提示“两个蠢蛋现在这副样子，没法出远门”。在小船那里抹过也算。</li></ul></li><li>伊策尔会问：“前往橄榄岛？”回答 <strong>是</strong>。航行会自动开始，并显示标题卡“第3章 — 橄榄岛”。</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "第3章 橄榄岛 主线任务 到伊策尔的船上和她会合。 （任务标题：“迎风岛”。这一步衔接第2章的结尾，第2章的攻略里也有介绍。） 在迎风岛上，去伊策尔的船那里，船停泊在岛的东南，渔妇家的东边。 出发前要满足两个条件： 两个蠢蛋必须和你在一起。如果你把他们留在了第三个洞穴下面（蠢蛋的人梯那里），伊策尔会提醒你：去把他们接回来； 他们晒伤了。你得给他们抹一份 库利鲁油脂 （选项“给它们抹点库利鲁油脂”），否则会提示“两个蠢蛋现在这副样子，没法出远门”。在小船那里抹过也算。 伊策尔会问：“前往橄榄岛？”回答 是 。航行会自动开始，并显示标题卡“第3章 — 橄榄岛”。", "sol": 0}, {"titre": "和伊策尔一起前往橄榄岛", "html": "<ol><li>到达后，伊策尔留在船上监视一张可疑的船帆。你和两个蠢蛋单独在岛南边的海滩上岸。</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "第3章 橄榄岛 主线任务 和伊策尔一起前往橄榄岛 到达后，伊策尔留在船上监视一张可疑的船帆。你和两个蠢蛋单独在岛南边的海滩上岸。", "sol": 0}, {"titre": "打听可能存在的宝石的消息", "html": "<ol><li>从海滩往北走：会自动触发一段剧情。一个光着身子的老人在屏幕上来回跑，一只螃蟹夹在他的敏感部位上。他的呼救声显示在一个气泡里，他跑出画面时，气泡会留在屏幕边缘。</li><li>等大约 20 秒（他来回跑三趟）。屏幕底部会出现 <strong>介入</strong> 按钮：点击它，或按互动键。</li><li><strong>首领：螃蟹王</strong>（300 HP，下手很重，但没有特殊机制）。你用巴布约和两个蠢蛋一起战斗。获胜：2 000 XP。在冒险模式下，和所有战斗一样，你受到的伤害减少 20%，造成的伤害增加 20%。</li><li>老人自我介绍：他是 <strong>菲洛克塞纳·长枝</strong>，算是岛上的首领（他不喜欢这个词）。他在村子里等你。</li><li>去岛中央的村子（围绕着那座巨大的蠢蛋雕像）。菲洛克塞纳在雕像的东南偏东方向。和他说话：他会告诉你，宝石归响板奥林匹亚大赛的冠军所有。</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "第3章 橄榄岛 主线任务 打听可能存在的宝石的消息 从海滩往北走：会自动触发一段剧情。一个光着身子的老人在屏幕上来回跑，一只螃蟹夹在他的敏感部位上。他的呼救声显示在一个气泡里，他跑出画面时，气泡会留在屏幕边缘。 等大约 20 秒（他来回跑三趟）。屏幕底部会出现 介入 按钮：点击它，或按互动键。 首领：螃蟹王 （300 HP，下手很重，但没有特殊机制）。你用巴布约和两个蠢蛋一起战斗。获胜：2 000 XP。在冒险模式下，和所有战斗一样，你受到的伤害减少 20%，造成的伤害增加 20%。 老人自我介绍：他是 菲洛克塞纳·长枝 ，算是岛上的首领（他不喜欢这个词）。他在村子里等你。 去岛中央的村子（围绕着那座巨大的蠢蛋雕像）。菲洛克塞纳在雕像的东南偏东方向。和他说话：他会告诉你，宝石归响板奥林匹亚大赛的冠军所有。", "sol": 0}, {"titre": "报名参加奥林匹亚大赛", "html": "<ol><li>去村子雕像东北边的报名摊位。在你和菲洛克塞纳说过话之前，它一直不开放。</li><li>巴布约直接替两个蠢蛋之一报了名。这个蠢蛋会是“1 号跑道”。</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "第3章 橄榄岛 主线任务 报名参加奥林匹亚大赛 去村子雕像东北边的报名摊位。在你和菲洛克塞纳说过话之前，它一直不开放。 巴布约直接替两个蠢蛋之一报了名。这个蠢蛋会是“1 号跑道”。", "sol": 0}, {"titre": "参加奥林匹亚大赛（还要赢！）", "html": "<ol><li>体育场在岛的最北边。报名之前，入口是封住的（“您暂时还不能进入此地。”，然后是“请先去报名登记。”）。</li><li>在入口处，对“参加奥林匹亚大赛？”选择 <strong>是</strong>。选“还没到时候”可以离开。</li><li>主持人的开幕致辞只在第一次来时播放。之后 11 个项目会接连进行（见 <strong>小游戏 &gt; 响板奥林匹亚大赛</strong>）。</li><li>你必须在 <strong>最终排名中拿第一</strong>，也就是得分最多。</li><li>如果失败，排名界面可以让你全部重来、调整难度（“调整腱鞘炎”），或者只重赛某一组项目或某一个项目。其他成绩会保留。如果你中途退出大赛，下次来时要从头开始。</li><li>获胜：菲洛克塞纳交给你 <strong>博隆·蒂库第3颗宝石</strong> 和 <strong>50 000 XP</strong>。</li></ol><aside class=\"note\"><p><strong>注意，快到不可回头的节点了。</strong> 一旦赢下奥林匹亚大赛，你的小船就不能再出发了（“我不打算从这儿出海。”）。唯一的出口是伊策尔的船，上船就会进入本章结尾。先把你想在岛上完成的事情做完（见支线任务）。</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "第3章 橄榄岛 主线任务 参加奥林匹亚大赛（还要赢！） 体育场在岛的最北边。报名之前，入口是封住的（“您暂时还不能进入此地。”，然后是“请先去报名登记。”）。 在入口处，对“参加奥林匹亚大赛？”选择 是 。选“还没到时候”可以离开。 主持人的开幕致辞只在第一次来时播放。之后 11 个项目会接连进行（见 小游戏 > 响板奥林匹亚大赛 ）。 你必须在 最终排名中拿第一 ，也就是得分最多。 如果失败，排名界面可以让你全部重来、调整难度（“调整腱鞘炎”），或者只重赛某一组项目或某一个项目。其他成绩会保留。如果你中途退出大赛，下次来时要从头开始。 获胜：菲洛克塞纳交给你 博隆·蒂库第3颗宝石 和 50 000 XP 。 注意，快到不可回头的节点了。 一旦赢下奥林匹亚大赛，你的小船就不能再出发了（“我不打算从这儿出海。”）。唯一的出口是伊策尔的船，上船就会进入本章结尾。先把你想在岛上完成的事情做完（见支线任务）。", "sol": 0}, {"titre": "登上伊策尔的船，扬帆出海。", "html": "<ol><li>回到南边的登陆海滩。伊策尔的船就在你的小船右边。没有宝石的话，伊策尔不肯出发（“我们还没拿到奥林匹亚大赛的宝石。”）。</li><li>一张海盗帆突然出现：是 <strong>双红纳达亚克</strong>，他想要你们的宝石。</li><li>与他的船展开 <strong>海战</strong>（见 <strong>小游戏 &gt; 对纳达亚克的海战</strong>）。</li><li><strong>首领：双红纳达亚克</strong>（接舷战）。你用巴布约、两个蠢蛋和伊策尔一起战斗。<ul><li>第一回合，他会朝队伍里每个人各开一枪（伤害 ×1.5）。之后他会装填弹药并用剑攻击：如果你们 4 个人都站着，持续 3 回合；3 个人站着，2 回合；否则只有 1 回合。让所有人都活着，他开枪的次数就会少一些；每轮齐射之前先回好血。</li><li>HP 低于 2 250 时，他会叫来 4 名援军：一名炮手、两名体型适中的海盗和一名拿着手抢的海盗，全都经过强化。</li><li>HP 低于 1 500 时，他会扔出一颗烟雾弹，随机攻击你的队伍 6 次。然后他会恢复 500 HP，唤起 4 个不死海盗，并跳过下一个回合。</li><li><strong>技巧：</strong> 纳达亚克的 HP 一降到 50，战斗就结束。不用杀他的援军，集中火力打他就行。</li><li>在冒险模式下，他对你造成的伤害减少 20%，你对他造成的伤害增加 20%。2 250、1 500 和 50 HP 这几个节点不变。</li><li>如果失败，战斗会立刻重新开始，HP 和能量全满，不用重打海战。</li></ul></li><li>一段过场动画结束本章，然后显示标题卡“第4章 — 失落之岸”。获得成就 <strong>“响板！”</strong>。</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "第3章 橄榄岛 主线任务 登上伊策尔的船，扬帆出海。 回到南边的登陆海滩。伊策尔的船就在你的小船右边。没有宝石的话，伊策尔不肯出发（“我们还没拿到奥林匹亚大赛的宝石。”）。 一张海盗帆突然出现：是 双红纳达亚克 ，他想要你们的宝石。 与他的船展开 海战 （见 小游戏 > 对纳达亚克的海战 ）。 首领：双红纳达亚克 （接舷战）。你用巴布约、两个蠢蛋和伊策尔一起战斗。 第一回合，他会朝队伍里每个人各开一枪（伤害 ×1.5）。之后他会装填弹药并用剑攻击：如果你们 4 个人都站着，持续 3 回合；3 个人站着，2 回合；否则只有 1 回合。让所有人都活着，他开枪的次数就会少一些；每轮齐射之前先回好血。 HP 低于 2 250 时，他会叫来 4 名援军：一名炮手、两名体型适中的海盗和一名拿着手抢的海盗，全都经过强化。 HP 低于 1 500 时，他会扔出一颗烟雾弹，随机攻击你的队伍 6 次。然后他会恢复 500 HP，唤起 4 个不死海盗，并跳过下一个回合。 技巧： 纳达亚克的 HP 一降到 50，战斗就结束。不用杀他的援军，集中火力打他就行。 在冒险模式下，他对你造成的伤害减少 20%，你对他造成的伤害增加 20%。2 250、1 500 和 50 HP 这几个节点不变。 如果失败，战斗会立刻重新开始，HP 和能量全满，不用重打海战。 一段过场动画结束本章，然后显示标题卡“第4章 — 失落之岸”。获得成就 “响板！” 。", "sol": 0}]}, {"titre": "支线任务", "intro": "", "entrees": [{"titre": "果泥订单（“突出者”卡利斯泰纳）", "html": "<p><em>完成时的标题：“找回卡利斯泰纳订的果泥。”</em></p><ol><li><strong>触发：</strong> 在橄榄岛上，和村子雕像东北角的“突出者”卡利斯泰纳说话。接受（<strong>是</strong>）。如果你拒绝，他之后还会再提。</li><li><strong>苹果岛：</strong> 重新坐上你的小船（在南边海滩，选择“登船”），前往苹果岛。在岛北边的果泥店里，巴布约问起这份订单：商船在莫罗布兰科附近失踪了。地图上解锁了莫罗布兰科岛。</li><li><strong>莫罗布兰科：</strong> 从登陆点（西南）出发，沿西海岸往北走。你会发现一个被关在笼子里的商人。</li><li>就在笼子北边，一个强盗营地会触发一场与 5 个敌人的强制战斗：炮手、体型适中的海盗、拿着手抢的海盗、渔夫和渔妇。获胜：<strong>笼子钥匙</strong>。</li><li>带着钥匙回到笼子那里：商人会给你 <strong>一箱果泥</strong>。</li><li><strong>奖励 1：</strong> 把这箱果泥带回橄榄岛交给卡利斯泰纳。你获得 <strong>40 000 XP</strong> 和 <strong>传家兜裆布</strong>（腿部装备，两个蠢蛋防御 +10）。</li><li><strong>奖励 2（很容易忘）：</strong> 之后再去一趟苹果岛的果泥店。小贩会给你 <strong>5 份果泥</strong>、<strong>1 份超级果泥</strong>（恢复 150 HP 和 75% 能量）和 <strong>10 000 XP</strong>。</li></ol><aside class=\"note\"><p>在第3章时，要在 <strong>赢下奥林匹亚大赛之前</strong> 完成它：赢了之后，你的小船就离不开这座岛了。否则，橄榄岛在后面的冒险中（第4章之后）还能再去，卡利斯泰纳会在那里等你。</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "第3章 橄榄岛 支线任务 果泥订单（“突出者”卡利斯泰纳） 完成时的标题：“找回卡利斯泰纳订的果泥。” 触发： 在橄榄岛上，和村子雕像东北角的“突出者”卡利斯泰纳说话。接受（ 是 ）。如果你拒绝，他之后还会再提。 苹果岛： 重新坐上你的小船（在南边海滩，选择“登船”），前往苹果岛。在岛北边的果泥店里，巴布约问起这份订单：商船在莫罗布兰科附近失踪了。地图上解锁了莫罗布兰科岛。 莫罗布兰科： 从登陆点（西南）出发，沿西海岸往北走。你会发现一个被关在笼子里的商人。 就在笼子北边，一个强盗营地会触发一场与 5 个敌人的强制战斗：炮手、体型适中的海盗、拿着手抢的海盗、渔夫和渔妇。获胜： 笼子钥匙 。 带着钥匙回到笼子那里：商人会给你 一箱果泥 。 奖励 1： 把这箱果泥带回橄榄岛交给卡利斯泰纳。你获得 40 000 XP 和 传家兜裆布 （腿部装备，两个蠢蛋防御 +10）。 奖励 2（很容易忘）： 之后再去一趟苹果岛的果泥店。小贩会给你 5 份果泥 、 1 份超级果泥 （恢复 150 HP 和 75% 能量）和 10 000 XP 。 在第3章时，要在 赢下奥林匹亚大赛之前 完成它：赢了之后，你的小船就离不开这座岛了。否则，橄榄岛在后面的冒险中（第4章之后）还能再去，卡利斯泰纳会在那里等你。", "sol": 0}, {"titre": "给莱奥尼达斯带些鲭鱼。", "html": "<p><em>完成时的标题：“给莱昂尼达斯带回5条鲭鱼。”</em></p><ol><li><strong>触发：</strong> 和莱昂尼达斯说话，他在村子雕像的东边偏南。他想要鱼：接受（<strong>是</strong>）。你也可以在奥林匹亚大赛之后再触发它。</li><li><strong>目标：</strong> 5 条 <strong>鲭鱼</strong>。在螃蟹岛（海滩）和迎风岛都能钓到。鲭鱼的组合：<strong>← ← → →</strong>。在螃蟹岛上，每次钓到的鱼大约有 1/3 的几率是鲭鱼（迎风岛上更低，因为那里库利鲁经常咬钩）。</li><li>别把鲭鱼卖给螃蟹岛和迎风岛的渔夫，他们会收购。</li><li>带着 5 条鲭鱼回来找莱昂尼达斯：<strong>30 000 XP</strong>。</li></ol><aside class=\"note\"><p>和卡利斯泰纳的任务一样：在第3章赢下奥林匹亚大赛后，你就无法离开这座岛了。如果那时你身上已经有 5 条鲭鱼，就可以当场交任务。否则，就留到第4章之后回到橄榄岛时再交。</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "第3章 橄榄岛 支线任务 给莱奥尼达斯带些鲭鱼。 完成时的标题：“给莱昂尼达斯带回5条鲭鱼。” 触发： 和莱昂尼达斯说话，他在村子雕像的东边偏南。他想要鱼：接受（ 是 ）。你也可以在奥林匹亚大赛之后再触发它。 目标： 5 条 鲭鱼 。在螃蟹岛（海滩）和迎风岛都能钓到。鲭鱼的组合： ← ← → → 。在螃蟹岛上，每次钓到的鱼大约有 1/3 的几率是鲭鱼（迎风岛上更低，因为那里库利鲁经常咬钩）。 别把鲭鱼卖给螃蟹岛和迎风岛的渔夫，他们会收购。 带着 5 条鲭鱼回来找莱昂尼达斯： 30 000 XP 。 和卡利斯泰纳的任务一样：在第3章赢下奥林匹亚大赛后，你就无法离开这座岛了。如果那时你身上已经有 5 条鲭鱼，就可以当场交任务。否则，就留到第4章之后回到橄榄岛时再交。", "sol": 0}, {"titre": "菲洛克塞纳的提议。（第5章起）", "html": "<p>这个任务发生在橄榄岛，但要在第4章结束后才会开启：它属于第5章的时期。这里简单介绍一下，因为它是在奥林匹亚大赛的体育场里进行的。</p><ol><li><strong>触发：</strong> 在螃蟹岛的酒馆向老板打听消息。他会提到菲洛克塞纳的一个提议：接受。</li><li>去橄榄岛找菲洛克塞纳。他提出，你在体育场每重赛一个项目，他就用 <strong>橄榄</strong> 付钱。</li><li>在体育场重赛项目：<strong>每完成一个项目得 2 颗橄榄</strong>，获胜或创造新纪录再 +1 颗，但只限腱鞘炎设为“12-24岁”或“25-39岁”时。第一次交付橄榄就完成任务：<strong>当前等级所需经验的 75%</strong>。</li><li>之后，任何一位酒馆老板（螃蟹岛、猴岛、迎风岛、拿骚）都能酿造 <strong>奥莱特</strong>：5 颗橄榄 + 1 朗姆酒，或 5 颗橄榄 + 5 金币。战斗中，奥莱特能让全队每回合恢复 25% 能量，持续 4 回合。</li></ol>", "id": "c3-l-offre-de-philoxene-a-partir-du-chapitre-5", "texte": "第3章 橄榄岛 支线任务 菲洛克塞纳的提议。（第5章起） 这个任务发生在橄榄岛，但要在第4章结束后才会开启：它属于第5章的时期。这里简单介绍一下，因为它是在奥林匹亚大赛的体育场里进行的。 触发： 在螃蟹岛的酒馆向老板打听消息。他会提到菲洛克塞纳的一个提议：接受。 去橄榄岛找菲洛克塞纳。他提出，你在体育场每重赛一个项目，他就用 橄榄 付钱。 在体育场重赛项目： 每完成一个项目得 2 颗橄榄 ，获胜或创造新纪录再 +1 颗，但只限腱鞘炎设为“12-24岁”或“25-39岁”时。第一次交付橄榄就完成任务： 当前等级所需经验的 75% 。 之后，任何一位酒馆老板（螃蟹岛、猴岛、迎风岛、拿骚）都能酿造 奥莱特 ：5 颗橄榄 + 1 朗姆酒，或 5 颗橄榄 + 5 金币。战斗中，奥莱特能让全队每回合恢复 25% 能量，持续 4 回合。", "sol": 0}, {"titre": "没有任务的角色", "html": "<ul><li><strong>欧多克西</strong>（雕像东边）：奥林匹亚大赛的运动员，只有普通对话。</li><li><strong>纪录牌</strong>（村子北边，体育场附近）：在你获胜之前显示“这里暂时什么都没有……”。之后会显示最好的用时和投掷成绩。</li><li><strong>蠢蛋雕像</strong>，在村子中央：你或蠢蛋们走到它后面时，它会挡住你们。会有一个彩色轮廓显示你的位置（选项“被遮挡时显示轮廓”，在 设置 &gt; 辅助功能 中，默认开启）。随着冒险推进，雕像的样子会发生变化。通关后，它会完工并戴上月桂冠。</li></ul>", "id": "c3-personnages-sans-quete", "texte": "第3章 橄榄岛 支线任务 没有任务的角色 欧多克西 （雕像东边）：奥林匹亚大赛的运动员，只有普通对话。 纪录牌 （村子北边，体育场附近）：在你获胜之前显示“这里暂时什么都没有……”。之后会显示最好的用时和投掷成绩。 蠢蛋雕像 ，在村子中央：你或蠢蛋们走到它后面时，它会挡住你们。会有一个彩色轮廓显示你的位置（选项“被遮挡时显示轮廓”，在 设置 > 辅助功能 中，默认开启）。随着冒险推进，雕像的样子会发生变化。通关后，它会完工并戴上月桂冠。", "sol": 0}]}, {"titre": "小游戏", "intro": "", "entrees": [{"titre": "响板奥林匹亚大赛（斯泼特）", "html": "<p><strong>基本原理。</strong> 不是你自己跑：跑的是蠢蛋（“蠢蛋”，1 号跑道）。他的对手是菲洛克塞纳、欧多克西和色诺克拉底。一共 11 个项目，顺序始终不变：</p><ul><li>3 场短跑；</li><li>3 场跨栏；</li><li>3 次掷炮弹；</li><li>2 场耐力跑（400 米）。</li></ul><p>每个项目第 1 名得 3 分，第 2 名 2 分，第 3 名 1 分，最后一名 0 分。最终按总分排名。如果同分，总用时最短的人获胜。只赢下 6 场赛跑不一定够：还得在掷炮弹或 400 米上拿些分。</p><p>冒险模式对奥林匹亚大赛没有任何影响：这里唯一的难度设置是“腱鞘炎”。</p><p><strong>难度（“腱鞘炎”）才是真正的秘诀。</strong> 第一次时，对手处在最难的级别“12-24岁”。如果输了，就在最终排名界面选择 <strong>“调整腱鞘炎”</strong>：</p><ul><li>“25-39岁”：对手稍慢一些，对手的投掷稍弱一些；</li><li>“40-59岁”：更慢，投掷更弱；</li><li>“60岁及以上”：明显更慢，对手的投掷距离大约只有一半。</li></ul><p>无论哪个级别，奖励都一样。之后你可以只重赛输掉的项目：其他成绩会保留。</p><p><strong>短跑和跨栏</strong></p><ul><li>听到发令后，<strong>只狂按一个键</strong>（不能用空格）。你按下的第一个键会锁定整场比赛。</li><li>节奏要快：在“12-24岁”大约需要 <strong>每秒按 7 次</strong> 才能赢，“25-39岁”约 6.5 次，“40-59岁”约 6 次，“60岁及以上”约 5.5 次。</li><li>用手柄时，所有正面按键、肩键和扳机键都算同一个键：用两根手指在两个按键上交替按。跨栏时 A 键不算。</li><li><strong>跨栏：</strong> 空格不会让蠢蛋跳起来。他会直接冲过栏架，把它们撞断，速度也不会降，而他的对手每跳一次都会损失一点速度。空格只会让巴布约大喊一声：专心狂按就行。</li></ul><p><strong>掷炮弹</strong></p><ol><li><strong>力量：</strong> 在 2 秒内狂按一个键。每按一次，计量条涨 1/16：按 16 次就是最大力量。</li><li><strong>瞄准：</strong> 指针在弧线上来回摆动，每个方向 0.7 秒。在 <strong>指针正好摆到中间时按空格</strong>（60°）。误差在 ±2° 以内就是“完美”。离中间越远，投得越近。超过 90° 时，炮弹会往后飞，记为 0 米。</li><li>以最大力量获胜所允许的误差：<ul><li>“12-24岁”：第 1 投约 ±9°，第 2、3 投约 ±4 到 5°（对手最好成绩：27.8 米、30.4 米、30.8 米）；</li><li>“25-39岁”：约 ±10°；</li><li>“40-59岁”：约 ±16°；</li><li>“60岁及以上”：约 ±33°。</li></ul></li></ol><p><strong>耐力跑（400 米）</strong></p><ul><li>有节奏地按键（空格也可以）。每按一次，节奏指针就会上升，然后自己慢慢落下。</li><li><strong>蓝色</strong> 区域：巡航速度，不消耗体力。要保持在这里，大约需要每秒按 2 次。</li><li><strong>红色</strong> 区域：更快，但会消耗耐力条。指针在最顶端时，耐力条大约 10 秒就会耗光。耗光后，蠢蛋会明显减速一直到终点，跑得比在蓝色区域时还慢。</li><li>低于蓝色（绿色区域）时，耐力条会慢慢恢复，但蠢蛋前进得慢多了。</li><li>无论你是刚好在蓝色上方，还是在最顶端，红色区域里消耗同样多的耐力换来的领先距离都一样。关键在于让耐力条 <strong>正好在冲过终点时耗光</strong>，绝不能提前。</li><li><strong>方法：</strong><ol><li>起跑时快速狂按，在 1 到 2 秒内进入蓝色：在绿色区域多待一秒都很亏。</li><li>保持在蓝色，直到跑过一半多一点（比赛开始后大约 23 秒）。</li><li>然后冲到红色的最顶端，一直保持到终点。</li></ol></li><li>各腱鞘炎级别下的胜算（两场 400 米现在都能赢）：<ul><li>“12-24岁”：一场近乎完美的比赛大约 34.2 秒，最好的对手是 34.3 秒。胜负只差十分之一秒；</li><li>“25-39岁”：大约有半秒的余量；</li><li>“40-59岁”：大约有一秒的余量；</li><li>“60岁及以上”：全程保持蓝色刚好够赢，前提是起跑时很快进入蓝色。否则，就在最后留一点红色冲刺。</li></ul></li></ul><p><strong>获胜之后：</strong> 体育场入口会直接打开项目面板。你可以在那里选择难度（还有一个对手随机的“终极全灭”模式），然后重赛全部项目、某一组或某一个项目。纪录牌会保存你的最佳成绩。从第5章起，这些项目还能赚到橄榄（见“菲洛克塞纳的提议。”）。</p>", "id": "c3-olympiades-des-castagnettes-spwort", "texte": "第3章 橄榄岛 小游戏 响板奥林匹亚大赛（斯泼特） 基本原理。 不是你自己跑：跑的是蠢蛋（“蠢蛋”，1 号跑道）。他的对手是菲洛克塞纳、欧多克西和色诺克拉底。一共 11 个项目，顺序始终不变： 3 场短跑； 3 场跨栏； 3 次掷炮弹； 2 场耐力跑（400 米）。 每个项目第 1 名得 3 分，第 2 名 2 分，第 3 名 1 分，最后一名 0 分。最终按总分排名。如果同分，总用时最短的人获胜。只赢下 6 场赛跑不一定够：还得在掷炮弹或 400 米上拿些分。 冒险模式对奥林匹亚大赛没有任何影响：这里唯一的难度设置是“腱鞘炎”。 难度（“腱鞘炎”）才是真正的秘诀。 第一次时，对手处在最难的级别“12-24岁”。如果输了，就在最终排名界面选择 “调整腱鞘炎” ： “25-39岁”：对手稍慢一些，对手的投掷稍弱一些； “40-59岁”：更慢，投掷更弱； “60岁及以上”：明显更慢，对手的投掷距离大约只有一半。 无论哪个级别，奖励都一样。之后你可以只重赛输掉的项目：其他成绩会保留。 短跑和跨栏 听到发令后， 只狂按一个键 （不能用空格）。你按下的第一个键会锁定整场比赛。 节奏要快：在“12-24岁”大约需要 每秒按 7 次 才能赢，“25-39岁”约 6.5 次，“40-59岁”约 6 次，“60岁及以上”约 5.5 次。 用手柄时，所有正面按键、肩键和扳机键都算同一个键：用两根手指在两个按键上交替按。跨栏时 A 键不算。 跨栏： 空格不会让蠢蛋跳起来。他会直接冲过栏架，把它们撞断，速度也不会降，而他的对手每跳一次都会损失一点速度。空格只会让巴布约大喊一声：专心狂按就行。 掷炮弹 力量： 在 2 秒内狂按一个键。每按一次，计量条涨 1/16：按 16 次就是最大力量。 瞄准： 指针在弧线上来回摆动，每个方向 0.7 秒。在 指针正好摆到中间时按空格 （60°）。误差在 ±2° 以内就是“完美”。离中间越远，投得越近。超过 90° 时，炮弹会往后飞，记为 0 米。 以最大力量获胜所允许的误差： “12-24岁”：第 1 投约 ±9°，第 2、3 投约 ±4 到 5°（对手最好成绩：27.8 米、30.4 米、30.8 米）； “25-39岁”：约 ±10°； “40-59岁”：约 ±16°； “60岁及以上”：约 ±33°。 耐力跑（400 米） 有节奏地按键（空格也可以）。每按一次，节奏指针就会上升，然后自己慢慢落下。 蓝色 区域：巡航速度，不消耗体力。要保持在这里，大约需要每秒按 2 次。 红色 区域：更快，但会消耗耐力条。指针在最顶端时，耐力条大约 10 秒就会耗光。耗光后，蠢蛋会明显减速一直到终点，跑得比在蓝色区域时还慢。 低于蓝色（绿色区域）时，耐力条会慢慢恢复，但蠢蛋前进得慢多了。 无论你是刚好在蓝色上方，还是在最顶端，红色区域里消耗同样多的耐力换来的领先距离都一样。关键在于让耐力条 正好在冲过终点时耗光 ，绝不能提前。 方法： 起跑时快速狂按，在 1 到 2 秒内进入蓝色：在绿色区域多待一秒都很亏。 保持在蓝色，直到跑过一半多一点（比赛开始后大约 23 秒）。 然后冲到红色的最顶端，一直保持到终点。 各腱鞘炎级别下的胜算（两场 400 米现在都能赢）： “12-24岁”：一场近乎完美的比赛大约 34.2 秒，最好的对手是 34.3 秒。胜负只差十分之一秒； “25-39岁”：大约有半秒的余量； “40-59岁”：大约有一秒的余量； “60岁及以上”：全程保持蓝色刚好够赢，前提是起跑时很快进入蓝色。否则，就在最后留一点红色冲刺。 获胜之后： 体育场入口会直接打开项目面板。你可以在那里选择难度（还有一个对手随机的“终极全灭”模式），然后重赛全部项目、某一组或某一个项目。纪录牌会保存你的最佳成绩。从第5章起，这些项目还能赚到橄榄（见“菲洛克塞纳的提议。”）。", "sol": 0}, {"titre": "对纳达亚克的海战", "html": "<p>你驾驶屏幕下方伊策尔的船，对抗上方纳达亚克的船。冒险模式对这场海战没有任何影响。</p><ul><li><strong>船体：</strong> 你有 40 点，纳达亚克有 100 点。</li><li><strong>移动：</strong> 左右移动。</li><li><strong>技能：</strong><ol><li><strong>大炮</strong>：向正前方发射 6 发炮弹，每发命中船体造成 1 点伤害，冷却 3 秒。</li><li><strong>链弹</strong>：按下后，点击三条弹道之一（左、正前、右）。链弹瞄准船帆：每次命中造成 1 点伤害，并让纳达亚克减速 10%，持续 10 秒（“航速”槽）。冷却 3 秒。</li><li><strong>加速</strong>：移动速度翻倍，持续 10 秒，冷却 30 秒。</li><li><strong>修理</strong>：船体 +20 点，冷却 30 秒。</li></ol></li></ul><p>你每命中一次，加速和修理的冷却时间就减少 1 秒。</p><ul><li><strong>用手柄时：</strong> 十字键或左摇杆移动。A = 大炮，Y = 链弹，B = 加速，X = 修理。瞄准链弹时：X 向左，A 正前，Y 向右，B 取消。火药桶阶段，A 会朝准星所在的位置开枪。</li><li><strong>他的炮击：</strong> 大约每 3 秒，当他和你对齐时，会发射 12 发炮弹（每发 1 点伤害）。他一到你正对面就赶紧闪开。</li><li><strong>技巧：</strong> 先用链弹（第 2 个技能）让他减速，然后趁他慢下来时连续开炮。</li><li><strong>剧情阶段：</strong><ul><li>75 点时：3 名副官（每人 10 点）代替纳达亚克上场，链弹不可用；60 秒后他们会撤走；</li><li>50 点时：<strong>火药桶</strong>。3 秒倒计时后，火药桶会在 10 秒内落向 5 条航道。你的大炮被锁定：点击火药桶，用手枪把它们打掉（30 发子弹）。命中你船的火药桶造成 5 点伤害：优先打掉你所在航道的，其他的躲开；</li><li>25 点时：5 名速度更快的副官；</li><li>10 点时：最后一轮火药桶。</li></ul></li><li><strong>如果你的船沉了：</strong> 海战会重新开始。失败 3 次后，你可以选择“放弃：任由对方登船。”。剧情会继续，但你的全队在与纳达亚克的战斗开始时只有一半 HP。</li></ul>", "id": "c3-bataille-navale-contre-nadaillac", "texte": "第3章 橄榄岛 小游戏 对纳达亚克的海战 你驾驶屏幕下方伊策尔的船，对抗上方纳达亚克的船。冒险模式对这场海战没有任何影响。 船体： 你有 40 点，纳达亚克有 100 点。 移动： 左右移动。 技能： 大炮 ：向正前方发射 6 发炮弹，每发命中船体造成 1 点伤害，冷却 3 秒。 链弹 ：按下后，点击三条弹道之一（左、正前、右）。链弹瞄准船帆：每次命中造成 1 点伤害，并让纳达亚克减速 10%，持续 10 秒（“航速”槽）。冷却 3 秒。 加速 ：移动速度翻倍，持续 10 秒，冷却 30 秒。 修理 ：船体 +20 点，冷却 30 秒。 你每命中一次，加速和修理的冷却时间就减少 1 秒。 用手柄时： 十字键或左摇杆移动。A = 大炮，Y = 链弹，B = 加速，X = 修理。瞄准链弹时：X 向左，A 正前，Y 向右，B 取消。火药桶阶段，A 会朝准星所在的位置开枪。 他的炮击： 大约每 3 秒，当他和你对齐时，会发射 12 发炮弹（每发 1 点伤害）。他一到你正对面就赶紧闪开。 技巧： 先用链弹（第 2 个技能）让他减速，然后趁他慢下来时连续开炮。 剧情阶段： 75 点时：3 名副官（每人 10 点）代替纳达亚克上场，链弹不可用；60 秒后他们会撤走； 50 点时： 火药桶 。3 秒倒计时后，火药桶会在 10 秒内落向 5 条航道。你的大炮被锁定：点击火药桶，用手枪把它们打掉（30 发子弹）。命中你船的火药桶造成 5 点伤害：优先打掉你所在航道的，其他的躲开； 25 点时：5 名速度更快的副官； 10 点时：最后一轮火药桶。 如果你的船沉了： 海战会重新开始。失败 3 次后，你可以选择“放弃：任由对方登船。”。剧情会继续，但你的全队在与纳达亚克的战斗开始时只有一半 HP。", "sol": 0}]}, {"titre": "不要错过", "intro": "", "entrees": [{"titre": "不要错过", "html": "<ul><li><strong>不可回头的节点：</strong> 赢下奥林匹亚大赛后，你的小船就被锁住了。登上伊策尔的船就会进入本章结尾，无法返回。卡利斯泰纳和莱昂尼达斯的任务在第4章之后还能完成，那时橄榄岛会重新开放。</li><li><strong>果泥的隐藏奖励：</strong> 拿到那箱果泥之后，再去一趟苹果岛的店（5 份果泥、1 份超级果泥、10 000 XP）。</li><li>来橄榄岛时 <strong>身上带好 5 条鲭鱼</strong>：这样就能马上交莱昂尼达斯的任务。</li><li><strong>本章关键道具：</strong> 博隆·蒂库第3颗宝石（奥林匹亚大赛），笼子钥匙和一箱果泥（卡利斯泰纳的任务），传家兜裆布（卡利斯泰纳的奖励）。</li><li>橄榄岛上没有宝箱。</li><li><strong>本章成就：</strong><ul><li><strong>“响板！”</strong>：完成第3章。</li><li><strong>“面包与马戏”</strong>：在同一场斯泼特比赛中拿到 32 分。你得赢下全部 11 个项目（33 分），或者 10 胜加一个第 2 名。只有在一整场比赛结束时（第一次比赛，或“全部重来”/“全部重赛”）才会检查分数，只重赛一个项目或一组项目不算。最简单的办法：把腱鞘炎设为“60岁及以上”，然后全部重赛。</li><li>卡利斯泰纳和莱昂尼达斯的任务都计入 <strong>“万事通”</strong>（所有支线任务），之后的“菲洛克塞纳的提议。”也一样。</li></ul></li></ul>", "id": "c3-a-ne-pas-rater", "texte": "第3章 橄榄岛 不要错过 不要错过 不可回头的节点： 赢下奥林匹亚大赛后，你的小船就被锁住了。登上伊策尔的船就会进入本章结尾，无法返回。卡利斯泰纳和莱昂尼达斯的任务在第4章之后还能完成，那时橄榄岛会重新开放。 果泥的隐藏奖励： 拿到那箱果泥之后，再去一趟苹果岛的店（5 份果泥、1 份超级果泥、10 000 XP）。 来橄榄岛时 身上带好 5 条鲭鱼 ：这样就能马上交莱昂尼达斯的任务。 本章关键道具： 博隆·蒂库第3颗宝石（奥林匹亚大赛），笼子钥匙和一箱果泥（卡利斯泰纳的任务），传家兜裆布（卡利斯泰纳的奖励）。 橄榄岛上没有宝箱。 本章成就： “响板！” ：完成第3章。 “面包与马戏” ：在同一场斯泼特比赛中拿到 32 分。你得赢下全部 11 个项目（33 分），或者 10 胜加一个第 2 名。只有在一整场比赛结束时（第一次比赛，或“全部重来”/“全部重赛”）才会检查分数，只重赛一个项目或一组项目不算。最简单的办法：把腱鞘炎设为“60岁及以上”，然后全部重赛。 卡利斯泰纳和莱昂尼达斯的任务都计入 “万事通” （所有支线任务），之后的“菲洛克塞纳的提议。”也一样。", "sol": 0}]}]}], "ko": [{"id": "c3", "num": "3장", "titre": "올리브섬", "intro": "<p>절벽의 괴물을 물리친 뒤, 이첼은 새로운 단서를 따라 올리브섬으로 가요. 근육질에 옷은 별로 걸치지 않은 철학자들의 섬이에요. 여기서 볼론 티쿠의 보석을 찾아야 하는데, 두 멍청이 중 하나의 (아주 미덥지 않은) 도움을 받아 캐스터네츠 올림피아드에서 우승해야 얻을 수 있어요. 배로 돌아가는 길도 순탄하지 않아요.</p>", "sections": [{"titre": "메인 퀘스트", "intro": "", "entrees": [{"titre": "이첼의 배에 합류하기.", "html": "<p>(퀘스트 제목: \"바람섬\". 이 단계는 2장 끝과 이어지며, 2장 공략에도 설명되어 있어요.)</p><ol><li>바람섬에서 이첼의 배로 가요. 섬 남동쪽, 여자 어부 집 동쪽에 정박해 있어요.</li><li>떠나기 전 조건이 두 가지 있어요.<ul><li>두 멍청이가 함께 있어야 해요. 세 번째 동굴 아래(멍청이들의 무등 사다리)에 두고 왔다면 이첼이 지적해요. 데리러 가세요.</li><li>두 멍청이는 햇볕에 데었어요. <strong>쿨리루 기름</strong>을 발라 줘야 해요(\"쿨리루 기름을 발라 준다\" 선택). 안 그러면 \"두 멍청이는 여행할 상태가 아닙니다.\"라고 나와요. 쪽배에서 발라 준 것도 인정돼요.</li></ul></li><li>이첼이 \"올리브섬으로 갈까요?\"라고 물어요. <strong>응</strong>으로 답하세요. 항해가 자동으로 시작되고 \"3장 — 올리브섬\" 타이틀 카드가 나와요.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire", "texte": "3장 올리브섬 메인 퀘스트 이첼의 배에 합류하기. (퀘스트 제목: \"바람섬\". 이 단계는 2장 끝과 이어지며, 2장 공략에도 설명되어 있어요.) 바람섬에서 이첼의 배로 가요. 섬 남동쪽, 여자 어부 집 동쪽에 정박해 있어요. 떠나기 전 조건이 두 가지 있어요. 두 멍청이가 함께 있어야 해요. 세 번째 동굴 아래(멍청이들의 무등 사다리)에 두고 왔다면 이첼이 지적해요. 데리러 가세요. 두 멍청이는 햇볕에 데었어요. 쿨리루 기름 을 발라 줘야 해요(\"쿨리루 기름을 발라 준다\" 선택). 안 그러면 \"두 멍청이는 여행할 상태가 아닙니다.\"라고 나와요. 쪽배에서 발라 준 것도 인정돼요. 이첼이 \"올리브섬으로 갈까요?\"라고 물어요. 응 으로 답하세요. 항해가 자동으로 시작되고 \"3장 — 올리브섬\" 타이틀 카드가 나와요.", "sol": 0}, {"titre": "이첼과 함께 올리브섬으로 가기", "html": "<ol><li>도착하면 이첼은 수상한 돛을 감시하려고 배에 남아요. 두 멍청이와 함께 섬 남쪽 해변에 내려요.</li></ol>", "id": "c3-se-rendre-sur-l-ile-d-olive-en-compagnie-d-itzel", "texte": "3장 올리브섬 메인 퀘스트 이첼과 함께 올리브섬으로 가기 도착하면 이첼은 수상한 돛을 감시하려고 배에 남아요. 두 멍청이와 함께 섬 남쪽 해변에 내려요.", "sol": 0}, {"titre": "보석이 있을지도 모르니 정보 찾기", "html": "<ol><li>해변에서 북쪽으로 올라가면 장면이 자동으로 시작돼요. 벌거벗은 노인이 민감한 부위에 게를 매단 채 화면을 이리저리 가로질러요. 노인이 화면 밖으로 나가도 도움을 청하는 말풍선은 화면 가장자리에 계속 떠 있어요.</li><li>약 20초(세 번 왕복) 기다리세요. 그러면 화면 아래에 <strong>끼어들기</strong> 버튼이 나타나요. 클릭하거나 상호작용 키를 누르세요.</li><li><strong>보스: 게왕</strong> (HP 300, 세게 때리지만 특별한 패턴은 없어요). 바르브외와 두 멍청이가 함께 싸워요. 승리하면 경험치 2,000. 모험 모드에서는 다른 모든 전투처럼 받는 피해가 20% 줄고 주는 피해가 20% 늘어요.</li><li>노인이 자기소개를 해요. 섬의 족장 같은 존재인 <strong>필록센 롱라모</strong>예요(그 말을 좋아하지는 않아요). 마을에서 기다리겠다고 해요.</li><li>섬 중앙의 마을(커다란 멍청이 석상 주변)로 가요. 필록센은 석상의 동남동쪽에 있어요. 말을 걸면 보석은 캐스터네츠 올림피아드 우승자에게 돌아간다고 설명해 줘요.</li></ol>", "id": "c3-trouver-des-renseignements-sur-une-eventuelle-gemme", "texte": "3장 올리브섬 메인 퀘스트 보석이 있을지도 모르니 정보 찾기 해변에서 북쪽으로 올라가면 장면이 자동으로 시작돼요. 벌거벗은 노인이 민감한 부위에 게를 매단 채 화면을 이리저리 가로질러요. 노인이 화면 밖으로 나가도 도움을 청하는 말풍선은 화면 가장자리에 계속 떠 있어요. 약 20초(세 번 왕복) 기다리세요. 그러면 화면 아래에 끼어들기 버튼이 나타나요. 클릭하거나 상호작용 키를 누르세요. 보스: 게왕 (HP 300, 세게 때리지만 특별한 패턴은 없어요). 바르브외와 두 멍청이가 함께 싸워요. 승리하면 경험치 2,000. 모험 모드에서는 다른 모든 전투처럼 받는 피해가 20% 줄고 주는 피해가 20% 늘어요. 노인이 자기소개를 해요. 섬의 족장 같은 존재인 필록센 롱라모 예요(그 말을 좋아하지는 않아요). 마을에서 기다리겠다고 해요. 섬 중앙의 마을(커다란 멍청이 석상 주변)로 가요. 필록센은 석상의 동남동쪽에 있어요. 말을 걸면 보석은 캐스터네츠 올림피아드 우승자에게 돌아간다고 설명해 줘요.", "sol": 0}, {"titre": "올림피아드에 참가 신청하기", "html": "<ol><li>마을 석상 북동쪽의 접수처로 가요. 필록센과 대화하기 전에는 닫혀 있어요.</li><li>바르브외가 두 멍청이 중 하나를 마음대로 등록해 버려요. 그 멍청이는 \"1번 레인\"이에요.</li></ol>", "id": "c3-s-inscrire-aux-olympiades", "texte": "3장 올리브섬 메인 퀘스트 올림피아드에 참가 신청하기 마을 석상 북동쪽의 접수처로 가요. 필록센과 대화하기 전에는 닫혀 있어요. 바르브외가 두 멍청이 중 하나를 마음대로 등록해 버려요. 그 멍청이는 \"1번 레인\"이에요.", "sol": 0}, {"titre": "올림피아드에 참가하기 (그리고 우승하기!)", "html": "<ol><li>경기장은 섬 맨 북쪽에 있어요. 접수 전에는 입구가 막혀 있어요(\"아직 이곳에 들어갈 수 없습니다.\", 이어서 \"먼저 참가 접수를 하셔야 합니다.\").</li><li>입구에서 \"올림피아드에 참가할까?\"에 <strong>응</strong>을 고르세요. \"아직 아니다\"를 고르면 그냥 돌아갈 수 있어요.</li><li>아나운서의 개막 연설은 첫 방문 때만 나와요. 그 뒤 11개 종목이 이어져요(<strong>미니게임 &gt; 캐스터네츠 올림피아드</strong> 참고).</li><li><strong>최종 순위 1위</strong>, 즉 점수가 가장 높아야 해요.</li><li>실패하면 순위 화면에서 전부 다시 하거나, 난이도를 바꾸거나(\"건초염 단계 바꾸기\"), 종목 묶음이나 종목 하나만 다시 할 수 있어요. 나머지 결과는 유지돼요. 올림피아드 도중에 나가면 다음 방문 때 처음부터 다시 해요.</li><li>우승하면 필록센이 <strong>볼론 티쿠의 세 번째 보석</strong>과 <strong>경험치 50,000</strong>을 줘요.</li></ol><aside class=\"note\"><p><strong>주의, 돌아올 수 없는 지점이 가까워요.</strong> 올림피아드에서 우승하면 쪽배가 더 이상 출항하지 않아요(\"이쪽으로 다시 바다에 나가진 않을 거야.\"). 유일한 출구는 이첼의 배이고, 배에 타면 챕터 마무리가 시작돼요. 섬에서 끝내고 싶은 일은 먼저 끝내세요(서브 퀘스트 참고).</p></aside>", "id": "c3-participer-aux-olympiades-et-les-gagner", "texte": "3장 올리브섬 메인 퀘스트 올림피아드에 참가하기 (그리고 우승하기!) 경기장은 섬 맨 북쪽에 있어요. 접수 전에는 입구가 막혀 있어요(\"아직 이곳에 들어갈 수 없습니다.\", 이어서 \"먼저 참가 접수를 하셔야 합니다.\"). 입구에서 \"올림피아드에 참가할까?\"에 응 을 고르세요. \"아직 아니다\"를 고르면 그냥 돌아갈 수 있어요. 아나운서의 개막 연설은 첫 방문 때만 나와요. 그 뒤 11개 종목이 이어져요( 미니게임 > 캐스터네츠 올림피아드 참고). 최종 순위 1위 , 즉 점수가 가장 높아야 해요. 실패하면 순위 화면에서 전부 다시 하거나, 난이도를 바꾸거나(\"건초염 단계 바꾸기\"), 종목 묶음이나 종목 하나만 다시 할 수 있어요. 나머지 결과는 유지돼요. 올림피아드 도중에 나가면 다음 방문 때 처음부터 다시 해요. 우승하면 필록센이 볼론 티쿠의 세 번째 보석 과 경험치 50,000 을 줘요. 주의, 돌아올 수 없는 지점이 가까워요. 올림피아드에서 우승하면 쪽배가 더 이상 출항하지 않아요(\"이쪽으로 다시 바다에 나가진 않을 거야.\"). 유일한 출구는 이첼의 배이고, 배에 타면 챕터 마무리가 시작돼요. 섬에서 끝내고 싶은 일은 먼저 끝내세요(서브 퀘스트 참고).", "sol": 0}, {"titre": "이첼의 배에 합류해 출항하기.", "html": "<ol><li>남쪽 도착 해변으로 돌아가요. 이첼의 배는 쪽배 바로 오른쪽에 있어요. 보석이 없으면 이첼은 떠나지 않아요(\"아직 올림피아드 보석이 없어.\").</li><li>해적 돛이 나타나요. 보석을 노리는 <strong>빨강둘 나다야크</strong>예요.</li><li>그의 배와 <strong>해전</strong>을 벌여요(<strong>미니게임 &gt; 나다야크와의 해전</strong> 참고).</li><li><strong>보스: 빨강둘 나다야크</strong> (승선전). 바르브외, 두 멍청이, 이첼이 함께 싸워요.<ul><li>첫 턴에 파티원 모두에게 한 발씩 쏴요(피해 ×1.5). 그다음 재장전하면서 칼로 공격해요. 4명이 서 있으면 3턴, 3명이면 2턴, 그 외에는 1턴 동안이에요. 모두를 살려 두면 사격 횟수가 줄어요. 일제 사격 전에는 회복하세요.</li><li>HP가 2,250 아래로 떨어지면 지원군 4명을 불러요. 포수 하나, 적당한 크기의 해적 둘, 권총 든 해적 하나로, 모두 강화되어 있어요.</li><li>HP가 1,500 아래로 떨어지면 연막탄을 던지고 파티에 무작위로 6번 공격해요. 그다음 HP를 500 회복하고, 언데드 해적 4명을 일으켜 세우고, 다음 턴을 넘겨요.</li><li><strong>요령:</strong> 나다야크의 HP가 50까지 떨어지면 전투가 바로 끝나요. 지원군을 쓰러뜨릴 필요 없이 나다야크만 집중 공격하세요.</li><li>모험 모드에서는 받는 피해가 20% 줄고 주는 피해가 20% 늘어요. HP 2,250, 1,500, 50 기준점은 바뀌지 않아요.</li><li>패배하면 HP와 에너지가 가득 찬 상태로 전투가 바로 다시 시작돼요. 해전은 다시 하지 않아요.</li></ul></li><li>컷신으로 챕터가 끝나고 \"4장 — 잃어버린 해안\" 타이틀 카드가 나와요. 업적 <strong>\"캐스터네츠!\"</strong>.</li></ol>", "id": "c3-rejoindre-itzel-sur-son-navire-et-prendre-la-mer", "texte": "3장 올리브섬 메인 퀘스트 이첼의 배에 합류해 출항하기. 남쪽 도착 해변으로 돌아가요. 이첼의 배는 쪽배 바로 오른쪽에 있어요. 보석이 없으면 이첼은 떠나지 않아요(\"아직 올림피아드 보석이 없어.\"). 해적 돛이 나타나요. 보석을 노리는 빨강둘 나다야크 예요. 그의 배와 해전 을 벌여요( 미니게임 > 나다야크와의 해전 참고). 보스: 빨강둘 나다야크 (승선전). 바르브외, 두 멍청이, 이첼이 함께 싸워요. 첫 턴에 파티원 모두에게 한 발씩 쏴요(피해 ×1.5). 그다음 재장전하면서 칼로 공격해요. 4명이 서 있으면 3턴, 3명이면 2턴, 그 외에는 1턴 동안이에요. 모두를 살려 두면 사격 횟수가 줄어요. 일제 사격 전에는 회복하세요. HP가 2,250 아래로 떨어지면 지원군 4명을 불러요. 포수 하나, 적당한 크기의 해적 둘, 권총 든 해적 하나로, 모두 강화되어 있어요. HP가 1,500 아래로 떨어지면 연막탄을 던지고 파티에 무작위로 6번 공격해요. 그다음 HP를 500 회복하고, 언데드 해적 4명을 일으켜 세우고, 다음 턴을 넘겨요. 요령: 나다야크의 HP가 50까지 떨어지면 전투가 바로 끝나요. 지원군을 쓰러뜨릴 필요 없이 나다야크만 집중 공격하세요. 모험 모드에서는 받는 피해가 20% 줄고 주는 피해가 20% 늘어요. HP 2,250, 1,500, 50 기준점은 바뀌지 않아요. 패배하면 HP와 에너지가 가득 찬 상태로 전투가 바로 다시 시작돼요. 해전은 다시 하지 않아요. 컷신으로 챕터가 끝나고 \"4장 — 잃어버린 해안\" 타이틀 카드가 나와요. 업적 \"캐스터네츠!\" .", "sol": 0}]}, {"titre": "서브 퀘스트", "intro": "", "entrees": [{"titre": "콩포트 주문 (튀어나온 칼리스텐)", "html": "<p><em>완료 시 제목: \"칼리스텐의 콩포트 주문 찾기.\"</em></p><ol><li><strong>시작:</strong> 올리브섬 마을 석상의 북동쪽 모퉁이에 있는 튀어나온 칼리스텐에게 말을 걸어요. 수락하세요(<strong>응</strong>). 거절해도 다시 제안해요.</li><li><strong>사과섬:</strong> 다시 쪽배를 타고(남쪽 해변, \"승선한다\" 선택) 사과섬으로 가요. 섬 북쪽의 콩포트 가게에서 바르브외가 주문 얘기를 꺼내요. 상선이 모로 블랑코 쪽에서 사라졌대요. 지도에서 모로 블랑코섬이 열려요.</li><li><strong>모로 블랑코:</strong> 선착장(남서쪽)에서 서쪽 해안을 따라 북쪽으로 가요. 우리에 갇힌 상인이 있어요.</li><li>우리 바로 북쪽의 도적 야영지에서 적 5명과 필수 전투가 벌어져요. 포수, 적당한 크기의 해적, 권총 든 해적, 어부, 여자 어부예요. 이기면 <strong>우리 열쇠</strong>를 얻어요.</li><li>열쇠를 들고 우리로 돌아가면 상인이 <strong>콩포트 상자</strong>를 줘요.</li><li><strong>보상 1:</strong> 상자를 올리브섬의 칼리스텐에게 가져다줘요. <strong>경험치 40,000</strong>과 <strong>가문의 허리천</strong>(다리 장비, 두 멍청이 방어 +10)을 받아요.</li><li><strong>보상 2 (놓치기 쉬움):</strong> 그다음 사과섬의 콩포트 가게에 다시 들르세요. 주인이 <strong>콩포트 5개</strong>, <strong>슈퍼 콩포트 1개</strong>(HP 150과 에너지 75% 회복), <strong>경험치 10,000</strong>을 줘요.</li></ol><aside class=\"note\"><p>3장에서는 <strong>올림피아드에서 우승하기 전에</strong> 하세요. 우승한 뒤에는 쪽배로 섬을 떠날 수 없어요. 놓쳤다면 나중에(4장 이후) 올리브섬에 다시 갈 수 있고, 칼리스텐이 기다리고 있어요.</p></aside>", "id": "c3-la-commande-de-compotes-callisthene-le-saillant", "texte": "3장 올리브섬 서브 퀘스트 콩포트 주문 (튀어나온 칼리스텐) 완료 시 제목: \"칼리스텐의 콩포트 주문 찾기.\" 시작: 올리브섬 마을 석상의 북동쪽 모퉁이에 있는 튀어나온 칼리스텐에게 말을 걸어요. 수락하세요( 응 ). 거절해도 다시 제안해요. 사과섬: 다시 쪽배를 타고(남쪽 해변, \"승선한다\" 선택) 사과섬으로 가요. 섬 북쪽의 콩포트 가게에서 바르브외가 주문 얘기를 꺼내요. 상선이 모로 블랑코 쪽에서 사라졌대요. 지도에서 모로 블랑코섬이 열려요. 모로 블랑코: 선착장(남서쪽)에서 서쪽 해안을 따라 북쪽으로 가요. 우리에 갇힌 상인이 있어요. 우리 바로 북쪽의 도적 야영지에서 적 5명과 필수 전투가 벌어져요. 포수, 적당한 크기의 해적, 권총 든 해적, 어부, 여자 어부예요. 이기면 우리 열쇠 를 얻어요. 열쇠를 들고 우리로 돌아가면 상인이 콩포트 상자 를 줘요. 보상 1: 상자를 올리브섬의 칼리스텐에게 가져다줘요. 경험치 40,000 과 가문의 허리천 (다리 장비, 두 멍청이 방어 +10)을 받아요. 보상 2 (놓치기 쉬움): 그다음 사과섬의 콩포트 가게에 다시 들르세요. 주인이 콩포트 5개 , 슈퍼 콩포트 1개 (HP 150과 에너지 75% 회복), 경험치 10,000 을 줘요. 3장에서는 올림피아드에서 우승하기 전에 하세요. 우승한 뒤에는 쪽배로 섬을 떠날 수 없어요. 놓쳤다면 나중에(4장 이후) 올리브섬에 다시 갈 수 있고, 칼리스텐이 기다리고 있어요.", "sol": 0}, {"titre": "레오니다스에게 고등어 가져다주기.", "html": "<p><em>완료 시 제목: \"레오니다스에게 고등어 5마리 가져다주기.\"</em></p><ol><li><strong>시작:</strong> 마을 석상 동쪽, 남쪽 방향에 있는 레오니다스에게 말을 걸어요. 생선을 달라고 하니 수락하세요(<strong>응</strong>). 올림피아드 이후에 시작해도 돼요.</li><li><strong>목표:</strong> <strong>고등어</strong> 5마리. 게섬(해변)과 바람섬에서 낚을 수 있어요. 고등어 조합은 <strong>← ← → →</strong>예요. 게섬에서는 잡을 때마다 약 3분의 1 확률로 고등어가 나와요(바람섬에서는 쿨리루가 자주 물어서 확률이 더 낮아요).</li><li>고등어를 사 주는 게섬과 바람섬의 어부에게 팔지 마세요.</li><li>고등어 5마리를 들고 레오니다스에게 돌아가면 <strong>경험치 30,000</strong>.</li></ol><aside class=\"note\"><p>칼리스텐 퀘스트와 마찬가지로, 3장에서는 올림피아드 우승 후 섬을 떠날 수 없어요. 고등어 5마리를 이미 가지고 있다면 그때 완료할 수 있어요. 아니면 4장 이후 올리브섬에 돌아올 때로 미뤄 두세요.</p></aside>", "id": "c3-rapporter-des-maquereaux-a-leonidas", "texte": "3장 올리브섬 서브 퀘스트 레오니다스에게 고등어 가져다주기. 완료 시 제목: \"레오니다스에게 고등어 5마리 가져다주기.\" 시작: 마을 석상 동쪽, 남쪽 방향에 있는 레오니다스에게 말을 걸어요. 생선을 달라고 하니 수락하세요( 응 ). 올림피아드 이후에 시작해도 돼요. 목표: 고등어 5마리. 게섬(해변)과 바람섬에서 낚을 수 있어요. 고등어 조합은 ← ← → → 예요. 게섬에서는 잡을 때마다 약 3분의 1 확률로 고등어가 나와요(바람섬에서는 쿨리루가 자주 물어서 확률이 더 낮아요). 고등어를 사 주는 게섬과 바람섬의 어부에게 팔지 마세요. 고등어 5마리를 들고 레오니다스에게 돌아가면 경험치 30,000 . 칼리스텐 퀘스트와 마찬가지로, 3장에서는 올림피아드 우승 후 섬을 떠날 수 없어요. 고등어 5마리를 이미 가지고 있다면 그때 완료할 수 있어요. 아니면 4장 이후 올리브섬에 돌아올 때로 미뤄 두세요.", "sol": 0}, {"titre": "필록센의 제안 (5장부터)", "html": "<p>이 퀘스트의 무대는 올리브섬이지만, 4장을 끝낸 뒤에야 열려요. 5장 시기의 퀘스트예요. 올림피아드 경기장에서 진행되니 핵심만 정리할게요.</p><ol><li><strong>시작:</strong> 게섬 선술집에서 주인에게 소식을 물어보세요. 필록센의 제안 얘기를 하니 수락하세요.</li><li>올리브섬의 필
