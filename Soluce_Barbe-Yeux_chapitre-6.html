にそれに続きます。二人はオールで攻撃してきます（オリンピアンは絶対に外さず、イノシシの王は外すことがあります）。勝っても負けても、シーンは同じように続きます。衛兵は逮捕してくれませんが、勝てば大量のEXPがもらえます。目標は変わりません。これは見当違いの手です。 酒場強盗 （任意、1回のみ）：最初に入った酒場（カニ島、サル島、ナッソー、風の島）で、ちょっとした強盗シーンが起きます。誰も衛兵を呼ばず、そのあといつもの酒場のメニューが開きます。 ケルウィンのたいまつ店 （サル島、風の島、ナッソー）：店主に話しかけるとメニューが開きます。 「立ち去る」：その場を去ります。次に訪れたとき、このシーンがまた始まります。 「謝ってたいまつを買う」：いつもの店になります。 「全部燃やす」 ：店が燃え上がります。 解答： ケルウィンの店で 「全部燃やす」 を選びます。 そのあと： 第6章のタイトルカードが表示され、バルブ・ユーは独房で古株の囚人と一緒に目を覚まします。 古株の囚人は、イツェルがクシュタルの出身だと認め、島の場所をあなたの地図に書き込んでくれます。 看守が釈放してくれます。あの店は無認可だったのです。牢獄からそのままワールドマップが開きます。行き先として選べるのはクシュタルだけです。", "sol": 1}, {"titre": "クシュタルへ向かう。", "html": "<ol><li>ワールドマップでクシュタルまで航海します。</li><li>島には音楽がなく、聞こえるのは風と海の音だけです。到着すると、一行が話し合います（自動シーン）。</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "第6章 現行犯 メインクエスト クシュタルへ向かう。 ワールドマップでクシュタルまで航海します。 島には音楽がなく、聞こえるのは風と海の音だけです。到着すると、一行が話し合います（自動シーン）。", "sol": 0}, {"titre": "クシュタルの遺跡を探索する。", "html": "<ol><li>島の中央北寄り（上陸地点の北、中ほど）にある <strong>かまど</strong> へ行き、調べます。</li><li>火は踏み消され、血のついた布が棒に結ばれています。<strong>ボロン・ティクの第2の宝石</strong>（イツェルが身につけていた赤い宝石）が手に入ります。</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "第6章 現行犯 メインクエスト クシュタルの遺跡を探索する。 島の中央北寄り（上陸地点の北、中ほど）にある かまど へ行き、調べます。 火は踏み消され、血のついた布が棒に結ばれています。 ボロン・ティクの第2の宝石 （イツェルが身につけていた赤い宝石）が手に入ります。", "sol": 0}, {"titre": "クシュタルの過去を解き明かす。", "html": "<p>4つの石碑を、好きな順番で読みます（「読む」）。目標の下に「読んだ石碑：x / 4」のカウンターが表示されます。</p><div class=\"tab\"><table><thead><tr><th>石碑</th><th>場所</th></tr></thead><tbody><tr><td>石碑1</td><td>東、大きな聖なる木の近く</td></tr><tr><td>石碑2</td><td>南西、南の海岸の近く</td></tr><tr><td>石碑3</td><td>北西</td></tr><tr><td>石碑4</td><td>北東</td></tr></tbody></table></div><ul><li>最初に読んだ石碑で <strong>日誌 No.5</strong> が手に入ります。その後の石碑を読むたびに記述が追加され、常に物語の順番に並べられます。</li><li>かまどを調べる前に石碑を読んでもかまいません。結論が出るのは、両方を済ませてからです。</li><li>すべて読み終えて日誌を閉じると、バルブ・ユーが結論を出します。ワールドマップに <strong>火山の島</strong> が現れます。</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "第6章 現行犯 メインクエスト クシュタルの過去を解き明かす。 4つの石碑を、好きな順番で読みます（「読む」）。目標の下に「読んだ石碑：x / 4」のカウンターが表示されます。 石碑 場所 石碑1 東、大きな聖なる木の近く 石碑2 南西、南の海岸の近く 石碑3 北西 石碑4 北東 最初に読んだ石碑で 日誌 No.5 が手に入ります。その後の石碑を読むたびに記述が追加され、常に物語の順番に並べられます。 かまどを調べる前に石碑を読んでもかまいません。結論が出るのは、両方を済ませてからです。 すべて読み終えて日誌を閉じると、バルブ・ユーが結論を出します。ワールドマップに 火山の島 が現れます。", "sol": 0}, {"titre": "火山の島へ向かう。", "html": "<ol><li>火山の島まで航海します。上陸するとすぐに自動シーンが始まります。ナダイヤックが一行を呼び止め、バルブ・ユーは神殿へ歩いていき、途中でつまずきます。</li><li>ムービー：ナダイヤックがイツェルに銃を突きつけ、ポンコツの一人を傷つけます。ズニッピーが宝石を持っていると白状し、バルブ・ユーは宝石とイツェルを交換します。<strong>ボロン・ティクの宝石はすべてインベントリからなくなります。</strong> ナダイヤックはすぐに約束を破り、骸骨たちを放ちます。</li><li><strong>ナダイヤックの骸骨との戦闘</strong>（骸骨5体）。パーティー：バルブ・ユー、ポンコツ - イノシシの王、カニの王（究極奥義なし）。負けた場合は、HPとエネルギー満タンですぐに再戦になります。</li><li>メダリオンのムービー（スキップ不可）。神殿が目覚め、ズニッピーがイツェルを解放します。イツェルが仲間に加わり、「別の道」を提案します。</li><li>神殿の海賊のキャンプ（カルデラ）で操作が戻ります。ここからは、ポンコツ二人組、イツェル、ズニッピーの全員がついてきます。</li></ol><p>島を離れるには、島の南の小舟に乗ります（「乗船する」／「とどまる」）。</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "第6章 現行犯 メインクエスト 火山の島へ向かう。 火山の島まで航海します。上陸するとすぐに自動シーンが始まります。ナダイヤックが一行を呼び止め、バルブ・ユーは神殿へ歩いていき、途中でつまずきます。 ムービー：ナダイヤックがイツェルに銃を突きつけ、ポンコツの一人を傷つけます。ズニッピーが宝石を持っていると白状し、バルブ・ユーは宝石とイツェルを交換します。 ボロン・ティクの宝石はすべてインベントリからなくなります。 ナダイヤックはすぐに約束を破り、骸骨たちを放ちます。 ナダイヤックの骸骨との戦闘 （骸骨5体）。パーティー：バルブ・ユー、ポンコツ - イノシシの王、カニの王（究極奥義なし）。負けた場合は、HPとエネルギー満タンですぐに再戦になります。 メダリオンのムービー（スキップ不可）。神殿が目覚め、ズニッピーがイツェルを解放します。イツェルが仲間に加わり、「別の道」を提案します。 神殿の海賊のキャンプ（カルデラ）で操作が戻ります。ここからは、ポンコツ二人組、イツェル、ズニッピーの全員がついてきます。 島を離れるには、島の南の小舟に乗ります（「乗船する」／「とどまる」）。", "sol": 0}, {"titre": "火山の中心へ続く道を見つける。", "html": "<p><strong>1. 海賊のキャンプ（神殿の最初の部屋）</strong></p><ul><li>部屋の下から入ります。先へ進む扉は上の中央にあります。</li><li><strong>東のキャンプ</strong>（中央右、海賊6人）：<strong>必須</strong> です。勝つと <strong>調査日誌</strong> が手に入り、すぐに開きます。さらにビール3と難破者のフリカッセ1。</li><li><strong>西のキャンプ</strong>（左、海賊4人）：任意です。ビール2と絶品の魚の切り身1が手に入ります。</li><li>調査日誌を手に入れるまでは、上の扉は閉まったままです。そのときバルブ・ユーは「こいつら海賊は何か隠してる。先に進む前に野営地を調べよう。」と言います。</li><li>上の扉を通るとき、確認を求められます（「最終フェーズに入ります。……」）。<strong>ここが引き返せないポイントです</strong>。承諾すると、石板の部屋の下の扉からキャンプには戻れなくなり、島の神殿の扉も開かなくなります。準備（西のキャンプ、買い物、回復）は先に済ませておきましょう。</li><li>引き返せないポイントを越えたあとも、宝物の部屋から石板の部屋へは戻れますが、迷宮から宝物の部屋へは戻れません。</li><li><strong>神殿での敗北</strong>（キャンプ、守護者、ミミック、霊）：カニ島の酒場でHPとエネルギー満タンの状態で目を覚まします。引き返せないポイントを越えたあとは、<strong>戦闘の前に毎回セーブし</strong>、負けたらロードしましょう。島からの神殿の扉は閉じたままです。</li></ul><p><strong>2. 石板の部屋（2つ目の部屋、暗闇の中）</strong> 全員がたいまつに火を灯します。部屋の床には <strong>石板が4枚</strong> あり、中央に泉があります。</p><div class=\"tab\"><table><thead><tr><th>石板</th><th>見た目</th><th>場所</th></tr></thead><tbody><tr><td>1</td><td>小さな灰色の石板</td><td>北東</td></tr><tr><td>2</td><td>中くらいの <strong>緑</strong> の石板</td><td>西、下半分</td></tr><tr><td>3</td><td>中くらいの <strong>ピンク</strong> の石板</td><td>東、下半分</td></tr><tr><td>4</td><td>大きな灰色の石板</td><td>北西</td></tr></tbody></table></div><p><em>a) 守護者の部屋。</em> 直前とは違う石板を踏むたびに、上にある4つの部屋のひとつが開き、<strong>守護者が2体</strong> 襲ってきます。つまり戦闘は全部で4回です。</p><ul><li>1体目の守護者は標的の目の前にテレポートし、1回攻撃します。</li><li>2体目はランダムな標的に3回連続で攻撃します。</li></ul><p>負けた場合、その部屋はカウントされず、あとでまた開きます。守護者は、この先のミミックや霊と同じく、挑発している（前転した）ポンコツを優先して攻撃します。4回目の戦闘のあと、中央の泉が満たされます。「再生」でHPとエネルギーが最大まで回復します。回数制限はありません。</p><p><em>b) 扉。</em> 調査日誌には、6つの仮面が並んでいます。それぞれにマヤ数字（1〜6の点と棒）が添えられていて、順番を示しています。仮面の色と大きさが石板を表しています。大きな灰色 ＝ 石板4、緑 ＝ 石板2、ピンク ＝ 石板3、小さな灰色 ＝ 石板1。</p><p><strong>解答：</strong> 石板を <strong>4 – 2 – 3 – 4 – 3 – 1</strong> の順に踏みます。つまり、大きな灰色、緑、ピンク、大きな灰色、ピンク、小さな灰色です。</p><ul><li>カウントされるのは新たに踏んだときだけです。誰かが乗っているあいだ、石板は沈んだままです。ついてくる仲間が乗っている場合も同じです。</li><li>記録されるのは <strong>直近の6回</strong> だけです。間違えたら、最初から踏み直せばOKです。</li><li>コツ：右下の砂時計ボタンで <strong>協力モード</strong> に切り替わります。バルブ・ユー、ポンコツ二人組、イツェルはその場にとどまり、1人ずつ動かせるようになります。ズニッピーは操作できません。いつもバルブ・ユーについていき、後ろで石板を踏んでしまうことがあります。いちばん確実なのは、バルブ・ユー（つまりズニッピーも）を石板から遠ざけておき、ポンコツかイツェルで順番どおりに踏むことです。</li><li>正しい順番で踏むと上の扉が開き、パーティーが集合します。</li></ul><p><strong>3. 宝物の部屋（3つ目の部屋）</strong></p><ul><li>上の大部屋に、宝箱が <strong>10個ずつ3列</strong>、合計30個並んでいます。宝箱に近づき「開く」を選びます。</li><li>1つを除いてすべて <strong>ミミック</strong> です（戦闘では「罠つきの宝箱」と表示されます）。とても打たれ強い単体の敵で、1ターンに3人に噛みついてきます。逃げられません。倒すたびに消耗品が1〜3個と大量のEXPが手に入ります。開けた宝箱は開いたままです。負けたミミックは戻ってこず、その戦利品も失われます。</li><li>ヒント：上の壁沿いを歩くと、光がゆっくりと部屋を照らしていきます。光は、緑のマヤ数字が添えられた2人の人物の彫刻を浮かび上がらせます。左が <strong>点2つ</strong>（＝ 2）、右が <strong>棒1本と点4つ</strong>（＝ 9）です。</li></ul><p><strong>解答：</strong> <strong>2列目</strong>（真ん中の列）の、<strong>左から9番目</strong>（右から2番目）の宝箱を開けます。奥の、上の中央にある扉が開きます。</p><p><strong>4. 霊の迷宮（4つ目の部屋）</strong></p><ul><li>入ると、すべてが真っ暗になります。笑い声が響き、暗闇の中で目が光ります（ムービー）。</li><li>イツェルが仮面をつけ、<strong>先頭に立ちます</strong>。光る道は、心臓の鼓動のリズムで、彼女のまわりにだけ見えます。通路には亡霊がさまよっていますが、害はありません。</li><li>部屋の中央、道の途中に <strong>必須</strong> の霊のグループがいます：プーム、ホオチェ、ニクテ。<ul><li>プームはパーティー全員を毒にします。</li><li>ホオチェは毎ターン1人を呪います。ホオチェが3回行動すると標的は死にます。その前にホオチェが倒れれば助かります。<strong>ホオチェを最初に倒しましょう。</strong></li><li>ニクテは叫び声でパーティー全員にダメージを与えます。攻撃は強いですが、HPは少なめです。</li></ul></li><li>ほかに、任意の霊のグループが4つ、隅で待ち構えています。北西、西、東、北東です。霊を倒すたびに、ランダムな消耗品が1つ手に入ります。</li><li><strong>ルート</strong>：入り口（下の中央）から中央まで上ります（戦闘）。次に西へ向かい、北西の通路までくねくねと北へ進んでから、東へ戻ります。少し下り、中ほどの高さの長い通路を東へ横切ります。東側を下り、東の端に沿っていちばん上まで上ります。最後に西へ戻り、上の中央の扉まで行きます。</li><li>上の中央の扉は、前に着くと勝手に開きます。</li></ul><p><strong>5. 橋（5つ目の部屋）</strong></p><ul><li>暗闇は終わりです。全員がまたバルブ・ユーについてきます。長い橋を北へ上ります。</li><li><strong>じいさん</strong>（サル島のあのじいさん）が行く手をふさぎます（「……通さぬ……」）。近づくと回想シーンが流れ、通してくれます。右側から回り込みましょう。</li><li>さらに上では、モロ・ブランコの <strong>説教師</strong> が同じように立ちはだかります。シーン、回想、通過です。</li><li>いちばん上、出口の右に <strong>泉</strong> があり、「再生」が使えます（HPとエネルギーが最大まで回復）。</li><li><strong>ここで回復と準備を済ませましょう</strong>：次の部屋に入ると、そのままラスボス戦に突入します。</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "第6章 現行犯 メインクエスト 火山の中心へ続く道を見つける。 1. 海賊のキャンプ（神殿の最初の部屋） 部屋の下から入ります。先へ進む扉は上の中央にあります。 東のキャンプ （中央右、海賊6人）： 必須 です。勝つと 調査日誌 が手に入り、すぐに開きます。さらにビール3と難破者のフリカッセ1。 西のキャンプ （左、海賊4人）：任意です。ビール2と絶品の魚の切り身1が手に入ります。 調査日誌を手に入れるまでは、上の扉は閉まったままです。そのときバルブ・ユーは「こいつら海賊は何か隠してる。先に進む前に野営地を調べよう。」と言います。 上の扉を通るとき、確認を求められます（「最終フェーズに入ります。……」）。 ここが引き返せないポイントです 。承諾すると、石板の部屋の下の扉からキャンプには戻れなくなり、島の神殿の扉も開かなくなります。準備（西のキャンプ、買い物、回復）は先に済ませておきましょう。 引き返せないポイントを越えたあとも、宝物の部屋から石板の部屋へは戻れますが、迷宮から宝物の部屋へは戻れません。 神殿での敗北 （キャンプ、守護者、ミミック、霊）：カニ島の酒場でHPとエネルギー満タンの状態で目を覚まします。引き返せないポイントを越えたあとは、 戦闘の前に毎回セーブし 、負けたらロードしましょう。島からの神殿の扉は閉じたままです。 2. 石板の部屋（2つ目の部屋、暗闇の中） 全員がたいまつに火を灯します。部屋の床には 石板が4枚 あり、中央に泉があります。 石板 見た目 場所 1 小さな灰色の石板 北東 2 中くらいの 緑 の石板 西、下半分 3 中くらいの ピンク の石板 東、下半分 4 大きな灰色の石板 北西 a) 守護者の部屋。 直前とは違う石板を踏むたびに、上にある4つの部屋のひとつが開き、 守護者が2体 襲ってきます。つまり戦闘は全部で4回です。 1体目の守護者は標的の目の前にテレポートし、1回攻撃します。 2体目はランダムな標的に3回連続で攻撃します。 負けた場合、その部屋はカウントされず、あとでまた開きます。守護者は、この先のミミックや霊と同じく、挑発している（前転した）ポンコツを優先して攻撃します。4回目の戦闘のあと、中央の泉が満たされます。「再生」でHPとエネルギーが最大まで回復します。回数制限はありません。 b) 扉。 調査日誌には、6つの仮面が並んでいます。それぞれにマヤ数字（1〜6の点と棒）が添えられていて、順番を示しています。仮面の色と大きさが石板を表しています。大きな灰色 ＝ 石板4、緑 ＝ 石板2、ピンク ＝ 石板3、小さな灰色 ＝ 石板1。 解答： 石板を 4 – 2 – 3 – 4 – 3 – 1 の順に踏みます。つまり、大きな灰色、緑、ピンク、大きな灰色、ピンク、小さな灰色です。 カウントされるのは新たに踏んだときだけです。誰かが乗っているあいだ、石板は沈んだままです。ついてくる仲間が乗っている場合も同じです。 記録されるのは 直近の6回 だけです。間違えたら、最初から踏み直せばOKです。 コツ：右下の砂時計ボタンで 協力モード に切り替わります。バルブ・ユー、ポンコツ二人組、イツェルはその場にとどまり、1人ずつ動かせるようになります。ズニッピーは操作できません。いつもバルブ・ユーについていき、後ろで石板を踏んでしまうことがあります。いちばん確実なのは、バルブ・ユー（つまりズニッピーも）を石板から遠ざけておき、ポンコツかイツェルで順番どおりに踏むことです。 正しい順番で踏むと上の扉が開き、パーティーが集合します。 3. 宝物の部屋（3つ目の部屋） 上の大部屋に、宝箱が 10個ずつ3列 、合計30個並んでいます。宝箱に近づき「開く」を選びます。 1つを除いてすべて ミミック です（戦闘では「罠つきの宝箱」と表示されます）。とても打たれ強い単体の敵で、1ターンに3人に噛みついてきます。逃げられません。倒すたびに消耗品が1〜3個と大量のEXPが手に入ります。開けた宝箱は開いたままです。負けたミミックは戻ってこず、その戦利品も失われます。 ヒント：上の壁沿いを歩くと、光がゆっくりと部屋を照らしていきます。光は、緑のマヤ数字が添えられた2人の人物の彫刻を浮かび上がらせます。左が 点2つ （＝ 2）、右が 棒1本と点4つ （＝ 9）です。 解答： 2列目 （真ん中の列）の、 左から9番目 （右から2番目）の宝箱を開けます。奥の、上の中央にある扉が開きます。 4. 霊の迷宮（4つ目の部屋） 入ると、すべてが真っ暗になります。笑い声が響き、暗闇の中で目が光ります（ムービー）。 イツェルが仮面をつけ、 先頭に立ちます 。光る道は、心臓の鼓動のリズムで、彼女のまわりにだけ見えます。通路には亡霊がさまよっていますが、害はありません。 部屋の中央、道の途中に 必須 の霊のグループがいます：プーム、ホオチェ、ニクテ。 プームはパーティー全員を毒にします。 ホオチェは毎ターン1人を呪います。ホオチェが3回行動すると標的は死にます。その前にホオチェが倒れれば助かります。 ホオチェを最初に倒しましょう。 ニクテは叫び声でパーティー全員にダメージを与えます。攻撃は強いですが、HPは少なめです。 ほかに、任意の霊のグループが4つ、隅で待ち構えています。北西、西、東、北東です。霊を倒すたびに、ランダムな消耗品が1つ手に入ります。 ルート ：入り口（下の中央）から中央まで上ります（戦闘）。次に西へ向かい、北西の通路までくねくねと北へ進んでから、東へ戻ります。少し下り、中ほどの高さの長い通路を東へ横切ります。東側を下り、東の端に沿っていちばん上まで上ります。最後に西へ戻り、上の中央の扉まで行きます。 上の中央の扉は、前に着くと勝手に開きます。 5. 橋（5つ目の部屋） 暗闇は終わりです。全員がまたバルブ・ユーについてきます。長い橋を北へ上ります。 じいさん （サル島のあのじいさん）が行く手をふさぎます（「……通さぬ……」）。近づくと回想シーンが流れ、通してくれます。右側から回り込みましょう。 さらに上では、モロ・ブランコの 説教師 が同じように立ちはだかります。シーン、回想、通過です。 いちばん上、出口の右に 泉 があり、「再生」が使えます（HPとエネルギーが最大まで回復）。 ここで回復と準備を済ませましょう ：次の部屋に入ると、そのままラスボス戦に突入します。", "sol": 2}, {"titre": "シバルバーの奥へ進む。", "html": "<ol><li><strong>メダリオンの扉</strong> のムービー：ナダイヤックが扉の前にいます。イツェルが「止まれ！」と叫びます。ナダイヤックはメダリオンで扉を開けます。あなたの操作は不要です。</li><li>「追うぞ。」：一行は自動で進み、巣窟に入ります。</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "第6章 現行犯 メインクエスト シバルバーの奥へ進む。 メダリオンの扉 のムービー：ナダイヤックが扉の前にいます。イツェルが「止まれ！」と叫びます。ナダイヤックはメダリオンで扉を開けます。あなたの操作は不要です。 「追うぞ。」：一行は自動で進み、巣窟に入ります。", "sol": 0}, {"titre": "カマソッツと対決する。", "html": "<p>最終戦は3つのフェーズが続きます。</p><p><strong>フェーズ1か2で負けた場合：</strong></p><ul><li>橋の終わり、泉の前で、HPとエネルギー満タンの状態で目を覚まします（「カマソッツはまだお前たちを逃がしはしない！」）。</li><li>上の出口をもう一度通ると、扉のシーンなしで、負けたフェーズから直接戦闘が再開します。</li><li>一度負けると、<strong>青い光</strong> が2つ現れます。橋の終わり、出口の左、泉の向かいにある光では「ボートへ戻る」が選べます。火山の島の浜辺、小舟の右に移動します。そこにあるもうひとつの光で「橋の先へ行く」が選べます。つまり、ほかの場所でレベル上げや買い物をしてから戻ってこられます。光はカマソッツを倒すと消えます。</li><li>ノーマル難易度では、2回目の敗北で（以後2回負けるごとに）、<strong>アドベンチャー難易度</strong> への変更を提案されます。受けるダメージ-20 %、与えるダメージ+20 %、回復量+30 %です。「はい」と答えればすぐに切り替わります。難易度は「設定 &gt; 難易度」からいつでも変更できます。</li></ul><p><strong>フェーズ1 — シバルバーの使者とカブラカン</strong></p><ul><li>パーティー：バルブ・ユー、ポンコツ二人組、イツェル、<strong>ナダイヤック（操作可能な味方）</strong>、ズニッピー（究極奥義なし）。</li><li>ナダイヤックのスキルは3つです。<ul><li>サーベル：非常に強力。</li><li>手榴弾：敵全体に6回攻撃。4ターンに1回使えます。</li><li>銃撃：2発。それぞれの標的を選べます。リチャージなし。</li></ul></li><li>使者は、ジャングルの神殿のときと同じ攻撃（霊の召喚など）を使います。カブラカンは最初の段階と同じです。飛行、火の玉、炎の円錐、そしてHPが半分になると着地します。</li></ul><p><strong>フェーズ2 — カマソッツ</strong></p><ul><li>カマソッツは召喚体3体を連れて現れます。4つの攻撃を決まった順にくり返します。<ol><li>三連ファイアボール。</li><li>コウモリの大群：ランダムな攻撃に加え、霊を1体召喚します（ホオチェ、プーム、ニクテの順）。</li><li><strong>衝撃波</strong>：パーティー全員に40、次は50、その次は120ダメージ（アドベンチャー難易度では20 %減）。</li><li>ひっかき：ランダムな味方2人に大ダメージ。</li></ol></li><li>衝撃波（サイクルの3番目の攻撃）の直前にパーティーを回復しましょう。ホオチェは現れたらすぐに倒しましょう。</li><li>カマソッツのHPが <strong>16 000</strong> を切ると：<ul><li>手下をさらに3体召喚します。</li><li>ズニッピーが究極奥義を放って逃げ出します。</li><li><strong>イツェルが仮面をつけます</strong>（戦闘終了まで）。攻撃が強化され、壊滅の一撃の弾の配分を自分で決められるようになります。このとき彼女の煙幕弾は、煙に包まれた敵の攻撃を <strong>75 %</strong> 外させます（仮面なしでは50 %）。</li></ul></li><li><strong>HP 11 000</strong> で戦闘が止まります。ナダイヤックが扉をよこせと迫り、カマソッツが彼を殺して再び立ち上がります。</li></ul><p><strong>フェーズ3 — リズムバトル</strong>（ミニゲームを参照）。 曲が終わるまでに、残りのHP 踏みとどまります。音楽は続きますが、もう攻撃も召喚もせず、かかっているやけど、毒、呪いは消えます。最後の音で、コウモリの大群の中で息絶えます。それでも最後までプレイしましょう。最終的な集計（パーフェクト、グッド、まあまあ、ミス）が、そのあとエンドクレジットに表示されます。 ポーズ ：Esc か P（キーは画面左上に表示されています）。 敗北 ：パーティー全員が倒れるか（「一味が崩れ落ちた……」）、カマソッツが立ったまま曲が終わると（「演奏終了！」）、結果画面に「リトライ」と、より易しいモードが表示されます。選んだモードはセーブデータに保存されます。 ノーマル：そのままの戦闘。 やさしい：タイミングの判定がゆるくなり、長押しノーツと連打ノーツも易しくなります。 かんたん：「やさしい」と同じですが、どの矢印でもすべてのノーツに対応します。それでも負けることはあります。 ストーリー：すべてのシーケンスに成功した扱いになります。パーティーは倒れず、曲の終わりにカマソッツが倒れます。 報酬 ：勝利するとシバルバーからの脱出が始まります。", "sol": 0}, {"titre": "時間制限つきの脱出", "html": "<p>目標「すべてが崩れ落ちる前にシバルバーから脱出する。」を参照。道のり全体で50秒、再挑戦は無制限です。</p>", "id": "c6-fuite-chronometree", "texte": "第6章 現行犯 ミニゲーム 時間制限つきの脱出 目標「すべてが崩れ落ちる前にシバルバーから脱出する。」を参照。道のり全体で50秒、再挑戦は無制限です。", "sol": 0}]}, {"titre": "見逃し厳禁", "intro": "", "entrees": [{"titre": "見逃し厳禁", "html": "<ul><li><strong>赤い宝石（ボロン・ティクの第2の宝石）</strong>：クシュタルのかまど。これがないと物語が先に進みません。</li><li><strong>日誌 No.5</strong>（クシュタルの石碑）と <strong>調査日誌</strong>（神殿の東のキャンプ）。どちらも実績「どうせ字なんか読めねえし」の7冊に含まれます。</li><li><strong>クシュタルの聖なる翡翠</strong>（隠し）：石板の部屋で <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong> と踏みます。石板4を続けて踏むには、いったん降りてからもう一度乗ります。扉が開いていても開いていなくても有効です。<ul><li>部屋の西、大きな灰色の石板と緑の石板のあいだにある蛇の頭の目に、光が現れます。その上を歩いて翡翠を拾います。</li><li>効果：翡翠はインベントリには入らず、スキルが正式に解放されます（「スキル解放：スペシャル小石投げ」）。ポンコツたちの小石投げが、8ダメージ＋ATKの半分－標的のDEFになり、2回に1回、別の敵に跳ね返ります。</li><li>持っていないと、橋の説教師に責められます。</li><li>取り逃した場合：章の終わりに神殿は崩れますが、そのあとクシュタルの闘技場のショップで翡翠を買えます（1000メダル）。</li></ul></li><li><strong>西のキャンプ</strong> と <strong>ミミック</strong>：消耗品とEXPが手に入るのは、この章のあいだだけです。脱出後、神殿は閉ざされます（「すべて崩れ落ちた。もう戻れない。」）。</li><li><strong>引き返せないポイント</strong>：海賊のキャンプの上の扉。その先は、カマソッツに負けたあとの橋の終わりの青い光を除いて、火山から出られません。</li><li><strong>木彫りのキツネ</strong>（任意）：クシュタルの西で、バルブ・ユーが石の下敷きになった小さな像を起こします。すぐにもらえる報酬はありません（小像はクリア後に手に入ります）。</li><li><strong>実績</strong>：<ul><li>「酒場か？」は、第1〜5章のクリア実績を5つすべて持っていれば、エンドクレジットの開始時に解除されます。第6章には専用の実績はありません。</li><li>「光を極めし男」：たいまつをすべて買うと解除され、ケルウィンとの戦闘も解禁されます。</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "第6章 現行犯 見逃し厳禁 見逃し厳禁 赤い宝石（ボロン・ティクの第2の宝石） ：クシュタルのかまど。これがないと物語が先に進みません。 日誌 No.5 （クシュタルの石碑）と 調査日誌 （神殿の東のキャンプ）。どちらも実績「どうせ字なんか読めねえし」の7冊に含まれます。 クシュタルの聖なる翡翠 （隠し）：石板の部屋で 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 と踏みます。石板4を続けて踏むには、いったん降りてからもう一度乗ります。扉が開いていても開いていなくても有効です。 部屋の西、大きな灰色の石板と緑の石板のあいだにある蛇の頭の目に、光が現れます。その上を歩いて翡翠を拾います。 効果：翡翠はインベントリには入らず、スキルが正式に解放されます（「スキル解放：スペシャル小石投げ」）。ポンコツたちの小石投げが、8ダメージ＋ATKの半分－標的のDEFになり、2回に1回、別の敵に跳ね返ります。 持っていないと、橋の説教師に責められます。 取り逃した場合：章の終わりに神殿は崩れますが、そのあとクシュタルの闘技場のショップで翡翠を買えます（1000メダル）。 西のキャンプ と ミミック ：消耗品とEXPが手に入るのは、この章のあいだだけです。脱出後、神殿は閉ざされます（「すべて崩れ落ちた。もう戻れない。」）。 引き返せないポイント ：海賊のキャンプの上の扉。その先は、カマソッツに負けたあとの橋の終わりの青い光を除いて、火山から出られません。 木彫りのキツネ （任意）：クシュタルの西で、バルブ・ユーが石の下敷きになった小さな像を起こします。すぐにもらえる報酬はありません（小像はクリア後に手に入ります）。 実績 ： 「酒場か？」は、第1〜5章のクリア実績を5つすべて持っていれば、エンドクレジットの開始時に解除されます。第6章には専用の実績はありません。 「光を極めし男」：たいまつをすべて買うと解除され、ケルウィンとの戦闘も解禁されます。", "sol": 0}]}]}], "zh": [{"id": "c6", "num": "第6章", "titre": "人赃并获", "intro": "<p>螃蟹王改名为兹尼皮，加入了船员队伍。你得找到伊策尔，并阻止纳达亚克打开博隆·蒂库之门。这一路要经过一间牢房、失落的库什塔尔岛，最后是埋在火山岛地下的神殿。</p><aside class=\"note\"><p>注意：标题卡“第6章 — 人赃并获”要到被捕时才会出现。下面的前两个目标都在它之前进行。</p></aside>", "sections": [{"titre": "主线任务", "intro": "", "entrees": [{"titre": "制定计划（在螃蟹岛的酒馆）。", "html": "<ol><li>招募螃蟹王之后，走进螃蟹岛的酒馆。</li><li>自动剧情：巴布约、两个蠢蛋和兹尼皮商量对策。巴布约意识到，拿骚的那个老囚犯（“闻着有尿味”的那个）来自库什塔尔。</li><li>他的 HP 和能量恢复到最大。新目标：想办法被抓进去，好跟老囚犯说话。</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "第6章 人赃并获 主线任务 制定计划（在螃蟹岛的酒馆）。 招募螃蟹王之后，走进螃蟹岛的酒馆。 自动剧情：巴布约、两个蠢蛋和兹尼皮商量对策。巴布约意识到，拿骚的那个老囚犯（“闻着有尿味”的那个）来自库什塔尔。 他的 HP 和能量恢复到最大。新目标：想办法被抓进去，好跟老囚犯说话。", "sol": 0}, {"titre": "想办法让自己被捕。", "html": "<p>有三条路可以试。<strong>只有一条行得通：烧掉克尔温的店。</strong></p><ol><li><strong>拿骚博物馆的守卫</strong>（可选，仅一次）：在博物馆前接近马塞尔和普利沙尔，白天晚上都行。巴布约挑衅他们，战斗开始。特别之处：蠢蛋 - 野猪王在第一回合就会倒戈到敌方，蠢蛋 - 奥林匹亚健将在第二回合跟着倒戈。他们用船桨攻击（奥林匹亚健将从不落空，野猪王可能落空）。不管赢还是输，剧情都会照常继续。守卫们拒绝逮捕你，但打赢能拿到大量 XP。目标不会改变：这是一条假线索。</li><li><strong>抢劫酒馆</strong>（可选，仅一次）：你走进的第一家酒馆（螃蟹岛、猴岛、拿骚或迎风岛）会出现一小段抢劫剧情。没有人叫卫兵，然后酒馆的普通菜单会打开。</li><li><strong>克尔温的火把店</strong>（猴岛、迎风岛或拿骚）：和店主说话。会打开一个菜单：<ul><li>“离开”：你走掉，下次来时这段剧情还会出现。</li><li>“道歉，再买支火把”：普通商店。</li><li><strong>“全部烧光”</strong>：店铺着火了。</li></ul></li></ol><p><strong>解答：</strong> 在克尔温那里选择 <strong>“全部烧光”</strong>。</p><p>之后：</p><ul><li>出现第6章的标题卡，然后巴布约在牢房里和老囚犯一起醒来。</li><li>老头证实伊策尔来自库什塔尔，并把这座岛的位置标在了你的地图上。</li><li>一名卫兵放了你：那家店根本没有执照。世界地图会直接从监狱打开。唯一可选的目的地是库什塔尔。</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "第6章 人赃并获 主线任务 想办法让自己被捕。 有三条路可以试。 只有一条行得通：烧掉克尔温的店。 拿骚博物馆的守卫 （可选，仅一次）：在博物馆前接近马塞尔和普利沙尔，白天晚上都行。巴布约挑衅他们，战斗开始。特别之处：蠢蛋 - 野猪王在第一回合就会倒戈到敌方，蠢蛋 - 奥林匹亚健将在第二回合跟着倒戈。他们用船桨攻击（奥林匹亚健将从不落空，野猪王可能落空）。不管赢还是输，剧情都会照常继续。守卫们拒绝逮捕你，但打赢能拿到大量 XP。目标不会改变：这是一条假线索。 抢劫酒馆 （可选，仅一次）：你走进的第一家酒馆（螃蟹岛、猴岛、拿骚或迎风岛）会出现一小段抢劫剧情。没有人叫卫兵，然后酒馆的普通菜单会打开。 克尔温的火把店 （猴岛、迎风岛或拿骚）：和店主说话。会打开一个菜单： “离开”：你走掉，下次来时这段剧情还会出现。 “道歉，再买支火把”：普通商店。 “全部烧光” ：店铺着火了。 解答： 在克尔温那里选择 “全部烧光” 。 之后： 出现第6章的标题卡，然后巴布约在牢房里和老囚犯一起醒来。 老头证实伊策尔来自库什塔尔，并把这座岛的位置标在了你的地图上。 一名卫兵放了你：那家店根本没有执照。世界地图会直接从监狱打开。唯一可选的目的地是库什塔尔。", "sol": 1}, {"titre": "前往库什塔尔。", "html": "<ol><li>在世界地图上航行到库什塔尔。</li><li>岛上没有音乐，只有风声和海浪声。到达时，队伍会讨论一番（自动剧情）。</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "第6章 人赃并获 主线任务 前往库什塔尔。 在世界地图上航行到库什塔尔。 岛上没有音乐，只有风声和海浪声。到达时，队伍会讨论一番（自动剧情）。", "sol": 0}, {"titre": "探索库什塔尔遗迹。", "html": "<ol><li>去岛中北部的 <strong>火塘</strong>（登陆点北边，大约在中间）。与它互动。</li><li>一堆火被闷灭了，一块沾血的布条绑在一根木棍上。你获得 <strong>博隆·蒂库第2颗宝石</strong>（伊策尔随身带着的那颗红宝石）。</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "第6章 人赃并获 主线任务 探索库什塔尔遗迹。 去岛中北部的 火塘 （登陆点北边，大约在中间）。与它互动。 一堆火被闷灭了，一块沾血的布条绑在一根木棍上。你获得 博隆·蒂库第2颗宝石 （伊策尔随身带着的那颗红宝石）。", "sol": 0}, {"titre": "揭开库什塔尔的过去。", "html": "<p>阅读四块石碑（“阅读”），顺序不限。目标下方会显示计数“已读石碑：x / 4”。</p><div class=\"tab\"><table><thead><tr><th>石碑</th><th>位置</th></tr></thead><tbody><tr><td>石碑 1</td><td>东边，靠近那棵巨大的神树</td></tr><tr><td>石碑 2</td><td>西南，靠近南海岸</td></tr><tr><td>石碑 3</td><td>西北</td></tr><tr><td>石碑 4</td><td>东北</td></tr></tbody></table></div><ul><li>读第一块石碑时会获得 <strong>第5号日志</strong>。之后每读一块，都会往日志里加一条记录，并始终按故事的顺序排列。</li><li>你可以在去火塘之前就读石碑。两件事都做完之后，才会得出结论。</li><li>全部读完并合上日志后，巴布约会得出结论。<strong>火山岛</strong> 会出现在世界地图上。</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "第6章 人赃并获 主线任务 揭开库什塔尔的过去。 阅读四块石碑（“阅读”），顺序不限。目标下方会显示计数“已读石碑：x / 4”。 石碑 位置 石碑 1 东边，靠近那棵巨大的神树 石碑 2 西南，靠近南海岸 石碑 3 西北 石碑 4 东北 读第一块石碑时会获得 第5号日志 。之后每读一块，都会往日志里加一条记录，并始终按故事的顺序排列。 你可以在去火塘之前就读石碑。两件事都做完之后，才会得出结论。 全部读完并合上日志后，巴布约会得出结论。 火山岛 会出现在世界地图上。", "sol": 0}, {"titre": "前往火山岛。", "html": "<ol><li>航行到火山岛。一上岸就会自动触发剧情：纳达亚克叫住队伍，巴布约朝神殿走去，半路上绊了一跤。</li><li>过场动画：纳达亚克用枪指着伊策尔，还打伤了一个蠢蛋。兹尼皮承认宝石在你们手上，巴布约用宝石换回了伊策尔。<strong>所有博隆·蒂库宝石都会从你的物品栏中移除。</strong> 纳达亚克立刻食言，放出了他的骷髅。</li><li><strong>与纳达亚克的骷髅战斗</strong>（5 具骷髅）。你的队伍：巴布约、蠢蛋 - 野猪王和螃蟹王，不能用终极技。如果输了，战斗会立刻重新开始，HP 和能量全满。</li><li>徽章的过场动画（无法跳过）。神殿苏醒，兹尼皮救出了伊策尔。伊策尔加入队伍，并提出要走“另一条路”。</li><li>你在神殿的海盗营地（火山口）重新获得控制权。从这里开始，全队都会跟着你：两个蠢蛋、伊策尔和兹尼皮。</li></ol><p>想离开这座岛，就去岛南边坐小船（“登船”/“留下”）。</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "第6章 人赃并获 主线任务 前往火山岛。 航行到火山岛。一上岸就会自动触发剧情：纳达亚克叫住队伍，巴布约朝神殿走去，半路上绊了一跤。 过场动画：纳达亚克用枪指着伊策尔，还打伤了一个蠢蛋。兹尼皮承认宝石在你们手上，巴布约用宝石换回了伊策尔。 所有博隆·蒂库宝石都会从你的物品栏中移除。 纳达亚克立刻食言，放出了他的骷髅。 与纳达亚克的骷髅战斗 （5 具骷髅）。你的队伍：巴布约、蠢蛋 - 野猪王和螃蟹王，不能用终极技。如果输了，战斗会立刻重新开始，HP 和能量全满。 徽章的过场动画（无法跳过）。神殿苏醒，兹尼皮救出了伊策尔。伊策尔加入队伍，并提出要走“另一条路”。 你在神殿的海盗营地（火山口）重新获得控制权。从这里开始，全队都会跟着你：两个蠢蛋、伊策尔和兹尼皮。 想离开这座岛，就去岛南边坐小船（“登船”/“留下”）。", "sol": 0}, {"titre": "找到通往火山中心的路。", "html": "<p><strong>1. 海盗营地（神殿的第一个房间）</strong></p><ul><li>你从房间下方进入。通往深处的门在上方中央。</li><li><strong>东营地</strong>（中间偏右，6 名海盗）：<strong>必打</strong>。获胜后获得 <strong>研究日志</strong>，它会立刻打开，另外还有 3 啤酒和一份落难者炖肉。</li><li><strong>西营地</strong>（左边，4 名海盗）：可选。给 2 啤酒和一份美味鱼排。</li><li>在拿到研究日志之前，上方的门一直关着。这时巴布约会说：“这些海盗藏着什么。”</li><li>穿过上方的门时，游戏会要求你确认（“你即将进入最终阶段……”）：<strong>这就是不可回头的节点</strong>。如果你确认，石板厅下方的门就不会再通回营地，岛上神殿的大门也不会再打开。在那之前做好准备（西营地、购物、回血）。</li><li>过了不可回头的节点之后，你仍然可以从宝藏厅回到石板厅，但不能从迷宫回到宝藏厅。</li><li><strong>在神殿里战败</strong>（营地、守护者、宝箱怪、灵）：你会在螃蟹岛的酒馆里醒来，HP 和能量全满。过了不可回头的节点之后，<strong>每场战斗前都要存档</strong>，输了就读档：从岛上进去的话，神殿大门会一直关着。</li></ul><p><strong>2. 石板厅（第二个房间，一片漆黑）</strong> 所有人都点起火把。房间地上有 <strong>四块石板</strong>，中央有一座喷泉。</p><div class=\"tab\"><table><thead><tr><th>石板</th><th>外观</th><th>位置</th></tr></thead><tbody><tr><td>1</td><td>灰色小石板</td><td>东北</td></tr><tr><td>2</td><td><strong>绿色</strong> 中石板</td><td>西边，下半部分</td></tr><tr><td>3</td><td><strong>粉色</strong> 中石板</td><td>东边，下半部分</td></tr><tr><td>4</td><td>灰色大石板</td><td>西北</td></tr></tbody></table></div><p><em>a) 守护者的房间。</em> 每当你踩上一块和上一块不同的石板，上方四个房间中就会有一个打开，<strong>两名守护者</strong> 会攻击你。所以一共有 4 场战斗。</p><ul><li>第一名守护者会瞬移到目标面前打一下。</li><li>第二名守护者会对随机目标连打三下。</li></ul><p>如果你输了，这个房间不算数，之后会再打开。守护者，以及后面的宝箱怪和灵，都会优先攻击正在嘲讽的蠢蛋（翻滚）。第 4 场战斗之后，中央的喷泉会注满水：“再生”可以让 HP 和能量恢复到最大，不限次数。</p><p><em>b) 大门。</em> 研究日志上画着一串六个面具。每个面具旁边都有一个玛雅数字，从 1 到 6 的点和横杠，表示顺序。每个面具的颜色和大小对应一块石板：灰色大 = 石板 4，绿色 = 石板 2，粉色 = 石板 3，灰色小 = 石板 1。</p><p><strong>解答：</strong> 按 <strong>4 – 2 – 3 – 4 – 3 – 1</strong> 的顺序踩石板，也就是：灰色大、绿色、粉色、灰色大、粉色、灰色小。</p><ul><li>只有新的一次踩踏才算数：只要有人站在石板上，它就会一直保持按下状态，包括跟着你的队友。</li><li>游戏只记录 <strong>最后 6 次踩踏</strong>。如果踩错了，从头再踩一遍顺序就行。</li><li>技巧：右下角的沙漏按钮可以切换到 <strong>合作模式</strong>。这时巴布约、两个蠢蛋和伊策尔会留在原地，你一次只操作其中一个。兹尼皮不能操作：他总是跟着巴布约，可能会在他身后踩下一块石板。最稳妥的办法：让巴布约（也就是兹尼皮）远离石板，用一个蠢蛋或伊策尔来踩顺序。</li><li>顺序正确后，上方的门会打开，队伍重新集合。</li></ul><p><strong>3. 宝藏厅（第三个房间）</strong></p><ul><li>上方的大厅里排着 30 个宝箱，<strong>3 排，每排 10 个</strong>。走到宝箱前选择“打开”。</li><li>除了一个之外，所有宝箱都是 <strong>宝箱怪</strong>（游戏中叫“机关宝箱”）：只有一个敌人，非常耐打，每回合咬三个目标。无法逃跑。每打败一只宝箱怪，可得 1 到 3 个消耗品和大量 XP。打开过的宝箱会一直开着：输掉的宝箱怪不会再出现，它的战利品也就没了。</li><li>线索：沿着上方的墙走，会有一道光缓缓扫过房间。它会照出两个刻在墙上的人物，每个都带着一个绿色的玛雅数字：左边是 <strong>2 个点</strong>（= 2），右边是 <strong>一道横杠加 4 个点</strong>（= 9）。</li></ul><p><strong>解答：</strong> 打开 <strong>第 2 排</strong>（中间那排）<strong>从左数第 9 个</strong> 宝箱（右边倒数第二个）。它会打开尽头上方中央的门。</p><p><strong>4. 灵之迷宫（第四个房间）</strong></p><ul><li>一进去，四周就变得漆黑。笑声响起，黑暗中亮起一双双眼睛（过场动画）。</li><li>伊策尔戴上面具，<strong>走在最前面</strong>。发光的路只在她身边可见，随着心跳的节奏闪烁。走廊里游荡着幽灵，但它们没有威胁。</li><li>房间中央、路上有一群 <strong>必打</strong> 的灵：噗姆、霍奥切和尼克特。<ul><li>噗姆会让全队中毒。</li><li>霍奥切每回合诅咒一个角色。当霍奥切再行动 3 次时，目标就会死亡，除非霍奥切先倒下。<strong>先杀霍奥切。</strong></li><li>尼克特会发出一声尖叫，伤害全队。他下手很重，但 HP 很少。</li></ul></li><li>另外四群可选的灵在各个角落等着：西北、西、东和东北。每打败一个灵，会随机掉落一个消耗品。</li><li><strong>路线</strong>：从入口（下方中央）往上走到中央（战斗）。然后往西走，曲折向北走到西北的走廊，再往东走。往下走一点，然后穿过中间高度的一条长走廊往东。从东侧往下走，再沿着整条东边缘一直往上走到顶。最后往西走到上方中央的门。</li><li>上方中央的门在你走到它前面时会自动打开。</li></ul><p><strong>5. 桥（第五个房间）</strong></p><ul><li>不再黑了：所有人又跟着巴布约走。沿着长桥往北走。</li><li><strong>老头</strong>（猴岛的那位）挡住了你的路（“不得通过……”）。走到他身边：一段带闪回的剧情，然后他会让你过去。从他的右边绕过去。</li><li>再往上，莫罗布兰科的 <strong>传教士</strong> 也这样拦你：剧情、闪回、放行。</li><li>在最上面，出口右边有一座 <strong>喷泉</strong>，提供“再生”（HP 和能量恢复到最大）。</li><li><strong>在这里回血并做好准备</strong>：走进下一个房间就会直接进入最终首领战。</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "第6章 人赃并获 主线任务 找到通往火山中心的路。 1. 海盗营地（神殿的第一个房间） 你从房间下方进入。通往深处的门在上方中央。 东营地 （中间偏右，6 名海盗）： 必打 。获胜后获得 研究日志 ，它会立刻打开，另外还有 3 啤酒和一份落难者炖肉。 西营地 （左边，4 名海盗）：可选。给 2 啤酒和一份美味鱼排。 在拿到研究日志之前，上方的门一直关着。这时巴布约会说：“这些海盗藏着什么。” 穿过上方的门时，游戏会要求你确认（“你即将进入最终阶段……”）： 这就是不可回头的节点 。如果你确认，石板厅下方的门就不会再通回营地，岛上神殿的大门也不会再打开。在那之前做好准备（西营地、购物、回血）。 过了不可回头的节点之后，你仍然可以从宝藏厅回到石板厅，但不能从迷宫回到宝藏厅。 在神殿里战败 （营地、守护者、宝箱怪、灵）：你会在螃蟹岛的酒馆里醒来，HP 和能量全满。过了不可回头的节点之后， 每场战斗前都要存档 ，输了就读档：从岛上进去的话，神殿大门会一直关着。 2. 石板厅（第二个房间，一片漆黑） 所有人都点起火把。房间地上有 四块石板 ，中央有一座喷泉。 石板 外观 位置 1 灰色小石板 东北 2 绿色 中石板 西边，下半部分 3 粉色 中石板 东边，下半部分 4 灰色大石板 西北 a) 守护者的房间。 每当你踩上一块和上一块不同的石板，上方四个房间中就会有一个打开， 两名守护者 会攻击你。所以一共有 4 场战斗。 第一名守护者会瞬移到目标面前打一下。 第二名守护者会对随机目标连打三下。 如果你输了，这个房间不算数，之后会再打开。守护者，以及后面的宝箱怪和灵，都会优先攻击正在嘲讽的蠢蛋（翻滚）。第 4 场战斗之后，中央的喷泉会注满水：“再生”可以让 HP 和能量恢复到最大，不限次数。 b) 大门。 研究日志上画着一串六个面具。每个面具旁边都有一个玛雅数字，从 1 到 6 的点和横杠，表示顺序。每个面具的颜色和大小对应一块石板：灰色大 = 石板 4，绿色 = 石板 2，粉色 = 石板 3，灰色小 = 石板 1。 解答： 按 4 – 2 – 3 – 4 – 3 – 1 的顺序踩石板，也就是：灰色大、绿色、粉色、灰色大、粉色、灰色小。 只有新的一次踩踏才算数：只要有人站在石板上，它就会一直保持按下状态，包括跟着你的队友。 游戏只记录 最后 6 次踩踏 。如果踩错了，从头再踩一遍顺序就行。 技巧：右下角的沙漏按钮可以切换到 合作模式 。这时巴布约、两个蠢蛋和伊策尔会留在原地，你一次只操作其中一个。兹尼皮不能操作：他总是跟着巴布约，可能会在他身后踩下一块石板。最稳妥的办法：让巴布约（也就是兹尼皮）远离石板，用一个蠢蛋或伊策尔来踩顺序。 顺序正确后，上方的门会打开，队伍重新集合。 3. 宝藏厅（第三个房间） 上方的大厅里排着 30 个宝箱， 3 排，每排 10 个 。走到宝箱前选择“打开”。 除了一个之外，所有宝箱都是 宝箱怪 （游戏中叫“机关宝箱”）：只有一个敌人，非常耐打，每回合咬三个目标。无法逃跑。每打败一只宝箱怪，可得 1 到 3 个消耗品和大量 XP。打开过的宝箱会一直开着：输掉的宝箱怪不会再出现，它的战利品也就没了。 线索：沿着上方的墙走，会有一道光缓缓扫过房间。它会照出两个刻在墙上的人物，每个都带着一个绿色的玛雅数字：左边是 2 个点 （= 2），右边是 一道横杠加 4 个点 （= 9）。 解答： 打开 第 2 排 （中间那排） 从左数第 9 个 宝箱（右边倒数第二个）。它会打开尽头上方中央的门。 4. 灵之迷宫（第四个房间） 一进去，四周就变得漆黑。笑声响起，黑暗中亮起一双双眼睛（过场动画）。 伊策尔戴上面具， 走在最前面 。发光的路只在她身边可见，随着心跳的节奏闪烁。走廊里游荡着幽灵，但它们没有威胁。 房间中央、路上有一群 必打 的灵：噗姆、霍奥切和尼克特。 噗姆会让全队中毒。 霍奥切每回合诅咒一个角色。当霍奥切再行动 3 次时，目标就会死亡，除非霍奥切先倒下。 先杀霍奥切。 尼克特会发出一声尖叫，伤害全队。他下手很重，但 HP 很少。 另外四群可选的灵在各个角落等着：西北、西、东和东北。每打败一个灵，会随机掉落一个消耗品。 路线 ：从入口（下方中央）往上走到中央（战斗）。然后往西走，曲折向北走到西北的走廊，再往东走。往下走一点，然后穿过中间高度的一条长走廊往东。从东侧往下走，再沿着整条东边缘一直往上走到顶。最后往西走到上方中央的门。 上方中央的门在你走到它前面时会自动打开。 5. 桥（第五个房间） 不再黑了：所有人又跟着巴布约走。沿着长桥往北走。 老头 （猴岛的那位）挡住了你的路（“不得通过……”）。走到他身边：一段带闪回的剧情，然后他会让你过去。从他的右边绕过去。 再往上，莫罗布兰科的 传教士 也这样拦你：剧情、闪回、放行。 在最上面，出口右边有一座 喷泉 ，提供“再生”（HP 和能量恢复到最大）。 在这里回血并做好准备 ：走进下一个房间就会直接进入最终首领战。", "sol": 2}, {"titre": "深入西巴尔巴。", "html": "<ol><li><strong>徽章之门</strong> 的过场动画：纳达亚克站在门前，伊策尔大喊“住手！”。纳达亚克用徽章打开了门，你不需要做任何操作。</li><li>“跟上他们。”：队伍自己往前走，进入巢穴。</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "第6章 人赃并获 主线任务 深入西巴尔巴。 徽章之门 的过场动画：纳达亚克站在门前，伊策尔大喊“住手！”。纳达亚克用徽章打开了门，你不需要做任何操作。 “跟上他们。”：队伍自己往前走，进入巢穴。", "sol": 0}, {"titre": "迎战卡马佐茨。", "html": "<p>最终战连续分为三个阶段。</p><p><strong>如果你在第 1 或第 2 阶段失败：</strong></p><ul><li>你会在桥的尽头、喷泉前醒来，HP 和能量全满（“卡马佐茨跟你们还没完！”）。</li><li>再从上方出口出去：战斗会直接从你失败的阶段继续，不用再看大门的剧情。</li><li>第一次失败后，会出现两团 <strong>蓝色光芒</strong>。桥尽头的那团，在出口左边、喷泉对面，提供“返回小船”。它会把你送到火山岛的海滩上，小船的右边。那里的另一团光芒提供“前往桥的尽头”。所以你可以先回去练级或去别处买东西，然后再回来。打败卡马佐茨后，光芒就会消失。</li><li>在普通难度下，第 2 次失败时（之后每失败两次），游戏会建议切换到 <strong>冒险难度</strong>：受到的伤害 -20%，造成的伤害 +20%，治疗 +30%。回答“是”就会立即生效。也可以随时在 设置 &gt; 难度 中更改。</li></ul><p><strong>第 1 阶段 — 西巴尔巴使者和卡布拉坎</strong></p><ul><li>你的队伍：巴布约、两个蠢蛋、伊策尔、<strong>纳达亚克（可操作的同伴）</strong> 和兹尼皮，不能用终极技。</li><li>纳达亚克有三个技能：<ul><li>军刀：威力非常大。</li><li>手雷：对所有敌人打六下，每四个回合能用一次。</li><li>开枪：两发子弹，每一发的目标都由你选择，无需装填。</li></ul></li><li>使者会重复他在丛林神殿里的攻击（包括召唤灵）。卡布拉坎重复它的第一阶段：飞行、火球、火焰锥，然后在剩一半血时降落。</li></ul><p><strong>第 2 阶段 — 卡马佐茨</strong></p><ul><li>卡马佐茨带着 3 个召唤物登场。它按固定的 4 招循环：<ol><li>三连火球。</li><li>蝙蝠群袭：随机攻击，并召唤一个灵，依次是霍奥切、噗姆，然后是尼克特。</li><li><strong>冲击波</strong>：对全队造成 40、然后 50、然后 120 点伤害（冒险难度下减少 20%）。</li><li>爪击：随机两个同伴，伤害很高。</li></ol></li><li>在冲击波（循环的第 3 招）之前给全队回血。霍奥切一出现就干掉他。</li><li>当卡马佐茨的 HP 低于 <strong>16 000</strong> 时：<ul><li>它会再召唤 3 名爪牙；</li><li>兹尼皮放出终极技，然后逃跑；</li><li><strong>伊策尔戴上面具</strong>，直到战斗结束：攻击增强，而且她的毁灭射击的子弹由你自己分配。这时她的烟雾弹会让被烟雾笼罩的敌人有 <strong>75%</strong> 的攻击落空（不戴面具时是 50%）。</li></ul></li><li>在 <strong>11 000 HP</strong> 时，战斗暂停：纳达亚克要他的门，卡马佐茨杀了他，然后重新站起来。</li></ul><p><strong>第 3 阶段 — 节奏战</strong>（见小游戏）。 你必须在曲子结束前打掉剩下的 11 000 HP。战斗总是持续到最后一个音符。如果失败，你会立刻重打这个阶段（不会回到桥上）。</p>", "id": "c6-affronter-camazotz", "texte": "第6章 人赃并获 主线任务 迎战卡马佐茨。 最终战连续分为三个阶段。 如果你在第 1 或第 2 阶段失败： 你会在桥的尽头、喷泉前醒来，HP 和能量全满（“卡马佐茨跟你们还没完！”）。 再从上方出口出去：战斗会直接从你失败的阶段继续，不用再看大门的剧情。 第一次失败后，会出现两团 蓝色光芒 。桥尽头的那团，在出口左边、喷泉对面，提供“返回小船”。它会把你送到火山岛的海滩上，小船的右边。那里的另一团光芒提供“前往桥的尽头”。所以你可以先回去练级或去别处买东西，然后再回来。打败卡马佐茨后，光芒就会消失。 在普通难度下，第 2 次失败时（之后每失败两次），游戏会建议切换到 冒险难度 ：受到的伤害 -20%，造成的伤害 +20%，治疗 +30%。回答“是”就会立即生效。也可以随时在 设置 > 难度 中更改。 第 1 阶段 — 西巴尔巴使者和卡布拉坎 你的队伍：巴布约、两个蠢蛋、伊策尔、 纳达亚克（可操作的同伴） 和兹尼皮，不能用终极技。 纳达亚克有三个技能： 军刀：威力非常大。 手雷：对所有敌人打六下，每四个回合能用一次。 开枪：两发子弹，每一发的目标都由你选择，无需装填。 使者会重复他在丛林神殿里的攻击（包括召唤灵）。卡布拉坎重复它的第一阶段：飞行、火球、火焰锥，然后在剩一半血时降落。 第 2 阶段 — 卡马佐茨 卡马佐茨带着 3 个召唤物登场。它按固定的 4 招循环： 三连火球。 蝙蝠群袭：随机攻击，并召唤一个灵，依次是霍奥切、噗姆，然后是尼克特。 冲击波 ：对全队造成 40、然后 50、然后 120 点伤害（冒险难度下减少 20%）。 爪击：随机两个同伴，伤害很高。 在冲击波（循环的第 3 招）之前给全队回血。霍奥切一出现就干掉他。 当卡马佐茨的 HP 低于 16 000 时： 它会再召唤 3 名爪牙； 兹尼皮放出终极技，然后逃跑； 伊策尔戴上面具 ，直到战斗结束：攻击增强，而且她的毁灭射击的子弹由你自己分配。这时她的烟雾弹会让被烟雾笼罩的敌人有 75% 的攻击落空（不戴面具时是 50%）。 在 11 000 HP 时，战斗暂停：纳达亚克要他的门，卡马佐茨杀了他，然后重新站起来。 第 3 阶段 — 节奏战 （见小游戏）。 你必须在曲子结束前打掉剩下的 11 000 HP。战斗总是持续到最后一个音符。如果失败，你会立刻重打这个阶段（不会回到桥上）。", "sol": 0}, {"titre": "在一切崩塌之前逃离西巴尔巴。", "html": "<ol><li>神殿崩塌了。巴布约骑上一个蠢蛋，伊策尔骑上另一个。无法下坐骑。</li><li>右上角有一个 <strong>50 秒的计时器</strong>，涵盖 <strong>整段路程</strong>。房间之间淡入淡出时计时会暂停，剩下不到 10 秒时会变红。</li><li>沿原路返回，每个房间都往 <strong>下方的出口</strong> 走：徽章之门、桥（一直往下走）、迷宫（来时的路，反过来走）、宝藏厅、石板厅，然后是营地。房间里多了新的落石堆。掉下来的石头只是视觉效果。</li><li>如果计时器归零（“太迟了！”），你会从大门的房间重新出发，计时器重新计满。</li><li>面朝大海的最后一段对话，然后是 <strong>片尾制作名单</strong>，配着《苦役船之王》这首歌（有按钮可以跳过）。两侧会滚动展示冒险中的回忆，以及你这次游戏的统计数据：对卡马佐茨的命中率、死亡次数、摔倒次数、赚到的金币、喝掉的啤酒、支线任务、游戏时间……制作名单中途，全副武装到钳子的兹尼皮会从左下角经过，向大家道歉。</li><li>最后一个“感谢游玩！”画面会一直显示，直到你点击。</li><li>之后你会出现在螃蟹岛的酒馆门前，身边只有巴布约和两个蠢蛋：后续内容在通关后部分。</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "第6章 人赃并获 主线任务 在一切崩塌之前逃离西巴尔巴。 神殿崩塌了。巴布约骑上一个蠢蛋，伊策尔骑上另一个。无法下坐骑。 右上角有一个 50 秒的计时器 ，涵盖 整段路程 。房间之间淡入淡出时计时会暂停，剩下不到 10 秒时会变红。 沿原路返回，每个房间都往 下方的出口 走：徽章之门、桥（一直往下走）、迷宫（来时的路，反过来走）、宝藏厅、石板厅，然后是营地。房间里多了新的落石堆。掉下来的石头只是视觉效果。 如果计时器归零（“太迟了！”），你会从大门的房间重新出发，计时器重新计满。 面朝大海的最后一段对话，然后是 片尾制作名单 ，配着《苦役船之王》这首歌（有按钮可以跳过）。两侧会滚动展示冒险中的回忆，以及你这次游戏的统计数据：对卡马佐茨的命中率、死亡次数、摔倒次数、赚到的金币、喝掉的啤酒、支线任务、游戏时间……制作名单中途，全副武装到钳子的兹尼皮会从左下角经过，向大家道歉。 最后一个“感谢游玩！”画面会一直显示，直到你点击。 之后你会出现在螃蟹岛的酒馆门前，身边只有巴布约和两个蠢蛋：后续内容在通关后部分。", "sol": 0}]}, {"titre": "支线任务", "intro": "<p>本章不会触发任务日志里的任何支线任务。不过有一场可选的遭遇与之相关：</p>", "entrees": [{"titre": "可选首领：克尔温 - 火把商人", "html": "<ul><li><strong>触发</strong>：在游戏中任何时候，当你拥有 <strong>所有可购买的火把</strong> 后再去找克尔温。他想把它们拿回去。</li><li><strong>战斗</strong>：克尔温会按固定循环切换状态。围着他转的火把的颜色预示了下一招：<ol><li>不稳定火把（橙红色），<strong>飞行</strong> 3 回合：每回合扔 2 支火把，造成灼烧。飞行时，军刀和船桨都打不到他。</li><li>磷与树脂（绿色）：让一个目标中毒。</li><li>黑色黎明（紫色）：诅咒一个目标，当克尔温再行动 3 次时目标会死亡，除非他先倒下。</li><li>果泥火把（橙色）：粘住一个目标，让他失去一回合。</li><li>白色闪光：对全队施放致盲闪光。</li><li>尊享桃花心木（金色）：重击，并给自己回血。</li></ol></li></ul><p>除了不稳定火把阶段，他都会待在 <strong>地面上</strong>，可以被近战攻击。</p><ul><li><strong>如果你输了</strong>：正常的战败。之后商店会提供“你，过来拿你那份。”选项来再次挑战。</li><li><strong>奖励</strong>：相当于一整级的 XP（按你当时的等级计算），而且你可以留着你的火把（“尤其是那根桃花心木的。”）。</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "第6章 人赃并获 支线任务 可选首领：克尔温 - 火把商人 触发 ：在游戏中任何时候，当你拥有 所有可购买的火把 后再去找克尔温。他想把它们拿回去。 战斗 ：克尔温会按固定循环切换状态。围着他转的火把的颜色预示了下一招： 不稳定火把（橙红色）， 飞行 3 回合：每回合扔 2 支火把，造成灼烧。飞行时，军刀和船桨都打不到他。 磷与树脂（绿色）：让一个目标中毒。 黑色黎明（紫色）：诅咒一个目标，当克尔温再行动 3 次时目标会死亡，除非他先倒下。 果泥火把（橙色）：粘住一个目标，让他失去一回合。 白色闪光：对全队施放致盲闪光。 尊享桃花心木（金色）：重击，并给自己回血。 除了不稳定火把阶段，他都会待在 地面上 ，可以被近战攻击。 如果你输了 ：正常的战败。之后商店会提供“你，过来拿你那份。”选项来再次挑战。 奖励 ：相当于一整级的 XP（按你当时的等级计算），而且你可以留着你的火把（“尤其是那根桃花心木的。”）。", "sol": 0}]}, {"titre": "小游戏", "intro": "", "entrees": [{"titre": "对卡马佐茨的节奏战（第 3 阶段）", "html": "<ul><li><strong>规则</strong>：音符朝准星滚动过来。在正确的时机按下对应的方向键（上、下、左、右）。音符有三种：<ul><li>普通音符；</li><li><strong>长按</strong> 音符：一直按住按键到结束；</li><li><strong>连打</strong> 音符，会以“乱棍痛打！”提示：快速地连按好几次。</li></ul></li><li><strong>判定</strong>：<ul><li>完美：误差小于 0.06 秒；</li><li>好：误差小于 0.15 秒；</li><li>还行：误差小于 0.22 秒；</li><li>超过这个范围：未命中。</li></ul></li><li><strong>流程</strong>：曲子被分成若干段。根据你在每一段的得分，要么你的同伴攻击卡马佐茨，要么它攻击全队（火球、蝙蝠群、冲击波）。</li><li><strong>卡马佐茨精疲力竭</strong>：如果它的 11 000 HP 在曲子结束前就被打光，它会保持在 1 HP。音乐继续，但它不再攻击、不再召唤，进行中的灼烧、中毒和诅咒也会消失。它会在最后一个音符时死在自己的蝙蝠群中。还是要打到最后：你的最终统计（完美、良好、及格、失误）随后会显示在制作名单里。</li><li><strong>暂停</strong>：Esc 或 P（屏幕左上角会提示按键）。</li><li><strong>失败</strong>：如果全队倒下（“船员们倒下了……”），或者曲子结束时卡马佐茨还站着（“曲终！”），结果界面会提供“重玩”以及更宽松的模式。选择的模式会随存档保存：<ul><li>普通：原样的战斗。</li><li>宽松：判定时间窗口更宽，长按和连打音符更容易。</li><li>简化：同“宽松”，但任意方向键都能对应所有音符。仍然可能会输。</li><li>剧情：每一段都算成功。队伍永远不会倒下，卡马佐茨会在曲子结束时倒下。</li></ul></li><li><strong>奖励</strong>：获胜后进入逃离西巴尔巴的阶段。</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "第6章 人赃并获 小游戏 对卡马佐茨的节奏战（第 3 阶段） 规则 ：音符朝准星滚动过来。在正确的时机按下对应的方向键（上、下、左、右）。音符有三种： 普通音符； 长按 音符：一直按住按键到结束； 连打 音符，会以“乱棍痛打！”提示：快速地连按好几次。 判定 ： 完美：误差小于 0.06 秒； 好：误差小于 0.15 秒； 还行：误差小于 0.22 秒； 超过这个范围：未命中。 流程 ：曲子被分成若干段。根据你在每一段的得分，要么你的同伴攻击卡马佐茨，要么它攻击全队（火球、蝙蝠群、冲击波）。 卡马佐茨精疲力竭 ：如果它的 11 000 HP 在曲子结束前就被打光，它会保持在 1 HP。音乐继续，但它不再攻击、不再召唤，进行中的灼烧、中毒和诅咒也会消失。它会在最后一个音符时死在自己的蝙蝠群中。还是要打到最后：你的最终统计（完美、良好、及格、失误）随后会显示在制作名单里。 暂停 ：Esc 或 P（屏幕左上角会提示按键）。 失败 ：如果全队倒下（“船员们倒下了……”），或者曲子结束时卡马佐茨还站着（“曲终！”），结果界面会提供“重玩”以及更宽松的模式。选择的模式会随存档保存： 普通：原样的战斗。 宽松：判定时间窗口更宽，长按和连打音符更容易。 简化：同“宽松”，但任意方向键都能对应所有音符。仍然可能会输。 剧情：每一段都算成功。队伍永远不会倒下，卡马佐茨会在曲子结束时倒下。 奖励 ：获胜后进入逃离西巴尔巴的阶段。", "sol": 0}, {"titre": "限时逃跑", "html": "<p>见目标“在一切崩塌之前逃离西巴尔巴”：整段路程 50 秒，可以无限重试。</p>", "id": "c6-fuite-chronometree", "texte": "第6章 人赃并获 小游戏 限时逃跑 见目标“在一切崩塌之前逃离西巴尔巴”：整段路程 50 秒，可以无限重试。", "sol": 0}]}, {"titre": "不要错过", "intro": "", "entrees": [{"titre": "不要错过", "html": "<ul><li><strong>红宝石（博隆·蒂库第2颗宝石）</strong>，在库什塔尔的火塘：没有它，后续剧情无法解锁。</li><li><strong>第5号日志</strong>（库什塔尔的石碑）和 <strong>研究日志</strong>（神殿的东营地）。它们是成就“反正老子也不识字”的七本日志中的两本。</li><li><strong>库什塔尔圣玉</strong>（隐藏）：在石板厅里，连续踩 <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>。要重复踩石板 4，就先下来再踩上去。不管门开没开都有效。<ul><li>房间西边、灰色大石板和绿色石板之间的蛇头眼睛上会出现一道光。走上去就能捡起圣玉。</li><li>效果：圣玉不会进物品栏，而是永久解锁一个技能（“技能解锁：特殊投石”）。之后蠢蛋们的扔石子会造成 8 点伤害加上他们攻击力的一半，再减去目标的防御，并有一半几率弹到另一个敌人身上。</li><li>如果你没拿到，桥上的传教士会数落你。</li><li>如果你错过了：本章结尾神殿会崩塌，但之后可以在库什塔尔竞技场的商店买到圣玉（1000 代币）。</li></ul></li><li><strong>西营地</strong> 和 <strong>宝箱怪</strong>：这些消耗品和 XP 只有在本章期间才能拿到。逃出来之后，神殿就关闭了（“全都塌了，回不去了。”）。</li><li><strong>不可回头的节点</strong>：海盗营地上方的门。之后就再也出不了火山了，除非在输给卡马佐茨之后通过桥尽头的蓝色光芒离开。</li><li><strong>狐狸雕像</strong>（可选）：在库什塔尔西边，巴布约把一座被石头压住的小雕像扶正。没有立即的奖励（小雕像会在通关后出现）。</li><li><strong>成就</strong>：<ul><li>“酒馆？”会在片尾制作名单开始时解锁，前提是你拥有第1到第5章的五个通关成就。第6章没有自己的成就。</li><li>“明白人”：买下所有火把，这也会开启与克尔温的战斗。</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "第6章 人赃并获 不要错过 不要错过 红宝石（博隆·蒂库第2颗宝石） ，在库什塔尔的火塘：没有它，后续剧情无法解锁。 第5号日志 （库什塔尔的石碑）和 研究日志 （神殿的东营地）。它们是成就“反正老子也不识字”的七本日志中的两本。 库什塔尔圣玉 （隐藏）：在石板厅里，连续踩 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 。要重复踩石板 4，就先下来再踩上去。不管门开没开都有效。 房间西边、灰色大石板和绿色石板之间的蛇头眼睛上会出现一道光。走上去就能捡起圣玉。 效果：圣玉不会进物品栏，而是永久解锁一个技能（“技能解锁：特殊投石”）。之后蠢蛋们的扔石子会造成 8 点伤害加上他们攻击力的一半，再减去目标的防御，并有一半几率弹到另一个敌人身上。 如果你没拿到，桥上的传教士会数落你。 如果你错过了：本章结尾神殿会崩塌，但之后可以在库什塔尔竞技场的商店买到圣玉（1000 代币）。 西营地 和 宝箱怪 ：这些消耗品和 XP 只有在本章期间才能拿到。逃出来之后，神殿就关闭了（“全都塌了，回不去了。”）。 不可回头的节点 ：海盗营地上方的门。之后就再也出不了火山了，除非在输给卡马佐茨之后通过桥尽头的蓝色光芒离开。 狐狸雕像 （可选）：在库什塔尔西边，巴布约把一座被石头压住的小雕像扶正。没有立即的奖励（小雕像会在通关后出现）。 成就 ： “酒馆？”会在片尾制作名单开始时解锁，前提是你拥有第1到第5章的五个通关成就。第6章没有自己的成就。 “明白人”：买下所有火把，这也会开启与克尔温的战斗。", "sol": 0}]}]}], "ko": [{"id": "c6", "num": "6장", "titre": "현행범", "intro": "<p>즈니피라는 새 이름을 얻은 게왕이 선원으로 합류했어요. 이제 이첼을 찾고, 나다야크가 볼론 티쿠의 문을 여는 걸 막아야 해요. 감옥 감방을 거쳐, 잊힌 섬 쿠슈탈을 지나, 화산섬 아래 묻힌 신전까지 가는 여정이에요.</p><aside class=\"note\"><p>참고: \"6장 — 현행범\" 타이틀 카드는 체포되는 순간에야 나와요. 아래 첫 두 목표는 그 전에 진행돼요.</p></aside>", "sections": [{"titre": "메인 퀘스트", "intro": "", "entrees": [{"titre": "계획 세우기 (게섬 선술집에서).", "html": "<ol><li>게왕을 동료로 맞은 뒤 게섬 선술집에 들어가요.</li><li>자동 장면: 바르브외, 두 멍청이, 즈니피가 상황을 정리해요. 바르브외는 나소의 늙은 죄수(\"냄새나는\" 그 사람)가 쿠슈탈 출신이라는 걸 깨달아요.</li><li>HP와 에너지가 최대로 회복돼요. 새 목표: 그와 얘기하기 위해 체포되기.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "6장 현행범 메인 퀘스트 계획 세우기 (게섬 선술집에서). 게왕을 동료로 맞은 뒤 게섬 선술집에 들어가요. 자동 장면: 바르브외, 두 멍청이, 즈니피가 상황을 정리해요. 바르브외는 나소의 늙은 죄수(\"냄새나는\" 그 사람)가 쿠슈탈 출신이라는 걸 깨달아요. HP와 에너지가 최대로 회복돼요. 새 목표: 그와 얘기하기 위해 체포되기.", "sol": 0}, {"titre": "체포될 방법 찾기.", "html": "<p>방법은 세 가지예요. <strong>통하는 건 하나뿐이에요. 케르윈의 가게를 태우는 거예요.</strong></p><ol><li><strong>나소 박물관 경비병</strong> (선택, 한 번만): 낮이든 밤이든 박물관 앞의 마르셀과 풀리샤르에게 다가가요. 바르브외가 시비를 걸어 전투가 벌어져요. 특이한 점: 첫 턴에 멍청이 - 멧돼지왕이 적 편으로 넘어가고, 두 번째 턴에 멍청이 - 올림피아드 선수도 따라가요. 둘은 노로 공격해요(올림피아드 선수는 절대 빗나가지 않고, 멧돼지왕은 빗나갈 수 있어요). 이기든 지든 장면은 똑같이 이어져요. 경비병들은 체포해 주지 않지만, 이기면 경험치를 많이 줘요. 목표는 바뀌지 않아요. 헛다리예요.</li><li><strong>선술집 강도질</strong> (선택, 한 번만): 처음 들어가는 선술집(게섬, 원숭이섬, 나소, 바람섬)에서 짧은 강도 장면이 나와요. 아무도 경비대를 부르지 않고, 평소 선술집 메뉴가 열려요.</li><li><strong>케르윈의 횃불 가게</strong> (원숭이섬, 바람섬, 나소): 장수에게 말을 걸면 메뉴가 열려요.<ul><li>\"떠난다\": 그냥 떠나고, 다음 방문 때 장면이 다시 나와요.</li><li>\"사과하고 횃불을 산다\": 평소 가게예요.</li><li><strong>\"몽땅 태워 버린다\"</strong>: 가게에 불이 붙어요.</li></ul></li></ol><p><strong>해답:</strong> 케르윈의 가게에서 <strong>\"몽땅 태워 버린다\"</strong>를 고르세요.</p><p>그다음:</p><ul><li>6장 타이틀 카드가 나오고, 바르브외가 늙은 죄수와 함께 감방에서 깨어나요.</li><li>노인이 이첼이 쿠슈탈 출신이라는 걸 확인해 주고, 지도에 섬의 위치를 표시해 줘요.</li><li>경비병이 풀어 줘요. 그 가게는 허가받지 않은 가게였거든요. 감옥에서 바로 세계 지도가 열려요. 갈 수 있는 곳은 쿠슈탈뿐이에요.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "6장 현행범 메인 퀘스트 체포될 방법 찾기. 방법은 세 가지예요. 통하는 건 하나뿐이에요. 케르윈의 가게를 태우는 거예요. 나소 박물관 경비병 (선택, 한 번만): 낮이든 밤이든 박물관 앞의 마르셀과 풀리샤르에게 다가가요. 바르브외가 시비를 걸어 전투가 벌어져요. 특이한 점: 첫 턴에 멍청이 - 멧돼지왕이 적 편으로 넘어가고, 두 번째 턴에 멍청이 - 올림피아드 선수도 따라가요. 둘은 노로 공격해요(올림피아드 선수는 절대 빗나가지 않고, 멧돼지왕은 빗나갈 수 있어요). 이기든 지든 장면은 똑같이 이어져요. 경비병들은 체포해 주지 않지만, 이기면 경험치를 많이 줘요. 목표는 바뀌지 않아요. 헛다리예요. 선술집 강도질 (선택, 한 번만): 처음 들어가는 선술집(게섬, 원숭이섬, 나소, 바람섬)에서 짧은 강도 장면이 나와요. 아무도 경비대를 부르지 않고, 평소 선술집 메뉴가 열려요. 케르윈의 횃불 가게 (원숭이섬, 바람섬, 나소): 장수에게 말을 걸면 메뉴가 열려요. \"떠난다\": 그냥 떠나고, 다음 방문 때 장면이 다시 나와요. \"사과하고 횃불을 산다\": 평소 가게예요. \"몽땅 태워 버린다\" : 가게에 불이 붙어요. 해답: 케르윈의 가게에서 \"몽땅 태워 버린다\" 를 고르세요. 그다음: 6장 타이틀 카드가 나오고, 바르브외가 늙은 죄수와 함께 감방에서 깨어나요. 노인이 이첼이 쿠슈탈 출신이라는 걸 확인해 주고, 지도에 섬의 위치를 표시해 줘요. 경비병이 풀어 줘요. 그 가게는 허가받지 않은 가게였거든요. 감옥에서 바로 세계 지도가 열려요. 갈 수 있는 곳은 쿠슈탈뿐이에요.", "sol": 1}, {"titre": "쿠슈탈로 가기.", "html": "<ol><li>세계 지도에서 쿠슈탈로 항해해요.</li><li>섬에는 음악이 없고 바람과 파도 소리만 들려요. 도착하면 일행이 대화를 나눠요(자동 장면).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "6장 현행범 메인 퀘스트 쿠슈탈로 가기. 세계 지도에서 쿠슈탈로 항해해요. 섬에는 음악이 없고 바람과 파도 소리만 들려요. 도착하면 일행이 대화를 나눠요(자동 장면).", "sol": 0}, {"titre": "쿠슈탈 유적 탐험하기.", "html": "<ol><li>섬 중북부(상륙 지점 북쪽, 가운데쯤)의 <strong>화덕</strong>으로 가서 상호작용하세요.</li><li>불이 꺼져 있고, 피 묻은 천이 막대기에 묶여 있어요. <strong>볼론 티쿠의 두 번째 보석</strong>(이첼이 지니고 있던 빨간 보석)을 얻어요.</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "6장 현행범 메인 퀘스트 쿠슈탈 유적 탐험하기. 섬 중북부(상륙 지점 북쪽, 가운데쯤)의 화덕 으로 가서 상호작용하세요. 불이 꺼져 있고, 피 묻은 천이 막대기에 묶여 있어요. 볼론 티쿠의 두 번째 보석 (이첼이 지니고 있던 빨간 보석)을 얻어요.", "sol": 0}, {"titre": "쿠슈탈의 과거 알아내기.", "html": "<p>비석 네 개를 순서에 상관없이 읽으세요(\"읽기\"). 목표 아래에 \"읽은 비석: x / 4\" 카운터가 표시돼요.</p><div class=\"tab\"><table><thead><tr><th>비석</th><th>위치</th></tr></thead><tbody><tr><td>비석 1</td><td>동쪽, 큰 신목 근처</td></tr><tr><td>비석 2</td><td>남서쪽, 남쪽 해안 근처</td></tr><tr><td>비석 3</td><td>북서쪽</td></tr><tr><td>비석 4</td><td>북동쪽</td></tr></tbody></table></div><ul><li>처음 읽는 비석에서 <strong>일지 5번</strong>을 얻어요. 이후 비석마다 기록이 추가되고, 항상 이야기 순서대로 정리돼요.</li><li>화덕에 가기 전에 비석을 읽어도 돼요. 결론은 둘 다 끝내야 나와요.</li><li>전부 읽고 일지를 닫으면 바르브외가 결론을 내려요. 세계 지도에 <strong>화산섬</strong>이 나타나요.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "6장 현행범 메인 퀘스트 쿠슈탈의 과거 알아내기. 비석 네 개를 순서에 상관없이 읽으세요(\"읽기\"). 목표 아래에 \"읽은 비석: x / 4\" 카운터가 표시돼요. 비석 위치 비석 1 동쪽, 큰 신목 근처 비석 2 남서쪽, 남쪽 해안 근처 비석 3 북서쪽 비석 4 북동쪽 처음 읽는 비석에서 일지 5번 을 얻어요. 이후 비석마다 기록이 추가되고, 항상 이야기 순서대로 정리돼요. 화덕에 가기 전에 비석을 읽어도 돼요. 결론은 둘 다 끝내야 나와요. 전부 읽고 일지를 닫으면 바르브외가 결론을 내려요. 세계 지도에 화산섬 이 나타나요.", "sol": 0}, {"titre": "화산섬으로 가기.", "html": "<ol><li>화산섬으로 항해해요. 내리자마자 자동 장면이 시작돼요. 나다야크가 일행을 불러 세우고, 바르브외는 신전 쪽으로 걸어가다 발을 헛디뎌요.</li><li>컷신: 나다야크가 이첼에게 총을 겨누고 멍청이 하나를 다치게 해요. 즈니피가 보석이 있다고 털어놓고, 바르브외는 보석을 이첼과 맞바꿔요. <strong>볼론 티쿠의 보석이 전부 인벤토리에서 사라져요.</strong> 나다야크는 곧바로 약속을 깨고 해골들을 풀어놓아요.</li><li><strong>나다야크의 해골들과의 전투</strong> (해골 5마리). 파티: 바르브외, 멍청이 - 멧돼지왕, 그리고 궁극기가 없는 게왕. 지면 HP와 에너지가 가득 찬 채로 전투가 바로 다시 시작돼요.</li><li>메달 컷신(건너뛸 수 없어요). 신전이 깨어나고, 즈니피가 이첼을 풀어 줘요. 이첼이 파티에 합류하고 \"다른 길\"을 제안해요.</li><li>신전 안 해적 야영지(칼데라)에서 다시 조작하게 돼요. 이제부터는 두 멍청이, 이첼, 즈니피까지 파티 전원이 따라와요.</li></ol><p>섬을 떠나려면 섬 남쪽의 쪽배를 타세요(\"승선한다\" / \"남는다\").</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "6장 현행범 메인 퀘스트 화산섬으로 가기. 화산섬으로 항해해요. 내리자마자 자동 장면이 시작돼요. 나다야크가 일행을 불러 세우고, 바르브외는 신전 쪽으로 걸어가다 발을 헛디뎌요. 컷신: 나다야크가 이첼에게 총을 겨누고 멍청이 하나를 다치게 해요. 즈니피가 보석이 있다고 털어놓고, 바르브외는 보석을 이첼과 맞바꿔요. 볼론 티쿠의 보석이 전부 인벤토리에서 사라져요. 나다야크는 곧바로 약속을 깨고 해골들을 풀어놓아요. 나다야크의 해골들과의 전투 (해골 5마리). 파티: 바르브외, 멍청이 - 멧돼지왕, 그리고 궁극기가 없는 게왕. 지면 HP와 에너지가 가득 찬 채로 전투가 바로 다시 시작돼요. 메달 컷신(건너뛸 수 없어요). 신전이 깨어나고, 즈니피가 이첼을 풀어 줘요. 이첼이 파티에 합류하고 \"다른 길\"을 제안해요. 신전 안 해적 야영지(칼데라)에서 다시 조작하게 돼요. 이제부터는 두 멍청이, 이첼, 즈니피까지 파티 전원이 따라와요. 섬을 떠나려면 섬 남쪽의 쪽배를 타세요(\"승선한다\" / \"남는다\").", "sol": 0}, {"titre": "화산 한가운데로 들어갈 길 찾기.", "html": "<p><strong>1. 해적 야영지 (신전 첫 번째 방)</strong></p><ul><li>방 아래쪽으로 들어가요. 더 안으로 이어지는 문은 위쪽 가운데에 있어요.</li><li><strong>동쪽 야영지</strong>(가운데 오른쪽, 해적 6명): <strong>필수</strong>예요. 이기면 <strong>연구 일지</strong>를 얻고 바로 열려요. 맥주 3과 조난자의 프리카세 하나도 받아요.</li><li><strong>서쪽 야영지</strong>(왼쪽, 해적 4명): 선택이에요. 맥주 2와 일품 생선 필레 하나를 줘요.</li><li>연구 일지가 없으면 위쪽 문은 닫혀 있어요. 그때 바르브외가 \"이 해적들, 뭔가 숨기고 있어.\"라고 말해요.</li><li>위쪽 문을 지날 때 확인을 요구해요(\"최종 단계에 들어갑니다…\"). <strong>여기가 돌아올 수 없는 지점이에요.</strong> 수락하면 석판 방의 아래쪽 문이 더 이상 야영지로 이어지지 않고, 섬에서 신전 문도 다시 열리지 않아요. 준비(서쪽 야영지, 쇼핑, 회복)는 그 전에 끝내세요.</li><li>돌아올 수 없는 지점을 지난 뒤에도 보물 방에서 석판 방으로는 돌아갈 수 있지만, 미궁에서 보물 방으로는 돌아갈 수 없어요.</li><li><strong>신전에서 패배하면</strong>(야영지, 수호자, 미믹, 영혼): 게섬 선술집에서 HP와 에너지가 가득 찬 채로 깨어나요. 돌아올 수 없는 지점을 지난 뒤에는 <strong>전투마다 미리 저장하고</strong>, 지면 불러오세요. 섬에서는 신전 문이 계속 닫혀 있어요.</li></ul><p><strong>2. 석판 방 (두 번째 방, 어둠 속)</strong> 모두가 횃불을 켜요. 방 바닥에는 <strong>석판 네 개</strong>가 있고 가운데에 분수가 있어요.</p><div class=\"tab\"><table><thead><tr><th>석판</th><th>모양</th><th>위치</th></tr></thead><tbody><tr><td>1</td><td>작은 회색 석판</td><td>북동쪽</td></tr><tr><td>2</td><td>중간 크기 <strong>초록</strong> 석판</td><td>서쪽, 아래쪽 절반</td></tr><tr><td>3</td><td>중간 크기 <strong>분홍</strong> 석판</td><td>동쪽, 아래쪽 절반</td></tr><tr><td>4</td><td>큰 회색 석판</td><td>북서쪽</td></tr></tbody></table></div><p><em>a) 수호자의 방.</em> 직전과 다른 석판을 밟을 때마다 위쪽 방 네 개 중 하나가 열리고 <strong>수호자 둘</strong>이 공격해 와요. 그러니 전투는 모두 4번이에요.</p><ul><li>첫 번째 수호자는 대상 앞으로 순간이동해서 한 번 때려요.</li><li>두 번째 수호자는 무작위 대상에게 세 번 연달아 때려요.</li></ul><p>지면 그 방은 클리어로 치지 않고 나중에 다시 열려요. 수호자는 뒤에 나올 미믹이나 영혼과 마찬가지로 도발 중인 멍청이(구르기)를 우선으로 때려요. 네 번째 전투가 끝나면 가운데 분수가 채워져요. \"재생하기\"를 고르면 횟수 제한 없이 HP와 에너지가 최대로 회복돼요.</p><p><em>b) 문.</em> 연구 일지에는 가면 여섯 개가 차례로 그려져 있어요. 가면마다 점과 막대로 된 1~6의 마야 숫자가 붙어 있어 순서를 알려 줘요. 가면의 색과 크기가 석판을 가리켜요. 큰 회색 = 4번 석판, 초록 = 2번 석판, 분홍 = 3번 석판, 작은 회색 = 1번 석판이에요.</p><p><strong>해답:</strong> 석판을 <strong>4 – 2 – 3 – 4 – 3 – 1</strong> 순서로 밟으세요. 즉 큰 회색, 초록, 분홍, 큰 회색, 분홍, 작은 회색이에요.</p><ul><li>새로 밟을 때만 인정돼요. 누군가 올라서 있는 동안 석판은 눌린 채로 있어요. 따라오는 파티원도 마찬가지예요.</li><li>게임은 <strong>마지막 6번의 입력</strong>만 기억해요. 틀리면 처음부터 다시 밟으면 돼요.</li><li>요령: 오른쪽 아래 모래시계 버튼을 누르면 <strong>협동 모드</strong>가 돼요. 바르브외, 두 멍청이, 이첼이 그 자리에 머물고, 한 번에 한 명씩만 움직여요. 즈니피는 조작할 수 없어요. 항상 바르브외를 따라다니고, 그 뒤에서 석판을 누를 수 있어요. 가장 안전한 방법은 바르브외(그리고 즈니피)를 석판에서 멀리 두고, 멍청이나 이첼로 순서를 밟는 거예요.</li><li>올바른 순서를 밟으면 위쪽 문이 열리고 팀이 다시 모여요.</li></ul><p><strong>3. 보물 방 (세 번째 방)</strong></p><ul><li>위쪽 큰 방에 상자 30개가 <strong>10개씩 3줄</strong>로 놓여 있어요. 상자에 다가가 \"열기\"를 고르세요.</li><li>하나만 빼고 전부 <strong>미믹</strong>(게임 속 이름: 함정 상자)이에요. 적은 하나뿐이지만 아주 튼튼하고, 턴마다 세 대상을 물어요. 도주할 수 없어요. 미믹을 쓰러뜨릴 때마다 소모품 1~3개와 경험치를 많이 줘요. 열린 상자는 그대로 열려 있어요. 진 미믹은 다시 나오지 않고 전리품도 사라져요.</li><li>힌트: 위쪽 벽을 따라가면 빛이 천천히 방을 훑어요. 새겨진 인물 둘이 드러나는데, 각각 초록색 마야 숫자가 있어요. 왼쪽은 <strong>점 2개</strong>(= 2), 오른쪽은 <strong>막대 하나와 점 4개</strong>(= 9)예요.</li></ul><p><strong>해답:</strong> <strong>두 번째 줄</strong>(가운데 줄)의 <strong>왼쪽에서 아홉 번째</strong>(오른쪽에서 두 번째) 상자를 여세요. 위쪽 가운데 안쪽 문이 열려요.</p><p><strong>4. 영혼의 미궁 (네 번째 방)</strong></p><ul><li>들어가면 사방이 깜깜해져요. 웃음소리가 터지고 어둠 속에서 눈들이 빛나요(컷신).</li><li>이첼이 가면을 쓰고 <strong>앞장서요</strong>. 빛나는 길은 이첼 주변에만 심장 박동에 맞춰 보여요. 복도에는 유령들이 떠돌지만 해롭지 않아요.</li><li>방 한가운데, 길 위에 <strong>필수</strong> 영혼 무리가 있어요. 품, 호오체, 닉테예요.<ul><li>품은 파티 전원에게 독을 걸어요.</li><li>호오체는 턴마다 한 명에게 저주를 걸어요. 호오체가 3번 더 행동하면 대상이 죽어요. 그 전에 호오체가 쓰러지면 괜찮아요. <strong>호오체를 먼저 쓰러뜨리세요.</strong></li><li>닉테는 비명을 질러 파티 전원에게 피해를 줘요. 세게 때리지만 HP가 낮아요.</li></ul></li><li>선택 영혼 무리 넷이 구석에서 기다려요. 북서쪽, 서쪽, 동쪽, 북동쪽이에요. 영혼을 쓰러뜨릴 때마다 무작위 소모품을 하나 줘요.</li><li><strong>경로</strong>: 입구(아래쪽 가운데)에서 가운데까지 올라가요(전투). 그다음 서쪽으로 가서 구불구불 북쪽으로 올라가 북서쪽 복도까지 가고, 다시 동쪽으로 가요. 조금 내려간 뒤 중간 높이의 긴 복도로 동쪽을 가로질러요. 동쪽으로 내려간 다음, 동쪽 가장자리를 따라 맨 위까지 올라가요. 마지막으로 서쪽으로 돌아가 위쪽 가운데 문까지 가요.</li><li>위쪽 가운데 문은 앞에 서면 저절로 열려요.</li></ul><p><strong>5. 다리 (다섯 번째 방)</strong></p><ul><li>더 이상 어둡지 않아요. 모두 다시 바르브외를 따라와요. 긴 다리를 따라 북쪽으로 올라가요.</li><li><strong>동굴의 노인</strong>(원숭이섬의 그 노인)이 길을 막아요(\"너희는… 지나가지… 못하리라…\"). 다가가면 회상 장면이 나오고, 그 뒤 지나가게 해 줘요. 노인의 오른쪽으로 돌아가세요.</li><li>더 위에서는 모로 블랑코의 <strong>설교자</strong>가 똑같이 막아요. 장면, 회상, 통과예요.</li><li>맨 위, 출구 오른쪽에 있는 <strong>분수</strong>에서 \"재생하기\"를 할 수 있어요(HP와 에너지 최대).</li><li><strong>여기서 회복하고 준비하세요.</strong> 다음 방에 들어가면 곧장 최종 보스전으로 이어져요.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "6장 현행범 메인 퀘스트 화산 한가운데로 들어갈 길 찾기. 1. 해적 야영지 (신전 첫 번째 방) 방 아래쪽으로 들어가요. 더 안으로 이어지는 문은 위쪽 가운데에 있어요. 동쪽 야영지 (가운데 오른쪽, 해적 6명): 필수 예요. 이기면 연구 일지 를 얻고 바로 열려요. 맥주 3과 조난자의 프리카세 하나도 받아요. 서쪽 야영지 (왼쪽, 해적 4명): 선택이에요. 맥주 2와 일품 생선 필레 하나를 줘요. 연구 일지가 없으면 위쪽 문은 닫혀 있어요. 그때 바르브외가 \"이 해적들, 뭔가 숨기고 있어.\"라고 말해요. 위쪽 문을 지날 때 확인을 요구해요(\"최종 단계에 들어갑니다…\"). 여기가 돌아올 수 없는 지점이에요. 수락하면 석판 방의 아래쪽 문이 더 이상 야영지로 이어지지 않고, 섬에서 신전 문도 다시 열리지 않아요. 준비(서쪽 야영지, 쇼핑, 회복)는 그 전에 끝내세요. 돌아올 수 없는 지점을 지난 뒤에도 보물 방에서 석판 방으로는 돌아갈 수 있지만, 미궁에서 보물 방으로는 돌아갈 수 없어요. 신전에서 패배하면 (야영지, 수호자, 미믹, 영혼): 게섬 선술집에서 HP와 에너지가 가득 찬 채로 깨어나요. 돌아올 수 없는 지점을 지난 뒤에는 전투마다 미리 저장하고 , 지면 불러오세요. 섬에서는 신전 문이 계속 닫혀 있어요. 2. 석판 방 (두 번째 방, 어둠 속) 모두가 횃불을 켜요. 방 바닥에는 석판 네 개 가 있고 가운데에 분수가 있어요. 석판 모양 위치 1 작은 회색 석판 북동쪽 2 중간 크기 초록 석판 서쪽, 아래쪽 절반 3 중간 크기 분홍 석판 동쪽, 아래쪽 절반 4 큰 회색 석판 북서쪽 a) 수호자의 방. 직전과 다른 석판을 밟을 때마다 위쪽 방 네 개 중 하나가 열리고 수호자 둘 이 공격해 와요. 그러니 전투는 모두 4번이에요. 첫 번째 수호자는 대상 앞으로 순간이동해서 한 번 때려요. 두 번째 수호자는 무작위 대상에게 세 번 연달아 때려요. 지면 그 방은 클리어로 치지 않고 나중에 다시 열려요. 수호자는 뒤에 나올 미믹이나 영혼과 마찬가지로 도발 중인 멍청이(구르기)를 우선으로 때려요. 네 번째 전투가 끝나면 가운데 분수가 채워져요. \"재생하기\"를 고르면 횟수 제한 없이 HP와 에너지가 최대로 회복돼요. b) 문. 연구 일지에는 가면 여섯 개가 차례로 그려져 있어요. 가면마다 점과 막대로 된 1~6의 마야 숫자가 붙어 있어 순서를 알려 줘요. 가면의 색과 크기가 석판을 가리켜요. 큰 회색 = 4번 석판, 초록 = 2번 석판, 분홍 = 3번 석판, 작은 회색 = 1번 석판이에요. 해답: 석판을 4 – 2 – 3 – 4 – 3 – 1 순서로 밟으세요. 즉 큰 회색, 초록, 분홍, 큰 회색, 분홍, 작은 회색이에요. 새로 밟을 때만 인정돼요. 누군가 올라서 있는 동안 석판은 눌린 채로 있어요. 따라오는 파티원도 마찬가지예요. 게임은 마지막 6번의 입력 만 기억해요. 틀리면 처음부터 다시 밟으면 돼요. 요령: 오른쪽 아래 모래시계 버튼을 누르면 협동 모드 가 돼요. 바르브외, 두 멍청이, 이첼이 그 자리에 머물고, 한 번에 한 명씩만 움직여요. 즈니피는 조작할 수 없어요. 항상 바르브외를 따라다니고, 그 뒤에서 석판을 누를 수 있어요. 가장 안전한 방법은 바르브외(그리고 즈니피)를 석판에서 멀리 두고, 멍청이나 이첼로 순서를 밟는 거예요. 올바른 순서를 밟으면 위쪽 문이 열리고 팀이 다시 모여요. 3. 보물 방 (세 번째 방) 위쪽 큰 방에 상자 30개가 10개씩 3줄 로 놓여 있어요. 상자에 다가가 \"열기\"를 고르세요. 하나만 빼고 전부 미믹 (게임 속 이름: 함정 상자)이에요. 적은 하나뿐이지만 아주 튼튼하고, 턴마다 세 대상을 물어요. 도주할 수 없어요. 미믹을 쓰러뜨릴 때마다 소모품 1~3개와 경험치를 많이 줘요. 열린 상자는 그대로 열려 있어요. 진 미믹은 다시 나오지 않고 전리품도 사라져요. 힌트: 위쪽 벽을 따라가면 빛이 천천히 방을 훑어요. 새겨진 인물 둘이 드러나는데, 각각 초록색 마야 숫자가 있어요. 왼쪽은 점 2개 (= 2), 오른쪽은 막대 하나와 점 4개 (= 9)예요. 해답: 두 번째 줄 (가운데 줄)의 왼쪽에서 아홉 번째 (오른쪽에서 두 번째) 상자를 여세요. 위쪽 가운데 안쪽 문이 열려요. 4. 영혼의 미궁 (네 번째 방) 들어가면 사방이 깜깜해져요. 웃음소리가 터지고 어둠 속에서 눈들이 빛나요(컷신). 이첼이 가면을 쓰고 앞장서요 . 빛나는 길은 이첼 주변에만 심장 박동에 맞춰 보여요. 복도에는 유령들이 떠돌지만 해롭지 않아요. 방 한가운데, 길 위에 필수 영혼 무리가 있어요. 품, 호오체, 닉테예요. 품은 파티 전원에게 독을 걸어요. 호오체는 턴마다 한 명에게 저주를 걸어요. 호오체가 3번 더 행동하면 대상이 죽어요. 그 전에 호오체가 쓰러지면 괜찮아요. 호오체를 먼저 쓰러뜨리세요. 닉테는 비명을 질러 파티 전원에게 피해를 줘요. 세게 때리지만 HP가 낮아요. 선택 영혼 무리 넷이 구석에서 기다려요. 북서쪽, 서쪽, 동쪽, 북동쪽이에요. 영혼을 쓰러뜨릴 때마다 무작위 소모품을 하나 줘요. 경로 : 입구(아래쪽 가운데)에서 가운데까지 올라가요(전투). 그다음 서쪽으로 가서 구불구불 북쪽으로 올라가 북서쪽 복도까지 가고, 다시 동쪽으로 가요. 조금 내려간 뒤 중간 높이의 긴 복도로 동쪽을 가로질러요. 동쪽으로 내려간 다음, 동쪽 가장자리를 따라 맨 위까지 올라가요. 마지막으로 서쪽으로 돌아가 위쪽 가운데 문까지 가요. 위쪽 가운데 문은 앞에 서면 저절로 열려요. 5. 다리 (다섯 번째 방) 더 이상 어둡지 않아요. 모두 다시 바르브외를 따라와요. 긴 다리를 따라 북쪽으로 올라가요. 동굴의 노인 (원숭이섬의 그 노인)이 길을 막아요(\"너희는… 지나가지… 못하리라…\"). 다가가면 회상 장면이 나오고, 그 뒤 지나가게 해 줘요. 노인의 오른쪽으로 돌아가세요. 더 위에서는 모로 블랑코의 설교자 가 똑같이 막아요. 장면, 회상, 통과예요. 맨 위, 출구 오른쪽에 있는 분수 에서 \"재생하기\"를 할 수 있어요(HP와 에너지 최대). 여기서 회복하고 준비하세요. 다음 방에 들어가면 곧장 최종 보스전으로 이어져요.", "sol": 2}, {"titre": "시발바 깊숙이 들어가기.", "html": "<ol><li><strong>메달 문</strong> 컷신: 나다야크가 문 앞에 있고, 이첼이 \"멈춰!\"라고 외쳐요. 나다야크가 메달로 문을 열어요. 내가 할 일은 없어요.</li><li>\"따라가자.\": 일행이 알아서 앞으로 나아가 소굴로 들어가요.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "6장 현행범 메인 퀘스트 시발바 깊숙이 들어가기. 메달 문 컷신: 나다야크가 문 앞에 있고, 이첼이 \"멈춰!\"라고 외쳐요. 나다야크가 메달로 문을 열어요. 내가 할 일은 없어요. \"따라가자.\": 일행이 알아서 앞으로 나아가 소굴로 들어가요.", "sol": 0}, {"titre": "카마소츠와 맞서기.", "html": "<p>최종 전투는 세 단계로 이어져요.</p><p><strong>1·2단계에서 지면:</strong></p><ul><li>다리 끝 분수 앞에서 HP와 에너지가 가득 찬 채로 깨어나요(\"카마소츠와의 승부는 아직 끝나지 않았다!\").</li><li>위쪽 출구를 다시 지나가면 문 장면 없이 진 단계부터 전투가 바로 다시 시작돼요.</li><li>처음 지면 <strong>푸른 빛</strong> 두 개가 나타나요. 다리 끝, 출구 왼쪽, 분수 맞은편에 있는 빛은 \"배로 돌아가기\"를 제안해요. 화산섬 해변, 쪽배 오른쪽으로 데려다줘요. 그곳의 다른 빛은 \"다리 끝으로 가기\"를 제안해요. 그러니 다른 곳에서 훈련하거나 쇼핑하고 돌아올 수 있어요. 빛은 카마소츠를 쓰러뜨리면 사라져요.</li><li>보통 난이도에서 두 번째로 지면(그 뒤로는 두 번 질 때마다) <strong>모험 난이도</strong>로 바꿀지 물어봐요. 받는 피해 -20%, 주는 피해 +20%, 회복 +30%예요. \"응\"이라고 답하면 바로 적용돼요. 환경 설정 &gt; 난이도에서도 언제든 바꿀 수 있어요.</li></ul><p><strong>1단계 — 시발바의 전령과 카브라칸</strong></p><ul><li>파티: 바르브외, 두 멍청이, 이첼, <strong>나다야크(조작 가능한 아군)</strong>, 궁극기가 없는 즈니피.</li><li>나다야크의 스킬은 세 가지예요.<ul><li>사브르: 아주 강력해요.</li><li>수류탄: 적 전체에 6번 타격, 네 턴에 한 번 쓸 수 있어요.</li><li>총격: 두 발, 한 발씩 대상을 고를 수 있고 재장전이 없어요.</li></ul></li><li>전령은 정글 신전 때의 공격(영혼 소환 포함)을 그대로 써요. 카브라칸은 첫 단계의 패턴을 그대로 써요. 비행, 화염구, 화염 원뿔, 그리고 HP가 절반이 되면 내려앉아요.</li></ul><p><strong>2단계 — 카마소츠</strong></p><ul><li>카마소츠가 소환수 3마리를 데리고 나와요. 공격 4개를 정해진 순서로 반복해요.<ol><li>화염구 세 발.</li><li>박쥐 떼: 무작위 타격, 그리고 영혼 하나를 소환해요. 호오체, 품, 닉테 순서로 번갈아 나와요.</li><li><strong>충격파</strong>: 파티 전원에게 피해 40, 다음엔 50, 그다음엔 120(모험 난이도에서는 20% 감소).</li><li>할퀴기: 무작위 아군 둘에게 큰 피해.</li></ol></li><li>충격파(주기의 세 번째 공격) 직전에 파티를 회복하세요. 호오체는 나오자마자 처리하세요.</li><li>카마소츠의 HP가 <strong>16,000</strong> 아래로 떨어지면:<ul><li>부하 셋을 더 소환해요.</li><li>즈니피가 궁극기를 쓰고 도망쳐요.</li><li><strong>이첼이 가면을 써요.</strong> 전투가 끝날 때까지 공격이 강해지고, 파멸의 사격의 탄을 직접 나눠 쏠 수 있어요. 이때 연막탄은 연기에 휩  \"너도 와서 한몫 챙겨.\"를 고르면 재도전할 수 있어요.</li><li><strong>보상</strong>: 레벨 하나 분량의 경험치(그때의 레벨 기준), 그리고 횃불은 그대로 가져요(\"특히 마호가니 횃불은요\").</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "6장 현행범 서브 퀘스트 선택 보스: 케르윈 - 횃불 장수 시작 조건 : 게임 중 언제든 살 수 있는 횃불을 전부 갖춘 뒤 케르윈을 다시 찾아가요. 횃불을 되찾고 싶어 해요. 전투 : 케르윈은 정해진 순서로 상태가 바뀌어요. 주위를 도는 횃불의 색깔이 다음 공격을 알려 줘요. 불안정한 횃불(빨강-주황), 3턴 동안 비행 : 턴마다 횃불 2개를 던지고 화상을 입혀요. 날고 있는 동안에는 사브르와 노가 닿지 않아요. 인광과 송진(초록): 대상 하나에게 독을 걸어요. 검은 새벽(보라): 대상 하나에게 저주를 걸어요. 케르윈이 3번 더 행동하면 대상이 죽어요. 그 전에 케르윈이 쓰러지면 괜찮아요. 콩포트 횃불(주황): 대상 하나를 끈적이게 해서 턴을 잃게 해요. 하얀 섬광: 파티 전원에게 눈부신 섬광. 프레스티지 마호가니(금색): 강하게 때리고 자기 HP를 회복해요. 불안정한 횃불 단계를 빼면 지상 에 있어서 근접 공격이 다시 통해요. 지면 : 평소처럼 패배 처리돼요. 그 뒤 가게에서 \"너도 와서 한몫 챙겨.\"를 고르면 재도전할 수 있어요. 보상 : 레벨 하나 분량의 경험치(그때의 레벨 기준), 그리고 횃불은 그대로 가져요(\"특히 마호가니 횃불은요\").", "sol": 0}]}, {"titre": "미니게임", "intro": "", "entrees": [{"titre": "카마소츠와의 리듬 전투 (3단계)", "html": "<ul><li><strong>규칙</strong>: 노트가 조준점 쪽으로 흘러와요. 알맞은 타이밍에 해당 이동 방향키(위, 아래, 왼쪽, 오른쪽)를 누르세요. 노트는 세 종류예요.<ul><li>일반 노트</li><li><strong>홀드</strong> 노트: 끝날 때까지 키를 누르고 있어요.</li><li><strong>연타</strong> 노트: \"몽둥이찜질!\"이 뜨면 아주 빠르게 여러 번 눌러요.</li></ul></li><li><strong>판정</strong>:<ul><li>퍼펙트: 0.06초 이내</li><li>굿: 0.15초 이내</li><li>그럭저럭: 0.22초 이내</li><li>그 밖: 미스</li></ul></li><li><strong>진행</strong>: 곡은 여러 구간으로 나뉘어 있어요. 구간마다 점수에 따라 아군이 카마소츠를 공격하거나, 카마소츠가 파티를 공격해요(화염구, 박쥐 떼, 충격파).</li><li><strong>기진맥진한 카마소츠</strong>: 곡이 끝나기 전에 HP 11,000을 다 깎으면 HP 1로 남아요. 음악은 계속되지만 더는 공격하지도 소환하지도 않고, 걸려 있던 화상, 독, 저주도 사라져요. 마지막 음에서 박쥐 떼 속으로 사라지며 죽어요. 그래도 끝까지 연주하세요. 최종 집계(퍼펙트, 굿, 그럭저럭, 미스)가 나중에 크레딧에 나와요.</li><li><strong>일시정지</strong>: Esc 또는 P(화면 왼쪽 위에 키가 표시돼요).</li><li><strong>패배</strong>: 파티 전원이 쓰러지거나(\"선원들이 쓰러진다...\") 카마소츠가 서 있는 채로 곡이 끝나면(\"곡 끝!\"), 결과 화면에서 \"다시 하기\"와 더 쉬운 모드를 고를 수 있어요. 고른 모드는 세이브에 저장돼요.<ul><li>보통: 원래 그대로의 전투.</li><li>관대: 타이밍 판정 범위가 넓어지고, 홀드와 연타 노트가 쉬워져요.</li><li>간소화: 관대와 같지만, 어느 방향키든 모든 노트에 통해요. 그래도 질 수는 있어요.</li><li>스토리: 모든 구간이 성공으로 처리돼요. 파티는 절대 쓰러지지 않고, 곡이 끝나면 카마소츠가 쓰러져요.</li></ul></li><li><strong>보상</strong>: 이기면 시발바 탈출이 시작돼요.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "6장 현행범 미니게임 카마소츠와의 리듬 전투 (3단계) 규칙 : 노트가 조준점 쪽으로 흘러와요. 알맞은 타이밍에 해당 이동 방향키(위, 아래, 왼쪽, 오른쪽)를 누르세요. 노트는 세 종류예요. 일반 노트 홀드 노트: 끝날 때까지 키를 누르고 있어요. 연타 노트: \"몽둥이찜질!\"이 뜨면 아주 빠르게 여러 번 눌러요. 판정 : 퍼펙트: 0.06초 이내 굿: 0.15초 이내 그럭저럭: 0.22초 이내 그 밖: 미스 진행 : 곡은 여러 구간으로 나뉘어 있어요. 구간마다 점수에 따라 아군이 카마소츠를 공격하거나, 카마소츠가 파티를 공격해요(화염구, 박쥐 떼, 충격파). 기진맥진한 카마소츠 : 곡이 끝나기 전에 HP 11,000을 다 깎으면 HP 1로 남아요. 음악은 계속되지만 더는 공격하지도 소환하지도 않고, 걸려 있던 화상, 독, 저주도 사라져요. 마지막 음에서 박쥐 떼 속으로 사라지며 죽어요. 그래도 끝까지 연주하세요. 최종 집계(퍼펙트, 굿, 그럭저럭, 미스)가 나중에 크레딧에 나와요. 일시정지 : Esc 또는 P(화면 왼쪽 위에 키가 표시돼요). 패배 : 파티 전원이 쓰러지거나(\"선원들이 쓰러진다...\") 카마소츠가 서 있는 채로 곡이 끝나면(\"곡 끝!\"), 결과 화면에서 \"다시 하기\"와 더 쉬운 모드를 고를 수 있어요. 고른 모드는 세이브에 저장돼요. 보통: 원래 그대로의 전투. 관대: 타이밍 판정 범위가 넓어지고, 홀드와 연타 노트가 쉬워져요. 간소화: 관대와 같지만, 어느 방향키든 모든 노트에 통해요. 그래도 질 수는 있어요. 스토리: 모든 구간이 성공으로 처리돼요. 파티는 절대 쓰러지지 않고, 곡이 끝나면 카마소츠가 쓰러져요. 보상 : 이기면 시발바 탈출이 시작돼요.", "sol": 0}, {"titre": "시간제한 탈출", "html": "<p>목표 \"모든 게 무너지기 전에 시발바 탈출하기.\" 참고: 전체 경로에 50초, 재도전 무제한이에요.</p>", "id": "c6-fuite-chronometree", "texte": "6장 현행범 미니게임 시간제한 탈출 목표 \"모든 게 무너지기 전에 시발바 탈출하기.\" 참고: 전체 경로에 50초, 재도전 무제한이에요.", "sol": 0}]}, {"titre": "놓치지 말 것", "intro": "", "entrees": [{"titre": "놓치지 말 것", "html": "<ul><li><strong>빨간 보석 (볼론 티쿠의 두 번째 보석)</strong>, 쿠슈탈의 화덕: 이게 없으면 이야기가 진행되지 않아요.</li><li><strong>일지 5번</strong>(쿠슈탈의 비석)과 <strong>연구 일지</strong>(신전 동쪽 야영지). 업적 \"어차피 난 글 못 읽어\"의 일지 7권 중 두 권이에요.</li><li><strong>쿠슈탈의 신성한 비취</strong>(숨김): 석판 방에서 <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>을 이어서 밟으세요. 4번 석판을 연달아 밟으려면 내려갔다가 다시 올라서세요. 문이 열려 있든 아니든 돼요.<ul><li>방 서쪽, 큰 회색 석판과 초록 석판 사이에 있는 뱀 머리의 눈에 빛이 나타나요. 위로 걸어가면 비취를 주워요.</li><li>효과: 비취는 인벤토리에 들어가지 않고 스킬을 영구히 해금해요(\"스킬 해금: 특제 돌멩이 던지기\"). 멍청이들의 돌멩이 던지기가 피해 8 + 공격의 절반 - 대상의 방어가 되고, 1/2 확률로 다른 적에게 튕겨요.</li><li>비취가 없으면 다리의 설교자가 나무라요.</li><li>놓쳤다면: 챕터가 끝날 때 신전이 무너지지만, 나중에 쿠슈탈 아레나 상점에서 비취를 살 수 있어요(토큰 1000개).</li></ul></li><li><strong>서쪽 야영지</strong>와 <strong>미믹</strong>: 소모품과 경험치는 이 챕터 동안에만 얻을 수 있어요. 탈출한 뒤에는 신전이 닫혀요(\"전부 무너져서 다시 들어갈 수 없어.\").</li><li><strong>돌아올 수 없는 지점</strong>: 해적 야영지의 위쪽 문. 그 뒤로는 화산을 빠져나갈 수 없어요. 카마소츠에게 진 뒤 다리 끝에 나타나는 푸른 빛만 예외예요.</li><li><strong>조각된 여우</strong>(선택): 쿠슈탈 서쪽에서 바르브외가 돌 밑에 끼인 작은 조각상을 바로 세워요. 당장 보상은 없어요(조각상은 엔딩 이후에 받아요).</li><li><strong>업적</strong>:<ul><li>\"술집?\"은 1~5장 클리어 업적 다섯 개를 모두 가지고 있으면 엔딩 크레딧이 시작될 때 해금돼요. 6장에는 따로 업적이 없어요.</li><li>\"빛을 본 사나이\": 횃불을 전부 사기. 케르윈과의 전투도 열려요.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "6장 현행범 놓치지 말 것 놓치지 말 것 빨간 보석 (볼론 티쿠의 두 번째 보석) , 쿠슈탈의 화덕: 이게 없으면 이야기가 진행되지 않아요. 일지 5번 (쿠슈탈의 비석)과 연구 일지 (신전 동쪽 야영지). 업적 \"어차피 난 글 못 읽어\"의 일지 7권 중 두 권이에요. 쿠슈탈의 신성한 비취 (숨김): 석판 방에서 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 을 이어서 밟으세요. 4번 석판을 연달아 밟으려면 내려갔다가 다시 올라서세요. 문이 열려 있든 아니든 돼요. 방 서쪽, 큰 회색 석판과 초록 석판 사이에 있는 뱀 머리의 눈에 빛이 나타나요. 위로 걸어가면 비취를 주워요. 효과: 비취는 인벤토리에 들어가지 않고 스킬을 영구히 해금해요(\"스킬 해금: 특제 돌멩이 던지기\"). 멍청이들의 돌멩이 던지기가 피해 8 + 공격의 절반 - 대상의 방어가 되고, 1/2 확률로 다른 적에게 튕겨요. 비취가 없으면 다리의 설교자가 나무라요. 놓쳤다면: 챕터가 끝날 때 신전이 무너지지만, 나중에 쿠슈탈 아레나 상점에서 비취를 살 수 있어요(토큰 1000개). 서쪽 야영지 와 미믹 : 소모품과 경험치는 이 챕터 동안에만 얻을 수 있어요. 탈출한 뒤에는 신전이 닫혀요(\"전부 무너져서 다시 들어갈 수 없어.\"). 돌아올 수 없는 지점 : 해적 야영지의 위쪽 문. 그 뒤로는 화산을 빠져나갈 수 없어요. 카마소츠에게 진 뒤 다리 끝에 나타나는 푸른 빛만 예외예요. 조각된 여우 (선택): 쿠슈탈 서쪽에서 바르브외가 돌 밑에 끼인 작은 조각상을 바로 세워요. 당장 보상은 없어요(조각상은 엔딩 이후에 받아요). 업적 : \"술집?\"은 1~5장 클리어 업적 다섯 개를 모두 가지고 있으면 엔딩 크레딧이 시작될 때 해금돼요. 6장에는 따로 업적이 없어요. \"빛을 본 사나이\": 횃불을 전부 사기. 케르윈과의 전투도 열려요.", "sol": 0}]}]}]};

    copier: "Copiar link", copie: "Link copiado", selection: "Selecionado: Ctrl+C", solution: "Mostrar a solução",

    compte: n => `${n} resultado${n > 1 ? "s" : ""}`, pastilles: "Clique em um número para ver o que é.", chapitres: "Capítulos",
  },
  ja: {
    recherche: "クエスト・場所・謎を検索…", toutes: "すべての解答を表示", sommaire: "目次",
    copier: "リンクをコピー", copie: "コピーしました", selection: "選択中：Ctrl+C", solution: "解答を表示",
    contient: "検索語を含む", vide: "該当する項目がありません。別の言葉（場所・人物・アイテム）で試してください。",

  },
  zh: {

    copier: "复制链接", copie: "链接已复制", selection: "已选中：Ctrl+C", solution: "显示解答",
    contient: "包含搜索内容", vide: "没有匹配的条目。换个词试试（地点、角色、物品）。",

  },
  ko: {
    recherche: "퀘스트, 장소, 수수께끼 검색…", toutes: "모든 해답 보기", sommaire: "목차",
    copier: "링크 복사", copie: "링크 복사됨", selection: "선택됨: Ctrl+C", solution: "해답 보기",
    contient: "검색어 포함", vide: "일치하는 항목이 없습니다. 다른 단어(장소, 인물, 아이템)로 검색해 보세요.",
    compte: n => `${n}개 결과`, pastilles: "번호를 누르면 무엇인지 볼 수 있습니다.", chapitres: "장",

};
// Mot qui ouvre une solution masquee, par langue.
const MOT_SOLUTION = { fr: "Solution", en: "Solution", de: "Lösung", es: "Solución", pt: "Solução", ja: "解答", zh: "解答", ko: "해답" };
// Lien vers la page d'accueil (hub) des soluces.
const ACCUEIL = { fr: "Accueil", en: "Home", de: "Start", es: "Inicio", pt: "Início", ja: "トップ", zh: "首页", ko: "홈" };

// Langue : ?lang= dans l'adresse, sinon le dernier choix, sinon celle du navigateur.
function choisirLangue() {
  const p = new URLSearchParams(location.search).get("lang");
  if (p && DATA[p]) return p;
  try { const s = localStorage.getItem(CLE_LANGUE); if (s && DATA[s]) return s; } catch (e) {}
  const nav = (navigator.language || "").slice(0, 2).toLowerCase();
  // pt-PT, zh-TW... : la seule variante disponible.
  if (DATA[nav]) return nav;
  if (nav !== "fr" && DATA.en) return "en";
  return DATA.fr ? "fr" : LANGUES[0];
}
let langue = choisirLangue();
const T = () => TXT[langue] || TXT.fr;

const DIACRITIQUES = new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g");
const fold1 = c => { const f = c.normalize("NFD").replace(DIACRITIQUES, "").toLowerCase(); return f.length === 1 ? f : c.toLowerCase(); };
const fold = s => Array.from(s, fold1).join("");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function construire() {
  const main = document.getElementById("contenu");
  const nav = document.getElementById("sommaire");
  let h = "", n = "";
  const chapitres = DATA[langue];
  for (const c of chapitres) {
    h += `<section class="chapitre" id="${c.id}" data-chap="${c.id}"><header><div class="num">${esc(c.num)}</div><h2>${esc(c.titre || c.num)}</h2></header>`;
    if (c.intro) h += `<div class="chap-intro">${c.intro}</div>`;
    n += `<details data-chap="${c.id}"${c === chapitres[0] ? " open" : ""}><summary><span class="n">${esc(c.num.replace(/^(Chapitre|Chapter|Kapitel|Capítulo) /, "Ch. "))}</span>${esc(c.titre || "")}</summary><ul>`;
    for (const s of c.sections) {
      h += `<div class="section"><h3>${esc(s.titre)}</h3>${s.intro ? `<div class="chap-intro">${s.intro}</div>` : ""}`;
      n += `<li class="sec-li"><a class="sec" tabindex="-1">${esc(s.titre)}</a></li>`;
      for (const e of s.entrees) {
        h += `<article class="fiche" id="${e.id}" data-texte="${esc(fold(e.texte))}"><div class="fiche-tete"><h4>${esc(e.titre)}</h4><button type="button" class="lien" data-id="${e.id}">${T().copier}</button></div><div class="fiche-corps">${e.html}</div></article>`;
        n += `<li data-ref="${e.id}"><a href="#${e.id}">${esc(e.titre)}</a></li>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
    n += `</ul></details>`;
  }
  main.innerHTML = h + `<p class="vide" id="vide" hidden>${T().vide}</p>`;
  nav.innerHTML = n;
  main.querySelectorAll("img[data-img]").forEach(im => { if (IMAGES[im.dataset.img]) im.src = IMAGES[im.dataset.img]; });
  main.querySelectorAll("figure.capture .carte").forEach(c => {
    const cap = c.parentElement.querySelector("figcaption");
    if (cap && !cap.querySelector(".indice-pastilles")) { const s = document.createElement("span"); s.className = "indice-pastilles"; s.textContent = T().pastilles; cap.append(s); }
  });
}

// Pastilles des cartes : un clic affiche la ligne de legende du numero.
function fermerBulles(sauf) {
  document.querySelectorAll(".bulle").forEach(b => { if (b !== sauf) b.remove(); });
  document.querySelectorAll(".pastille.active").forEach(p => { if (!sauf || p !== sauf.pastille) p.classList.remove("active"); });
}
function montrerBulle(p) {
  const hote = p.closest(".carte, .vcarte");
  if (p.classList.contains("active")) { fermerBulles(); return; }
  fermerBulles();
  const b = document.createElement("div");
  b.className = "bulle";
  b.innerHTML = `<b>${esc(p.dataset.n)}.</b>${esc(p.dataset.t)}`;
  const x = parseFloat(p.style.left), y = parseFloat(p.style.top), ecart = Math.round(p.offsetWidth / 2) + 6;
  b.style.left = Math.min(Math.max(x, 12), 88) + "%";
  if (y > 30) { b.style.bottom = `calc(${100 - y}% + ${ecart}px)`; } else { b.style.top = `calc(${y}% + ${ecart}px)`; }
  b.style.transform = "translateX(-50%)";
  b.pastille = p;
  p.classList.add("active");
  hote.append(b);
}

// Une solution commence par un gras « Solution… ». On la cache, avec la
// liste d'etapes qui la suit (paragraphe) ou qu'elle contient (element de liste).
function masquerSolutions(root) {
  const mot = MOT_SOLUTION[langue] || "Solution";
  const forts = Array.from(root.querySelectorAll(".fiche-corps strong")).filter(s => s.textContent.trim().startsWith(mot) && !s.closest(".sol"));
  for (const fort of forts) {
    const hote = fort.parentElement;
    if (!hote || !(hote.tagName === "P" || hote.tagName === "LI")) continue;
    if (hote.firstChild !== fort && hote.firstChild.textContent.trim() !== "") continue;
    const brut = fort.textContent.trim();
    const m = brut.slice(mot.length).match(/^\s*([^:：]*?)\s*[:：]\s*(.*)$/);
    let precision = "", resteFort = "";
    if (m) { precision = m[1].replace(/^[,(]\s*|\s*\)$/g, "").trim(); resteFort = m[2]; }
    const det = document.createElement("details");
    det.className = "sol";
    const sum = document.createElement("summary");
    sum.textContent = T().solution + (precision ? " (" + precision + ")" : "");
    sum.dataset.contient = T().contient;
    const corps = document.createElement("div");
    corps.className = "sol-corps";
    det.append(sum, corps);
    const p = document.createElement("p");
    if (resteFort) { const b = document.createElement("strong"); b.textContent = resteFort; p.append(b); }
    fort.remove();
    // Texte de la solution : tout ce qui suit le gras, jusqu'a une liste imbriquee.
    while (hote.firstChild) {
      const n = hote.firstChild;
      if (n.nodeType === 1 && /^(OL|UL)$/.test(n.tagName)) break;
      p.append(n);
    }
    if (p.textContent.replace(/^[\s:,.]+/, "").trim()) {
      if (p.firstChild && p.firstChild.nodeType === 3) p.firstChild.nodeValue = p.firstChild.nodeValue.replace(/^[\s:]+/, "");
      corps.append(p);
    }
    if (hote.tagName === "LI") {
      while (hote.firstChild) corps.append(hote.firstChild);
      hote.append(det);
    } else {
      // Captures qui suivent (autant qu'il y en a) et au plus une liste d'etapes.
      let suivant = hote.nextElementSibling, liste = false;
      while (suivant && (suivant.matches("figure.capture") || (!liste && /^(OL|UL)$/.test(suivant.tagName)))) {
        if (suivant.tagName !== "FIGURE") liste = true;
        const apres = suivant.nextElementSibling;
        corps.append(suivant);
        suivant = apres;
      }
      hote.replaceWith(det);
    }
  }
}

function nettoyerMarques(root) {
  root.querySelectorAll("mark").forEach(m => { const t = document.createTextNode(m.textContent); m.replaceWith(t); });
  root.normalize();
}

function surligner(root, termes) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentNode.closest("button") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const noeuds = [];
  while (walker.nextNode()) noeuds.push(walker.currentNode);
  for (const nd of noeuds) {
    const txt = nd.nodeValue, f = fold(txt);
    const zones = [];
    for (const t of termes) {
      let i = f.indexOf(t);
      while (i !== -1) { zones.push([i, i + t.length]); i = f.indexOf(t, i + t.length); }
    }
    if (!zones.length) continue;
    zones.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [a, b] of zones) {
      if (a < pos) continue;
      frag.appendChild(document.createTextNode(txt.slice(pos, a)));
      const m = document.createElement("mark"); m.textContent = txt.slice(a, b); frag.appendChild(m);
      pos = b;
    }
    frag.appendChild(document.createTextNode(txt.slice(pos)));
    nd.replaceWith(frag);
  }
}

function filtrer() {
  const main = document.getElementById("contenu");
  const q = fold(document.getElementById("q").value.trim());
  const termes = q.split(/\s+/).filter(t => t.length > 1);
  nettoyerMarques(main);
  main.querySelectorAll(".sol.contient").forEach(d => d.classList.remove("contient"));
  let visibles = 0;
  for (const f of main.querySelectorAll(".fiche")) {
    const ok = !termes.length || termes.every(t => f.dataset.texte.includes(t));
    f.hidden = !ok;
    if (ok) visibles++;
    const li = document.querySelector(`#sommaire li[data-ref="${f.id}"]`);
    if (li) li.classList.toggle("cache", !ok);
  }
  for (const s of main.querySelectorAll(".section")) s.hidden = !s.querySelector(".fiche:not([hidden])");
  for (const c of main.querySelectorAll(".chapitre")) {
    c.hidden = !c.querySelector(".fiche:not([hidden])");
    const intro = c.querySelector(":scope > .chap-intro");
    if (intro) intro.hidden = termes.length > 0;
  }
  document.querySelectorAll("#sommaire details").forEach(d => {
    const vis = d.querySelector("li[data-ref]:not(.cache)");
    d.hidden = !vis;
    if (termes.length) d.open = !!vis;
  });
  document.querySelectorAll("#sommaire .sec-li").forEach(li => {
    let n = li.nextElementSibling, vis = false;
    while (n && !n.classList.contains("sec-li")) { if (!n.classList.contains("cache")) vis = true; n = n.nextElementSibling; }
    li.classList.toggle("cache", !vis);
  });
  document.getElementById("vide").hidden = visibles > 0;
  document.getElementById("compte").textContent = termes.length ? T().compte(visibles) : "";
  if (termes.length) {
    for (const f of main.querySelectorAll(".fiche:not([hidden])")) {
      surligner(f, termes);
      f.querySelectorAll(".sol:not([open])").forEach(d => { if (d.querySelector("mark")) d.classList.add("contient"); });
    }
  }
}

function toutesSolutions(v) {
  document.querySelectorAll(".sol").forEach(d => d.open = v);
}

function allerA(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.hidden || (el.closest("[hidden]"))) { document.getElementById("q").value = ""; filtrer(); }
  const chap = el.closest(".chapitre");
  if (chap) { const d = document.querySelector(`#sommaire details[data-chap="${chap.dataset.chap}"]`); if (d) d.open = true; }
  el.scrollIntoView({ block: "start" });
  if (el.classList.contains("fiche")) {
    el.classList.add("eclat");
    setTimeout(() => el.classList.remove("eclat"), 1800);
  }
}

// Version artefact : lien claude.ai fixe. Version autonome : l'adresse ou la page est hebergee
// (rien a copier si le fichier est ouvert depuis le disque).
function baseLiens() {
  if (BASE) return BASE;
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : "";
}

function copierLien(btn) {
  const id = btn.dataset.id;
  const url = baseLiens() + (LANGUES.length > 1 ? "?lang=" + langue : "") + "#" + id;
  const fiche = btn.closest(".fiche");
  const done = () => { btn.textContent = T().copie; setTimeout(() => btn.textContent = T().copier, 1600); };
  const montrer = () => {
    let z = fiche.querySelector(".lien-zone");
    if (!z) { z = document.createElement("input"); z.className = "lien-zone"; z.readOnly = true; fiche.querySelector(".fiche-tete").after(z); }
    z.value = url; z.select(); btn.textContent = T().selection;
  };
  try { navigator.clipboard.writeText(url).then(done, montrer); } catch (e) { montrer(); }
}

function appliquerTextes() {
  const t = T(), pick = o => (o && (o[langue] || o.fr)) || "";
  document.documentElement.lang = langue;
  if (pick(CONFIG.titre)) document.title = pick(CONFIG.titre);
  if (pick(CONFIG.marque)) document.getElementById("marque").textContent = pick(CONFIG.marque);
  if (pick(CONFIG.sous_titre)) document.getElementById("sous-titre").textContent = pick(CONFIG.sous_titre);
  document.getElementById("q").placeholder = t.recherche;
  document.getElementById("txt-toutes").textContent = t.toutes;
  document.getElementById("btn-sommaire").textContent = t.sommaire;
  document.getElementById("sommaire").setAttribute("aria-label", t.sommaire);
  document.querySelectorAll("#langues button").forEach(b => b.setAttribute("aria-pressed", b.dataset.langue === langue ? "true" : "false"));
  const nc = document.getElementById("chapitres");
  if (CONFIG.pages && CONFIG.pages.length > 1) {
    nc.setAttribute("aria-label", t.chapitres);
    nc.innerHTML = (CONFIG.accueil ? `<a class="accueil" href="${esc(CONFIG.accueil)}?lang=${langue}">⌂ ${esc(ACCUEIL[langue] || ACCUEIL.fr)}</a>` : "")
      + CONFIG.pages.map((pg, i) => `<a href="${esc(pg.href)}?lang=${langue}"${i === CONFIG.page ? ' aria-current="page"' : ""}>${esc(pick(pg.titre))}</a>`).join("");
    nc.hidden = false;
  }
  document.querySelectorAll("figcaption .indice-pastilles").forEach(s => s.textContent = t.pastilles);
}

function rendre() {
  construire();
  masquerSolutions(document.getElementById("contenu"));
  if (box.checked) toutesSolutions(true);
  filtrer();
}

// Changement de langue : meme fiche en haut de l'ecran (les identifiants sont communs aux langues).
function changerLangue(l) {
  if (l === langue || !DATA[l]) return;
  const haut = document.querySelector(".entete").getBoundingClientRect().bottom;
  const ancre = Array.from(document.querySelectorAll(".fiche:not([hidden])")).find(f => f.getBoundingClientRect().bottom > haut + 8);
  langue = l;
  try { localStorage.setItem(CLE_LANGUE, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    if (u.searchParams.has("lang")) { u.searchParams.set("lang", l); history.replaceState(null, "", u); }
  } catch (e) {}
  appliquerTextes();
  rendre();
  if (ancre && window.scrollY > 0) { const el = document.getElementById(ancre.id); if (el) el.scrollIntoView({ block: "start", behavior: "instant" }); }
}

const box = document.getElementById("toutes");
let pref = false;
try { pref = localStorage.getItem(CLE) === "1"; } catch (e) {}
box.checked = pref;
if (LANGUES.length > 1) {
  const zone = document.getElementById("langues");
  zone.innerHTML = LANGUES.map(l => `<button type="button" data-langue="${l}" lang="${l}">${l.toUpperCase()}</button>`).join("");
  zone.hidden = false;
  zone.addEventListener("click", e => { const b = e.target.closest("button[data-langue]"); if (b) changerLangue(b.dataset.langue); });
}
appliquerTextes();
rendre();
if (!baseLiens()) document.body.classList.add("sans-liens");
box.addEventListener("change", () => { toutesSolutions(box.checked); try { localStorage.setItem(CLE, box.checked ? "1" : "0"); } catch (e) {} });

let minuteur;
document.getElementById("q").addEventListener("input", () => { clearTimeout(minuteur); minuteur = setTimeout(filtrer, 120); });
document.getElementById("contenu").addEventListener("click", e => {
  const b = e.target.closest(".lien"); if (b) copierLien(b);
  const p = e.target.closest(".pastille");
  if (p) { montrerBulle(p); return; }
  const z = e.target.closest(".zoom");
  if (z) {
    fermerBulles();
    const v = document.getElementById("visionneuse"), vc = document.getElementById("vcarte");
    vc.querySelectorAll(".couche, .bulle").forEach(x => x.remove());
    vc.querySelector("img").src = z.querySelector("img").src;
    const couche = z.parentElement.querySelector(".couche");
    if (couche) vc.append(couche.cloneNode(true));
    v.hidden = false;
    return;
  }
  if (!e.target.closest(".bulle")) fermerBulles();
});
document.getElementById("visionneuse").addEventListener("click", e => {
  const p = e.target.closest(".pastille");
  if (p) { e.stopPropagation(); montrerBulle(p); return; }
  fermerBulles(); e.currentTarget.hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { fermerBulles(); document.getElementById("visionneuse").hidden = true; } });
document.getElementById("sommaire").addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  try { history.replaceState(null, "", "#" + id); } catch (err) {}
  allerA(id);
  if (window.matchMedia("(max-width: 860px)").matches) document.getElementById("sommaire").classList.remove("ouvert");
});
document.getElementById("btn-sommaire").addEventListener("click", () => document.getElementById("sommaire").classList.toggle("ouvert"));
window.addEventListener("hashchange", () => allerA(location.hash.slice(1)));
if (location.hash.length > 1) setTimeout(() => allerA(location.hash.slice(1)), 50);
</script>
