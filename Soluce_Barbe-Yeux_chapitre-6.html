/* Mise en page : en-tete collant avec la recherche, sommaire a gauche (replie sur telephone), fiches a droite. */
:root {
  --bg: #edf1ee; --surface: #fbfcfb; --fg: #17201c; --muted: #58675f; --line: #d4ddd7;
  --jade: #17765e; --jade-soft: #dcefe7; --or: #9a6a10; --or-soft: #f6ead0; --mark: #ffe08a;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161f1b; --fg: #e3ece7; --muted: #9aaba2; --line: #29362f;
  --jade: #52c9a4; --jade-soft: #173a30; --or: #e4b85a; --or-soft: #3a2f17; --mark: #8a6d10;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--jade); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.entete-in { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.marque { font-family: var(--display); font-weight: 800; font-size: 1.45rem; margin: 0; line-height: 1.1; }
.marque small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.recherche { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.recherche input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1rem; outline: none; }
.recherche:focus-within { border-color: var(--jade); }
.compte { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bascule { display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); cursor: pointer; user-select: none; }
.bascule input { accent-color: var(--jade); width: 18px; height: 18px; }
.page { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 80px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; align-items: start; }
.sommaire { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 110px); overflow-y: auto; font-size: .93rem; padding-right: 6px; }
.sommaire details { border-bottom: 1px solid var(--line); padding-block: 6px; }
.sommaire summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 1.02rem; list-style: none; padding: 4px 0; }
.sommaire summary::-webkit-details-marker { display: none; }
.sommaire summary .n { color: var(--jade); margin-right: 6px; }
.sommaire ul { list-style: none; margin: 4px 0 8px; padding: 0 0 0 10px; display: grid; gap: 2px; }
.sommaire li a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
.sommaire li a:hover, .sommaire li a:focus-visible { background: var(--jade-soft); }
.sommaire li a.sec { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 8px; pointer-events: none; }
.sommaire li.cache { display: none; }
main { min-width: 0; display: grid; gap: 40px; }
.chapitre { display: grid; gap: 18px; }
.chapitre > header { border-bottom: 2px solid var(--jade); padding-bottom: 8px; }
.chapitre .num { color: var(--jade); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.chapitre h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 2px 0 0; text-wrap: balance; line-height: 1.15; }
.chap-intro { color: var(--muted); max-width: 72ch; }
.section { display: grid; gap: 14px; }
.section > h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--muted); margin: 6px 0 0; letter-spacing: .02em; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px); }
.fiche.eclat { box-shadow: 0 0 0 3px var(--jade); }
.fiche-tete { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.fiche h4 { font-family: var(--display); font-weight: 700; font-size: 1.28rem; margin: 0; text-wrap: balance; }
.lien { font: inherit; font-size: .82rem; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.lien:hover { color: var(--jade); border-color: var(--jade); }
.fiche-corps { max-width: 78ch; }
.fiche-corps p { margin: .6em 0; }
.fiche-corps h5 { font-family: var(--display); font-size: 1.05rem; margin: 1.1em 0 .2em; }
.fiche-corps ol, .fiche-corps ul { padding-left: 1.4em; margin: .5em 0; }
.fiche-corps li { margin: .25em 0; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); margin: .7em 0; }
.note p { margin: .3em 0; }
.sol { background: var(--or-soft); border: 1px solid color-mix(in srgb, var(--or) 45%, transparent); border-radius: 10px; margin: .7em 0; }
.sol summary { cursor: pointer; padding: 8px 12px; font-weight: 700; color: var(--or); list-style: none; }
.sol summary::-webkit-details-marker { display: none; }
.sol summary::before { content: "▸ "; }
.sol[open] summary::before { content: "▾ "; }
.sol[open] summary { border-bottom: 1px solid color-mix(in srgb, var(--or) 30%, transparent); }
.sol .sol-corps { padding: 4px 14px 8px; }
.sol.contient summary::after { content: " · " attr(data-contient); font-weight: 400; font-size: .85rem; }
.langues { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.langues button { font: inherit; font-size: .85rem; font-weight: 700; letter-spacing: .04em; padding: 3px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.langues button[aria-pressed="true"] { background: var(--jade); color: var(--surface); }
.tab { overflow-x: auto; margin: .7em 0; }
.capture { margin: .9em 0; }
.capture .zoom { display: block; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); cursor: zoom-in; max-width: 100%; }
.capture img { display: block; max-width: 100%; height: auto; }
.capture figcaption { font-size: .88rem; color: var(--muted); margin-top: 6px; }
.visionneuse { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 10, .92); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.visionneuse[hidden] { display: none; }
.visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.carte { position: relative; }
.carte .zoom { width: 100%; }
.couche { position: absolute; inset: 0; pointer-events: none; }
.pastille { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer; pointer-events: auto; }
.pastille:hover, .pastille:focus-visible, .pastille.active { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--jade); outline: none; }
.bulle { position: absolute; z-index: 6; width: max-content; max-width: min(320px, 86%); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: .92rem; line-height: 1.35; box-shadow: 0 8px 22px rgba(0,0,0,.28); pointer-events: none; }
.bulle b { color: var(--jade); margin-right: 4px; }
.indice-pastilles { display: block; font-style: italic; margin-top: 2px; }
.vcarte { position: relative; display: inline-block; cursor: default; }
.vcarte img { display: block; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); }
.chapitres { max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
.chapitres[hidden] { display: none; }
.chapitres a { font-size: .86rem; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; background: var(--bg); }
.chapitres a:hover { color: var(--jade); border-color: var(--jade); }
.chapitres a[aria-current] { background: var(--jade); color: var(--surface); border-color: var(--jade); }
.chapitres a.accueil { font-weight: 700; color: var(--fg); }
table { border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--jade-soft); }
code { font-size: .92em; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.vide { color: var(--muted); padding: 30px 0; }
.lien-zone { width: 100%; margin-top: 8px; font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.sommaire-mobile { display: none; }
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; gap: 18px; }
  .sommaire { position: static; max-height: none; display: none; }
  .sommaire.ouvert { display: block; }
  .sommaire-mobile { display: inline-flex; font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chapitre h2 { font-size: 1.6rem; }
  .fiche { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script>
// DATA : { langue: [chapitres] }. CONFIG : lien de base (artefact) et titres par langue.
const DATA = {"fr": [{"id": "c6", "num": "Chapitre 6", "titre": "Flagrant Délit", "intro": "<p>Le Roi des crabes, rebaptisé Znippy, a rejoint l'équipage. Il faut retrouver Itzel et empêcher Nadaillac d'ouvrir la porte des Bolon Tiku. Le chemin passe par une cellule de prison, par l'île perdue de Kuxtal, puis par le temple enfoui sous l'île du volcan.</p><aside class=\"note\"><p>Note : le carton « Chapitre 6 — Flagrant Délit » n'apparaît qu'au moment de l'arrestation. Les deux premiers objectifs ci-dessous se jouent avant lui.</p></aside>", "sections": [{"titre": "Quête principale", "intro": "", "entrees": [{"titre": "Élaborer un plan (à la taverne de l'île au crabe).", "html": "<ol><li>Après avoir recruté le Roi des crabes, entre dans la taverne de l'Île au crabe.</li><li>Scène automatique : Barbe-Yeux, les deux cons et Znippy font le point. Barbe-Yeux comprend que le vieux prisonnier de Nassau (celui qui « sent la pisse ») vient de Kuxtal.</li><li>Ses PV et son énergie sont remis au maximum. Nouvel objectif : se faire arrêter pour lui parler.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "Chapitre 6 Flagrant Délit Quête principale Élaborer un plan (à la taverne de l'île au crabe). Après avoir recruté le Roi des crabes, entre dans la taverne de l'Île au crabe. Scène automatique : Barbe-Yeux, les deux cons et Znippy font le point. Barbe-Yeux comprend que le vieux prisonnier de Nassau (celui qui « sent la pisse ») vient de Kuxtal. Ses PV et son énergie sont remis au maximum. Nouvel objectif : se faire arrêter pour lui parler.", "sol": 0}, {"titre": "Trouver un moyen de se faire arrêter.", "html": "<p>Trois pistes sont possibles. <strong>Une seule fonctionne : brûler la boutique de Kerwin.</strong></p><ol><li><strong>Les gardes du musée de Nassau</strong> (facultatif, une seule fois) : approche Marcel et Poulichard devant le musée, de jour comme de nuit. Barbe-Yeux les provoque, un combat s'engage. Particularité : le Con - Roi des Sangliers passe dans le camp adverse dès le premier tour, le Con - Olympien le rejoint au deuxième. Ils attaquent à la rame (l'Olympien ne rate jamais, le Roi des Sangliers peut rater). Gagné ou perdu, la scène continue de la même façon. Les gardes refusent de t'arrêter, mais une victoire rapporte beaucoup d'XP. L'objectif ne change pas : c'est une fausse piste.</li><li><strong>Le braquage de taverne</strong> (facultatif, une seule fois) : la première taverne où tu entres (Île au crabe, Île aux singes, Nassau ou Île au vent) donne une petite scène de hold-up. Personne n'appelle la garde, puis le menu normal de la taverne s'ouvre.</li><li><strong>La boutique de torches de Kerwin</strong> (Île aux singes, Île au vent ou Nassau) : parle au vendeur. Un menu s'ouvre :<ul><li>« Partir » : tu repars, la scène reviendra à la prochaine visite.</li><li>« S'excuser et acheter une torche » : boutique normale.</li><li><strong>« Tout cramer »</strong> : la boutique prend feu.</li></ul></li></ol><p><strong>Solution :</strong> chez Kerwin, choisis <strong>« Tout cramer »</strong>.</p><p>Ensuite :</p><ul><li>Le carton du chapitre 6 apparaît, puis Barbe-Yeux se réveille en cellule avec le vieux prisonnier.</li><li>Le vieux confirme qu'Itzel vient de Kuxtal et inscrit l'emplacement de l'île sur ta carte.</li><li>Un garde te libère : la boutique n'était pas homologuée. La carte du monde s'ouvre directement depuis la prison. La seule destination proposée est Kuxtal.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "Chapitre 6 Flagrant Délit Quête principale Trouver un moyen de se faire arrêter. Trois pistes sont possibles. Une seule fonctionne : brûler la boutique de Kerwin. Les gardes du musée de Nassau (facultatif, une seule fois) : approche Marcel et Poulichard devant le musée, de jour comme de nuit. Barbe-Yeux les provoque, un combat s'engage. Particularité : le Con - Roi des Sangliers passe dans le camp adverse dès le premier tour, le Con - Olympien le rejoint au deuxième. Ils attaquent à la rame (l'Olympien ne rate jamais, le Roi des Sangliers peut rater). Gagné ou perdu, la scène continue de la même façon. Les gardes refusent de t'arrêter, mais une victoire rapporte beaucoup d'XP. L'objectif ne change pas : c'est une fausse piste. Le braquage de taverne (facultatif, une seule fois) : la première taverne où tu entres (Île au crabe, Île aux singes, Nassau ou Île au vent) donne une petite scène de hold-up. Personne n'appelle la garde, puis le menu normal de la taverne s'ouvre. La boutique de torches de Kerwin (Île aux singes, Île au vent ou Nassau) : parle au vendeur. Un menu s'ouvre : « Partir » : tu repars, la scène reviendra à la prochaine visite. « S'excuser et acheter une torche » : boutique normale. « Tout cramer » : la boutique prend feu. Solution : chez Kerwin, choisis « Tout cramer » . Ensuite : Le carton du chapitre 6 apparaît, puis Barbe-Yeux se réveille en cellule avec le vieux prisonnier. Le vieux confirme qu'Itzel vient de Kuxtal et inscrit l'emplacement de l'île sur ta carte. Un garde te libère : la boutique n'était pas homologuée. La carte du monde s'ouvre directement depuis la prison. La seule destination proposée est Kuxtal.", "sol": 1}, {"titre": "Se rendre à Kuxtal.", "html": "<ol><li>Sur la carte du monde, navigue jusqu'à Kuxtal.</li><li>Pas de musique sur l'île, seulement le vent et la mer. À l'arrivée, le groupe discute (scène automatique).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "Chapitre 6 Flagrant Délit Quête principale Se rendre à Kuxtal. Sur la carte du monde, navigue jusqu'à Kuxtal. Pas de musique sur l'île, seulement le vent et la mer. À l'arrivée, le groupe discute (scène automatique).", "sol": 0}, {"titre": "Explorer les ruines de Kuxtal.", "html": "<ol><li>Va au <strong>foyer</strong>, au centre-nord de l'île (au nord du point de débarquement, vers le milieu). Interagis avec lui.</li><li>Un feu a été étouffé et un tissu taché de sang est noué à un bâton. Tu obtiens la <strong>2ème gemme des Bolon Tiku</strong> (la gemme rouge qu'Itzel avait sur elle).</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "Chapitre 6 Flagrant Délit Quête principale Explorer les ruines de Kuxtal. Va au foyer , au centre-nord de l'île (au nord du point de débarquement, vers le milieu). Interagis avec lui. Un feu a été étouffé et un tissu taché de sang est noué à un bâton. Tu obtiens la 2ème gemme des Bolon Tiku (la gemme rouge qu'Itzel avait sur elle).", "sol": 0}, {"titre": "Découvrir le passé de Kuxtal.", "html": "<p>Lis les quatre stèles (« Lire »), dans n'importe quel ordre. Le compteur « Stèles lues : x / 4 » s'affiche sous l'objectif.</p><div class=\"tab\"><table><thead><tr><th>Stèle</th><th>Où la trouver</th></tr></thead><tbody><tr><td>Stèle 1</td><td>À l'est, près du grand arbre sacré</td></tr><tr><td>Stèle 2</td><td>Au sud-ouest, près de la côte sud</td></tr><tr><td>Stèle 3</td><td>Au nord-ouest</td></tr><tr><td>Stèle 4</td><td>Au nord-est</td></tr></tbody></table></div><ul><li>La première stèle lue te donne le <strong>Journal n°5</strong>. Chaque stèle suivante y ajoute une entrée, toujours rangée dans l'ordre du récit.</li><li>Tu peux lire les stèles avant d'avoir visité le foyer. La conclusion n'arrive qu'une fois les deux faits.</li><li>Quand tout est lu et le journal refermé, Barbe-Yeux conclut. L'<strong>île du volcan</strong> apparaît sur la carte du monde.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "Chapitre 6 Flagrant Délit Quête principale Découvrir le passé de Kuxtal. Lis les quatre stèles (« Lire »), dans n'importe quel ordre. Le compteur « Stèles lues : x / 4 » s'affiche sous l'objectif. Stèle Où la trouver Stèle 1 À l'est, près du grand arbre sacré Stèle 2 Au sud-ouest, près de la côte sud Stèle 3 Au nord-ouest Stèle 4 Au nord-est La première stèle lue te donne le Journal n°5 . Chaque stèle suivante y ajoute une entrée, toujours rangée dans l'ordre du récit. Tu peux lire les stèles avant d'avoir visité le foyer. La conclusion n'arrive qu'une fois les deux faits. Quand tout est lu et le journal refermé, Barbe-Yeux conclut. L' île du volcan apparaît sur la carte du monde.", "sol": 0}, {"titre": "Se rendre sur l'île du volcan.", "html": "<ol><li>Navigue jusqu'à l'île du volcan. Dès que tu débarques, une scène automatique se lance : Nadaillac interpelle le groupe, Barbe-Yeux marche vers le temple et trébuche en chemin.</li><li>Cinématique : Nadaillac tient Itzel en joue et blesse un des cons. Znippy avoue que vous avez les gemmes, et Barbe-Yeux les échange contre Itzel. <strong>Toutes les gemmes des Bolon Tiku quittent ton inventaire.</strong> Nadaillac trahit aussitôt sa parole et lâche ses squelettes.</li><li><strong>Combat contre les squelettes de Nadaillac</strong> (5 squelettes). Ton groupe : Barbe-Yeux, le Con - Roi des Sangliers et le Roi des crabes, sans son ultime. Si tu perds, le combat recommence aussitôt avec PV et énergie pleins.</li><li>Cinématique du médaillon (impossible à passer). Le temple se réveille, Znippy libère Itzel. Itzel rejoint le groupe et propose « une autre voie ».</li><li>Tu reprends la main dans le campement de pirates du temple (la Caldeira). À partir de là, le groupe te suit au complet : les deux cons, Itzel et Znippy.</li></ol><p>Pour repartir de l'île, prends la barque au sud de l'île (« Embarquer » / « Rester »).</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "Chapitre 6 Flagrant Délit Quête principale Se rendre sur l'île du volcan. Navigue jusqu'à l'île du volcan. Dès que tu débarques, une scène automatique se lance : Nadaillac interpelle le groupe, Barbe-Yeux marche vers le temple et trébuche en chemin. Cinématique : Nadaillac tient Itzel en joue et blesse un des cons. Znippy avoue que vous avez les gemmes, et Barbe-Yeux les échange contre Itzel. Toutes les gemmes des Bolon Tiku quittent ton inventaire. Nadaillac trahit aussitôt sa parole et lâche ses squelettes. Combat contre les squelettes de Nadaillac (5 squelettes). Ton groupe : Barbe-Yeux, le Con - Roi des Sangliers et le Roi des crabes, sans son ultime. Si tu perds, le combat recommence aussitôt avec PV et énergie pleins. Cinématique du médaillon (impossible à passer). Le temple se réveille, Znippy libère Itzel. Itzel rejoint le groupe et propose « une autre voie ». Tu reprends la main dans le campement de pirates du temple (la Caldeira). À partir de là, le groupe te suit au complet : les deux cons, Itzel et Znippy. Pour repartir de l'île, prends la barque au sud de l'île (« Embarquer » / « Rester »).", "sol": 0}, {"titre": "Trouver un passage au cœur du volcan.", "html": "<p><strong>1. Le camp de pirates (première salle du temple)</strong></p><ul><li>Tu entres par le bas de la salle. La porte qui mène plus loin est en haut, au centre.</li><li><strong>Camp est</strong> (au centre-droit, 6 pirates) : <strong>obligatoire</strong>. La victoire te donne le <strong>Journal de recherches</strong>, qui s'ouvre aussitôt, plus 3 bières et une Fricassée du Naufragé.</li><li><strong>Camp ouest</strong> (à gauche, 4 pirates) : facultatif. Il donne 2 bières et un Filet de poisson fameux.</li><li>Tant que tu n'as pas le Journal de recherches, la porte du haut reste fermée. Barbe-Yeux dit alors : « Ces pirates cachent quelque chose… ».</li><li>En passant la porte du haut, le jeu te demande une confirmation (« Vous entrez dans la phase finale… ») : <strong>c'est le point de non-retour</strong>. Si tu acceptes, la porte du bas de la salle des dalles ne ramène plus au camp, et la porte du temple, sur l'île, ne s'ouvre plus. Fais tes préparatifs avant (camp ouest, achats, soins).</li><li>Une fois passé le point de non-retour, tu peux encore revenir de la salle au trésor à la salle des dalles, mais pas du labyrinthe à la salle au trésor.</li><li><strong>Défaite dans le temple</strong> (camp, gardiens, Mimics, esprits) : tu te réveilles à la taverne de l'Île au crabe, PV et énergie pleins. Après le point de non-retour, <strong>sauvegarde avant chaque combat</strong> et recharge en cas de défaite : la porte du temple reste fermée depuis l'île.</li></ul><p><strong>2. La salle des dalles (deuxième salle, dans le noir)</strong> Tout le monde allume sa torche. La salle compte <strong>quatre dalles</strong> au sol et une fontaine au centre.</p><div class=\"tab\"><table><thead><tr><th>Dalle</th><th>Aspect</th><th>Emplacement</th></tr></thead><tbody><tr><td>1</td><td>Petite dalle grise</td><td>Nord-est</td></tr><tr><td>2</td><td>Moyenne dalle <strong>verte</strong></td><td>Ouest, dans la moitié basse</td></tr><tr><td>3</td><td>Moyenne dalle <strong>rose</strong></td><td>Est, dans la moitié basse</td></tr><tr><td>4</td><td>Grande dalle grise</td><td>Nord-ouest</td></tr></tbody></table></div><p><em>a) Les salles des gardiens.</em> Chaque fois que tu marches sur une dalle différente de la précédente, une des quatre salles du haut s'ouvre et <strong>deux gardiens</strong> t'attaquent. Il y a donc 4 combats en tout.</p><ul><li>Le premier gardien se téléporte devant sa cible et frappe une fois.</li><li>Le second enchaîne trois coups sur des cibles au hasard.</li></ul><p>Si tu perds, la salle n'est pas comptée et se rouvrira plus tard. Les gardiens, comme les Mimics et les esprits plus loin, frappent en priorité un con qui provoque (Roulade). Après le 4e combat, la fontaine centrale se remplit : « Se régénérer » remet PV et énergie au maximum, sans limite.</p><p><em>b) La porte.</em> Le Journal de recherches montre une suite de six masques. Chacun est accompagné d'un chiffre maya, de 1 à 6 points et barres, qui donne l'ordre. La couleur et la taille de chaque masque désignent une dalle : grand gris = dalle 4, vert = dalle 2, rose = dalle 3, petit gris = dalle 1.</p><p><strong>Solution :</strong> marche sur les dalles dans l'ordre <strong>4 – 2 – 3 – 4 – 3 – 1</strong>, c'est-à-dire : grande grise, verte, rose, grande grise, rose, petite grise.</p><ul><li>Seul un nouvel appui compte : une dalle reste enfoncée tant que quelqu'un est dessus, y compris un membre du groupe qui te suit.</li><li>Le jeu ne retient que les <strong>6 derniers appuis</strong>. Si tu te trompes, il suffit de recommencer la suite depuis le début.</li><li>Astuce : le bouton sablier, en bas à droite, passe en <strong>mode coopération</strong>. Barbe-Yeux, les deux cons et Itzel restent alors où ils sont, et tu en déplaces un seul à la fois. Znippy n'est pas jouable : il suit toujours Barbe-Yeux et peut enfoncer une dalle derrière lui. Le plus sûr : laisse Barbe-Yeux (et donc Znippy) loin des dalles, et fais la suite avec un con ou Itzel.</li><li>La bonne suite ouvre la porte du haut et regroupe l'équipe.</li></ul><p><strong>3. La salle au trésor (troisième salle)</strong></p><ul><li>30 coffres sont rangés en <strong>3 rangées de 10</strong> dans la grande salle du haut. Approche-toi d'un coffre et choisis « Ouvrir ».</li><li>Tous les coffres sauf un sont des <strong>Mimics</strong> : un seul ennemi, très résistant, qui mord trois cibles par tour. Fuite impossible. Chaque Mimic vaincu donne 1 à 3 consommables et beaucoup d'XP. Un coffre ouvert le reste : un Mimic perdu ne revient pas, et son butin est perdu.</li><li>Indice : en longeant le mur du haut, une lumière balaie lentement la salle. Elle révèle deux personnages gravés, chacun avec un chiffre maya vert : <strong>2 points</strong> (= 2) à gauche, <strong>une barre et 4 points</strong> (= 9) à droite.</li></ul><p><strong>Solution :</strong> ouvre le coffre de la <strong>2e rangée</strong> (celle du milieu), <strong>9e en partant de la gauche</strong> (l'avant-dernier à droite). Il ouvre la porte du fond, en haut au centre.</p><p><strong>4. Le labyrinthe des esprits (quatrième salle)</strong></p><ul><li>En entrant, tout devient noir. Des rires éclatent et des yeux s'allument dans l'obscurité (cinématique).</li><li>Itzel met son masque et <strong>prend la tête</strong>. Le chemin lumineux n'est visible qu'autour d'elle, au rythme d'un battement de cœur. Des spectres errent dans les couloirs, mais ils sont inoffensifs.</li><li>Groupe d'esprits <strong>obligatoire</strong> au centre de la salle, sur le chemin : Poom, Jo'oche' et Nikte'.<ul><li>Poom empoisonne tout le groupe.</li><li>Jo'oche' maudit un personnage par tour. La cible meurt quand Jo'oche' a rejoué 3 fois, sauf si Jo'oche' tombe avant. <strong>Tue Jo'oche' en premier.</strong></li><li>Nikte' pousse un cri qui blesse tout le groupe. Il frappe fort mais a peu de PV.</li></ul></li><li>Quatre autres groupes d'esprits, facultatifs, attendent dans les coins : nord-ouest, ouest, est et nord-est. Chaque esprit vaincu donne un consommable au hasard.</li><li><strong>Itinéraire</strong> : depuis l'entrée (en bas au centre), monte jusqu'au centre (combat). Pars ensuite vers l'ouest, serpente vers le nord jusqu'au couloir du nord-ouest, puis repars vers l'est. Redescends un peu, puis traverse vers l'est par un long couloir à mi-hauteur. Descends côté est, puis remonte toute la bordure est jusqu'en haut. Reviens enfin vers l'ouest jusqu'à la porte, en haut au centre.</li><li>La porte, en haut au centre, s'ouvre toute seule quand tu arrives devant.</li></ul><p><strong>5. Le pont (cinquième salle)</strong></p><ul><li>Plus d'obscurité : tout le monde suit de nouveau Barbe-Yeux. Monte le long pont vers le nord.</li><li><strong>Le vieux de la grotte</strong> (celui de l'Île aux singes) te barre la route (« VOUS… NE PASSEREZ… PAS ! »). Va à son contact : scène avec flashback, puis il te laisse passer. Contourne-le par sa droite.</li><li>Plus haut, <strong>le prédicateur</strong> de Morro-Blanco fait de même : scène, flashback, passage.</li><li>Tout en haut, à droite de la sortie, une <strong>fontaine</strong> propose « Se régénérer » (PV et énergie au maximum).</li><li><strong>Soigne-toi et prépare-toi ici</strong> : entrer dans la salle suivante enchaîne directement sur le boss final.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "Chapitre 6 Flagrant Délit Quête principale Trouver un passage au cœur du volcan. 1. Le camp de pirates (première salle du temple) Tu entres par le bas de la salle. La porte qui mène plus loin est en haut, au centre. Camp est (au centre-droit, 6 pirates) : obligatoire . La victoire te donne le Journal de recherches , qui s'ouvre aussitôt, plus 3 bières et une Fricassée du Naufragé. Camp ouest (à gauche, 4 pirates) : facultatif. Il donne 2 bières et un Filet de poisson fameux. Tant que tu n'as pas le Journal de recherches, la porte du haut reste fermée. Barbe-Yeux dit alors : « Ces pirates cachent quelque chose… ». En passant la porte du haut, le jeu te demande une confirmation (« Vous entrez dans la phase finale… ») : c'est le point de non-retour . Si tu acceptes, la porte du bas de la salle des dalles ne ramène plus au camp, et la porte du temple, sur l'île, ne s'ouvre plus. Fais tes préparatifs avant (camp ouest, achats, soins). Une fois passé le point de non-retour, tu peux encore revenir de la salle au trésor à la salle des dalles, mais pas du labyrinthe à la salle au trésor. Défaite dans le temple (camp, gardiens, Mimics, esprits) : tu te réveilles à la taverne de l'Île au crabe, PV et énergie pleins. Après le point de non-retour, sauvegarde avant chaque combat et recharge en cas de défaite : la porte du temple reste fermée depuis l'île. 2. La salle des dalles (deuxième salle, dans le noir) Tout le monde allume sa torche. La salle compte quatre dalles au sol et une fontaine au centre. Dalle Aspect Emplacement 1 Petite dalle grise Nord-est 2 Moyenne dalle verte Ouest, dans la moitié basse 3 Moyenne dalle rose Est, dans la moitié basse 4 Grande dalle grise Nord-ouest a) Les salles des gardiens. Chaque fois que tu marches sur une dalle différente de la précédente, une des quatre salles du haut s'ouvre et deux gardiens t'attaquent. Il y a donc 4 combats en tout. Le premier gardien se téléporte devant sa cible et frappe une fois. Le second enchaîne trois coups sur des cibles au hasard. Si tu perds, la salle n'est pas comptée et se rouvrira plus tard. Les gardiens, comme les Mimics et les esprits plus loin, frappent en priorité un con qui provoque (Roulade). Après le 4e combat, la fontaine centrale se remplit : « Se régénérer » remet PV et énergie au maximum, sans limite. b) La porte. Le Journal de recherches montre une suite de six masques. Chacun est accompagné d'un chiffre maya, de 1 à 6 points et barres, qui donne l'ordre. La couleur et la taille de chaque masque désignent une dalle : grand gris = dalle 4, vert = dalle 2, rose = dalle 3, petit gris = dalle 1. Solution : marche sur les dalles dans l'ordre 4 – 2 – 3 – 4 – 3 – 1 , c'est-à-dire : grande grise, verte, rose, grande grise, rose, petite grise. Seul un nouvel appui compte : une dalle reste enfoncée tant que quelqu'un est dessus, y compris un membre du groupe qui te suit. Le jeu ne retient que les 6 derniers appuis . Si tu te trompes, il suffit de recommencer la suite depuis le début. Astuce : le bouton sablier, en bas à droite, passe en mode coopération . Barbe-Yeux, les deux cons et Itzel restent alors où ils sont, et tu en déplaces un seul à la fois. Znippy n'est pas jouable : il suit toujours Barbe-Yeux et peut enfoncer une dalle derrière lui. Le plus sûr : laisse Barbe-Yeux (et donc Znippy) loin des dalles, et fais la suite avec un con ou Itzel. La bonne suite ouvre la porte du haut et regroupe l'équipe. 3. La salle au trésor (troisième salle) 30 coffres sont rangés en 3 rangées de 10 dans la grande salle du haut. Approche-toi d'un coffre et choisis « Ouvrir ». Tous les coffres sauf un sont des Mimics : un seul ennemi, très résistant, qui mord trois cibles par tour. Fuite impossible. Chaque Mimic vaincu donne 1 à 3 consommables et beaucoup d'XP. Un coffre ouvert le reste : un Mimic perdu ne revient pas, et son butin est perdu. Indice : en longeant le mur du haut, une lumière balaie lentement la salle. Elle révèle deux personnages gravés, chacun avec un chiffre maya vert : 2 points (= 2) à gauche, une barre et 4 points (= 9) à droite. Solution : ouvre le coffre de la 2e rangée (celle du milieu), 9e en partant de la gauche (l'avant-dernier à droite). Il ouvre la porte du fond, en haut au centre. 4. Le labyrinthe des esprits (quatrième salle) En entrant, tout devient noir. Des rires éclatent et des yeux s'allument dans l'obscurité (cinématique). Itzel met son masque et prend la tête . Le chemin lumineux n'est visible qu'autour d'elle, au rythme d'un battement de cœur. Des spectres errent dans les couloirs, mais ils sont inoffensifs. Groupe d'esprits obligatoire au centre de la salle, sur le chemin : Poom, Jo'oche' et Nikte'. Poom empoisonne tout le groupe. Jo'oche' maudit un personnage par tour. La cible meurt quand Jo'oche' a rejoué 3 fois, sauf si Jo'oche' tombe avant. Tue Jo'oche' en premier. Nikte' pousse un cri qui blesse tout le groupe. Il frappe fort mais a peu de PV. Quatre autres groupes d'esprits, facultatifs, attendent dans les coins : nord-ouest, ouest, est et nord-est. Chaque esprit vaincu donne un consommable au hasard. Itinéraire : depuis l'entrée (en bas au centre), monte jusqu'au centre (combat). Pars ensuite vers l'ouest, serpente vers le nord jusqu'au couloir du nord-ouest, puis repars vers l'est. Redescends un peu, puis traverse vers l'est par un long couloir à mi-hauteur. Descends côté est, puis remonte toute la bordure est jusqu'en haut. Reviens enfin vers l'ouest jusqu'à la porte, en haut au centre. La porte, en haut au centre, s'ouvre toute seule quand tu arrives devant. 5. Le pont (cinquième salle) Plus d'obscurité : tout le monde suit de nouveau Barbe-Yeux. Monte le long pont vers le nord. Le vieux de la grotte (celui de l'Île aux singes) te barre la route (« VOUS… NE PASSEREZ… PAS ! »). Va à son contact : scène avec flashback, puis il te laisse passer. Contourne-le par sa droite. Plus haut, le prédicateur de Morro-Blanco fait de même : scène, flashback, passage. Tout en haut, à droite de la sortie, une fontaine propose « Se régénérer » (PV et énergie au maximum). Soigne-toi et prépare-toi ici : entrer dans la salle suivante enchaîne directement sur le boss final.", "sol": 2}, {"titre": "S'enfoncer dans Xibalba.", "html": "<ol><li>Cinématique de la <strong>porte au médaillon</strong> : Nadaillac est devant la porte, Itzel crie « Stop ! ». Nadaillac ouvre la porte avec le médaillon, sans action de ta part.</li><li>« Suivons les. » : le groupe s'avance seul et entre dans l'antre.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "Chapitre 6 Flagrant Délit Quête principale S'enfoncer dans Xibalba. Cinématique de la porte au médaillon : Nadaillac est devant la porte, Itzel crie « Stop ! ». Nadaillac ouvre la porte avec le médaillon, sans action de ta part. « Suivons les. » : le groupe s'avance seul et entre dans l'antre.", "sol": 0}, {"titre": "Affronter Camazotz.", "html": "<p>Le combat final enchaîne trois phases.</p><p><strong>Si tu perds en phase 1 ou 2 :</strong></p><ul><li>Tu te réveilles au bout du pont, devant la fontaine, PV et énergie pleins (« Camazotz n'en a pas fini avec vous ! »).</li><li>Repasse la sortie du haut : le combat reprend directement à la phase perdue, sans la scène de la porte.</li><li>Dès la première défaite, deux <strong>lueurs bleues</strong> apparaissent. Celle du bout du pont, à gauche de la sortie, en face de la fontaine, propose « Retourner au bateau ». Elle te pose sur la plage de l'île du volcan, à droite de la barque. Là, une autre lueur propose « Aller au bout du pont ». Tu peux donc repartir t'entraîner ou faire des achats ailleurs, puis revenir. Les lueurs disparaissent une fois Camazotz vaincu.</li><li>En difficulté Normal, à la 2e défaite (puis toutes les deux défaites), le jeu propose de passer en <strong>difficulté Aventure</strong> : dégâts reçus -20 %, dégâts infligés +20 %, soins +30 %. Réponds oui pour l'activer tout de suite. Elle se change aussi à tout moment dans Préférences &gt; Niveau de difficulté.</li></ul><p><strong>Phase 1 — le Héraut de Xibalba et Kab'raqan</strong></p><ul><li>Ton groupe : Barbe-Yeux, les deux cons, Itzel, <strong>Nadaillac (allié jouable)</strong> et Znippy, sans son ultime.</li><li>Nadaillac a trois compétences :<ul><li>Sabre : très puissant.</li><li>Grenade : six frappes sur tous les ennemis, utilisable un tour sur quatre.</li><li>Coup de feu : deux balles, tu choisis la cible de chacune, sans recharge.</li></ul></li><li>Le Héraut reprend ses attaques du temple de la jungle (dont l'invocation d'esprits). Kab'raqan reprend sa première phase : vol, boules de feu, cône de flammes, puis il atterrit à mi-vie.</li></ul><p><strong>Phase 2 — Camazotz</strong></p><ul><li>Camazotz arrive avec 3 invocations. Il suit un cycle fixe de 4 attaques :<ol><li>Triple boule de feu.</li><li>Nuée de chauves-souris : coups au hasard, plus l'invocation d'un esprit, tour à tour Jo'oche', Poom puis Nikte'.</li><li><strong>Onde de choc</strong> : 40, puis 50, puis 120 dégâts à tout le groupe (20 % de moins en difficulté Aventure).</li><li>Griffure : deux alliés au hasard, gros dégâts.</li></ol></li><li>Soigne le groupe juste avant l'onde de choc (3e attaque du cycle). Élimine Jo'oche' dès qu'il apparaît.</li><li>Quand Camazotz passe sous <strong>16 000 PV</strong> :<ul><li>il invoque 3 sbires de plus ;</li><li>Znippy lâche son ultime puis s'enfuit ;</li><li><strong>Itzel met son masque</strong> jusqu'à la fin du combat : attaques renforcées, et tu répartis toi-même les balles de son tir dévastateur. Sa grenade fumigène fait alors rater <strong>75 %</strong> des attaques des ennemis enfumés (50 % sans le masque).</li></ul></li><li>À <strong>11 000 PV</strong>, le combat s'arrête : Nadaillac réclame sa porte, Camazotz le tue et se relève.</li></ul><p><strong>Phase 3 — le combat de rythme</strong> (voir Mini-jeux). Il faut faire tomber les 11 000 PV restants avant la fin du morceau. Le combat dure toujours jusqu'à la dernière note. En cas d'échec, tu rejoues aussitôt cette phase (pas de retour au pont).</p>", "id": "c6-affronter-camazotz", "texte": "Chapitre 6 Flagrant Délit Quête principale Affronter Camazotz. Le combat final enchaîne trois phases. Si tu perds en phase 1 ou 2 : Tu te réveilles au bout du pont, devant la fontaine, PV et énergie pleins (« Camazotz n'en a pas fini avec vous ! »). Repasse la sortie du haut : le combat reprend directement à la phase perdue, sans la scène de la porte. Dès la première défaite, deux lueurs bleues apparaissent. Celle du bout du pont, à gauche de la sortie, en face de la fontaine, propose « Retourner au bateau ». Elle te pose sur la plage de l'île du volcan, à droite de la barque. Là, une autre lueur propose « Aller au bout du pont ». Tu peux donc repartir t'entraîner ou faire des achats ailleurs, puis revenir. Les lueurs disparaissent une fois Camazotz vaincu. En difficulté Normal, à la 2e défaite (puis toutes les deux défaites), le jeu propose de passer en difficulté Aventure : dégâts reçus -20 %, dégâts infligés +20 %, soins +30 %. Réponds oui pour l'activer tout de suite. Elle se change aussi à tout moment dans Préférences > Niveau de difficulté. Phase 1 — le Héraut de Xibalba et Kab'raqan Ton groupe : Barbe-Yeux, les deux cons, Itzel, Nadaillac (allié jouable) et Znippy, sans son ultime. Nadaillac a trois compétences : Sabre : très puissant. Grenade : six frappes sur tous les ennemis, utilisable un tour sur quatre. Coup de feu : deux balles, tu choisis la cible de chacune, sans recharge. Le Héraut reprend ses attaques du temple de la jungle (dont l'invocation d'esprits). Kab'raqan reprend sa première phase : vol, boules de feu, cône de flammes, puis il atterrit à mi-vie. Phase 2 — Camazotz Camazotz arrive avec 3 invocations. Il suit un cycle fixe de 4 attaques : Triple boule de feu. Nuée de chauves-souris : coups au hasard, plus l'invocation d'un esprit, tour à tour Jo'oche', Poom puis Nikte'. Onde de choc : 40, puis 50, puis 120 dégâts à tout le groupe (20 % de moins en difficulté Aventure). Griffure : deux alliés au hasard, gros dégâts. Soigne le groupe juste avant l'onde de choc (3e attaque du cycle). Élimine Jo'oche' dès qu'il apparaît. Quand Camazotz passe sous 16 000 PV : il invoque 3 sbires de plus ; Znippy lâche son ultime puis s'enfuit ; Itzel met son masque jusqu'à la fin du combat : attaques renforcées, et tu répartis toi-même les balles de son tir dévastateur. Sa grenade fumigène fait alors rater 75 % des attaques des ennemis enfumés (50 % sans le masque). À 11 000 PV , le combat s'arrête : Nadaillac réclame sa porte, Camazotz le tue et se relève. Phase 3 — le combat de rythme (voir Mini-jeux). Il faut faire tomber les 11 000 PV restants avant la fin du morceau. Le combat dure toujours jusqu'à la dernière note. En cas d'échec, tu rejoues aussitôt cette phase (pas de retour au pont).", "sol": 0}, {"titre": "Fuir Xibalba avant que tout s'effondre.", "html": "<ol><li>Le temple s'écroule. Barbe-Yeux monte un con, Itzel monte l'autre. Impossible de descendre de monture.</li><li>Un <strong>chrono de 50 secondes</strong>, en haut à droite, couvre <strong>tout le trajet</strong>. Il est en pause pendant les fondus entre les salles et devient rouge sous 10 secondes.</li><li>Refais le chemin à l'envers, toujours vers la <strong>sortie en bas</strong> de chaque salle : la porte au médaillon, le pont (descends tout droit), le labyrinthe (le même chemin qu'à l'aller, à l'envers), la salle au trésor, la salle des dalles, puis le camp. De nouveaux éboulis encombrent les salles. Les rochers qui tombent sont uniquement visuels.</li><li>Si le chrono tombe à zéro (« Trop tard ! »), tu repars de la salle de la porte, chrono plein.</li><li>Dialogue final face à la mer, puis le <strong>générique de fin</strong>, sur la chanson du Roi des galères (un bouton permet de le passer). Des souvenirs de l'aventure défilent sur les côtés, avec les statistiques de ta partie : précision contre Camazotz, morts, chutes, or gagné, bières bues, quêtes secondaires, temps de jeu… Au milieu du générique, Znippy, armé jusqu'aux pinces, passe en bas à gauche pour s'excuser.</li><li>Un dernier écran « Merci d'avoir joué ! » reste affiché jusqu'à ton clic.</li><li>Tu te retrouves ensuite devant la taverne de l'Île au crabe, avec Barbe-Yeux et les deux cons seulement : la suite est dans l'après-jeu.</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "Chapitre 6 Flagrant Délit Quête principale Fuir Xibalba avant que tout s'effondre. Le temple s'écroule. Barbe-Yeux monte un con, Itzel monte l'autre. Impossible de descendre de monture. Un chrono de 50 secondes , en haut à droite, couvre tout le trajet . Il est en pause pendant les fondus entre les salles et devient rouge sous 10 secondes. Refais le chemin à l'envers, toujours vers la sortie en bas de chaque salle : la porte au médaillon, le pont (descends tout droit), le labyrinthe (le même chemin qu'à l'aller, à l'envers), la salle au trésor, la salle des dalles, puis le camp. De nouveaux éboulis encombrent les salles. Les rochers qui tombent sont uniquement visuels. Si le chrono tombe à zéro (« Trop tard ! »), tu repars de la salle de la porte, chrono plein. Dialogue final face à la mer, puis le générique de fin , sur la chanson du Roi des galères (un bouton permet de le passer). Des souvenirs de l'aventure défilent sur les côtés, avec les statistiques de ta partie : précision contre Camazotz, morts, chutes, or gagné, bières bues, quêtes secondaires, temps de jeu… Au milieu du générique, Znippy, armé jusqu'aux pinces, passe en bas à gauche pour s'excuser. Un dernier écran « Merci d'avoir joué ! » reste affiché jusqu'à ton clic. Tu te retrouves ensuite devant la taverne de l'Île au crabe, avec Barbe-Yeux et les deux cons seulement : la suite est dans l'après-jeu.", "sol": 0}]}, {"titre": "Quêtes secondaires", "intro": "<p>Aucune quête secondaire du journal ne se déclenche dans ce chapitre. Une rencontre facultative en dépend toutefois :</p>", "entrees": [{"titre": "Boss facultatif : Kerwin – Le vendeur de torches", "html": "<ul><li><strong>Déclenchement</strong> : à n'importe quel moment du jeu, retourne voir Kerwin une fois que tu possèdes <strong>toutes les torches achetables</strong>. Il veut les récupérer.</li><li><strong>Combat</strong> : Kerwin change d'état selon un cycle fixe. La couleur des torches qui tournent autour de lui annonce l'attaque à venir :<ol><li>Torche instable (rouge-orange), 3 tours <strong>en vol</strong> : 2 torches lancées par tour, brûlure. En vol, le sabre et la rame ne le touchent pas.</li><li>Phosphore et résine (vert) : empoisonne une cible.</li><li>Aube noire (violet) : maudit une cible, qui meurt quand Kerwin a rejoué 3 fois, sauf s'il tombe avant.</li><li>Torche Compote (orange) : englue une cible, qui perd son tour.</li><li>Éclat blanc : éclair aveuglant sur tout le groupe.</li><li>Acajou Prestige (doré) : grosse frappe, et il se soigne.</li></ol></li></ul><p>Sauf pendant la Torche instable, il reste <strong>au sol</strong> et redevient attaquable au corps à corps.</p><ul><li><strong>Si tu perds</strong> : défaite habituelle. La boutique propose ensuite « Viens prendre ta part toi. » pour retenter.</li><li><strong>Récompense</strong> : l'XP d'un niveau complet (à ton niveau du moment), et tu gardes tes torches (« Surtout celle en acajou »).</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "Chapitre 6 Flagrant Délit Quêtes secondaires Boss facultatif : Kerwin – Le vendeur de torches Déclenchement : à n'importe quel moment du jeu, retourne voir Kerwin une fois que tu possèdes toutes les torches achetables . Il veut les récupérer. Combat : Kerwin change d'état selon un cycle fixe. La couleur des torches qui tournent autour de lui annonce l'attaque à venir : Torche instable (rouge-orange), 3 tours en vol : 2 torches lancées par tour, brûlure. En vol, le sabre et la rame ne le touchent pas. Phosphore et résine (vert) : empoisonne une cible. Aube noire (violet) : maudit une cible, qui meurt quand Kerwin a rejoué 3 fois, sauf s'il tombe avant. Torche Compote (orange) : englue une cible, qui perd son tour. Éclat blanc : éclair aveuglant sur tout le groupe. Acajou Prestige (doré) : grosse frappe, et il se soigne. Sauf pendant la Torche instable, il reste au sol et redevient attaquable au corps à corps. Si tu perds : défaite habituelle. La boutique propose ensuite « Viens prendre ta part toi. » pour retenter. Récompense : l'XP d'un niveau complet (à ton niveau du moment), et tu gardes tes torches (« Surtout celle en acajou »).", "sol": 0}]}, {"titre": "Mini-jeux", "intro": "", "entrees": [{"titre": "Combat de rythme contre Camazotz (phase 3)", "html": "<ul><li><strong>Règles</strong> : les notes défilent vers un viseur. Appuie sur la flèche de déplacement correspondante (haut, bas, gauche, droite) au bon moment. Il existe trois types de notes :<ul><li>les notes simples ;</li><li>les notes <strong>maintenues</strong> : garde la touche enfoncée jusqu'au bout ;</li><li>les notes <strong>martelées</strong>, annoncées par « MATRAQUAGE ! » : appuie très vite et plusieurs fois.</li></ul></li><li><strong>Jugement</strong> :<ul><li>Parfait : à moins de 0,06 s ;</li><li>Bon : à moins de 0,15 s ;</li><li>Passable : à moins de 0,22 s ;</li><li>au-delà : Raté.</li></ul></li><li><strong>Déroulement</strong> : le morceau est découpé en séquences. Selon ton score sur chaque séquence, tes alliés attaquent Camazotz, ou il frappe le groupe (boules de feu, nuée, onde de choc).</li><li><strong>Camazotz à bout de forces</strong> : si ses 11 000 PV tombent avant la fin, il reste à 1 PV. La musique continue, mais il n'attaque plus et n'invoque plus rien, et les brûlures, poisons et malédictions en cours disparaissent. Il meurt dans sa nuée de chauves-souris à la dernière note. Joue quand même jusqu'au bout : ton décompte final (parfaits, bons, passables, ratés) s'affiche ensuite dans le générique.</li><li><strong>Pause</strong> : Échap ou P (la touche est rappelée en haut à gauche de l'écran).</li><li><strong>Défaite</strong> : si tout le groupe tombe (« L'équipage s'effondre... »), ou si le morceau finit avec Camazotz debout (« Fin du morceau ! »), l'écran de résultat propose « Rejouer » et un mode plus doux. Le mode choisi est gardé avec la partie :<ul><li>Normal : le combat tel quel.</li><li>Indulgent : fenêtres de timing élargies, notes maintenues et martelées adoucies.</li><li>Simplifié : comme Indulgent, mais n'importe quelle flèche vaut pour toutes les notes. On peut encore perdre.</li><li>Récit : chaque séquence compte comme réussie. Le groupe ne tombe jamais, et Camazotz tombe à la fin du morceau.</li></ul></li><li><strong>Récompense</strong> : la victoire lance la fuite de Xibalba.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "Chapitre 6 Flagrant Délit Mini-jeux Combat de rythme contre Camazotz (phase 3) Règles : les notes défilent vers un viseur. Appuie sur la flèche de déplacement correspondante (haut, bas, gauche, droite) au bon moment. Il existe trois types de notes : les notes simples ; les notes maintenues : garde la touche enfoncée jusqu'au bout ; les notes martelées , annoncées par « MATRAQUAGE ! » : appuie très vite et plusieurs fois. Jugement : Parfait : à moins de 0,06 s ; Bon : à moins de 0,15 s ; Passable : à moins de 0,22 s ; au-delà : Raté. Déroulement : le morceau est découpé en séquences. Selon ton score sur chaque séquence, tes alliés attaquent Camazotz, ou il frappe le groupe (boules de feu, nuée, onde de choc). Camazotz à bout de forces : si ses 11 000 PV tombent avant la fin, il reste à 1 PV. La musique continue, mais il n'attaque plus et n'invoque plus rien, et les brûlures, poisons et malédictions en cours disparaissent. Il meurt dans sa nuée de chauves-souris à la dernière note. Joue quand même jusqu'au bout : ton décompte final (parfaits, bons, passables, ratés) s'affiche ensuite dans le générique. Pause : Échap ou P (la touche est rappelée en haut à gauche de l'écran). Défaite : si tout le groupe tombe (« L'équipage s'effondre... »), ou si le morceau finit avec Camazotz debout (« Fin du morceau ! »), l'écran de résultat propose « Rejouer » et un mode plus doux. Le mode choisi est gardé avec la partie : Normal : le combat tel quel. Indulgent : fenêtres de timing élargies, notes maintenues et martelées adoucies. Simplifié : comme Indulgent, mais n'importe quelle flèche vaut pour toutes les notes. On peut encore perdre. Récit : chaque séquence compte comme réussie. Le groupe ne tombe jamais, et Camazotz tombe à la fin du morceau. Récompense : la victoire lance la fuite de Xibalba.", "sol": 0}, {"titre": "Fuite chronométrée", "html": "<p>Voir l'objectif « Fuir Xibalba avant que tout s'effondre » : 50 secondes pour tout le trajet, réessai illimité.</p>", "id": "c6-fuite-chronometree", "texte": "Chapitre 6 Flagrant Délit Mini-jeux Fuite chronométrée Voir l'objectif « Fuir Xibalba avant que tout s'effondre » : 50 secondes pour tout le trajet, réessai illimité.", "sol": 0}]}, {"titre": "À ne pas rater", "intro": "", "entrees": [{"titre": "À ne pas rater", "html": "<ul><li><strong>Gemme rouge (2ème gemme des Bolon Tiku)</strong>, au foyer de Kuxtal : la suite de l'histoire ne se débloque pas sans elle.</li><li><strong>Journal n°5</strong> (stèles de Kuxtal) et <strong>Journal de recherches</strong> (camp est du temple). Ce sont deux des sept journaux du succès « De toute façon j'sais pas lire ».</li><li><strong>Jade sacré de Kuxtal</strong> (caché) : dans la salle des dalles, enchaîne <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>. Pour répéter la dalle 4, descends puis remonte dessus. Ça marche que la porte soit ouverte ou non.<ul><li>Une lueur apparaît sur l'œil de la tête de serpent, à l'ouest de la salle, entre la grande dalle grise et la dalle verte. Marche dessus pour ramasser le jade.</li><li>Effet : le jade ne va pas dans l'inventaire, il débloque pour de bon une compétence (« Compétence débloquée : Lancer de caillou spécial »). Le Lancer de caillou des cons inflige alors 8 dégâts plus la moitié de leur ATK, moins la DEF de la cible, avec une chance sur deux de rebondir sur un autre ennemi.</li><li>Si tu ne l'as pas, le prédicateur du pont te le reproche.</li><li>Si tu le rates : le temple s'effondre à la fin du chapitre, mais le jade s'achète ensuite à la boutique de l'arène de Kuxtal (1000 jetons).</li></ul></li><li><strong>Camp ouest</strong> et <strong>Mimics</strong> : les consommables et l'XP ne sont accessibles que pendant le chapitre. Après la fuite, le temple est fermé (« Tout s'est effondré, impossible d'y retourner. »).</li><li><strong>Point de non-retour</strong> : la porte du haut du camp de pirates. Ensuite, impossible de ressortir du volcan, sauf par la lueur bleue du bout du pont après une défaite contre Camazotz.</li><li><strong>Le renard sculpté</strong> (facultatif) : à l'ouest de Kuxtal, Barbe-Yeux redresse une petite statue coincée sous une pierre. Il n'y a pas de récompense immédiate (la statuette arrive dans l'après-jeu).</li><li><strong>Succès</strong> :<ul><li>« Taverne ? » se débloque au début du générique de fin, si tu as les cinq succès de fin des chapitres 1 à 5. Le chapitre 6 n'a pas de succès à lui.</li><li>« Un homme éclairé » : toutes les torches achetées, ce qui ouvre aussi le combat contre Kerwin.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "Chapitre 6 Flagrant Délit À ne pas rater À ne pas rater Gemme rouge (2ème gemme des Bolon Tiku) , au foyer de Kuxtal : la suite de l'histoire ne se débloque pas sans elle. Journal n°5 (stèles de Kuxtal) et Journal de recherches (camp est du temple). Ce sont deux des sept journaux du succès « De toute façon j'sais pas lire ». Jade sacré de Kuxtal (caché) : dans la salle des dalles, enchaîne 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 . Pour répéter la dalle 4, descends puis remonte dessus. Ça marche que la porte soit ouverte ou non. Une lueur apparaît sur l'œil de la tête de serpent, à l'ouest de la salle, entre la grande dalle grise et la dalle verte. Marche dessus pour ramasser le jade. Effet : le jade ne va pas dans l'inventaire, il débloque pour de bon une compétence (« Compétence débloquée : Lancer de caillou spécial »). Le Lancer de caillou des cons inflige alors 8 dégâts plus la moitié de leur ATK, moins la DEF de la cible, avec une chance sur deux de rebondir sur un autre ennemi. Si tu ne l'as pas, le prédicateur du pont te le reproche. Si tu le rates : le temple s'effondre à la fin du chapitre, mais le jade s'achète ensuite à la boutique de l'arène de Kuxtal (1000 jetons). Camp ouest et Mimics : les consommables et l'XP ne sont accessibles que pendant le chapitre. Après la fuite, le temple est fermé (« Tout s'est effondré, impossible d'y retourner. »). Point de non-retour : la porte du haut du camp de pirates. Ensuite, impossible de ressortir du volcan, sauf par la lueur bleue du bout du pont après une défaite contre Camazotz. Le renard sculpté (facultatif) : à l'ouest de Kuxtal, Barbe-Yeux redresse une petite statue coincée sous une pierre. Il n'y a pas de récompense immédiate (la statuette arrive dans l'après-jeu). Succès : « Taverne ? » se débloque au début du générique de fin, si tu as les cinq succès de fin des chapitres 1 à 5. Le chapitre 6 n'a pas de succès à lui. « Un homme éclairé » : toutes les torches achetées, ce qui ouvre aussi le combat contre Kerwin.", "sol": 0}]}]}], "en": [{"id": "c6", "num": "Chapter 6", "titre": "Caught Red-Handed", "intro": "<p>The King of Crabs, renamed Znippy, has joined the crew. You have to find Itzel and stop Nadaillac from opening the Bolon Tiku door. The way there goes through a prison cell, the lost island of Kuxtal, and then the temple buried beneath Volcano Island.</p><aside class=\"note\"><p>Note: the “Chapter 6 — Caught Red-Handed” title card only appears at the moment of the arrest. The first two objectives below are played before it.</p></aside>", "sections": [{"titre": "Main quest", "intro": "", "entrees": [{"titre": "Come up with a plan (at the Crab Island tavern).", "html": "<ol><li>After recruiting the King of Crabs, go into the Crab Island tavern.</li><li>Automatic scene: Barbe-Yeux, the Two Numpties and Znippy take stock. Barbe-Yeux realises that the old prisoner from Nassau (the one who “smells of pee”) comes from Kuxtal.</li><li>His HP and energy are restored to full. New objective: get arrested so you can talk to him.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "Chapter 6 Caught Red-Handed Main quest Come up with a plan (at the Crab Island tavern). After recruiting the King of Crabs, go into the Crab Island tavern. Automatic scene: Barbe-Yeux, the Two Numpties and Znippy take stock. Barbe-Yeux realises that the old prisoner from Nassau (the one who “smells of pee”) comes from Kuxtal. His HP and energy are restored to full. New objective: get arrested so you can talk to him.", "sol": 0}, {"titre": "Find a way to get arrested.", "html": "<p>Three leads are possible. <strong>Only one works: burning down Kerwin's shop.</strong></p><ol><li><strong>The Nassau museum guards</strong> (optional, once only): go up to Marcel and Poulichard in front of the museum, by day or by night. Barbe-Yeux provokes them and a fight starts. Special feature: Numpty - Boar King switches to the enemy side on the first turn, and Numpty - Olympian joins him on the second. They attack with their oars (the Olympian never misses, the Boar King can miss). Win or lose, the scene carries on the same way. The guards refuse to arrest you, but a victory gives a lot of XP. The objective doesn't change: it's a red herring.</li><li><strong>The tavern hold-up</strong> (optional, once only): the first tavern you walk into (Crab Island, Monkey Island, Nassau or Windward Island) plays a short hold-up scene. Nobody calls the guards, then the tavern's normal menu opens.</li><li><strong>Kerwin's torch shop</strong> (Monkey Island, Windward Island or Nassau): talk to the seller. A menu opens:<ul><li>“Leave”: you walk away; the scene will come back on your next visit.</li><li>“Apologize and buy a torch”: normal shop.</li><li><strong>“Burn it all”</strong>: the shop catches fire.</li></ul></li></ol><p><strong>Solution:</strong> at Kerwin's, choose <strong>“Burn it all”</strong>.</p><p>Then:</p><ul><li>The chapter 6 title card appears, then Barbe-Yeux wakes up in a cell with the old prisoner.</li><li>The old man confirms that Itzel comes from Kuxtal and marks the island's location on your map.</li><li>A guard releases you: the shop wasn't licensed. The world map opens directly from the prison. The only destination on offer is Kuxtal.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "Chapter 6 Caught Red-Handed Main quest Find a way to get arrested. Three leads are possible. Only one works: burning down Kerwin's shop. The Nassau museum guards (optional, once only): go up to Marcel and Poulichard in front of the museum, by day or by night. Barbe-Yeux provokes them and a fight starts. Special feature: Numpty - Boar King switches to the enemy side on the first turn, and Numpty - Olympian joins him on the second. They attack with their oars (the Olympian never misses, the Boar King can miss). Win or lose, the scene carries on the same way. The guards refuse to arrest you, but a victory gives a lot of XP. The objective doesn't change: it's a red herring. The tavern hold-up (optional, once only): the first tavern you walk into (Crab Island, Monkey Island, Nassau or Windward Island) plays a short hold-up scene. Nobody calls the guards, then the tavern's normal menu opens. Kerwin's torch shop (Monkey Island, Windward Island or Nassau): talk to the seller. A menu opens: “Leave”: you walk away; the scene will come back on your next visit. “Apologize and buy a torch”: normal shop. “Burn it all” : the shop catches fire. Solution: at Kerwin's, choose “Burn it all” . Then: The chapter 6 title card appears, then Barbe-Yeux wakes up in a cell with the old prisoner. The old man confirms that Itzel comes from Kuxtal and marks the island's location on your map. A guard releases you: the shop wasn't licensed. The world map opens directly from the prison. The only destination on offer is Kuxtal.", "sol": 1}, {"titre": "Go to Kuxtal.", "html": "<ol><li>On the world map, sail to Kuxtal.</li><li>No music on the island, just the wind and the sea. When you arrive, the party talks (automatic scene).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "Chapter 6 Caught Red-Handed Main quest Go to Kuxtal. On the world map, sail to Kuxtal. No music on the island, just the wind and the sea. When you arrive, the party talks (automatic scene).", "sol": 0}, {"titre": "Explore the ruins of Kuxtal.", "html": "<ol><li>Go to the <strong>hearth</strong>, in the north-centre of the island (north of the landing point, towards the middle). Interact with it.</li><li>A fire has been smothered and a bloodstained cloth is tied to a stick. You get the <strong>2nd Bolon Tiku gem</strong> (the red gem Itzel had on her).</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "Chapter 6 Caught Red-Handed Main quest Explore the ruins of Kuxtal. Go to the hearth , in the north-centre of the island (north of the landing point, towards the middle). Interact with it. A fire has been smothered and a bloodstained cloth is tied to a stick. You get the 2nd Bolon Tiku gem (the red gem Itzel had on her).", "sol": 0}, {"titre": "Uncover Kuxtal's past.", "html": "<p>Read the four steles (“Read”), in any order. The “Steles read: x / 4” counter is shown under the objective.</p><div class=\"tab\"><table><thead><tr><th>Stele</th><th>Where to find it</th></tr></thead><tbody><tr><td>Stele 1</td><td>In the east, near the big sacred tree</td></tr><tr><td>Stele 2</td><td>In the south-west, near the south coast</td></tr><tr><td>Stele 3</td><td>In the north-west</td></tr><tr><td>Stele 4</td><td>In the north-east</td></tr></tbody></table></div><ul><li>The first stele you read gives you <strong>Journal no. 5</strong>. Each following stele adds an entry to it, always filed in story order.</li><li>You can read the steles before visiting the hearth. The conclusion only comes once both are done.</li><li>When everything has been read and the journal closed, Barbe-Yeux draws his conclusion. <strong>Volcano Island</strong> appears on the world map.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "Chapter 6 Caught Red-Handed Main quest Uncover Kuxtal's past. Read the four steles (“Read”), in any order. The “Steles read: x / 4” counter is shown under the objective. Stele Where to find it Stele 1 In the east, near the big sacred tree Stele 2 In the south-west, near the south coast Stele 3 In the north-west Stele 4 In the north-east The first stele you read gives you Journal no. 5 . Each following stele adds an entry to it, always filed in story order. You can read the steles before visiting the hearth. The conclusion only comes once both are done. When everything has been read and the journal closed, Barbe-Yeux draws his conclusion. Volcano Island appears on the world map.", "sol": 0}, {"titre": "Go to Volcano Island.", "html": "<ol><li>Sail to Volcano Island. As soon as you land, an automatic scene starts: Nadaillac calls out to the party, Barbe-Yeux walks towards the temple and trips on the way.</li><li>Cutscene: Nadaillac holds Itzel at gunpoint and wounds one of the Numpties. Znippy admits you have the gems, and Barbe-Yeux trades them for Itzel. <strong>All the Bolon Tiku gems leave your inventory.</strong> Nadaillac immediately breaks his word and unleashes his skeletons.</li><li><strong>Fight against Nadaillac's skeletons</strong> (5 skeletons). Your party: Barbe-Yeux, Numpty - Boar King and the King of Crabs, without his ultimate. If you lose, the fight restarts at once with full HP and energy.</li><li>Medallion cutscene (can't be skipped). The temple wakes up, Znippy frees Itzel. Itzel joins the party and suggests “another way”.</li><li>You get control back in the temple's pirate camp (the Caldera). From then on, the whole party follows you: the Two Numpties, Itzel and Znippy.</li></ol><p>To leave the island, take the boat in the south of the island (“Board” / “Stay”).</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "Chapter 6 Caught Red-Handed Main quest Go to Volcano Island. Sail to Volcano Island. As soon as you land, an automatic scene starts: Nadaillac calls out to the party, Barbe-Yeux walks towards the temple and trips on the way. Cutscene: Nadaillac holds Itzel at gunpoint and wounds one of the Numpties. Znippy admits you have the gems, and Barbe-Yeux trades them for Itzel. All the Bolon Tiku gems leave your inventory. Nadaillac immediately breaks his word and unleashes his skeletons. Fight against Nadaillac's skeletons (5 skeletons). Your party: Barbe-Yeux, Numpty - Boar King and the King of Crabs, without his ultimate. If you lose, the fight restarts at once with full HP and energy. Medallion cutscene (can't be skipped). The temple wakes up, Znippy frees Itzel. Itzel joins the party and suggests “another way”. You get control back in the temple's pirate camp (the Caldera). From then on, the whole party follows you: the Two Numpties, Itzel and Znippy. To leave the island, take the boat in the south of the island (“Board” / “Stay”).", "sol": 0}, {"titre": "Find a way into the heart of the volcano.", "html": "<p><strong>1. The pirate camp (first room of the temple)</strong></p><ul><li>You come in at the bottom of the room. The door leading further on is at the top, in the centre.</li><li><strong>East camp</strong> (centre-right, 6 pirates): <strong>mandatory</strong>. Victory gives you the <strong>Research journal</strong>, which opens straight away, plus 3 beers and a Castaway's Fricassee.</li><li><strong>West camp</strong> (on the left, 4 pirates): optional. It gives 2 beers and a Fine fish fillet.</li><li>As long as you don't have the Research journal, the top door stays shut. Barbe-Yeux then says: “These pirates are hiding something…”.</li><li>When you go through the top door, the game asks you to confirm (“You are entering the final phase…”): <strong>this is the point of no return</strong>. If you accept, the bottom door of the slab room no longer leads back to the camp, and the temple door, on the island, no longer opens. Make your preparations first (west camp, shopping, healing).</li><li>Once past the point of no return, you can still go back from the treasure room to the slab room, but not from the labyrinth to the treasure room.</li><li><strong>Defeat in the temple</strong> (camp, guardians, Mimics, spirits): you wake up in the Crab Island tavern, with full HP and energy. After the point of no return, <strong>save before every fight</strong> and reload if you lose: the temple door stays shut from the island.</li></ul><p><strong>2. The slab room (second room, in the dark)</strong> Everyone lights their torch. The room has <strong>four slabs</strong> on the floor and a fountain in the centre.</p><div class=\"tab\"><table><thead><tr><th>Slab</th><th>Appearance</th><th>Location</th></tr></thead><tbody><tr><td>1</td><td>Small grey slab</td><td>North-east</td></tr><tr><td>2</td><td>Medium <strong>green</strong> slab</td><td>West, in the lower half</td></tr><tr><td>3</td><td>Medium <strong>pink</strong> slab</td><td>East, in the lower half</td></tr><tr><td>4</td><td>Large grey slab</td><td>North-west</td></tr></tbody></table></div><p><em>a) The guardian rooms.</em> Every time you step on a slab different from the previous one, one of the four upper rooms opens and <strong>two guardians</strong> attack you. So there are 4 fights in all.</p><ul><li>The first guardian teleports in front of his target and strikes once.</li><li>The second one chains three blows on random targets.</li></ul><p>If you lose, the room isn't counted and will open again later. The guardians, like the Mimics and the spirits further on, go first for a Numpty who is taunting (Roll). After the 4th fight, the central fountain fills up: “Regenerate” restores HP and energy to full, as often as you like.</p><p><em>b) The door.</em> The Research journal shows a sequence of six masks. Each one comes with a Maya numeral, from 1 to 6 dots and bars, which gives the order. The colour and size of each mask point to a slab: large grey = slab 4, green = slab 2, pink = slab 3, small grey = slab 1.</p><p><strong>Solution:</strong> step on the slabs in the order <strong>4 – 2 – 3 – 4 – 3 – 1</strong>, i.e.: large grey, green, pink, large grey, pink, small grey.</p><ul><li>Only a new press counts: a slab stays pressed down as long as someone is on it, including a party member following you.</li><li>The game only remembers the <strong>last 6 presses</strong>. If you make a mistake, just start the sequence again from the beginning.</li><li>Tip: the hourglass button, in the bottom right, switches to <strong>co-op mode</strong>. Barbe-Yeux, the Two Numpties and Itzel then stay where they are, and you move only one of them at a time. Znippy isn't playable: he always follows Barbe-Yeux and can press a slab behind him. The safest way: leave Barbe-Yeux (and therefore Znippy) away from the slabs, and do the sequence with a Numpty or Itzel.</li><li>The right sequence opens the top door and regroups the team.</li></ul><p><strong>3. The treasure room (third room)</strong></p><ul><li>30 chests are lined up in <strong>3 rows of 10</strong> in the big upper room. Walk up to a chest and choose “Open”.</li><li>Every chest but one is a <strong>Mimic</strong>: a single, very tough enemy that bites three targets per turn. No fleeing. Each Mimic defeated gives 1 to 3 consumables and a lot of XP. An opened chest stays open: a Mimic you lose to doesn't come back, and its loot is lost.</li><li>Clue: as you walk along the top wall, a light slowly sweeps the room. It reveals two engraved figures, each with a green Maya numeral: <strong>2 dots</strong> (= 2) on the left, <strong>one bar and 4 dots</strong> (= 9) on the right.</li></ul><p><strong>Solution:</strong> open the chest in the <strong>2nd row</strong> (the middle one), <strong>9th from the left</strong> (second to last on the right). It opens the door at the back, top centre.</p><p><strong>4. The spirit labyrinth (fourth room)</strong></p><ul><li>As you enter, everything goes black. Laughter bursts out and eyes light up in the darkness (cutscene).</li><li>Itzel puts on her mask and <strong>takes the lead</strong>. The glowing path is only visible around her, pulsing like a heartbeat. Ghosts wander the corridors, but they're harmless.</li><li>A <strong>mandatory</strong> group of spirits in the centre of the room, on the path: Poom, Jo'oche' and Nikte'.<ul><li>Poom poisons the whole party.</li><li>Jo'oche' curses one character per turn. The target dies once Jo'oche' has had 3 more turns, unless Jo'oche' falls first. <strong>Kill Jo'oche' first.</strong></li><li>Nikte' lets out a scream that hurts the whole party. He hits hard but has few HP.</li></ul></li><li>Four other optional groups of spirits wait in the corners: north-west, west, east and north-east. Each spirit defeated gives a random consumable.</li><li><strong>Route</strong>: from the entrance (bottom centre), go up to the centre (fight). Then head west, wind your way north to the north-west corridor, then head back east. Go down a little, then cross east along a long corridor halfway up. Go down on the east side, then climb all the way up the eastern edge to the top. Finally, come back west to the door, top centre.</li><li>The door, top centre, opens by itself when you reach it.</li></ul><p><strong>5. The bridge (fifth room)</strong></p><ul><li>No more darkness: everyone follows Barbe-Yeux again. Walk up the long bridge to the north.</li><li><strong>The old man of the cave</strong> (the one from Monkey Island) blocks your way (“YOU… SHALL NOT PASS…!”). Walk into him: a scene with a flashback, then he lets you through. Go round him on his right.</li><li>Further up, <strong>the preacher</strong> from Morro-Blanco does the same: scene, flashback, way through.</li><li>At the very top, right of the exit, a <strong>fountain</strong> offers “Regenerate” (HP and energy to full).</li><li><strong>Heal up and get ready here</strong>: entering the next room leads straight into the final boss.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "Chapter 6 Caught Red-Handed Main quest Find a way into the heart of the volcano. 1. The pirate camp (first room of the temple) You come in at the bottom of the room. The door leading further on is at the top, in the centre. East camp (centre-right, 6 pirates): mandatory . Victory gives you the Research journal , which opens straight away, plus 3 beers and a Castaway's Fricassee. West camp (on the left, 4 pirates): optional. It gives 2 beers and a Fine fish fillet. As long as you don't have the Research journal, the top door stays shut. Barbe-Yeux then says: “These pirates are hiding something…”. When you go through the top door, the game asks you to confirm (“You are entering the final phase…”): this is the point of no return . If you accept, the bottom door of the slab room no longer leads back to the camp, and the temple door, on the island, no longer opens. Make your preparations first (west camp, shopping, healing). Once past the point of no return, you can still go back from the treasure room to the slab room, but not from the labyrinth to the treasure room. Defeat in the temple (camp, guardians, Mimics, spirits): you wake up in the Crab Island tavern, with full HP and energy. After the point of no return, save before every fight and reload if you lose: the temple door stays shut from the island. 2. The slab room (second room, in the dark) Everyone lights their torch. The room has four slabs on the floor and a fountain in the centre. Slab Appearance Location 1 Small grey slab North-east 2 Medium green slab West, in the lower half 3 Medium pink slab East, in the lower half 4 Large grey slab North-west a) The guardian rooms. Every time you step on a slab different from the previous one, one of the four upper rooms opens and two guardians attack you. So there are 4 fights in all. The first guardian teleports in front of his target and strikes once. The second one chains three blows on random targets. If you lose, the room isn't counted and will open again later. The guardians, like the Mimics and the spirits further on, go first for a Numpty who is taunting (Roll). After the 4th fight, the central fountain fills up: “Regenerate” restores HP and energy to full, as often as you like. b) The door. The Research journal shows a sequence of six masks. Each one comes with a Maya numeral, from 1 to 6 dots and bars, which gives the order. The colour and size of each mask point to a slab: large grey = slab 4, green = slab 2, pink = slab 3, small grey = slab 1. Solution: step on the slabs in the order 4 – 2 – 3 – 4 – 3 – 1 , i.e.: large grey, green, pink, large grey, pink, small grey. Only a new press counts: a slab stays pressed down as long as someone is on it, including a party member following you. The game only remembers the last 6 presses . If you make a mistake, just start the sequence again from the beginning. Tip: the hourglass button, in the bottom right, switches to co-op mode . Barbe-Yeux, the Two Numpties and Itzel then stay where they are, and you move only one of them at a time. Znippy isn't playable: he always follows Barbe-Yeux and can press a slab behind him. The safest way: leave Barbe-Yeux (and therefore Znippy) away from the slabs, and do the sequence with a Numpty or Itzel. The right sequence opens the top door and regroups the team. 3. The treasure room (third room) 30 chests are lined up in 3 rows of 10 in the big upper room. Walk up to a chest and choose “Open”. Every chest but one is a Mimic : a single, very tough enemy that bites three targets per turn. No fleeing. Each Mimic defeated gives 1 to 3 consumables and a lot of XP. An opened chest stays open: a Mimic you lose to doesn't come back, and its loot is lost. Clue: as you walk along the top wall, a light slowly sweeps the room. It reveals two engraved figures, each with a green Maya numeral: 2 dots (= 2) on the left, one bar and 4 dots (= 9) on the right. Solution: open the chest in the 2nd row (the middle one), 9th from the left (second to last on the right). It opens the door at the back, top centre. 4. The spirit labyrinth (fourth room) As you enter, everything goes black. Laughter bursts out and eyes light up in the darkness (cutscene). Itzel puts on her mask and takes the lead . The glowing path is only visible around her, pulsing like a heartbeat. Ghosts wander the corridors, but they're harmless. A mandatory group of spirits in the centre of the room, on the path: Poom, Jo'oche' and Nikte'. Poom poisons the whole party. Jo'oche' curses one character per turn. The target dies once Jo'oche' has had 3 more turns, unless Jo'oche' falls first. Kill Jo'oche' first. Nikte' lets out a scream that hurts the whole party. He hits hard but has few HP. Four other optional groups of spirits wait in the corners: north-west, west, east and north-east. Each spirit defeated gives a random consumable. Route : from the entrance (bottom centre), go up to the centre (fight). Then head west, wind your way north to the north-west corridor, then head back east. Go down a little, then cross east along a long corridor halfway up. Go down on the east side, then climb all the way up the eastern edge to the top. Finally, come back west to the door, top centre. The door, top centre, opens by itself when you reach it. 5. The bridge (fifth room) No more darkness: everyone follows Barbe-Yeux again. Walk up the long bridge to the north. The old man of the cave (the one from Monkey Island) blocks your way (“YOU… SHALL NOT PASS…!”). Walk into him: a scene with a flashback, then he lets you through. Go rou
