nd him on his right. Further up, the preacher from Morro-Blanco does the same: scene, flashback, way through. At the very top, right of the exit, a fountain offers “Regenerate” (HP and energy to full). Heal up and get ready here : entering the next room leads straight into the final boss.", "sol": 2}, {"titre": "Venture deeper into Xibalba.", "html": "<ol><li>Cutscene at the <strong>medallion door</strong>: Nadaillac is in front of the door, Itzel shouts “Stop!”. Nadaillac opens the door with the medallion, without any action from you.</li><li>“Let's follow them.”: the party moves forward on its own and enters the lair.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "Chapter 6 Caught Red-Handed Main quest Venture deeper into Xibalba. Cutscene at the medallion door : Nadaillac is in front of the door, Itzel shouts “Stop!”. Nadaillac opens the door with the medallion, without any action from you. “Let's follow them.”: the party moves forward on its own and enters the lair.", "sol": 0}, {"titre": "Face Camazotz.", "html": "<p>The final fight has three phases in a row.</p><p><strong>If you lose in phase 1 or 2:</strong></p><ul><li>You wake up at the end of the bridge, in front of the fountain, with full HP and energy (“Camazotz isn't done with you yet!”).</li><li>Go back through the top exit: the fight resumes directly at the phase you lost, without the door scene.</li><li>From your first defeat, two <strong>blue glows</strong> appear. The one at the end of the bridge, left of the exit, opposite the fountain, offers “Back to the boat”. It puts you on the Volcano Island beach, right of the boat. There, another glow offers “Go to the end of the bridge”. So you can go off to train or shop elsewhere, then come back. The glows disappear once Camazotz is defeated.</li><li>On Normal difficulty, at the 2nd defeat (and then every two defeats), the game offers to switch to <strong>Adventure difficulty</strong>: damage taken -20%, damage dealt +20%, healing +30%. Answer yes to turn it on right away. It can also be changed at any time in Preferences &gt; Difficulty level.</li></ul><p><strong>Phase 1 — the Herald of Xibalba and Kab'raqan</strong></p><ul><li>Your party: Barbe-Yeux, the Two Numpties, Itzel, <strong>Nadaillac (playable ally)</strong> and Znippy, without his ultimate.</li><li>Nadaillac has three skills:<ul><li>Sabre: very powerful.</li><li>Grenade: six hits on all enemies, usable one turn in four.</li><li>Gunshot: two bullets, you choose the target of each one, no reload.</li></ul></li><li>The Herald uses his attacks from the jungle temple again (including summoning spirits). Kab'raqan repeats his first phase: flight, fireballs, cone of flames, then he lands at half health.</li></ul><p><strong>Phase 2 — Camazotz</strong></p><ul><li>Camazotz arrives with 3 summonings. He follows a fixed cycle of 4 attacks:<ol><li>Triple fireball.</li><li>Bat swarm: random hits, plus the summoning of a spirit, in turn Jo'oche', Poom then Nikte'.</li><li><strong>Shockwave</strong>: 40, then 50, then 120 damage to the whole party (20% less on Adventure difficulty).</li><li>Claw Swipe: two random allies, heavy damage.</li></ol></li><li>Heal the party just before the shockwave (3rd attack of the cycle). Take out Jo'oche' as soon as he appears.</li><li>When Camazotz drops below <strong>16 000 HP</strong>:<ul><li>he summons 3 more minions;</li><li>Znippy unleashes his ultimate and then runs away;</li><li><strong>Itzel puts on her mask</strong> until the end of the fight: stronger attacks, and you allocate the bullets of her devastating shot yourself. Her smoke grenade then makes smoked-out enemies miss <strong>75%</strong> of their attacks (50% without the mask).</li></ul></li><li>At <strong>11 000 HP</strong>, the fight stops: Nadaillac claims his door, Camazotz kills him and gets back up.</li></ul><p><strong>Phase 3 — the rhythm battle</strong> (see Mini-games). You have to knock off the remaining 11 000 HP before the end of the song. The fight always lasts until the last note. If you fail, you replay this phase straight away (no return to the bridge).</p>", "id": "c6-affronter-camazotz", "texte": "Chapter 6 Caught Red-Handed Main quest Face Camazotz. The final fight has three phases in a row. If you lose in phase 1 or 2: You wake up at the end of the bridge, in front of the fountain, with full HP and energy (“Camazotz isn't done with you yet!”). Go back through the top exit: the fight resumes directly at the phase you lost, without the door scene. From your first defeat, two blue glows appear. The one at the end of the bridge, left of the exit, opposite the fountain, offers “Back to the boat”. It puts you on the Volcano Island beach, right of the boat. There, another glow offers “Go to the end of the bridge”. So you can go off to train or shop elsewhere, then come back. The glows disappear once Camazotz is defeated. On Normal difficulty, at the 2nd defeat (and then every two defeats), the game offers to switch to Adventure difficulty : damage taken -20%, damage dealt +20%, healing +30%. Answer yes to turn it on right away. It can also be changed at any time in Preferences > Difficulty level. Phase 1 — the Herald of Xibalba and Kab'raqan Your party: Barbe-Yeux, the Two Numpties, Itzel, Nadaillac (playable ally) and Znippy, without his ultimate. Nadaillac has three skills: Sabre: very powerful. Grenade: six hits on all enemies, usable one turn in four. Gunshot: two bullets, you choose the target of each one, no reload. The Herald uses his attacks from the jungle temple again (including summoning spirits). Kab'raqan repeats his first phase: flight, fireballs, cone of flames, then he lands at half health. Phase 2 — Camazotz Camazotz arrives with 3 summonings. He follows a fixed cycle of 4 attacks: Triple fireball. Bat swarm: random hits, plus the summoning of a spirit, in turn Jo'oche', Poom then Nikte'. Shockwave : 40, then 50, then 120 damage to the whole party (20% less on Adventure difficulty). Claw Swipe: two random allies, heavy damage. Heal the party just before the shockwave (3rd attack of the cycle). Take out Jo'oche' as soon as he appears. When Camazotz drops below 16 000 HP : he summons 3 more minions; Znippy unleashes his ultimate and then runs away; Itzel puts on her mask until the end of the fight: stronger attacks, and you allocate the bullets of her devastating shot yourself. Her smoke grenade then makes smoked-out enemies miss 75% of their attacks (50% without the mask). At 11 000 HP , the fight stops: Nadaillac claims his door, Camazotz kills him and gets back up. Phase 3 — the rhythm battle (see Mini-games). You have to knock off the remaining 11 000 HP before the end of the song. The fight always lasts until the last note. If you fail, you replay this phase straight away (no return to the bridge).", "sol": 0}, {"titre": "Escape Xibalba before it all collapses.", "html": "<ol><li>The temple crumbles. Barbe-Yeux rides one Numpty, Itzel rides the other. You can't dismount.</li><li>A <strong>50-second timer</strong>, top right, covers <strong>the whole route</strong>. It pauses during the fades between rooms and turns red under 10 seconds.</li><li>Retrace your steps backwards, always heading for the <strong>exit at the bottom</strong> of each room: the medallion door, the bridge (go straight down), the labyrinth (the same path as on the way in, in reverse), the treasure room, the slab room, then the camp. New rockfalls clutter the rooms. The falling rocks are purely visual.</li><li>If the timer reaches zero (“Too late!”), you start again from the door room, with a full timer.</li><li>A final dialogue facing the sea, then the <strong>end credits</strong>, over the King of the Galleys song (a button lets you skip them). Memories of the adventure scroll by on the sides, with your playthrough stats: accuracy against Camazotz, deaths, falls, gold earned, beers downed, side quests, play time… Halfway through the credits, Znippy, armed to the pincers, walks across the bottom left to apologise.</li><li>A last “Thanks for playing!” screen stays up until you click.</li><li>You then find yourself in front of the Crab Island tavern, with only Barbe-Yeux and the Two Numpties: the rest is in the post-game.</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "Chapter 6 Caught Red-Handed Main quest Escape Xibalba before it all collapses. The temple crumbles. Barbe-Yeux rides one Numpty, Itzel rides the other. You can't dismount. A 50-second timer , top right, covers the whole route . It pauses during the fades between rooms and turns red under 10 seconds. Retrace your steps backwards, always heading for the exit at the bottom of each room: the medallion door, the bridge (go straight down), the labyrinth (the same path as on the way in, in reverse), the treasure room, the slab room, then the camp. New rockfalls clutter the rooms. The falling rocks are purely visual. If the timer reaches zero (“Too late!”), you start again from the door room, with a full timer. A final dialogue facing the sea, then the end credits , over the King of the Galleys song (a button lets you skip them). Memories of the adventure scroll by on the sides, with your playthrough stats: accuracy against Camazotz, deaths, falls, gold earned, beers downed, side quests, play time… Halfway through the credits, Znippy, armed to the pincers, walks across the bottom left to apologise. A last “Thanks for playing!” screen stays up until you click. You then find yourself in front of the Crab Island tavern, with only Barbe-Yeux and the Two Numpties: the rest is in the post-game.", "sol": 0}]}, {"titre": "Side quests", "intro": "<p>No journal side quest is triggered in this chapter. One optional encounter does depend on it, though:</p>", "entrees": [{"titre": "Optional boss: Kerwin - The torch seller", "html": "<ul><li><strong>Trigger</strong>: at any point in the game, go back to see Kerwin once you own <strong>every torch that can be bought</strong>. He wants them back.</li><li><strong>Fight</strong>: Kerwin changes state in a fixed cycle. The colour of the torches spinning around him announces the next attack:<ol><li>Unstable torch (red-orange), 3 turns <strong>in the air</strong>: 2 torches thrown per turn, burn. In the air, the sabre and the oar don't reach him.</li><li>Phosphorus and Resin (green): poisons one target.</li><li>Black Dawn (purple): curses one target, who dies once Kerwin has had 3 more turns, unless he falls first.</li><li>Compote Torch (orange): gums up one target, who loses their turn.</li><li>White Flash: a blinding flash on the whole party.</li><li>Prestige Mahogany (gold): a big hit, and he heals himself.</li></ol></li></ul><p>Except during the Unstable torch, he stays <strong>on the ground</strong> and can be attacked in melee again.</p><ul><li><strong>If you lose</strong>: the usual defeat. The shop then offers “Come and get your share, you.” to try again.</li><li><strong>Reward</strong>: the XP for a full level (at your level at the time), and you keep your torches (“Especially the mahogany one”).</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "Chapter 6 Caught Red-Handed Side quests Optional boss: Kerwin - The torch seller Trigger : at any point in the game, go back to see Kerwin once you own every torch that can be bought . He wants them back. Fight : Kerwin changes state in a fixed cycle. The colour of the torches spinning around him announces the next attack: Unstable torch (red-orange), 3 turns in the air : 2 torches thrown per turn, burn. In the air, the sabre and the oar don't reach him. Phosphorus and Resin (green): poisons one target. Black Dawn (purple): curses one target, who dies once Kerwin has had 3 more turns, unless he falls first. Compote Torch (orange): gums up one target, who loses their turn. White Flash: a blinding flash on the whole party. Prestige Mahogany (gold): a big hit, and he heals himself. Except during the Unstable torch, he stays on the ground and can be attacked in melee again. If you lose : the usual defeat. The shop then offers “Come and get your share, you.” to try again. Reward : the XP for a full level (at your level at the time), and you keep your torches (“Especially the mahogany one”).", "sol": 0}]}, {"titre": "Mini-games", "intro": "", "entrees": [{"titre": "Rhythm battle against Camazotz (phase 3)", "html": "<ul><li><strong>Rules</strong>: the notes scroll towards a target. Press the matching movement arrow (up, down, left, right) at the right moment. There are three types of notes:<ul><li>single notes;</li><li><strong>hold</strong> notes: keep the key pressed until the end;</li><li><strong>mash</strong> notes, announced by “BLUDGEONING!”: press very fast, several times.</li></ul></li><li><strong>Rating</strong>:<ul><li>Perfect: within 0.06 s;</li><li>Good: within 0.15 s;</li><li>Okay: within 0.22 s;</li><li>beyond that: Miss.</li></ul></li><li><strong>How it plays out</strong>: the song is split into sequences. Depending on your score on each sequence, your allies attack Camazotz, or he hits the party (fireballs, swarm, shockwave).</li><li><strong>Camazotz at the end of his strength</strong>: if his 11 000 HP run out before the end, he stays at 1 HP. The music goes on, but he no longer attacks or summons anything, and any burns, poisons and curses in progress disappear. He dies in his bat swarm on the last note. Play to the end anyway: your final tally (perfect, good, okay, missed) is then shown in the credits.</li><li><strong>Pause</strong>: Esc or P (the key is shown in the top left of the screen).</li><li><strong>Defeat</strong>: if the whole party falls (“The crew collapses...”), or if the song ends with Camazotz still standing (“End of the song!”), the results screen offers “Replay” and a gentler mode. The mode you choose is kept with the save:<ul><li>Normal: the fight as it is.</li><li>Lenient: wider timing windows, softer hold and mash notes.</li><li>Simplified: like Lenient, but any arrow works for every note. You can still lose.</li><li>Story: every sequence counts as passed. The party never falls, and Camazotz falls at the end of the song.</li></ul></li><li><strong>Reward</strong>: victory starts the escape from Xibalba.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "Chapter 6 Caught Red-Handed Mini-games Rhythm battle against Camazotz (phase 3) Rules : the notes scroll towards a target. Press the matching movement arrow (up, down, left, right) at the right moment. There are three types of notes: single notes; hold notes: keep the key pressed until the end; mash notes, announced by “BLUDGEONING!”: press very fast, several times. Rating : Perfect: within 0.06 s; Good: within 0.15 s; Okay: within 0.22 s; beyond that: Miss. How it plays out : the song is split into sequences. Depending on your score on each sequence, your allies attack Camazotz, or he hits the party (fireballs, swarm, shockwave). Camazotz at the end of his strength : if his 11 000 HP run out before the end, he stays at 1 HP. The music goes on, but he no longer attacks or summons anything, and any burns, poisons and curses in progress disappear. He dies in his bat swarm on the last note. Play to the end anyway: your final tally (perfect, good, okay, missed) is then shown in the credits. Pause : Esc or P (the key is shown in the top left of the screen). Defeat : if the whole party falls (“The crew collapses...”), or if the song ends with Camazotz still standing (“End of the song!”), the results screen offers “Replay” and a gentler mode. The mode you choose is kept with the save: Normal: the fight as it is. Lenient: wider timing windows, softer hold and mash notes. Simplified: like Lenient, but any arrow works for every note. You can still lose. Story: every sequence counts as passed. The party never falls, and Camazotz falls at the end of the song. Reward : victory starts the escape from Xibalba.", "sol": 0}, {"titre": "Timed escape", "html": "<p>See the “Escape Xibalba before it all collapses.” objective: 50 seconds for the whole route, unlimited retries.</p>", "id": "c6-fuite-chronometree", "texte": "Chapter 6 Caught Red-Handed Mini-games Timed escape See the “Escape Xibalba before it all collapses.” objective: 50 seconds for the whole route, unlimited retries.", "sol": 0}]}, {"titre": "Don't miss", "intro": "", "entrees": [{"titre": "Don't miss", "html": "<ul><li><strong>Red gem (2nd Bolon Tiku gem)</strong>, at the Kuxtal hearth: the story won't move on without it.</li><li><strong>Journal no. 5</strong> (Kuxtal steles) and the <strong>Research journal</strong> (east camp in the temple). They are two of the seven journals for the “Not like I can read anyway” achievement.</li><li><strong>Sacred Jade of Kuxtal</strong> (hidden): in the slab room, step on <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong> in a row. To repeat slab 4, step off it and back on. It works whether the door is open or not.<ul><li>A glow appears on the eye of the serpent head, in the west of the room, between the large grey slab and the green slab. Walk over it to pick up the jade.</li><li>Effect: the jade doesn't go into the inventory; it permanently unlocks a skill (“Skill unlocked: Special Pebble Throw”). The Numpties' Pebble Throw then deals 8 damage plus half their ATK, minus the target's DEF, with a one-in-two chance of bouncing onto another enemy.</li><li>If you don't have it, the preacher on the bridge scolds you for it.</li><li>If you miss it: the temple collapses at the end of the chapter, but the jade can then be bought at the Kuxtal arena shop (1000 tokens).</li></ul></li><li><strong>West camp</strong> and <strong>Mimics</strong>: the consumables and XP are only available during the chapter. After the escape, the temple is closed (“It has all collapsed, there's no going back in.”).</li><li><strong>Point of no return</strong>: the top door of the pirate camp. After that, you can't get out of the volcano, except through the blue glow at the end of the bridge after a defeat against Camazotz.</li><li><strong>The carved fox</strong> (optional): in the west of Kuxtal, Barbe-Yeux straightens a little statue wedged under a stone. There's no immediate reward (the figurine comes in the post-game).</li><li><strong>Achievements</strong>:<ul><li>“Tavern?” unlocks at the start of the end credits, if you have the five end-of-chapter achievements for chapters 1 to 5. Chapter 6 has no achievement of its own.</li><li>“An enlightened man”: every torch bought, which also opens the fight against Kerwin.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "Chapter 6 Caught Red-Handed Don't miss Don't miss Red gem (2nd Bolon Tiku gem) , at the Kuxtal hearth: the story won't move on without it. Journal no. 5 (Kuxtal steles) and the Research journal (east camp in the temple). They are two of the seven journals for the “Not like I can read anyway” achievement. Sacred Jade of Kuxtal (hidden): in the slab room, step on 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 in a row. To repeat slab 4, step off it and back on. It works whether the door is open or not. A glow appears on the eye of the serpent head, in the west of the room, between the large grey slab and the green slab. Walk over it to pick up the jade. Effect: the jade doesn't go into the inventory; it permanently unlocks a skill (“Skill unlocked: Special Pebble Throw”). The Numpties' Pebble Throw then deals 8 damage plus half their ATK, minus the target's DEF, with a one-in-two chance of bouncing onto another enemy. If you don't have it, the preacher on the bridge scolds you for it. If you miss it: the temple collapses at the end of the chapter, but the jade can then be bought at the Kuxtal arena shop (1000 tokens). West camp and Mimics : the consumables and XP are only available during the chapter. After the escape, the temple is closed (“It has all collapsed, there's no going back in.”). Point of no return : the top door of the pirate camp. After that, you can't get out of the volcano, except through the blue glow at the end of the bridge after a defeat against Camazotz. The carved fox (optional): in the west of Kuxtal, Barbe-Yeux straightens a little statue wedged under a stone. There's no immediate reward (the figurine comes in the post-game). Achievements : “Tavern?” unlocks at the start of the end credits, if you have the five end-of-chapter achievements for chapters 1 to 5. Chapter 6 has no achievement of its own. “An enlightened man”: every torch bought, which also opens the fight against Kerwin.", "sol": 0}]}]}], "de": [{"id": "c6", "num": "Kapitel 6", "titre": "Auf frischer Tat", "intro": "<p>Der Krabbenkönig, jetzt Znippy getauft, hat sich der Mannschaft angeschlossen. Es gilt, Itzel wiederzufinden und Nadaillac daran zu hindern, das Tor der Bolon Tiku zu öffnen. Der Weg führt durch eine Gefängniszelle, über die verlorene Insel Kuxtal und dann in den Tempel tief unter der Vulkaninsel.</p><aside class=\"note\"><p>Hinweis: Die Titelkarte „Kapitel 6 — Auf frischer Tat“ erscheint erst bei der Verhaftung. Die ersten beiden Ziele unten spielst du davor.</p></aside>", "sections": [{"titre": "Hauptquest", "intro": "", "entrees": [{"titre": "Einen Plan schmieden (in der Taverne der Krabbeninsel).", "html": "<ol><li>Nachdem du den Krabbenkönig angeworben hast, betritt die Taverne der Krabbeninsel.</li><li>Automatische Szene: Barbe-Yeux, die zwei Trottel und Znippy ziehen Bilanz. Barbe-Yeux begreift, dass der alte Gefangene aus Nassau (der, der „nach Pisse riecht“) aus Kuxtal stammt.</li><li>Seine LP und seine Energie werden voll aufgefüllt. Neues Ziel: sich verhaften lassen, um mit ihm zu reden.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Einen Plan schmieden (in der Taverne der Krabbeninsel). Nachdem du den Krabbenkönig angeworben hast, betritt die Taverne der Krabbeninsel. Automatische Szene: Barbe-Yeux, die zwei Trottel und Znippy ziehen Bilanz. Barbe-Yeux begreift, dass der alte Gefangene aus Nassau (der, der „nach Pisse riecht“) aus Kuxtal stammt. Seine LP und seine Energie werden voll aufgefüllt. Neues Ziel: sich verhaften lassen, um mit ihm zu reden.", "sol": 0}, {"titre": "Einen Weg finden, sich verhaften zu lassen.", "html": "<p>Drei Spuren sind möglich. <strong>Nur eine funktioniert: Kerwins Laden abbrennen.</strong></p><ol><li><strong>Die Museumswachen in Nassau</strong> (optional, nur einmal): Geh vor dem Museum zu Marcel und Poulichard, tagsüber oder nachts. Barbe-Yeux provoziert sie, ein Kampf beginnt. Besonderheit: Der Trottel – Keilerkönig wechselt in der ersten Runde ins gegnerische Lager, der Trottel – Olympionike folgt ihm in der zweiten. Sie greifen mit dem Ruder an (der Olympionike verfehlt nie, der Keilerkönig kann verfehlen). Ob gewonnen oder verloren, die Szene geht gleich weiter. Die Wachen weigern sich, dich zu verhaften, aber ein Sieg bringt viele EP. Das Ziel ändert sich nicht: Es ist eine falsche Spur.</li><li><strong>Der Tavernenüberfall</strong> (optional, nur einmal): Die erste Taverne, die du betrittst (Krabbeninsel, Affeninsel, Nassau oder Windinsel), zeigt eine kleine Überfallszene. Niemand ruft die Wache, dann öffnet sich das normale Menü der Taverne.</li><li><strong>Kerwins Fackelladen</strong> (Affeninsel, Windinsel oder Nassau): Sprich mit dem Verkäufer. Ein Menü öffnet sich:<ul><li>„Gehen“: Du gehst wieder, die Szene kommt beim nächsten Besuch erneut.</li><li>„Entschuldigen und eine Fackel kaufen“: normaler Laden.</li><li><strong>„Alles abfackeln“</strong>: Der Laden fängt Feuer.</li></ul></li></ol><p><strong>Lösung:</strong> Wähle bei Kerwin <strong>„Alles abfackeln“</strong>.</p><p>Danach:</p><ul><li>Die Titelkarte von Kapitel 6 erscheint, dann wacht Barbe-Yeux mit dem alten Gefangenen in einer Zelle auf.</li><li>Der Alte bestätigt, dass Itzel aus Kuxtal stammt, und trägt die Lage der Insel auf deiner Karte ein.</li><li>Eine Wache lässt dich frei: Der Laden war nicht genehmigt. Die Weltkarte öffnet sich direkt vom Gefängnis aus. Das einzige angebotene Ziel ist Kuxtal.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Einen Weg finden, sich verhaften zu lassen. Drei Spuren sind möglich. Nur eine funktioniert: Kerwins Laden abbrennen. Die Museumswachen in Nassau (optional, nur einmal): Geh vor dem Museum zu Marcel und Poulichard, tagsüber oder nachts. Barbe-Yeux provoziert sie, ein Kampf beginnt. Besonderheit: Der Trottel – Keilerkönig wechselt in der ersten Runde ins gegnerische Lager, der Trottel – Olympionike folgt ihm in der zweiten. Sie greifen mit dem Ruder an (der Olympionike verfehlt nie, der Keilerkönig kann verfehlen). Ob gewonnen oder verloren, die Szene geht gleich weiter. Die Wachen weigern sich, dich zu verhaften, aber ein Sieg bringt viele EP. Das Ziel ändert sich nicht: Es ist eine falsche Spur. Der Tavernenüberfall (optional, nur einmal): Die erste Taverne, die du betrittst (Krabbeninsel, Affeninsel, Nassau oder Windinsel), zeigt eine kleine Überfallszene. Niemand ruft die Wache, dann öffnet sich das normale Menü der Taverne. Kerwins Fackelladen (Affeninsel, Windinsel oder Nassau): Sprich mit dem Verkäufer. Ein Menü öffnet sich: „Gehen“: Du gehst wieder, die Szene kommt beim nächsten Besuch erneut. „Entschuldigen und eine Fackel kaufen“: normaler Laden. „Alles abfackeln“ : Der Laden fängt Feuer. Lösung: Wähle bei Kerwin „Alles abfackeln“ . Danach: Die Titelkarte von Kapitel 6 erscheint, dann wacht Barbe-Yeux mit dem alten Gefangenen in einer Zelle auf. Der Alte bestätigt, dass Itzel aus Kuxtal stammt, und trägt die Lage der Insel auf deiner Karte ein. Eine Wache lässt dich frei: Der Laden war nicht genehmigt. Die Weltkarte öffnet sich direkt vom Gefängnis aus. Das einzige angebotene Ziel ist Kuxtal.", "sol": 1}, {"titre": "Nach Kuxtal reisen.", "html": "<ol><li>Segle auf der Weltkarte bis nach Kuxtal.</li><li>Keine Musik auf der Insel, nur der Wind und das Meer. Bei der Ankunft unterhält sich die Gruppe (automatische Szene).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Nach Kuxtal reisen. Segle auf der Weltkarte bis nach Kuxtal. Keine Musik auf der Insel, nur der Wind und das Meer. Bei der Ankunft unterhält sich die Gruppe (automatische Szene).", "sol": 0}, {"titre": "Die Ruinen von Kuxtal erkunden.", "html": "<ol><li>Geh zur <strong>Feuerstelle</strong> in der Mitte des Nordens der Insel (nördlich des Landeplatzes, etwa in der Mitte). Interagiere damit.</li><li>Ein Feuer wurde erstickt, und ein blutbefleckter Stoff ist an einen Stock geknotet. Du bekommst den <strong>2. Edelstein der Bolon Tiku</strong> (den roten Edelstein, den Itzel bei sich hatte).</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Die Ruinen von Kuxtal erkunden. Geh zur Feuerstelle in der Mitte des Nordens der Insel (nördlich des Landeplatzes, etwa in der Mitte). Interagiere damit. Ein Feuer wurde erstickt, und ein blutbefleckter Stoff ist an einen Stock geknotet. Du bekommst den 2. Edelstein der Bolon Tiku (den roten Edelstein, den Itzel bei sich hatte).", "sol": 0}, {"titre": "Die Vergangenheit von Kuxtal ergründen.", "html": "<p>Lies die vier Stelen („Lesen“), in beliebiger Reihenfolge. Der Zähler „Gelesene Stelen: x / 4“ erscheint unter dem Ziel.</p><div class=\"tab\"><table><thead><tr><th>Stele</th><th>Fundort</th></tr></thead><tbody><tr><td>Stele 1</td><td>Im Osten, nahe dem großen heiligen Baum</td></tr><tr><td>Stele 2</td><td>Im Südwesten, nahe der Südküste</td></tr><tr><td>Stele 3</td><td>Im Nordwesten</td></tr><tr><td>Stele 4</td><td>Im Nordosten</td></tr></tbody></table></div><ul><li>Die erste gelesene Stele gibt dir das <strong>Tagebuch Nr. 5</strong>. Jede weitere Stele fügt einen Eintrag hinzu, immer in der Reihenfolge der Erzählung eingeordnet.</li><li>Du kannst die Stelen lesen, bevor du die Feuerstelle besucht hast. Die Auflösung kommt erst, wenn beides erledigt ist.</li><li>Wenn alles gelesen und das Tagebuch geschlossen ist, zieht Barbe-Yeux seine Schlüsse. Die <strong>Vulkaninsel</strong> erscheint auf der Weltkarte.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Die Vergangenheit von Kuxtal ergründen. Lies die vier Stelen („Lesen“), in beliebiger Reihenfolge. Der Zähler „Gelesene Stelen: x / 4“ erscheint unter dem Ziel. Stele Fundort Stele 1 Im Osten, nahe dem großen heiligen Baum Stele 2 Im Südwesten, nahe der Südküste Stele 3 Im Nordwesten Stele 4 Im Nordosten Die erste gelesene Stele gibt dir das Tagebuch Nr. 5 . Jede weitere Stele fügt einen Eintrag hinzu, immer in der Reihenfolge der Erzählung eingeordnet. Du kannst die Stelen lesen, bevor du die Feuerstelle besucht hast. Die Auflösung kommt erst, wenn beides erledigt ist. Wenn alles gelesen und das Tagebuch geschlossen ist, zieht Barbe-Yeux seine Schlüsse. Die Vulkaninsel erscheint auf der Weltkarte.", "sol": 0}, {"titre": "Zur Vulkaninsel reisen.", "html": "<ol><li>Segle bis zur Vulkaninsel. Sobald du an Land gehst, startet eine automatische Szene: Nadaillac ruft die Gruppe an, Barbe-Yeux geht auf den Tempel zu und stolpert unterwegs.</li><li>Zwischensequenz: Nadaillac hält Itzel in Schach und verletzt einen der Trottel. Znippy gesteht, dass ihr die Edelsteine habt, und Barbe-Yeux tauscht sie gegen Itzel. <strong>Alle Edelsteine der Bolon Tiku verschwinden aus deinem Inventar.</strong> Nadaillac bricht sofort sein Wort und hetzt seine Skelette los.</li><li><strong>Kampf gegen Nadaillacs Skelette</strong> (5 Skelette). Deine Gruppe: Barbe-Yeux, der Trottel – Keilerkönig und der Krabbenkönig, ohne sein Ultimate. Wenn du verlierst, beginnt der Kampf sofort von vorn, mit vollen LP und voller Energie.</li><li>Medaillon-Zwischensequenz (nicht überspringbar). Der Tempel erwacht, Znippy befreit Itzel. Itzel schließt sich der Gruppe an und schlägt „einen anderen Weg“ vor.</li><li>Du übernimmst wieder die Steuerung im Piratenlager des Tempels (die Caldera). Ab hier folgt dir die ganze Gruppe: die zwei Trottel, Itzel und Znippy.</li></ol><p>Um die Insel zu verlassen, nimm das Boot im Süden der Insel („An Bord gehen“ / „Bleiben“).</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Zur Vulkaninsel reisen. Segle bis zur Vulkaninsel. Sobald du an Land gehst, startet eine automatische Szene: Nadaillac ruft die Gruppe an, Barbe-Yeux geht auf den Tempel zu und stolpert unterwegs. Zwischensequenz: Nadaillac hält Itzel in Schach und verletzt einen der Trottel. Znippy gesteht, dass ihr die Edelsteine habt, und Barbe-Yeux tauscht sie gegen Itzel. Alle Edelsteine der Bolon Tiku verschwinden aus deinem Inventar. Nadaillac bricht sofort sein Wort und hetzt seine Skelette los. Kampf gegen Nadaillacs Skelette (5 Skelette). Deine Gruppe: Barbe-Yeux, der Trottel – Keilerkönig und der Krabbenkönig, ohne sein Ultimate. Wenn du verlierst, beginnt der Kampf sofort von vorn, mit vollen LP und voller Energie. Medaillon-Zwischensequenz (nicht überspringbar). Der Tempel erwacht, Znippy befreit Itzel. Itzel schließt sich der Gruppe an und schlägt „einen anderen Weg“ vor. Du übernimmst wieder die Steuerung im Piratenlager des Tempels (die Caldera). Ab hier folgt dir die ganze Gruppe: die zwei Trottel, Itzel und Znippy. Um die Insel zu verlassen, nimm das Boot im Süden der Insel („An Bord gehen“ / „Bleiben“).", "sol": 0}, {"titre": "Einen Weg ins Herz des Vulkans finden.", "html": "<p><strong>1. Das Piratenlager (erster Raum des Tempels)</strong></p><ul><li>Du kommst unten in den Raum. Die Tür, die weiterführt, ist oben in der Mitte.</li><li><strong>Ostlager</strong> (Mitte rechts, 6 Piraten): <strong>Pflicht</strong>. Der Sieg bringt dir das <strong>Forschungstagebuch</strong>, das sich sofort öffnet, dazu 3 Bier und ein Schiffbrüchigen-Frikassee.</li><li><strong>Westlager</strong> (links, 4 Piraten): optional. Es bringt 2 Bier und ein Famoses Fischfilet.</li><li>Solange du das Forschungstagebuch nicht hast, bleibt die obere Tür zu. Barbe-Yeux sagt dann: „Diese Piraten verbergen etwas…“.</li><li>Wenn du durch die obere Tür gehst, fragt das Spiel nach einer Bestätigung („Sie betreten die Endphase…“): <strong>Das ist der Punkt ohne Wiederkehr.</strong> Wenn du annimmst, führt die untere Tür des Plattenraums nicht mehr zum Lager zurück, und das Tempeltor auf der Insel öffnet sich nicht mehr. Triff deine Vorbereitungen vorher (Westlager, Einkäufe, Heilung).</li><li>Nach dem Punkt ohne Wiederkehr kannst du noch vom Schatzraum in den Plattenraum zurück, aber nicht vom Labyrinth in den Schatzraum.</li><li><strong>Niederlage im Tempel</strong> (Lager, Wächter, Mimics, Geister): Du wachst in der Taverne der Krabbeninsel auf, mit vollen LP und voller Energie. Nach dem Punkt ohne Wiederkehr <strong>speichere vor jedem Kampf</strong> und lade bei einer Niederlage neu: Das Tempeltor bleibt von der Insel aus verschlossen.</li></ul><p><strong>2. Der Plattenraum (zweiter Raum, im Dunkeln)</strong> Alle zünden ihre Fackel an. Im Raum gibt es <strong>vier Platten</strong> am Boden und einen Brunnen in der Mitte.</p><div class=\"tab\"><table><thead><tr><th>Platte</th><th>Aussehen</th><th>Lage</th></tr></thead><tbody><tr><td>1</td><td>Kleine graue Platte</td><td>Nordosten</td></tr><tr><td>2</td><td>Mittlere <strong>grüne</strong> Platte</td><td>Westen, in der unteren Hälfte</td></tr><tr><td>3</td><td>Mittlere <strong>rosa</strong> Platte</td><td>Osten, in der unteren Hälfte</td></tr><tr><td>4</td><td>Große graue Platte</td><td>Nordwesten</td></tr></tbody></table></div><p><em>a) Die Räume der Wächter.</em> Jedes Mal, wenn du auf eine andere Platte als die vorige trittst, öffnet sich einer der vier oberen Räume, und <strong>zwei Wächter</strong> greifen dich an. Es gibt also insgesamt 4 Kämpfe.</p><ul><li>Der erste Wächter teleportiert sich vor sein Ziel und schlägt einmal zu.</li><li>Der zweite schlägt dreimal hintereinander auf zufällige Ziele.</li></ul><p>Wenn du verlierst, zählt der Raum nicht und öffnet sich später erneut. Die Wächter, wie auch die Mimics und die Geister weiter hinten, schlagen bevorzugt einen Trottel, der provoziert (Rolle). Nach dem 4. Kampf füllt sich der Brunnen in der Mitte: „Regenerieren“ füllt LP und Energie voll auf, unbegrenzt.</p><p><em>b) Die Tür.</em> Das Forschungstagebuch zeigt eine Folge von sechs Masken. Zu jeder gehört eine Maya-Ziffer aus 1 bis 6 Punkten und Strichen, die die Reihenfolge angibt. Farbe und Größe jeder Maske stehen für eine Platte: groß grau = Platte 4, grün = Platte 2, rosa = Platte 3, klein grau = Platte 1.</p><p><strong>Lösung:</strong> Tritt in der Reihenfolge <strong>4 – 2 – 3 – 4 – 3 – 1</strong> auf die Platten, also: große graue, grüne, rosa, große graue, rosa, kleine graue.</p><ul><li>Nur ein neuer Tritt zählt: Eine Platte bleibt gedrückt, solange jemand darauf steht, auch ein Gruppenmitglied, das dir folgt.</li><li>Das Spiel merkt sich nur die <strong>letzten 6 Tritte</strong>. Wenn du dich vertust, fang die Folge einfach von vorn an.</li><li>Tipp: Der Sanduhr-Button unten rechts schaltet in den <strong>Koop-Modus</strong>. Barbe-Yeux, die zwei Trottel und Itzel bleiben dann, wo sie sind, und du bewegst immer nur einen von ihnen. Znippy ist nicht spielbar: Er folgt immer Barbe-Yeux und kann hinter ihm eine Platte drücken. Am sichersten: Lass Barbe-Yeux (und damit Znippy) weit weg von den Platten und mach die Folge mit einem Trottel oder Itzel.</li><li>Die richtige Folge öffnet die obere Tür und führt die Gruppe wieder zusammen.</li></ul><p><strong>3. Der Schatzraum (dritter Raum)</strong></p><ul><li>In der großen Halle oben stehen 30 Truhen in <strong>3 Reihen zu je 10</strong>. Geh zu einer Truhe und wähle „Öffnen“.</li><li>Alle Truhen außer einer sind <strong>Mimics</strong>: ein einzelner, sehr zäher Gegner, der pro Runde drei Ziele beißt. Flucht unmöglich. Jeder besiegte Mimic gibt 1 bis 3 Verbrauchsgegenstände und viele EP. Eine geöffnete Truhe bleibt offen: Ein verlorener Mimic kommt nicht wieder, und seine Beute ist weg.</li><li>Hinweis: Wenn du an der oberen Wand entlanggehst, streicht langsam ein Licht durch den Raum. Es enthüllt zwei eingravierte Figuren, jede mit einer grünen Maya-Ziffer: <strong>2 Punkte</strong> (= 2) links, <strong>ein Strich und 4 Punkte</strong> (= 9) rechts.</li></ul><p><strong>Lösung:</strong> Öffne die Truhe in der <strong>2. Reihe</strong> (der mittleren), <strong>die 9. von links</strong> (die vorletzte rechts). Sie öffnet die hintere Tür, oben in der Mitte.</p><p><strong>4. Das Labyrinth der Geister (vierter Raum)</strong></p><ul><li>Beim Hineingehen wird alles schwarz. Gelächter bricht aus, und in der Dunkelheit leuchten Augen auf (Zwischensequenz).</li><li>Itzel setzt ihre Maske auf und <strong>übernimmt die Führung</strong>. Der leuchtende Weg ist nur um sie herum sichtbar, im Takt eines Herzschlags. Gespenster irren durch die Gänge, sind aber harmlos.</li><li>Eine Geistergruppe in der Mitte des Raums ist <strong>Pflicht</strong>, sie liegt auf dem Weg: Poom, Jo'oche' und Nikte’.<ul><li>Poom vergiftet die ganze Gruppe.</li><li>Jo'oche' verflucht pro Runde eine Figur. Das Ziel stirbt, wenn Jo'oche' dreimal erneut am Zug war, außer Jo'oche' fällt vorher. <strong>Töte Jo'oche' zuerst.</strong></li><li>Nikte’ stößt einen Schrei aus, der die ganze Gruppe verletzt. Er schlägt hart zu, hat aber wenig LP.</li></ul></li><li>Vier weitere, optionale Geistergruppen warten in den Ecken: Nordwesten, Westen, Osten und Nordosten. Jeder besiegte Geist gibt einen zufälligen Verbrauchsgegenstand.</li><li><strong>Route</strong>: Geh vom Eingang (unten in der Mitte) hinauf bis zur Mitte (Kampf). Geh dann nach Westen, schlängle dich nach Norden bis zum Gang im Nordwesten und geh dann wieder nach Osten. Geh ein Stück hinunter und dann über einen langen Gang auf halber Höhe nach Osten. Geh auf der Ostseite hinunter und dann den ganzen Ostrand hinauf bis nach oben. Geh schließlich nach Westen bis zur Tür oben in der Mitte.</li><li>Die Tür oben in der Mitte öffnet sich von selbst, wenn du davorstehst.</li></ul><p><strong>5. Die Brücke (fünfter Raum)</strong></p><ul><li>Keine Dunkelheit mehr: Alle folgen wieder Barbe-Yeux. Geh die lange Brücke nach Norden hinauf.</li><li><strong>Der Alte aus der Grotte</strong> (der von der Affeninsel) versperrt dir den Weg („IHR… KOMMT NICHT VORBEI… NICHT!“). Geh auf ihn zu: Szene mit Rückblende, dann lässt er dich durch. Geh rechts an ihm vorbei.</li><li>Weiter oben macht <strong>der Prediger</strong> von Morro Blanco dasselbe: Szene, Rückblende, Durchgang.</li><li>Ganz oben, rechts vom Ausgang, bietet ein <strong>Brunnen</strong> „Regenerieren“ an (LP und Energie voll).</li><li><strong>Heil dich und bereite dich hier vor</strong>: Der nächste Raum führt direkt zum Endboss.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Einen Weg ins Herz des Vulkans finden. 1. Das Piratenlager (erster Raum des Tempels) Du kommst unten in den Raum. Die Tür, die weiterführt, ist oben in der Mitte. Ostlager (Mitte rechts, 6 Piraten): Pflicht . Der Sieg bringt dir das Forschungstagebuch , das sich sofort öffnet, dazu 3 Bier und ein Schiffbrüchigen-Frikassee. Westlager (links, 4 Piraten): optional. Es bringt 2 Bier und ein Famoses Fischfilet. Solange du das Forschungstagebuch nicht hast, bleibt die obere Tür zu. Barbe-Yeux sagt dann: „Diese Piraten verbergen etwas…“. Wenn du durch die obere Tür gehst, fragt das Spiel nach einer Bestätigung („Sie betreten die Endphase…“): Das ist der Punkt ohne Wiederkehr. Wenn du annimmst, führt die untere Tür des Plattenraums nicht mehr zum Lager zurück, und das Tempeltor auf der Insel öffnet sich nicht mehr. Triff deine Vorbereitungen vorher (Westlager, Einkäufe, Heilung). Nach dem Punkt ohne Wiederkehr kannst du noch vom Schatzraum in den Plattenraum zurück, aber nicht vom Labyrinth in den Schatzraum. Niederlage im Tempel (Lager, Wächter, Mimics, Geister): Du wachst in der Taverne der Krabbeninsel auf, mit vollen LP und voller Energie. Nach dem Punkt ohne Wiederkehr speichere vor jedem Kampf und lade bei einer Niederlage neu: Das Tempeltor bleibt von der Insel aus verschlossen. 2. Der Plattenraum (zweiter Raum, im Dunkeln) Alle zünden ihre Fackel an. Im Raum gibt es vier Platten am Boden und einen Brunnen in der Mitte. Platte Aussehen Lage 1 Kleine graue Platte Nordosten 2 Mittlere grüne Platte Westen, in der unteren Hälfte 3 Mittlere rosa Platte Osten, in der unteren Hälfte 4 Große graue Platte Nordwesten a) Die Räume der Wächter. Jedes Mal, wenn du auf eine andere Platte als die vorige trittst, öffnet sich einer der vier oberen Räume, und zwei Wächter greifen dich an. Es gibt also insgesamt 4 Kämpfe. Der erste Wächter teleportiert sich vor sein Ziel und schlägt einmal zu. Der zweite schlägt dreimal hintereinander auf zufällige Ziele. Wenn du verlierst, zählt der Raum nicht und öffnet sich später erneut. Die Wächter, wie auch die Mimics und die Geister weiter hinten, schlagen bevorzugt einen Trottel, der provoziert (Rolle). Nach dem 4. Kampf füllt sich der Brunnen in der Mitte: „Regenerieren“ füllt LP und Energie voll auf, unbegrenzt. b) Die Tür. Das Forschungstagebuch zeigt eine Folge von sechs Masken. Zu jeder gehört eine Maya-Ziffer aus 1 bis 6 Punkten und Strichen, die die Reihenfolge angibt. Farbe und Größe jeder Maske stehen für eine Platte: groß grau = Platte 4, grün = Platte 2, rosa = Platte 3, klein grau = Platte 1. Lösung: Tritt in der Reihenfolge 4 – 2 – 3 – 4 – 3 – 1 auf die Platten, also: große graue, grüne, rosa, große graue, rosa, kleine graue. Nur ein neuer Tritt zählt: Eine Platte bleibt gedrückt, solange jemand darauf steht, auch ein Gruppenmitglied, das dir folgt. Das Spiel merkt sich nur die letzten 6 Tritte . Wenn du dich vertust, fang die Folge einfach von vorn an. Tipp: Der Sanduhr-Button unten rechts schaltet in den Koop-Modus . Barbe-Yeux, die zwei Trottel und Itzel bleiben dann, wo sie sind, und du bewegst immer nur einen von ihnen. Znippy ist nicht spielbar: Er folgt immer Barbe-Yeux und kann hinter ihm eine Platte drücken. Am sichersten: Lass Barbe-Yeux (und damit Znippy) weit weg von den Platten und mach die Folge mit einem Trottel oder Itzel. Die richtige Folge öffnet die obere Tür und führt die Gruppe wieder zusammen. 3. Der Schatzraum (dritter Raum) In der großen Halle oben stehen 30 Truhen in 3 Reihen zu je 10 . Geh zu einer Truhe und wähle „Öffnen“. Alle Truhen außer einer sind Mimics : ein einzelner, sehr zäher Gegner, der pro Runde drei Ziele beißt. Flucht unmöglich. Jeder besiegte Mimic gibt 1 bis 3 Verbrauchsgegenstände und viele EP. Eine geöffnete Truhe bleibt offen: Ein verlorener Mimic kommt nicht wieder, und seine Beute ist weg. Hinweis: Wenn du an der oberen Wand entlanggehst, streicht langsam ein Licht durch den Raum. Es enthüllt zwei eingravierte Figuren, jede mit einer grünen Maya-Ziffer: 2 Punkte (= 2) links, ein Strich und 4 Punkte (= 9) rechts. Lösung: Öffne die Truhe in der 2. Reihe (der mittleren), die 9. von links (die vorletzte rechts). Sie öffnet die hintere Tür, oben in der Mitte. 4. Das Labyrinth der Geister (vierter Raum) Beim Hineingehen wird alles schwarz. Gelächter bricht aus, und in der Dunkelheit leuchten Augen auf (Zwischensequenz). Itzel setzt ihre Maske auf und übernimmt die Führung . Der leuchtende Weg ist nur um sie herum sichtbar, im Takt eines Herzschlags. Gespenster irren durch die Gänge, sind aber harmlos. Eine Geistergruppe in der Mitte des Raums ist Pflicht , sie liegt auf dem Weg: Poom, Jo'oche' und Nikte’. Poom vergiftet die ganze Gruppe. Jo'oche' verflucht pro Runde eine Figur. Das Ziel stirbt, wenn Jo'oche' dreimal erneut am Zug war, außer Jo'oche' fällt vorher. Töte Jo'oche' zuerst. Nikte’ stößt einen Schrei aus, der die ganze Gruppe verletzt. Er schlägt hart zu, hat aber wenig LP. Vier weitere, optionale Geistergruppen warten in den Ecken: Nordwesten, Westen, Osten und Nordosten. Jeder besiegte Geist gibt einen zufälligen Verbrauchsgegenstand. Route : Geh vom Eingang (unten in der Mitte) hinauf bis zur Mitte (Kampf). Geh dann nach Westen, schlängle dich nach Norden bis zum Gang im Nordwesten und geh dann wieder nach Osten. Geh ein Stück hinunter und dann über einen langen Gang auf halber Höhe nach Osten. Geh auf der Ostseite hinunter und dann den ganzen Ostrand hinauf bis nach oben. Geh schließlich nach Westen bis zur Tür oben in der Mitte. Die Tür oben in der Mitte öffnet sich von selbst, wenn du davorstehst. 5. Die Brücke (fünfter Raum) Keine Dunkelheit mehr: Alle folgen wieder Barbe-Yeux. Geh die lange Brücke nach Norden hinauf. Der Alte aus der Grotte (der von der Affeninsel) versperrt dir den Weg („IHR… KOMMT NICHT VORBEI… NICHT!“). Geh auf ihn zu: Szene mit Rückblende, dann lässt er dich durch. Geh rechts an ihm vorbei. Weiter oben macht der Prediger von Morro Blanco dasselbe: Szene, Rückblende, Durchgang. Ganz oben, rechts vom Ausgang, bietet ein Brunnen „Regenerieren“ an (LP und Energie voll). Heil dich und bereite dich hier vor : Der nächste Raum führt direkt zum Endboss.", "sol": 2}, {"titre": "Tiefer nach Xibalba vordringen.", "html": "<ol><li>Zwischensequenz am <strong>Medaillontor</strong>: Nadaillac steht vor dem Tor, Itzel ruft „Halt!“. Nadaillac öffnet das Tor mit dem Medaillon, ohne dass du etwas tun musst.</li><li>„Folgen wir ihnen.“: Die Gruppe geht von selbst weiter und betritt den Hort.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Tiefer nach Xibalba vordringen. Zwischensequenz am Medaillontor : Nadaillac steht vor dem Tor, Itzel ruft „Halt!“. Nadaillac öffnet das Tor mit dem Medaillon, ohne dass du etwas tun musst. „Folgen wir ihnen.“: Die Gruppe geht von selbst weiter und betritt den Hort.", "sol": 0}, {"titre": "Camazotz die Stirn bieten.", "html": "<p>Der Endkampf besteht aus drei Phasen hintereinander.</p><p><strong>Wenn du in Phase 1 oder 2 verlierst:</strong></p><ul><li>Du wachst am Ende der Brücke vor dem Brunnen auf, mit vollen LP und voller Energie („Camazotz ist noch nicht fertig mit euch!“).</li><li>Geh wieder durch den oberen Ausgang: Der Kampf geht direkt mit der verlorenen Phase weiter, ohne die Szene am Tor.</li><li>Ab der ersten Niederlage erscheinen zwei <strong>blaue Lichter</strong>. Das am Ende der Brücke, links vom Ausgang, gegenüber dem Brunnen, bietet „Zurück zum Boot“ an. Es bringt dich an den Strand der Vulkaninsel, rechts vom Boot. Dort bietet ein weiteres Licht „Zum Ende der Brücke“ an. Du kannst also woanders trainieren oder einkaufen gehen und dann zurückkommen. Die Lichter verschwinden, sobald Camazotz besiegt ist.</li><li>Auf der Schwierigkeit Normal schlägt dir das Spiel bei der 2. Niederlage (und dann bei jeder zweiten) vor, zum <strong>Schwierigkeitsgrad Abenteuer</strong> zu wechseln: erlittener Schaden -20 %, verursachter Schaden +20 %, Heilung +30 %. Antworte mit Ja, um ihn sofort zu aktivieren. Du kannst ihn auch jederzeit unter Einstellungen &gt; Schwierigkeitsgrad ändern.</li></ul><p><strong>Phase 1 — der Herold von Xibalba und Kab'raqan</strong></p><ul><li>Deine Gruppe: Barbe-Yeux, die zwei Trottel, Itzel, <strong>Nadaillac (spielbarer Verbündeter)</strong> und Znippy, ohne sein Ultimate.</li><li>Nadaillac hat drei Fertigkeiten:<ul><li>Säbel: sehr stark.</li><li>Granate: sechs Treffer auf alle Gegner, jede vierte Runde einsetzbar.</li><li>Schuss: zwei Kugeln, du wählst das Ziel jeder Kugel, ohne Nachladen.</li></ul></li><li>Der Herold greift wieder wie im Dschungeltempel an (einschließlich der Geisterbeschwörung). Kab'raqan wiederholt seine erste Phase: Flug, Feuerbälle, Flammenkegel, dann landet er bei halbem Leben.</li></ul><p><strong>Phase 2 — Camazotz</strong></p><ul><li>Camazotz kommt mit 3 Beschwörungen. Er folgt einem festen Zyklus aus 4 Angriffen:<ol><li>Dreifacher Feuerball.</li><li>Fledermausschwarm: zufällige Treffer, dazu die Beschwörung eines Geistes, abwechselnd Jo'oche', Poom und dann Nikte’.</li><li><strong>Schockwelle</strong>: 40, dann 50, dann 120 Schaden für die ganze Gruppe (20 % weniger auf der Schwierigkeit Abenteuer).</li><li>Krallenhieb: zwei zufällige Verbündete, hoher Schaden.</li></ol></li><li>Heil die Gruppe direkt vor der Schockwelle (3. Angriff des Zyklus). Schalte Jo'oche' aus, sobald er auftaucht.</li><li>Wenn Camazotz unter <strong>16.000 LP</strong> fällt:<ul><li>beschwört er 3 weitere Handlanger;</li><li>setzt Znippy sein Ultimate ein und haut dann ab;</li><li><strong>setzt Itzel ihre Maske auf</strong> bis zum Ende des Kampfs: verstärkte Angriffe, und du verteilst die Kugeln ihres Verheerenden Schusses selbst. Ihre Rauchgranate lässt die eingenebelten Gegner dann <strong>75 %</strong> ihrer Angriffe verfehlen (50 % ohne Maske).</li></ul></li><li>Bei <strong>11.000 LP</strong> bricht der Kampf ab: Nadaillac fordert sein Tor, Camazotz tötet ihn und steht wieder auf.</li></ul><p><strong>Phase 3 — der Rhythmuskampf</strong> (siehe Minispiele). Du musst die restlichen 11.000 LP vor dem Ende des Stücks herunterholen. Der Kampf dauert immer bis zur letzten Note. Scheiterst du, spielst du diese Phase sofort erneut (keine Rückkehr zur Brücke).</p>", "id": "c6-affronter-camazotz", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Camazotz die Stirn bieten. Der Endkampf besteht aus drei Phasen hintereinander. Wenn du in Phase 1 oder 2 verlierst: Du wachst am Ende der Brücke vor dem Brunnen auf, mit vollen LP und voller Energie („Camazotz ist noch nicht fertig mit euch!“). Geh wieder durch den oberen Ausgang: Der Kampf geht direkt mit der verlorenen Phase weiter, ohne die Szene am Tor. Ab der ersten Niederlage erscheinen zwei blaue Lichter . Das am Ende der Brücke, links vom Ausgang, gegenüber dem Brunnen, bietet „Zurück zum Boot“ an. Es bringt dich an den Strand der Vulkaninsel, rechts vom Boot. Dort bietet ein weiteres Licht „Zum Ende der Brücke“ an. Du kannst also woanders trainieren oder einkaufen gehen und dann zurückkommen. Die Lichter verschwinden, sobald Camazotz besiegt ist. Auf der Schwierigkeit Normal schlägt dir das Spiel bei der 2. Niederlage (und dann bei jeder zweiten) vor, zum Schwierigkeitsgrad Abenteuer zu wechseln: erlittener Schaden -20 %, verursachter Schaden +20 %, Heilung +30 %. Antworte mit Ja, um ihn sofort zu aktivieren. Du kannst ihn auch jederzeit unter Einstellungen > Schwierigkeitsgrad ändern. Phase 1 — der Herold von Xibalba und Kab'raqan Deine Gruppe: Barbe-Yeux, die zwei Trottel, Itzel, Nadaillac (spielbarer Verbündeter) und Znippy, ohne sein Ultimate. Nadaillac hat drei Fertigkeiten: Säbel: sehr stark. Granate: sechs Treffer auf alle Gegner, jede vierte Runde einsetzbar. Schuss: zwei Kugeln, du wählst das Ziel jeder Kugel, ohne Nachladen. Der Herold greift wieder wie im Dschungeltempel an (einschließlich der Geisterbeschwörung). Kab'raqan wiederholt seine erste Phase: Flug, Feuerbälle, Flammenkegel, dann landet er bei halbem Leben. Phase 2 — Camazotz Camazotz kommt mit 3 Beschwörungen. Er folgt einem festen Zyklus aus 4 Angriffen: Dreifacher Feuerball. Fledermausschwarm: zufällige Treffer, dazu die Beschwörung eines Geistes, abwechselnd Jo'oche', Poom und dann Nikte’. Schockwelle : 40, dann 50, dann 120 Schaden für die ganze Gruppe (20 % weniger auf der Schwierigkeit Abenteuer). Krallenhieb: zwei zufällige Verbündete, hoher Schaden. Heil die Gruppe direkt vor der Schockwelle (3. Angriff des Zyklus). Schalte Jo'oche' aus, sobald er auftaucht. Wenn Camazotz unter 16.000 LP fällt: beschwört er 3 weitere Handlanger; setzt Znippy sein Ultimate ein und haut dann ab; setzt Itzel ihre Maske auf bis zum Ende des Kampfs: verstärkte Angriffe, und du verteilst die Kugeln ihres Verheerenden Schusses selbst. Ihre Rauchgranate lässt die eingenebelten Gegner dann 75 % ihrer Angriffe verfehlen (50 % ohne Maske). Bei 11.000 LP bricht der Kampf ab: Nadaillac fordert sein Tor, Camazotz tötet ihn und steht wieder auf. Phase 3 — der Rhythmuskampf (siehe Minispiele). Du musst die restlichen 11.000 LP vor dem Ende des Stücks herunterholen. Der Kampf dauert immer bis zur letzten Note. Scheiterst du, spielst du diese Phase sofort erneut (keine Rückkehr zur Brücke).", "sol": 0}, {"titre": "Aus Xibalba fliehen, bevor alles einstürzt.", "html": "<ol><li>Der Tempel stürzt ein. Barbe-Yeux reitet auf einem Trottel, Itzel auf dem anderen. Absteigen ist unmöglich.</li><li>Ein <strong>50-Sekunden-Timer</strong> oben rechts gilt für <strong>den gesamten Weg</strong>. Während der Überblendungen zwischen den Räumen ist er pausiert, und unter 10 Sekunden wird er rot.</li><li>Geh den Weg rückwärts, immer zum <strong>Ausgang unten</strong> im jeweiligen Raum: das Medaillontor, die Brücke (geradeaus hinunter), das Labyrinth (derselbe Weg wie auf dem Hinweg, rückwärts), der Schatzraum, der Plattenraum, dann das Lager. Neue Geröllhaufen versperren die Räume. Die herabfallenden Felsen sind nur Optik.</li><li>Wenn der Timer auf null fällt („Zu spät!“), fängst du im Raum mit dem Tor wieder an, mit vollem Timer.</li><li>Abschließender Dialog mit Blick aufs Meer, dann der <strong>Abspann</strong> zum Lied „Le Roi des galères“ (ein Button lässt dich ihn überspringen). An den Seiten ziehen Erinnerungen an das Abenteuer vorbei, mit den Statistiken deines Spielstands: Treffsicherheit gegen Camazotz, Tode, Stürze, verdientes Gold, getrunkene Biere, Nebenquests, Spielzeit… Mitten im Abspann kommt Znippy, bis an die Scheren bewaffnet, unten links vorbei, um sich zu entschuldigen.</li><li>Ein letzter Bildschirm „Danke fürs Spielen!“ bleibt stehen, bis du klickst.</li><li>Danach stehst du vor der Taverne der Krabbeninsel, nur mit Barbe-Yeux und den zwei Trotteln: Wie es weitergeht, steht im Teil Nach dem Spiel.</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "Kapitel 6 Auf frischer Tat Hauptquest Aus Xibalba fliehen, bevor alles einstürzt. Der Tempel stürzt ein. Barbe-Yeux reitet auf einem Trottel, Itzel auf dem anderen. Absteigen ist unmöglich. Ein 50-Sekunden-Timer oben rechts gilt für den gesamten Weg . Während der Überblendungen zwischen den Räumen ist er pausiert, und unter 10 Sekunden wird er rot. Geh den Weg rückwärts, immer zum Ausgang unten im jeweiligen Raum: das Medaillontor, die Brücke (geradeaus hinunter), das Labyrinth (derselbe Weg wie auf dem Hinweg, rückwärts), der Schatzraum, der Plattenraum, dann das Lager. Neue Geröllhaufen versperren die Räume. Die herabfallenden Felsen sind nur Optik. Wenn der Timer auf null fällt („Zu spät!“), fängst du im Raum mit dem Tor wieder an, mit vollem Timer. Abschließender Dialog mit Blick aufs Meer, dann der Abspann zum Lied „Le Roi des galères“ (ein Button lässt dich ihn überspringen). An den Seiten ziehen Erinnerungen an das Abenteuer vorbei, mit den Statistiken deines Spielstands: Treffsicherheit gegen Camazotz, Tode, Stürze, verdientes Gold, getrunkene Biere, Nebenquests, Spielzeit… Mitten im Abspann kommt Znippy, bis an die Scheren bewaffnet, unten links vorbei, um sich zu entschuldigen. Ein letzter Bildschirm „Danke fürs Spielen!“ bleibt stehen, bis du klickst. Danach stehst du vor der Taverne der Krabbeninsel, nur mit Barbe-Yeux und den zwei Trotteln: Wie es weitergeht, steht im Teil Nach dem Spiel.", "sol": 0}]}, {"titre": "Nebenquests", "intro": "<p>In diesem Kapitel startet keine Nebenquest aus dem Journal. Eine optionale Begegnung hängt aber davon ab:</p>", "entrees": [{"titre": "Optionaler Boss: Kerwin – Der Fackelverkäufer", "html": "<ul><li><strong>Auslösung</strong>: Geh zu einem beliebigen Zeitpunkt im Spiel zu Kerwin zurück, sobald du <strong>alle kaufbaren Fackeln</strong> besitzt. Er will sie zurückhaben.</li><li><strong>Kampf</strong>: Kerwin wechselt in einem festen Zyklus seinen Zustand. Die Farbe der Fackeln, die um ihn kreisen, kündigt den nächsten Angriff an:<ol><li>Instabile Fackel (rot-orange), 3 Runden <strong>in der Luft</strong>: 2 geworfene Fackeln pro Runde, Verbrennung. In der Luft treffen ihn Säbel und Ruder nicht.</li><li>Phosphor und Harz (grün): vergiftet ein Ziel.</li><li>Schwarzes Morgengrauen (violett): verflucht ein Ziel, das stirbt, wenn Kerwin dreimal erneut am Zug war, außer er fällt vorher.</li><li>Kompottfackel (orange): verklebt ein Ziel, das seinen Zug verliert.</li><li>Weißer Blitz: blendender Blitz auf die ganze Gruppe.</li><li>Mahagoni Prestige (golden): schwerer Treffer, und er heilt sich.</li></ol></li></ul><p>Außer während der Instabilen Fackel bleibt er <strong>am Boden</strong> und ist im Nahkampf wieder angreifbar.</p><ul><li><strong>Wenn du verlierst</strong>: normale Niederlage. Der Laden bietet danach „Komm und hol dir deinen Anteil, du.“ an, um es erneut zu versuchen.</li><li><strong>Belohnung</strong>: die EP einer ganzen Stufe (auf deiner aktuellen Stufe), und du behältst deine Fackeln („Vor allem auf die aus Mahagoni.“).</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "Kapitel 6 Auf frischer Tat Nebenquests Optionaler Boss: Kerwin – Der Fackelverkäufer Auslösung : Geh zu einem beliebigen Zeitpunkt im Spiel zu Kerwin zurück, sobald du alle kaufbaren Fackeln besitzt. Er will sie zurückhaben. Kampf : Kerwin wechselt in einem festen Zyklus seinen Zustand. Die Farbe der Fackeln, die um ihn kreisen, kündigt den nächsten Angriff an: Instabile Fackel (rot-orange), 3 Runden in der Luft : 2 geworfene Fackeln pro Runde, Verbrennung. In der Luft treffen ihn Säbel und Ruder nicht. Phosphor und Harz (grün): vergiftet ein Ziel. Schwarzes Morgengrauen (violett): verflucht ein Ziel, das stirbt, wenn Kerwin dreimal erneut am Zug war, außer er fällt vorher. Kompottfackel (orange): verklebt ein Ziel, das seinen Zug verliert. Weißer Blitz: blendender Blitz auf die ganze Gruppe. Mahagoni Prestige (golden): schwerer Treffer, und er heilt sich. Außer während der Instabilen Fackel bleibt er am Boden und ist im Nahkampf wieder angreifbar. Wenn du verlierst : normale Niederlage. Der Laden bietet danach „Komm und hol dir deinen Anteil, du.“ an, um es erneut zu versuchen. Belohnung : die EP einer ganzen Stufe (auf deiner aktuellen Stufe), und du behältst deine Fackeln („Vor allem auf die aus Mahagoni.“).", "sol": 0}]}, {"titre": "Minispiele", "intro": "", "entrees": [{"titre": "Rhythmuskampf gegen Camazotz (Phase 3)", "html": "<ul><li><strong>Regeln</strong>: Die Noten laufen auf eine Zielmarke zu. Drück im richtigen Moment die passende Pfeiltaste (oben, unten, links, rechts). Es gibt drei Notenarten:<ul><li>einfache Noten;</li><li><strong>Haltenoten</strong>: Halte die Taste bis zum Ende gedrückt;</li><li><strong>Hämmernoten</strong>, angekündigt durch „KNÜPPELHAGEL!“: Drück sehr schnell und mehrmals.</li></ul></li><li><strong>Bewertung</strong>:<ul><li>Perfekt: unter 0,06 s;</li><li>Gut: unter 0,15 s;</li><li>Geht so: unter 0,22 s;</li><li>darüber: Daneben.</li></ul></li><li><strong>Ablauf</strong>: Das Stück ist in Sequenzen unterteilt. Je nach deiner Punktzahl in jeder Sequenz greifen deine Verbündeten Camazotz an, oder er schlägt die Gruppe (Feuerbälle, Schwarm, Schockwelle).</li><li><strong>Camazotz am Ende seiner Kräfte</strong>: Fallen seine 11.000 LP vor dem Ende, bleibt er bei 1 LP. Die Musik läuft weiter, aber er greift nicht mehr an und beschwört nichts mehr, und laufende Verbrennungen, Gifte und Flüche verschwinden. Er stirbt bei der letzten Note in seinem Fledermausschwarm. Spiel trotzdem bis zum Ende: Deine Schlussbilanz (Perfekt, Gut, Geht so, Daneben) erscheint danach im Abspann.</li><li><strong>Pause</strong>: Esc oder P (die Taste wird oben links auf dem Bildschirm angezeigt).</li><li><strong>Niederlage</strong>: Fällt die ganze Gruppe („Die Crew bricht zusammen...“) oder endet das Stück mit einem stehenden Camazotz („Ende des Stücks!“), bietet der Ergebnisbildschirm „Nochmal“ und einen sanfteren Modus an. Der gewählte Modus wird mit dem Spielstand gespeichert:<ul><li>Normal: der Kampf, wie er ist.</li><li>Nachsichtig: größere Timing-Fenster, sanftere Halte- und Hämmernoten.</li><li>Vereinfacht: wie Nachsichtig, aber jeder Pfeil gilt für alle Noten. Verlieren kann man trotzdem noch.</li><li>Story: Jede Sequenz zählt als gelungen. Die Gruppe fällt nie, und Camazotz fällt am Ende des Stücks.</li></ul></li><li><strong>Belohnung</strong>: Der Sieg startet die Flucht aus Xibalba.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "Kapitel 6 Auf frischer Tat Minispiele Rhythmuskampf gegen Camazotz (Phase 3) Regeln : Die Noten laufen auf eine Zielmarke zu. Drück im richtigen Moment die passende Pfeiltaste (oben, unten, links, rechts). Es gibt drei Notenarten: einfache Noten; Haltenoten : Halte die Taste bis zum Ende gedrückt; Hämmernoten , angekündigt durch „KNÜPPELHAGEL!“: Drück sehr schnell und mehrmals. Bewertung : Perfekt: unter 0,06 s; Gut: unter 0,15 s; Geht so: unter 0,22 s; darüber: Daneben. Ablauf : Das Stück ist in Sequenzen unterteilt. Je nach deiner Punktzahl in jeder Sequenz greifen deine Verbündeten Camazotz an, oder er schlägt die Gruppe (Feuerbälle, Schwarm, Schockwelle). Camazotz am Ende seiner Kräfte : Fallen seine 11.000 LP vor dem Ende, bleibt er bei 1 LP. Die Musik läuft weiter, aber er greift nicht mehr an und beschwört nichts mehr, und laufende Verbrennungen, Gifte und Flüche verschwinden. Er stirbt bei der letzten Note in seinem Fledermausschwarm. Spiel trotzdem bis zum Ende: Deine Schlussbilanz (Perfekt, Gut, Geht so, Daneben) erscheint danach im Abspann. Pause : Esc oder P (die Taste wird oben links auf dem Bildschirm angezeigt). Niederlage : Fällt die ganze Gruppe („Die Crew bricht zusammen...“) oder endet das Stück mit einem stehenden Camazotz („Ende des Stücks!“), bietet der Ergebnisbildschirm „Nochmal“ und einen sanfteren Modus an. Der gewählte Modus wird mit dem Spielstand gespeichert: Normal: der Kampf, wie er ist. Nachsichtig: größere Timing-Fenster, sanftere Halte- und Hämmernoten. Vereinfacht: wie Nachsichtig, aber jeder Pfeil gilt für alle Noten. Verlieren kann man trotzdem noch. Story: Jede Sequenz zählt als gelungen. Die Gruppe fällt nie, und Camazotz fällt am Ende des Stücks. Belohnung : Der Sieg startet die Flucht aus Xibalba.", "sol": 0}, {"titre": "Flucht auf Zeit", "html": "<p>Siehe das Ziel „Aus Xibalba fliehen, bevor alles einstürzt.“: 50 Sekunden für den ganzen Weg, unbegrenzt viele Versuche.</p>", "id": "c6-fuite-chronometree", "texte": "Kapitel 6 Auf frischer Tat Minispiele Flucht auf Zeit Siehe das Ziel „Aus Xibalba fliehen, bevor alles einstürzt.“: 50 Sekunden für den ganzen Weg, unbegrenzt viele Versuche.", "sol": 0}]}, {"titre": "Nicht verpassen", "intro": "", "entrees": [{"titre": "Nicht verpassen", "html": "<ul><li><strong>Roter Edelstein (2. Edelstein der Bolon Tiku)</strong> an der Feuerstelle von Kuxtal: Ohne ihn geht die Geschichte nicht weiter.</li><li><strong>Tagebuch Nr. 5</strong> (Stelen von Kuxtal) und <strong>Forschungstagebuch</strong> (Ostlager des Tempels). Das sind zwei der sieben Tagebücher für den Erfolg „Kann eh nich lesen“.</li><li><strong>Heilige Jade von Kuxtal</strong> (versteckt): Tritt im Plattenraum nacheinander auf <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>. Um Platte 4 zu wiederholen, geh herunter und wieder drauf. Das funktioniert, egal ob die Tür offen ist oder nicht.<ul><li>Auf dem Auge des Schlangenkopfs im Westen des Raums, zwischen der großen grauen und der grünen Platte, erscheint ein Schimmer. Lauf darüber, um die Jade aufzuheben.</li><li>Wirkung: Die Jade kommt nicht ins Inventar, sondern schaltet dauerhaft eine Fertigkeit frei („Fähigkeit freigeschaltet: Spezial-Kieselwurf“). Der Kieselwurf der Trottel verursacht dann 8 Schaden plus die Hälfte ihres ANG, abzüglich der VER des Ziels, und springt mit einer Chance von 1 zu 2 auf einen weiteren Gegner über.</li><li>Hast du sie nicht, macht dir der Prediger auf der Brücke Vorwürfe.</li><li>Verpasst du sie: Der Tempel stürzt am Ende des Kapitels ein, aber die Jade kannst du danach im Laden der Arena von Kuxtal kaufen (1000 Marken).</li></ul></li><li><strong>Westlager</strong> und <strong>Mimics</strong>: Die Verbrauchsgegenstände und EP gibt es nur während des Kapitels. Nach der Flucht ist der Tempel verschlossen („Alles ist eingestürzt, da kommt keiner mehr rein.“).</li><li><strong>Punkt ohne Wiederkehr</strong>: die obere Tür des Piratenlagers. Danach kommst du nicht mehr aus dem Vulkan heraus, außer über das blaue Licht am Ende der Brücke nach einer Niederlage gegen Camazotz.</li><li><strong>Der geschnitzte Fuchs</strong> (optional): Im Westen von Kuxtal richtet Barbe-Yeux eine kleine Statue auf, die unter einem Stein eingeklemmt ist. Es gibt keine sofortige Belohnung (die Statuette kommt nach dem Spiel).</li><li><strong>Erfolge</strong>:<ul><li>„Taverne?“ wird zu Beginn des Abspanns freigeschaltet, wenn du die fünf Kapitelende-Erfolge der Kapitel 1 bis 5 hast. Kapitel 6 hat keinen eigenen Erfolg.</li><li>„Ein erleuchteter Mann“: alle Fackeln gekauft, was auch den Kampf gegen Kerwin freischaltet.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "Kapitel 6 Auf frischer Tat Nicht verpassen Nicht verpassen Roter Edelstein (2. Edelstein der Bolon Tiku) an der Feuerstelle von Kuxtal: Ohne ihn geht die Geschichte nicht weiter. Tagebuch Nr. 5 (Stelen von Kuxtal) und Forschungstagebuch (Ostlager des Tempels). Das sind zwei der sieben Tagebücher für den Erfolg „Kann eh nich lesen“. Heilige Jade von Kuxtal (versteckt): Tritt im Plattenraum nacheinander auf 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 . Um Platte 4 zu wiederholen, geh herunter und wieder drauf. Das funktioniert, egal ob die Tür offen ist oder nicht. Auf dem Auge des Schlangenkopfs im Westen des Raums, zwischen der großen grauen und der grünen Platte, erscheint ein Schimmer. Lauf darüber, um die Jade aufzuheben. Wirkung: Die Jade kommt nicht ins Inventar, sondern schaltet dauerhaft eine Fertigkeit frei („Fähigkeit freigeschaltet: Spezial-Kieselwurf“). Der Kieselwurf der Trottel verursacht dann 8 Schaden plus die Hälfte ihres ANG, abzüglich der VER des Ziels, und springt mit einer Chance von 1 zu 2 auf einen weiteren Gegner über. Hast du sie nicht, macht dir der Prediger auf der Brücke Vorwürfe. Verpasst du sie: Der Tempel stürzt am Ende des Kapitels ein, aber die Jade kannst du danach im Laden der Arena von Kuxtal kaufen (1000 Marken). Westlager und Mimics : Die Verbrauchsgegenstände und EP gibt es nur während des Kapitels. Nach der Flucht ist der Tempel verschlossen („Alles ist eingestürzt, da kommt keiner mehr rein.“). Punkt ohne Wiederkehr : die obere Tür des Piratenlagers. Danach kommst du nicht mehr aus dem Vulkan heraus, außer über das blaue Licht am Ende der Brücke nach einer Niederlage gegen Camazotz. Der geschnitzte Fuchs (optional): Im Westen von Kuxtal richtet Barbe-Yeux eine kleine Statue auf, die unter einem Stein eingeklemmt ist. Es gibt keine sofortige Belohnung (die Statuette kommt nach dem Spiel). Erfolge : „Taverne?“ wird zu Beginn des Abspanns freigeschaltet, wenn du die fünf Kapitelende-Erfolge der Kapitel 1 bis 5 hast. Kapitel 6 hat keinen eigenen Erfolg. „Ein erleuchteter Mann“: alle Fackeln gekauft, was auch den Kampf gegen Kerwin freischaltet.", "sol": 0}]}]}], "es": [{"id": "c6", "num": "Capítulo 6", "titre": "Con las manos en la masa", "intro": "<p>El Rey de los Cangrejos, rebautizado Znippy, se ha unido a la tripulación. Hay que encontrar a Itzel e impedir que Nadaillac abra la puerta de los Bolon Tiku. El camino pasa por una celda, por la isla perdida de Kuxtal y luego por el templo enterrado bajo la isla del volcán.</p><aside class=\"note\"><p>Nota: el cartel «Capítulo 6 — Con las manos en la masa» solo aparece en el momento de la detención. Los dos primeros objetivos de abajo se juegan antes.</p></aside>", "sections": [{"titre": "Misión principal", "intro": "", "entrees": [{"titre": "Idear un plan (en la taberna de la isla de los Cangrejos).", "html": "<ol><li>Después de reclutar al Rey de los Cangrejos, entra en la taberna de la isla de los Cangrejos.</li><li>Escena automática: Barbe-Yeux, los dos Zoquetes y Znippy hacen balance. Barbe-Yeux comprende que el viejo preso de Nassau (el que «huele a pis») viene de Kuxtal.</li><li>Sus PV y su energía se restablecen al máximo. Nuevo objetivo: hacerse arrestar para hablar con él.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "Capítulo 6 Con las manos en la masa Misión principal Idear un plan (en la taberna de la isla de los Cangrejos). Después de reclutar al Rey de los Cangrejos, entra en la taberna de la isla de los Cangrejos. Escena automática: Barbe-Yeux, los dos Zoquetes y Znippy hacen balance. Barbe-Yeux comprende que el viejo preso de Nassau (el que «huele a pis») viene de Kuxtal. Sus PV y su energía se restablecen al máximo. Nuevo objetivo: hacerse arrestar para hablar con él.", "sol": 0}, {"titre": "Encontrar la manera de hacerse arrestar.", "html": "<p>Hay tres pistas posibles. <strong>Solo una funciona: quemar la tienda de Kerwin.</strong></p><ol><li><strong>Los guardias del museo de Nassau</strong> (opcional, una sola vez): acércate a Marcel y Poulichard delante del museo, de día o de noche. Barbe-Yeux los provoca y empieza un combate. Particularidad: el Zoquete - Rey de los Jabalíes se pasa al bando contrario desde el primer turno, y el Zoquete - Olímpico se le une en el segundo. Atacan con el remo (el Olímpico nunca falla, el Rey de los Jabalíes puede fallar). Ganes o pierdas, la escena continúa igual. Los guardias se niegan a arrestarte, pero una victoria da mucha EXP. El objetivo no cambia: es una pista falsa.</li><li><strong>El atraco a la taberna</strong> (opcional, una sola vez): la primera taberna en la que entres (isla de los Cangrejos, isla de los Monos, Nassau o isla del Viento) ofrece una pequeña escena de atraco. Nadie llama a la guardia y luego se abre el menú normal de la taberna.</li><li><strong>La tienda de antorchas de Kerwin</strong> (isla de los Monos, isla del Viento o Nassau): habla con el vendedor. Se abre un menú:<ul><li>«Irse»: te vas, y la escena volverá en la próxima visita.</li><li>«Disculparse y comprar una antorcha»: tienda normal.</li><li><strong>«Quemarlo todo»</strong>: la tienda arde.</li></ul></li></ol><p><strong>Solución:</strong> en la tienda de Kerwin, elige <strong>«Quemarlo todo»</strong>.</p><p>Después:</p><ul><li>Aparece el cartel del capítulo 6 y luego Barbe-Yeux se despierta en una celda con el viejo preso.</li><li>El viejo confirma que Itzel viene de Kuxtal y marca la ubicación de la isla en tu mapa.</li><li>Un guardia te suelta: la tienda no estaba homologada. El mapa del mundo se abre directamente desde la cárcel. El único destino disponible es Kuxtal.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "Capítulo 6 Con las manos en la masa Misión principal Encontrar la manera de hacerse arrestar. Hay tres pistas posibles. Solo una funciona: quemar la tienda de Kerwin. Los guardias del museo de Nassau (opcional, una sola vez): acércate a Marcel y Poulichard delante del museo, de día o de noche. Barbe-Yeux los provoca y empieza un combate. Particularidad: el Zoquete - Rey de los Jabalíes se pasa al bando contrario desde el primer turno, y el Zoquete - Olímpico se le une en el segundo. Atacan con el remo (el Olímpico nunca falla, el Rey de los Jabalíes puede fallar). Ganes o pierdas, la escena continúa igual. Los guardias se niegan a arrestarte, pero una victoria da mucha EXP. El objetivo no cambia: es una pista falsa. El atraco a la taberna (opcional, una sola vez): la primera taberna en la que entres (isla de los Cangrejos, isla de los Monos, Nassau o isla del Viento) ofrece una pequeña escena de atraco. Nadie llama a la guardia y luego se abre el menú normal de la taberna. La tienda de antorchas de Kerwin (isla de los Monos, isla del Viento o Nassau): habla con el vendedor. Se abre un menú: «Irse»: te vas, y la escena volverá en la próxima visita. «Disculparse y comprar una antorcha»: tienda normal. «Quemarlo todo» : la tienda arde. Solución: en la tienda de Kerwin, elige «Quemarlo todo» . Después: Aparece el cartel del capítulo 6 y luego Barbe-Yeux se despierta en una celda con el viejo preso. El viejo confirma que Itzel viene de Kuxtal y marca la ubicación de la isla en tu mapa. Un guardia te suelta: la tienda no estaba homologada. El mapa del mundo se abre directamente desde la cárcel. El único destino disponible es Kuxtal.", "sol": 1}, {"titre": "Ir a Kuxtal.", "html": "<ol><li>En el mapa del mundo, navega hasta Kuxtal.</li><li>En la isla no hay música, solo el viento y el mar. Al llegar, el grupo conversa (escena automática).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "Capítulo 6 Con las manos en la masa Misión principal Ir a Kuxtal. En el mapa del mundo, navega hasta Kuxtal. En la isla no hay música, solo el viento y el mar. Al llegar, el grupo conversa (escena automática).", "sol": 0}, {"titre": "Explorar las ruinas de Kuxtal.", "html": "<ol><li>Ve al <strong>hogar</strong>, en el centro-norte de la isla (al norte del punto de desembarco, hacia el centro). Interactúa con él.</li><li>Alguien ha sofocado un fuego y hay una tela manchada de sangre atada a un palo. Obtienes la <strong>2.ª gema de los Bolon Tiku</strong> (la gema roja que llevaba Itzel).</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "Capítulo 6 Con las manos en la masa Misión principal Explorar las ruinas de Kuxtal. Ve al hogar , en el centro-norte de la isla (al norte del punto de desembarco, hacia el centro). Interactúa con él. Alguien ha sofocado un fuego y hay una tela manchada de sangre atada a un palo. Obtienes la 2.ª gema de los Bolon Tiku (la gema roja que llevaba Itzel).", "sol": 0}, {"titre": "Descubrir el pasado de Kuxtal.", "html": "<p>Lee las cuatro estelas («Leer»), en cualquier orden. Debajo del objetivo aparece el contador «Estelas leídas: x / 4».</p><div class=\"tab\"><table><thead><tr><th>Estela</th><th>Dónde encontrarla</th></tr></thead><tbody><tr><td>Estela 1</td><td>Al este, cerca del gran árbol sagrado</td></tr><tr><td>Estela 2</td><td>Al suroeste, cerca de la costa sur</td></tr><tr><td>Estela 3</td><td>Al noroeste</td></tr><tr><td>Estela 4</td><td>Al noreste</td></tr></tbody></table></div><ul><li>La primera estela que leas te da el <strong>Diario n.º 5</strong>. Cada estela siguiente le añade una entrada, siempre colocada en el orden del relato.</li><li>Puedes leer las estelas antes de haber visitado el hogar. La conclusión solo llega cuando has hecho las dos cosas.</li><li>Cuando lo has leído todo y has cerrado el diario, Barbe-Yeux saca sus conclusiones. La <strong>isla del volcán</strong> aparece en el mapa del mundo.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "Capítulo 6 Con las manos en la masa Misión principal Descubrir el pasado de Kuxtal. Lee las cuatro estelas («Leer»), en cualquier orden. Debajo del objetivo aparece el contador «Estelas leídas: x / 4». Estela Dónde encontrarla Estela 1 Al este, cerca del gran árbol sagrado Estela 2 Al suroeste, cerca de la costa sur Estela 3 Al noroeste Estela 4 Al noreste La primera estela que leas te da el Diario n.º 5 . Cada estela siguiente le añade una entrada, siempre colocada en el orden del relato. Puedes leer las estelas antes de haber visitado el hogar. La conclusión solo llega cuando has hecho las dos cosas. Cuando lo has leído todo y has cerrado el diario, Barbe-Yeux saca sus conclusiones. La isla del volcán aparece en el mapa del mundo.", "sol": 0}, {"titre": "Ir a la isla del volcán.", "html": "<ol><li>Navega hasta la isla del volcán. En cuanto desembarcas, empieza una escena automática: Nadaillac llama al grupo, Barbe-Yeux camina hacia el templo y tropieza por el camino.</li><li>Cinemática: Nadaillac encañona a Itzel y hiere a uno de los Zoquetes. Znippy confiesa que tenéis las gemas, y Barbe-Yeux las cambia por Itzel. <strong>Todas las gemas de los Bolon Tiku desaparecen de tu inventario.</strong> Nadaillac falta a su palabra en el acto y suelta a sus esqueletos.</li><li><strong>Combate contra los esqueletos de Nadaillac</strong> (5 esqueletos). Tu grupo: Barbe-Yeux, el Zoquete - Rey de los Jabalíes y el Rey de los Cangrejos, sin su ataque definitivo. Si pierdes, el combate vuelve a empezar de inmediato con los PV y la energía llenos.</li><li>Cinemática del medallón (no se puede saltar). El templo despierta y Znippy libera a Itzel. Itzel se une al grupo y propone «otro camino».</li><li>Recuperas el control en el campamento pirata del templo (la Caldera). A partir de ahí, el grupo te sigue al completo: los dos Zoquetes, Itzel y Znippy.</li></ol><p>Para marcharte de la isla, coge la barca al sur de la isla («Embarcar» / «Quedarse»).</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "Capítulo 6 Con las manos en la masa Misión principal Ir a la isla del volcán. Navega hasta la isla del volcán. En cuanto desembarcas, empieza una escena automática: Nadaillac llama al grupo, Barbe-Yeux camina hacia el templo y tropieza por el camino. Cinemática: Nadaillac encañona a Itzel y hiere a uno de los Zoquetes. Znippy confiesa que tenéis las gemas, y Barbe-Yeux las cambia por Itzel. Todas las gemas de los Bolon Tiku desaparecen de tu inventario. Nadaillac falta a su palabra en el acto y suelta a sus esqueletos. Combate contra los esqueletos de Nadaillac (5 esqueletos). Tu grupo: Barbe-Yeux, el Zoquete - Rey de los Jabalíes y el Rey de los Cangrejos, sin su ataque definitivo. Si pierdes, el combate vuelve a empezar de inmediato con los PV y la energía llenos. Cinemática del medallón (no se puede saltar). El templo despierta y Znippy libera a Itzel. Itzel se une al grupo y propone «otro camino». Recuperas el control en el campamento pirata del templo (la Caldera). A partir de ahí, el grupo te sigue al completo: los dos Zoquetes, Itzel y Znippy. Para marcharte de la isla, coge la barca al sur de la isla («Embarcar» / «Quedarse»).", "sol": 0}, {"titre": "Encontrar un paso hasta el corazón del volcán.", "html": "<p><strong>1. El campamento pirata (primera sala del templo)</strong></p><ul><li>Entras por la parte de abajo de la sala. La puerta que lleva más allá está arriba, en el centro.</li><li><strong>Campamento este</strong> (en el centro-derecha, 6 piratas): <strong>obligatorio</strong>. La victoria te da el <strong>Diario de investigación</strong>, que se abre enseguida, además de 3 cervezas y un Fricasé del Náufrago.</li><li><strong>Campamento oeste</strong> (a la izquierda, 4 piratas): opcional. Da 2 cervezas y un Filete de pescado de primera.</li><li>Mientras no tengas el Diario de investigación, la puerta de arriba sigue cerrada. Barbe-Yeux dice entonces: «Estos piratas esconden algo…».</li><li>Al cruzar la puerta de arriba, el juego te pide una confirmación («Vas a entrar en la fase final…»): <strong>es el punto de no retorno</strong>. Si aceptas, la puerta de abajo de la sala de las losas ya no lleva al campamento, y la puerta del templo, en la isla, ya no se abre. Haz tus preparativos antes (campamento oeste, compras, curaciones).</li><li>Una vez pasado el punto de no retorno, todavía puedes volver de la sala del tesoro a la sala de las losas, pero no del laberinto a la sala del tesoro.</li><li><strong>Derrota en el templo</strong> (campamento, guardianes, Mimics, espíritus): te despiertas en la taberna de la isla de los Cangrejos, con los PV y la energía llenos. Después del punto de no retorno, <strong>guarda antes de cada combate</strong> y carga la partida si pierdes: la puerta del templo sigue cerrada desde la isla.</li></ul><p><strong>2. La sala de las losas (segunda sala, a oscuras)</strong> Todo el mundo enciende su antorcha. La sala tiene <strong>cuatro losas</strong> en el suelo y una fuente en el centro.</p><div class=\"tab\"><table><thead><tr><th>Losa</th><th>Aspecto</th><th>Ubicación</th></tr></thead><tbody><tr><td>1</td><td>Losa gris pequeña</td><td>Noreste</td></tr><tr><td>2</td><td>Losa <strong>verde</strong> mediana</td><td>Oeste, en la mitad inferior</td></tr>
