<tr><td>3</td><td>Losa <strong>rosa</strong> mediana</td><td>Este, en la mitad inferior</td></tr><tr><td>4</td><td>Losa gris grande</td><td>Noroeste</td></tr></tbody></table></div><p><em>a) Las salas de los guardianes.</em> Cada vez que pisas una losa distinta de la anterior, se abre una de las cuatro salas de arriba y <strong>dos guardianes</strong> te atacan. Así que hay 4 combates en total.</p><ul><li>El primer guardián se teletransporta delante de su objetivo y golpea una vez.</li><li>El segundo encadena tres golpes contra objetivos al azar.</li></ul><p>Si pierdes, la sala no cuenta y volverá a abrirse más tarde. Los guardianes, igual que los Mimics y los espíritus más adelante, atacan prioritariamente a un Zoquete que provoca (Voltereta). Después del 4.º combate, la fuente central se llena: «Regenerarse» restablece los PV y la energía al máximo, sin límite.</p><p><em>b) La puerta.</em> El Diario de investigación muestra una serie de seis máscaras. Cada una va acompañada de un número maya, de 1 a 6 en puntos y barras, que indica el orden. El color y el tamaño de cada máscara indican una losa: gris grande = losa 4, verde = losa 2, rosa = losa 3, gris pequeña = losa 1.</p><p><strong>Solución:</strong> pisa las losas en el orden <strong>4 – 2 – 3 – 4 – 3 – 1</strong>, es decir: gris grande, verde, rosa, gris grande, rosa, gris pequeña.</p><ul><li>Solo cuenta una nueva pisada: una losa se queda hundida mientras alguien esté encima, incluido un miembro del grupo que te sigue.</li><li>El juego solo recuerda las <strong>6 últimas pisadas</strong>. Si te equivocas, basta con volver a empezar la serie desde el principio.</li><li>Truco: el botón del reloj de arena, abajo a la derecha, activa el <strong>modo cooperativo</strong>. Barbe-Yeux, los dos Zoquetes e Itzel se quedan entonces donde están, y mueves a uno solo cada vez. Znippy no es jugable: siempre sigue a Barbe-Yeux y puede hundir una losa detrás de él. Lo más seguro: deja a Barbe-Yeux (y por tanto a Znippy) lejos de las losas, y haz la serie con un Zoquete o con Itzel.</li><li>La serie correcta abre la puerta de arriba y reagrupa al equipo.</li></ul><p><strong>3. La sala del tesoro (tercera sala)</strong></p><ul><li>Hay 30 cofres colocados en <strong>3 filas de 10</strong> en la sala grande de arriba. Acércate a un cofre y elige «Abrir».</li><li>Todos los cofres menos uno son <strong>Mimics</strong>: un solo enemigo, muy resistente, que muerde a tres objetivos por turno. No se puede huir. Cada Mimic derrotado da de 1 a 3 consumibles y mucha EXP. Un cofre abierto se queda abierto: un Mimic perdido no vuelve, y su botín se pierde.</li><li>Pista: al recorrer la pared de arriba, una luz barre lentamente la sala. Revela dos personajes grabados, cada uno con un número maya verde: <strong>2 puntos</strong> (= 2) a la izquierda, <strong>una barra y 4 puntos</strong> (= 9) a la derecha.</li></ul><p><strong>Solución:</strong> abre el cofre de la <strong>2.ª fila</strong> (la del medio), el <strong>9.º empezando por la izquierda</strong> (el penúltimo de la derecha). Abre la puerta del fondo, arriba en el centro.</p><p><strong>4. El laberinto de los espíritus (cuarta sala)</strong></p><ul><li>Al entrar, todo se vuelve negro. Estallan risas y se encienden ojos en la oscuridad (cinemática).</li><li>Itzel se pone la máscara y <strong>va en cabeza</strong>. El camino luminoso solo es visible a su alrededor, al ritmo de un latido. Por los pasillos vagan espectros, pero son inofensivos.</li><li>Grupo de espíritus <strong>obligatorio</strong> en el centro de la sala, en el camino: Poom, Jo'oche' y Nikte'.<ul><li>Poom envenena a todo el grupo.</li><li>Jo'oche' maldice a un personaje por turno. El objetivo muere cuando Jo'oche' ha vuelto a jugar 3 veces, salvo si Jo'oche' cae antes. <strong>Mata primero a Jo'oche'.</strong></li><li>Nikte' suelta un grito que hiere a todo el grupo. Pega fuerte pero tiene pocos PV.</li></ul></li><li>Otros cuatro grupos de espíritus, opcionales, esperan en las esquinas: noroeste, oeste, este y noreste. Cada espíritu derrotado da un consumible al azar.</li><li><strong>Itinerario</strong>: desde la entrada (abajo en el centro), sube hasta el centro (combate). Luego ve hacia el oeste, serpentea hacia el norte hasta el pasillo del noroeste y vuelve a ir hacia el este. Baja un poco y luego cruza hacia el este por un largo pasillo a media altura. Baja por el lado este y luego sube por todo el borde este hasta arriba. Por último, vuelve hacia el oeste hasta la puerta, arriba en el centro.</li><li>La puerta, arriba en el centro, se abre sola cuando llegas delante.</li></ul><p><strong>5. El puente (quinta sala)</strong></p><ul><li>Se acabó la oscuridad: todo el mundo vuelve a seguir a Barbe-Yeux. Sube por el largo puente hacia el norte.</li><li><strong>El viejo de la cueva</strong> (el de la isla de los Monos) te corta el paso («VOSOTROS… NO PASARÉIS… ¡JAMÁS!»). Ve hasta él: escena con flashback y luego te deja pasar. Rodéalo por su derecha.</li><li>Más arriba, <strong>el predicador</strong> de Morro Blanco hace lo mismo: escena, flashback, paso.</li><li>Arriba del todo, a la derecha de la salida, una <strong>fuente</strong> ofrece «Regenerarse» (PV y energía al máximo).</li><li><strong>Cúrate y prepárate aquí</strong>: entrar en la sala siguiente lleva directamente al jefe final.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "Capítulo 6 Con las manos en la masa Misión principal Encontrar un paso hasta el corazón del volcán. 1. El campamento pirata (primera sala del templo) Entras por la parte de abajo de la sala. La puerta que lleva más allá está arriba, en el centro. Campamento este (en el centro-derecha, 6 piratas): obligatorio . La victoria te da el Diario de investigación , que se abre enseguida, además de 3 cervezas y un Fricasé del Náufrago. Campamento oeste (a la izquierda, 4 piratas): opcional. Da 2 cervezas y un Filete de pescado de primera. Mientras no tengas el Diario de investigación, la puerta de arriba sigue cerrada. Barbe-Yeux dice entonces: «Estos piratas esconden algo…». Al cruzar la puerta de arriba, el juego te pide una confirmación («Vas a entrar en la fase final…»): es el punto de no retorno . Si aceptas, la puerta de abajo de la sala de las losas ya no lleva al campamento, y la puerta del templo, en la isla, ya no se abre. Haz tus preparativos antes (campamento oeste, compras, curaciones). Una vez pasado el punto de no retorno, todavía puedes volver de la sala del tesoro a la sala de las losas, pero no del laberinto a la sala del tesoro. Derrota en el templo (campamento, guardianes, Mimics, espíritus): te despiertas en la taberna de la isla de los Cangrejos, con los PV y la energía llenos. Después del punto de no retorno, guarda antes de cada combate y carga la partida si pierdes: la puerta del templo sigue cerrada desde la isla. 2. La sala de las losas (segunda sala, a oscuras) Todo el mundo enciende su antorcha. La sala tiene cuatro losas en el suelo y una fuente en el centro. Losa Aspecto Ubicación 1 Losa gris pequeña Noreste 2 Losa verde mediana Oeste, en la mitad inferior 3 Losa rosa mediana Este, en la mitad inferior 4 Losa gris grande Noroeste a) Las salas de los guardianes. Cada vez que pisas una losa distinta de la anterior, se abre una de las cuatro salas de arriba y dos guardianes te atacan. Así que hay 4 combates en total. El primer guardián se teletransporta delante de su objetivo y golpea una vez. El segundo encadena tres golpes contra objetivos al azar. Si pierdes, la sala no cuenta y volverá a abrirse más tarde. Los guardianes, igual que los Mimics y los espíritus más adelante, atacan prioritariamente a un Zoquete que provoca (Voltereta). Después del 4.º combate, la fuente central se llena: «Regenerarse» restablece los PV y la energía al máximo, sin límite. b) La puerta. El Diario de investigación muestra una serie de seis máscaras. Cada una va acompañada de un número maya, de 1 a 6 en puntos y barras, que indica el orden. El color y el tamaño de cada máscara indican una losa: gris grande = losa 4, verde = losa 2, rosa = losa 3, gris pequeña = losa 1. Solución: pisa las losas en el orden 4 – 2 – 3 – 4 – 3 – 1 , es decir: gris grande, verde, rosa, gris grande, rosa, gris pequeña. Solo cuenta una nueva pisada: una losa se queda hundida mientras alguien esté encima, incluido un miembro del grupo que te sigue. El juego solo recuerda las 6 últimas pisadas . Si te equivocas, basta con volver a empezar la serie desde el principio. Truco: el botón del reloj de arena, abajo a la derecha, activa el modo cooperativo . Barbe-Yeux, los dos Zoquetes e Itzel se quedan entonces donde están, y mueves a uno solo cada vez. Znippy no es jugable: siempre sigue a Barbe-Yeux y puede hundir una losa detrás de él. Lo más seguro: deja a Barbe-Yeux (y por tanto a Znippy) lejos de las losas, y haz la serie con un Zoquete o con Itzel. La serie correcta abre la puerta de arriba y reagrupa al equipo. 3. La sala del tesoro (tercera sala) Hay 30 cofres colocados en 3 filas de 10 en la sala grande de arriba. Acércate a un cofre y elige «Abrir». Todos los cofres menos uno son Mimics : un solo enemigo, muy resistente, que muerde a tres objetivos por turno. No se puede huir. Cada Mimic derrotado da de 1 a 3 consumibles y mucha EXP. Un cofre abierto se queda abierto: un Mimic perdido no vuelve, y su botín se pierde. Pista: al recorrer la pared de arriba, una luz barre lentamente la sala. Revela dos personajes grabados, cada uno con un número maya verde: 2 puntos (= 2) a la izquierda, una barra y 4 puntos (= 9) a la derecha. Solución: abre el cofre de la 2.ª fila (la del medio), el 9.º empezando por la izquierda (el penúltimo de la derecha). Abre la puerta del fondo, arriba en el centro. 4. El laberinto de los espíritus (cuarta sala) Al entrar, todo se vuelve negro. Estallan risas y se encienden ojos en la oscuridad (cinemática). Itzel se pone la máscara y va en cabeza . El camino luminoso solo es visible a su alrededor, al ritmo de un latido. Por los pasillos vagan espectros, pero son inofensivos. Grupo de espíritus obligatorio en el centro de la sala, en el camino: Poom, Jo'oche' y Nikte'. Poom envenena a todo el grupo. Jo'oche' maldice a un personaje por turno. El objetivo muere cuando Jo'oche' ha vuelto a jugar 3 veces, salvo si Jo'oche' cae antes. Mata primero a Jo'oche'. Nikte' suelta un grito que hiere a todo el grupo. Pega fuerte pero tiene pocos PV. Otros cuatro grupos de espíritus, opcionales, esperan en las esquinas: noroeste, oeste, este y noreste. Cada espíritu derrotado da un consumible al azar. Itinerario : desde la entrada (abajo en el centro), sube hasta el centro (combate). Luego ve hacia el oeste, serpentea hacia el norte hasta el pasillo del noroeste y vuelve a ir hacia el este. Baja un poco y luego cruza hacia el este por un largo pasillo a media altura. Baja por el lado este y luego sube por todo el borde este hasta arriba. Por último, vuelve hacia el oeste hasta la puerta, arriba en el centro. La puerta, arriba en el centro, se abre sola cuando llegas delante. 5. El puente (quinta sala) Se acabó la oscuridad: todo el mundo vuelve a seguir a Barbe-Yeux. Sube por el largo puente hacia el norte. El viejo de la cueva (el de la isla de los Monos) te corta el paso («VOSOTROS… NO PASARÉIS… ¡JAMÁS!»). Ve hasta él: escena con flashback y luego te deja pasar. Rodéalo por su derecha. Más arriba, el predicador de Morro Blanco hace lo mismo: escena, flashback, paso. Arriba del todo, a la derecha de la salida, una fuente ofrece «Regenerarse» (PV y energía al máximo). Cúrate y prepárate aquí : entrar en la sala siguiente lleva directamente al jefe final.", "sol": 2}, {"titre": "Adentrarse en Xibalbá.", "html": "<ol><li>Cinemática de la <strong>puerta del medallón</strong>: Nadaillac está delante de la puerta e Itzel grita «¡Alto!». Nadaillac abre la puerta con el medallón, sin que tengas que hacer nada.</li><li>«Sigámoslos.»: el grupo avanza solo y entra en la guarida.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "Capítulo 6 Con las manos en la masa Misión principal Adentrarse en Xibalbá. Cinemática de la puerta del medallón : Nadaillac está delante de la puerta e Itzel grita «¡Alto!». Nadaillac abre la puerta con el medallón, sin que tengas que hacer nada. «Sigámoslos.»: el grupo avanza solo y entra en la guarida.", "sol": 0}, {"titre": "Enfrentarse a Camazotz.", "html": "<p>El combate final encadena tres fases.</p><p><strong>Si pierdes en la fase 1 o 2:</strong></p><ul><li>Te despiertas al final del puente, delante de la fuente, con los PV y la energía llenos («¡Camazotz aún no ha acabado con vosotros!»).</li><li>Vuelve a cruzar la salida de arriba: el combate se reanuda directamente en la fase perdida, sin la escena de la puerta.</li><li>Desde la primera derrota, aparecen dos <strong>resplandores azules</strong>. El del final del puente, a la izquierda de la salida, frente a la fuente, ofrece «Volver a la barca». Te deja en la playa de la isla del volcán, a la derecha de la barca. Allí, otro resplandor ofrece «Ir al final del puente». Así que puedes ir a entrenar o a hacer compras a otro sitio y luego volver. Los resplandores desaparecen una vez derrotado Camazotz.</li><li>En dificultad Normal, a la 2.ª derrota (y luego cada dos derrotas), el juego propone pasar a la <strong>dificultad Aventura</strong>: daño recibido -20 %, daño infligido +20 %, curaciones +30 %. Responde que sí para activarla en el acto. También se puede cambiar en cualquier momento en Preferencias &gt; Nivel de dificultad.</li></ul><p><strong>Fase 1 — el Heraldo de Xibalbá y Kab'raqan</strong></p><ul><li>Tu grupo: Barbe-Yeux, los dos Zoquetes, Itzel, <strong>Nadaillac (aliado jugable)</strong> y Znippy, sin su ataque definitivo.</li><li>Nadaillac tiene tres habilidades:<ul><li>Sable: muy potente.</li><li>Granada: seis golpes contra todos los enemigos, utilizable un turno de cada cuatro.</li><li>Disparo: dos balas, eliges el objetivo de cada una, sin recarga.</li></ul></li><li>El Heraldo repite sus ataques del templo de la jungla (incluida la invocación de espíritus). Kab'raqan repite su primera fase: vuelo, bolas de fuego, cono de llamas, y aterriza a mitad de vida.</li></ul><p><strong>Fase 2 — Camazotz</strong></p><ul><li>Camazotz llega con 3 invocaciones. Sigue un ciclo fijo de 4 ataques:<ol><li>Triple bola de fuego.</li><li>Enjambre de murciélagos: golpes al azar, más la invocación de un espíritu: por turnos, Jo'oche', Poom y luego Nikte'.</li><li><strong>Onda expansiva</strong>: 40, luego 50 y luego 120 de daño a todo el grupo (un 20 % menos en dificultad Aventura).</li><li>Zarpazo: dos aliados al azar, mucho daño.</li></ol></li><li>Cura al grupo justo antes de la onda expansiva (3.er ataque del ciclo). Elimina a Jo'oche' en cuanto aparezca.</li><li>Cuando Camazotz baja de <strong>16 000 PV</strong>:<ul><li>invoca 3 secuaces más;</li><li>Znippy suelta su ataque definitivo y luego huye;</li><li><strong>Itzel se pone la máscara</strong> hasta el final del combate: ataques reforzados, y eres tú quien reparte las balas de su Disparo devastador. Su granada de humo hace entonces fallar el <strong>75 %</strong> de los ataques de los enemigos ahumados (50 % sin la máscara).</li></ul></li><li>A los <strong>11 000 PV</strong>, el combate se detiene: Nadaillac reclama su puerta, Camazotz lo mata y se levanta de nuevo.</li></ul><p><strong>Fase 3 — el combate de ritmo</strong> (ver Minijuegos). Hay que quitarle los 11 000 PV restantes antes de que termine la canción. El combate dura siempre hasta la última nota. Si fallas, repites esta fase de inmediato (sin volver al puente).</p>", "id": "c6-affronter-camazotz", "texte": "Capítulo 6 Con las manos en la masa Misión principal Enfrentarse a Camazotz. El combate final encadena tres fases. Si pierdes en la fase 1 o 2: Te despiertas al final del puente, delante de la fuente, con los PV y la energía llenos («¡Camazotz aún no ha acabado con vosotros!»). Vuelve a cruzar la salida de arriba: el combate se reanuda directamente en la fase perdida, sin la escena de la puerta. Desde la primera derrota, aparecen dos resplandores azules . El del final del puente, a la izquierda de la salida, frente a la fuente, ofrece «Volver a la barca». Te deja en la playa de la isla del volcán, a la derecha de la barca. Allí, otro resplandor ofrece «Ir al final del puente». Así que puedes ir a entrenar o a hacer compras a otro sitio y luego volver. Los resplandores desaparecen una vez derrotado Camazotz. En dificultad Normal, a la 2.ª derrota (y luego cada dos derrotas), el juego propone pasar a la dificultad Aventura : daño recibido -20 %, daño infligido +20 %, curaciones +30 %. Responde que sí para activarla en el acto. También se puede cambiar en cualquier momento en Preferencias > Nivel de dificultad. Fase 1 — el Heraldo de Xibalbá y Kab'raqan Tu grupo: Barbe-Yeux, los dos Zoquetes, Itzel, Nadaillac (aliado jugable) y Znippy, sin su ataque definitivo. Nadaillac tiene tres habilidades: Sable: muy potente. Granada: seis golpes contra todos los enemigos, utilizable un turno de cada cuatro. Disparo: dos balas, eliges el objetivo de cada una, sin recarga. El Heraldo repite sus ataques del templo de la jungla (incluida la invocación de espíritus). Kab'raqan repite su primera fase: vuelo, bolas de fuego, cono de llamas, y aterriza a mitad de vida. Fase 2 — Camazotz Camazotz llega con 3 invocaciones. Sigue un ciclo fijo de 4 ataques: Triple bola de fuego. Enjambre de murciélagos: golpes al azar, más la invocación de un espíritu: por turnos, Jo'oche', Poom y luego Nikte'. Onda expansiva : 40, luego 50 y luego 120 de daño a todo el grupo (un 20 % menos en dificultad Aventura). Zarpazo: dos aliados al azar, mucho daño. Cura al grupo justo antes de la onda expansiva (3.er ataque del ciclo). Elimina a Jo'oche' en cuanto aparezca. Cuando Camazotz baja de 16 000 PV : invoca 3 secuaces más; Znippy suelta su ataque definitivo y luego huye; Itzel se pone la máscara hasta el final del combate: ataques reforzados, y eres tú quien reparte las balas de su Disparo devastador. Su granada de humo hace entonces fallar el 75 % de los ataques de los enemigos ahumados (50 % sin la máscara). A los 11 000 PV , el combate se detiene: Nadaillac reclama su puerta, Camazotz lo mata y se levanta de nuevo. Fase 3 — el combate de ritmo (ver Minijuegos). Hay que quitarle los 11 000 PV restantes antes de que termine la canción. El combate dura siempre hasta la última nota. Si fallas, repites esta fase de inmediato (sin volver al puente).", "sol": 0}, {"titre": "Huir de Xibalbá antes de que todo se derrumbe.", "html": "<ol><li>El templo se viene abajo. Barbe-Yeux monta a un Zoquete e Itzel al otro. No se puede desmontar.</li><li>Un <strong>cronómetro de 50 segundos</strong>, arriba a la derecha, cubre <strong>todo el recorrido</strong>. Se pausa durante los fundidos entre salas y se pone rojo por debajo de 10 segundos.</li><li>Rehaz el camino al revés, siempre hacia la <strong>salida de abajo</strong> de cada sala: la puerta del medallón, el puente (baja recto), el laberinto (el mismo camino que a la ida, al revés), la sala del tesoro, la sala de las losas y luego el campamento. Nuevos derrumbes llenan las salas. Las rocas que caen son solo visuales.</li><li>Si el cronómetro llega a cero («¡Demasiado tarde!»), vuelves a empezar desde la sala de la puerta, con el cronómetro lleno.</li><li>Diálogo final frente al mar y luego los <strong>créditos finales</strong>, con la canción del Rey de las galeras (un botón permite saltarlos). A los lados desfilan recuerdos de la aventura, con las estadísticas de tu partida: precisión contra Camazotz, muertes, caídas, oro ganado, cervezas bebidas, misiones secundarias, tiempo de juego… A mitad de los créditos, Znippy, armado hasta las pinzas, pasa abajo a la izquierda para pedir disculpas.</li><li>Una última pantalla «¡Gracias por jugar!» se queda hasta que haces clic.</li><li>Después apareces delante de la taberna de la isla de los Cangrejos, solo con Barbe-Yeux y los dos Zoquetes: lo que sigue está en el posjuego.</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "Capítulo 6 Con las manos en la masa Misión principal Huir de Xibalbá antes de que todo se derrumbe. El templo se viene abajo. Barbe-Yeux monta a un Zoquete e Itzel al otro. No se puede desmontar. Un cronómetro de 50 segundos , arriba a la derecha, cubre todo el recorrido . Se pausa durante los fundidos entre salas y se pone rojo por debajo de 10 segundos. Rehaz el camino al revés, siempre hacia la salida de abajo de cada sala: la puerta del medallón, el puente (baja recto), el laberinto (el mismo camino que a la ida, al revés), la sala del tesoro, la sala de las losas y luego el campamento. Nuevos derrumbes llenan las salas. Las rocas que caen son solo visuales. Si el cronómetro llega a cero («¡Demasiado tarde!»), vuelves a empezar desde la sala de la puerta, con el cronómetro lleno. Diálogo final frente al mar y luego los créditos finales , con la canción del Rey de las galeras (un botón permite saltarlos). A los lados desfilan recuerdos de la aventura, con las estadísticas de tu partida: precisión contra Camazotz, muertes, caídas, oro ganado, cervezas bebidas, misiones secundarias, tiempo de juego… A mitad de los créditos, Znippy, armado hasta las pinzas, pasa abajo a la izquierda para pedir disculpas. Una última pantalla «¡Gracias por jugar!» se queda hasta que haces clic. Después apareces delante de la taberna de la isla de los Cangrejos, solo con Barbe-Yeux y los dos Zoquetes: lo que sigue está en el posjuego.", "sol": 0}]}, {"titre": "Misiones secundarias", "intro": "<p>En este capítulo no se activa ninguna misión secundaria del diario. Sin embargo, hay un encuentro opcional relacionado:</p>", "entrees": [{"titre": "Jefe opcional: Kerwin - El vendedor de antorchas", "html": "<ul><li><strong>Activación</strong>: en cualquier momento del juego, vuelve a ver a Kerwin cuando tengas <strong>todas las antorchas que se pueden comprar</strong>. Quiere recuperarlas.</li><li><strong>Combate</strong>: Kerwin cambia de estado según un ciclo fijo. El color de las antorchas que giran a su alrededor anuncia el siguiente ataque:<ol><li>Antorcha inestable (rojo-naranja), 3 turnos <strong>en vuelo</strong>: 2 antorchas lanzadas por turno, quemadura. En vuelo, el sable y el remo no le alcanzan.</li><li>Fósforo y resina (verde): envenena a un objetivo.</li><li>Alba negra (violeta): maldice a un objetivo, que muere cuando Kerwin ha vuelto a jugar 3 veces, salvo si él cae antes.</li><li>Antorcha Compota (naranja): pringa a un objetivo, que pierde su turno.</li><li>Destello blanco: relámpago cegador sobre todo el grupo.</li><li>Caoba Prestigio (dorado): golpe fuerte, y se cura.</li></ol></li></ul><p>Salvo durante la Antorcha inestable, se queda <strong>en el suelo</strong> y vuelve a poder ser atacado cuerpo a cuerpo.</p><ul><li><strong>Si pierdes</strong>: derrota normal. Después, la tienda ofrece «Ven a por tu parte, tú.» para reintentarlo.</li><li><strong>Recompensa</strong>: la EXP de un nivel completo (según tu nivel en ese momento), y te quedas con tus antorchas («Sobre todo la de caoba»).</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "Capítulo 6 Con las manos en la masa Misiones secundarias Jefe opcional: Kerwin - El vendedor de antorchas Activación : en cualquier momento del juego, vuelve a ver a Kerwin cuando tengas todas las antorchas que se pueden comprar . Quiere recuperarlas. Combate : Kerwin cambia de estado según un ciclo fijo. El color de las antorchas que giran a su alrededor anuncia el siguiente ataque: Antorcha inestable (rojo-naranja), 3 turnos en vuelo : 2 antorchas lanzadas por turno, quemadura. En vuelo, el sable y el remo no le alcanzan. Fósforo y resina (verde): envenena a un objetivo. Alba negra (violeta): maldice a un objetivo, que muere cuando Kerwin ha vuelto a jugar 3 veces, salvo si él cae antes. Antorcha Compota (naranja): pringa a un objetivo, que pierde su turno. Destello blanco: relámpago cegador sobre todo el grupo. Caoba Prestigio (dorado): golpe fuerte, y se cura. Salvo durante la Antorcha inestable, se queda en el suelo y vuelve a poder ser atacado cuerpo a cuerpo. Si pierdes : derrota normal. Después, la tienda ofrece «Ven a por tu parte, tú.» para reintentarlo. Recompensa : la EXP de un nivel completo (según tu nivel en ese momento), y te quedas con tus antorchas («Sobre todo la de caoba»).", "sol": 0}]}, {"titre": "Minijuegos", "intro": "", "entrees": [{"titre": "Combate de ritmo contra Camazotz (fase 3)", "html": "<ul><li><strong>Reglas</strong>: las notas se desplazan hacia una mira. Pulsa la flecha de movimiento correspondiente (arriba, abajo, izquierda, derecha) en el momento justo. Hay tres tipos de notas:<ul><li>las notas simples;</li><li>las notas <strong>mantenidas</strong>: deja la tecla pulsada hasta el final;</li><li>las notas <strong>machacadas</strong>, anunciadas con «¡A PORRAZOS!»: pulsa muy rápido y varias veces.</li></ul></li><li><strong>Valoración</strong>:<ul><li>Perfecto: a menos de 0,06 s;</li><li>Bien: a menos de 0,15 s;</li><li>Pasable: a menos de 0,22 s;</li><li>más allá: Fallo.</li></ul></li><li><strong>Desarrollo</strong>: la canción está dividida en secuencias. Según tu puntuación en cada secuencia, tus aliados atacan a Camazotz, o él golpea al grupo (bolas de fuego, enjambre, onda expansiva).</li><li><strong>Camazotz sin fuerzas</strong>: si sus 11 000 PV se agotan antes del final, se queda con 1 PV. La música sigue, pero ya no ataca ni invoca nada, y las quemaduras, venenos y maldiciones en curso desaparecen. Muere en su enjambre de murciélagos con la última nota. Juega igualmente hasta el final: tu recuento final (perfectos, buenos, pasables, fallos) aparece después en los créditos.</li><li><strong>Pausa</strong>: Esc o P (la tecla se recuerda arriba a la izquierda de la pantalla).</li><li><strong>Derrota</strong>: si cae todo el grupo («La tripulación se desploma...»), o si la canción termina con Camazotz en pie («¡Fin de la canción!»), la pantalla de resultado ofrece «Volver a jugar» y un modo más suave. El modo elegido se guarda con la partida:<ul><li>Normal: el combate tal cual.</li><li>Indulgente: ventanas de tiempo más amplias, notas mantenidas y machacadas suavizadas.</li><li>Simplificado: como Indulgente, pero cualquier flecha vale para todas las notas. Todavía se puede perder.</li><li>Historia: cada secuencia cuenta como superada. El grupo nunca cae, y Camazotz cae al final de la canción.</li></ul></li><li><strong>Recompensa</strong>: la victoria inicia la huida de Xibalbá.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "Capítulo 6 Con las manos en la masa Minijuegos Combate de ritmo contra Camazotz (fase 3) Reglas : las notas se desplazan hacia una mira. Pulsa la flecha de movimiento correspondiente (arriba, abajo, izquierda, derecha) en el momento justo. Hay tres tipos de notas: las notas simples; las notas mantenidas : deja la tecla pulsada hasta el final; las notas machacadas , anunciadas con «¡A PORRAZOS!»: pulsa muy rápido y varias veces. Valoración : Perfecto: a menos de 0,06 s; Bien: a menos de 0,15 s; Pasable: a menos de 0,22 s; más allá: Fallo. Desarrollo : la canción está dividida en secuencias. Según tu puntuación en cada secuencia, tus aliados atacan a Camazotz, o él golpea al grupo (bolas de fuego, enjambre, onda expansiva). Camazotz sin fuerzas : si sus 11 000 PV se agotan antes del final, se queda con 1 PV. La música sigue, pero ya no ataca ni invoca nada, y las quemaduras, venenos y maldiciones en curso desaparecen. Muere en su enjambre de murciélagos con la última nota. Juega igualmente hasta el final: tu recuento final (perfectos, buenos, pasables, fallos) aparece después en los créditos. Pausa : Esc o P (la tecla se recuerda arriba a la izquierda de la pantalla). Derrota : si cae todo el grupo («La tripulación se desploma...»), o si la canción termina con Camazotz en pie («¡Fin de la canción!»), la pantalla de resultado ofrece «Volver a jugar» y un modo más suave. El modo elegido se guarda con la partida: Normal: el combate tal cual. Indulgente: ventanas de tiempo más amplias, notas mantenidas y machacadas suavizadas. Simplificado: como Indulgente, pero cualquier flecha vale para todas las notas. Todavía se puede perder. Historia: cada secuencia cuenta como superada. El grupo nunca cae, y Camazotz cae al final de la canción. Recompensa : la victoria inicia la huida de Xibalbá.", "sol": 0}, {"titre": "Huida cronometrada", "html": "<p>Ver el objetivo «Huir de Xibalbá antes de que todo se derrumbe.»: 50 segundos para todo el recorrido, reintentos ilimitados.</p>", "id": "c6-fuite-chronometree", "texte": "Capítulo 6 Con las manos en la masa Minijuegos Huida cronometrada Ver el objetivo «Huir de Xibalbá antes de que todo se derrumbe.»: 50 segundos para todo el recorrido, reintentos ilimitados.", "sol": 0}]}, {"titre": "Que no se te escape", "intro": "", "entrees": [{"titre": "Que no se te escape", "html": "<ul><li><strong>Gema roja (2.ª gema de los Bolon Tiku)</strong>, en el hogar de Kuxtal: la historia no avanza sin ella.</li><li><strong>Diario n.º 5</strong> (estelas de Kuxtal) y <strong>Diario de investigación</strong> (campamento este del templo). Son dos de los siete diarios del logro «Total, yo no sé leer».</li><li><strong>Jade sagrado de Kuxtal</strong> (oculto): en la sala de las losas, encadena <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>. Para repetir la losa 4, bájate y vuelve a subirte. Funciona tanto si la puerta está abierta como si no.<ul><li>Aparece un resplandor en el ojo de la cabeza de serpiente, al oeste de la sala, entre la losa gris grande y la losa verde. Pásale por encima para recoger el jade.</li><li>Efecto: el jade no va al inventario, sino que desbloquea para siempre una habilidad («Habilidad desbloqueada: Lanzamiento de guijarro especial»). El Lanzamiento de piedra de los Zoquetes inflige entonces 8 de daño más la mitad de su ATQ, menos la DEF del objetivo, con una posibilidad entre dos de rebotar en otro enemigo.</li><li>Si no lo tienes, el predicador del puente te lo reprocha.</li><li>Si se te escapa: el templo se derrumba al final del capítulo, pero después el jade se puede comprar en la tienda de la arena de Kuxtal (1000 fichas).</li></ul></li><li><strong>Campamento oeste</strong> y <strong>Mimics</strong>: los consumibles y la EXP solo están disponibles durante el capítulo. Después de la huida, el templo queda cerrado («Todo se ha derrumbado, imposible volver.»).</li><li><strong>Punto de no retorno</strong>: la puerta de arriba del campamento pirata. Después, es imposible salir del volcán, salvo por el resplandor azul del final del puente tras una derrota contra Camazotz.</li><li><strong>El zorro tallado</strong> (opcional): al oeste de Kuxtal, Barbe-Yeux endereza una pequeña estatua atrapada bajo una piedra. No hay recompensa inmediata (la estatuilla llega en el posjuego).</li><li><strong>Logros</strong>:<ul><li>«¿Taberna?» se desbloquea al principio de los créditos finales, si tienes los cinco logros de final de los capítulos 1 a 5. El capítulo 6 no tiene logro propio.</li><li>«Un hombre iluminado»: todas las antorchas compradas, lo que también abre el combate contra Kerwin.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "Capítulo 6 Con las manos en la masa Que no se te escape Que no se te escape Gema roja (2.ª gema de los Bolon Tiku) , en el hogar de Kuxtal: la historia no avanza sin ella. Diario n.º 5 (estelas de Kuxtal) y Diario de investigación (campamento este del templo). Son dos de los siete diarios del logro «Total, yo no sé leer». Jade sagrado de Kuxtal (oculto): en la sala de las losas, encadena 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 . Para repetir la losa 4, bájate y vuelve a subirte. Funciona tanto si la puerta está abierta como si no. Aparece un resplandor en el ojo de la cabeza de serpiente, al oeste de la sala, entre la losa gris grande y la losa verde. Pásale por encima para recoger el jade. Efecto: el jade no va al inventario, sino que desbloquea para siempre una habilidad («Habilidad desbloqueada: Lanzamiento de guijarro especial»). El Lanzamiento de piedra de los Zoquetes inflige entonces 8 de daño más la mitad de su ATQ, menos la DEF del objetivo, con una posibilidad entre dos de rebotar en otro enemigo. Si no lo tienes, el predicador del puente te lo reprocha. Si se te escapa: el templo se derrumba al final del capítulo, pero después el jade se puede comprar en la tienda de la arena de Kuxtal (1000 fichas). Campamento oeste y Mimics : los consumibles y la EXP solo están disponibles durante el capítulo. Después de la huida, el templo queda cerrado («Todo se ha derrumbado, imposible volver.»). Punto de no retorno : la puerta de arriba del campamento pirata. Después, es imposible salir del volcán, salvo por el resplandor azul del final del puente tras una derrota contra Camazotz. El zorro tallado (opcional): al oeste de Kuxtal, Barbe-Yeux endereza una pequeña estatua atrapada bajo una piedra. No hay recompensa inmediata (la estatuilla llega en el posjuego). Logros : «¿Taberna?» se desbloquea al principio de los créditos finales, si tienes los cinco logros de final de los capítulos 1 a 5. El capítulo 6 no tiene logro propio. «Un hombre iluminado»: todas las antorchas compradas, lo que también abre el combate contra Kerwin.", "sol": 0}]}]}], "pt": [{"id": "c6", "num": "Capítulo 6", "titre": "Flagrante", "intro": "<p>O Rei dos Caranguejos, rebatizado de Znippy, entrou para a tripulação. É preciso encontrar Itzel e impedir que Nadaillac abra a porta dos Bolon Tiku. O caminho passa por uma cela de prisão, pela ilha perdida de Kuxtal e depois pelo templo enterrado sob a ilha do vulcão.</p><aside class=\"note\"><p>Observação: a cartela \"Capítulo 6 — Flagrante\" só aparece no momento da prisão. Os dois primeiros objetivos abaixo acontecem antes dela.</p></aside>", "sections": [{"titre": "Missão principal", "intro": "", "entrees": [{"titre": "Bolar um plano (na taverna da Ilha dos Caranguejos).", "html": "<ol><li>Depois de recrutar o Rei dos Caranguejos, entre na taverna da Ilha dos Caranguejos.</li><li>Cena automática: Barbe-Yeux, os dois Paspalhos e Znippy fazem um balanço. Barbe-Yeux entende que o velho prisioneiro de Nassau (aquele que \"fede a mijo\") vem de Kuxtal.</li><li>Os PV e a energia dele são restaurados ao máximo. Novo objetivo: ser preso para falar com o velho.</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "Capítulo 6 Flagrante Missão principal Bolar um plano (na taverna da Ilha dos Caranguejos). Depois de recrutar o Rei dos Caranguejos, entre na taverna da Ilha dos Caranguejos. Cena automática: Barbe-Yeux, os dois Paspalhos e Znippy fazem um balanço. Barbe-Yeux entende que o velho prisioneiro de Nassau (aquele que \"fede a mijo\") vem de Kuxtal. Os PV e a energia dele são restaurados ao máximo. Novo objetivo: ser preso para falar com o velho.", "sol": 0}, {"titre": "Achar um jeito de ser preso.", "html": "<p>Há três pistas possíveis. <strong>Só uma funciona: queimar a loja de Kerwin.</strong></p><ol><li><strong>Os guardas do museu de Nassau</strong> (opcional, uma única vez): aproxime-se de Marcel e Poulichard diante do museu, de dia ou de noite. Barbe-Yeux os provoca e começa um combate. Particularidade: o Paspalho - Rei dos Javalis passa para o lado inimigo logo no primeiro turno, e o Paspalho - Olímpico se junta a ele no segundo. Eles atacam com o remo (o Olímpico nunca erra, o Rei dos Javalis pode errar). Ganhando ou perdendo, a cena continua do mesmo jeito. Os guardas se recusam a te prender, mas uma vitória rende muito XP. O objetivo não muda: é uma pista falsa.</li><li><strong>O assalto à taverna</strong> (opcional, uma única vez): a primeira taverna em que você entrar (Ilha dos Caranguejos, Ilha dos Macacos, Nassau ou Ilha do Vento) mostra uma pequena cena de assalto. Ninguém chama a guarda, e depois o menu normal da taverna se abre.</li><li><strong>A loja de tochas de Kerwin</strong> (Ilha dos Macacos, Ilha do Vento ou Nassau): fale com o vendedor. Um menu se abre:<ul><li>\"Ir embora\": você vai embora, e a cena volta na próxima visita.</li><li>\"Pedir desculpas e comprar uma tocha\": loja normal.</li><li><strong>\"Tacar fogo em tudo\"</strong>: a loja pega fogo.</li></ul></li></ol><p><strong>Solução:</strong> na loja de Kerwin, escolha <strong>\"Tacar fogo em tudo\"</strong>.</p><p>Em seguida:</p><ul><li>A cartela do capítulo 6 aparece, e depois Barbe-Yeux acorda numa cela com o velho prisioneiro.</li><li>O velho confirma que Itzel vem de Kuxtal e marca a localização da ilha no seu mapa.</li><li>Um guarda te solta: a loja não era licenciada. O mapa-múndi se abre direto da prisão. O único destino disponível é Kuxtal.</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "Capítulo 6 Flagrante Missão principal Achar um jeito de ser preso. Há três pistas possíveis. Só uma funciona: queimar a loja de Kerwin. Os guardas do museu de Nassau (opcional, uma única vez): aproxime-se de Marcel e Poulichard diante do museu, de dia ou de noite. Barbe-Yeux os provoca e começa um combate. Particularidade: o Paspalho - Rei dos Javalis passa para o lado inimigo logo no primeiro turno, e o Paspalho - Olímpico se junta a ele no segundo. Eles atacam com o remo (o Olímpico nunca erra, o Rei dos Javalis pode errar). Ganhando ou perdendo, a cena continua do mesmo jeito. Os guardas se recusam a te prender, mas uma vitória rende muito XP. O objetivo não muda: é uma pista falsa. O assalto à taverna (opcional, uma única vez): a primeira taverna em que você entrar (Ilha dos Caranguejos, Ilha dos Macacos, Nassau ou Ilha do Vento) mostra uma pequena cena de assalto. Ninguém chama a guarda, e depois o menu normal da taverna se abre. A loja de tochas de Kerwin (Ilha dos Macacos, Ilha do Vento ou Nassau): fale com o vendedor. Um menu se abre: \"Ir embora\": você vai embora, e a cena volta na próxima visita. \"Pedir desculpas e comprar uma tocha\": loja normal. \"Tacar fogo em tudo\" : a loja pega fogo. Solução: na loja de Kerwin, escolha \"Tacar fogo em tudo\" . Em seguida: A cartela do capítulo 6 aparece, e depois Barbe-Yeux acorda numa cela com o velho prisioneiro. O velho confirma que Itzel vem de Kuxtal e marca a localização da ilha no seu mapa. Um guarda te solta: a loja não era licenciada. O mapa-múndi se abre direto da prisão. O único destino disponível é Kuxtal.", "sol": 1}, {"titre": "Ir até Kuxtal.", "html": "<ol><li>No mapa-múndi, navegue até Kuxtal.</li><li>Não há música na ilha, só o vento e o mar. Na chegada, o grupo conversa (cena automática).</li></ol>", "id": "c6-se-rendre-a-kuxtal", "texte": "Capítulo 6 Flagrante Missão principal Ir até Kuxtal. No mapa-múndi, navegue até Kuxtal. Não há música na ilha, só o vento e o mar. Na chegada, o grupo conversa (cena automática).", "sol": 0}, {"titre": "Explorar as ruínas de Kuxtal.", "html": "<ol><li>Vá até a <strong>lareira</strong>, no centro-norte da ilha (ao norte do ponto de desembarque, mais ou menos no meio). Interaja com ela.</li><li>Um fogo foi abafado e um pano manchado de sangue está amarrado num bastão. Você obtém a <strong>2ª gema dos Bolon Tiku</strong> (a gema vermelha que Itzel carregava).</li></ol>", "id": "c6-explorer-les-ruines-de-kuxtal", "texte": "Capítulo 6 Flagrante Missão principal Explorar as ruínas de Kuxtal. Vá até a lareira , no centro-norte da ilha (ao norte do ponto de desembarque, mais ou menos no meio). Interaja com ela. Um fogo foi abafado e um pano manchado de sangue está amarrado num bastão. Você obtém a 2ª gema dos Bolon Tiku (a gema vermelha que Itzel carregava).", "sol": 0}, {"titre": "Descobrir o passado de Kuxtal.", "html": "<p>Leia as quatro estelas (\"Ler\"), em qualquer ordem. O contador \"Estelas lidas: x / 4\" aparece embaixo do objetivo.</p><div class=\"tab\"><table><thead><tr><th>Estela</th><th>Onde encontrá-la</th></tr></thead><tbody><tr><td>Estela 1</td><td>No leste, perto da grande árvore sagrada</td></tr><tr><td>Estela 2</td><td>No sudoeste, perto da costa sul</td></tr><tr><td>Estela 3</td><td>No noroeste</td></tr><tr><td>Estela 4</td><td>No nordeste</td></tr></tbody></table></div><ul><li>A primeira estela lida te dá o <strong>Diário nº 5</strong>. Cada estela seguinte acrescenta uma entrada a ele, sempre guardada na ordem da história.</li><li>Você pode ler as estelas antes de visitar a lareira. A conclusão só vem depois que as duas coisas forem feitas.</li><li>Quando tudo tiver sido lido e o diário for fechado, Barbe-Yeux tira as conclusões. A <strong>Ilha do Vulcão</strong> aparece no mapa-múndi.</li></ul>", "id": "c6-decouvrir-le-passe-de-kuxtal", "texte": "Capítulo 6 Flagrante Missão principal Descobrir o passado de Kuxtal. Leia as quatro estelas (\"Ler\"), em qualquer ordem. O contador \"Estelas lidas: x / 4\" aparece embaixo do objetivo. Estela Onde encontrá-la Estela 1 No leste, perto da grande árvore sagrada Estela 2 No sudoeste, perto da costa sul Estela 3 No noroeste Estela 4 No nordeste A primeira estela lida te dá o Diário nº 5 . Cada estela seguinte acrescenta uma entrada a ele, sempre guardada na ordem da história. Você pode ler as estelas antes de visitar a lareira. A conclusão só vem depois que as duas coisas forem feitas. Quando tudo tiver sido lido e o diário for fechado, Barbe-Yeux tira as conclusões. A Ilha do Vulcão aparece no mapa-múndi.", "sol": 0}, {"titre": "Ir até a Ilha do Vulcão.", "html": "<ol><li>Navegue até a Ilha do Vulcão. Assim que você desembarca, começa uma cena automática: Nadaillac chama o grupo, Barbe-Yeux caminha até o templo e tropeça no caminho.</li><li>Cena: Nadaillac mantém Itzel sob a mira da arma e fere um dos Paspalhos. Znippy confessa que vocês têm as gemas, e Barbe-Yeux as troca por Itzel. <strong>Todas as gemas dos Bolon Tiku saem do seu inventário.</strong> Nadaillac quebra a palavra na mesma hora e solta os esqueletos dele.</li><li><strong>Combate contra os esqueletos de Nadaillac</strong> (5 esqueletos). O seu grupo: Barbe-Yeux, o Paspalho - Rei dos Javalis e o Rei dos Caranguejos, sem o supremo dele. Se você perder, o combate recomeça na hora com PV e energia cheios.</li><li>Cena do medalhão (não dá para pular). O templo desperta, Znippy liberta Itzel. Itzel se junta ao grupo e propõe \"outro caminho\".</li><li>Você retoma o controle no acampamento de piratas do templo (a Caldeira). A partir daí, o grupo te segue completo: os dois Paspalhos, Itzel e Znippy.</li></ol><p>Para sair da ilha, pegue o barco no sul da ilha (\"Embarcar\" / \"Ficar\").</p>", "id": "c6-se-rendre-sur-l-ile-du-volcan", "texte": "Capítulo 6 Flagrante Missão principal Ir até a Ilha do Vulcão. Navegue até a Ilha do Vulcão. Assim que você desembarca, começa uma cena automática: Nadaillac chama o grupo, Barbe-Yeux caminha até o templo e tropeça no caminho. Cena: Nadaillac mantém Itzel sob a mira da arma e fere um dos Paspalhos. Znippy confessa que vocês têm as gemas, e Barbe-Yeux as troca por Itzel. Todas as gemas dos Bolon Tiku saem do seu inventário. Nadaillac quebra a palavra na mesma hora e solta os esqueletos dele. Combate contra os esqueletos de Nadaillac (5 esqueletos). O seu grupo: Barbe-Yeux, o Paspalho - Rei dos Javalis e o Rei dos Caranguejos, sem o supremo dele. Se você perder, o combate recomeça na hora com PV e energia cheios. Cena do medalhão (não dá para pular). O templo desperta, Znippy liberta Itzel. Itzel se junta ao grupo e propõe \"outro caminho\". Você retoma o controle no acampamento de piratas do templo (a Caldeira). A partir daí, o grupo te segue completo: os dois Paspalhos, Itzel e Znippy. Para sair da ilha, pegue o barco no sul da ilha (\"Embarcar\" / \"Ficar\").", "sol": 0}, {"titre": "Encontrar uma passagem até o coração do vulcão.", "html": "<p><strong>1. O acampamento de piratas (primeira sala do templo)</strong></p><ul><li>Você entra pela parte de baixo da sala. A porta que leva adiante fica em cima, no centro.</li><li><strong>Acampamento leste</strong> (no centro-direita, 6 piratas): <strong>obrigatório</strong>. A vitória te dá o <strong>Diário de pesquisas</strong>, que se abre na hora, mais 3 cervejas e um Fricassê do Náufrago.</li><li><strong>Acampamento oeste</strong> (à esquerda, 4 piratas): opcional. Ele dá 2 cervejas e um Filé de peixe caprichado.</li><li>Enquanto você não tiver o Diário de pesquisas, a porta de cima fica fechada. Barbe-Yeux então diz: \"Esses piratas estão escondendo alguma coisa…\".</li><li>Ao passar pela porta de cima, o jogo pede uma confirmação (\"Você está entrando na fase final…\"): <strong>é o ponto sem volta</strong>. Se você aceitar, a porta de baixo da sala das lajes não leva mais de volta ao acampamento, e a porta do templo, na ilha, não se abre mais. Faça os seus preparativos antes (acampamento oeste, compras, curas).</li><li>Depois de passar do ponto sem volta, você ainda pode voltar da sala do tesouro para a sala das lajes, mas não do labirinto para a sala do tesouro.</li><li><strong>Derrota no templo</strong> (acampamento, guardiões, Mimics, espíritos): você acorda na taverna da Ilha dos Caranguejos, com PV e energia cheios. Depois do ponto sem volta, <strong>salve antes de cada combate</strong> e carregue o save em caso de derrota: a porta do templo continua fechada pelo lado da ilha.</li></ul><p><strong>2. A sala das lajes (segunda sala, no escuro)</strong> Todo mundo acende a tocha. A sala tem <strong>quatro lajes</strong> no chão e uma fonte no centro.</p><div class=\"tab\"><table><thead><tr><th>Laje</th><th>Aparência</th><th>Localização</th></tr></thead><tbody><tr><td>1</td><td>Laje cinza pequena</td><td>Nordeste</td></tr><tr><td>2</td><td>Laje média <strong>verde</strong></td><td>Oeste, na metade de baixo</td></tr><tr><td>3</td><td>Laje média <strong>rosa</strong></td><td>Leste, na metade de baixo</td></tr><tr><td>4</td><td>Laje cinza grande</td><td>Noroeste</td></tr></tbody></table></div><p><em>a) As salas dos guardiões.</em> Toda vez que você pisa numa laje diferente da anterior, uma das quatro salas de cima se abre e <strong>dois guardiões</strong> te atacam. São, portanto, 4 combates no total.</p><ul><li>O primeiro guardião se teletransporta para a frente do alvo e ataca uma vez.</li><li>O segundo emenda três golpes em alvos aleatórios.</li></ul><p>Se você perder, a sala não é contada e vai se abrir de novo mais tarde. Os guardiões, assim como os Mimics e os espíritos mais adiante, atacam de preferência um Paspalho que esteja provocando (Rolamento). Depois do 4º combate, a fonte central se enche: \"Regenerar\" restaura PV e energia ao máximo, sem limite.</p><p><em>b) A porta.</em> O Diário de pesquisas mostra uma sequência de seis máscaras. Cada uma vem com um número maia, de 1 a 6 em pontos e barras, que indica a ordem. A cor e o tamanho de cada máscara indicam uma laje: cinza grande = laje 4, verde = laje 2, rosa = laje 3, cinza pequena = laje 1.</p><p><strong>Solução:</strong> pise nas lajes na ordem <strong>4 – 2 – 3 – 4 – 3 – 1</strong>, ou seja: cinza grande, verde, rosa, cinza grande, rosa, cinza pequena.</p><ul><li>Só conta uma nova pisada: uma laje fica afundada enquanto alguém estiver em cima dela, inclusive um membro do grupo que te segue.</li><li>O jogo só guarda as <strong>6 últimas pisadas</strong>. Se errar, basta recomeçar a sequência do início.</li><li>Dica: o botão da ampulheta, no canto inferior direito, ativa o <strong>modo cooperativo</strong>. Barbe-Yeux, os dois Paspalhos e Itzel ficam onde estão, e você move um de cada vez. Znippy não é jogável: ele sempre segue Barbe-Yeux e pode afundar uma laje atrás dele. O mais seguro: deixe Barbe-Yeux (e portanto Znippy) longe das lajes, e faça a sequência com um Paspalho ou com Itzel.</li><li>A sequência certa abre a porta de cima e reúne a equipe.</li></ul><p><strong>3. A sala do tesouro (terceira sala)</strong></p><ul><li>30 baús estão arrumados em <strong>3 fileiras de 10</strong> no grande salão de cima. Chegue perto de um baú e escolha \"Abrir\".</li><li>Todos os baús menos um são <strong>Mimics</strong>: um único inimigo, muito resistente, que morde três alvos por turno. Fuga impossível. Cada Mimic derrotado dá de 1 a 3 consumíveis e muito XP. Um baú aberto continua aberto: um Mimic contra o qual você perdeu não volta, e o espólio dele se perde.</li><li>Dica: andando rente à parede de cima, uma luz varre a sala devagar. Ela revela duas figuras gravadas, cada uma com um número maia verde: <strong>2 pontos</strong> (= 2) à esquerda, <strong>uma barra e 4 pontos</strong> (= 9) à direita.</li></ul><p><strong>Solução:</strong> abra o baú da <strong>2ª fileira</strong> (a do meio), <strong>9º a partir da esquerda</strong> (o penúltimo à direita). Ele abre a porta do fundo, em cima ao centro.</p><p><strong>4. O labirinto dos espíritos (quarta sala)</strong></p><ul><li>Ao entrar, tudo fica escuro. Risadas explodem e olhos se acendem na escuridão (cena).</li><li>Itzel coloca a máscara e <strong>assume a liderança</strong>. O caminho luminoso só fica visível em volta dela, no ritmo de um batimento cardíaco. Espectros vagam pelos corredores, mas são inofensivos.</li><li>Grupo de espíritos <strong>obrigatório</strong> no centro da sala, no caminho: Poom, Jo'oche' e Nikte'.<ul><li>Poom envenena o grupo todo.</li><li>Jo'oche' amaldiçoa um personagem por turno. O alvo morre quando Jo'oche' tiver jogado mais 3 vezes, a não ser que Jo'oche' caia antes. <strong>Mate Jo'oche' primeiro.</strong></li><li>Nikte' solta um grito que fere o grupo todo. Ele bate forte, mas tem poucos PV.</li></ul></li><li>Outros quatro grupos de espíritos, opcionais, esperam nos cantos: noroeste, oeste, leste e nordeste. Cada espírito derrotado dá um consumível aleatório.</li><li><strong>Itinerário</strong>: a partir da entrada (embaixo ao centro), suba até o centro (combate). Depois siga para o oeste, ziguezagueie para o norte até o corredor do noroeste e volte para o leste. Desça um pouco e atravesse para o leste por um longo corredor no meio da altura. Desça pelo lado leste e depois suba toda a borda leste até o alto. Por fim, volte para o oeste até a porta, em cima ao centro.</li><li>A porta, em cima ao centro, se abre sozinha quando você chega na frente dela.</li></ul><p><strong>5. A ponte (quinta sala)</strong></p><ul><li>Acabou a escuridão: todo mundo volta a seguir Barbe-Yeux. Suba a longa ponte para o norte.</li><li><strong>O velho da gruta</strong> (o da Ilha dos Macacos) bloqueia o seu caminho (\"VOCÊS… NÃO PASSARÃO…!\"). Vá até ele: cena com flashback, e depois ele te deixa passar. Contorne-o pela direita dele.</li><li>Mais acima, <strong>o pregador</strong> de Morro Blanco faz o mesmo: cena, flashback, passagem.</li><li>Lá no alto, à direita da saída, uma <strong>fonte</strong> oferece \"Regenerar\" (PV e energia ao máximo).</li><li><strong>Cure-se e prepare-se aqui</strong>: entrar na sala seguinte leva direto ao chefe final.</li></ul>", "id": "c6-trouver-un-passage-au-c-ur-du-volcan", "texte": "Capítulo 6 Flagrante Missão principal Encontrar uma passagem até o coração do vulcão. 1. O acampamento de piratas (primeira sala do templo) Você entra pela parte de baixo da sala. A porta que leva adiante fica em cima, no centro. Acampamento leste (no centro-direita, 6 piratas): obrigatório . A vitória te dá o Diário de pesquisas , que se abre na hora, mais 3 cervejas e um Fricassê do Náufrago. Acampamento oeste (à esquerda, 4 piratas): opcional. Ele dá 2 cervejas e um Filé de peixe caprichado. Enquanto você não tiver o Diário de pesquisas, a porta de cima fica fechada. Barbe-Yeux então diz: \"Esses piratas estão escondendo alguma coisa…\". Ao passar pela porta de cima, o jogo pede uma confirmação (\"Você está entrando na fase final…\"): é o ponto sem volta . Se você aceitar, a porta de baixo da sala das lajes não leva mais de volta ao acampamento, e a porta do templo, na ilha, não se abre mais. Faça os seus preparativos antes (acampamento oeste, compras, curas). Depois de passar do ponto sem volta, você ainda pode voltar da sala do tesouro para a sala das lajes, mas não do labirinto para a sala do tesouro. Derrota no templo (acampamento, guardiões, Mimics, espíritos): você acorda na taverna da Ilha dos Caranguejos, com PV e energia cheios. Depois do ponto sem volta, salve antes de cada combate e carregue o save em caso de derrota: a porta do templo continua fechada pelo lado da ilha. 2. A sala das lajes (segunda sala, no escuro) Todo mundo acende a tocha. A sala tem quatro lajes no chão e uma fonte no centro. Laje Aparência Localização 1 Laje cinza pequena Nordeste 2 Laje média verde Oeste, na metade de baixo 3 Laje média rosa Leste, na metade de baixo 4 Laje cinza grande Noroeste a) As salas dos guardiões. Toda vez que você pisa numa laje diferente da anterior, uma das quatro salas de cima se abre e dois guardiões te atacam. São, portanto, 4 combates no total. O primeiro guardião se teletransporta para a frente do alvo e ataca uma vez. O segundo emenda três golpes em alvos aleatórios. Se você perder, a sala não é contada e vai se abrir de novo mais tarde. Os guardiões, assim como os Mimics e os espíritos mais adiante, atacam de preferência um Paspalho que esteja provocando (Rolamento). Depois do 4º combate, a fonte central se enche: \"Regenerar\" restaura PV e energia ao máximo, sem limite. b) A porta. O Diário de pesquisas mostra uma sequência de seis máscaras. Cada uma vem com um número maia, de 1 a 6 em pontos e barras, que indica a ordem. A cor e o tamanho de cada máscara indicam uma laje: cinza grande = laje 4, verde = laje 2, rosa = laje 3, cinza pequena = laje 1. Solução: pise nas lajes na ordem 4 – 2 – 3 – 4 – 3 – 1 , ou seja: cinza grande, verde, rosa, cinza grande, rosa, cinza pequena. Só conta uma nova pisada: uma laje fica afundada enquanto alguém estiver em cima dela, inclusive um membro do grupo que te segue. O jogo só guarda as 6 últimas pisadas . Se errar, basta recomeçar a sequência do início. Dica: o botão da ampulheta, no canto inferior direito, ativa o modo cooperativo . Barbe-Yeux, os dois Paspalhos e Itzel ficam onde estão, e você move um de cada vez. Znippy não é jogável: ele sempre segue Barbe-Yeux e pode afundar uma laje atrás dele. O mais seguro: deixe Barbe-Yeux (e portanto Znippy) longe das lajes, e faça a sequência com um Paspalho ou com Itzel. A sequência certa abre a porta de cima e reúne a equipe. 3. A sala do tesouro (terceira sala) 30 baús estão arrumados em 3 fileiras de 10 no grande salão de cima. Chegue perto de um baú e escolha \"Abrir\". Todos os baús menos um são Mimics : um único inimigo, muito resistente, que morde três alvos por turno. Fuga impossível. Cada Mimic derrotado dá de 1 a 3 consumíveis e muito XP. Um baú aberto continua aberto: um Mimic contra o qual você perdeu não volta, e o espólio dele se perde. Dica: andando rente à parede de cima, uma luz varre a sala devagar. Ela revela duas figuras gravadas, cada uma com um número maia verde: 2 pontos (= 2) à esquerda, uma barra e 4 pontos (= 9) à direita. Solução: abra o baú da 2ª fileira (a do meio), 9º a partir da esquerda (o penúltimo à direita). Ele abre a porta do fundo, em cima ao centro. 4. O labirinto dos espíritos (quarta sala) Ao entrar, tudo fica escuro. Risadas explodem e olhos se acendem na escuridão (cena). Itzel coloca a máscara e assume a liderança . O caminho luminoso só fica visível em volta dela, no ritmo de um batimento cardíaco. Espectros vagam pelos corredores, mas são inofensivos. Grupo de espíritos obrigatório no centro da sala, no caminho: Poom, Jo'oche' e Nikte'. Poom envenena o grupo todo. Jo'oche' amaldiçoa um personagem por turno. O alvo morre quando Jo'oche' tiver jogado mais 3 vezes, a não ser que Jo'oche' caia antes. Mate Jo'oche' primeiro. Nikte' solta um grito que fere o grupo todo. Ele bate forte, mas tem poucos PV. Outros quatro grupos de espíritos, opcionais, esperam nos cantos: noroeste, oeste, leste e nordeste. Cada espírito derrotado dá um consumível aleatório. Itinerário : a partir da entrada (embaixo ao centro), suba até o centro (combate). Depois siga para o oeste, ziguezagueie para o norte até o corredor do noroeste e volte para o leste. Desça um pouco e atravesse para o leste por um longo corredor no meio da altura. Desça pelo lado leste e depois suba toda a borda leste até o alto. Por fim, volte para o oeste até a porta, em cima ao centro. A porta, em cima ao centro, se abre sozinha quando você chega na frente dela. 5. A ponte (quinta sala) Acabou a escuridão: todo mundo volta a seguir Barbe-Yeux. Suba a longa ponte para o norte. O velho da gruta (o da Ilha dos Macacos) bloqueia o seu caminho (\"VOCÊS… NÃO PASSARÃO…!\"). Vá até ele: cena com flashback, e depois ele te deixa passar. Contorne-o pela direita dele. Mais acima, o pregador de Morro Blanco faz o mesmo: cena, flashback, passagem. Lá no alto, à direita da saída, uma fonte oferece \"Regenerar\" (PV e energia ao máximo). Cure-se e prepare-se aqui : entrar na sala seguinte leva direto ao chefe final.", "sol": 2}, {"titre": "Avançar mais fundo em Xibalba.", "html": "<ol><li>Cena da <strong>porta do medalhão</strong>: Nadaillac está diante da porta, Itzel grita \"Pare!\". Nadaillac abre a porta com o medalhão, sem nenhuma ação sua.</li><li>\"Vamos atrás deles.\": o grupo avança sozinho e entra no covil.</li></ol>", "id": "c6-s-enfoncer-dans-xibalba", "texte": "Capítulo 6 Flagrante Missão principal Avançar mais fundo em Xibalba. Cena da porta do medalhão : Nadaillac está diante da porta, Itzel grita \"Pare!\". Nadaillac abre a porta com o medalhão, sem nenhuma ação sua. \"Vamos atrás deles.\": o grupo avança sozinho e entra no covil.", "sol": 0}, {"titre": "Enfrentar Camazotz.", "html": "<p>O combate final tem três fases seguidas.</p><p><strong>Se você perder na fase 1 ou 2:</strong></p><ul><li>Você acorda no fim da ponte, diante da fonte, com PV e energia cheios (\"Camazotz ainda não acabou com vocês!\").</li><li>Passe de novo pela saída de cima: o combate recomeça direto na fase perdida, sem a cena da porta.</li><li>Logo na primeira derrota, aparecem dois <strong>brilhos azuis</strong>. O do fim da ponte, à esquerda da saída, de frente para a fonte, oferece \"Voltar ao barco\". Ele te deixa na praia da Ilha do Vulcão, à direita do barco. Lá, outro brilho oferece \"Ir ao fim da ponte\". Assim, você pode ir treinar ou fazer compras em outro lugar e depois voltar. Os brilhos desaparecem depois que Camazotz for derrotado.</li><li>Na dificuldade Normal, na 2ª derrota (e depois a cada duas derrotas), o jogo propõe passar para a <strong>dificuldade Aventura</strong>: dano recebido -20 %, dano causado +20 %, curas +30 %. Responda sim para ativá-la na hora. Ela também pode ser mudada a qualquer momento em Preferências &gt; Nível de dificuldade.</li></ul><p><strong>Fase 1 — o Arauto de Xibalba e Kab'raqan</strong></p><ul><li>O seu grupo: Barbe-Yeux, os dois Paspalhos, Itzel, <strong>Nadaillac (aliado jogável)</strong> e Znippy, sem o supremo dele.</li><li>Nadaillac tem três habilidades:<ul><li>Sabre: muito forte.</li><li>Granada: seis golpes em todos os inimigos, utilizável a cada quatro turnos.</li><li>Tiro: duas balas, você escolhe o alvo de cada uma, sem recarga.</li></ul></li><li>O Arauto repete os ataques do templo da selva (incluindo a invocação de espíritos). Kab'raqan repete a primeira fase dele: voo, bolas de fogo, cone de chamas, e depois ele pousa na metade da vida.</li></ul><p><strong>Fase 2 — Camazotz</strong></p><ul><li>Camazotz chega com 3 invocações. Ele segue um ciclo fixo de 4 ataques:<ol><li>Bola de fogo tripla.</li><li>Revoada de morcegos: golpes aleatórios, mais a invocação de um espírito, alternando Jo'oche', Poom e Nikte'.</li><li><strong>Onda de choque</strong>: 40, depois 50, depois 120 de dano no grupo todo (20 % a menos na dificuldade Aventura).</li><li>Arranhão: dois aliados aleatórios, muito dano.</li></ol></li><li>Cure o grupo logo antes da onda de choque (3º ataque do ciclo). Elimine Jo'oche' assim que ele aparecer.</li><li>Quando Camazotz fica abaixo de <strong>16 000 PV</strong>:<ul><li>ele invoca mais 3 lacaios;</li><li>Znippy solta o supremo dele e depois foge;</li><li><strong>Itzel coloca a máscara</strong> até o fim do combate: ataques fortalecidos, e você mesmo distribui as balas do tiro devastador dela. A granada de fumaça dela faz então os inimigos na fumaça errarem <strong>75 %</strong> dos ataques (50 % sem a máscara).</li></ul></li><li>Em <strong>11 000 PV</strong>, o combate para: Nadaillac exige a porta dele, Camazotz o mata e se levanta de novo.</li></ul><p><strong>Fase 3 — o combate de ritmo</strong> (veja Minijogos). É preciso derrubar os 11 000 PV restantes antes do fim da música. O combate sempre dura até a última nota. Se você falhar, joga esta fase de novo na hora (sem voltar à ponte).</p>", "id": "c6-affronter-camazotz", "texte": "Capítulo 6 Flagrante Missão principal Enfrentar Camazotz. O combate final tem três fases seguidas. Se você perder na fase 1 ou 2: Você acorda no fim da ponte, diante da fonte, com PV e energia cheios (\"Camazotz ainda não acabou com vocês!\"). Passe de novo pela saída de cima: o combate recomeça direto na fase perdida, sem a cena da porta. Logo na primeira derrota, aparecem dois brilhos azuis . O do fim da ponte, à esquerda da saída, de frente para a fonte, oferece \"Voltar ao barco\". Ele te deixa na praia da Ilha do Vulcão, à direita do barco. Lá, outro brilho oferece \"Ir ao fim da ponte\". Assim, você pode ir treinar ou fazer compras em outro lugar e depois voltar. Os brilhos desaparecem depois que Camazotz for derrotado. Na dificuldade Normal, na 2ª derrota (e depois a cada duas derrotas), o jogo propõe passar para a dificuldade Aventura : dano recebido -20 %, dano causado +20 %, curas +30 %. Responda sim para ativá-la na hora. Ela também pode ser mudada a qualquer momento em Preferências > Nível de dificuldade. Fase 1 — o Arauto de Xibalba e Kab'raqan O seu grupo: Barbe-Yeux, os dois Paspalhos, Itzel, Nadaillac (aliado jogável) e Znippy, sem o supremo dele. Nadaillac tem três habilidades: Sabre: muito forte. Granada: seis golpes em todos os inimigos, utilizável a cada quatro turnos. Tiro: duas balas, você escolhe o alvo de cada uma, sem recarga. O Arauto repete os ataques do templo da selva (incluindo a invocação de espíritos). Kab'raqan repete a primeira fase dele: voo, bolas de fogo, cone de chamas, e depois ele pousa na metade da vida. Fase 2 — Camazotz Camazotz chega com 3 invocações. Ele segue um ciclo fixo de 4 ataques: Bola de fogo tripla. Revoada de morcegos: golpes aleatórios, mais a invocação de um espírito, alternando Jo'oche', Poom e Nikte'. Onda de choque : 40, depois 50, depois 120 de dano no grupo todo (20 % a menos na dificuldade Aventura). Arranhão: dois aliados aleatórios, muito dano. Cure o grupo logo antes da onda de choque (3º ataque do ciclo). Elimine Jo'oche' assim que ele aparecer. Quando Camazotz fica abaixo de 16 000 PV : ele invoca mais 3 lacaios; Znippy solta o supremo dele e depois foge; Itzel coloca a máscara até o fim do combate: ataques fortalecidos, e você mesmo distribui as balas do tiro devastador dela. A granada de fumaça dela faz então os inimigos na fumaça errarem 75 % dos ataques (50 % sem a máscara). Em 11 000 PV , o combate para: Nadaillac exige a porta dele, Camazotz o mata e se levanta de novo. Fase 3 — o combate de ritmo (veja Minijogos). É preciso derrubar os 11 000 PV restantes antes do fim da música. O combate sempre dura até a última nota. Se você falhar, joga esta fase de novo na hora (sem voltar à ponte).", "sol": 0}, {"titre": "Fugir de Xibalba antes que tudo desabe.", "html": "<ol><li>O templo desmorona. Barbe-Yeux monta num Paspalho, Itzel monta no outro. Não dá para descer da montaria.</li><li>Um <strong>cronômetro de 50 segundos</strong>, no canto superior direito, cobre <strong>o trajeto todo</strong>. Ele pausa durante as transições entre as salas e fica vermelho abaixo de 10 segundos.</li><li>Refaça o caminho ao contrário, sempre rumo à <strong>saída de baixo</strong> de cada sala: a porta do medalhão, a ponte (desça reto), o labirinto (o mesmo caminho da ida, ao contrário), a sala do tesouro, a sala das lajes e depois o acampamento. Novos escombros atrapalham as salas. As pedras que caem são apenas visuais.</li><li>Se o cronômetro zerar (\"Tarde demais!\"), você recomeça na sala da porta, com o cronômetro cheio.</li><li>Diálogo final diante do mar, e depois os <strong>créditos finais</strong>, ao som da canção do Rei dos Perrengues (um botão permite pulá-los). Lembranças da aventura passam pelas laterais, com as estatísticas da sua partida: precisão contra Camazotz, mortes, quedas, ouro ganho, cervejas bebidas, missões secundárias, tempo de jogo… No meio dos créditos, Znippy, armado até as pinças, passa no canto inferior esquerdo para pedir desculpas.</li><li>Uma última tela, \"Obrigado por jogar!\", fica exibida até você clicar.</li><li>Depois você se vê diante da taverna da Ilha dos Caranguejos, só com Barbe-Yeux e os dois Paspalhos: o resto está no pós-jogo.</li></ol>", "id": "c6-fuir-xibalba-avant-que-tout-s-effondre", "texte": "Capítulo 6 Flagrante Missão principal Fugir de Xibalba antes que tudo desabe. O templo desmorona. Barbe-Yeux monta num Paspalho, Itzel monta no outro. Não dá para descer da montaria. Um cronômetro de 50 segundos , no canto superior direito, cobre o trajeto todo . Ele pausa durante as transições entre as salas e fica vermelho abaixo de 10 segundos. Refaça o caminho ao contrário, sempre rumo à saída de baixo de cada sala: a porta do medalhão, a ponte (desça reto), o labirinto (o mesmo caminho da ida, ao contrário), a sala do tesouro, a sala das lajes e depois o acampamento. Novos escombros atrapalham as salas. As pedras que caem são apenas visuais. Se o cronômetro zerar (\"Tarde demais!\"), você recomeça na sala da porta, com o cronômetro cheio. Diálogo final diante do mar, e depois os créditos finais , ao som da canção do Rei dos Perrengues (um botão permite pulá-los). Lembranças da aventura passam pelas laterais, com as estatísticas da sua partida: precisão contra Camazotz, mortes, quedas, ouro ganho, cervejas bebidas, missões secundárias, tempo de jogo… No meio dos créditos, Znippy, armado até as pinças, passa no canto inferior esquerdo para pedir desculpas. Uma última tela, \"Obrigado por jogar!\", fica exibida até você clicar. Depois você se vê diante da taverna da Ilha dos Caranguejos, só com Barbe-Yeux e os dois Paspalhos: o resto está no pós-jogo.", "sol": 0}]}, {"titre": "Missões secundárias", "intro": "<p>Nenhuma missão secundária do diário começa neste capítulo. Mas um encontro opcional depende dele:</p>", "entrees": [{"titre": "Chefe opcional: Kerwin – O vendedor de tochas", "html": "<ul><li><strong>Gatilho</strong>: a qualquer momento do jogo, volte a falar com Kerwin depois de ter <strong>todas as tochas que podem ser compradas</strong>. Ele quer pegá-las de volta.</li><li><strong>Combate</strong>: Kerwin muda de estado num ciclo fixo. A cor das tochas que giram em volta dele anuncia o próximo ataque:<ol><li>Tocha instável (vermelho-alaranjada), 3 turnos <strong>voando</strong>: 2 tochas arremessadas por turno, queimadura. Voando, o sabre e o remo não o atingem.</li><li>Fósforo e resina (verde): envenena um alvo.</li><li>Aurora negra (roxa): amaldiçoa um alvo, que morre quando Kerwin tiver jogado mais 3 vezes, a não ser que ele caia antes.</li><li>Tocha Compota (laranja): gruda um alvo, que perde o turno.</li><li>Clarão branco: clarão ofuscante no grupo todo.</li><li>Mogno Prestígio (dourada): golpe pesado, e ele se cura.</li></ol></li></ul><p>A não ser durante a Tocha instável, ele fica <strong>no chão</strong> e pode voltar a ser atacado corpo a corpo.</p><ul><li><strong>Se você perder</strong>: derrota normal. Depois, a loja oferece \"Vem pegar a sua parte, você aí.\" para tentar de novo.</li><li><strong>Recompensa</strong>: o XP de um nível inteiro (no seu nível do momento), e você fica com as suas tochas (\"Principalmente da de mogno\").</li></ul>", "id": "c6-boss-facultatif-kerwin-le-vendeur-de-torches", "texte": "Capítulo 6 Flagrante Missões secundárias Chefe opcional: Kerwin – O vendedor de tochas Gatilho : a qualquer momento do jogo, volte a falar com Kerwin depois de ter todas as tochas que podem ser compradas . Ele quer pegá-las de volta. Combate : Kerwin muda de estado num ciclo fixo. A cor das tochas que giram em volta dele anuncia o próximo ataque: Tocha instável (vermelho-alaranjada), 3 turnos voando : 2 tochas arremessadas por turno, queimadura. Voando, o sabre e o remo não o atingem. Fósforo e resina (verde): envenena um alvo. Aurora negra (roxa): amaldiçoa um alvo, que morre quando Kerwin tiver jogado mais 3 vezes, a não ser que ele caia antes. Tocha Compota (laranja): gruda um alvo, que perde o turno. Clarão branco: clarão ofuscante no grupo todo. Mogno Prestígio (dourada): golpe pesado, e ele se cura. A não ser durante a Tocha instável, ele fica no chão e pode voltar a ser atacado corpo a corpo. Se você perder : derrota normal. Depois, a loja oferece \"Vem pegar a sua parte, você aí.\" para tentar de novo. Recompensa : o XP de um nível inteiro (no seu nível do momento), e você fica com as suas tochas (\"Principalmente da de mogno\").", "sol": 0}]}, {"titre": "Minijogos", "intro": "", "entrees": [{"titre": "Combate de ritmo contra Camazotz (fase 3)", "html": "<ul><li><strong>Regras</strong>: as notas deslizam até uma mira. Aperte a seta de movimento correspondente (cima, baixo, esquerda, direita) no momento certo. Há três tipos de nota:<ul><li>as notas simples;</li><li>as notas <strong>sustentadas</strong>: segure a tecla até o fim;</li><li>as notas <strong>marteladas</strong>, anunciadas por \"PANCADARIA!\": aperte muito rápido e várias vezes.</li></ul></li><li><strong>Avaliação</strong>:<ul><li>Perfeito: a menos de 0,06 s;</li><li>Bom: a menos de 0,15 s;</li><li>Passável: a menos de 0,22 s;</li><li>além disso: Errou.</li></ul></li><li><strong>Andamento</strong>: a música é dividida em sequências. Conforme a sua pontuação em cada sequência, os seus aliados atacam Camazotz, ou ele ataca o grupo (bolas de fogo, revoada, onda de choque).</li><li><strong>Camazotz no fim das forças</strong>: se os 11 000 PV dele acabarem antes do fim, ele fica com 1 PV. A música continua, mas ele não ataca nem invoca mais nada, e as queimaduras, venenos e maldições em curso desaparecem. Ele morre na sua revoada de morcegos na última nota. Jogue até o fim mesmo assim: a sua contagem final (perfeitos, bons, passáveis, erros) aparece depois nos créditos.</li><li><strong>Pausa</strong>: Esc ou P (a tecla é lembrada no canto superior esquerdo da tela).</li><li><strong>Derrota</strong>: se o grupo todo cair (\"A tripulação desaba...\"), ou se a música acabar com Camazotz de pé (\"Fim da música!\"), a tela de resultado oferece \"Jogar de novo\" e um modo mais suave. O modo escolhido fica salvo com a partida:<ul><li>Normal: o combate como ele é.</li><li>Tolerante: janelas de tempo mais largas, notas sustentadas e marteladas suavizadas.</li><li>Simplificado: como o Tolerante, mas qualquer seta vale para todas as notas. Ainda dá para perder.</li><li>História: cada sequência conta como bem-sucedida. O grupo nunca cai, e Camazotz cai no fim da música.</li></ul></li><li><strong>Recompensa</strong>: a vitória dá início à fuga de Xibalba.</li></ul>", "id": "c6-combat-de-rythme-contre-camazotz-phase-3", "texte": "Capítulo 6 Flagrante Minijogos Combate de ritmo contra Camazotz (fase 3) Regras : as notas deslizam até uma mira. Aperte a seta de movimento correspondente (cima, baixo, esquerda, direita) no momento certo. Há três tipos de nota: as notas simples; as notas sustentadas : segure a tecla até o fim; as notas marteladas , anunciadas por \"PANCADARIA!\": aperte muito rápido e várias vezes. Avaliação : Perfeito: a menos de 0,06 s; Bom: a menos de 0,15 s; Passável: a menos de 0,22 s; além disso: Errou. Andamento : a música é dividida em sequências. Conforme a sua pontuação em cada sequência, os seus aliados atacam Camazotz, ou ele ataca o grupo (bolas de fogo, revoada, onda de choque). Camazotz no fim das forças : se os 11 000 PV dele acabarem antes do fim, ele fica com 1 PV. A música continua, mas ele não ataca nem invoca mais nada, e as queimaduras, venenos e maldições em curso desaparecem. Ele morre na sua revoada de morcegos na última nota. Jogue até o fim mesmo assim: a sua contagem final (perfeitos, bons, passáveis, erros) aparece depois nos créditos. Pausa : Esc ou P (a tecla é lembrada no canto superior esquerdo da tela). Derrota : se o grupo todo cair (\"A tripulação desaba...\"), ou se a música acabar com Camazotz de pé (\"Fim da música!\"), a tela de resultado oferece \"Jogar de novo\" e um modo mais suave. O modo escolhido fica salvo com a partida: Normal: o combate como ele é. Tolerante: janelas de tempo mais largas, notas sustentadas e marteladas suavizadas. Simplificado: como o Tolerante, mas qualquer seta vale para todas as notas. Ainda dá para perder. História: cada sequência conta como bem-sucedida. O grupo nunca cai, e Camazotz cai no fim da música. Recompensa : a vitória dá início à fuga de Xibalba.", "sol": 0}, {"titre": "Fuga cronometrada", "html": "<p>Veja o objetivo \"Fugir de Xibalba antes que tudo desabe.\": 50 segundos para o trajeto todo, tentativas ilimitadas.</p>", "id": "c6-fuite-chronometree", "texte": "Capítulo 6 Flagrante Minijogos Fuga cronometrada Veja o objetivo \"Fugir de Xibalba antes que tudo desabe.\": 50 segundos para o trajeto todo, tentativas ilimitadas.", "sol": 0}]}, {"titre": "Imperdível", "intro": "", "entrees": [{"titre": "Imperdível", "html": "<ul><li><strong>Gema vermelha (2ª gema dos Bolon Tiku)</strong>, na lareira de Kuxtal: a história não avança sem ela.</li><li><strong>Diário nº 5</strong> (estelas de Kuxtal) e <strong>Diário de pesquisas</strong> (acampamento leste do templo). São dois dos sete diários da conquista \"Até porque eu nem sei ler\".</li><li><strong>Jade Sagrado de Kuxtal</strong> (escondido): na sala das lajes, faça a sequência <strong>4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1</strong>. Para repetir a laje 4, desça dela e suba de novo. Funciona com a porta aberta ou não.<ul><li>Um brilho aparece no olho da cabeça de serpente, no oeste da sala, entre a laje cinza grande e a laje verde. Pise nele para pegar o jade.</li><li>Efeito: o jade não vai para o inventário; ele desbloqueia de vez uma habilidade (\"Habilidade desbloqueada: Arremesso de Pedrinha Especial\"). O Arremesso de Pedrinha dos Paspalhos passa então a causar 8 de dano mais metade da ATQ deles, menos a DEF do alvo, com uma chance em duas de ricochetear em outro inimigo.</li><li>Se você não o tiver, o pregador da ponte te dá uma bronca.</li><li>Se você perdê-lo: o templo desaba no fim do capítulo, mas depois o jade pode ser comprado na loja da arena de Kuxtal (1000 fichas).</li></ul></li><li><strong>Acampamento oeste</strong> e <strong>Mimics</strong>: os consumíveis e o XP só ficam acessíveis durante o capítulo. Depois da fuga, o templo fica fechado (\"Tudo desabou, impossível voltar lá.\").</li><li><strong>Ponto sem volta</strong>: a porta de cima do acampamento de piratas. Depois dela, é impossível sair do vulcão, a não ser pelo brilho azul do fim da ponte depois de uma derrota contra Camazotz.</li><li><strong>A raposa esculpida</strong> (opcional): no oeste de Kuxtal, Barbe-Yeux endireita uma pequena estátua presa debaixo de uma pedra. Não há recompensa imediata (a estatueta chega no pós-jogo).</li><li><strong>Conquistas</strong>:<ul><li>\"Taverna?\" é desbloqueada no começo dos créditos finais, se você tiver as cinco conquistas de fim dos capítulos 1 a 5. O capítulo 6 não tem uma conquista própria.</li><li>\"Um homem iluminado\": todas as tochas compradas, o que também libera o combate contra Kerwin.</li></ul></li></ul>", "id": "c6-a-ne-pas-rater", "texte": "Capítulo 6 Flagrante Imperdível Imperdível Gema vermelha (2ª gema dos Bolon Tiku) , na lareira de Kuxtal: a história não avança sem ela. Diário nº 5 (estelas de Kuxtal) e Diário de pesquisas (acampamento leste do templo). São dois dos sete diários da conquista \"Até porque eu nem sei ler\". Jade Sagrado de Kuxtal (escondido): na sala das lajes, faça a sequência 4 – 1 – 4 – 4 – 4 – 4 – 1 – 4 – 1 . Para repetir a laje 4, desça dela e suba de novo. Funciona com a porta aberta ou não. Um brilho aparece no olho da cabeça de serpente, no oeste da sala, entre a laje cinza grande e a laje verde. Pise nele para pegar o jade. Efeito: o jade não vai para o inventário; ele desbloqueia de vez uma habilidade (\"Habilidade desbloqueada: Arremesso de Pedrinha Especial\"). O Arremesso de Pedrinha dos Paspalhos passa então a causar 8 de dano mais metade da ATQ deles, menos a DEF do alvo, com uma chance em duas de ricochetear em outro inimigo. Se você não o tiver, o pregador da ponte te dá uma bronca. Se você perdê-lo: o templo desaba no fim do capítulo, mas depois o jade pode ser comprado na loja da arena de Kuxtal (1000 fichas). Acampamento oeste e Mimics : os consumíveis e o XP só ficam acessíveis durante o capítulo. Depois da fuga, o templo fica fechado (\"Tudo desabou, impossível voltar lá.\"). Ponto sem volta : a porta de cima do acampamento de piratas. Depois dela, é impossível sair do vulcão, a não ser pelo brilho azul do fim da ponte depois de uma derrota contra Camazotz. A raposa esculpida (opcional): no oeste de Kuxtal, Barbe-Yeux endireita uma pequena estátua presa debaixo de uma pedra. Não há recompensa imediata (a estatueta chega no pós-jogo). Conquistas : \"Taverna?\" é desbloqueada no começo dos créditos finais, se você tiver as cinco conquistas de fim dos capítulos 1 a 5. O capítulo 6 não tem uma conquista própria. \"Um homem iluminado\": todas as tochas compradas, o que também libera o combate contra Kerwin.", "sol": 0}]}]}], "ja": [{"id": "c6", "num": "第6章", "titre": "現行犯", "intro": "<p>ズニッピーと改名したカニの王が一味に加わりました。イツェルを見つけ出し、ナダイヤックがボロン・ティクの扉を開くのを阻止しなければなりません。道は牢獄の独房を経て、失われた島クシュタルへ、そして火山の島の地下に埋もれた神殿へと続きます。</p><aside class=\"note\"><p>注：タイトルカード「第6章 — 現行犯」が表示されるのは、逮捕のときです。下の最初の2つの目標は、その前に進めます。</p></aside>", "sections": [{"titre": "メインクエスト", "intro": "", "entrees": [{"titre": "作戦を練る（カニ島の酒場で）。", "html": "<ol><li>カニの王を仲間にしたあと、カニ島の酒場に入ります。</li><li>自動シーン：バルブ・ユー、ポンコツ二人組、ズニッピーが状況を整理します。バルブ・ユーは、ナッソーの古株の囚人（「おもらしのにおいがする」あの人）がクシュタルの出身だと気づきます。</li><li>HPとエネルギーが最大まで回復します。新しい目標：彼と話すために逮捕されること。</li></ol>", "id": "c6-elaborer-un-plan-a-la-taverne-de-l-ile-au-crabe", "texte": "第6章 現行犯 メインクエスト 作戦を練る（カニ島の酒場で）。 カニの王を仲間にしたあと、カニ島の酒場に入ります。 自動シーン：バルブ・ユー、ポンコツ二人組、ズニッピーが状況を整理します。バルブ・ユーは、ナッソーの古株の囚人（「おもらしのにおいがする」あの人）がクシュタルの出身だと気づきます。 HPとエネルギーが最大まで回復します。新しい目標：彼と話すために逮捕されること。", "sol": 0}, {"titre": "逮捕される方法を見つける。", "html": "<p>手は3つあります。<strong>うまくいくのはひとつだけ：ケルウィンの店を燃やすことです。</strong></p><ol><li><strong>ナッソーの博物館の衛兵</strong>（任意、1回のみ）：昼でも夜でも、博物館の前にいるマルセルとプーリシャールに近づきます。バルブ・ユーが挑発し、戦闘になります。特徴：ポンコツ - イノシシの王が1ターン目から敵側に寝返り、ポンコツ - オリンピアンも2ターン目にそれに続きます。二人はオールで攻撃してきます（オリンピアンは絶対に外さず、イノシシの王は外すことがあります）。勝っても負けても、シーンは同じように続きます。衛兵は逮捕してくれませんが、勝てば大量のEXPがもらえます。目標は変わりません。これは見当違いの手です。</li><li><strong>酒場強盗</strong>（任意、1回のみ）：最初に入った酒場（カニ島、サル島、ナッソー、風の島）で、ちょっとした強盗シーンが起きます。誰も衛兵を呼ばず、そのあといつもの酒場のメニューが開きます。</li><li><strong>ケルウィンのたいまつ店</strong>（サル島、風の島、ナッソー）：店主に話しかけるとメニューが開きます。<ul><li>「立ち去る」：その場を去ります。次に訪れたとき、このシーンがまた始まります。</li><li>「謝ってたいまつを買う」：いつもの店になります。</li><li><strong>「全部燃やす」</strong>：店が燃え上がります。</li></ul></li></ol><p><strong>解答：</strong> ケルウィンの店で <strong>「全部燃やす」</strong> を選びます。</p><p>そのあと：</p><ul><li>第6章のタイトルカードが表示され、バルブ・ユーは独房で古株の囚人と一緒に目を覚まします。</li><li>古株の囚人は、イツェルがクシュタルの出身だと認め、島の場所をあなたの地図に書き込んでくれます。</li><li>看守が釈放してくれます。あの店は無認可だったのです。牢獄からそのままワールドマップが開きます。行き先として選べるのはクシュタルだけです。</li></ul>", "id": "c6-trouver-un-moyen-de-se-faire-arreter", "texte": "第6章 現行犯 メインクエスト 逮捕される方法を見つける。 手は3つあります。 うまくいくのはひとつだけ：ケルウィンの店を燃やすことです。 ナッソーの博物館の衛兵 （任意、1回のみ）：昼でも夜でも、博物館の前にいるマルセルとプーリシャールに近づきます。バルブ・ユーが挑発し、戦闘になります。特徴：ポンコツ - イノシシの王が1ターン目から敵側に寝返り、ポンコツ - オリンピアンも2ターン目
